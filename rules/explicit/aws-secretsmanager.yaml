# Normalizing AWS Secrets Manager into explicit edges.
# The adapter emits raw records (DescribeSecret, GetResourcePolicy) and the
# permission evaluator emits effective-permission facts; these rules translate
# them into common explicit edges. NO GetSecretValue is called during collection
# — CanReadSecret is derived from the EFFECTIVE permission, not from reading data.

rules:

  # --- Read the secret value: the primary credential-access edge ------------
  - id: aws-secretsmanager-can-read-secret
    emits: CanReadSecret
    applies_to: [aws]
    match_effective_permission:
      action: "secretsmanager:GetSecretValue"
      resource_type: "AWS::SecretsManager::Secret"
    emit:
      source: "<principal>"
      target: "<secret node>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["secretsmanager:GetSecretValue"]
      evidence_field: "effective secretsmanager:GetSecretValue on secret ARN"
      narrative: "{principal.name} can read the value of {secret.name} (secretsmanager:GetSecretValue)."
      note: >-
        BatchGetSecretValue is equivalent and should also produce this edge. The
        derived rules apply the KMS key_permission gate (CMK vs aws/secretsmanager)
        and set ACTIVE/CONDITIONAL. Recon actions (DescribeSecret, GetResourcePolicy,
        ListSecretVersionIds) do NOT return the value and must NOT emit this edge.

  # --- Recon read (no value) ------------------------------------------------
  - id: aws-secretsmanager-can-read-metadata
    emits: CanRead
    applies_to: [aws]
    match_effective_permission:
      action: "secretsmanager:DescribeSecret"
      resource_type: "AWS::SecretsManager::Secret"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<secret node>"
      permissions: ["secretsmanager:DescribeSecret"]
      narrative: "{principal.name} can read metadata of {secret.name} (secretsmanager:DescribeSecret) — no value."

  # --- Write the value: credential poisoning / tamper -----------------------
  - id: aws-secretsmanager-can-modify-value
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      action: "secretsmanager:PutSecretValue"
      resource_type: "AWS::SecretsManager::Secret"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<secret node>"
      permissions: ["secretsmanager:PutSecretValue", "secretsmanager:UpdateSecret"]
      narrative: "{principal.name} can overwrite the value of {secret.name} (secretsmanager:PutSecretValue)."

  # --- Rewrite the resource policy: self-grant / cross-account grant --------
  - id: aws-secretsmanager-can-modify-policy
    emits: CanModifyPolicy
    applies_to: [aws]
    match_effective_permission:
      action: "secretsmanager:PutResourcePolicy"
      resource_type: "AWS::SecretsManager::Secret"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<secret node>"
      permissions: ["secretsmanager:PutResourcePolicy"]
      narrative: "{principal.name} can rewrite the resource policy of {secret.name} (secretsmanager:PutResourcePolicy)."

  # --- KmsKeyId wrapping link: feeds the key_permission gate -----------------
  # Recorded as a NODE PROPERTY on the secret (encrypted_by / kms_key_id), NOT an
  # edge: no common edge has a Secret->EncryptionKey source/target set
  # (AttachedTo/LocatedIn/ContainsResourceReference all exclude Secret as source).
  # The provider-agnostic decrypt-gates-secret-read rule resolves wraps(?key,?secret)
  # from exactly this recorded property (RULE-FORMAT: "or a recorded property the
  # adapter records on the secret node"). This rule normalizes that property so the
  # key_permission gate can be evaluated.
  - id: aws-secretsmanager-wrapped-by-key
    emits: HasPolicy
    applies_to: [aws]
    match_record: {resource_type: "AWS::SecretsManager::Secret", field: "KmsKeyId"}
    where: ["KmsKeyId present (defaults to alias/aws/secretsmanager when unset)"]
    emit:
      source_type: "*"
      target_type: Policy
      source: "<secret node>"
      target: "<KMS key policy artifact for KmsKeyId (Policy node)>"
      api_source: "secretsmanager:DescribeSecret + kms:GetKeyPolicy"
      evidence_field: "KmsKeyId"
      record_property: {node: "<secret node>", key: "encrypted_by", value: "<KmsKeyId>"}
      narrative: "{secret.name} is encrypted by KMS key {key.name} (KmsKeyId); its key policy gates decrypt."
      note: >-
        Sets secret.encrypted_by / kms_key_id, consumed by wraps(?key,?secret) in
        decrypt-gates-secret-read, and links the KMS key's Policy artifact (HasPolicy,
        source ["*"]) so the evaluator can read the key policy. If KmsKeyId is the
        AWS-managed alias (alias/aws/secretsmanager) the reader needs no separate
        decrypt permission (same-account); a customer CMK makes CanReadSecret
        CONDITIONAL(key_permission).

  # --- Resource policy naming an external account: cross-account trust -------
  - id: aws-secretsmanager-resource-policy-cross-account
    emits: CrossAccountTrust
    applies_to: [aws]
    match_record: {resource_type: "AWS::SecretsManager::Secret", field: "ResourcePolicy"}
    where: ["a Principal in ResourcePolicy is in a different account than the secret"]
    emit:
      # CrossAccountTrust source set is [Account, Role, ResourcePolicy] — a Secret is
      # NOT a valid source. The trust artifact is the secret's ResourcePolicy node
      # (generic_type ResourcePolicy, node class Policy), which IS in the source set;
      # emit FROM that node, not the Secret node it belongs to. This mirrors how the
      # aws-lambda CrossAccountTrust normalization keys off the resource-policy
      # artifact rather than the function node.
      source: "<ResourcePolicy node of the secret (generic_type ResourcePolicy)>"
      target: "<external principal / account>"
      api_source: "secretsmanager:GetResourcePolicy"
      evidence_field: "ResourcePolicy.Statement[].Principal"
      narrative: "{secret.name}'s resource policy grants cross-account access to {external.name} in account {account}."
      note: >-
        Honor Deny statements, aws:PrincipalOrgID, and SourceArn conditions.
        Cross-account GetSecretValue also requires the wrapping CMK key policy to
        grant the external principal kms:Decrypt. The adapter MUST emit the source as
        the secret's ResourcePolicy artifact node (class Policy), never the Secret
        node itself — a Secret is outside the CrossAccountTrust source set.

  # --- Stored value is credentials for another principal / datastore --------
  # EVIDENCED ONLY: managed RDS/Redshift/DocDB secret, IAM access-key material,
  # a bound client secret / connection string. Never assume.
  - id: aws-secretsmanager-credentials-for
    emits: CredentialsFor
    applies_to: [aws]
    match_record: {resource_type: "AWS::SecretsManager::Secret", field: "OwningService|value_shape|binding"}
    where:
      - "the secret's stored value authenticates a specific target principal or datastore, with evidence"
    emit:
      source: "<secret node>"
      target: "<identity or Data node the credential authenticates>"
      api_source: "secretsmanager:DescribeSecret (OwningService / tags / evidenced binding)"
      evidence_field: "OwningService | managed-secret marker | bound principal"
      narrative: "{secret.name} holds credentials for {target.name}."
      note: >-
        Emit only with evidence. A rotated/disabled/deleted credential -> do NOT emit
        (the impersonation/escalation chain must not fire). A secret the identity
        merely owns is not CredentialsFor it. For a managed DB secret the target is
        the Data store; for IAM key material the target is the IAM identity.

  # --- Rotation binding: rotation Lambda -> secret --------------------------
  # ContainsResourceReference source set is [Data, Storage, Compute]; a Secret is
  # not a valid SOURCE, but the rotation Lambda (Compute/ServerlessFunction) IS —
  # so the reference is emitted FROM the rotation function TO the secret it rotates
  # (the function references/acts on the secret). The secret node also records a
  # rotation_lambda_arn property for the reverse lookup used by
  # aws-secretsmanager-rotation-execute-as.
  - id: aws-secretsmanager-rotation-binding
    emits: ContainsResourceReference
    applies_to: [aws]
    match_record: {resource_type: "AWS::SecretsManager::Secret", field: "RotationLambdaARN"}
    where: ["RotationEnabled == true and RotationLambdaARN present"]
    emit:
      target_type: "*"
      source: "<rotation Lambda function node (Compute)>"
      target: "<secret node>"
      api_source: "secretsmanager:DescribeSecret"
      evidence_field: "RotationLambdaARN"
      record_property: {node: "<secret node>", key: "rotation_lambda_arn", value: "<RotationLambdaARN>"}
      narrative: "{function.name} is the rotation Lambda for {secret.name} (RotationLambdaARN)."
      note: >-
        Recon link consumed by the Lambda execute-as derivation: controlling the
        rotation function's code yields its execution role, which holds
        GetSecretValue/PutSecretValue on this secret. The on-demand trigger
        (secretsmanager:RotateSecret) is modeled separately as the explicit CanInvoke
        edge below. Emitted Compute->Secret to honor the ContainsResourceReference
        source set.

  # --- On-demand rotation trigger: RotateSecret invokes the rotation Lambda ---
  # secretsmanager:RotateSecret forces Secrets Manager to invoke the configured
  # rotation Lambda. Modeled as CanInvoke FROM the calling Identity TO the rotation
  # ServerlessFunction (CanInvoke is nature: explicit; source [Identity], target
  # [ServerlessFunction, API, APIGateway, Workflow]). A Secret is NOT a valid
  # CanInvoke/CanTrigger source, so the edge is keyed off the principal, not the
  # secret — this replaces the incorrect "CanTrigger | Secret -> rotation Lambda"
  # claim (a Secret cannot source CanTrigger either: its source set is
  # [Identity, Messaging, Storage, Network]). The Lambda execute-as rule
  # (aws-lambda-execute-as-via-code) consumes this as its run-path optional to
  # complete CanModifyCode -> ExecutesAs -> CanExecuteAs without any duplicate emit.
  - id: aws-secretsmanager-rotate-invoke
    emits: CanInvoke
    applies_to: [aws]
    match_effective_permission:
      action: "secretsmanager:RotateSecret"
      resource_type: "AWS::SecretsManager::Secret"
    where:
      - "the secret has RotationEnabled == true and a RotationLambdaARN (resolve via the secret's rotation_lambda_arn property)"
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<rotation Lambda function node (ServerlessFunction)>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["secretsmanager:RotateSecret"]
      evidence_field: "effective secretsmanager:RotateSecret on secret ARN + DescribeSecret.RotationLambdaARN"
      narrative: "{principal.name} can force rotation of {secret.name} (secretsmanager:RotateSecret), invoking its rotation function {function.name}."
      note: >-
        Only emit when a rotation Lambda is actually configured (RotationLambdaARN
        present). RotateSecret with no configured rotation function invokes nothing.
        This is the on-demand run path; the scheduled rotation trigger already exists
        independently when RotationEnabled is true.
