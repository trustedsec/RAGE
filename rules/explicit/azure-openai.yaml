# Azure OpenAI / AI Services — Explicit normalization rules (Phase 11 — data/analytics/ML)
# ---------------------------------------------------------------------------
# Resource provider: Microsoft.CognitiveServices (kind == OpenAI | AIServices)
#
# Explicit rules normalize raw resource config into fact-level edges that feed
# both derived rules (via linchpins like credential-chains.yaml and can-control.yaml)
# and direct graph queries. These rules emit without requiring upstream edge matches.
#
# References:
#   - Provider research: /providers/azure/openai.md
#   - Derived rules: /rules/derived/azure/openai.yaml
#   - Linchpins: /rules/derived/credential-chains.yaml, /rules/derived/can-control.yaml
# ---------------------------------------------------------------------------

rules:

  # --- Account contains API keys (credential fact) ---------------------------
  # An Azure OpenAI account holds symmetric API keys when key-based auth is not
  # disabled. This is a structural fact: the keys exist at the account level.
  # Downstream rules (CanReadSecret via listKeys/action) model the capability
  # to READ these keys; this rule merely records their EXISTENCE.
  - id: azure-openai-account-contains-keys
    emits: ContainsCredential
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.CognitiveServices/accounts"
      field: "properties.disableLocalAuth"
    where:
      - "properties.disableLocalAuth != true  # key-based auth is enabled (default)"
    emit:
      source_type: GenericData
      target_type: Credential
      source: "<CognitiveServices account node>"
      target: "<Credential: account API keys (primary and secondary)>"
      api_source: "Microsoft.CognitiveServices/accounts GET (properties.disableLocalAuth)"
      evidence_field: "properties.disableLocalAuth"
      narrative: >-
        Azure OpenAI account {account.name} holds symmetric API keys (primary and
        secondary) that authenticate to all model deployments in the account. Keys
        are available because disableLocalAuth is false or unset (default behavior).
        Key-based authentication bypasses Entra RBAC data-plane role assignments.

  # --- Public endpoint exposure (network fact) --------------------------------
  # An Azure OpenAI account exposes its inference endpoint to the public internet
  # when:
  #   1. publicNetworkAccess is Enabled (or absent, which defaults to Enabled), AND
  #   2. networkAcls does not restrict to specific IPs/VNets (defaultAction != 'Deny')
  #
  # This is a config-observed structural fact with security implications.
  # Callers holding a valid account key or Entra token can reach the endpoint
  # from the public internet without a VNet foothold.
  - id: azure-openai-endpoint-public
    emits: ExposedToInternet
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.CognitiveServices/accounts"
      field: "properties.publicNetworkAccess"
    where:
      - "properties.publicNetworkAccess == 'Enabled' or properties.publicNetworkAccess absent  # defaults to Enabled"
      - "properties.networkAcls.defaultAction != 'Deny' or properties.networkAcls absent  # no blanket-deny ACL"
      - "properties.privateEndpointConnections empty or absent  # no private-endpoint-only enforcement"
    emit:
      source_type: GenericData
      target_type: AnonymousIdentity
      source: "<CognitiveServices account node>"
      target: "<AnonymousIdentity>"
      api_source: "Microsoft.CognitiveServices/accounts GET (properties.publicNetworkAccess, properties.networkAcls)"
      evidence_field: "properties.publicNetworkAccess, properties.networkAcls"
      state_logic: |
        if publicNetworkAccess == 'Enabled' AND (networkAcls absent OR networkAcls.defaultAction != 'Deny' OR no private-endpoint-only): ACTIVE
        elif publicNetworkAccess == 'Disabled' OR (networkAcls.defaultAction == 'Deny' AND privateEndpointConnections present): BLOCKED
        elif networkAcls restricts to specific IPs/VNets but not fully private: CONDITIONAL(network_reachability)
      conditions: [network_reachability]
      false_positive_note: >-
        Do NOT emit when publicNetworkAccess is Disabled or when the account
        enforces private-endpoint-only access (privateEndpointConnections present AND
        publicNetworkAccess Disabled). Also do NOT emit when networkAcls.defaultAction
        is Deny with no 0.0.0.0/0 allow-rule — that restricts to specific IPs/VNets
        only, not the open internet. The ExposedToInternet fact describes network
        reachability of the endpoint, not authentication bypass; callers still need
        a valid API key or Entra token.
      narrative: >-
        Azure OpenAI account {account.name} exposes its inference endpoint
        ({account.name}.openai.azure.com) to the public internet because
        publicNetworkAccess is Enabled and networkAcls does not enforce a deny-default
        or private-endpoint-only policy. Any caller holding a valid account key or
        Entra token can invoke model deployments from outside the VNet.

  # --- Administrative control via accounts/write action -----------------------
  # A principal with Microsoft.CognitiveServices/accounts/write on the account
  # has full control: can modify/delete the account, change network settings,
  # toggle disableLocalAuth, and manage deployments. This is a CanAdminister
  # capability that feeds the can-control.yaml linchpin for rollup to Controls.
  #
  # Note: This rule is intentionally NOT included here yet because it requires
  # matching on effective permissions (HasPermission edge), which is a derived
  # edge produced by the permission evaluator FIRST. This rule belongs in the
  # derived layer, matching the HasPermission edge. See comment in /rules/derived/azure/openai.yaml
  # for the deferred implementation.
