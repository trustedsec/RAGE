# Azure Subscriptions & Resource Groups — explicit normalization rules.
# Translate raw collected ARM records into common explicit STRUCTURAL edges:
#   Contains(Subscription -> ResourceGroup -> resource) — the walkable:false
#     administrative hierarchy that hierarchy-chains admin-inherits-down-contains
#     descends over.
#   HasPolicy(scope -> deny assignment / deny-effect policy assignment) — the
#     GUARDRAIL Policy node whose effect suppresses inherited control edges.
#   CrossTenantTrust(Subscription -> external tenant) — cross-tenant association.
# RBAC role assignments (HasRole) and the effective-permission facts the derived
# rules consume are produced by the Phase-2 identity collector / permission
# evaluator (azure/identity-escalation.yaml); NOT re-normalized here.
# Quote any scalar containing ':'.

rules:

  # --- Structural containment: management group -> subscription -------------
  - id: azure-sub-mg-contains-subscription
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Management/managementGroups/subscriptions", field: "id"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<management group node>"
      target: "<subscription node>"
      api_source: "GET /providers/Microsoft.Management/managementGroups/{mg}/descendants"
      evidence_field: "id"
      note: >-
        Emit ONLY if the management-group/org adapter has not already produced this
        Contains edge; dedupe on (Contains, mg, subscription). Included so the
        subscription tier is reachable by hierarchy-chains descent even when the MG
        adapter did not run.
      narrative: "{mg.name} contains subscription {subscription.name}."

  # --- Structural containment: subscription -> resource group --------------
  - id: azure-sub-contains-resourcegroup
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Resources/subscriptions/resourceGroups", field: "id"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<subscription node>"
      target: "<resource group node>"
      api_source: "GET /subscriptions/{id}/resourceGroups"
      evidence_field: "id"
      narrative: "{subscription.name} contains resource group {resourceGroup.name}."

  # --- Structural containment: resource group -> resource ------------------
  - id: azure-rg-contains-resource
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Resources/resources", field: "id"}
    where: ["resource id has prefix /subscriptions/{s}/resourceGroups/{rg}/providers/..."]
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<resource group node (from id prefix)>"
      target: "<resource node>"
      api_source: "GET /subscriptions/{id}/resources OR GET /subscriptions/{id}/resourceGroups/{rg}/resources"
      evidence_field: "id"
      note: >-
        Parse the RG from the resource id prefix. Emit only if the owning service
        adapter has not already produced the Contains edge; dedupe on
        (Contains, rg, resource).
      narrative: "{resourceGroup.name} contains resource {resource.name}."

  # --- Guardrail artifact: deny assignment ---------------------------------
  - id: azure-sub-deny-assignment
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Authorization/denyAssignments", field: "id"}
    emit:
      source_type: "*"
      target_type: Policy
      source: "<scope node (subscription | resourceGroup | resource)>"
      target: "<deny assignment ConditionalPolicy node>"
      api_source: "GET /{scope}/providers/Microsoft.Authorization/denyAssignments"
      evidence_field: "properties.permissions.denyActions"
      note: >-
        The deny assignment node is a Policy/ConditionalPolicy guardrail. Its
        properties.permissions[].denyActions, properties.principals,
        properties.excludePrincipals, properties.scope, and
        properties.doNotApplyToChildScopes determine WHICH inherited control edges it
        suppresses to BLOCKED. Deny assignments win over role assignments. Most are
        system-managed (isSystemProtected / created by Blueprints or Managed Apps).
      narrative: >-
        {scope.name} has deny assignment {denyAssignment.name} denying
        {value} (guardrail — suppresses matching control edges)."

  # --- Guardrail artifact: deny-effect Azure Policy assignment -------------
  - id: azure-sub-deny-policy-assignment
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Authorization/policyAssignments", field: "id"}
    where: ["referenced policy definition effect in ['deny','denyAction']"]
    emit:
      source_type: "*"
      target_type: Policy
      source: "<scope node (subscription | resourceGroup)>"
      target: "<policy assignment GenericPolicy node>"
      api_source: "GET /{scope}/providers/Microsoft.Authorization/policyAssignments"
      evidence_field: "properties.policyDefinitionId (effect deny/denyAction)"
      note: >-
        Deny-effect Azure Policy is a user-removable guardrail: a principal with
        Microsoft.Authorization/policyAssignments/write or /delete at the scope
        (Owner / Resource Policy Contributor) can remove or exempt it -> feeds
        azure-sub-modify-deny-assignment (derived).
      narrative: >-
        {scope.name} has a deny-effect Azure Policy assignment {policyAssignment.name}
        (guardrail — blocks the actions it targets)."

  # --- Cross-tenant association --------------------------------------------
  - id: azure-sub-cross-tenant-association
    emits: CrossTenantTrust
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Resources/subscriptions", field: "tenantId"}
    where: ["subscription tenantId != reference/home tenant OR an assigned principal's tenantId != subscription tenantId (B2B guest with RBAC)"]
    emit:
      source: "<subscription's home Tenant node (tenantId)>"
      target: "<external tenant / ExternalIdentity node>"
      api_source: "GET /subscriptions/{id}  (tenantId) ; roleAssignments principalId tenant resolution"
      evidence_field: "tenantId"
      note: >-
        CrossTenantTrust source set (schema/edges.yaml) is [Tenant, ApplicationIdentity]
        and target [Tenant, ExternalIdentity] — source the subscription's HOME TENANT
        node, NOT the Subscription boundary node, to stay within the declared set. Feeds
        derived azure-sub-cross-tenant-transfer. Distinguish the rare billing/directory
        transfer (CONDITIONAL, consent-gated) from the common B2B-guest-with-RBAC case
        (ordinary cross-tenant assignment).
      narrative: >-
        The tenant owning subscription {subscription.name} trusts external tenant
        {external.name} (cross-tenant association / B2B principal with RBAC)."
