# Azure Management Groups — explicit normalization rules.
# Translate raw collected Microsoft.Management/managementGroups config + the ARM
# authorization records at MG scope into common explicit edges. This file supplies
# THE HIERARCHY BACKBONE (Contains) that Phase-3 descent depends on, plus the
# guardrail Policy artifacts (HasPolicy) and the effective-permission facts
# (HasPermission) that feed /rules/derived/azure/mgmtgroups.yaml.
#
# Contains is STRUCTURAL / walkable:false (schema/edges.yaml) — it is inventory,
# not a path; hierarchy-chains.yaml derives the traversable descent from it.
# Effective ARM permissions at MG scope are resolved by the permission evaluator
# (match_effective_permission), not raw config, because they depend on resolving
# role assignments (built-in + custom) at and above the MG scope.

rules:

  # --- Structural: MG contains child MG -------------------------------------
  - id: azure-mg-contains-child-mg
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Management/managementGroups", field: "properties.children[].type == Microsoft.Management/managementGroups"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<parent management group node>"
      target: "<child management group node>"
      api_source: "Microsoft.Management/managementGroups GET ?$expand=children&$recurse=true | getEntities"
      evidence_field: "properties.children[].id"
      narrative: "{parent.name} contains child management group {child.name}."

  # --- Structural: MG contains subscription ---------------------------------
  - id: azure-mg-contains-subscription
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Management/managementGroups", field: "properties.children[].type == /subscriptions"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<management group node>"
      target: "<subscription node>"
      api_source: "Microsoft.Management/managementGroups GET ?$expand=children | getEntities"
      evidence_field: "properties.children[].id"
      note: >-
        The managementGroups/subscriptions association. New subscriptions default under the
        root MG. Contains is walkable:false — hierarchy-chains.yaml admin-inherits-down-contains
        performs the traversable descent.
      narrative: "{mg.name} contains subscription {subscription.name}."

  # --- Root MG marker (ID == tenant ID) -------------------------------------
  - id: azure-mg-root-tenant-link
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Management/managementGroups", field: "properties.details.parent == null"}
    where: ["management group id == Entra tenant id (root Tenant Root Group)"]
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<tenant node>"
      target: "<root management group node>"
      api_source: "Microsoft.Management/managementGroups GET | getEntities"
      evidence_field: "id"
      note: >-
        The root MG (display name 'Tenant Root Group') has ID == Entra tenant ID and no
        parent; it is the tenant control root. Anything assigned here applies to the entire
        directory. Modeled as Tenant Contains rootMG so descent from the tenant reaches all MGs.
      narrative: "Tenant {tenant.name} contains the root management group {rootmg.name} (ID == tenant ID)."

  # --- Guardrail: Azure Policy assignment at MG scope -----------------------
  - id: azure-mg-policy-assignment-artifact
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Authorization/policyAssignments", field: "properties.scope == managementGroup"}
    emit:
      source_type: "*"
      target_type: Policy
      source: "<management group node>"
      target: "<Azure Policy assignment Policy node (OrganizationPolicy subtype)>"
      api_source: "Microsoft.Authorization/policyAssignments list at MG scope"
      evidence_field: "properties.policyDefinitionId"
      note: >-
        Inherits down the whole subtree; owners of descendants cannot bypass it. A deny-effect
        assignment suppresses the create/write actions it denies -> those edges BLOCKED. Feeds
        derived azure-mg-modify-policy-guardrail + hierarchy-chains guardrail-removal-upgrades-blocked.
      narrative: "{mg.name} has Azure Policy assignment {policy.name} (inherits to the subtree)."

  # --- Guardrail: deny assignment at MG scope (usually system-managed) ------
  - id: azure-mg-deny-assignment-artifact
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Authorization/denyAssignments", field: "properties.scope == managementGroup"}
    emit:
      source_type: "*"
      target_type: Policy
      source: "<management group node>"
      target: "<deny assignment Policy node (ConditionalPolicy subtype)>"
      api_source: "Microsoft.Authorization/denyAssignments list at MG scope (api-version 2018-07-01-preview+)"
      evidence_field: "properties.permissions[].notActions | properties.scope"
      note: >-
        Deny assignments OVERRIDE Allow role assignments -> BLOCKED edges. At MG scope almost
        always system-managed (Blueprints / Managed Apps) and NOT directly user-writable;
        realistic removal is deleting the owning assignment or the move-out reparent.
      narrative: "{mg.name} has deny assignment {deny.name} overriding role assignments in the subtree."

  # --- Effective ARM permission facts at MG scope (feed derived rules) ------
  # Owner (or custom role) carrying both mgmt-group + Authorization actions.
  - id: azure-mg-eff-owner
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Authorization/roleAssignments/write"
      resource_type: "Microsoft.Management/managementGroups"
    where: ["principal effectively holds Owner or User Access Administrator (or custom role with roleAssignments/write) at the MG scope"]
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<management group node>"
      api_source: "roleAssignments evaluation at MG scope (atScope + inherited from parents)"
      permissions: ["Microsoft.Authorization/roleAssignments/write"]
      note: >-
        ONLY Owner and User Access Administrator hold roleAssignments/write. Contributor /
        Management Group Contributor do NOT. Feeds derived azure-mg-roleassignment-write /
        azure-mg-owner-admin.
      narrative: "{principal.name} can assign RBAC at management group {mg.name} (Owner / User Access Administrator)."

  - id: azure-mg-eff-write
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Management/managementGroups/write"
      resource_type: "Microsoft.Management/managementGroups"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<management group node>"
      api_source: "roleAssignments evaluation at MG scope"
      permissions: ["Microsoft.Management/managementGroups/write"]
      note: "Create/rename/reparent MGs. Held by Owner, Contributor, Management Group Contributor. Feeds derived azure-mg-reparent."
      narrative: "{principal.name} can write management group {mg.name} (create/rename/reparent)."

  - id: azure-mg-eff-subscriptions-write
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Management/managementGroups/subscriptions/write"
      resource_type: "Microsoft.Management/managementGroups"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<management group node>"
      api_source: "roleAssignments evaluation at MG scope"
      permissions: ["Microsoft.Management/managementGroups/subscriptions/write"]
      note: "Associate/move a subscription under an MG. Feeds derived azure-mg-move-sub-into-controlled-mg."
      narrative: "{principal.name} can associate subscriptions with management group {mg.name}."

  - id: azure-mg-eff-policy-write
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Authorization/policyAssignments/write"
      resource_type: "Microsoft.Management/managementGroups"
    where: ["principal effectively holds Owner or Resource Policy Contributor at the MG scope"]
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<management group node>"
      api_source: "roleAssignments evaluation at MG scope"
      permissions: ["Microsoft.Authorization/policyAssignments/write", "Microsoft.Authorization/policyDefinitions/write"]
      note: "Write/remove Azure Policy guardrails at MG. Owner / Resource Policy Contributor. Feeds derived azure-mg-modify-policy-guardrail."
      narrative: "{principal.name} can write Azure Policy assignments at management group {mg.name}."
