# AWS Bedrock — Explicit normalization rules (Phase 11 — data/analytics/ML)
# ---------------------------------------------------------------------------
# Normalization of Bedrock resource configurations to structured edges.
# These rules extract ExecutesAs, CanPassIdentity, CanModifyConfiguration,
# CanTrigger, and CanInvoke edges from Bedrock API responses.
#
# All rules are provider-specific (AWS) and emit common edge types.
# No derived rules live in this file — derived rules are in
# /rules/derived/aws/bedrock.yaml.
# ---------------------------------------------------------------------------

provider: aws
applies_to: [aws]

explicit_rules:

  - id: aws-bedrock-agent-executes-as
    emits: ExecutesAs
    applies_to: [aws]
    match_record:
      resource_type: "AWS::Bedrock::Agent"
      field: "agentResourceRoleArn"
    emit:
      source: "<Agent node>"
      target: "<Role node for agentResourceRoleArn>"
      api_source: "bedrock:GetAgent"
      evidence_field: "agentResourceRoleArn"
      narrative: "Bedrock Agent {agent.name} orchestrates its loop as {role.name} (agentResourceRoleArn)."

  # NOTE: Explicitly NOT emitting Agent->Lambda invocation edge.
  # CanTrigger source must be [Identity, Messaging, Storage, Network] per schema;
  # an Agent (GenericCompute) cannot emit CanTrigger to a Lambda.
  # ExecutesAs target must be an Identity, not a compute resource.
  # The Agent's configured Lambda ARN is captured in CanModifyConfiguration
  # when a principal can modify the Agent; the Lambda invocation path is
  # implicitly captured through the principal's CanTrigger(Agent) combined with
  # the principal's ability to modify the Agent's configuration.
  #
  # If in the future the schema adds Compute->Compute invocation support,
  # this rule can emit that relationship.

  - id: aws-bedrock-agent-update-config
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:UpdateAgent"
      resource_type: "AWS::Bedrock::Agent"
    emit:
      source_type: Identity
      target_type: GenericCompute
      source: "<principal>"
      target: "<Agent node>"
      permissions: ["bedrock:UpdateAgent"]
      narrative: "{principal.name} can modify the configuration of Bedrock Agent {agent.name} (bedrock:UpdateAgent)."

  - id: aws-bedrock-action-group-update-config
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:UpdateAgentActionGroup"
      resource_type: "AWS::Bedrock::Agent"
    emit:
      source_type: Identity
      target_type: GenericCompute
      source: "<principal>"
      target: "<Agent node>"
      permissions: ["bedrock:UpdateAgentActionGroup"]
      narrative: "{principal.name} can modify action groups of Bedrock Agent {agent.name} (bedrock:UpdateAgentActionGroup)."

  - id: aws-bedrock-invoke-agent
    emits: CanTrigger
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock-agent-runtime:InvokeAgent"
      resource_type: "AWS::Bedrock::AgentAlias"
    emit:
      source_type: Identity
      target_type: Compute
      source: "<principal>"
      target: "<Agent GenericCompute node>"
      permissions: ["bedrock-agent-runtime:InvokeAgent"]
      note: >-
        Emitted as CanTrigger (source: Identity, target: Compute/GenericCompute) with
        source_type and target_type declared for conformance. CanTrigger's source set
        includes Identity and target set includes Compute (GenericCompute is a Compute
        subtype), making this emission conformant.
      narrative: "{principal.name} can trigger Bedrock Agent {agent.name} via InvokeAgent (bedrock-agent-runtime:InvokeAgent), initiating its orchestration loop and action-group Lambda calls."

  - id: aws-bedrock-pass-role-agent
    emits: CanPassIdentity
    applies_to: [aws]
    match_effective_permission:
      action: "iam:PassRole"
      condition: "iam:PassedToService == bedrock.amazonaws.com"
    emit:
      source_type: Identity
      target_type: Role
      source: "<principal>"
      target: "<Role node>"
      permissions: ["iam:PassRole"]
      narrative: "{principal.name} can pass {role.name} to the Bedrock service (iam:PassRole for bedrock.amazonaws.com), enabling it to be set as an Agent execution role."

  # Additional explicit rules for Knowledge Base and Model Import service roles
  - id: aws-bedrock-knowledge-base-service-role
    emits: CanPassIdentity
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:CreateKnowledgeBase"
      resource_type: "AWS::Bedrock::KnowledgeBase"
    emit:
      source_type: Identity
      target_type: Role
      source: "<principal>"
      target: "<Knowledge Base service role>"
      permissions: ["bedrock:CreateKnowledgeBase", "iam:PassRole"]
      conditions: ["iam:PassedToService == bedrock.amazonaws.com"]
      narrative: "{principal.name} can create a Bedrock Knowledge Base and pass a service role (bedrock:CreateKnowledgeBase + iam:PassRole to bedrock.amazonaws.com), enabling data-source access and vector-store write as that role."

  - id: aws-bedrock-knowledge-base-update-service-role
    emits: CanPassIdentity
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:UpdateKnowledgeBase"
      resource_type: "AWS::Bedrock::KnowledgeBase"
    emit:
      source_type: Identity
      target_type: Role
      source: "<principal>"
      target: "<Knowledge Base service role>"
      permissions: ["bedrock:UpdateKnowledgeBase", "iam:PassRole"]
      conditions: ["iam:PassedToService == bedrock.amazonaws.com"]
      narrative: "{principal.name} can update a Bedrock Knowledge Base service role (bedrock:UpdateKnowledgeBase + iam:PassRole to bedrock.amazonaws.com), enabling data-source access and vector-store write as the new role."

  - id: aws-bedrock-knowledge-base-modify-config
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:UpdateKnowledgeBase"
      resource_type: "AWS::Bedrock::KnowledgeBase"
    emit:
      source_type: Identity
      target_type: AnalyticsService
      source: "<principal>"
      target: "<Knowledge Base node>"
      permissions: ["bedrock:UpdateKnowledgeBase"]
      narrative: "{principal.name} can modify the configuration of Bedrock Knowledge Base {kb.name} (bedrock:UpdateKnowledgeBase), including data source and vector store settings."

  - id: aws-bedrock-model-import-service-role
    emits: CanPassIdentity
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:CreateModelImportJob"
      resource_type: "AWS::Bedrock::ModelImportJob"
    emit:
      source_type: Identity
      target_type: Role
      source: "<principal>"
      target: "<Model import service role>"
      permissions: ["bedrock:CreateModelImportJob", "iam:PassRole"]
      conditions: ["iam:PassedToService == bedrock.amazonaws.com"]
      narrative: "{principal.name} can create a Bedrock Model Import Job and pass a service role (bedrock:CreateModelImportJob + iam:PassRole to bedrock.amazonaws.com), enabling S3 access to model weights as that role during the import."

  # --- CanCreate edges for Bedrock workload creation ---
  # These emit CanCreate(principal, resource_type). Combined with CanPassIdentity,
  # the linchpin execute-as-via-new-workload derives CanCreateWorkloadAs -> CanExecuteAs.
  - id: aws-bedrock-create-agent
    emits: CanCreate
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:CreateAgent"
      resource_type: "AWS::Bedrock::Agent"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<AWS::Bedrock::Agent>"
      permissions: ["bedrock:CreateAgent"]
      narrative: "{principal.name} can create Bedrock Agents (bedrock:CreateAgent)."

  - id: aws-bedrock-create-knowledge-base
    emits: CanCreate
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:CreateKnowledgeBase"
      resource_type: "AWS::Bedrock::KnowledgeBase"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<AWS::Bedrock::KnowledgeBase>"
      permissions: ["bedrock:CreateKnowledgeBase"]
      narrative: "{principal.name} can create Bedrock Knowledge Bases (bedrock:CreateKnowledgeBase)."

  - id: aws-bedrock-create-model-import-job
    emits: CanCreate
    applies_to: [aws]
    match_effective_permission:
      action: "bedrock:CreateModelImportJob"
      resource_type: "AWS::Bedrock::ModelImportJob"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<AWS::Bedrock::ModelImportJob>"
      permissions: ["bedrock:CreateModelImportJob"]
      narrative: "{principal.name} can create Bedrock Model Import Jobs (bedrock:CreateModelImportJob)."
