# Azure Virtual WAN / ExpressRoute / VPN — Explicit routing facts (Phase 8 networking)
# ---------------------------------------------------------------------------
# This file contains explicit normalization rules that parse ARM resources
# into RoutesTo facts. These rules feed derived attack-path rules in
# /rules/derived/azure/vwan.yaml.
#
# Permissions are exact operation strings from the Azure resource-provider operations
# reference (Microsoft.Network), verified 2026-09.
# ---------------------------------------------------------------------------

provider: azure
phase: 8-networking
applies_to: [azure]

rules:

  # ===========================================================================
  # EXPLICIT ROUTING FACTS: parsed from ARM resources
  # ===========================================================================

  # Rule 1: Hub VNet connection routing fact
  - id: azure-vwan-hub-vnet-connection-record
    emits: RoutesTo
    description: >-
      An active hub VNet connection (hubVirtualNetworkConnections, provisioningState=Succeeded)
      is an explicit routing fact: the Virtual Hub routes traffic to and from the connected
      spoke VNet.
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Network/virtualHubs/hubVirtualNetworkConnections"
      field: "properties"
    where:
      - "properties.provisioningState == 'Succeeded'"
      - "properties.remoteVirtualNetwork.id is non-null"
    emit:
      source_type: TransitGateway
      target_type: VirtualNetwork
      source: "<parent Virtual Hub node>"
      target: "<VirtualNetwork node resolved from properties.remoteVirtualNetwork.id>"
      api_source: "Microsoft.Network/virtualHubs/hubVirtualNetworkConnections GET"
      evidence_field: "properties.remoteVirtualNetwork.id + properties.provisioningState"
      state_logic: >-
        ACTIVE when provisioningState == Succeeded AND the parent hub provisioningState == Succeeded
        AND the spoke VNet node is confirmed in collected inventory.
        CONDITIONAL(region_or_boundary) when the spoke VNet is in a subscription not in collection scope
        (cross-subscription hub connection).
        NOT emitted when provisioningState is Deleting, Failed, or Updating.
      narrative: "Hub {hub.name} has an active spoke connection to VNet {vnet.name} (provisioningState: Succeeded)."
      derived_from: []  # Base explicit rule: parsed directly from ARM resource, not derived from other edges

  # Rule 2: S2S VPN connection routing fact
  - id: azure-vwan-vpn-connection-record
    emits: RoutesTo
    description: >-
      An active S2S VPN connection (vpnConnections, connectionStatus=Connected) is an explicit
      routing fact: the Virtual Hub routes traffic to and from the on-premises branch via the
      VPN tunnel.
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Network/vpnGateways/vpnConnections"
      field: "properties"
    where:
      - "properties.connectionStatus == 'Connected'"
    emit:
      source_type: TransitGateway
      target_type: VPN
      source: "<Virtual Hub that owns the parent vpnGateway>"
      target: "<VPN Site node resolved from properties.remoteVpnSite.id>"
      api_source: "Microsoft.Network/vpnGateways/vpnConnections GET"
      evidence_field: "properties.connectionStatus + properties.remoteVpnSite.id"
      state_logic: >-
        ACTIVE when connectionStatus == Connected (IKEv2 SA is UP).
        CONDITIONAL(network_reachability) when connectionStatus is Connecting or Unknown (tunnel
        negotiating; may not carry traffic yet).
        NOT emitted for connectionStatus == NotConnected or Failed.
      narrative: "Hub {hub.name} has an active S2S VPN tunnel to branch {vpnSite.name} (connectionStatus: Connected)."
      derived_from: []  # Base explicit rule: parsed directly from ARM resource, not derived from other edges

  # Rule 3: ExpressRoute connection routing fact
  - id: azure-vwan-er-connection-record
    emits: RoutesTo
    description: >-
      An active ExpressRoute connection (expressRouteConnections, provisioningState=Succeeded)
      is an explicit routing fact: the Virtual Hub routes traffic to and from the on-premises
      network via the ExpressRoute circuit.

      NOTE — Semantic Extension: RoutesTo normally targets [Network, Subnet]. On-premises
      networks may not exist as discrete nodes in the collected inventory if they are not
      explicitly modeled as Network nodes. In this case, the target is the ExpressRoute Circuit
      (TransitGateway) representing the on-premises reachability point. The network-chains
      linchpin must handle TransitGateway targets of RoutesTo as a special case distinct from
      Network/Subnet targets, treating them as proxies for external networks.
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Network/expressRouteGateways/expressRouteConnections"
      field: "properties"
    where:
      - "properties.provisioningState == 'Succeeded'"
      - "properties.expressRouteCircuitPeering.id is non-null"
    emit:
      source_type: TransitGateway
      target_type: TransitGateway
      source: "<Virtual Hub that owns the parent expressRouteGateway>"
      target: "<ExpressRoute Circuit node resolved from properties.expressRouteCircuitPeering.id>"
      api_source: "Microsoft.Network/expressRouteGateways/expressRouteConnections GET"
      evidence_field: "properties.provisioningState + properties.expressRouteCircuitPeering.id"
      state_logic: >-
        ACTIVE when expressRouteConnections.provisioningState == Succeeded AND the circuit's
        serviceProviderProvisioningState == Provisioned (both sides provisioned).
        CONDITIONAL(region_or_boundary) if circuit-side state is not confirmed in inventory
        (ER circuit may be in a different subscription or not collected).
        NOT emitted for provisioningState != Succeeded.
      narrative: "Hub {hub.name} has an active ExpressRoute connection to circuit {erCircuit.name} (provisioningState: Succeeded)."
      derived_from: []  # Base explicit rule: parsed directly from ARM resource, not derived from other edges

  # ===========================================================================
  # ADMINISTRATIVE CONTROL
  # ===========================================================================

  - id: azure-vwan-contributor
    emits: CanAdminister
    description: >-
      Write access to the Virtual WAN or Virtual Hub object (virtualWans/write or
      virtualHubs/write, both included in Network Contributor) grants full control of the
      vWAN topology, all hub connections, route tables, gateways, and routing policy.
    applies_to: [azure]
    match_effective_permission:
      any_of:
        - action: "Microsoft.Network/virtualWans/write"
          scope_type: "resource|resourceGroup|subscription"
        - action: "Microsoft.Network/virtualHubs/write"
          scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds Network Contributor / Contributor / Owner at the vWAN,
         hub, containing RG, or subscription scope"
    emit:
      source_type: Identity
      target_type: TransitGateway
      source: "<principal>"
      target: "<Virtual WAN or Virtual Hub (TransitGateway node)>"
      permissions:
        - "Microsoft.Network/virtualWans/write"
        - "Microsoft.Network/virtualHubs/write"
      state_logic: ACTIVE
      false_positive_note: >-
        CanAdminister on a vWAN/hub grants config control (connections, routes, gateways,
        routing intent) but NOT Microsoft.Authorization/*/write; it does not allow RBAC
        self-assignment. CanAdminister → Controls is derived by can-control.yaml (cited,
        not duplicated here). Network Contributor at RG scope grants write on all
        Microsoft.Network resources including vWAN and hub objects; verify effective scope.
      narrative: >-
        {principal.name} has full administrative control of {target.name}
        (Microsoft.Network/virtualWans/write or virtualHubs/write), including all hub VNet
        connections, VPN and ExpressRoute gateways, route tables, and routing intent policies.
      derived_from: []  # Base explicit rule: parsed directly from ARM effective permissions
