# Azure — Log Analytics & Sentinel (Explicit Normalization Rules)
# ===========================================================================
# Explicit rules: structural normalization + configuration facts.
# These rules parse configuration snapshots and emit node definitions and
# relationships that are OBSERVED, not derived.
#
# The primary ExecutesAs rules (Sentinel playbooks = Logic Apps) are hosted
# in /rules/explicit/azure-logicapps.yaml because playbooks ARE Logic Apps.
# These rules cover:
#   - LocatedIn relationships (workspaces, rules, resources -> resource group)
#   - CanTrigger structural facts (automation rules -> playbooks)
#   - CanExfiltrate on enabled data exports (workspace -> sink when enabled & writable)
# ===========================================================================

provider: azure
phase: 12-security-logging
applies_to: [azure]

rules:

  - id: azure-siem-workspace-locatedin
    emits: LocatedIn
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.OperationalInsights/workspaces"
      field: "resourceGroup"
    emit:
      source_type: LoggingService
      target_type: ResourceGroup
      source: "<Log Analytics workspace (LoggingService)>"
      target: "<ResourceGroup (AdministrativeBoundary)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.OperationalInsights/workspaces"
      evidence_field: "id (parse resourceGroup segment)"
      narrative: "Log Analytics workspace {source.name} is located in resource group {target.name}."

  - id: azure-siem-sentinel-node-locatedin
    emits: LocatedIn
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.SecurityInsights/alertRules"
      field: "name"
    where:
      - "alertRule is scoped under a Microsoft.OperationalInsights/workspaces/{workspace} provider path"
    emit:
      source_type: SecurityService
      target_type: ResourceGroup
      source: "<Sentinel analytics rule (SecurityService)>"
      target: "<ResourceGroup of the parent workspace (AdministrativeBoundary)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.OperationalInsights/workspaces/{workspace}/providers/Microsoft.SecurityInsights/alertRules"
      evidence_field: "id (parse resourceGroup segment)"
      narrative: "Sentinel analytics rule {source.name} is located in resource group {target.name} (co-located with its parent workspace)."

  - id: azure-siem-automation-rule-playbook-ref
    emits: CanTrigger
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.SecurityInsights/automationRules"
      field: "properties.actions"
    where:
      - "action.actionType == RunPlaybook"
      - "action.actionConfiguration.logicAppResourceId is non-empty"
    emit:
      source_type: EventRule
      target_type: Workflow
      source: "<Sentinel automation rule (modeled as EventRule — a Messaging subtype)>"
      target: "<Logic App playbook (Workflow) at action.actionConfiguration.logicAppResourceId>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.OperationalInsights/workspaces/{workspace}/providers/Microsoft.SecurityInsights/automationRules"
      evidence_field: "actions[*].actionConfiguration.logicAppResourceId"
      narrative: "Sentinel automation rule {source.name} triggers playbook {target.name} (RunPlaybook action) when its incident/alert trigger conditions are met."

  - id: azure-siem-data-export-active-to-sink
    emits: CanExfiltrate
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.OperationalInsights/workspaces/dataExports"
      field: "properties.destination.resourceId"
    where:
      - "properties.enabled == true"
      - "workspace MI (from workspace identity) has EFFECTIVE write access to the sink resource (storage account or event hub)"
    emit:
      source_type: Identity
      target_type: ObjectStorage
      source: "<workspace system-assigned MI or service principal used for the data export>"
      target: "<export sink storage account (ObjectStorage) or event hub (EventBus)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.OperationalInsights/workspaces/{workspace}/dataExports"
      evidence_field: "properties.destination.resourceId + properties.enabled == true + confirmed workspace MI CanWrite on sink"
      conditions: [resource_policy]
      state_logic: >-
        ACTIVE when the export rule is enabled (properties.enabled == true) AND
        the workspace identity (MI/SP) has confirmed write access to the sink
        (resource_policy condition: sink resource policy or RBAC grants write).
        CONDITIONAL(resource_policy) if sink write access is unconfirmed.
        This rule emits CanExfiltrate directly on the sink (target: ObjectStorage/EventBus),
        modeling that data egresses from the workspace to the sink when the export is active.
      confidence: 0.92
      derived_from:
        - "configuration: Microsoft.OperationalInsights/workspaces/dataExports enabled=true"
        - "structural: workspace MI/SP identity + sink write access (RBAC/policy)"
      narrative: >-
        Log Analytics workspace data export continuously sends log data to {target.name}
        (ObjectStorage/EventBus). The workspace identity (MI/SP) has write access to the sink,
        enabling data exfiltration if an attacker can redirect or hijack the export (via
        dataExports/write + sink ownership). This rule is ACTIVE when export enabled=true and
        sink is writable by the workspace identity.
