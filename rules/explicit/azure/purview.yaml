# Azure — Microsoft Purview (Microsoft.Purview) explicit normalization rules (Phase 12)
# ---------------------------------------------------------------------------
# PHASE-12 SERVICE ADAPTER: Microsoft Purview is a data governance and catalog
# service. These rules normalize Purview RBAC role assignments (collected from the
# Purview policyElements API) into explicit edges that feed derived attack-path rules.
#
# KEY EXPLICIT EDGES:
#   (1) Role Assignment → HasRole: Purview data-plane role assignments (Data Reader,
#       Data Curator, Data Source Administrator, Collection Admin) collected via the
#       Purview REST API (/atlas/v2/policyElements) are materialized as HasRole edges.
#   (2) HasRole + effective-permission match → CanRead: A principal with Data Reader
#       (or higher) role can enumerate all catalog assets, classifications, and scan
#       results via the Purview REST API.
#
# LINCHPINS CITED: credential-chains (ARM control-plane owner inheriting data-plane
# Collection Admin role).
#
# All operation strings from the official Microsoft.Purview resource-provider
# operations reference and Purview data-plane API documentation. No hallucinated
# permissions.
# ---------------------------------------------------------------------------

provider: azure
phase: 12-security-logging
applies_to: [azure]

rules:

  # ===========================================================================
  # 1. Explicit normalization: Purview Data Reader role assignment → HasRole
  # ===========================================================================

  - id: azure-purview-data-reader-role-assignment
    emits: HasRole
    description: >-
      A principal is assigned the Purview Data Reader role within a Purview account.
      This assignment is visible via the Purview REST API policyElements endpoint and
      materializes an explicit HasRole edge (Identity -> Role). The principal can read
      catalog assets, classifications, and scan results (data-plane access).
    applies_to: [azure]
    source_config:
      collector: "purview-policyElements-api"
      api_endpoint: "{purviewEndpoint}/catalog/api/policyElements"
      field: "roles"
    where:
      - "role.name == 'Data Reader'"
      - "principalId is non-null"
      - "policyElements.purviewAccountId is non-null"
    emit:
      source_type: Identity
      target_type: Role
      source: "<Identity node for the principal (from principalId)"
      target: "<Role node representing 'Purview Data Reader' scoped to {purviewAccountId}>"
      api_source: "Purview policyElements API: GET {account}/catalog/api/policyElements"
      evidence_field: "roles[].name, principalId, accountId"
      state_logic: >-
        ACTIVE when the Purview account is provisioned and the role assignment is
        confirmed in policyElements. CONDITIONAL(service_state) when the account is
        in a transient state (Creating, Updating) — assignment is visible but may not
        be functional.
      narrative: >-
        {principal.name} holds the Purview Data Reader role on Purview account
        {account.name} (assigned via Purview RBAC, visible in policyElements).
      derived_from: []

  # ===========================================================================
  # 2. Explicit normalization: Purview Data Curator role assignment → HasRole
  # ===========================================================================

  - id: azure-purview-data-curator-role-assignment
    emits: HasRole
    description: >-
      A principal is assigned the Purview Data Curator role within a Purview account.
      Data Curator allows read and write access to catalog assets, classifications,
      and glossary terms (data-plane write access).
    applies_to: [azure]
    source_config:
      collector: "purview-policyElements-api"
      api_endpoint: "{purviewEndpoint}/catalog/api/policyElements"
      field: "roles"
    where:
      - "role.name == 'Data Curator'"
      - "principalId is non-null"
      - "policyElements.purviewAccountId is non-null"
    emit:
      source_type: Identity
      target_type: Role
      source: "<Identity node for the principal>"
      target: "<Role node representing 'Purview Data Curator' scoped to {purviewAccountId}>"
      api_source: "Purview policyElements API"
      evidence_field: "roles[].name, principalId, accountId"
      state_logic: "ACTIVE when the account is provisioned and role assignment confirmed."
      narrative: >-
        {principal.name} holds the Purview Data Curator role on Purview account
        {account.name}.
      derived_from: []

  # ===========================================================================
  # 3. Explicit normalization: Purview Collection Admin role assignment → HasRole
  # ===========================================================================

  - id: azure-purview-collection-admin-role-assignment
    emits: HasRole
    description: >-
      A principal is assigned the Purview Collection Admin role within a Purview account.
      Collection Admin allows managing collections and assigning Purview RBAC roles to
      other principals within the account (data-plane administrative capability).
    applies_to: [azure]
    source_config:
      collector: "purview-policyElements-api"
      api_endpoint: "{purviewEndpoint}/catalog/api/policyElements"
      field: "roles"
    where:
      - "role.name == 'Collection Admin' OR role.name == 'Root Collection Admin'"
      - "principalId is non-null"
      - "policyElements.purviewAccountId is non-null"
    emit:
      source_type: Identity
      target_type: Role
      source: "<Identity node for the principal>"
      target: "<Role node representing 'Collection Admin' or 'Root Collection Admin' scoped to {purviewAccountId}>"
      api_source: "Purview policyElements API"
      evidence_field: "roles[].name, principalId, accountId"
      state_logic: "ACTIVE when the account is provisioned and role assignment confirmed."
      narrative: >-
        {principal.name} holds the Purview Collection Admin role on Purview account
        {account.name}, enabling them to manage collections and assign Purview RBAC
        roles.
      derived_from: []

  # ===========================================================================
  # 4. Explicit normalization: Purview Data Source Administrator role → HasRole
  # ===========================================================================

  - id: azure-purview-data-source-admin-role-assignment
    emits: HasRole
    description: >-
      A principal is assigned the Purview Data Source Administrator role.
      Data Source Admin manages scan credentials, data sources, and integration
      runtimes (data-plane operational capability, includes write permissions).
    applies_to: [azure]
    source_config:
      collector: "purview-policyElements-api"
      api_endpoint: "{purviewEndpoint}/catalog/api/policyElements"
      field: "roles"
    where:
      - "role.name == 'Data Source Administrator'"
      - "principalId is non-null"
      - "policyElements.purviewAccountId is non-null"
    emit:
      source_type: Identity
      target_type: Role
      source: "<Identity node for the principal>"
      target: "<Role node representing 'Data Source Administrator' scoped to {purviewAccountId}>"
      api_source: "Purview policyElements API"
      evidence_field: "roles[].name, principalId, accountId"
      state_logic: "ACTIVE when the account is provisioned and role assignment confirmed."
      narrative: >-
        {principal.name} holds the Purview Data Source Administrator role on Purview
        account {account.name}, enabling scan credential and data source management.
      derived_from: []

  # ===========================================================================
  # 5. Explicit normalization: ARM Owner/Contributor → inherits Root Collection Admin
  # ===========================================================================

  - id: azure-purview-arm-owner-to-collection-admin
    emits: HasRole
    description: >-
      An identity with ARM Contributor or Owner permission on a Microsoft.Purview/accounts
      resource is automatically granted the Purview Root Collection Admin role within
      the account at creation. This is an ARM control-plane to Purview data-plane
      escalation: ARM admin authority over the account resource carries over to
      data-plane administrative capability. Per Microsoft documentation, the account
      creator is assigned Root Collection Admin in Purview, enabling role assignment
      and privilege escalation within the Purview scope.
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Purview/accounts"
      field: "properties"
    match_effective_permission:
      action: "Microsoft.Purview/accounts/write"
      scope_type: "purview-account"
    where:
      - "principal has effective permission Microsoft.Purview/accounts/write (Contributor or Owner on account)"
      - "Purview account properties.creationTime is populated (account is provisioned)"
    emit:
      source_type: Identity
      target_type: Role
      source: "<Identity with ARM Contributor/Owner on the Purview account>"
      target: "<Role node representing 'Root Collection Admin' scoped to the Purview account>"
      api_source: "ARM effective-permission evaluator + Purview documentation"
      evidence_field: "ARM roleAssignment (Contributor/Owner on Microsoft.Purview/accounts) + account.creationTime"
      state_logic: >-
        ACTIVE when the principal holds ARM Contributor or Owner on the Purview account
        resource AND the account is provisioned (creationTime is set). The Root Collection
        Admin role is immediately assigned at account creation; no separate Purview RBAC
        collection is needed.
      conditions: [iam_permission]
      confidence: 0.95
      narrative: >-
        {principal.name} holds ARM Contributor/Owner on Purview account {account.name}.
        Per Microsoft Purview documentation, this automatically grants Root Collection
        Admin role within the Purview data-plane, enabling role assignment and privilege
        escalation within the account.
      derived_from: []  # Base explicit rule: ARM effective-permission match normalizes to Purview RBAC role

  # ===========================================================================
  # 6. Explicit CanRead normalization: Purview Data Reader (or higher) role
  #    + network reachability → CanRead
  # ===========================================================================

  - id: azure-purview-catalog-read
    emits: CanRead
    description: >-
      A principal holding Purview Data Reader (or higher-privilege roles: Data Curator,
      Data Source Administrator, Collection Admin) with network reachability to the
      Purview account can enumerate all catalog assets, classifications, scan results,
      and data lineage via the Purview REST API, enabling reconnaissance of sensitive
      data sources and classifications across the organization.
    applies_to: [azure]
    match_effective_permission:
      # Match on the cascading set of roles that include Data Reader capability
      # (Data Reader, Data Curator, Data Source Admin, Collection Admin all include read)
      roles: ["Data Reader", "Data Curator", "Data Source Administrator", "Collection Admin", "Root Collection Admin"]
      scope_type: "purview-account"
      source: "Purview policyElements API (data-plane role assignments)"
    where:
      - "principal holds HasRole(Identity, Purview Data Reader role) OR HasRole(Identity, Data Curator/Admin/Collection Admin role)"
      - "Purview account publicNetworkAccess is not Disabled, OR principal has network access to the private endpoint"
      - "Purview account provisioningState == Succeeded"
    emit:
      source_type: Identity
      target_type: ConfigurationService
      source: "<principal holding Purview Data Reader or higher role>"
      target: "<Purview account (ConfigurationService, provider_type: Microsoft.Purview/accounts)>"
      permissions:
        - "Purview Data Reader (data-plane role, not ARM RBAC)"
        - "Purview Data Curator (subset; includes read)"
        - "Purview Collection Admin (subset; includes read)"
        - "Purview Root Collection Admin (subset; includes read)"
      conditions: [network_reachability]
      state_logic: >-
        ACTIVE when the principal holds Purview Data Reader (or a higher-privilege role)
        within the account AND the account catalog endpoint is reachable (publicNetworkAccess
        != Disabled, OR principal is in-network for private endpoint). CONDITIONAL(network_reachability)
        when publicNetworkAccess is Disabled — requires verified network access to the
        VNet hosting the private endpoint. BLOCKED if the account is deprovisioned
        (provisioningState != Succeeded).
      confidence: 0.85
      derived_from: ["azure-purview-data-reader-role-assignment", "azure-purview-data-curator-role-assignment", "azure-purview-collection-admin-role-assignment", "azure-purview-data-source-admin-role-assignment"]
      false_positive_note: >-
        Do NOT emit CanReadData or CanReadSecret on target data stores from this
        edge alone. Reading the Purview catalog reveals classification METADATA
        and data SOURCE locations — it does NOT grant access to the described data.
        Separate data-plane permissions on those stores are required for actual data
        access. Additionally, Purview data-plane roles are NOT visible via ARM
        Microsoft.Authorization/roleAssignments enumeration; collector must query
        the Purview RBAC API (policyElements endpoint) within the account.
        ARM Owner/Contributor on the subscription does NOT automatically grant
        Purview data-plane read — verify Purview role assignments independently.
        If publicNetworkAccess is Disabled, downgrade to CONDITIONAL(network_reachability).
      narrative: >-
        {principal.name} holds the Purview Data Reader role on Purview account
        {target.name}, enabling enumeration of all registered data sources, scan
        classification results (e.g., which storage accounts contain PII or
        credentials), and data lineage across the organization. This is a recon
        primitive: the attacker learns where high-value data lives and can target
        those data stores with separate data-plane permissions. Reading the catalog
        does NOT grant access to the data it describes.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - publicNetworkAccess=Disabled -> azure-purview-catalog-read is
#    CONDITIONAL(network_reachability), not ACTIVE, unless in-network reachability
#    to the private endpoint is confirmed.
#  - Account deprovisioned or in a failed state -> BLOCKED / not emitted.
#  - Purview Data Reader role NOT assigned (only ARM Reader on subscription) ->
#    do NOT emit; ARM Reader does not grant catalog data-plane access.
# ---------------------------------------------------------------------------
