# GCP Network Connectivity Center (NCC) — Explicit normalization rules
# ---------------------------------------------------------------------------
# These rules normalize raw NCC API records into explicit graph edges.
# They feed the derived rules in /rules/derived/gcp/ncc.yaml.
#
# Collection APIs:
#   networkconnectivity.projects.locations.global.hubs.list
#   networkconnectivity.projects.locations.global.hubs.getIamPolicy
#   networkconnectivity.projects.locations.spokes.list
#   networkconnectivity.projects.locations.spokes.getIamPolicy
#
# Minimum collector role: roles/networkconnectivity.viewer
# ---------------------------------------------------------------------------

provider: gcp
phase: 8-networking
applies_to: [gcp]

rules:

  # --- Hub node placement ---------------------------------------------------
  - id: gcp-ncc-hub-located-in-project
    emits: LocatedIn
    applies_to: [gcp]
    match_record:
      api: "networkconnectivity.projects.locations.global.hubs.list"
      resource_type: "networkconnectivity.googleapis.com/Hub"
    emit:
      source_type: TransitGateway
      target_type: Project
      source: "<NCC Hub node — node_id derived from hub.name>"
      target: "<Project node — project extracted from hub.name segment>"
      api_source: "networkconnectivity.projects.locations.global.hubs.list"
      evidence_field: "hub.name"
      narrative: >-
        {hub.name} is a Network Connectivity Center Hub (TransitGateway) located in
        project {project.name}. It forms the central routing domain for all attached
        spokes.

  # --- Spoke node placement (spoke -> hub) ----------------------------------
  - id: gcp-ncc-spoke-located-in-hub
    emits: LocatedIn
    applies_to: [gcp]
    match_record:
      api: "networkconnectivity.projects.locations.spokes.list"
      resource_type: "networkconnectivity.googleapis.com/Spoke"
    emit:
      source_type: Route
      target_type: TransitGateway
      source: "<NCC Spoke node (Route) — node_id derived from spoke.name>"
      target: "<NCC Hub node (TransitGateway) — from spoke.hub>"
      api_source: "networkconnectivity.projects.locations.spokes.list"
      evidence_field: "spoke.hub"
      narrative: >-
        {spoke.name} is an NCC Spoke (Route) attached to hub {hub.name}
        (state: {spoke.state}). Spoke type: {spoke_type}.

  # --- ACTIVE spoke creates routing fact (hub -> subnets/CIDRs) ---------------
  # VPC spokes: hub routes to all subnets in linkedVpcNetwork.uri
  - id: gcp-ncc-active-vpc-spoke-routes-to-subnet
    emits: RoutesTo
    applies_to: [gcp]
    match_record:
      api: "networkconnectivity.projects.locations.spokes.list"
      resource_type: "networkconnectivity.googleapis.com/Spoke"
      field: "state"
      value: "ACTIVE"
    where:
      - "spoke.linkedVpcNetwork.uri is set (VPC spoke)"
    emit:
      source_type: TransitGateway
      target_type: Subnet
      source: "<NCC Hub (TransitGateway) referenced by spoke.hub>"
      target: "<Subnets in the VPC identified by spoke.linkedVpcNetwork.uri (resolved via compute.subnetworks.list)>"
      api_source: "networkconnectivity.projects.locations.spokes.list + compute.subnetworks.list"
      evidence_field: "spoke.linkedVpcNetwork.uri + spoke.state=ACTIVE"
      narrative: >-
        NCC Hub {hub.name} routes to subnets in VPC {vpc.name} via ACTIVE spoke
        {spoke.name}. All other ACTIVE spokes on {hub.name} can route to these subnets,
        subject to VPC ingress/egress firewall rules in {vpc.name}.

  # VPN spokes: hub routes to on-premises CIDR prefixes announced via BGP
  - id: gcp-ncc-active-vpn-spoke-routes-to-onprem
    emits: RoutesTo
    applies_to: [gcp]
    match_record:
      api: "networkconnectivity.projects.locations.spokes.list"
      resource_type: "networkconnectivity.googleapis.com/Spoke"
      field: "state"
      value: "ACTIVE"
    where:
      - "spoke.linkedVpnTunnels[].uri is set (VPN spoke)"
    emit:
      source_type: TransitGateway
      target_type: Subnet
      source: "<NCC Hub (TransitGateway) referenced by spoke.hub>"
      target: "<CIDR ranges announced via BGP by the VPN tunnel (external on-premises networks)>"
      api_source: "networkconnectivity.projects.locations.spokes.list + compute.vpnTunnels.get"
      evidence_field: "spoke.linkedVpnTunnels[].uri + spoke.state=ACTIVE"
      narrative: >-
        NCC Hub {hub.name} routes to on-premises CIDR prefixes via ACTIVE VPN spoke
        {spoke.name}. All other ACTIVE spokes on {hub.name} can route to these
        BGP-announced prefixes, subject to on-premises firewall rules at the
        far end of the VPN tunnel.

  # Interconnect spokes: hub routes to on-premises CIDR prefixes announced via BGP
  - id: gcp-ncc-active-interconnect-spoke-routes-to-onprem
    emits: RoutesTo
    applies_to: [gcp]
    match_record:
      api: "networkconnectivity.projects.locations.spokes.list"
      resource_type: "networkconnectivity.googleapis.com/Spoke"
      field: "state"
      value: "ACTIVE"
    where:
      - "spoke.linkedInterconnectAttachments[].uri is set (Interconnect spoke)"
    emit:
      source_type: TransitGateway
      target_type: Subnet
      source: "<NCC Hub (TransitGateway) referenced by spoke.hub>"
      target: "<CIDR ranges announced via BGP by the Interconnect attachment (external on-premises networks)>"
      api_source: "networkconnectivity.projects.locations.spokes.list + compute.interconnectAttachments.get"
      evidence_field: "spoke.linkedInterconnectAttachments[].uri + spoke.state=ACTIVE"
      narrative: >-
        NCC Hub {hub.name} routes to on-premises CIDR prefixes via ACTIVE Interconnect
        spoke {spoke.name}. All other ACTIVE spokes on {hub.name} can route to these
        BGP-announced prefixes, subject to on-premises firewall rules at the far end
        of the Interconnect attachment.

  # --- Cross-project spoke attachment -> CrossProjectTrust ------------------
  - id: gcp-ncc-cross-project-spoke-trust
    emits: CrossProjectTrust
    applies_to: [gcp]
    match_record:
      api: "networkconnectivity.projects.locations.spokes.list"
      resource_type: "networkconnectivity.googleapis.com/Spoke"
      field: "hub"
    where:
      - "project(spoke.name) != project(spoke.hub)"
    emit:
      source_type: Project
      target_type: Project
      source: "<spoke Project (project segment of spoke.name)>"
      target: "<hub Project (project segment of spoke.hub)>"
      api_source: "networkconnectivity.projects.locations.spokes.list"
      evidence_field: "spoke.name (spoke project) + spoke.hub (hub project)"
      narrative: >-
        Spoke {spoke.name} in project {spoke_project.name} is attached to NCC Hub
        {hub.name} in project {hub_project.name}. These two projects share the same
        NCC routing domain, creating a cross-project network trust relationship.
        Spoke state: {spoke.state}.
