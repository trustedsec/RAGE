# Azure Firewall Normalization Rules (Phase 8 — networking)
# ---------------------------------------------------------------------------
# Raw ARM config → explicit network edges (RoutesTo, AttachedTo).
# DNAT rules are ingested as Route nodes and linked to destination Subnets.
# Public IP attachments are normalized to PublicEndpoint nodes.
#
# These rules feed the derived rules in rules/derived/azure/firewall.yaml.
# Permissions verified against Microsoft.Network operations reference (2026-09).
# ---------------------------------------------------------------------------

provider: azure
phase: 8-networking
applies_to: [azure]

rules:

  # ===========================================================================
  # RULE 1 — Ingest DNAT rules (classic model) as Route nodes
  # ===========================================================================

  - id: azure-firewall-dnat-rule-record
    emits: RoutesTo
    applies_to: [azure]
    description: >-
      Azure Firewall DNAT rule (classic natRuleCollections model) is ingested as a synthetic
      Route node encoding (firewall_id, rule_name). The route is linked to the internal
      destination subnet via RoutesTo edge.
    source_config:
      resource_type: "Microsoft.Network/azureFirewalls"
      field: "properties.natRuleCollections[].rules[]"
    where:
      - "properties.natRuleCollections[].rules[].action.type == 'Dnat'"
      - "properties.natRuleCollections[].rules[].translatedAddress is non-null and non-empty"
      - "firewall provisioningState == 'Succeeded'"
      - "translatedAddress is private RFC-1918 IP or resolvable to a Subnet in inventory"
    emit:
      source_type: Route
      target_type: Subnet
      source: "<synthetic Route node: firewall_id + rule_name>"
      target: "<Subnet containing translatedAddress>"
      api_source: "Microsoft.Network/azureFirewalls GET"
      evidence_field: >-
        natRuleCollections[].rules[].destinationAddresses +
        natRuleCollections[].rules[].destinationPorts +
        natRuleCollections[].rules[].translatedAddress +
        natRuleCollections[].rules[].translatedPort
      properties:
        source: azure_firewall_dnat
        firewall_id: "<firewall resource id>"
        rule_name: "<rule name>"
        destination_port: "<destinationPorts>"
        translated_port: "<translatedPort>"
        translated_address: "<translatedAddress>"
      narrative: >-
        Azure Firewall {firewall.name} classic DNAT rule forwards
        {destinationAddresses}:{destinationPorts} -> {translatedAddress}:{translatedPort}
        to {subnet.name}.

  # ===========================================================================
  # RULE 2 — Ingest DNAT rules (Firewall Policy model) as Route nodes
  # ===========================================================================

  - id: azure-firewall-policy-dnat-rule-record
    emits: RoutesTo
    applies_to: [azure]
    description: >-
      Azure Firewall Policy DNAT rule (firewallPolicies/ruleCollectionGroups model) is
      ingested as a synthetic Route node. The route is linked to the internal destination
      subnet via RoutesTo edge. Target is the Firewall that references this policy.
    source_config:
      resource_type: "Microsoft.Network/firewallPolicies/ruleCollectionGroups"
      field: "properties.ruleCollections[]"
    where:
      - "properties.ruleCollections[].ruleCollectionType == 'FirewallPolicyNatRuleCollection'"
      - "properties.ruleCollections[].action.type == 'Dnat'"
      - "ruleCollection has at least one rule with translatedAddress non-null and non-empty"
      - "translatedAddress is private RFC-1918 IP or resolvable to a Subnet in inventory"
    emit:
      source_type: Route
      target_type: Subnet
      source: "<synthetic Route node: policy_id + ruleCollectionGroup_name + rule_name>"
      target: "<Subnet containing translatedAddress>"
      api_source: "Microsoft.Network/firewallPolicies/ruleCollectionGroups GET"
      evidence_field: >-
        ruleCollections[].rules[].destinationAddresses +
        ruleCollections[].rules[].destinationPorts +
        ruleCollections[].rules[].translatedAddress +
        ruleCollections[].rules[].translatedPort
      properties:
        source: azure_firewall_policy_dnat
        policy_id: "<firewall policy resource id>"
        rule_collection_group: "<rule collection group name>"
        rule_name: "<rule name>"
        destination_port: "<destinationPorts>"
        translated_port: "<translatedPort>"
        translated_address: "<translatedAddress>"
      narrative: >-
        Firewall Policy {policy.name} DNAT rule collection forwards
        {destinationAddresses}:{destinationPorts} -> {translatedAddress}:{translatedPort}
        to {subnet.name}.

