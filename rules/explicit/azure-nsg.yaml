# Azure NSG — Explicit normalization rules.
# Translates raw collected Microsoft.Network/networkSecurityGroups ARM config
# and RBAC effective-permission evaluation into common explicit edges consumed
# by the derived rules in /rules/derived/azure/nsg.yaml.
#
# TWO normalization areas:
#   1. RBAC-driven control edges: securityRules/write and networkSecurityGroups/write
#      effective permissions → CanModifyConfiguration on the NSG node.
#   2. Structural association facts: NSG attached to subnet / NIC → AttachedTo.
#      These facts feed the derived azure-nsg-inbound-open and
#      azure-nsg-internet-exposed rules that require AttachedTo to identify
#      the compute resources behind the NSG.
#
# Collection APIs:
#   az network nsg list / az network nsg show
#   az network nsg rule list --nsg-name <nsg> --resource-group <rg>
#   az network nic list-effective-nsg --name <nic> --resource-group <rg>
#   ARM GET effectiveNetworkSecurityGroups on NIC (for effective rule evaluation)
#   az role assignment list --scope <nsg-resource-id>
#   az role assignment list --scope <rg-resource-id>

rules:

  # ===========================================================================
  # STRUCTURAL: NSG located in / associated with subnet
  # LocatedIn is used (not AttachedTo) because Firewall is not in AttachedTo's
  # declared source set ([NetworkInterface, BlockStorage, ManagedIdentity,
  # IAMPolicy] per schema/edges.yaml). LocatedIn accepts source="*" and
  # target=[AdministrativeBoundary, Network]; Subnet is Network class. ✓
  # ===========================================================================

  - id: azure-nsg-located-in-subnet
    emits: LocatedIn
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.Network/networkSecurityGroups"
      field: "properties.subnets[*].id"
    emit:
      source_type: Firewall
      target_type: Network
      source: "<NSG Firewall node>"
      target: "<Subnet node (Network class) referenced by properties.subnets[*].id>"
      api_source: "ARM GET /networkSecurityGroups/{name} or az network nsg show"
      evidence_field: "properties.subnets[*].id"
      narrative: "NSG {nsg.name} is associated with (located in) subnet {subnet.name}."

  # ===========================================================================
  # STRUCTURAL: NSG associated with NIC
  # LocatedIn: source="*" → Network. NetworkInterface is Network class. ✓
  # ===========================================================================

  - id: azure-nsg-located-in-nic
    emits: LocatedIn
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.Network/networkSecurityGroups"
      field: "properties.networkInterfaces[*].id"
    emit:
      source_type: Firewall
      target_type: Network
      source: "<NSG Firewall node>"
      target: "<NetworkInterface node (Network class) referenced by properties.networkInterfaces[*].id>"
      api_source: "ARM GET /networkSecurityGroups/{name} or az network nsg show"
      evidence_field: "properties.networkInterfaces[*].id"
      narrative: "NSG {nsg.name} is associated with network interface {nic.name}."

  # ===========================================================================
  # CONTROL PLANE: securityRules/write → CanModifyConfiguration
  # Minimum permission to add/replace individual security rules without
  # recreating the NSG object. Granted by Security Admin, Network Contributor,
  # Contributor, Owner — and any custom role including this action.
  # ===========================================================================

  - id: azure-nsg-securityrules-write
    emits: CanModifyConfiguration
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Network/networkSecurityGroups/securityRules/write"
      resource_type: "Microsoft.Network/networkSecurityGroups"
    emit:
      source_type: Identity
      target_type: Firewall
      source: "<principal (Identity)>"
      target: "<NSG node (Firewall)>"
      permissions:
        - "Microsoft.Network/networkSecurityGroups/securityRules/write"
      narrative: >-
        {principal.name} can add or replace individual security rules on NSG
        {target.name} (Microsoft.Network/networkSecurityGroups/securityRules/write),
        including adding inbound Allow rules for source=Internet on any port.

  # ===========================================================================
  # CONTROL PLANE: networkSecurityGroups/write → CanModifyConfiguration
  # Sufficient to create or fully replace the NSG object and rule set.
  # Granted by Network Contributor, Contributor, Owner.
  # ===========================================================================

  - id: azure-nsg-nsg-write
    emits: CanModifyConfiguration
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Network/networkSecurityGroups/write"
      resource_type: "Microsoft.Network/networkSecurityGroups"
    emit:
      source_type: Identity
      target_type: Firewall
      source: "<principal (Identity)>"
      target: "<NSG node (Firewall)>"
      permissions:
        - "Microsoft.Network/networkSecurityGroups/write"
      narrative: >-
        {principal.name} can create or fully replace NSG {target.name}
        (Microsoft.Network/networkSecurityGroups/write), including removing all
        existing Deny rules and inserting broad Allow rules.

  # ===========================================================================
  # CONTROL PLANE: join/action → CanModifyConfiguration
  # Allows reassociating (or associating) the NSG with a subnet or NIC.
  # An attacker with join/action on an NSG they control can replace a production
  # subnet's NSG, bypassing the original NSG's security rules entirely.
  # Granted by Security Admin, Network Contributor, Contributor, Owner.
  # ===========================================================================

  - id: azure-nsg-join-action
    emits: CanModifyConfiguration
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Network/networkSecurityGroups/join/action"
      resource_type: "Microsoft.Network/networkSecurityGroups"
    emit:
      source_type: Identity
      target_type: Firewall
      source: "<principal (Identity)>"
      target: "<NSG node (Firewall)>"
      permissions:
        - "Microsoft.Network/networkSecurityGroups/join/action"
      narrative: >-
        {principal.name} can associate/re-associate NSG {target.name} with
        subnets or network interfaces (Microsoft.Network/networkSecurityGroups/join/action).
        Combined with controlling a permissive NSG, this enables replacing the target
        subnet's NSG, bypassing its existing firewall rules.
