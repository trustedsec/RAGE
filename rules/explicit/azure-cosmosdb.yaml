# Azure Cosmos DB — Explicit normalization rules (Phase 6 — storage & databases)
# ---------------------------------------------------------------------------
# Normalization rules that run the effective-permission evaluator to produce
# HasPermission edges feeding derived attack-path rules in /rules/derived/azure/cosmosdb.yaml.
#
# These rules use match_effective_permission and match_record to:
#   (1) Evaluate ARM RBAC role assignments for listKeys/action, listConnectionStrings/action,
#       readonlykeys/action, sqlRoleAssignments/write, and account/write permissions.
#   (2) Enumerate Cosmos DB native data-plane role definitions to resolve dataActions grants.
#   (3) Emit ContainsCredential and HasPolicy edges for account properties (firewall, CMK).
#
# All HasPermission edges produced here are the basis for derived rule evaluation.
# Linchpin: Cosmos DB Operator (230815da-be43-4aae-9cb4-875f7bd000aa) has listKeys/*,
# listConnectionStrings/*, readonlykeys/*, and regenerateKey/* in its notActions — the
# permission evaluator MUST exclude these from effective permission.
# ---------------------------------------------------------------------------

provider: azure
phase: 6-storage-databases
applies_to: [azure]

rules:

  # --- ARM RBAC: listKeys/action -> HasPermission ----
  - id: azure-cosmosdb-listkeys-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.DocumentDB/databaseAccounts/listKeys/action"
      resource_type: "Microsoft.DocumentDB/databaseAccounts"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<databaseAccount node>"
      permissions: ["Microsoft.DocumentDB/databaseAccounts/listKeys/action"]
      narrative: >-
        {principal.name} has effective permission listKeys/action on {account.name}
        (via role: {role.name}). Verify notActions exclude this from Cosmos DB Operator.

  # --- ARM RBAC: listConnectionStrings/action -> HasPermission ----
  - id: azure-cosmosdb-listconnectionstrings-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.DocumentDB/databaseAccounts/listConnectionStrings/action"
      resource_type: "Microsoft.DocumentDB/databaseAccounts"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<databaseAccount node>"
      permissions: ["Microsoft.DocumentDB/databaseAccounts/listConnectionStrings/action"]
      narrative: >-
        {principal.name} has effective permission listConnectionStrings/action on {account.name}
        (via role: {role.name}).

  # --- ARM RBAC: readonlykeys/action -> HasPermission ----
  - id: azure-cosmosdb-readonlykeys-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.DocumentDB/databaseAccounts/readonlykeys/action"
      resource_type: "Microsoft.DocumentDB/databaseAccounts"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<databaseAccount node>"
      permissions: ["Microsoft.DocumentDB/databaseAccounts/readonlykeys/action"]
      narrative: >-
        {principal.name} has effective permission readonlykeys/action on {account.name}
        (via role: {role.name}).

  # --- ARM RBAC: sqlRoleAssignments/write -> HasPermission ----
  - id: azure-cosmosdb-sqlrole-assignment-write-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments/write"
      resource_type: "Microsoft.DocumentDB/databaseAccounts"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<databaseAccount node>"
      permissions: ["Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments/write"]
      narrative: >-
        {principal.name} has effective permission sqlRoleAssignments/write on {account.name}
        (via role: {role.name}), allowing creation/modification of native data-plane role assignments.

  # --- ARM RBAC: databaseAccounts/write -> HasPermission ----
  - id: azure-cosmosdb-account-write-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.DocumentDB/databaseAccounts/write"
      resource_type: "Microsoft.DocumentDB/databaseAccounts"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<databaseAccount node>"
      permissions: ["Microsoft.DocumentDB/databaseAccounts/write"]
      narrative: >-
        {principal.name} has effective permission databaseAccounts/write on {account.name}
        (via role: {role.name}), allowing modification of account properties (firewall, CMK, disableLocalAuth).

  # --- Data-plane RBAC: Cosmos DB role dataActions -> HasPermission ----
  # Enumerate sqlRoleAssignments and resolve their roleDefinitionIds to extract
  # dataActions grants (items/read, items/write, executeQuery, etc.). Emit HasPermission
  # for each principal-dataAction-scope triple.
  - id: azure-cosmosdb-data-plane-read-permission
    emits: HasPermission
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments"
      field: "properties.roleDefinitionId"
    where:
      - "resolved roleDefinition.permissions[].dataActions includes Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/read AND Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/executeQuery"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principalId of sqlRoleAssignment>"
      target: "<databaseAccount or database or container node at sqlRoleAssignment scope>"
      permissions:
        - "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/read"
        - "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/executeQuery"
      api_source: "Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments GET + sqlRoleDefinitions GET"
      evidence_field: "properties.roleDefinitionId + properties.scope + properties.principalId"
      narrative: >-
        {principal.name} has a Cosmos DB native data-plane role assignment granting items/read
        and executeQuery on {account_or_scope.name} (role: {roleDefinition.roleName}).

  # --- Data-plane RBAC: write dataActions -> HasPermission ----
  - id: azure-cosmosdb-data-plane-write-permission
    emits: HasPermission
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments"
      field: "properties.roleDefinitionId"
    where:
      - "resolved roleDefinition.permissions[].dataActions includes (Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/create OR Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/replace OR Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/upsert)"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principalId of sqlRoleAssignment>"
      target: "<databaseAccount or database or container node at sqlRoleAssignment scope>"
      permissions:
        - "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/create"
        - "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/replace"
        - "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/upsert"
      api_source: "Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments GET + sqlRoleDefinitions GET"
      evidence_field: "properties.roleDefinitionId + properties.scope + properties.principalId"
      narrative: >-
        {principal.name} has a Cosmos DB native data-plane role assignment granting write
        (create/replace/upsert) on {account_or_scope.name} (role: {roleDefinition.roleName}).

  # --- Structural: account contains master keys -> ContainsCredential ----
  - id: azure-cosmosdb-account-contains-credential
    emits: ContainsCredential
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.DocumentDB/databaseAccounts"
      field: "properties.disableLocalAuth"
    where:
      - "properties.disableLocalAuth != true  # key-based auth enabled (default)"
    emit:
      source_type: NoSQLDatabase
      target_type: AccessKey
      source: "<databaseAccount node>"
      target: "<primary AccessKey node> and <secondary AccessKey node> and <read-only key nodes>"
      api_source: "Microsoft.DocumentDB/databaseAccounts GET"
      evidence_field: "properties.disableLocalAuth"
      narrative: >-
        {account.name} holds primary and secondary master keys and read-only keys.
        Key-based authentication is enabled (disableLocalAuth=false or unset); these keys
        bypass all Azure RBAC data-plane role assignments when presented to the data endpoint.

  # --- Network policy properties -> HasPolicy ----
  - id: azure-cosmosdb-network-properties
    emits: HasPolicy
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.DocumentDB/databaseAccounts"
      field: "properties.publicNetworkAccess"
    emit:
      source_type: NoSQLDatabase
      target_type: Policy
      source: "<databaseAccount node>"
      target: "<networkAccess ResourcePolicy node>"
      api_source: "Microsoft.DocumentDB/databaseAccounts GET"
      evidence_field: "properties.publicNetworkAccess + properties.ipRules + properties.virtualNetworkRules"
      narrative: >-
        {account.name} has publicNetworkAccess={properties.publicNetworkAccess},
        ipRules={count(properties.ipRules)} entries,
        virtualNetworkRules={count(properties.virtualNetworkRules)} entries.
        When publicNetworkAccess=Disabled, only private endpoints can reach the data plane.

  # --- CMK encryption properties -> HasPolicy ----
  - id: azure-cosmosdb-cmk-property
    emits: HasPolicy
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.DocumentDB/databaseAccounts"
      field: "properties.keyVaultKeyUri"
    where:
      - "properties.keyVaultKeyUri is not null and not empty"
    emit:
      source_type: NoSQLDatabase
      target_type: Policy
      source: "<databaseAccount node>"
      target: "<CMK EncryptionKey ResourcePolicy node>"
      api_source: "Microsoft.DocumentDB/databaseAccounts GET"
      evidence_field: "properties.keyVaultKeyUri"
      narrative: >-
        {account.name} uses customer-managed keys (CMK) with Key Vault key {properties.keyVaultKeyUri}.
        All stored data is encrypted with this key. Revoking the key makes the account inaccessible.
