# AWS GuardDuty — Explicit Normalization Rules
# ---------------------------------------------------------------------------
# These rules match effective IAM permissions to GuardDuty Detector nodes
# to produce HasPermission edges consumed by derived rules.
#
# This file is the authoritative source for IAM-to-graph permission mapping
# for GuardDuty control-plane operations. All derived rules reference these
# HasPermission edges.
# ---------------------------------------------------------------------------

provider: aws
phase: explicit-normalization
applies_to: [aws]

rules:

  - id: aws-gd-explicit-delete-detector
    emits: HasPermission
    description: "Principal holds effective IAM permission to delete GuardDuty detector."
    match_effective_permission:
      action: "guardduty:DeleteDetector"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:DeleteDetector"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to delete GuardDuty detector {detector.name} (guardduty:DeleteDetector)."

  - id: aws-gd-explicit-update-detector
    emits: HasPermission
    description: "Principal holds effective IAM permission to update GuardDuty detector (including Enable=false)."
    match_effective_permission:
      action: "guardduty:UpdateDetector"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:UpdateDetector"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to modify GuardDuty detector {detector.name} configuration (guardduty:UpdateDetector), including disabling it."

  - id: aws-gd-explicit-create-filter
    emits: HasPermission
    description: "Principal holds effective IAM permission to create GuardDuty filters."
    match_effective_permission:
      action: "guardduty:CreateFilter"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:CreateFilter"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to create GuardDuty filters on {detector.name}, enabling finding suppression."

  - id: aws-gd-explicit-update-filter
    emits: HasPermission
    description: "Principal holds effective IAM permission to update GuardDuty filters."
    match_effective_permission:
      action: "guardduty:UpdateFilter"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:UpdateFilter"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to update GuardDuty filters on {detector.name}, enabling finding suppression."

  - id: aws-gd-explicit-create-ipset
    emits: HasPermission
    description: "Principal holds effective IAM permission to create GuardDuty trusted-IP sets."
    match_effective_permission:
      action: "guardduty:CreateIPSet"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:CreateIPSet"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to create GuardDuty trusted-IP sets on {detector.name}, suppressing network-based findings."

  - id: aws-gd-explicit-update-ipset
    emits: HasPermission
    description: "Principal holds effective IAM permission to update GuardDuty trusted-IP sets."
    match_effective_permission:
      action: "guardduty:UpdateIPSet"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:UpdateIPSet"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to update GuardDuty trusted-IP sets on {detector.name}, suppressing network-based findings."

  - id: aws-gd-explicit-update-publishing-destination
    emits: HasPermission
    description: "Principal holds effective IAM permission to update GuardDuty publishing destination."
    match_effective_permission:
      action: "guardduty:UpdatePublishingDestination"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:UpdatePublishingDestination"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to update GuardDuty publishing destination for {detector.name}, redirecting findings exports."

  - id: aws-gd-explicit-update-findings-feedback
    emits: HasPermission
    description: "Principal holds effective IAM permission to update GuardDuty findings feedback (mark as FALSE_POSITIVE)."
    match_effective_permission:
      action: "guardduty:UpdateFindingsFeedback"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:UpdateFindingsFeedback"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to update findings feedback on {detector.name}, marking findings as FALSE_POSITIVE."

  - id: aws-gd-explicit-disassociate-from-admin
    emits: HasPermission
    description: "Principal holds effective IAM permission to disassociate from GuardDuty delegated administrator (member account action)."
    match_effective_permission:
      action: "guardduty:DisassociateFromAdministratorAccount"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:DisassociateFromAdministratorAccount"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to sever {detector.name}'s connection to the GuardDuty Organizations delegated administrator."

  - id: aws-gd-explicit-disassociate-members
    emits: HasPermission
    description: "Principal holds effective IAM permission to disassociate member accounts from GuardDuty (admin account action)."
    match_effective_permission:
      action: "guardduty:DisassociateMembers"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:DisassociateMembers"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to disassociate member accounts from GuardDuty managed by {detector.name}."

  - id: aws-gd-explicit-list-findings
    emits: HasPermission
    description: "Principal holds effective IAM permission to list GuardDuty findings."
    match_effective_permission:
      action: "guardduty:ListFindings"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:ListFindings"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to list GuardDuty findings from {detector.name}."

  - id: aws-gd-explicit-get-findings
    emits: HasPermission
    description: "Principal holds effective IAM permission to retrieve GuardDuty findings details."
    match_effective_permission:
      action: "guardduty:GetFindings"
      resource_type: "AWS::GuardDuty::Detector"
      resource_arn_pattern: "arn:aws:guardduty:*:*:detector/*"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<detector>"
      permissions: ["guardduty:GetFindings"]
      conditions: [iam_permission]
      narrative: "{principal.name} holds effective permission to retrieve GuardDuty findings details from {detector.name}."
