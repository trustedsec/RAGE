# GCP VPC Firewall — Explicit normalization rules.
# Translates raw collected compute.googleapis.com/Firewall config and IAM
# effective-permission evaluation into common explicit edges consumed by the
# derived rules in /rules/derived/gcp/firewall.yaml.
#
# TWO normalization areas:
#   1. STRUCTURAL: Firewall rule associated with a VPC network -> LocatedIn.
#   2. CONTROL-PLANE: compute.firewalls.create / .update / firewallPolicies.update
#      effective permissions -> CanModifyConfiguration on the Firewall node.
#
# Priority / target-scope evaluation is deferred to the derived rules; explicit
# rules here emit raw structural and control-plane facts only.
#
# Collection APIs:
#   gcloud compute firewall-rules list --project=PROJECT_ID --format=json
#   gcloud compute firewall-rules describe RULE_NAME --project=PROJECT_ID --format=json
#   gcloud compute firewall-policies list --format=json
#   gcloud compute firewall-policies describe POLICY_NAME --format=json
#   gcloud projects get-iam-policy PROJECT_ID --format=json
#   gcloud resource-manager folders get-iam-policy FOLDER_ID --format=json

rules:

  # ===========================================================================
  # STRUCTURAL: Firewall rule located in a VPC network
  # LocatedIn: source="*" → Network. Firewall is Network class; VirtualNetwork
  # is Network class. schema/edges.yaml target: [AdministrativeBoundary, Network].
  # ===========================================================================

  - id: gcp-firewall-located-in-network
    emits: LocatedIn
    applies_to: [gcp]
    match_record:
      resource_type: "compute.googleapis.com/Firewall"
      field: "network"
    emit:
      source_type: Firewall
      target_type: Network
      source: "<Firewall rule node (Firewall class)>"
      target: "<VirtualNetwork node (Network class) referenced by firewall.network self-link>"
      api_source: "compute.firewalls.list / compute.firewalls.get"
      evidence_field: "network"
      narrative: "Firewall rule {firewall.name} is applied in VPC network {network.name}."

  # ===========================================================================
  # STRUCTURAL: Hierarchical Firewall Policy located in a folder/org
  # LocatedIn: source="*" → AdministrativeBoundary. Folder is AdministrativeBoundary.
  # ===========================================================================

  - id: gcp-firewall-policy-located-in-folder
    emits: LocatedIn
    applies_to: [gcp]
    match_record:
      resource_type: "compute.googleapis.com/FirewallPolicy"
      field: "parent"
    emit:
      source_type: Firewall
      target_type: Folder
      source: "<Firewall policy node (Firewall class)>"
      target: "<Folder or Organization node (AdministrativeBoundary) referenced by policy.parent>"
      api_source: "compute.firewallPolicies.list / compute.firewallPolicies.get"
      evidence_field: "parent"
      narrative: "Firewall policy {policy.name} is owned by (located in) {parent.name} (folder/organization)."

  # ===========================================================================
  # CONTROL PLANE: compute.firewalls.create -> CanModifyConfiguration
  # Sufficient to add a NEW allow rule to any VPC in the project. The
  # permission is evaluated at project scope; IAM conditions may narrow it.
  # Roles that grant this: roles/compute.securityAdmin,
  # roles/compute.networkAdmin, roles/compute.admin, roles/editor, roles/owner.
  # ===========================================================================

  - id: gcp-firewall-can-modify-config-create
    emits: CanModifyConfiguration
    applies_to: [gcp]
    match_effective_permission:
      action: "compute.firewalls.create"
      resource_type: "compute.googleapis.com/Firewall"
    emit:
      source_type: Identity
      target_type: Firewall
      source: "<principal (Identity)>"
      target: "<project-scoped Firewall capability node>"
      permissions:
        - "compute.firewalls.create"
      narrative: >-
        {principal.name} can create new VPC firewall rules (compute.firewalls.create)
        in the project, enabling insertion of ingress ALLOW rules from 0.0.0.0/0
        on any port for any target tag — weakening network isolation for matched VMs.

  # ===========================================================================
  # CONTROL PLANE: compute.firewalls.update -> CanModifyConfiguration
  # Sufficient to modify an existing rule's sourceRanges, protocols, ports,
  # or target tags. Commonly used to widen a private-source rule to 0.0.0.0/0.
  # ===========================================================================

  - id: gcp-firewall-can-modify-config-update
    emits: CanModifyConfiguration
    applies_to: [gcp]
    match_effective_permission:
      action: "compute.firewalls.update"
      resource_type: "compute.googleapis.com/Firewall"
    emit:
      source_type: Identity
      target_type: Firewall
      source: "<principal (Identity)>"
      target: "<Firewall rule node (Firewall class)>"
      permissions:
        - "compute.firewalls.update"
      narrative: >-
        {principal.name} can update existing VPC firewall rule {target.name}
        (compute.firewalls.update), including widening source ranges to 0.0.0.0/0
        or adding new allowed protocols and ports, weakening network isolation for
        the rule's targeted VMs.

  # ===========================================================================
  # CONTROL PLANE: compute.firewallPolicies.update -> CanModifyConfiguration
  # Sufficient to add or modify rules in a hierarchical or network firewall
  # policy. If the policy is associated with a folder/org, changes affect all
  # projects under that node.
  # Roles: roles/compute.orgSecurityPolicyAdmin (org/folder policies),
  #        roles/compute.securityAdmin (project-scoped network policies).
  # ===========================================================================

  - id: gcp-firewall-policy-can-modify-config
    emits: CanModifyConfiguration
    applies_to: [gcp]
    match_effective_permission:
      action: "compute.firewallPolicies.update"
      resource_type: "compute.googleapis.com/FirewallPolicy"
    emit:
      source_type: Identity
      target_type: Firewall
      source: "<principal (Identity)>"
      target: "<Firewall policy node (Firewall class)>"
      permissions:
        - "compute.firewallPolicies.update"
      narrative: >-
        {principal.name} can modify hierarchical or network firewall policy {target.name}
        (compute.firewallPolicies.update), potentially inserting ALLOW rules with
        folder- or organization-wide scope, weakening network isolation across all
        associated projects.
