# Azure Defender for Cloud — explicit normalization rules (Phase 12 Security & Logging)
# ---------------------------------------------------------------------------
# Explicit edges that normalize collected Defender configuration (pricings, suppression
# rules, contacts, settings) into common edge types, and permission edges from RBAC
# evaluation. These rules run during the inventory/normalization phase before derived
# rules are applied.
#
# Defenders for Cloud is a management-plane resource (Microsoft.Security) with no
# associated execution identity. All edges are:
#   - CanRead (configuration reconnaissance): read pricings, suppression rules
#   - CanDelete (suppression rule cleanup): delete suppression rules
#
# CanModify and CanWrite edges are derived (phase 12) from effective permission
# evaluations and are defined in /rules/derived/azure/defender.yaml.
# ---------------------------------------------------------------------------

provider: azure
phase: 12-security-logging
applies_to: [azure]

rules:

  # --- CanRead edges (reconnaissance on Defender configuration) -------

  - id: azure-defender-pricing-read
    emits: CanRead
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Security/pricings/read"
      scope_type: "subscription|managementGroup"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Defender pricing tier node (SecurityService)>"
      permissions:
        - "Microsoft.Security/pricings/read"
      narrative: >-
        {principal.name} can read Defender pricing tier configurations for the subscription
        (Microsoft.Security/pricings/read); reveals which Defender plans are enabled (Standard)
        or disabled (Free) — reconnaissance for plan-disablement targeting.

  - id: azure-defender-suppression-rule-read
    emits: CanRead
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Security/alertsSuppressionRules/read"
      scope_type: "subscription"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Defender alert suppression rule node (SecurityService)>"
      permissions:
        - "Microsoft.Security/alertsSuppressionRules/read"
      narrative: >-
        {principal.name} can read Defender alert suppression rules for the subscription
        (Microsoft.Security/alertsSuppressionRules/read); enumerates existing suppression
        coverage — reconnaissance for gaps to exploit or rules to widen.

  # --- CanDelete edges (explicit deletion of suppression rules) -------

  - id: azure-defender-delete-suppression-rule
    emits: CanDelete
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Security/alertsSuppressionRules/delete"
      scope_type: "subscription"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Defender alert suppression rule node (SecurityService)>"
      permissions:
        - "Microsoft.Security/alertsSuppressionRules/delete"
      narrative: >-
        {principal.name} can delete Defender alert suppression rules for the subscription
        (Microsoft.Security/alertsSuppressionRules/delete). Deleting suppression rules
        removes existing alert muting, re-enabling previously-suppressed alert types —
        useful for a defender to undo attacker-created suppression rules, or for an
        attacker to clean up traces of suppression they created.
