# Normalizing GCP Secret Manager into explicit edges.
# Adapter emits raw Secret Manager API records; these rules translate them to
# common explicit edges (schema/edges.yaml). They do not combine edges.
# Permissions/actions are verbatim from
# cloud.google.com/secret-manager/docs/access-control and .../docs/cmek.

rules:

  # --- Secret allow policy -> ResourcePolicy attachment ----------------------
  - id: gcp-secretmanager-has-policy
    emits: HasPolicy
    applies_to: [gcp]
    match_record: {resource_type: "google.secretmanager.Secret", field: "iamPolicy.bindings"}
    emit:
      source_type: "*"
      target_type: Policy
      source: "<secret node>"
      target: "<secret ResourcePolicy node>"
      api_source: "secretmanager.projects.secrets.getIamPolicy"
      evidence_field: "iamPolicy.bindings"
      narrative: "{secret.name} has an IAM allow policy governing who may access it."

  # --- Payload classification -> CredentialsFor ------------------------------
  # CredentialsFor is asserted from METADATA classification (name/labels/
  # annotations), NEVER by reading the payload. Emit only when the payload is a
  # credential and its target identity/SA/data store is identifiable.
  - id: gcp-secretmanager-credentials-for-explicit
    emits: CredentialsFor
    applies_to: [gcp]
    match_record: {resource_type: "google.secretmanager.Secret", field: "name | labels | annotations"}
    where:
      - "metadata classifies the payload as a credential (SA JSON key -> ServiceAccount; OAuth/API token -> Identity; DB connection string / password -> Data)"
    emit:
      source: "<secret node>"
      target: "<classified target identity / service account / data store>"
      api_source: "secretmanager.projects.secrets.get"
      evidence_field: "name | labels | annotations"
      narrative: "{secret.name} holds credentials for {target.name} (classified from secret metadata)."

  # --- CMEK reference (EVIDENCE ONLY — drives the service-agent key gate) -----
  # NOTE: this is NOT a graph edge. A Secret node is class Secret, which is not a
  # valid source for ContainsResourceReference ([Data, Storage, Compute]) nor a
  # valid HasPolicy target (Policy), so no explicit EDGE is emitted for the CMEK
  # link. The kmsKeyName is recorded as EVIDENCE on the Secret node and consumed by
  # the derived rule gcp-secretmanager-read-cmek-gate to evaluate the
  # key_permission condition against the SERVICE AGENT (not the caller). The
  # concrete CanDecrypt edge on the KMS key belongs to the gcp:kms service.
  - id: gcp-secretmanager-cmek-ref
    emits: null                 # evidence-only record; emits no edge
    kind: evidence
    applies_to: [gcp]
    match_record: {resource_type: "google.secretmanager.Secret", field: "customerManagedEncryption.kmsKeyName"}
    where: ["customerManagedEncryption.kmsKeyName is set (secret is CMEK-encrypted)"]
    record:
      on_node: "<secret node>"
      field: "cmek_key"
      value: "<Cloud KMS CryptoKey referenced by kmsKeyName>"
      api_source: "secretmanager.projects.secrets.get"
      evidence_field: "customerManagedEncryption.kmsKeyName"
      note: >-
        Evidence for the derived rule gcp-secretmanager-read-cmek-gate: the
        key_permission condition is checked against the service agent
        service-PROJECT_NUMBER@gcp-sa-secretmanager.iam.gserviceaccount.com, NOT the
        accessing principal. No graph edge is emitted from the Secret to the key.

  # --- Read the payload (effective permission) -> CanReadSecret --------------
  # CanReadSecret is emitted by the permission evaluator: it exists only if a
  # principal's EFFECTIVE permissions include versions.access on the secret scope.
  - id: gcp-secretmanager-can-read-secret
    emits: CanReadSecret
    applies_to: [gcp]
    match_effective_permission:
      action: "secretmanager.versions.access"
      resource_type: "google.secretmanager.Secret"
    emit:
      source: "<principal>"
      target: "<secret node>"
      api_source: "policy evaluation (Policy Analyzer) — NOT versions.access itself"
      permissions: ["secretmanager.versions.access"]
      narrative: "{principal.name} can read the payload of {secret.name} (secretmanager.versions.access)."

  # --- Secret allow policy write -> CanModifyPolicy --------------------------
  - id: gcp-secretmanager-can-modify-policy
    emits: CanModifyPolicy
    applies_to: [gcp]
    match_effective_permission:
      action: "secretmanager.secrets.setIamPolicy"
      resource_type: "google.secretmanager.Secret"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<secret allow policy node>"
      permissions: ["secretmanager.secrets.setIamPolicy"]
      narrative: "{principal.name} can modify the IAM allow policy of {secret.name} (secretmanager.secrets.setIamPolicy)."

  # --- Cross-project member in a secret binding -> CrossProjectTrust ---------
  - id: gcp-secretmanager-cross-project-trust
    emits: CrossProjectTrust
    applies_to: [gcp]
    match_record: {resource_type: "google.secretmanager.Secret", field: "iamPolicy.bindings[].members"}
    where: ["a member (user/SA/group) belongs to a different project than the secret"]
    emit:
      source: "<secret.project>"
      target: "<member.project | external identity>"
      api_source: "secretmanager.projects.secrets.getIamPolicy"
      evidence_field: "iamPolicy.bindings[].members"
      narrative: "{secret.name} grants access to {external.name} in project {project}."

  # --- Regional secret placement -> LocatedIn --------------------------------
  - id: gcp-secretmanager-located-in
    emits: LocatedIn
    applies_to: [gcp]
    match_record: {resource_type: "google.secretmanager.Secret", field: "replication.userManaged.replicas | name (locations/*)"}
    where: ["secret is regional (locations/<region>/secrets/*) or user-managed replication pins specific regions"]
    emit:
      source_type: "*"
      source: "<secret node>"
      target: "<region / location boundary>"
      api_source: "secretmanager.projects.secrets.get"
      evidence_field: "replication | name"
      narrative: "{secret.name} is located in {region} (data residency)."
