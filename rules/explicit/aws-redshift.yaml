# AWS Redshift — Explicit (Normalization) Rules
# ---------------------------------------------------------------------------
# Translates raw Redshift config (from DescribeClusters, GetNamespace,
# DescribeClusterSnapshots, DescribeDataSharesForProducer) into explicit edges.
# Each rule maps ONE observed API field to ONE explicit edge. Derived edges
# that combine these facts live in /rules/derived/aws/redshift.yaml.
#
# API sources (read-only collector permissions):
#   redshift:DescribeClusters
#   redshift:DescribeClusterSnapshots
#   redshift:DescribeDataSharesForProducer
#   redshift-serverless:GetNamespace
#   redshift-serverless:GetWorkgroup
#   redshift-serverless:GetResourcePolicy
# ---------------------------------------------------------------------------

provider: aws
applies_to: [aws]

rules:

  # --- ExecutesAs: cluster IAM roles (provisioned) ---------------------------
  - id: aws-redshift-executes-as-cluster-role
    emits: ExecutesAs
    match_record:
      resource_type: "AWS::Redshift::Cluster"
      field: "ClusterIamRoles[].IamRoleArn"
    where:
      - "ClusterIamRoles[].IamRoleArn is non-empty"
    emit:
      source_type: Data
      target_type: MachineIdentity
      source: "<Redshift Cluster (DataWarehouse node)>"
      target: "<IAM Role at ClusterIamRoles[].IamRoleArn>"
      api_source: "redshift:DescribeClusters"
      evidence_field: "ClusterIamRoles[].IamRoleArn"
      state: ACTIVE
      narrative: >-
        {cluster.name} executes as {role.name}. This role is used by the cluster
        engine for COPY, UNLOAD, CREATE EXTERNAL SCHEMA (Spectrum/Glue), and
        CREATE EXTERNAL FUNCTION (Lambda UDF) calls. Any SQL that references
        this role exercises its AWS permissions.

  # --- ExecutesAs: Serverless namespace IAM roles ----------------------------
  - id: aws-redshift-serverless-executes-as-namespace-role
    emits: ExecutesAs
    match_record:
      resource_type: "AWS::RedshiftServerless::Namespace"
      field: "iamRoles[]"
    where:
      - "iamRoles[] is non-empty"
    emit:
      source_type: Data
      target_type: MachineIdentity
      source: "<Redshift Serverless Namespace (DataWarehouse node)>"
      target: "<IAM Role at iamRoles[]>"
      api_source: "redshift-serverless:GetNamespace"
      evidence_field: "iamRoles[]"
      state: ACTIVE
      narrative: >-
        {namespace.name} (Redshift Serverless namespace) executes as {role.name}.
        This role is used by COPY, UNLOAD, and external function calls within
        the namespace.

  # --- ContainsSecret: ManagedAdminPassword stored in Secrets Manager --------
  - id: aws-redshift-managed-admin-password-secret
    emits: ContainsSecret
    match_record:
      resource_type: "AWS::Redshift::Cluster"
      field: "MasterPasswordSecretArn"
    where:
      - "MasterPasswordSecretArn is non-empty"
    emit:
      source_type: Data
      target_type: Secret
      source: "<Redshift Cluster (DataWarehouse node)>"
      target: "<Secrets Manager secret at MasterPasswordSecretArn>"
      api_source: "redshift:DescribeClusters"
      evidence_field: "MasterPasswordSecretArn"
      state: ACTIVE
      narrative: >-
        {cluster.name} stores its master (admin) database password in Secrets
        Manager secret {secret.name} via the ManagedAdminPassword integration.
        A principal with secretsmanager:GetSecretValue on this secret ARN can
        retrieve the plaintext admin password and authenticate to the cluster as
        the database superuser.

  # --- ContainsSecret: Serverless namespace admin password secret ------------
  - id: aws-redshift-serverless-admin-password-secret
    emits: ContainsSecret
    match_record:
      resource_type: "AWS::RedshiftServerless::Namespace"
      field: "adminPasswordSecretArn"
    where:
      - "adminPasswordSecretArn is non-empty"
    emit:
      source_type: Data
      target_type: Secret
      source: "<Redshift Serverless Namespace (DataWarehouse node)>"
      target: "<Secrets Manager secret at adminPasswordSecretArn>"
      api_source: "redshift-serverless:GetNamespace"
      evidence_field: "adminPasswordSecretArn"
      state: ACTIVE
      narrative: >-
        {namespace.name} (Redshift Serverless) stores its admin database password
        in Secrets Manager secret {secret.name}. Retrieval grants DB superuser access.

  # --- ExposedToInternet: publicly accessible provisioned cluster (CONDITIONAL) ---
  # Note: marked as CONDITIONAL pending VPC security group check. Derived rule
  # aws-redshift-public-cluster validates the SG permit condition and may elevate
  # to ACTIVE if SG allows inbound TCP 5439 from 0.0.0.0/0.
  - id: aws-redshift-cluster-publicly-accessible
    emits: ExposedToInternet
    match_record:
      resource_type: "AWS::Redshift::Cluster"
      field: "PubliclyAccessible"
    where:
      - "PubliclyAccessible == true"
    emit:
      source_type: Data
      target_type: AnonymousIdentity
      source: "<Redshift Cluster (DataWarehouse node)>"
      target: "<AnonymousIdentity>"
      api_source: "redshift:DescribeClusters"
      evidence_field: "PubliclyAccessible"
      state: CONDITIONAL
      conditions: [network_reachability]
      narrative: >-
        {cluster.name} has PubliclyAccessible=true. The cluster endpoint resolves
        to a public IP. Reachability from the internet also requires the VPC
        security group to permit inbound TCP port 5439; confirm SG rules before
        marking ACTIVE (derived rule aws-redshift-public-cluster performs the SG check).

  # --- ExposedToInternet: publicly accessible Serverless workgroup (CONDITIONAL) ---
  # Note: marked as CONDITIONAL pending VPC security group check. Derived rule
  # aws-redshift-public-cluster validates the SG permit condition.
  - id: aws-redshift-serverless-workgroup-publicly-accessible
    emits: ExposedToInternet
    match_record:
      resource_type: "AWS::RedshiftServerless::Workgroup"
      field: "publiclyAccessible"
    where:
      - "publiclyAccessible == true"
    emit:
      source_type: Data
      target_type: AnonymousIdentity
      source: "<Redshift Serverless Workgroup (DataWarehouse node)>"
      target: "<AnonymousIdentity>"
      api_source: "redshift-serverless:GetWorkgroup"
      evidence_field: "publiclyAccessible"
      state: CONDITIONAL
      conditions: [network_reachability]
      narrative: >-
        {workgroup.name} (Redshift Serverless) has publiclyAccessible=true. The
        workgroup endpoint is internet-routable. SG inbound port 5439 must also
        permit internet traffic; derived rule aws-redshift-public-cluster resolves this.

  # --- CrossAccountTrust: snapshot with cross-account restore access ---------
  - id: aws-redshift-snapshot-cross-account-access
    emits: CrossAccountTrust
    match_record:
      resource_type: "AWS::Redshift::ClusterSnapshot"
      field: "AccountsWithRestoreAccess[].AccountId"
    where:
      - "AccountsWithRestoreAccess[].AccountId is non-empty"
    emit:
      source_type: Snapshot
      target_type: Account
      source: "<Redshift Cluster Snapshot>"
      target: "<AWS Account at AccountsWithRestoreAccess[].AccountId>"
      api_source: "redshift:DescribeClusterSnapshots"
      evidence_field: "AccountsWithRestoreAccess[].AccountId"
      state: ACTIVE
      narrative: >-
        Redshift snapshot {snapshot.name} grants restore access to account
        {account.id} (AccountsWithRestoreAccess). That account can call
        RestoreFromClusterSnapshot to spin up a full cluster copy, gaining
        complete access to the snapshot's data.

  # --- CrossAccountTrust: datashare producer authorization ------------------
  - id: aws-redshift-datashare-authorized-consumer
    emits: CrossAccountTrust
    match_record:
      resource_type: "AWS::Redshift::DataShare"
      field: "DataShareAssociations[].ConsumerIdentifier"
    where:
      - "DataShareAssociations[].Status == 'AUTHORIZED'"
      - "ConsumerIdentifier is a different AWS account ID"
    emit:
      source_type: Data
      target_type: Account
      source: "<Redshift Cluster / Datashare (DataWarehouse node)>"
      target: "<Consumer AWS Account at ConsumerIdentifier>"
      api_source: "redshift:DescribeDataSharesForProducer"
      evidence_field: "DataShareAssociations[].ConsumerIdentifier"
      state: ACTIVE
      narrative: >-
        {cluster.name} has authorized datashare access for account {account.id}
        (DataShareAssociations.Status=AUTHORIZED). The consumer account can query
        live Redshift tables in {cluster.name} in real time via their own cluster
        using the shared objects.

  # --- CanModifyConfiguration: redshift:ModifyClusterIamRoles ----------------
  - id: aws-redshift-can-modify-cluster-iam-roles
    emits: CanModifyConfiguration
    match_effective_permission:
      action: "redshift:ModifyClusterIamRoles"
      resource_type: "AWS::Redshift::Cluster"
    emit:
      source_type: Identity
      target_type: Data
      source: "<principal>"
      target: "<cluster node>"
      permissions: ["redshift:ModifyClusterIamRoles"]
      api_source: "iam:GetRole (effective policy evaluation)"
      narrative: >-
        {principal.name} can attach or detach IAM roles on {cluster.name}
        (redshift:ModifyClusterIamRoles). This capability is a prerequisite for
        CanPassIdentity + CanModifyConfiguration → CanExecuteAs privesc paths.

  # --- CanModifyConfiguration: redshift-serverless:UpdateNamespace -----------
  - id: aws-redshift-serverless-update-namespace-config
    emits: CanModifyConfiguration
    match_effective_permission:
      action: "redshift-serverless:UpdateNamespace"
      resource_type: "AWS::RedshiftServerless::Namespace"
    emit:
      source_type: Identity
      target_type: Data
      source: "<principal>"
      target: "<namespace node>"
      permissions: ["redshift-serverless:UpdateNamespace"]
      api_source: "iam:GetRole (effective policy evaluation)"
      narrative: >-
        {principal.name} can update the Serverless namespace {namespace.name},
        including its IAM roles (redshift-serverless:UpdateNamespace). This
        capability is the Serverless equivalent of redshift:ModifyClusterIamRoles
        and is a prerequisite for PassRole privesc paths on Serverless.

  # --- CrossAccountTrust: Serverless snapshot with cross-account restore access -
  - id: aws-redshift-serverless-snapshot-cross-account-access
    emits: CrossAccountTrust
    match_record:
      resource_type: "AWS::RedshiftServerless::Snapshot"
      field: "AccountsWithRestoreAccess[].AccountId"
    where:
      - "AccountsWithRestoreAccess[].AccountId is non-empty"
    emit:
      source_type: Snapshot
      target_type: Account
      source: "<Redshift Serverless Snapshot>"
      target: "<AWS Account at AccountsWithRestoreAccess[].AccountId>"
      api_source: "redshift-serverless:GetSnapshot"
      evidence_field: "AccountsWithRestoreAccess[].AccountId"
      state: ACTIVE
      narrative: >-
        Redshift Serverless snapshot {snapshot.name} grants restore access to account
        {account.id} (AccountsWithRestoreAccess). That account can restore the snapshot
        as a new Serverless namespace, gaining complete access to the snapshot's data.

  # --- CrossAccountTrust: Serverless namespace resource policy ----------------
  - id: aws-redshift-serverless-namespace-resource-policy
    emits: CrossAccountTrust
    match_record:
      resource_type: "AWS::RedshiftServerless::Namespace"
      field: "resourcePolicy"
    where:
      - "resourcePolicy contains Principal with AWS account ID != namespace's own account"
    emit:
      source_type: Data
      target_type: Account
      source: "<Redshift Serverless Namespace (DataWarehouse)>"
      target: "<AWS Account ID in the resource policy Principal>"
      api_source: "redshift-serverless:GetResourcePolicy"
      evidence_field: "resourcePolicy"
      state: ACTIVE
      narrative: >-
        {namespace.name} has a resource policy that grants cross-account access to
        account {account.id}. That account can call AssociateDataShareConsumer to
        read live namespace data without a snapshot export.
