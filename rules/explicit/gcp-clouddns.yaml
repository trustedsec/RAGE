# GCP Cloud DNS — Explicit Normalization Rules (Phase 8 — networking)
# ---------------------------------------------------------------------------
# Catalog key: gcp:clouddns
# Structural edges that normalize Cloud DNS resources into the graph.
#
# Per the research doc (providers/gcp/clouddns.md Section 17):
#   - Contains: DNS (zone) → DNS (RRset) — containment relationship
#   - LocatedIn: DNS (zone) → VirtualNetwork — attachment for private zones
#
# SCHEMA NOTES:
#   - Contains: source=[AdministrativeBoundary, ObjectStorage, Data, Secret, ManagementService]
#     DNS is a Network subtype and NOT in the source set. Use LocatedIn instead for zone->RRset.
#   - AttachedTo: source=[NetworkInterface, BlockStorage, ManagedIdentity, IAMPolicy]
#     DNS is NOT in the source set. Use LocatedIn for zone->VPC attachment (source=*, target=[Network]).
#
# ---------------------------------------------------------------------------

provider: gcp
phase: 8-networking
applies_to: [gcp]

rules:

  # ===========================================================================
  # RULE 1 — STRUCTURAL: DNS zone contains resource record sets
  # ===========================================================================
  # RATIONALE: Per edges.yaml, LocatedIn(source=[*], target=[AdministrativeBoundary, Network])
  # is the correct structural edge for "a record lives within a zone". DNS is a Network subtype.
  # While "contains" is semantically intuitive, the schema restricts Contains.source to
  # [AdministrativeBoundary, ObjectStorage, Data, Secret, ManagementService]. Using LocatedIn
  # is schema-conformant and semantically correct for zone→RRset placement.
  # Future: if we extend Contains.source to include Network, we can switch back.

  - id: gcp-clouddns-zone-contains-rrset
    emits: LocatedIn
    applies_to: [gcp]
    source_config:
      resource_type: "dns.googleapis.com/ManagedZone"
      child_resource_type: "dns.googleapis.com/ResourceRecordSet"
    emit:
      source_type: DNS
      target_type: DNS
      source: "<Cloud DNS resource record set (RRset)>"
      target: "<Cloud DNS managed zone containing the RRset>"
      api_source: "dns.resourceRecordSets.list (GET /dns/v1/projects/{project}/managedZones/{zone}/rrsets)"
      evidence_field: "name + type + rrdatas"
      narrative: "DNS resource record set {rrset.name} (type {rrset.type}) is located in (contained by) Cloud DNS zone {zone.name}."

  # ===========================================================================
  # RULE 2 — STRUCTURAL: Private DNS zone is visible to (located in) VPC networks
  # ===========================================================================
  # RATIONALE: Per edges.yaml, LocatedIn(source=[*], target=[AdministrativeBoundary, Network])
  # allows any source (including DNS) and Network targets. This correctly models that a private
  # zone's VPC attachments define its reachability scope. AttachedTo.source is restricted to
  # [NetworkInterface, BlockStorage, ManagedIdentity, IAMPolicy], which excludes DNS.
  # LocatedIn is schema-conformant for zone→VPC placement.

  - id: gcp-clouddns-private-zone-vpc-attachment
    emits: LocatedIn
    applies_to: [gcp]
    source_config:
      resource_type: "dns.googleapis.com/ManagedZone"
      field: "privateVisibilityConfig.networks"
    where:
      - "zone.visibility == 'private'"
      - "privateVisibilityConfig.networks[] contains at least one networkUrl"
    emit:
      source_type: DNS
      target_type: VirtualNetwork
      source: "<private Cloud DNS managed zone>"
      target: "<VPC network referenced in privateVisibilityConfig.networks[]>"
      api_source: "dns.managedZones.get (GET /dns/v1/projects/{project}/managedZones/{zone})"
      evidence_field: "privateVisibilityConfig.networks[].networkUrl"
      narrative: "Private Cloud DNS zone {zone.name} is located in and resolvable from VPC network {network.name}."
