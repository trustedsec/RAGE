# Azure NetApp Files — Explicit normalization rules
# ---------------------------------------------------------------------------
# Emits structural facts (ContainsCredential) observed directly from ANF
# resource metadata. These are prerequisites for derived rules but not
# themselves attack edges.
#
# NOTE: The action Microsoft.NetApp/netAppAccounts/listCredentials/action
# is documented in Azure NetApp Files AD-join setup (Microsoft ANF docs) but
# is NOT confirmed in the publicly documented Microsoft.NetApp RP operations
# list. Verification of exact action name against official RP operations
# reference is recommended before collection.
# ---------------------------------------------------------------------------

applies_to: [azure]
phase: explicit

rules:

  # --- AD join credential is contained on the ANF account -------------------
  # When an ANF account is configured with an Active Directory connection
  # (properties.activeDirectories is non-empty), the account contains an
  # AccessKey node representing the plaintext AD machine account password
  # stored on the account. This is an explicit structural fact; the derived
  # rule azure-netapp-listcredentials-exposes-ad-cred gates CAPABILITY on
  # HasPermission to listCredentials/action.
  - id: azure-netapp-account-contains-ad-credential
    emits: ContainsCredential
    description: "ANF account with AD join configured contains the machine account password as an AccessKey."
    match:
      - [ ?account, node_info ]
    where:
      - "node_class(?account) == Storage and node_type(?account) == FileStorage"
      - "?account.provider_type == 'Microsoft.NetApp/netAppAccounts'"
      - "?account.properties.activeDirectories is non-empty  # AD join is configured"
    emit:
      source_type: FileStorage
      target_type: AccessKey
      source: ?account
      target: "<AccessKey node representing the AD machine account password>"
      evidence_field: "properties.activeDirectories present on netAppAccount"
      state_logic: >-
        if properties.activeDirectories is empty: DO NOT EMIT;
        else ACTIVE (structural fact — credential node exists as long as account
        has AD join configured). Emit BLOCKED only if the account is deleted.
      confidence: "1.0"
      narrative: >-
        ANF account {account.name} is configured with Active Directory join
        (properties.activeDirectories is non-empty) and contains the plaintext
        AD machine account password as an AccessKey sub-object. This credential
        can be retrieved by a principal with listCredentials/action permission.

  # --- netAppAccounts/write allows AD join configuration injection --------
  # Microsoft.NetApp/netAppAccounts/write permission allows a principal to modify
  # the activeDirectories configuration on the ANF account, potentially injecting
  # a new AD join or redirecting the AD join to an attacker-controlled domain.
  # This is a control-plane action that can alter the credential storage and
  # enable further lateral movement or credential hijacking.
  - id: azure-netapp-account-write-ad-hijack
    emits: CanModifyConfiguration
    description: "netAppAccounts/write permission on ANF account enables AD join configuration modification."
    match:
      - [ ?principal, HasPermission, ?account ]
    where:
      - "node_class(?account) == Storage and node_type(?account) == FileStorage"
      - "?account.provider_type == 'Microsoft.NetApp/netAppAccounts'"
      - "?principal has EFFECTIVE Microsoft.NetApp/netAppAccounts/write at ?account scope (Owner, Contributor, or custom role with netAppAccounts/write)"
    emit:
      source_type: Identity
      target_type: FileStorage
      source: ?principal
      target: ?account
      permissions: ["Microsoft.NetApp/netAppAccounts/write"]
      conditions: [iam_permission]
      state_logic: >-
        if a deny assignment covers netAppAccounts/write at effective scope: BLOCKED;
        else ACTIVE. This is a control-plane action allowing AD join configuration
        mutation, potentially enabling credential hijacking or domain redirection.
      confidence: "0.88"
      derived_from: ["?principal HasPermission ?account"]
      false_positive_note: >-
        netAppAccounts/write grants control-plane mutation of activeDirectories
        configuration on the ANF account. This can be used to set up a new AD join
        (adding a ContainsCredential link to a new AccessKey) or redirect to an
        attacker-controlled domain. CanModifyConfiguration correctly captures the
        configuration-alteration capability; do NOT emit CanAdminister (requires
        full admin scope, not just AD config write).
      narrative: >-
        {principal.name} has ARM write permission on ANF account {account.name}
        (Microsoft.NetApp/netAppAccounts/write) and can modify the Active Directory
        join configuration, potentially injecting a new AD credential or redirecting
        the domain join to an attacker-controlled domain.

# ---------------------------------------------------------------------------
# Note on target node creation:
#   The target AccessKey node is a sub-object of the ANF account. It does not
#   have its own ARM resource ID. The graph collector must create a synthetic
#   node_id derived from the account + "ad-credential" label, e.g.
#   node_id = hash(account_resource_id + "#ad-credential").
#   This node is referenced by subsequent rules (azure-netapp-listcredentials-exposes-ad-cred
#   derives CanReadCredential on this node).
#
# Note on credentialsFor link:
#   The AccessKey node should have a CredentialsFor link to the AD machine
#   identity (modeled as a MachineIdentity in the graph). This link is emitted
#   by a separate explicit rule or the AD identity collector, not here.
# ---------------------------------------------------------------------------
