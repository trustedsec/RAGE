# Azure Event Grid — explicit normalization rules.
# Translate raw collected Microsoft.EventGrid config into common explicit edges
# consumed by /rules/derived/azure/eventgrid.yaml and the provider-agnostic
# linchpins (messaging-chains, can-execute-as, credential-chains, can-control).
#
# These rules match RAW collected resource records (one observed fact → one
# edge). They do NOT combine edges — that is the job of the derived rules.
#
# Resource types covered:
#   Microsoft.EventGrid/topics               (custom topics)
#   Microsoft.EventGrid/systemTopics         (system topics — auto-created per source)
#   Microsoft.EventGrid/domains              (domains grouping multiple topics)
#   Microsoft.EventGrid/domains/topics       (individual topics within a domain)
#   Microsoft.EventGrid/partnerTopics        (partner topics for cross-tenant publish)
#   Microsoft.EventGrid/namespaces           (MQTT / Event Grid namespaces, GA 2024+)
#   Microsoft.EventGrid/namespaces/topicSpaces
#   Microsoft.EventGrid/namespaces/clients
#   Microsoft.EventGrid/namespaces/clientGroups
#   Microsoft.EventGrid/namespaces/permissionBindings
#   Microsoft.EventGrid/eventSubscriptions   (subscriptions on topics, system topics, resources)
#   Microsoft.EventGrid/topics/privateEndpointConnections
#
# All operation strings verified against the Microsoft.EventGrid resource-provider
# operations reference and Azure Event Grid documentation (learn.microsoft.com,
# 2026-09 snapshot).

rules:

  # ---------------------------------------------------------------------------
  # Structural: containment and placement
  # ---------------------------------------------------------------------------

  - id: azure-evg-rg-contains-topic
    emits: Contains
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/topics"
      field: "id"
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<resource group from id>"
      target: "<Event Grid custom topic>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/topics"
      evidence_field: "id"
      narrative: "{rg.name} contains Event Grid custom topic {topic.name}."

  - id: azure-evg-rg-contains-systemtopic
    emits: Contains
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/systemTopics"
      field: "id"
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<resource group from id>"
      target: "<Event Grid system topic>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/systemTopics"
      evidence_field: "id"
      narrative: "{rg.name} contains Event Grid system topic {topic.name}."

  - id: azure-evg-rg-contains-domain
    emits: Contains
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/domains"
      field: "id"
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<resource group from id>"
      target: "<Event Grid domain>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/domains"
      evidence_field: "id"
      narrative: "{rg.name} contains Event Grid domain {domain.name}."

  - id: azure-evg-domain-contains-topic
    emits: CanAdminister
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/domains/topics"
      field: "id"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal with administrative access to the Event Grid domain>"
      target: "<domain topic>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/domains/{domain}/topics"
      evidence_field: "id"
      note: >-
        An Event Grid domain is a Messaging resource (EventBus), not an AdministrativeBoundary.
        The logical containment relationship is replaced with CanAdminister: a principal with
        admin access to the domain has control over all domain topics. This is more semantically
        accurate than a structural Contains edge, which is reserved for AdministrativeBoundary.source.
        Alternatively, if the domain-to-topic containment is purely structural recon, it can be
        removed entirely in favor of resource-group-level Contains edges (azure-evg-rg-contains-domain).
      narrative: "A principal with administrative control of Event Grid domain {domain.name} can administer all domain topics, including {topic.name}."

  - id: azure-evg-topic-located-in-region
    emits: LocatedIn
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/topics"
      field: "location"
    emit:
      source_type: "*"
      target_type: AdministrativeBoundary
      source: "<Event Grid topic>"
      target: "<Azure region>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/topics"
      evidence_field: "location"
      narrative: "{topic.name} is located in Azure region {region.name}."

  - id: azure-evg-systemtopic-located-in-region
    emits: LocatedIn
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/systemTopics"
      field: "location"
    emit:
      source_type: "*"
      target_type: AdministrativeBoundary
      source: "<Event Grid system topic>"
      target: "<Azure region>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/systemTopics"
      evidence_field: "location"
      narrative: "{systemTopic.name} is located in Azure region {region.name}."

  # ---------------------------------------------------------------------------
  # ExecutesAs: delivery managed identity on topics and system topics
  # When a topic uses an MI for outbound delivery to private/Entra-auth endpoints.
  # ---------------------------------------------------------------------------

  # REMOVED: azure-evg-topic-executes-as-system-mi, azure-evg-topic-executes-as-user-mi,
  # azure-evg-systemtopic-executes-as-system-mi, azure-evg-systemtopic-executes-as-user-mi
  # (FIX finding [high]). These rules emitted ExecutesAs with source: EventBus (Messaging),
  # but ExecutesAs.source must be [Compute] per schema/edges.yaml. The delivery MI is used
  # for outbound delivery authentication only, not code execution on Event Grid itself.
  #
  # The MI binding fact is implicit in the identity field of the topic/systemTopic resource.
  # The security value of the delivery MI is expressed through:
  #   (a) The MI's own HasPermission/HasRole edges (its access to downstream resources)
  #   (b) CanModifyConfiguration on the subscription (topic admin can redirect endpoint)
  #   (c) Downstream Compute resources that consume the event stream with their own ExecutesAs
  # No structural AttachedTo edge is needed here — the identity binding is metadata on the
  # EventBus node itself.

  # ---------------------------------------------------------------------------
  # CanTrigger: event subscription → consumer (the Phase-10 binding fact)
  # An active event subscription routes topic events to a compute consumer.
  # messaging-chains messaging-publish-triggers-consumer consumes this together
  # with CanWriteData(?publisher, ?topic) to derive CanTrigger(?publisher, ?consumer).
  # ---------------------------------------------------------------------------

  - id: azure-evg-subscription-binding
    emits: CanTrigger
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/eventSubscriptions"
      field: "properties.destination.endpointType"
    where:
      - "properties.provisioningState == Succeeded"
      - "properties.destination.endpointType in [WebHook, AzureFunction, ServiceBusQueue, ServiceBusTopic, StorageQueue, EventHub, HybridConnection]"
    emit:
      source_type: EventBus
      target_type: Compute
      source: "<topic or system topic that the subscription is on (EventBus node)>"
      target: "<consumer at the destination endpoint — ServerlessFunction (AzureFunction), Webhook (WebHook), Queue (ServiceBusQueue/StorageQueue), Topic (ServiceBusTopic), GenericMessaging (EventHub), GenericCompute (HybridConnection)>"
      api_source: "GET <resource>/providers/Microsoft.EventGrid/eventSubscriptions"
      evidence_field: "properties.destination.properties.resourceId OR properties.destination.endpointUrl"
      note: >-
        Event type filter at properties.filter.includedEventTypes narrows which events
        reach the consumer. If the filter is a strict allowlist (e.g., only
        Microsoft.Storage.BlobCreated), record it on the edge conditions so the
        linter can downgrade to CONDITIONAL(condition_expression) when the attacker
        cannot publish a matching event type. AzureFunction endpoints reference the
        Function app resource ID — resolve to a ServerlessFunction node. ServiceBusQueue
        and ServiceBusTopic resolve to Queue/Topic nodes (further consumers may chain).
      narrative: "Event Grid subscription routes events from {source.name} to {target.name} (endpointType: {endpointType}); any event published to the topic triggers the consumer."

  # ---------------------------------------------------------------------------
  # ExposesCredential: topic access keys (key1, key2) exist on every custom topic
  # and domain (not system topics). Any principal with listKeys/action can retrieve
  # them — modeled via azure-evg-list-keys (CanReadSecret) in derived rules.
  # This normalization records the structural EXISTENCE of the key material.
  # ---------------------------------------------------------------------------

  - id: azure-evg-topic-key-exposes-credential
    emits: ExposesCredential
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/topics"
      field: "properties.endpoint"
    where:
      - "properties.endpoint is non-empty"
      - "properties.kind != SystemTopic"
      - "topic is of type Microsoft.EventGrid/topics (custom topic, not systemTopics resource)"
    emit:
      source_type: Messaging
      target_type: Credential
      source: "<Event Grid custom topic (EventBus/Messaging)>"
      target: "<topic access key (AccessKey) — key1 and key2; existence modeled, value not collected>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/topics/{topic}"
      evidence_field: "properties.endpoint (presence confirms topic is active and keys exist)"
      note: >-
        The key VALUES are not collected — calling topics/listKeys/action in a read-only
        collector would retrieve active secrets. This edge records that the key MATERIAL
        exists on the topic. The CanReadSecret edge (azure-evg-list-keys in derived rules)
        represents the permission to retrieve it. Source is Messaging (EventBus is a subtype).
        Do NOT emit for Microsoft.EventGrid/systemTopics resources — system topics do not
        expose user-publishable access keys.
      narrative: "Event Grid topic {source.name} has access keys (key1, key2) retrievable via topics/listKeys/action; any holder of those keys can publish arbitrary events to the topic."

  - id: azure-evg-domain-key-exposes-credential
    emits: ExposesCredential
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/domains"
      field: "properties.endpoint"
    where:
      - "properties.endpoint is non-empty"
    emit:
      source_type: Messaging
      target_type: Credential
      source: "<Event Grid domain (EventBus/Messaging)>"
      target: "<domain access key (AccessKey) — key1 and key2; existence modeled, value not collected>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/domains/{domain}"
      evidence_field: "properties.endpoint"
      note: >-
        Domain keys have broader blast radius than topic keys: a domain key authenticates
        publish to ALL topics within the domain. The target AccessKey node should carry a
        scope annotation indicating it grants domain-wide publish. Do NOT collect the actual
        key values (domains/listKeys/action).
      narrative: "Event Grid domain {source.name} has access keys (key1, key2) retrievable via domains/listKeys/action; the domain key grants publish access to ALL topics in the domain, triggering all subscribers."

  # ---------------------------------------------------------------------------
  # HasPolicy: private endpoint connections on topics (network isolation fact)
  # ---------------------------------------------------------------------------

  - id: azure-evg-topic-private-endpoint
    emits: HasPolicy
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/topics/privateEndpointConnections"
      field: "properties.privateLinkServiceConnectionState.status"
    where:
      - "properties.privateLinkServiceConnectionState.status == Approved"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<Event Grid topic>"
      target: "<private endpoint connection (GenericPolicy or PrivateEndpoint node)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/topics/{topic}/privateEndpointConnections"
      evidence_field: "properties.privateLinkServiceConnectionState.status"
      note: >-
        An approved private endpoint connection records that the topic restricts publish access
        to within the VNet. This fact feeds the network reachability analysis: if
        publicNetworkAccess=Disabled AND this private endpoint exists, internet-based publish
        (azure-evg-topic-public) should be BLOCKED; VNet-resident attackers remain in scope.
      narrative: "Event Grid topic {source.name} has an approved private endpoint connection {target.name}; publish access requires VNet reachability."

  # ---------------------------------------------------------------------------
  # HasPolicy: publicNetworkAccess flag on topics (drives internet exposure check)
  # ---------------------------------------------------------------------------

  - id: azure-evg-topic-network-access-policy
    emits: HasPolicy
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/topics"
      field: "properties.publicNetworkAccess"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<Event Grid topic>"
      target: "<network access policy (GenericPolicy node)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/topics/{topic}"
      evidence_field: "properties.publicNetworkAccess (Enabled | Disabled)"
      note: >-
        Feeds azure-evg-topic-public (ExposedToInternet) in derived rules:
        publicNetworkAccess=Enabled → the topic is internet-reachable for publishing (ACTIVE
        if keys not disabled); publicNetworkAccess=Disabled → internet publishing BLOCKED.
        Also feeds azure-evg-publish-via-key CONDITIONAL(network_reachability) gate.
      narrative: "Event Grid topic {source.name} has publicNetworkAccess={value}; Disabled blocks internet-based event publishing."

  - id: azure-evg-topic-local-auth-policy
    emits: HasPolicy
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/topics"
      field: "properties.disableLocalAuth"
    where:
      - "properties.disableLocalAuth == true"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<Event Grid topic>"
      target: "<local auth disabled policy (GenericPolicy node)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/topics/{topic}"
      evidence_field: "properties.disableLocalAuth"
      note: >-
        disableLocalAuth=true means key-based publish (aeg-sas-key) is rejected; only Entra
        token-based publish (events/send/action) is accepted. Feeds azure-evg-topic-public
        BLOCKED gate and azure-evg-publish-via-key BLOCKED gate when true.
      narrative: "Event Grid topic {source.name} has disableLocalAuth=true; SAS key / access-key-based event publishing is disabled; only Entra token publish (events/send/action) is accepted."

  # ---------------------------------------------------------------------------
  # ContainsSecret: events that carry credential material
  # (analyst-driven / schema-inspection annotation — emit when evidence shows
  # event payloads include connection strings, tokens, API keys, etc.)
  # ---------------------------------------------------------------------------

  - id: azure-evg-event-contains-secret
    emits: ContainsSecret
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/topics"
      field: "properties.inputSchema"
    where:
      - "analyst has confirmed via schema inspection or payload sampling that event data fields include credential material (connection strings, access tokens, API keys, SAS URIs, passwords)"
    emit:
      source_type: Messaging
      target_type: "*"
      source: "<Event Grid topic or system topic (EventBus/Messaging)>"
      target: "<secret embedded in event payload (Secret/Credential node)>"
      api_source: "Topic schema from properties.inputSchema + analyst payload sampling"
      evidence_field: "Event payload schema or sampled event data confirming credential material"
      note: >-
        Do NOT emit speculatively. Emit only when concrete evidence shows event payloads
        carry secret material. Common sources: Azure Key Vault system topics emit events
        with secret/key/certificate metadata (not the secret values); Storage system topics
        emit blob names and SAS URIs (a SAS URI IS a credential). Custom topics may embed
        application-specific tokens. credential-chains read-secret-yields-identity will fire
        if a CanReadData path exists to this event source and the secret is a CredentialsFor target.
      narrative: "Events published to {source.name} contain credential material ({secret.type}) in the event payload; any principal that can read the event stream (via subscription redirect or queue consumer access) obtains those credentials."

  # ---------------------------------------------------------------------------
  # Partner topic: cross-tenant trust (structural binding fact)
  # partnerTopics record which external partner is authorized to publish.
  # The CrossTenantTrust edge is emitted by derived rule azure-evg-partner-config-cross-tenant.
  # This explicit rule records the PartnerTopic existence and its activation state.
  # ---------------------------------------------------------------------------

  - id: azure-evg-partner-topic-activated
    emits: HasPolicy
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/partnerTopics"
      field: "properties.activationState"
    where:
      - "properties.activationState == Activated"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<Event Grid partner topic>"
      target: "<partner activation policy (GenericPolicy — represents the cross-tenant publish trust)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/partnerTopics"
      evidence_field: "properties.activationState + properties.partnerRegistrationImmutableId"
      note: >-
        An Activated partner topic signals that the named external partner
        (properties.partnerRegistrationImmutableId from an external Entra tenant) is authorized
        to publish events into this subscription's partner topic. Feeds
        azure-evg-partner-topic-cross-tenant-trust (CrossTenantTrust) explicit rule below.
        Record properties.partnerRegistrationImmutableId on the edge evidence so the
        external tenant can be identified for path-finding.
      narrative: "Event Grid partner topic {source.name} is Activated; external partner (registrationId: {properties.partnerRegistrationImmutableId}) from an external Entra tenant is authorized to publish events into this subscription."

  - id: azure-evg-partner-topic-cross-tenant-trust
    emits: CrossTenantTrust
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/partnerTopics"
      field: "properties.activationState"
    where:
      - "properties.activationState == Activated"
      - "properties.partnerRegistrationImmutableId is non-empty"
    emit:
      source_type: Tenant
      target_type: Tenant
      source: "<customer Entra tenant (from subscription)"
      target: "<external partner Entra tenant (identified by partnerRegistrationImmutableId)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/partnerTopics"
      evidence_field: "properties.activationState + properties.partnerRegistrationImmutableId"
      note: >-
        When a partner topic is Activated, the customer subscription establishes an explicit
        cross-tenant trust relationship with the external partner's Entra tenant. The partner
        is authorized to publish events into this subscription via the partner topic.
        Source is the customer Tenant boundary; target is the external partner Tenant.
      narrative: "Event Grid partner topic {source.name} establishes cross-tenant trust: customer Entra tenant {source.tenant} trusts external partner Entra tenant {target.tenant} (registrationId: {properties.partnerRegistrationImmutableId}) to publish events."

  # ---------------------------------------------------------------------------
  # MQTT namespace: client certificate CA trust (cross-boundary publish via cert)
  # ---------------------------------------------------------------------------

  - id: azure-evg-namespace-ca-cert
    emits: ContainsSecret
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/namespaces/caCertificates"
      field: "properties.encodedCertificate"
    where:
      - "properties.encodedCertificate is non-empty (CA certificate is loaded)"
    emit:
      source_type: GenericMessaging
      target_type: "*"
      source: "<Event Grid namespace (GenericMessaging / Messaging)"
      target: "<CA certificate (Certificate node) trusted for MQTT client auth>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/namespaces/{namespace}/caCertificates"
      evidence_field: "properties.encodedCertificate (PEM-encoded CA cert; thumbprint, not value)"
      note: >-
        An Event Grid namespace that trusts an external CA certificate allows any MQTT client
        presenting a certificate signed by that CA to connect and publish/subscribe to topic
        spaces they are permitted on (via permission bindings). If the CA is external and
        attacker-controlled, this is a cross-boundary trust allowing MQTT publish from the
        external domain. Record the issuer/thumbprint as the Certificate node identifier.
        Source is GenericMessaging (a Messaging subtype), which is in ContainsSecret.source set.
      narrative: "Event Grid namespace {source.name} trusts CA certificate {target.name} for MQTT client authentication; clients presenting a cert signed by this CA can publish to authorized topic spaces."

  # ---------------------------------------------------------------------------
  # MQTT permission binding: topic space publish/subscribe authorization
  # ---------------------------------------------------------------------------

  - id: azure-evg-namespace-permission-binding
    emits: HasPolicy
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventGrid/namespaces/permissionBindings"
      field: "properties.permission"
    where:
      - "properties.permission in [Publisher, Subscriber]"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<MQTT client group (Group node)>"
      target: "<topic space permission binding (GenericPolicy node)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventGrid/namespaces/{namespace}/permissionBindings"
      evidence_field: "properties.permission + properties.topicSpaceName + properties.clientGroupName"
      note: >-
        A permission binding grants the client group (Publisher or Subscriber) permission
        on the named topic space pattern. Publisher permission → any client in the group can
        send MQTT messages to matching topics (CanWriteData equivalent in the MQTT plane).
        Subscriber permission → can receive messages from matching topics (CanReadData).
        Record clientGroupName and topicSpaceName for downstream path-finding.
      narrative: "Permission binding {target.name} grants client group {source.name} {properties.permission} permission on topic space {properties.topicSpaceName} in Event Grid namespace."
