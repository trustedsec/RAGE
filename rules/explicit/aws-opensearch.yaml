# AWS OpenSearch Service — Explicit normalization rules
# ---------------------------------------------------------------------------
# These rules normalize raw collected domain records into explicit graph edges
# before the derived rules in /rules/derived/aws/opensearch.yaml run.
#
# Adapter inputs:
#   es:ListDomainNames         — enumerate domain names in the account
#   es:DescribeDomain           — full domain config (endpoint, VPCOptions,
#                                 AdvancedSecurityOptions, AccessPolicies, etc.)
#   es:DescribeDomains          — batch describe; same fields
#   IAM effective-permission eval on es:* / es:ESHttp* per domain ARN
#
# Node type emitted: SearchService (class Data)
# Provider type:     AWS::OpenSearchService::Domain
# ---------------------------------------------------------------------------

rules:

  # --- Config read: domain configuration and endpoint (recon) ----------------
  - id: aws-opensearch-can-read-domain-config
    emits: CanRead
    applies_to: [aws]
    match_effective_permission:
      action: ["es:DescribeDomain", "es:DescribeDomains"]
      resource_type: "AWS::OpenSearchService::Domain"
    emit:
      target_type: "*"
      source_type: Identity
      source: "<principal>"
      target: "<domain (SearchService)>"
      permissions: ["es:DescribeDomain"]
      narrative: >-
        {principal.name} can read the configuration and endpoint of OpenSearch
        domain {domain.name} (es:DescribeDomain) — recon for the endpoint URL,
        VPC/FGAC settings, and access policy.

  # --- CanAdminister: full domain control via UpdateDomainConfig --------------
  - id: aws-opensearch-can-administer
    emits: CanAdminister
    applies_to: [aws]
    match_effective_permission:
      action: "es:UpdateDomainConfig"
      resource_type: "AWS::OpenSearchService::Domain"
    emit:
      target_type: "*"
      source_type: Identity
      source: "<principal>"
      target: "<domain (SearchService)>"
      permissions: ["es:UpdateDomainConfig"]
      narrative: >-
        {principal.name} can administer OpenSearch domain {domain.name}
        (es:UpdateDomainConfig), including changing access policies, FGAC settings,
        VPC configuration, and resetting the internal master-user password.

  # --- CanModifyConfiguration: UpdateDomainConfig (config-level changes) ------
  - id: aws-opensearch-can-modify-configuration
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      action: "es:UpdateDomainConfig"
      resource_type: "AWS::OpenSearchService::Domain"
    emit:
      target_type: "*"
      source_type: Identity
      source: "<principal>"
      target: "<domain (SearchService)>"
      permissions: ["es:UpdateDomainConfig"]
      narrative: >-
        {principal.name} can modify configuration of OpenSearch domain {domain.name}
        (es:UpdateDomainConfig) — access policy, FGAC settings, VPC, encryption,
        master user.

  # --- HasPolicy: domain access policy (resource-based policy) ----------------
  - id: aws-opensearch-resource-policy
    emits: HasPolicy
    applies_to: [aws]
    match_record:
      resource_type: "AWS::OpenSearchService::Domain"
      field: "DomainStatus.AccessPolicies"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<domain (SearchService)>"
      target: "<domain access policy (ResourcePolicy)>"
      api_source: "es:DescribeDomain"
      evidence_field: "DomainStatus.AccessPolicies"
      narrative: >-
        {domain.name} has an access policy governing IAM-based access to its
        OpenSearch HTTP endpoint.


  # --- CrossAccountTrust: domain access policy grants ESHttp* to external -----
  - id: aws-opensearch-cross-account-policy-trust
    emits: CrossAccountTrust
    applies_to: [aws]
    match_record:
      resource_type: "AWS::OpenSearchService::Domain"
      field: "DomainStatus.AccessPolicies"
    where:
      - "at least one Statement principal is in a different account than the domain"
      - "Effect == Allow"
      - "Action includes es:ESHttpGet, es:ESHttpPost, es:ESHttpPut, es:ESHttpDelete, or es:ESHttpHead (or es:* wildcard)"
    emit:
      source: "<domain access policy (ResourcePolicy)>"
      target: "<foreign account principal (ExternalIdentity)>"
      api_source: "es:DescribeDomain"
      evidence_field: "DomainStatus.AccessPolicies"
      narrative: >-
        The domain access policy for {domain.name} grants es:ESHttp* to
        {external.name} in account {foreign_account}, enabling cross-account data
        access without a role assumption hop.
