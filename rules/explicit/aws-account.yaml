# Explicit (normalization) rules for AWS Account Management.
# Turn raw collected config into explicit edges conforming to schema/edges.yaml.
# These feed the derived rules in /rules/derived/aws/account.yaml.
#
# Anti-duplication: the Organizations Contains tree and SCP attachment as a
# guardrail Policy node are normalized by the organizations adapter. Here we add
# only the OrganizationAccountAccessRole trust, the account<->SCP scope-binding
# reference this service consumes, and the account-attribute permission triggers.

rules:

  # --- OrganizationAccountAccessRole trust policy (the mgmt->member admin fact) --
  - id: aws-account-oaar-trust-policy
    emits: HasPolicy
    applies_to: [aws]
    match_record:
      resource_type: "AWS::IAM::Role"
      field: "AssumeRolePolicyDocument"
    where:
      - "RoleName == 'OrganizationAccountAccessRole'  # or the org's configured cross-account admin role"
      - "AssumeRolePolicyDocument.Statement[].Principal.AWS matches arn:aws:iam::<management-account-id>:root"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<OrganizationAccountAccessRole node>"
      target: "<TrustPolicy node parsed from AssumeRolePolicyDocument>"
      api_source: "iam:GetRole"
      evidence_field: "AssumeRolePolicyDocument"
      narrative: "{role.name} trusts the management account root (arn:aws:iam::<mgmt>:root) via its assume-role trust policy."

  # --- OAAR carries AdministratorAccess (needed to call it an admin path) --------
  - id: aws-account-oaar-admin-policy
    emits: HasPolicy
    applies_to: [aws]
    match_record:
      resource_type: "AWS::IAM::Role"
      field: "AttachedManagedPolicies"
    where:
      - "RoleName == 'OrganizationAccountAccessRole'"
      - "AttachedManagedPolicies[].PolicyArn == 'arn:aws:iam::aws:policy/AdministratorAccess'"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<OrganizationAccountAccessRole node>"
      target: "<AdministratorAccess managed policy node>"
      api_source: "iam:ListAttachedRolePolicies"
      evidence_field: "AttachedManagedPolicies"
      narrative: "{role.name} has AdministratorAccess attached (default for OrganizationAccountAccessRole)."

  # --- Account <-> attached SCP scope-binding (consumed by leave-org escape) -----
  # The SCP Policy node itself is created by the organizations adapter; this rule
  # only records the account's HasPolicy reference to it so the derived
  # leave-org-escapes-scp rule can find the guardrail attached to THIS account.
  - id: aws-account-attached-scp
    emits: HasPolicy
    applies_to: [aws]
    match_record:
      resource_type: "AWS::Organizations::Account"
      field: "AttachedSCPs"
    where:
      - "an SCP is attached to the account or an OU on its path (organizations:ListPoliciesForTarget, filter=SERVICE_CONTROL_POLICY)"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<Account node>"
      target: "<ServiceControlPolicy guardrail node (created by organizations adapter)>"
      api_source: "organizations:ListPoliciesForTarget | organizations:ListTargetsForPolicy"
      evidence_field: "AttachedSCPs"
      narrative: "{account.name} is in scope of SCP {policy.name}."

  # --- Account-attribute permission triggers (root-recovery primitives) ----------
  # These are effective-permission normalizations (not raw config): the edge
  # exists only if the principal's EFFECTIVE permissions include the action on the
  # account resource. They feed aws-account-root-credential-reset.
  - id: aws-account-can-put-contact
    emits: HasPermission
    applies_to: [aws]
    match_effective_permission:
      action: "account:PutContactInformation"
      resource_type: "AWS::Account::Account"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Account node>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["account:PutContactInformation"]
      narrative: "{principal.name} can change the primary contact information of {account.name} (account:PutContactInformation)."

  - id: aws-account-can-put-alternate-contact
    emits: HasPermission
    applies_to: [aws]
    match_effective_permission:
      action: "account:PutAlternateContact"
      resource_type: "AWS::Account::Account"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Account node>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["account:PutAlternateContact"]
      narrative: "{principal.name} can set an alternate (Security/Billing/Operations) contact on {account.name} (account:PutAlternateContact)."

  - id: aws-account-can-start-primary-email-update
    emits: HasPermission
    applies_to: [aws]
    match_effective_permission:
      action: "account:StartPrimaryEmailUpdate"
      resource_type: "AWS::Account::Account"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Account node>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["account:StartPrimaryEmailUpdate"]
      narrative: "{principal.name} can start a primary-email change on {account.name} (account:StartPrimaryEmailUpdate), redirecting root recovery."

  # --- Leave / remove from org permission triggers (SCP-escape primitives) -------
  - id: aws-account-can-leave-org
    emits: HasPermission
    applies_to: [aws]
    match_effective_permission:
      action: "organizations:LeaveOrganization"
      resource_type: "AWS::Organizations::Account"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Account node (member, self)>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["organizations:LeaveOrganization"]
      narrative: "{principal.name} can make {account.name} leave its organization (organizations:LeaveOrganization)."

  - id: aws-account-can-remove-from-org
    emits: HasPermission
    applies_to: [aws]
    match_effective_permission:
      action: "organizations:RemoveAccountFromOrganization"
      resource_type: "AWS::Organizations::Account"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal (management-account)>"
      target: "<member Account node>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["organizations:RemoveAccountFromOrganization"]
      narrative: "{principal.name} can remove {account.name} from the organization (organizations:RemoveAccountFromOrganization)."

  # ===========================================================================
  # EXPLICIT-NATURE MATERIALIZATIONS
  # ---------------------------------------------------------------------------
  # The following edges (CrossAccountTrust, CanResetCredential, CanTakeOwnership,
  # CanModifyConfiguration) are nature: explicit in schema/edges.yaml, so per
  # RULE-FORMAT.md they may NOT be emitted from a /rules/derived/ file. They are
  # normalized HERE off the triggers above; the derived file (aws/account.yaml)
  # MATCHES these explicit edges rather than emitting them.
  # ===========================================================================

  # --- OAAR trust re-expressed as a walkable CrossAccountTrust FACT -------------
  # aws-account-oaar-trust-policy (above) records the raw HasPolicy/TrustPolicy.
  # This rule normalizes that same AssumeRolePolicyDocument into the walkable
  # cross-boundary CrossAccountTrust edge (Role -> management Account) that the
  # derived rule aws-account-enter-via-oaar consumes.
  - id: aws-account-oaar-crossaccount-trust
    emits: CrossAccountTrust
    applies_to: [aws]
    match_record:
      resource_type: "AWS::IAM::Role"
      field: "AssumeRolePolicyDocument"
    where:
      - "RoleName == 'OrganizationAccountAccessRole'  # or the org's configured cross-account admin role"
      - "AssumeRolePolicyDocument.Statement[].Principal.AWS matches arn:aws:iam::<management-account-id>:root"
      - "the role carries AdministratorAccess (see aws-account-oaar-admin-policy) — default for OAAR"
    emit:
      source: "<OrganizationAccountAccessRole node (member account) — a Role>"
      target: "<management Account node named by the trust Principal.AWS root ARN>"
      api_source: "iam:GetRole"
      evidence_field: "AssumeRolePolicyDocument.Statement[].Principal.AWS"
      permissions: []
      conditions: [trust_relationship]
      false_positive_note: >-
        OrganizationAccountAccessRole is created ONLY in accounts that
        Organizations CREATED (organizations:CreateAccount), NOT in accounts
        INVITED into the org, and the role name is customizable. Emit ONLY when
        iam:GetRole actually returns the role with a trust naming the management
        root; never assume it exists. If the trust was edited to drop mgmt-root
        (CanModifyTrust abuse) the fact is stale -> do not emit.
      narrative: >-
        OrganizationAccountAccessRole in member account {source.account} trusts
        the management account {target.name} root with AdministratorAccess
        (arn:aws:iam::<mgmt>:root).

  # --- Root-user credential reset via contact/primary-email redirect -----------
  # Materializes CanResetCredential off the account:Put*/StartPrimaryEmailUpdate
  # HasPermission triggers above. Target is the account's ROOT user, modeled as a
  # HumanIdentity (root is a human-backed interactive login, not a service User);
  # HumanIdentity is in CanResetCredential's target set [Identity, HumanIdentity].
  - id: aws-account-root-credential-reset
    emits: CanResetCredential
    applies_to: [aws]
    match_effective_permission:
      any_action:
        - "account:PutContactInformation"
        - "account:PutAlternateContact"
        - "account:StartPrimaryEmailUpdate"
      resource_type: "AWS::Account::Account"
    where:
      - "?principal has EFFECTIVE account:PutContactInformation OR account:PutAlternateContact (Security) OR account:StartPrimaryEmailUpdate on the Account"
      - "no SCP denies the account:Put*/StartPrimaryEmailUpdate action at the Account scope (else BLOCKED)"
    emit:
      source_type: Identity
      target_type: HumanIdentity
      source: "<principal>"
      target: "<root HumanIdentity>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["account:PutContactInformation", "account:PutAlternateContact", "account:StartPrimaryEmailUpdate"]
      conditions: [scp_or_org_policy, condition_expression]
      state_logic: >-
        CONDITIONAL(reset-flow) by default: writing contact/primary-email
        REDIRECTS the root recovery channel, but completing the reset is an
        out-of-band step (console 'Forgot password' email, and for
        StartPrimaryEmailUpdate an OTP delivered to the NEW attacker-controlled
        address consumed via account:AcceptPrimaryEmailUpdate). Never ACTIVE on
        the write permission alone. BLOCKED(scp_or_org_policy) if an SCP denies
        the account:Put*/email actions.
      false_positive_note: >-
        The write permission is necessary but not sufficient: the actual root
        password reset requires driving the email/OTP recovery flow. Keep
        CONDITIONAL(reset-flow); do NOT mark ACTIVE. StartPrimaryEmailUpdate
        additionally needs AcceptPrimaryEmailUpdate with the OTP sent to the new
        address. In centrally-managed orgs member self-service for account
        contacts is often SCP-denied -> BLOCKED. Root MFA does not block the
        password reset itself but blocks final sign-in; note but do not silently
        upgrade past it.
      narrative: >-
        {principal.name} can change the recovery contact/primary email of the
        account (account:PutContactInformation / PutAlternateContact /
        StartPrimaryEmailUpdate) and complete the root-user password reset,
        taking over the {target.name} root credentials.

  # --- Root takeover == effective ownership of the Account ---------------------
  # Materializes CanTakeOwnership off the CanResetCredential(root) edge above.
  # Root sits ABOVE all IAM policy, so owning root == controlling the whole
  # account. Emitted here (explicit nature) so the derived file need not; the
  # Controls(Account) roll-up is left to can-control's control-via-admin.
  - id: aws-account-root-recovery-ownership
    emits: CanTakeOwnership
    applies_to: [aws]
    match:
      - [ ?principal, CanResetCredential, ?root ]
    where:
      - "node_type(?root) == HumanIdentity and ?root is the root user of an Account"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Account of ?root>"
      api_source: "derived from CanResetCredential(root) — see aws-account-root-credential-reset"
      permissions: ["account:PutContactInformation", "account:PutAlternateContact", "account:StartPrimaryEmailUpdate"]
      conditions: [scp_or_org_policy, condition_expression]
      state_logic: >-
        Inherit from the contributing CanResetCredential: CONDITIONAL(reset-flow)
        while the reset is unrealized, BLOCKED if an SCP denies the underlying
        account:Put* actions. Root sits ABOVE all IAM policy, so owning root ==
        controlling the whole account; the only guardrail is an SCP restricting
        root or the account:Put* actions.
      false_positive_note: >-
        Only as strong as the root reset itself (CONDITIONAL(reset-flow)); do not
        promote to ACTIVE just because the write permission exists. If the
        account is a member with an SCP restricting root actions the ownership is
        partial -> keep the SCP gate. Feeds can-control's control-via-admin
        roll-up (CanTakeOwnership over an AdministrativeBoundary => Controls(Account)).
      narrative: >-
        {principal.name} can take over the root user of {target.name} and thereby
        own the account outright, beyond the reach of any IAM policy.

  # --- Leave/remove from org = escape the SCP guardrail scope -------------------
  # Materializes CanModifyConfiguration over the SCP scope-BINDING off the
  # leave/remove HasPermission triggers above. This is the reparent/move-out
  # input consumed by hierarchy-chains rule 3's optional clause
  # ([?principal, CanModifyConfiguration, ?scope_binding]); rule 3 owns the
  # BLOCKED->ACTIVE upgrade of the edges the SCP was suppressing. NOT re-emitted
  # in the derived file.
  - id: aws-account-leave-org-escapes-scp
    emits: CanModifyConfiguration
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?account ]
      - [ ?account, HasPolicy, ?scp ]
    where:
      - "node_class(?account) == AdministrativeBoundary and node_type(?account) == Account"
      - "node_type(?scp) == ServiceControlPolicy   # an SCP is actually attached to ?account (or its OU)"
      - "?principal has EFFECTIVE organizations:LeaveOrganization (member-side) OR organizations:RemoveAccountFromOrganization (management-side) for ?account"
      - "no SCP denies the leave/remove action itself at ?account scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      # Target is the SCP guardrail's SCOPE-BINDING (the attachment of ?scp to
      # ?account) — the reparent/move-out input to hierarchy-chains rule 3.
      target: "<scope-binding of ?scp on ?account>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["organizations:LeaveOrganization", "organizations:RemoveAccountFromOrganization"]
      conditions: [scp_or_org_policy, service_state]
      state_logic: >-
        ACTIVE when the leave/remove action is effectively held and NOT itself
        SCP-denied and the account is standalone-ready. CONDITIONAL(service_state)
        when RemoveAccountFromOrganization would fail because the member is not
        standalone-ready (billing/contact info incomplete). BLOCKED(scp_or_org_policy)
        when an SCP denies organizations:LeaveOrganization (standard landing-zone
        hardening) -- and note the circularity: you cannot leave to escape an SCP
        that denies leaving, so this edge cannot self-upgrade the very SCP
        blocking it.
      false_positive_note: >-
        Fire ONLY when an SCP is genuinely attached to ?account (else there is no
        guardrail to escape and this is mere availability impact -- model as
        CanDelete, not a path). LeaveOrganization is member-side and very commonly
        SCP-denied in hardened orgs -> BLOCKED. RemoveAccountFromOrganization is
        management-side and requires the member to be standalone-ready (complete
        billing/contact) or the API fails -> CONDITIONAL(service_state). Do not
        emit for the management account itself (it cannot leave its own org). The
        BLOCKED->ACTIVE upgrade of the suppressed edges is owned by
        hierarchy-chains rule 3, NOT here. The complementary POLICY-EDIT branch
        (organizations:UpdatePolicy/DetachPolicy/DeletePolicy/DisablePolicyType,
        organizations:MoveAccount to an OU without the SCP) is emitted by the
        organizations adapter as CanModifyPolicy over ?scp -- CITED, not here.
      narrative: >-
        {principal.name} can pull account {account.name} out of the organization
        (organizations:LeaveOrganization / RemoveAccountFromOrganization),
        detaching it from SCP {scp.name} and every guardrail that SCP imposes.
