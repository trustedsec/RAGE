# Explicit (normalization) rules — Azure App Configuration.
# Turn raw collected Microsoft.AppConfiguration config into explicit edges the
# Phase-5 derived rules (/rules/derived/azure/appconfig.yaml) and the
# provider-agnostic credential-chains consume. All actions/fields verified against
# the App Configuration Entra-authorization reference, access-key how-to, and
# Key Vault reference tutorial (learn.microsoft.com). Quote scalars containing ':'.

rules:

  # --- A store contains its key-values (structural) --------------------------
  - id: azure-appconfig-contains-keyvalue
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.AppConfiguration/configurationStores/keyValues", field: "key"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<configuration store node>"
      target: "<key-value node>"
      api_source: "az appconfig kv list | data-plane GET /kv"
      evidence_field: "key/label"
      narrative: "{store.name} contains key-value {keyvalue.name}."

  # --- A secret-bearing key-value -> ContainsSecret -------------------------
  # Only when the VALUE is credential material (connection string / client secret /
  # API key). Plain config (feature flags, colors) is NOT a secret.
  # Source is the store's Data-plane node (schema: ContainsSecret source
  # [Storage, Data, Compute, Messaging] — ManagementService is excluded).
  - id: azure-appconfig-keyvalue-is-secret
    emits: ContainsSecret
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.AppConfiguration/configurationStores/keyValues", field: "value"}
    where:
      - "contentType != 'application/vnd.microsoft.appconfig.keyvaultref+json'"
      - "value is classified credential material (connection-string pattern, client-secret/appId pairing, API-key heuristic)"
    emit:
      source: "<store data-plane node (class Data)>"
      target: "<key-value Secret/ConnectionString node>"
      api_source: "az appconfig kv list"
      evidence_field: "value + contentType"
      narrative: "{store.name}'s data plane holds secret key-value {keyvalue.name} (its value is credential material)."

  # --- The secret authenticates as some identity/data -> CredentialsFor -----
  - id: azure-appconfig-keyvalue-credentials-for
    emits: CredentialsFor
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.AppConfiguration/configurationStores/keyValues", field: "value"}
    where:
      - "value is credential material AND its target identity/resource is resolvable (SP appId+secret, storage/SQL/Service Bus connection string, API key bound to a known service)"
    emit:
      source: "<key-value Secret/ConnectionString node>"
      target: "<resolved identity / data plane it authenticates to>"
      api_source: "az appconfig kv list (value parse)"
      evidence_field: "value"
      narrative: "Key-value {keyvalue.name} is credentials for {target.name}."

  # --- Key Vault reference -> ContainsResourceReference (NOT a secret read) --
  - id: azure-appconfig-keyvalue-kv-reference
    emits: ContainsResourceReference
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.AppConfiguration/configurationStores/keyValues", field: "contentType"}
    where:
      - "contentType == 'application/vnd.microsoft.appconfig.keyvaultref+json'"
    emit:
      target_type: "*"
      source: "<key-value node>"
      target: "<external Key Vault Secret node (from value URI)>"
      api_source: "az appconfig kv list"
      evidence_field: "value (Key Vault secret URI)"
      narrative: "Key-value {keyvalue.name} is a Key Vault reference to {kvsecret.name} (URI, not the secret itself)."

  # --- The store's data plane (all key-values) as a Data node ---------------
  # A single Data node representing the store's data plane. Used as the schema-
  # conformant source for ContainsCredential / ExposesCredential (ManagementService
  # is not in those source sets) and as the CredentialsFor target of the connstring.
  - id: azure-appconfig-dataplane-node
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.AppConfiguration/configurationStores", field: "id"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<configuration store node (ManagementService)>"
      target: "<store data-plane node (class Data — the full key-value set)>"
      api_source: "az appconfig show"
      evidence_field: "id"
      narrative: "{store.name} contains its data plane (all key-values)."

  # --- Access-key connection strings exist -> ContainsCredential ------------
  # The store HAS access-key connection strings iff disableLocalAuth == false.
  # We record their existence WITHOUT calling listKeys (which returns live secrets).
  # Source is the Data-plane node (schema: ContainsCredential source [Storage, Data, Compute]).
  - id: azure-appconfig-access-keys-present
    emits: ContainsCredential
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.AppConfiguration/configurationStores", field: "properties.disableLocalAuth"}
    where:
      - "properties.disableLocalAuth == false"
    emit:
      source: "<store data-plane node (class Data)>"
      target: "<access-key connection string Credential node (read-only + read-write)>"
      api_source: "az appconfig show (properties.disableLocalAuth); presence inferred, listKeys NOT invoked"
      evidence_field: "properties.disableLocalAuth == false"
      narrative: "{store.name}'s data plane has access-key connection strings (local auth enabled)."

  # --- Access-key connection string authenticates to the whole data plane ---
  - id: azure-appconfig-connstring-credentials-for-dataplane
    emits: CredentialsFor
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.AppConfiguration/configurationStores", field: "properties.disableLocalAuth"}
    where:
      - "properties.disableLocalAuth == false"
    emit:
      source: "<access-key connection string Credential node>"
      target: "<store data plane (all key-values)>"
      api_source: "az appconfig show"
      evidence_field: "properties.disableLocalAuth == false"
      narrative: "The access-key connection string of {store.name} authenticates to its full data plane (all key-values)."

  # --- Effective-permission triggers (evaluator, not raw config) ------------
  - id: azure-appconfig-has-permission-read
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.AppConfiguration/configurationStores/keyValues/read"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<configuration store node>"
      api_source: "role assignment evaluation (App Configuration Data Reader/Owner)"
      permissions: ["Microsoft.AppConfiguration/configurationStores/keyValues/read"]
      narrative: "{principal.name} can read key-values in {store.name} (keyValues/read)."

  - id: azure-appconfig-has-permission-listkeys
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.AppConfiguration/configurationStores/listKeys/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<configuration store node>"
      api_source: "role assignment evaluation (Contributor/Owner)"
      permissions: ["Microsoft.AppConfiguration/configurationStores/listKeys/action"]
      narrative: "{principal.name} can list access keys of {store.name} (listKeys/action)."

  - id: azure-appconfig-has-permission-write
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.AppConfiguration/configurationStores/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<configuration store node>"
      api_source: "role assignment evaluation (Contributor/Owner)"
      permissions: ["Microsoft.AppConfiguration/configurationStores/write"]
      narrative: "{principal.name} can update {store.name} (configurationStores/write), incl. toggling disableLocalAuth."

  # --- Re-enable access keys (config-plane write) -> CanModifyConfiguration --
  # configurationStores/write can flip disableLocalAuth false, regenerating the
  # access keys and un-blocking the connection-string read path (persistence /
  # un-block the leak). This is a directly-observed permission fact, so it is an
  # EXPLICIT normalization edge (CanModifyConfiguration nature: explicit); it was
  # moved here out of /rules/derived/azure/appconfig.yaml (rule 7).
  # The store node is class ManagementService; CanModifyConfiguration target set is
  # [Compute, Messaging, Network, "*"], and "*" admits ManagementService.
  - id: azure-appconfig-reenable-local-auth
    emits: CanModifyConfiguration
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.AppConfiguration/configurationStores/write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "store currently has disableLocalAuth == true  # only meaningful when access keys are DISABLED; if already enabled the connstring path is directly modeled and this is a no-op"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<configuration store node (ManagementService)>"
      api_source: "role assignment evaluation (Contributor/Owner) + az appconfig show (properties.disableLocalAuth)"
      permissions: ["Microsoft.AppConfiguration/configurationStores/write"]
      evidence_field: "properties.disableLocalAuth == true"
      narrative: >-
        {principal.name} can re-enable access-key auth on {store.name}
        (configurationStores/write -> disableLocalAuth=false), regenerating connection
        strings that read all data. BLOCKED under a deny on configurationStores/write
        or an Azure Policy enforcing disableLocalAuth=true.
