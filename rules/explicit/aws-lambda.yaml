# Worked example: normalizing AWS Lambda into explicit edges.
# Adapter emits raw records; these rules translate them to common explicit edges.

rules:

  - id: aws-lambda-executes-as
    emits: ExecutesAs
    applies_to: [aws]
    match_record: {resource_type: "AWS::Lambda::Function", field: "Configuration.Role"}
    emit:
      source_type: Compute
      source: "<function node>"
      target: "<IAM role from Configuration.Role>"
      api_source: "lambda:GetFunctionConfiguration"
      evidence_field: "Configuration.Role"
      narrative: "{function.name} executes as {role.name} (Lambda execution role)."

  # CanModifyCode / CanInvoke / CanModifyConfiguration are emitted by the
  # permission evaluator, not raw config: they exist only if a principal's
  # EFFECTIVE permissions include the action on this function's scope.
  - id: aws-lambda-can-modify-code
    emits: CanModifyCode
    applies_to: [aws]
    match_effective_permission:
      action: "lambda:UpdateFunctionCode"
      resource_type: "AWS::Lambda::Function"
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<function node>"
      api_source: "iam:SimulatePrincipalPolicy | policy evaluation"
      permissions: ["lambda:UpdateFunctionCode"]
      narrative: "{principal.name} can modify code of {function.name} (lambda:UpdateFunctionCode)."

  - id: aws-lambda-can-invoke
    emits: CanInvoke
    applies_to: [aws]
    match_effective_permission:
      action: "lambda:InvokeFunction"
      resource_type: "AWS::Lambda::Function"
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<function node>"
      permissions: ["lambda:InvokeFunction"]
      narrative: "{principal.name} can invoke {function.name} (lambda:InvokeFunction)."

  - id: aws-lambda-resource-policy-cross-account
    emits: CrossAccountTrust
    applies_to: [aws]
    match_record: {resource_type: "AWS::Lambda::Function", field: "Policy"}
    where: ["principal in Policy is in a different account"]
    emit:
      source: "<function node>"
      target: "<external principal / account>"
      api_source: "lambda:GetPolicy"
      narrative: "{function.name} resource policy grants invoke to {external.name} in account {account}."
