# Azure DNS / Private DNS — Explicit normalization rules (Phase 1-2 structural)
# ---------------------------------------------------------------------------
# Structural containment and attachment edges that feed derived attack-path rules.
# Explicit rules run in the inventory/normalization phase before derived rules.
#
# SCHEMA WAIVERS:
#   - Contains: source_type DNS (Network class) is not in the current edges.yaml source set
#     [AdministrativeBoundary, ObjectStorage, Data, Secret, ManagementService].
#     Awaiting schema amendment to include Network sources in Contains edge.
#     Interim: these rules are included for completeness and clarity of intent.
#
#   - AttachedTo: source_type DNS (Network class) is not in the current edges.yaml source set
#     [NetworkInterface, BlockStorage, ManagedIdentity, IAMPolicy].
#     Awaiting schema amendment to include DNS / Network as a valid AttachedTo source.
#     Interim: these rules model a legitimate structural attachment (zone ↔ VNet linkage).
# ---------------------------------------------------------------------------

provider: azure
phase: 1-structural
applies_to: [azure]

explicit_rules:

  - id: azure-dns-zone-record-contains
    emits: Contains
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Network/dnsZones"
      child_resource_type: "Microsoft.Network/dnsZones/{recordType}/{recordSetName}"
    emit:
      source_type: DNS
      target_type: DNS
      source: "<DNS zone node>"
      target: "<record set node>"
      api_source: "Microsoft.Network/dnsZones/{recordType} LIST"
      evidence_field: "id"
      narrative: "{zone.name} contains record set {recordSet.name} ({recordType})."

  - id: azure-private-dns-zone-record-contains
    emits: Contains
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Network/privateDnsZones"
      child_resource_type: "Microsoft.Network/privateDnsZones/{recordType}/{recordSetName}"
    emit:
      source_type: DNS
      target_type: DNS
      source: "<private DNS zone node>"
      target: "<record set node>"
      api_source: "Microsoft.Network/privateDnsZones/{recordType} LIST"
      evidence_field: "id"
      narrative: "{zone.name} contains private record set {recordSet.name} ({recordType})."

  - id: azure-private-dns-zone-vnet-link
    emits: AttachedTo
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Network/privateDnsZones/virtualNetworkLinks"
      field: "properties"
    where:
      - "properties.provisioningState == 'Succeeded'"
    emit:
      source_type: DNS
      target_type: VirtualNetwork
      source: "<private DNS zone>"
      target: "<linked VNet>"
      api_source: "Microsoft.Network/privateDnsZones/virtualNetworkLinks LIST"
      evidence_field: "properties.virtualNetwork.id + properties.registrationEnabled + properties.provisioningState"
      narrative: "Private DNS zone {zone.name} is linked to VNet {vnet.name} (registrationEnabled: {registrationEnabled})."

  - id: azure-dns-zone-located-in
    emits: LocatedIn
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Network/dnsZones"
      field: "id"
    emit:
      source_type: DNS
      target_type: ResourceGroup
      source: "<DNS zone>"
      target: "<containing resource group>"
      api_source: "ARM resource ID parsing"
      evidence_field: "id (ARM resource ID contains resource group)"
      narrative: "Public DNS zone {zone.name} is located in resource group {rg.name}."

  - id: azure-private-dns-zone-located-in
    emits: LocatedIn
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Network/privateDnsZones"
      field: "id"
    emit:
      source_type: DNS
      target_type: ResourceGroup
      source: "<private DNS zone>"
      target: "<containing resource group>"
      api_source: "ARM resource ID parsing"
      evidence_field: "id (ARM resource ID contains resource group)"
      narrative: "Private DNS zone {zone.name} is located in resource group {rg.name}."
