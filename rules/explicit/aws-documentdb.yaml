# AWS DocumentDB — Explicit (normalization) rules
# ---------------------------------------------------------------------------
# These edges are emitted from IAM policy analysis and DocumentDB cluster
# configuration (via DescribeDBClusters, DescribeDBClusterSnapshots,
# DescribeDBClusterSnapshotAttributes APIs). They normalize IAM permissions
# and cluster/snapshot attributes into explicit capability edges.
#
# source_type/target_type must match schema/edges.yaml declarations:
#   CanModifyConfiguration:  source: [Identity], target: [Compute, Storage, Data, Messaging]
#   ContainsSecret:          source: [Storage, Data], target: [Secret]
#   CrossAccountTrust:       source: [Account, Role, ResourcePolicy, Data, Snapshot, DataLake]
#                            target: [Account, ExternalIdentity]
# ---------------------------------------------------------------------------

provider: aws
phase: 6-storage-databases
applies_to: [aws]

rules:

  # --- CanModifyConfiguration: rds:ModifyDBCluster ---
  # A principal with rds:ModifyDBCluster on the cluster resource ARN can modify
  # DocumentDB cluster configuration, including resetting the master user password
  # without knowing the current password. This is the highest-value single-permission
  # escalation vector for DocumentDB.
  - id: aws-documentdb-can-modify-cluster
    emits: CanModifyConfiguration
    applies_to: [aws]
    description: >-
      Principal with rds:ModifyDBCluster on the cluster resource ARN can modify
      cluster configuration, including resetting the master user password without
      knowing the current password.
    match_effective_permission:
      action: "rds:ModifyDBCluster"
      resource_type: "AWS::DocDB::DBCluster"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<DocumentDB cluster (NoSQLDatabase)>"
      permissions: ["rds:ModifyDBCluster"]
      narrative: >-
        {principal.name} can modify DocumentDB cluster {cluster.name} configuration
        via rds:ModifyDBCluster, including resetting the master user password to an
        attacker-known value, granting superuser MongoDB access without knowing the
        current password.

  # --- ContainsSecret: MasterUserSecret.SecretArn ---
  # When ManageMasterUserPassword=true, the DocumentDB cluster stores and rotates
  # the master password in AWS Secrets Manager. The secret ARN is discoverable via
  # rds:DescribeDBClusters -> DBClusters[].MasterUserSecret.SecretArn.
  - id: aws-documentdb-contains-master-secret
    emits: ContainsSecret
    applies_to: [aws]
    description: >-
      DocumentDB cluster stores its master MongoDB user password in a Secrets Manager
      secret when ManageMasterUserPassword is enabled.
    match_record:
      resource_type: "AWS::DocDB::DBCluster"
      field: "MasterUserSecret.SecretArn"
    emit:
      source_type: NoSQLDatabase
      target_type: Secret
      source: "<DocumentDB cluster (NoSQLDatabase)>"
      target: "<Secrets Manager secret at MasterUserSecret.SecretArn>"
      api_source: "rds:DescribeDBClusters"
      evidence_field: "DBClusters[].MasterUserSecret.SecretArn"
      narrative: >-
        {cluster.name} stores its master MongoDB password in Secrets Manager secret
        {secret.name} (ManageMasterUserPassword integration). Reading this secret yields
        full MongoDB admin credentials for the cluster.

  # --- CrossAccountTrust: snapshot sharing to specific account ---
  # A DocumentDB cluster snapshot with restore permission granted to a specific AWS
  # account via rds:ModifyDBClusterSnapshotAttribute establishes a trust edge.
  # That account can call rds:RestoreDBClusterFromSnapshot to create a full copy
  # of all cluster data.
  - id: aws-documentdb-snapshot-cross-account-trust
    emits: CrossAccountTrust
    applies_to: [aws]
    description: >-
      DocumentDB cluster snapshot is shared for restore with a specific external AWS account
      via rds:DescribeDBClusterSnapshotAttributes (restore attribute contains account ID).
    match_record:
      resource_type: "AWS::DocDB::DBClusterSnapshot"
      field: "DBClusterSnapshotAttributes[restore].AttributeValues"
    where:
      - "AttributeValues contains a specific AWS account ID (not 'all')"
    emit:
      source_type: Snapshot
      target_type: Account
      source: "<DocumentDB cluster snapshot (Snapshot)>"
      target: "<external AWS account (Account)>"
      api_source: "rds:DescribeDBClusterSnapshotAttributes"
      evidence_field: "DBClusterSnapshotAttributes[restore].AttributeValues"
      narrative: >-
        DocumentDB cluster snapshot {snapshot.name} is shared for restore with account
        {accountId} — that account can call rds:RestoreDBClusterFromSnapshot to
        create a full copy of all cluster data (all databases and collections).

  # --- ExposedToInternet: snapshot public (restore=all) ---
  # A DocumentDB cluster snapshot with restore permission granted to 'all' (any AWS account)
  # via rds:ModifyDBClusterSnapshotAttribute is publicly restorable. Any AWS account
  # can call rds:RestoreDBClusterFromSnapshot to exfiltrate a full copy of the cluster.
  - id: aws-documentdb-snapshot-public-exposed
    emits: ExposedToInternet
    applies_to: [aws]
    description: >-
      DocumentDB cluster snapshot is publicly restorable (restore attribute contains 'all')
      via rds:DescribeDBClusterSnapshotAttributes.
    match_record:
      resource_type: "AWS::DocDB::DBClusterSnapshot"
      field: "DBClusterSnapshotAttributes[restore].AttributeValues"
    where:
      - "AttributeValues contains 'all'"
    emit:
      source_type: Snapshot
      target_type: AnonymousIdentity
      source: "<DocumentDB cluster snapshot (Snapshot)>"
      target: "<AnonymousIdentity>"
      api_source: "rds:DescribeDBClusterSnapshotAttributes"
      evidence_field: "DBClusterSnapshotAttributes[restore].AttributeValues == 'all'"
      narrative: >-
        DocumentDB cluster snapshot {snapshot.name} is publicly restorable
        (AttributeValues contains 'all') — any AWS account can call
        rds:RestoreDBClusterFromSnapshot to create a full copy of all cluster
        data without the owner's involvement (complete data exfiltration).
