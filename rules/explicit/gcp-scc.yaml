# GCP Security Command Center (SCC) — Explicit normalization rules
# ---------------------------------------------------------------------------
# These rules translate raw GCP IAM configuration into explicit HasPermission
# edges that feed the derived SCC attack-path rules. Each rule runs the
# effective-permission evaluator to verify the principal holds the specific
# permission(s) required for the corresponding derived capability.
#
# Permissions referenced:
#   securitycenter.settings.update        — disable/modify SCC org or project settings
#   securitycenter.muteconfigs.create     — create a mute config (rule-based suppression)
#   securitycenter.muteconfigs.update     — modify an existing mute config
#   securitycenter.muteconfigs.delete     — delete a mute config
#   securitycenter.findings.setState      — set finding state (ACTIVE/INACTIVE)
#   securitycenter.findings.setMute       — mute/unmute individual findings
#   securitycenter.notificationconfigs.delete — delete a notification config (Pub/Sub route)
#   securitycenter.notificationconfigs.update — modify notification routing
#   securitycenter.findings.list          — list findings (read / recon)
#   securitycenter.assets.list            — list asset inventory (read / recon)
# ---------------------------------------------------------------------------

provider: gcp
phase: 12-security-logging
service: scc
applies_to: [gcp]

rules:

  # --- 1) Settings update — disable detection services -------
  # Normalization rule to produce HasPermission(principal, securitycenter.settings.update, SCC)
  # from role/policy assignments and effective-permission evaluation.
  - id: gcp-scc-explicit-settings-update
    emits: HasPermission
    description: "Principal holds effective securitycenter.settings.update permission at org or project scope."
    match_effective_permission:
      action: "securitycenter.settings.update"
      resource_type: ["google.securitycenter.OrganizationSettings", "google.securitycenter.ProjectSettings"]
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "?principal"
      target: "?scc"
      permissions: ["securitycenter.settings.update"]
      conditions: [iam_permission]
      confidence: 0.95
      narrative: "{principal.name} holds effective securitycenter.settings.update permission at {scc.scope}, enabling disable of SCC detection services."

  # --- 2) Mute config create/update — rule-based finding suppression -------
  # Normalization rule for both create and update permissions (attacker uses OR).
  - id: gcp-scc-explicit-muteconfig-write
    emits: HasPermission
    description: "Principal holds effective securitycenter.muteconfigs.create or .update permission."
    match_effective_permission:
      action: ["securitycenter.muteconfigs.create", "securitycenter.muteconfigs.update"]
      resource_type: ["google.securitycenter.OrganizationSettings", "google.securitycenter.ProjectSettings"]
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "?principal"
      target: "?scc"
      permissions: ["securitycenter.muteconfigs.create", "securitycenter.muteconfigs.update"]
      conditions: [iam_permission, service_state]
      confidence: 0.90
      state_logic: >-
        HasPermission is ACTIVE when the principal holds either permission. Note: SCC Premium tier
        is required to create/update mute configs; Standard tier will have this permission ignored
        by the SCC API. The service_state condition allows derived rules to gate on Premium tier availability.
      narrative: "{principal.name} holds effective securitycenter.muteconfigs.create or .update permission at {scc.scope}, enabling rule-based mute config creation/modification."

  # --- 3) Per-finding muting — setState or setMute -------
  - id: gcp-scc-explicit-finding-state
    emits: HasPermission
    description: "Principal holds effective securitycenter.findings.setState or .setMute permission."
    match_effective_permission:
      action: ["securitycenter.findings.setState", "securitycenter.findings.setMute"]
      resource_type: ["google.securitycenter.OrganizationSettings", "google.securitycenter.ProjectSettings"]
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "?principal"
      target: "?scc"
      permissions: ["securitycenter.findings.setState", "securitycenter.findings.setMute"]
      conditions: [iam_permission]
      confidence: 0.85
      narrative: "{principal.name} holds effective securitycenter.findings.setState or .setMute permission at {scc.scope}, enabling per-finding suppression."

  # --- 4) Finding and asset read — recon -------
  - id: gcp-scc-explicit-read
    emits: HasPermission
    description: "Principal holds effective securitycenter.findings.list permission (recon-only read)."
    match_effective_permission:
      action: ["securitycenter.findings.list"]
      resource_type: ["google.securitycenter.OrganizationSettings", "google.securitycenter.ProjectSettings"]
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "?principal"
      target: "?scc"
      permissions: ["securitycenter.findings.list"]
      conditions: [iam_permission]
      confidence: 0.70
      narrative: "{principal.name} holds securitycenter.findings.list permission at {scc.scope}, enabling SCC finding read access for reconnaissance."

  # --- 5) Asset inventory read — recon -------
  - id: gcp-scc-explicit-assets-list
    emits: HasPermission
    description: "Principal holds effective securitycenter.assets.list permission (recon-only read)."
    match_effective_permission:
      action: ["securitycenter.assets.list"]
      resource_type: ["google.securitycenter.OrganizationSettings", "google.securitycenter.ProjectSettings"]
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "?principal"
      target: "?scc"
      permissions: ["securitycenter.assets.list"]
      conditions: [iam_permission]
      confidence: 0.70
      narrative: "{principal.name} holds securitycenter.assets.list permission at {scc.scope}, enabling GCP asset inventory read access."

  # --- 6) Notification config deletion — evasion (disrupt alerting pipeline) -------
  # securitycenter.notificationconfigs.delete is a destructive evasion primitive:
  # deleting a notification config silences downstream SIEM/SOAR integrations without
  # touching SCC findings themselves (distinct from disabling SCC services).
  - id: gcp-scc-explicit-notificationconfig-delete
    emits: HasPermission
    description: "Principal holds effective securitycenter.notificationconfigs.delete permission to delete notification routing configs."
    match_effective_permission:
      action: "securitycenter.notificationconfigs.delete"
      resource_type: ["google.securitycenter.OrganizationSettings", "google.securitycenter.ProjectSettings"]
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "?principal"
      target: "?scc"
      permissions: ["securitycenter.notificationconfigs.delete"]
      conditions: [iam_permission]
      confidence: 0.85
      narrative: "{principal.name} holds securitycenter.notificationconfigs.delete permission at {scc.scope}, enabling deletion of notification configs that route SCC findings to external systems (SIEM, SOAR, ticketing)."

  # --- 7) Notification config update — evasion (redirect alerting) -------
  # securitycenter.notificationconfigs.update allows modifying the Pub/Sub topic
  # or other notification routing without deletion — an attacker can hijack the
  # route (point to attacker-controlled Pub/Sub) or disable the route.
  - id: gcp-scc-explicit-notificationconfig-update
    emits: HasPermission
    description: "Principal holds effective securitycenter.notificationconfigs.update permission to modify notification routing."
    match_effective_permission:
      action: "securitycenter.notificationconfigs.update"
      resource_type: ["google.securitycenter.OrganizationSettings", "google.securitycenter.ProjectSettings"]
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "?principal"
      target: "?scc"
      permissions: ["securitycenter.notificationconfigs.update"]
      conditions: [iam_permission]
      confidence: 0.85
      narrative: "{principal.name} holds securitycenter.notificationconfigs.update permission at {scc.scope}, enabling modification of notification configs (redirect, disable) that route SCC findings to external systems."
