# AWS Amazon MQ — Explicit edge normalization rules (Phase 10 — messaging)
# ---------------------------------------------------------------------------
# Explicit normalization rules for Amazon MQ. These rules translate direct
# API observations (mq:DescribeBroker, mq:ListEventSourceMappings, etc.)
# and IAM permission evaluations into explicit edges consumed by derived rules
# in rules/derived/aws/mq.yaml.
#
# Emits ONLY explicit, schema-valid edges. All derived escalation logic lives
# in the derived/ rules.
# ---------------------------------------------------------------------------

rules:

  # --- Broker user credential resets via mq:UpdateUser ----------------------
  # mq:UpdateUser can change a broker user's password (and console access).
  # An attacker with mq:UpdateUser can set a known password and then authenticate
  # to the broker data plane. This is a direct IAM permission on the Messaging
  # (broker) resource.
  - id: aws-mq-update-user-can-modify-config
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      action: "mq:UpdateUser"
      resource_type: "AWS::AmazonMQ::Broker"
    emit:
      source_type: Identity
      target_type: Messaging
      source: "<principal>"
      target: "<MQ broker node>"
      permissions: ["mq:UpdateUser"]
      narrative: "{principal.name} can reset broker user passwords (mq:UpdateUser) on {broker.name}."

  # --- Broker configuration changes via mq:UpdateBroker ----------------------
  # mq:UpdateBroker can replace the KMS encryption key, change security groups,
  # update the subnet(s), change the broker engine version, and modify other
  # broker-level settings. Security group changes can widen network reachability
  # to the broker wire endpoints; KMS key changes affect encryption-at-rest.
  # This is a control-plane mutation of the broker configuration.
  - id: aws-mq-update-broker-modifies-config
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      action: "mq:UpdateBroker"
      resource_type: "AWS::AmazonMQ::Broker"
    emit:
      source_type: Identity
      target_type: Messaging
      source: "<principal>"
      target: "<MQ broker node>"
      permissions: ["mq:UpdateBroker"]
      narrative: "{principal.name} can modify broker configuration (mq:UpdateBroker), including security groups and encryption keys, on {broker.name}."

  # --- Broker ActiveMQ XML configuration changes via mq:UpdateConfiguration ---
  # mq:UpdateConfiguration can replace the ActiveMQ XML configuration file,
  # which includes the authorization policy (who can access queues/topics).
  # An attacker can remove access controls, add new connectors, or modify
  # the message store configuration. NOTE: RabbitMQ brokers use a different
  # configuration model and are not affected by this rule.
  - id: aws-mq-update-configuration-modifies-config
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      action: "mq:UpdateConfiguration"
      resource_type: "AWS::AmazonMQ::Broker"
    emit:
      source_type: Identity
      target_type: Messaging
      source: "<principal>"
      target: "<MQ broker node>"
      permissions: ["mq:UpdateConfiguration"]
      narrative: "{principal.name} can modify the ActiveMQ XML configuration (mq:UpdateConfiguration) on {broker.name}, including authorization policies."

  # --- ESM trigger binding: broker → Lambda consumer -------------------------
  # Lambda event-source-mapping for MQ binds a broker queue/topic to a Lambda
  # function. The broker is the event source; triggering it invokes the consumer.
  # This is collected from lambda:ListEventSourceMappings.
  - id: aws-mq-esm-trigger-to-lambda
    emits: CanTrigger
    applies_to: [aws]
    match_record:
      resource_type: "AWS::Lambda::EventSourceMapping"
      field: "EventSourceArn"
      pattern: "arn:aws:mq:.*"
    emit:
      source_type: Messaging
      target_type: Compute
      source: "<MQ broker node from EventSourceArn>"
      target: "<Lambda function node from FunctionArn>"
      api_source: "lambda:ListEventSourceMappings, lambda:GetEventSourceMapping"
      narrative: "{broker.name} triggers {function.name} via Lambda event-source-mapping."

  # --- Secrets Manager credential secret for MQ broker -----------------------
  # Lambda ESM for MQ stores broker credentials (username + password) in
  # Secrets Manager, referenced via SourceAccessConfigurations (type BASIC_AUTH).
  # The secret holds the wire-protocol credentials; reading it grants data-plane
  # access to the broker.
  - id: aws-mq-credential-secret-basic-auth
    emits: CredentialsFor
    applies_to: [aws]
    match_record:
      resource_type: "AWS::Lambda::EventSourceMapping"
      field: "SourceAccessConfigurations"
      subfield_match:
        Type: "BASIC_AUTH"
    emit:
      source_type: Secret
      target_type: Identity
      source: "<Secrets Manager Secret node from BASIC_AUTH URI>"
      target: "<broker user ServiceIdentity node>"
      api_source: "lambda:GetEventSourceMapping"
      narrative: "{secret.name} holds the wire-protocol credentials (CredentialsFor) for broker user on {broker.name}."

