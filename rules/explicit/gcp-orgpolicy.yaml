# Normalizing GCP Organization Policy Service into explicit edges.
# ===========================================================================
# The adapter emits raw Org Policy records: the EFFECTIVE org policy per
# org/folder/project scope (orgpolicy.policy.get / Cloud Asset
# analyzeOrgPolicies — which resolves inheritance), the list of constraints,
# and custom-constraint definitions. The effective-permission evaluator emits
# the mutation capability (orgpolicy.policy.set). These rules translate one
# observed fact into one explicit edge (schema/edges.yaml); they do not combine
# edges.
#
# NODE MODELING:
#   * An OrganizationPolicy node = one ENFORCED (scope x constraint) binding.
#     It is a Policy node, subtype OrganizationPolicy ("Nodes so their mutation
#     is an edge target"). Only ENFORCED policies (spec, not dryRunSpec-only)
#     become guardrail nodes that suppress edges.
#   * Each node is annotated with `constraint` (verbatim identifier) and `gates`
#     (the edge signatures it suppresses) so hierarchy-chains.yaml
#     guardrail-removal-upgrades-blocked can match blocked_by(edge)==node.
#   * The scope (Organization/Folder/Project) is an AdministrativeBoundary
#     already modeled by Resource Manager; we only add the HasPolicy placement.
#
# Permission/role/constraint names verbatim from the Org Policy overview, the
# org-policy constraints reference, and the orgpolicy IAM roles/permissions ref.
# ===========================================================================

rules:

  # --- Effective org policy at a scope -> HasPolicy --------------------------
  # HasPolicy: source=[Identity,*], target=[Policy]. The scope boundary carries
  # the enforced constraint as a Policy node.
  - id: gcp-orgpolicy-has-policy
    emits: HasPolicy
    applies_to: [gcp]
    match_record:
      resource_type: "google.cloud.orgpolicy.Policy"
      field: "spec.rules"                      # enforced (not dryRunSpec-only)
    where:
      - "the policy is ENFORCED: spec.rules present with boolean enforce==true OR a suppressing list rule (denyValues/denyAll/allowAll widening); NOT a dryRunSpec-only policy"
    emit:
      source_type: "*"
      target_type: Policy
      source: "<scope boundary node (Organization/Folder/Project)>"
      target: "<OrganizationPolicy node (scope x constraint), subtype OrganizationPolicy>"
      api_source: "orgpolicy.policy.get / cloudasset.assets.analyzeOrgPolicies"
      evidence_field: "spec.rules, constraint, name"
      annotate:
        constraint: "<constraints/... verbatim identifier>"
        enforced_at: "<scope resource name>"
        gates: "<edge signatures this constraint suppresses — see providers/gcp/orgpolicy.md GUARDRAIL SECTION>"
      narrative: "{scope.name} enforces org policy {constraint} (guardrail): {orgpolicy.name}."

  # --- Effective orgpolicy.policy.set -> CanModifyPolicy ---------------------
  # The base mutation edge every derived rule in rules/derived/gcp/orgpolicy.yaml
  # matches on. Emitted by the permission evaluator when a principal's EFFECTIVE
  # permissions include orgpolicy.policy.set at the scope where the policy is set.
  # This is DISTINCT from resourcemanager.*.setIamPolicy — do not conflate.
  - id: gcp-orgpolicy-can-modify-policy
    emits: CanModifyPolicy
    applies_to: [gcp]
    match_effective_permission:
      action: "orgpolicy.policy.set"
      resource_type: "google.cloud.orgpolicy.Policy"
    where:
      - "the target OrganizationPolicy is ENFORCED at/inherited-to the scope (a dry-run-only or unset policy is not a guardrail to remove)"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<OrganizationPolicy node at the scope the principal can write>"
      api_source: "policy evaluation (IAM Policy Analyzer) — NOT a live setPolicy call"
      permissions: ["orgpolicy.policy.set"]
      evidence_field: "effective orgpolicy.policy.set at scope"
      narrative: "{principal.name} can set the org policy at {scope.name} (orgpolicy.policy.set) — can weaken/remove the guardrail {orgpolicy.name}."

  # --- Custom constraint definition -> OrganizationPolicy node + mutate cap --
  - id: gcp-orgpolicy-custom-constraint-node
    emits: HasPolicy
    applies_to: [gcp]
    match_record:
      resource_type: "google.cloud.orgpolicy.CustomConstraint"
      field: "name"                            # constraints/custom.<name>
    emit:
      source_type: "*"
      target_type: Policy
      source: "<organization boundary node>"
      target: "<OrganizationPolicy node (custom constraint definition), subtype OrganizationPolicy>"
      api_source: "orgpolicy.customConstraints.list / .get"
      evidence_field: "name, actionType, condition, resourceTypes"
      annotate:
        constraint: "<constraints/custom.<name> verbatim>"
        custom: true
      narrative: "Organization defines custom org-policy constraint {constraint}."

  - id: gcp-orgpolicy-can-modify-custom-constraint
    emits: CanModifyPolicy
    applies_to: [gcp]
    match_effective_permission:
      any_of:
        - {action: "orgpolicy.customConstraints.delete", resource_type: "google.cloud.orgpolicy.CustomConstraint"}
        - {action: "orgpolicy.customConstraints.update", resource_type: "google.cloud.orgpolicy.CustomConstraint"}
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<custom OrganizationPolicy node>"
      api_source: "policy evaluation — NOT a live delete/update call"
      permissions: ["orgpolicy.customConstraints.delete", "orgpolicy.customConstraints.update"]
      narrative: "{principal.name} can delete/alter custom org-policy constraint {orgpolicy.name} (orgpolicy.customConstraints.delete/update)."
