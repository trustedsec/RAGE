# Azure Key Vault — explicit normalization rules.
# Translate raw collected Microsoft.KeyVault/vaults config + effective-permission
# facts into common explicit edges. TWO data-plane authorization models are
# normalized to the SAME capability edges (grant source differs):
#   RBAC model      (enableRbacAuthorization=true):  ARM role assignments.
#   Access-policy   (enableRbacAuthorization=false): properties.accessPolicies[].
# Data-plane capability edges (CanReadSecret/CanDecrypt/CanSignAs) come from the
# permission evaluator (match_effective_permission), NOT raw config, because they
# depend on resolving role assignments or access-policy entries to effective
# dataActions. Structural facts (Contains/HasPolicy/network) come from raw records.

rules:

  # --- Structural: vault contains objects -----------------------------------
  - id: azure-kv-contains-secret
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.KeyVault/vaults/secrets", field: "id"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<vault node>"
      target: "<secret node>"
      api_source: "az keyvault secret list (metadata only)"
      evidence_field: "id"
      narrative: "{vault.name} contains secret {secret.name}."

  - id: azure-kv-contains-key
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.KeyVault/vaults/keys", field: "kid"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<vault node>"
      target: "<key node>"
      api_source: "az keyvault key list"
      evidence_field: "kid"
      narrative: "{vault.name} contains key {key.name}."

  - id: azure-kv-contains-certificate
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.KeyVault/vaults/certificates", field: "id"}
    emit:
      source_type: AdministrativeBoundary
      target_type: "*"
      source: "<vault node>"
      target: "<certificate node>"
      api_source: "az keyvault certificate list"
      evidence_field: "id"
      narrative: "{vault.name} contains certificate {certificate.name}."

  # --- Access-policy model: policy artifact + per-entry grant ---------------
  - id: azure-kv-access-policy-artifact
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.KeyVault/vaults", field: "properties.accessPolicies"}
    where: ["properties.enableRbacAuthorization == false"]
    emit:
      source_type: "*"
      target_type: Policy
      source: "<vault node>"
      target: "<accessPolicies ResourcePolicy node>"
      api_source: "Microsoft.KeyVault/vaults GET"
      evidence_field: "properties.accessPolicies"
      narrative: "{vault.name} uses the legacy access-policy model with {count} access-policy entries."

  # An access-policy entry granting secrets:get to an objectId -> the evaluator
  # treats it as an effective secrets/getSecret grant for that principal. This
  # record feeds the derived azure-kv-read-secret rule the same way an RBAC
  # role assignment does.
  - id: azure-kv-access-policy-secret-get
    emits: HasPermission
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.KeyVault/vaults", field: "properties.accessPolicies[].permissions.secrets"}
    where: ["properties.enableRbacAuthorization == false", "entry permissions.secrets contains 'get'"]
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal for accessPolicies[].objectId>"
      target: "<vault or object scope>"
      api_source: "Microsoft.KeyVault/vaults GET"
      permissions: ["Microsoft.KeyVault/vaults/secrets/getSecret/action"]
      evidence_field: "properties.accessPolicies[].permissions.secrets"
      narrative: "{principal.name} has an access-policy grant of secrets:get on {vault.name}."

  - id: azure-kv-access-policy-key-crypto
    emits: HasPermission
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.KeyVault/vaults", field: "properties.accessPolicies[].permissions.keys"}
    where: ["properties.enableRbacAuthorization == false", "entry permissions.keys contains any of 'decrypt','unwrapKey','sign'"]
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal for accessPolicies[].objectId>"
      target: "<vault or object scope>"
      api_source: "Microsoft.KeyVault/vaults GET"
      permissions: ["Microsoft.KeyVault/vaults/keys/decrypt/action", "Microsoft.KeyVault/vaults/keys/unwrap/action", "Microsoft.KeyVault/vaults/keys/sign/action"]
      evidence_field: "properties.accessPolicies[].permissions.keys"
      narrative: "{principal.name} has an access-policy grant of key decrypt/unwrapKey/sign on {vault.name}."

  # --- RBAC-model + effective data-plane capabilities -----------------------
  - id: azure-kv-eff-secret-get
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.KeyVault/vaults/secrets/getSecret/action"
      resource_type: "Microsoft.KeyVault/vaults/secrets"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<secret node>"
      api_source: "roleAssignments evaluation | policy evaluation"
      permissions: ["Microsoft.KeyVault/vaults/secrets/getSecret/action"]
      narrative: "{principal.name} effectively has secrets/getSecret on {secret.name}."

  - id: azure-kv-eff-key-decrypt
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.KeyVault/vaults/keys/decrypt/action"
      resource_type: "Microsoft.KeyVault/vaults/keys"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<key node>"
      permissions: ["Microsoft.KeyVault/vaults/keys/decrypt/action"]
      narrative: "{principal.name} effectively has keys/decrypt on {key.name}."

  - id: azure-kv-eff-key-unwrap
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.KeyVault/vaults/keys/unwrap/action"
      resource_type: "Microsoft.KeyVault/vaults/keys"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<key node>"
      permissions: ["Microsoft.KeyVault/vaults/keys/unwrap/action"]
      narrative: "{principal.name} effectively has keys/unwrap on {key.name}."

  - id: azure-kv-eff-key-sign
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.KeyVault/vaults/keys/sign/action"
      resource_type: "Microsoft.KeyVault/vaults/keys"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<key node>"
      permissions: ["Microsoft.KeyVault/vaults/keys/sign/action"]
      narrative: "{principal.name} effectively has keys/sign on {key.name}."

  # --- Management-plane self-grant levers -----------------------------------
  - id: azure-kv-eff-accesspolicies-write
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.KeyVault/vaults/accessPolicies/write"
      resource_type: "Microsoft.KeyVault/vaults"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<vault node>"
      permissions: ["Microsoft.KeyVault/vaults/accessPolicies/write"]
      narrative: "{principal.name} can write access policies on {vault.name} (Contributor/Key Vault Contributor/Owner)."

  # --- External-tenant grantee ----------------------------------------------
  - id: azure-kv-external-grant
    emits: TrustsExternalIdentity
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.KeyVault/vaults", field: "properties.accessPolicies[].objectId"}
    where: ["accessPolicies[].tenantId != vault home tenant OR grantee is a B2B guest / multi-tenant app SP"]
    emit:
      source: "<vault accessPolicies ResourcePolicy node>"
      target: "<external principal>"
      api_source: "Microsoft.KeyVault/vaults GET"
      evidence_field: "properties.accessPolicies[].objectId"
      note: >-
        TrustsExternalIdentity source set is [Role, ServiceAccount, ApplicationIdentity,
        ResourcePolicy]; source the vault's accessPolicies ResourcePolicy node (not the
        vault ManagementService node) to stay within the edge's declared source set.
      narrative: "{vault.name} access policy grants data-plane access to external principal {external.name}."

  # --- Network attributes (feed reachability) -------------------------------
  - id: azure-kv-network-acls
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.KeyVault/vaults", field: "properties.networkAcls"}
    emit:
      source_type: "*"
      target_type: Policy
      source: "<vault node>"
      target: "<network ACL config>"
      api_source: "Microsoft.KeyVault/vaults GET"
      evidence_field: "properties.networkAcls.defaultAction"
      narrative: "{vault.name} network default action is {value} (publicNetworkAccess={publicNetworkAccess})."
