# GCP Cloud Bigtable — Explicit normalization rules
# ---------------------------------------------------------------------------
# Catalog key: gcp:bigtable. These rules normalize raw Bigtable API records
# into explicit edges by evaluating effective IAM permissions and resource
# configurations. They belong here (/rules/explicit/) per RULE-FORMAT.md.
#
# All permissions are exact names from the Bigtable IAM reference:
#   cloud.google.com/bigtable/docs/access-control
#   cloud.google.com/bigtable/docs/cmek
#   cloud.google.com/bigtable/docs/backups
#
# LINCHPIN CITATIONS (edges from this file feed into):
#   * /rules/derived/credential-chains.yaml
#       - read-secret-yields-identity: CanReadData + ContainsSecret + CredentialsFor
#         => CanImpersonate (for tables storing credential material)
#   * /rules/derived/can-control.yaml
#       - control-via-admin: CanAdminister => Controls roll-up
#       - control-boundary-via-iam-admin: CanGrantPermission => Controls roll-up
# ---------------------------------------------------------------------------

provider: gcp
applies_to: [gcp]
service: bigtable

explicit_rules:

  # --- CanAdminister: roles/bigtable.admin ---
  # Principals with all the permissions in roles/bigtable.admin have full
  # control (CanAdminister) over Bigtable instances, clusters, and tables.
  - id: gcp-bigtable-explicit-administer
    emits: CanAdminister
    match_effective_permission:
      action: ["bigtable.instances.setIamPolicy", "bigtable.tables.setIamPolicy", "bigtable.tables.readRows", "bigtable.tables.mutateRows"]
      resource_type: "google.bigtable.admin.v2.Instance"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<Bigtable Instance / NoSQLDatabase node>"
      api_source: "Cloud Asset Inventory analyzeIamPolicy, bigtable.projects.instances.getIamPolicy"
      permissions: ["bigtable.instances.setIamPolicy", "bigtable.tables.setIamPolicy", "bigtable.tables.readRows", "bigtable.tables.mutateRows"]
      narrative: >-
        {principal.name} holds roles/bigtable.admin on instance {instance.name},
        granting full administrative control: IAM mutation (setIamPolicy), table
        creation/deletion, read/write data, backup, and restore operations.

  # --- CanGrantPermission: bigtable.tables.setIamPolicy ---
  - id: gcp-bigtable-explicit-can-grant-permission-table
    emits: CanGrantPermission
    match_effective_permission:
      action: "bigtable.tables.setIamPolicy"
      resource_type: "google.bigtable.admin.v2.Table"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<any principal>"
      api_source: "Cloud Asset Inventory analyzeIamPolicy, bigtable.projects.instances.tables.getIamPolicy"
      permissions: ["bigtable.tables.setIamPolicy"]
      narrative: >-
        {principal.name} can grant data access to any principal on {table.name}
        via bigtable.tables.setIamPolicy (e.g., self-grant roles/bigtable.user).

  # --- CanGrantPermission: bigtable.instances.setIamPolicy ---
  - id: gcp-bigtable-explicit-can-grant-permission-instance
    emits: CanGrantPermission
    match_effective_permission:
      action: "bigtable.instances.setIamPolicy"
      resource_type: "google.bigtable.admin.v2.Instance"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<any principal>"
      api_source: "Cloud Asset Inventory analyzeIamPolicy, bigtable.projects.instances.getIamPolicy"
      permissions: ["bigtable.instances.setIamPolicy"]
      narrative: >-
        {principal.name} can grant instance-scoped roles on {instance.name}
        (bigtable.instances.setIamPolicy), affecting all tables in the instance.

  # --- CanGrantPermission: bigtable.authorizedViews.setIamPolicy ---
  - id: gcp-bigtable-explicit-can-grant-permission-authorized-view
    emits: CanGrantPermission
    match_effective_permission:
      action: "bigtable.authorizedViews.setIamPolicy"
      resource_type: "google.bigtable.admin.v2.AuthorizedView"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<any principal>"
      api_source: "Cloud Asset Inventory analyzeIamPolicy, bigtable.projects.instances.tables.authorizedViews.getIamPolicy"
      permissions: ["bigtable.authorizedViews.setIamPolicy"]
      narrative: >-
        {principal.name} can grant authorized-view-scoped roles on view {view.name}
        (bigtable.authorizedViews.setIamPolicy), affecting only that view's row/column
        scope without modifying table or instance IAM.

  # --- CrossProjectTrust: cross-project IAM bindings ---
  - id: gcp-bigtable-explicit-cross-project-trust
    emits: CrossProjectTrust
    match_record:
      api: "bigtable.projects.instances.getIamPolicy OR bigtable.projects.instances.tables.getIamPolicy"
      resource_type: "google.bigtable.admin.v2.Instance OR google.bigtable.admin.v2.Table"
      field: "bindings[].members[] (cross-project serviceAccount)"
    where:
      - "member is a service account whose project != the instance or table's project"
    emit:
      source_type: Project
      target_type: Project
      source: "<project owning the instance or table>"
      target: "<foreign project owning the service account>"
      api_source: "bigtable.projects.instances.getIamPolicy / bigtable.projects.instances.tables.getIamPolicy"
      evidence_field: "bindings[].members[] containing serviceAccount:sa@foreign-project.iam.gserviceaccount.com"
      narrative: >-
        {resource.name} grants Bigtable access to a service account in foreign
        project {foreignProject.name} via a cross-project IAM binding.

  # --- ContainsResourceReference: CMEK key reference ---
  # The Bigtable cluster references a Cloud KMS key in encryptionConfig.
  # This is a structural edge used by gcp-bigtable-read-data-cmek's state logic
  # to evaluate whether the service agent's KMS grant is intact.
  - id: gcp-bigtable-explicit-cmek-ref
    emits: ContainsResourceReference
    walkable: false
    match_record:
      api: "bigtable.projects.instances.clusters.get"
      resource_type: "google.bigtable.admin.v2.Cluster"
      field: "encryptionConfig.kmsKeyName"
    where:
      - "encryptionConfig.kmsKeyName is set (cluster has CMEK enabled)"
    emit:
      source_type: NoSQLDatabase
      target_type: EncryptionKey
      source: "<Cluster node>"
      target: "<Cloud KMS CryptoKey referenced by encryptionConfig.kmsKeyName>"
      api_source: "bigtable.projects.instances.clusters.get"
      evidence_field: "encryptionConfig.kmsKeyName"
      narrative: >-
        Cluster {cluster.name} uses Cloud KMS CMEK key {key.name} for at-rest
        encryption (encryptionConfig.kmsKeyName). All tables in this cluster
        are encrypted with this key; the Bigtable service agent holds the
        decrypt grant. This reference is used by gcp-bigtable-read-data-cmek
        to evaluate the key_permission gate.
