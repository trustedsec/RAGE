# AWS Security Hub — Explicit normalization rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# Emits EXPLICIT edges (nature=explicit in edges.yaml) from raw resource config
# and IAM permissions. These rules read configuration fields and permission
# policies directly (match_effective_permission) rather than consuming existing
# derived graph edges.
#
# Derived rules (consuming edges via match[] traversals) live in:
#   /rules/derived/aws/securityhub.yaml
# Those rules reference these explicit inputs as contributing edges.
#
# Conformance: All emitted edges must have nature: explicit or both (per
# edge type definition in schema/edges.yaml).
# ---------------------------------------------------------------------------

provider: aws
phase: 12-security-logging
applies_to: [aws]

rules:

  - id: aws-securityhub-effective-write
    emits: CanModifyConfiguration
    applies_to: [aws]
    match_effective_permission:
      actions:
        - "securityhub:BatchUpdateFindings"
        - "securityhub:UpdateStandardsControl"
        - "securityhub:BatchDisableStandards"
        - "securityhub:DisableSecurityHub"
        - "securityhub:CreateAutomationRule"
        - "securityhub:UpdateAutomationRule"
        - "securityhub:DeleteAutomationRule"
        - "securityhub:DeleteInsight"
      resource_type: "AWS::SecurityHub::Hub"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Security Hub node in account+region>"
      permissions: ["<matched action>"]
      narrative: >-
        {principal.name} holds an effective SecurityHub write action
        ({matched_action}) on the Security Hub service in {account}/{region},
        enabling defense-evasion against Security Hub detective controls.

  - id: aws-securityhub-effective-read
    emits: CanRead
    applies_to: [aws]
    match_effective_permission:
      actions:
        - "securityhub:GetFindings"
      resource_type: "AWS::SecurityHub::Hub"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Security Hub node in account+region>"
      permissions: ["securityhub:GetFindings"]
      narrative: >-
        {principal.name} can read Security Hub findings in {account}/{region}
        (securityhub:GetFindings).
