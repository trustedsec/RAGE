# AWS SageMaker — Explicit normalization rules (Phase 11 — data/analytics/ML)
# ---------------------------------------------------------------------------
# Emits EXPLICIT edges (nature=explicit in edges.yaml) from raw resource config
# and IAM permissions. These rules read configuration fields and permission
# policies directly (match_record, match_effective_permission) rather than
# consuming existing derived graph edges.
#
# Derived rules (consuming edges via match[] traversals) live in:
#   /rules/derived/aws/sagemaker.yaml
# Those rules reference these explicit inputs as contributing edges.
#
# Conformance: All emitted edges must have nature: explicit or both (per
# edge type definition in schema/edges.yaml). This file feeds the linchpins:
#   - can-execute-as.yaml (ExecutesAs + CanModifyCode -> CanExecuteAs)
#   - can-execute-as.yaml (ExecutesAs + CanPassIdentity -> CanCreateWorkloadAs)
#   - can-control.yaml (CanExecuteAs -> CanEscalateTo)
# ---------------------------------------------------------------------------

provider: aws
phase: 11-data-analytics-ml
applies_to: [aws]

rules:

  # ===========================================================================
  # SECTION A — ExecutesAs FACTS (resource config fields)
  # ===========================================================================
  # ExecutesAs has nature=explicit in edges.yaml (line 350), so these rules
  # emit from raw resource configuration, not derived chains.

  - id: aws-sagemaker-executes-as-notebook
    emits: ExecutesAs
    description: "A SageMaker notebook instance executes kernel code as its RoleArn (execution role)."
    match_record: {resource_type: "AWS::SageMaker::NotebookInstance", field: "RoleArn"}
    where:
      - "RoleArn is non-empty"
      - "notebook is InService (running)"
    emit:
      source_type: Notebook
      target_type: MachineIdentity
      source: "<SageMaker NotebookInstance>"
      target: "<RoleArn>"
      state: CONDITIONAL
      conditions: [service_state]
      permissions: []
      false_positive_note: >-
        Only ACTIVE when the notebook is InService. A stopped notebook cannot
        be accessed until restarted; emit CONDITIONAL(service_state). The role
        credentials are available via IMDS (169.254.169.254) from the underlying
        EC2 instance inside the Jupyter kernel environment.
      narrative: >-
        SageMaker notebook {notebook.name} executes all kernel code as {role.name}
        (RoleArn); credentials are reachable via IMDS inside the Jupyter environment.

  - id: aws-sagemaker-executes-as-training-job
    emits: ExecutesAs
    description: "A SageMaker training job container executes as its RoleArn."
    match_record: {resource_type: "AWS::SageMaker::TrainingJob", field: "RoleArn"}
    where:
      - "RoleArn is non-empty"
    emit:
      source_type: BatchJob
      target_type: MachineIdentity
      source: "<SageMaker TrainingJob>"
      target: "<RoleArn>"
      state: ACTIVE
      permissions: []
      false_positive_note: >-
        Training jobs are ephemeral; once Complete/Failed the credentials are
        gone. Model this as a transient fact tied to the job definition configuration.
        Credentials injected by SageMaker training toolkit into the container
        environment — accessible by any process running in the container.
      narrative: >-
        SageMaker training job {job.name} runs its training container as {role.name};
        code in the container can call AWS APIs as this role.

  - id: aws-sagemaker-executes-as-processing-job
    emits: ExecutesAs
    description: "A SageMaker processing job container executes as its RoleArn."
    match_record: {resource_type: "AWS::SageMaker::ProcessingJob", field: "RoleArn"}
    where:
      - "RoleArn is non-empty"
    emit:
      source_type: BatchJob
      target_type: MachineIdentity
      source: "<SageMaker ProcessingJob>"
      target: "<RoleArn>"
      state: ACTIVE
      permissions: []
      false_positive_note: >-
        Ephemeral like training jobs. Credentials available inside the container.
        A Data Wrangler flow launches as a processing job and inherits the same role.
      narrative: >-
        SageMaker processing job {job.name} runs its container as {role.name}.

  - id: aws-sagemaker-executes-as-pipeline
    emits: ExecutesAs
    description: "A SageMaker Pipeline execution runs steps as its RoleArn."
    match_record: {resource_type: "AWS::SageMaker::Pipeline", field: "RoleArn"}
    where:
      - "RoleArn is non-empty"
    emit:
      source_type: Workflow
      target_type: MachineIdentity
      source: "<SageMaker Pipeline>"
      target: "<RoleArn>"
      state: ACTIVE
      permissions: []
      false_positive_note: >-
        The pipeline role orchestrates all steps; individual steps may also launch
        training/processing jobs which inherit the pipeline role by default unless
        a per-step role is specified. Only the pipeline-level role is modeled here;
        step-level overrides add additional ExecutesAs facts.
      narrative: >-
        SageMaker pipeline {pipeline.name} executes each step as {role.name}.

  - id: aws-sagemaker-executes-as-studio-app
    emits: ExecutesAs
    description: "A SageMaker Studio App (JupyterServer/KernelGateway) executes as the UserProfile's ExecutionRole."
    match_record: {resource_type: "AWS::SageMaker::UserProfile", field: "UserSettings.ExecutionRole"}
    where:
      - "ExecutionRole is non-empty"
      - "Studio apps for this UserProfile must be present/running in the graph"
    emit:
      source_type: Notebook
      target_type: MachineIdentity
      source: "<SageMaker App (JupyterServer/KernelGateway) under UserProfile>"
      target: "<UserSettings.ExecutionRole>"
      state: CONDITIONAL
      conditions: [service_state]
      permissions: []
      false_positive_note: >-
        Studio apps must be Running. ExecutionRole is set at the UserProfile level;
        Domain-level default ExecutionRole applies when no UserProfile override exists.
        Domain-level overrides should also emit this edge from the Domain's
        DefaultUserSettings.ExecutionRole if no UserProfile-specific role exists.
        NOTE: The source of this edge is the App node (type Notebook), which is a
        separate AWS::SageMaker::App resource (type JupyterServer/KernelGateway).
        The rule reads the role from UserProfile config, but the edge represents
        the App's execution identity. When an App node exists in the graph, source
        should reference it directly; when App is inferred or not yet instantiated,
        the rule documents the derivation from UserProfile config.
      narrative: >-
        SageMaker Studio apps for user profile {profile.name} run as {role.name};
        code in the kernel environment has this role's AWS credentials.

  - id: aws-sagemaker-executes-as-mlflow
    emits: ExecutesAs
    description: "An MLflow Tracking Server executes as its RoleArn."
    match_record: {resource_type: "AWS::SageMaker::MlflowTrackingServer", field: "RoleArn"}
    where:
      - "RoleArn is non-empty"
    emit:
      source_type: ApplicationPlatform
      target_type: MachineIdentity
      source: "<SageMaker MlflowTrackingServer>"
      target: "<RoleArn>"
      state: CONDITIONAL
      conditions: [service_state]
      permissions: []
      false_positive_note: >-
        Only relevant when the MLflow server is Created/Running. Role used to
        read/write model artifacts to S3. Low direct escalation value unless the
        role has broad S3 or IAM permissions.
      narrative: >-
        SageMaker MLflow tracking server {server.name} runs as {role.name}, giving
        it access to S3 model artifacts and other resources the role permits.

  - id: aws-sagemaker-executes-as-model
    emits: ExecutesAs
    description: "A SageMaker Model executes as its ExecutionRoleArn at serving (endpoint) and batch-transform time."
    match_record: {resource_type: "AWS::SageMaker::Model", field: "ExecutionRoleArn"}
    where:
      - "ExecutionRoleArn is non-empty"
      - "model is used by an Endpoint or TransformJob"
    emit:
      source_type: GenericCompute
      target_type: MachineIdentity
      source: "<SageMaker Model>"
      target: "<ExecutionRoleArn>"
      state: CONDITIONAL
      conditions: [service_state]
      permissions: []
      false_positive_note: >-
        The model's role is used when the model is invoked (real-time via endpoint
        or batch via transform job). If neither endpoint nor transform job uses the
        model, this ExecutesAs edge is latent (POTENTIAL). Caller of CreateEndpoint
        or CreateTransformJob does not need to PassRole (the role was bound at
        CreateModel time). This is distinct from training/processing/pipeline job
        roles which are passed per-job.
      narrative: >-
        SageMaker model {model.name} runs inference code as {role.name} when serving
        or transforming data; the role's credentials are accessible within the
        inference container.

  # ===========================================================================
  # SECTION D — CanPassIdentity FACTS (iam:PassRole normalization)
  # ===========================================================================
  # CanPassIdentity has nature=explicit in edges.yaml (line 239).
  # These rules apply explicit permission normalization (match_effective_permission)
  # to derive PassRole capability.

  - id: aws-sagemaker-pass-role-create-notebook
    emits: CanPassIdentity
    description: "iam:PassRole to sagemaker.amazonaws.com for notebook instance creation."
    match_effective_permission:
      action: "iam:PassRole"
      resource_type: "AWS::IAM::Role"
    where:
      - "principal has sagemaker:CreateNotebookInstance"
      - "iam:PassedToService condition (if present) includes sagemaker.amazonaws.com"
      - "target role trust policy allows sagemaker.amazonaws.com"
    emit:
      source_type: Identity
      target_type: MachineIdentity
      source: "<principal>"
      target: "<IAM Role passable to sagemaker.amazonaws.com>"
      permissions: ["iam:PassRole", "sagemaker:CreateNotebookInstance"]
      conditions: [iam_permission, condition_expression, role_compatibility]
      false_positive_note: >-
        iam:PassRole scoped by iam:PassedToService: a role passable only to
        ec2.amazonaws.com or lambda.amazonaws.com does NOT yield a SageMaker notebook
        execution role. Honor the condition. If the role trust policy does not include
        sagemaker.amazonaws.com, CreateNotebookInstance fails at the API level —
        downgrade to POTENTIAL(role_compatibility). Applies to UpdateNotebookInstance
        (role swap on existing notebook) with the same PassRole semantics.
      narrative: >-
        {principal.name} can pass {role.name} to a new SageMaker notebook instance
        (iam:PassRole + sagemaker:CreateNotebookInstance), causing the notebook to run
        as that role.

  - id: aws-sagemaker-pass-role-create-training-job
    emits: CanPassIdentity
    description: "iam:PassRole to sagemaker.amazonaws.com for training/processing/hyperparameter-tuning/compilation job creation."
    match_effective_permission:
      action: "iam:PassRole"
      resource_type: "AWS::IAM::Role"
    where:
      - "principal has one or more of: sagemaker:CreateTrainingJob, sagemaker:CreateProcessingJob, sagemaker:CreateHyperParameterTuningJob, sagemaker:CreateCompilationJob"
      - "iam:PassedToService condition (if present) includes sagemaker.amazonaws.com"
      - "target role trust policy allows sagemaker.amazonaws.com"
    emit:
      source_type: Identity
      target_type: MachineIdentity
      source: "<principal>"
      target: "<IAM Role passable to sagemaker.amazonaws.com>"
      permissions: ["iam:PassRole", "sagemaker:CreateTrainingJob|sagemaker:CreateProcessingJob|sagemaker:CreateHyperParameterTuningJob|sagemaker:CreateCompilationJob"]
      conditions: [iam_permission, condition_expression, role_compatibility]
      false_positive_note: >-
        Honor iam:PassedToService. The training job must actually be submitted to run
        the code; this edge is CanPassIdentity (pre-condition for CanCreateWorkloadAs).
        The escalation roll-up (CanCreateWorkloadAs -> CanExecuteAs) is performed by
        can-execute-as.yaml (execute-as-via-new-workload) — cite, do not re-derive.
        Processing/HPO/compilation jobs follow identical PassRole semantics;
        emit with all applicable create actions in the permissions list to reflect
        the full set of workload-creation capabilities the principal possesses.
      narrative: >-
        {principal.name} can pass {role.name} to a new SageMaker training/processing/
        hyper-parameter-tuning/compilation job (iam:PassRole + Create*Job), running
        a custom container as that role — the classic SageMaker PassRole privilege
        escalation.

  - id: aws-sagemaker-pass-role-create-pipeline
    emits: CanPassIdentity
    description: "iam:PassRole to sagemaker.amazonaws.com for pipeline creation, giving attacker-controlled pipeline steps the passed role's credentials."
    match_effective_permission:
      action: "iam:PassRole"
      resource_type: "AWS::IAM::Role"
    where:
      - "principal has sagemaker:CreatePipeline"
      - "iam:PassedToService condition (if present) includes sagemaker.amazonaws.com"
      - "target role trust policy allows sagemaker.amazonaws.com"
    emit:
      source_type: Identity
      target_type: MachineIdentity
      source: "<principal>"
      target: "<IAM Role passable to sagemaker.amazonaws.com>"
      permissions: ["iam:PassRole", "sagemaker:CreatePipeline"]
      conditions: [iam_permission, condition_expression, role_compatibility]
      false_positive_note: >-
        PassRole to create pipeline combined with sagemaker:StartPipelineExecution
        is required to fully execute; CanPassIdentity alone is the capability
        to attach. The can-execute-as linchpin produces the CanCreateWorkloadAs/
        CanExecuteAs roll-up.
      narrative: >-
        {principal.name} can create a SageMaker pipeline passing {role.name} as its
        execution role (iam:PassRole + sagemaker:CreatePipeline), then start it
        to run attacker-controlled steps as {role.name}.

  - id: aws-sagemaker-pass-role-create-model
    emits: CanPassIdentity
    description: "iam:PassRole to sagemaker.amazonaws.com for model creation, binding a role to be used at serving/transform time."
    match_effective_permission:
      action: "iam:PassRole"
      resource_type: "AWS::IAM::Role"
    where:
      - "principal has sagemaker:CreateModel"
      - "iam:PassedToService condition (if present) includes sagemaker.amazonaws.com"
      - "target role trust policy allows sagemaker.amazonaws.com"
    emit:
      source_type: Identity
      target_type: MachineIdentity
      source: "<principal>"
      target: "<IAM Role passable to sagemaker.amazonaws.com>"
      permissions: ["iam:PassRole", "sagemaker:CreateModel"]
      conditions: [iam_permission, condition_expression, role_compatibility]
      false_positive_note: >-
        Unlike training/processing jobs, CreateModel PassRole does not directly
        trigger code execution — the role is latent until an Endpoint or TransformJob
        uses the model. This is CanPassIdentity (role binding capability). Execution
        escalation is CONDITIONAL(service_state) on the model being deployed
        (endpoint created / transform job invoked).
      narrative: >-
        {principal.name} can create a SageMaker model passing {role.name} as its
        execution role (iam:PassRole + sagemaker:CreateModel), making the role
        available for use when the model is invoked via endpoint or transform job.

  - id: aws-sagemaker-pass-role-update-mlflow-config
    emits: CanPassIdentity
    description: "iam:PassRole to sagemaker.amazonaws.com for MLflow tracking server role updates."
    match_effective_permission:
      action: "iam:PassRole"
      resource_type: "AWS::IAM::Role"
    where:
      - "principal has sagemaker:UpdateMlflowTrackingServer"
      - "iam:PassedToService condition (if present) includes sagemaker.amazonaws.com"
      - "target role trust policy allows sagemaker.amazonaws.com"
    emit:
      source_type: Identity
      target_type: MachineIdentity
      source: "<principal>"
      target: "<IAM Role passable to sagemaker.amazonaws.com>"
      permissions: ["iam:PassRole", "sagemaker:UpdateMlflowTrackingServer"]
      conditions: [iam_permission, condition_expression, role_compatibility]
      false_positive_note: >-
        Updating the MLflow tracking server's RoleArn with PassRole is a
        configuration-identity swap (CanPassIdentity + CanModifyConfiguration).
        The linchpin can-execute-as.yaml will produce CanExecuteAs via
        execute-as-via-config-identity-swap.
      narrative: >-
        {principal.name} can update the MLflow tracking server's execution role
        (iam:PassRole + sagemaker:UpdateMlflowTrackingServer), redirecting
        the server's operations to use a different (possibly more privileged) role.

  # ===========================================================================
  # SECTION E — CanReadData FACTS (data-plane permission evaluation)
  # ===========================================================================
  # CanReadData has nature=derived in edges.yaml, but this rule applies explicit
  # permission evaluation (match_effective_permission) to derive the capability.
  # This is an explicit normalization pattern — permission-to-edge evaluation —
  # and is thus kept in the explicit rules file.

  - id: aws-sagemaker-feature-group-read-data
    emits: CanReadData
    description: "GetRecord / BatchGetRecord reads ML feature data from a SageMaker Feature Store online store."
    match_effective_permission:
      action: "sagemaker:GetRecord"
      resource_type: "AWS::SageMaker::FeatureGroup"
    where:
      - "feature group has an online store enabled"
    emit:
      source_type: Identity
      target_type: GenericData
      source: "<principal>"
      target: "<SageMaker FeatureGroup>"
      permissions: ["sagemaker:GetRecord", "sagemaker:BatchGetRecord"]
      conditions: [iam_permission, resource_policy]
      false_positive_note: >-
        Online store reads return individual feature records — structured data, not
        bulk. Bulk offline-store access requires S3 read on the offline store prefix,
        which is an S3 CanReadData edge, not a SageMaker edge. For offline store S3
        access, the standard S3 rules apply. Feature data may contain PII or sensitive
        ML training labels — treat as sensitive data.
      narrative: >-
        {principal.name} can read feature records from {featuregroup.name}'s online
        store (sagemaker:GetRecord / sagemaker:BatchGetRecord).
