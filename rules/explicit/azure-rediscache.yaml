# Azure Cache for Redis — Explicit normalization rules (Phase 6 — storage & databases)
# ---------------------------------------------------------------------------
# These rules normalize raw ARM API responses and effective RBAC evaluations
# into explicit graph edges. They are pre-conditions for the derived rules in
# /rules/derived/azure/rediscache.yaml.
#
# All edges emitted here are nature: explicit (directly observed from config/RBAC).
# ---------------------------------------------------------------------------

provider: azure
phase: 6-storage-databases
applies_to: [azure]

rules:

  # --------------------------------------------------------------------------
  # RBAC — effective permission normalization
  # --------------------------------------------------------------------------

  - id: azure-rediscache-effective-listkeys-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Cache/redis/listKeys/action"
      resource_type: "Microsoft.Cache/redis"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Redis cache node (Cache generic_type)>"
      permissions: ["Microsoft.Cache/redis/listKeys/action"]
      narrative: >-
        {principal.name} has effective Microsoft.Cache/redis/listKeys/action on
        {cache.name}. This ARM control-plane permission allows retrieval of the
        primary and secondary access keys from any network, regardless of the cache
        firewall or publicNetworkAccess configuration.

  - id: azure-rediscache-effective-write-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Cache/redis/write"
      resource_type: "Microsoft.Cache/redis"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Redis cache node (Cache generic_type)>"
      permissions: ["Microsoft.Cache/redis/write"]
      narrative: >-
        {principal.name} has effective Microsoft.Cache/redis/write on {cache.name}.
        This permission covers all cache properties including redisConfiguration
        (authnotrequired, enableNonSslPort), network access settings, and managed
        identity assignment.

  - id: azure-rediscache-effective-firewallrules-write-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Cache/redis/firewallRules/write"
      resource_type: "Microsoft.Cache/redis"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Redis cache node (Cache generic_type)>"
      permissions: ["Microsoft.Cache/redis/firewallRules/write"]
      narrative: >-
        {principal.name} has effective Microsoft.Cache/redis/firewallRules/write on
        {cache.name}, allowing creation or modification of IP firewall rules (including
        opening the full internet range 0.0.0.0–255.255.255.255).

  - id: azure-rediscache-effective-regeneratekey-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Cache/redis/regenerateKey/action"
      resource_type: "Microsoft.Cache/redis"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Redis cache node (Cache generic_type)>"
      permissions: ["Microsoft.Cache/redis/regenerateKey/action"]
      narrative: >-
        {principal.name} has effective Microsoft.Cache/redis/regenerateKey/action on
        {cache.name}, allowing key rotation to revoke existing sessions or establish
        persistence with attacker-controlled keys.

  # --------------------------------------------------------------------------
  # STRUCTURAL — resource hierarchy and inventory
  # --------------------------------------------------------------------------

  - id: azure-rediscache-firewall-rule-contains
    emits: Contains
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.Cache/redis/firewallRules"
      parent_type: "Microsoft.Cache/redis"
    emit:
      source_type: Cache
      target_type: Firewall
      source: "<parent Redis cache node (Cache generic_type)>"
      target: "<firewall rule node (Firewall generic_type)>"
      api_source: "GET https://management.azure.com/.../Microsoft.Cache/redis/{name}/firewallRules"
      evidence_field: "properties.startIpAddress, properties.endIpAddress, name"
      narrative: >-
        {cache.name} has IP firewall rule {rule.name} restricting data-plane access
        to the range {startIp}–{endIp}.

  - id: azure-rediscache-access-key-credential
    emits: ContainsCredential
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.Cache/redis"
    emit:
      source_type: Cache
      target_type: AccessKey
      source: "<Redis cache node (Cache generic_type)>"
      target: "<AccessKey node — primary and secondary Redis access keys>"
      api_source: "GET https://management.azure.com/.../Microsoft.Cache/redis/{name}"
      evidence_field: >-
        Existence of the cache resource (keys are always present as long as
        authentication is required). Key VALUES are not retrieved by the read-only
        collector; existence is inferred from the cache resource being active and
        having authentication enabled (authnotrequired != 'yes').
      narrative: >-
        {cache.name} holds primary and secondary access keys that authenticate to the
        Redis data-plane (full read/write). The keys are retrievable via
        listKeys/action by any identity with that ARM RBAC permission.

