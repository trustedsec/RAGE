# AWS FSx — Explicit normalization rules (Phase 6 — Storage & Databases)
# ---------------------------------------------------------------------------
# These rules emit EXPLICIT edges from FSx API responses and collector data,
# feeding the derived rules in /rules/derived/aws/fsx.yaml.
#
# EXPLICIT edges have nature: explicit (not derived) and are produced by
# normalizing raw collector observations into structured graph nodes/edges.
# They are prerequisites for downstream derived rules (e.g., CrossAccountTrust
# edges ground the cross-account exfil path in aws-fsx-backup-cross-account-exfil).
# ---------------------------------------------------------------------------

provider: aws
phase: 6-storage-databases
applies_to: [aws]

rules:

  # --- Cross-account trust via backup resource policy ----------------------
  # When fsx:GetResourcePolicy on a backup ARN returns a policy with a
  # Principal from a different account, emit CrossAccountTrust(ResourcePolicy ->
  # ExternalAccount). This is an explicit edge derived from collector data,
  # not from IAM permission structure. It documents that the resource policy
  # itself trusts an external account, grounding the resource-policy side of
  # the cross-account exfil path (aws-fsx-backup-cross-account-exfil rule).
  #
  # NATURE: explicit — this is direct observation from GetResourcePolicy
  # response, not a derived inference. CrossAccountTrust has nature: both
  # in edges.yaml (it appears in both explicit normalization and derived rules).
  #
  # SOURCE CONFORMANCE: CrossAccountTrust source set in edges.yaml includes
  # ResourcePolicy, so we emit the ResourcePolicy node attached to the backup,
  # not the Backup node itself. This satisfies the sourceTargetConformant check.
  - id: aws-fsx-backup-resource-policy-cross-trust
    emits: CrossAccountTrust
    description: >-
      A backup's resource policy (via fsx:GetResourcePolicy) grants fsx:CopyBackup
      to a principal in a different AWS account, establishing a cross-account
      trust on the backup resource.
    match:
      - [ ?backup, HasPolicy, ?resource_policy ]
      - [ ?backup, LocatedIn, ?account ]
    where:
      - "node_type(?backup) == Backup"
      - "?backup.provider_type == 'AWS::FSx::Backup'"
      - "node_type(?resource_policy) == ResourcePolicy"
      - "collector evidence: fsx:GetResourcePolicy(?backup) response includes a Statement with Principal from external account"
      - "the Statement grants fsx:CopyBackup or fsx:* to the external account"
      - "?external_account != ?account  # different account"
    emit:
      source_type: ResourcePolicy
      target_type: ExternalIdentity
      source: ?resource_policy
      target: "<ExternalAccount principal from resource policy>"
      permissions: []
      conditions: []
      state_logic: >-
        ACTIVE if fsx:GetResourcePolicy response is confirmed to include a
        Statement granting fsx:CopyBackup (or fsx:*) to a principal in a
        different account. This is a direct data fact, not a per-principal
        derivation. Downstream, this edge feeds aws-fsx-backup-cross-account-exfil:
        a principal in the external account holding fsx:CopyBackup can use
        this CrossAccountTrust to justify the CanExfiltrate edge.
      confidence: 0.95
      derived_from: []
      false_positive_note: >-
        Only emit when fsx:GetResourcePolicy explicitly returns a Statement
        granting access to a principal in a different account. Verify the
        account number is truly external (not same account). Do not emit if
        the policy grants only s3:GetObject or other non-FSx permissions.
      narrative: >-
        {backup.name} (FSx Backup) has a resource policy granting fsx:CopyBackup
        to a principal in account {external_account.name}. This establishes a
        cross-account trust on the backup, enabling the external account to
        pull a copy of the backup via fsx:CopyBackup.


# ---------------------------------------------------------------------------
# END OF EXPLICIT RULES
# These edges feed the derived rules in /rules/derived/aws/fsx.yaml:
#   - CrossAccountTrust (ResourcePolicy -> ExternalAccount) from fsx:GetResourcePolicy
#     observation feeds rule (1) aws-fsx-backup-cross-account-exfil and rule (2)
#     aws-fsx-put-resource-policy-cross-account-grant. The source is the ResourcePolicy
#     node (attached to the backup), not the Backup node, to satisfy sourceTargetConformant.
# ---------------------------------------------------------------------------
