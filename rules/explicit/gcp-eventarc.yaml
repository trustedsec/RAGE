# GCP Eventarc — Explicit normalization rules (raw config → explicit edges)
# ---------------------------------------------------------------------------
# Converts raw Eventarc API records into explicit graph edges. These run
# BEFORE derived rules and feed gcp/eventarc.yaml's pattern matching.
#
# Sources:
#   eventarc.projects.locations.triggers.get
#   eventarc.projects.locations.triggers.getIamPolicy
#   eventarc.projects.locations.messageBuses.get
#   eventarc.projects.locations.messageBuses.getIamPolicy
#   pubsub.projects.topics.getIamPolicy   (for transport topic IAM)
# ---------------------------------------------------------------------------

provider: gcp
phase: 10-messaging
service: eventarc
applies_to: [gcp]

rules:

  # --- Trigger → destination consumer (CanTrigger) ----------------------------
  - id: gcp-eventarc-explicit-trigger-to-cloudrun
    emits: CanTrigger
    description: "Live Eventarc trigger (state=ACTIVE) routes events to a Cloud Run service destination."
    match_record:
      api: "eventarc.projects.locations.triggers.get"
      field: "destination.cloudRun"
    where:
      - "trigger.state == ACTIVE"
      - "trigger.destination.cloudRun.service is set"
    emit:
      source_type: EventRule
      target_type: Compute
      source: "<Eventarc trigger node (EventRule)>"
      target: "<Cloud Run service node (ContainerService)>"
      evidence_fields: ["trigger.name", "trigger.destination.cloudRun.service", "trigger.destination.cloudRun.region", "trigger.state"]
      conditions: [trigger_exists, service_state]
      narrative: "Eventarc trigger {trigger.name} (state=ACTIVE) delivers events to Cloud Run service {destination.cloudRun.service}."

  - id: gcp-eventarc-explicit-trigger-to-workflow
    emits: CanTrigger
    description: "Live Eventarc trigger (state=ACTIVE) routes events to a GCP Workflow destination."
    match_record:
      api: "eventarc.projects.locations.triggers.get"
      field: "destination.workflow"
    where:
      - "trigger.state == ACTIVE"
      - "trigger.destination.workflow is set"
    emit:
      source_type: EventRule
      target_type: Compute
      source: "<Eventarc trigger node (EventRule)>"
      target: "<Workflow node (Workflow)>"
      evidence_fields: ["trigger.name", "trigger.destination.workflow", "trigger.state"]
      conditions: [trigger_exists, service_state]
      narrative: "Eventarc trigger {trigger.name} (state=ACTIVE) delivers events to Workflow {destination.workflow}."

  - id: gcp-eventarc-explicit-trigger-to-gcf
    emits: CanTrigger
    description: "Live Eventarc trigger (state=ACTIVE) routes events to a Cloud Function destination."
    match_record:
      api: "eventarc.projects.locations.triggers.get"
      field: "destination.cloudFunction"
    where:
      - "trigger.state == ACTIVE"
      - "trigger.destination.cloudFunction is set"
    emit:
      source_type: EventRule
      target_type: Compute
      source: "<Eventarc trigger node (EventRule)>"
      target: "<Cloud Function node (ServerlessFunction)>"
      evidence_fields: ["trigger.name", "trigger.destination.cloudFunction", "trigger.state"]
      conditions: [trigger_exists, service_state]
      narrative: "Eventarc trigger {trigger.name} (state=ACTIVE) delivers events to Cloud Function {destination.cloudFunction}."

  - id: gcp-eventarc-explicit-trigger-to-gke
    emits: CanTrigger
    description: "Live Eventarc trigger (state=ACTIVE) routes events to a GKE service endpoint."
    match_record:
      api: "eventarc.projects.locations.triggers.get"
      field: "destination.gke"
    where:
      - "trigger.state == ACTIVE"
      - "trigger.destination.gke.cluster is set"
    emit:
      source_type: EventRule
      target_type: Compute
      source: "<Eventarc trigger node (EventRule)>"
      target: "<GKE workload / service node (KubernetesWorkload)>"
      evidence_fields: ["trigger.name", "trigger.destination.gke.cluster", "trigger.destination.gke.namespace", "trigger.destination.gke.service", "trigger.state"]
      conditions: [trigger_exists, service_state, network_reachability]
      narrative: "Eventarc trigger {trigger.name} (state=ACTIVE) delivers events to GKE service {destination.gke.service} in cluster {destination.gke.cluster}."

  # --- Transport Pub/Sub topic → trigger (CanTrigger) -------------------------
  # NOTE: This rule emits Topic → EventRule, not Topic → Compute. The linter must
  # accept this edge (source: Topic ∈ Messaging, target: EventRule ∈ Messaging).
  # The derived file (gcp/eventarc.yaml) collapses Topic→EventRule→Compute into a
  # direct Topic→Compute rule (gcp-eventarc-publish-to-trigger) for messaging-chains.
  - id: gcp-eventarc-explicit-topic-to-trigger
    emits: CanTrigger
    description: "The Eventarc-managed Pub/Sub transport topic backs the trigger's event delivery — connects Topic node to EventRule node for the two-hop chain."
    match_record:
      api: "eventarc.projects.locations.triggers.get"
      field: "transport.pubsub.topic"
    where:
      - "trigger.transport.pubsub.topic is set"
      - "trigger.state == ACTIVE"
    emit:
      source_type: Topic
      target_type: EventRule
      source: "<Pub/Sub topic node serving as transport for the Eventarc trigger>"
      target: "<Eventarc trigger node routing events to its destination consumer>"
      evidence_fields: ["trigger.transport.pubsub.topic", "trigger.transport.pubsub.subscription", "trigger.state"]
      conditions: [trigger_exists, service_state]
      narrative: "{topic.name} is the Pub/Sub transport topic backing Eventarc trigger {trigger.name}."

  # --- Trigger delivery service account (ExecutesAs) -------------------------
  # NOTE: ExecutesAs.source is declared [Compute, Messaging] in edges.yaml.
  # This emits ExecutesAs(EventRule → ServiceAccount), which is valid per the schema.
  # The trigger SA is the DELIVERY identity, not the CanExecuteAs target (the consumer's
  # runtime SA is). This edge feeds CanPassIdentity derivations (trigger SA swap via
  # update). The consumer's ExecutesAs is emitted by the consumer's own rule file
  # and consumed by messaging-chains rule 2 → CanExecuteAs(publisher → consumer-SA).
  - id: gcp-eventarc-explicit-delivery-sa
    emits: ExecutesAs
    description: "An Eventarc trigger uses its serviceAccount field as the delivery identity when calling the destination endpoint."
    match_record:
      api: "eventarc.projects.locations.triggers.get"
      field: "serviceAccount"
    emit:
      source_type: EventRule
      target_type: ServiceAccount
      source: "<Eventarc trigger node that authenticates event delivery as its configured service account>"
      target: "<trigger service account node (ServiceAccount)>"
      evidence_fields: ["trigger.serviceAccount"]
      narrative: "Eventarc trigger {trigger.name} authenticates event delivery using service account {sa.name}."

  # --- Trigger IAM policy (HasPolicy) ----------------------------------------
  - id: gcp-eventarc-explicit-trigger-has-policy
    emits: HasPolicy
    description: "An Eventarc trigger has an IAM allow policy governing who may manage it."
    match_record:
      api: "eventarc.projects.locations.triggers.getIamPolicy"
      field: "bindings"
    emit:
      source_type: EventRule
      target_type: Policy
      source: "<Eventarc trigger node (EventRule)>"
      target: "<trigger ResourcePolicy node>"
      narrative: "{trigger.name} has an IAM allow policy controlling who may view, update, or delete it."

  # --- Message bus IAM policy (HasPolicy) ------------------------------------
  - id: gcp-eventarc-explicit-bus-has-policy
    emits: HasPolicy
    description: "An Eventarc Advanced message bus has an IAM allow policy governing who may publish to it."
    match_record:
      api: "eventarc.projects.locations.messageBuses.getIamPolicy"
      field: "bindings"
    emit:
      source_type: EventBus
      target_type: Policy
      source: "<Eventarc message bus node (EventBus)>"
      target: "<message bus ResourcePolicy node>"
      narrative: "{bus.name} has an IAM allow policy controlling who may publish events to it."

  # --- Cross-project trust: trigger IAM grants external principal update rights
  - id: gcp-eventarc-explicit-cross-project-trigger
    emits: CrossProjectTrust
    description: "An IAM binding on an Eventarc trigger granting trigger management permissions to a principal in a different project."
    match_record:
      api: "eventarc.projects.locations.triggers.getIamPolicy"
      field: "bindings[].members"
    where:
      - "member (user:, serviceAccount:) belongs to a different project than the trigger"
      - "the binding includes eventarc.triggers.update, eventarc.triggers.create, or a role containing those (roles/eventarc.developer, roles/eventarc.admin)"
    emit:
      source_type: ResourcePolicy
      target_type: Project
      source: "<trigger IAM allow policy node (ResourcePolicy)>"
      target: "<external project of the granted principal>"
      evidence_fields: ["iamPolicy.bindings[].members", "iamPolicy.bindings[].role"]
      narrative: "The IAM policy of {trigger.name} grants trigger management rights to a principal in project {ext_project.name}."

  # --- Cross-project trust: message bus IAM grants external principal publish
  - id: gcp-eventarc-explicit-cross-project-bus
    emits: CrossProjectTrust
    description: "An IAM binding on an Eventarc Advanced message bus granting publish rights to a principal in a different project."
    match_record:
      api: "eventarc.projects.locations.messageBuses.getIamPolicy"
      field: "bindings[].members"
    where:
      - "member (user:, serviceAccount:) belongs to a different project than the message bus"
      - "the binding includes eventarc.messageBuses.publish"
    emit:
      source_type: ResourcePolicy
      target_type: Project
      source: "<message bus IAM allow policy node (ResourcePolicy)>"
      target: "<external project of the granted principal>"
      evidence_fields: ["iamPolicy.bindings[].members", "iamPolicy.bindings[].role"]
      narrative: "The IAM policy on message bus {bus.name} grants publish rights to a principal in project {ext_project.name}."
