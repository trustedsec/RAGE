# AWS Data Pipeline — Explicit normalization rules (raw config -> explicit edges)
# ---------------------------------------------------------------------------
# These rules extract factual relationships directly from AWS Data Pipeline
# configuration and IAM policies without derivation.
#
# Rule pattern: match_record on pipeline definition fields, emit ExecutesAs or
# ContainsSecret edges after API collection (datapipeline:GetPipelineDefinition).
# ---------------------------------------------------------------------------

provider: aws
phase: 11-data-analytics-ml
applies_to: [aws]

rules:

  # --- 1) Pipeline resource role from config --------------------------------
  # FACT: Emit ExecutesAs(EC2-or-EmrCluster-resource, resourceRole) based on the
  # pipeline definition's resourceRole field. This is an explicit observable fact
  # from the API, not a derivation.
  - id: aws-datapipeline-pipeline-executes-as-resource-role
    emits: ExecutesAs
    description: "Explicit extraction: a pipeline's EC2 or EMR resource node runs as the IAM role specified in the resourceRole field."
    match_record:
      resource_type: "AWS::DataPipeline::Pipeline"
      field: "pipelineObjects[type=Ec2Resource or type=EmrCluster].resourceRole"
    emit:
      source_type: Compute
      target_type: Role
      source: "<EC2Resource or EmrCluster compute node>"
      target: "<resourceRole IAM role ARN>"
      api_source: "datapipeline:GetPipelineDefinition"
      evidence_field: "pipelineObjects[type=Ec2Resource|EmrCluster].fields[id=resourceRole].stringValue"
      narrative: "Pipeline {pipeline.name}'s resource node runs as {role.name} (resourceRole field)."

  # --- 2) Pipeline service role from config --------------------------------
  # FACT: Emit ExecutesAs(Pipeline-Workflow, pipelineRole) based on the pipeline
  # definition's role field. The Data Pipeline service assumes this role for
  # provisioning and service operations.
  - id: aws-datapipeline-pipeline-executes-as-pipeline-role
    emits: ExecutesAs
    description: "Explicit extraction: the Data Pipeline service assumes the role specified in the role field."
    match_record:
      resource_type: "AWS::DataPipeline::Pipeline"
      field: "pipelineObjects[type=Default].role"
    emit:
      source_type: Messaging
      target_type: Role
      source: "<pipeline Workflow node>"
      target: "<role IAM role ARN>"
      api_source: "datapipeline:GetPipelineDefinition"
      evidence_field: "pipelineObjects[type=Default].fields[id=role].stringValue"
      narrative: "Pipeline {pipeline.name} uses {role.name} as its service role (role field) for resource provisioning."

  # --- 3) Plaintext secrets in pipeline definition --------------------------
  # FACT: Emit ContainsSecret(Pipeline, Secret) when pipeline definition contains
  # plaintext credentials in command fields, environment variables, or arguments.
  # Visible to any principal with datapipeline:GetPipelineDefinition.
  - id: aws-datapipeline-definition-contains-secret
    emits: ContainsSecret
    description: "Explicit extraction: pipeline definition contains plaintext credential material in activity fields."
    match_record:
      resource_type: "AWS::DataPipeline::Pipeline"
      field: "pipelineObjects[type=ShellCommandActivity].fields[id=command or id=scriptArgument or id=env]"
    emit:
      source_type: Messaging
      target_type: Secret
      source: "<pipeline Workflow node>"
      target: "<Secret or Credential node>"
      api_source: "datapipeline:GetPipelineDefinition"
      evidence_field: "pipelineObjects[type=ShellCommandActivity].fields[id=command|scriptArgument|env].stringValue"
      note: >-
        Emit when a plaintext environment variable, command argument, or script argument
        pattern-matches credential material (AWS access key ID pattern, password regex,
        API key token pattern). Visible to any principal with datapipeline:GetPipelineDefinition.
      narrative: "Pipeline {pipeline.name}'s definition contains plaintext credential material in activity command/argument fields, visible to any principal with datapipeline:GetPipelineDefinition."
