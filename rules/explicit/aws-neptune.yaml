# AWS Neptune — Explicit (normalization) rules
# ---------------------------------------------------------------------------
# These edges are emitted from IAM policy analysis and Neptune cluster
# configuration (via DescribeDBClusters, DescribeDBClusterSnapshots,
# DescribeDBClusterSnapshotAttributes APIs). They normalize IAM permissions
# and cluster/snapshot attributes into explicit capability edges.
#
# source_type/target_type must match schema/edges.yaml declarations:
#   CanAdminister:           source: [Identity], target: [Compute, Storage, Data, Messaging]
#   CanModifyConfiguration:  source: [Identity], target: [Compute, Storage, Data, Messaging]
#   CrossAccountTrust:       source: [Account, Role, ResourcePolicy, Data, Snapshot, DataLake]
#                            target: [Account, ExternalIdentity]
#   ExposedToInternet:       source: [Compute, Data, PublicEndpoint, LoadBalancer, Storage, Messaging, DNS]
#                            target: [AnonymousIdentity]
# ---------------------------------------------------------------------------

provider: aws
phase: 6-storage-databases
applies_to: [aws]

rules:

  # --- CanAdminister: rds:ModifyDBCluster alone grants administrative control ---
  # A principal with rds:ModifyDBCluster on the cluster resource ARN can modify
  # all cluster configuration including disabling IAM database authentication,
  # changing VPC security groups, modifying parameter groups, and toggling deletion
  # protection. This is sufficient for full administrative control.
  #
  # Note: neptune:DeleteDBCluster is a separate permission. While both together are
  # strongest, ModifyDBCluster alone is sufficient for CanAdminister because it can
  # disable the primary access control (IAM auth toggle) and modify security boundaries.
  - id: aws-neptune-can-administer
    emits: CanAdminister
    applies_to: [aws]
    description: >-
      Principal with rds:ModifyDBCluster on the cluster resource ARN can administer
      the cluster: modify IAM auth settings, VPC security groups, parameter groups,
      and deletion protection.
    match_effective_permission:
      action: "rds:ModifyDBCluster"
      resource_type: "AWS::Neptune::DBCluster"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<Neptune cluster (NoSQLDatabase)>"
      permissions: ["rds:ModifyDBCluster"]
      narrative: >-
        {principal.name} can administer Neptune cluster {cluster.name} via
        rds:ModifyDBCluster, including disabling IAM database authentication,
        modifying VPC security groups, changing parameter groups, and toggling
        deletion protection — full administrative configuration control.

  # --- CanModifyConfiguration: rds:ModifyDBCluster ---
  # A principal with rds:ModifyDBCluster on the cluster resource ARN can modify
  # Neptune cluster configuration. The highest-value modification is disabling IAM
  # database authentication (EnableIAMDatabaseAuthentication=false), which downgrades
  # the endpoint from IAM-auth-gated to unauthenticated access (if publicly exposed).
  - id: aws-neptune-can-modify-configuration
    emits: CanModifyConfiguration
    applies_to: [aws]
    description: >-
      Principal with rds:ModifyDBCluster on the cluster resource ARN can modify
      cluster configuration, including disabling IAM database authentication.
    match_effective_permission:
      action: "rds:ModifyDBCluster"
      resource_type: "AWS::Neptune::DBCluster"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<Neptune cluster (NoSQLDatabase)>"
      permissions: ["rds:ModifyDBCluster"]
      narrative: >-
        {principal.name} can modify Neptune cluster {cluster.name} configuration
        via rds:ModifyDBCluster, including disabling IAM database authentication
        (EnableIAMDatabaseAuthentication=false) to remove the IAM access gate.

  # --- CrossAccountTrust: snapshot sharing to specific account ---
  # A Neptune cluster snapshot with restore permission granted to a specific AWS
  # account via rds:ModifyDBClusterSnapshotAttribute establishes a trust edge.
  # That account can call rds:RestoreDBClusterFromSnapshot to create a full copy
  # of all graph data.
  - id: aws-neptune-snapshot-cross-account-trust
    emits: CrossAccountTrust
    applies_to: [aws]
    description: >-
      Neptune cluster snapshot is shared for restore with a specific external AWS account
      via neptune:DescribeDBClusterSnapshotAttributes (restore attribute contains account ID).
    match_record:
      resource_type: "AWS::Neptune::DBClusterSnapshot"
      field: "DBClusterSnapshotAttributes[restore].AttributeValues"
    where:
      - "AttributeValues contains a specific AWS account ID (not 'all')"
    emit:
      source_type: Snapshot
      target_type: Account
      source: "<Neptune cluster snapshot (Snapshot)>"
      target: "<external AWS account (Account)>"
      api_source: "neptune:DescribeDBClusterSnapshotAttributes"
      evidence_field: "DBClusterSnapshotAttributes[restore].AttributeValues"
      narrative: >-
        Neptune cluster snapshot {snapshot.name} is shared for restore with account
        {accountId} — that account can call rds:RestoreDBClusterFromSnapshot to
        create a full copy of all graph data (vertices, edges, properties).

  # --- CrossAccountTrust: snapshot public (restore=all) ---
  # A Neptune cluster snapshot with restore permission granted to 'all' (any AWS account)
  # via rds:ModifyDBClusterSnapshotAttribute establishes a trust edge representing
  # share with external AWS accounts. Any AWS account can call
  # rds:RestoreDBClusterFromSnapshot to exfiltrate a full copy of the graph.
  # This is emitted as CrossAccountTrust (nature=both), which is then fed to a derived
  # rule (aws-neptune-snapshot-public-exposed in /rules/derived/aws/neptune.yaml)
  # that emits ExposedToInternet when AttributeValues='all'.
  - id: aws-neptune-snapshot-public-exposed-explicit
    emits: CrossAccountTrust
    applies_to: [aws]
    description: >-
      Neptune cluster snapshot is publicly restorable (restore attribute contains 'all')
      via neptune:DescribeDBClusterSnapshotAttributes, establishing a CrossAccountTrust.
    match_record:
      resource_type: "AWS::Neptune::DBClusterSnapshot"
      field: "DBClusterSnapshotAttributes[restore].AttributeValues"
    where:
      - "AttributeValues contains 'all'"
    emit:
      source_type: Snapshot
      target_type: Account
      source: "<Neptune cluster snapshot (Snapshot)>"
      target: "<external AWS account (representing all AWS accounts)>"
      api_source: "neptune:DescribeDBClusterSnapshotAttributes"
      evidence_field: "DBClusterSnapshotAttributes[restore].AttributeValues == 'all'"
      narrative: >-
        Neptune cluster snapshot {snapshot.name} is publicly restorable
        (AttributeValues contains 'all') — any AWS account can call
        rds:RestoreDBClusterFromSnapshot to create a full copy of all graph
        data without the owner's involvement (complete data exfiltration).
