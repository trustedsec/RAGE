# Normalizing GCP Memorystore for Redis into explicit edges.
# Adapter emits raw Memorystore API records; these rules translate them to
# common explicit edges (schema/edges.yaml). They do not combine edges.
# Permissions/actions are verbatim from
# cloud.google.com/memorystore/docs/redis/access-control

rules:

  # --- AUTH enabled state -> HasPolicy ----------------------------------------
  # Records whether AUTH is enabled on the instance. This explicit edge
  # enables downstream derived rules to match on the authEnabled state
  # as a precondition.
  - id: gcp-memorystore-explicit-auth-enabled
    emits: HasPolicy
    applies_to: [gcp]
    match_record: {resource_type: "google.redis.Instance", field: "authEnabled"}
    emit:
      source_type: Cache
      target_type: Policy
      source: "<Memorystore Cache instance node>"
      target: "<ResourcePolicy recording authEnabled state>"
      api_source: "redis.instances.get"
      evidence_field: "authEnabled"
      narrative: >-
        {instance.name} has AUTH {enabled/disabled} (authEnabled={value}). When enabled,
        clients must supply the AUTH string to connect. When disabled, any in-VPC client
        with network reach has full Redis access without credentials.

  # --- Instance VPC placement -> LocatedIn ------------------------------------
  # Records which VPC network the Memorystore instance is attached to.
  # This enables downstream rules to match network reachability conditions.
  - id: gcp-memorystore-explicit-network-located-in
    emits: LocatedIn
    applies_to: [gcp]
    match_record: {resource_type: "google.redis.Instance", field: "authorizedNetwork"}
    emit:
      source_type: Cache
      target_type: Network
      source: "<Memorystore Cache instance node>"
      target: "<VirtualNetwork node>"
      api_source: "redis.instances.get"
      evidence_field: "authorizedNetwork"
      narrative: >-
        {instance.name} is peered into VPC {network.name} at IP {instance.host}:{instance.port}.
        In-VPC clients with network reach to this IP can connect to the Redis data plane.

  # --- redis.instances.getAuthString effective permission -> CanReadCredential --
  # Emits the explicit "can read the AUTH string credential" permission.
  # This intermediate edge is consumed by derived rules that combine it with
  # network reachability and authEnabled state. CanReadCredential is nature: both,
  # so it can be emitted by explicit normalization (here) and consumed by derived rules.
  - id: gcp-memorystore-can-read-auth-string
    emits: CanReadCredential
    applies_to: [gcp]
    match_effective_permission:
      action: "redis.instances.getAuthString"
      resource_type: "google.redis.Instance"
    emit:
      source_type: Identity
      target_type: Credential
      source: "<principal holding redis.instances.getAuthString>"
      target: "<AUTH string Credential node for the instance>"
      permissions: ["redis.instances.getAuthString"]
      narrative: >-
        {principal.name} holds redis.instances.getAuthString on {instance.name}
        and can retrieve the Redis AUTH string (UUID) via the Memorystore API. The AUTH string is
        the shared credential for Redis protocol authentication.

  # --- redis.instances.update* effective permission -> CanModifyConfiguration --
  # Emits the ability to modify instance configuration, specifically the
  # authEnabled flag. This is a CanModifyConfiguration edge because disabling AUTH
  # removes access control and enables unauthenticated in-VPC access.
  - id: gcp-memorystore-can-modify-auth-config
    emits: CanModifyConfiguration
    applies_to: [gcp]
    match_effective_permission:
      action: ["redis.instances.update", "redis.instances.updateAuth"]
      resource_type: "google.redis.Instance"
    emit:
      source_type: Identity
      target_type: Cache
      source: "<principal holding redis.instances.update or redis.instances.updateAuth>"
      target: "<Memorystore Cache instance node>"
      permissions: ["redis.instances.update", "redis.instances.updateAuth"]
      narrative: >-
        {principal.name} can modify configuration on {instance.name}, including the authEnabled flag
        (redis.instances.update / redis.instances.updateAuth). Disabling AUTH removes the only
        access control above the VPC network layer, allowing any in-VPC client to connect without
        credentials.

  # --- redis.instances.export effective permission -> CanExfiltrate ----------
  # Emits the ability to export the Redis RDB snapshot to a GCS bucket.
  # This is a data exfiltration path that warrants CanExfiltrate.
  - id: gcp-memorystore-can-export-data
    emits: CanExfiltrate
    applies_to: [gcp]
    match_effective_permission:
      action: "redis.instances.export"
      resource_type: "google.redis.Instance"
    emit:
      source_type: Identity
      target_type: Cache
      source: "<principal holding redis.instances.export>"
      target: "<Memorystore Cache instance node>"
      permissions: ["redis.instances.export"]
      narrative: >-
        {principal.name} can export the Redis RDB snapshot from {instance.name}
        (redis.instances.export). An attacker with this permission and write access
        to a GCS bucket can exfiltrate all in-memory data.
