# Azure — Front Door & CDN (Microsoft.Cdn/profiles) — Explicit normalization rules
# ---------------------------------------------------------------------------
# Explicit normalization rules: ARM config → explicit edges.
# These rules extract direct, observable facts from Azure resource configs
# without deriving further chains. They feed the derived rules in
# /rules/derived/azure/frontdoor.yaml.
#
# Emitted edges:
#   - ExposedToInternet (nature: derived in edges.yaml; derived rules emit it)
#   - RoutesTo (nature: explicit in edges.yaml; must come from /rules/explicit/)
#   - CanAdminister (nature: explicit in edges.yaml; must come from /rules/explicit/)
#   - PrivateReachability (nature: derived; derived rules emit it)
#
# Permissions verified against the Azure resource-provider operations reference
# (Microsoft.Cdn, 2026-09 snapshot) and the Front Door Private Link docs.
# ---------------------------------------------------------------------------

provider: azure
phase: 8-networking
applies_to: [azure]

rules:

  # ===========================================================================
  # SECTION 1 — NORMALIZATION: AFD endpoint enabled → ExposedToInternet fact
  # ===========================================================================
  # Note: ExposedToInternet is nature: derived in edges.yaml, but this explicit
  # rule normalizes the raw ARM condition (properties.enabledState == 'Enabled')
  # into the explicit structural fact that an endpoint is publicly reachable.
  # The derived/ file then emits ExposedToInternet as a derived edge.

  - id: azure-frontdoor-endpoint-record
    emits: ExposedToInternet
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Cdn/profiles/afdEndpoints"
      field: "properties"
    where:
      - "properties.enabledState == 'Enabled'"
      - "parent profile sku.name in ['Standard_AzureFrontDoor', 'Premium_AzureFrontDoor']"
    emit:
      source_type: PublicEndpoint
      target_type: AnonymousIdentity
      source: "<AFD endpoint node>"
      target: "<AnonymousIdentity>"
      api_source: "Microsoft.Cdn/profiles/afdEndpoints GET"
      evidence_field: "properties.enabledState + properties.hostName"
      narrative: "AFD endpoint {endpoint.name} ({endpoint.hostName}) is enabled and publicly reachable."

  # ===========================================================================
  # SECTION 2 — NORMALIZATION: AFD route + origin → RoutesTo fact
  # ===========================================================================
  # RoutesTo is nature: explicit in edges.yaml; this rule extracts the
  # explicit routing configuration from AFD route definitions.

  - id: azure-frontdoor-origin-record
    emits: RoutesTo
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Cdn/profiles/afdEndpoints/routes"
      field: "properties"
    where:
      - "properties.enabledState == 'Enabled'"
      - "linked originGroup has at least one origin with properties.hostName non-empty OR sharedPrivateLinkResource not null"
    emit:
      source_type: Route
      target_type: PublicEndpoint
      source: "<AFD route node (Route, provider_type: Microsoft.Cdn/profiles/afdEndpoints/routes)>"
      target: "<origin resource node (PublicEndpoint for public, PrivateEndpoint for Private Link)>"
      api_source: "Microsoft.Cdn/profiles/afdEndpoints/routes GET + originGroups/origins GET"
      evidence_field: "properties.originGroup.id + resolved origin properties.hostName + properties.enabledState"
      narrative: "AFD route {route.name} (endpoint {endpoint.name}) routes to origin {origin.name} ({origin.hostName})."

  # ===========================================================================
  # SECTION 3 — NORMALIZATION: AFD Private Link origin → PrivateReachability fact
  # ===========================================================================

  - id: azure-frontdoor-private-link-origin-record
    emits: PrivateReachability
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Cdn/profiles/originGroups/origins"
      field: "properties.sharedPrivateLinkResource"
    where:
      - "properties.sharedPrivateLinkResource is not null"
      - "properties.enabledState == 'Enabled'"
      - "parent profile sku.name == 'Premium_AzureFrontDoor'"
    emit:
      source_type: Compute
      target_type: PrivateEndpoint
      source: "<Compute resources in the same VNet as the AFD-created private endpoint>"
      target: "<private endpoint backing the AFD Private Link origin>"
      api_source: "Microsoft.Cdn/profiles/originGroups/origins GET + target resource privateEndpointConnections GET"
      evidence_field: "properties.sharedPrivateLinkResource.privateLink.id + PE connection status"
      narrative: "AFD Premium profile {profile.name} reaches {linkedResource.name} via Private Link; compute in the same VNet can reach it privately."

  # ===========================================================================
  # SECTION 4 — NORMALIZATION: CDN Contributor/profile/write → CanAdminister
  # ===========================================================================
  # CanAdminister is nature: explicit in edges.yaml; this rule normalizes
  # the effective-permission evaluation into an explicit fact.

  - id: azure-frontdoor-contributor
    emits: CanAdminister
    description: >-
      Write access to the AFD profile object (Microsoft.Cdn/profiles/*)
      grants full control: endpoints, origin groups, origins, security policies,
      WAF links, rule sets, and custom domains.
    match_effective_permission:
      action: "Microsoft.Cdn/profiles/*"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds CDN Contributor / Contributor / Owner or a custom role granting Microsoft.Cdn/profiles/* at the scope"
    emit:
      source_type: Identity
      target_type: LoadBalancer
      source: "<principal>"
      target: "<AFD profile node (Microsoft.Cdn/profiles)>"
      permissions: ["Microsoft.Cdn/profiles/*"]
      state_logic: ACTIVE
      false_positive_note: >-
        CDN Contributor grants Microsoft.Cdn/profiles/* (all sub-resources, including
        endpoints, origins, security policies, rule sets) but NOT Microsoft.Authorization/*/write;
        it does not enable RBAC self-assignment. A grant of only Microsoft.Cdn/profiles/write
        (create/replace the profile object alone, without wildcard sub-resource control) should
        NOT emit CanAdminister — emit CanModifyConfiguration instead on specific sub-resources.
        This rule applies only to principals holding profiles/* (wildcard), which is CDN
        Contributor, Contributor, Owner, or a custom role bundling that permission.
        CDN Endpoint Contributor grants only endpoint-scoped sub-resources (afdEndpoints/*,
        originGroups/*, origins/*, ruleSets/*, securityPolicies/*) but NOT profiles/* or
        profiles/write itself; do not emit CanAdminister for it.
        CanAdminister → Controls is derived by can-control.yaml (cited, not duplicated here).
      narrative: >-
        {principal.name} has full administrative control of AFD profile {target.name}
        (Microsoft.Cdn/profiles/*), including all endpoints, origin groups, WAF links,
        rule sets, and custom domains.
