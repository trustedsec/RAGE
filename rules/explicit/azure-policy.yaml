# Azure Policy — Explicit normalization rules
# Emits ExecutesAs facts from policy assignment identity blocks.
# Phase 12 security & logging.

provider: azure
phase: 12-security-logging
applies_to: [azure]
nature: explicit

rules:

  # =========================================================================
  # Remediation task identity binding — explicit facts from assignment records
  # =========================================================================

  - id: azure-policy-assignment-executes-as-system-mi
    emits: ExecutesAs
    applies_to: [azure]
    description: >-
      A policy assignment with a system-assigned managed identity produces an ExecutesAs
      edge: remediation tasks run as that system MI. Extracted from the assignment's
      identity.principalId field.
    match_record:
      resource_type: "Microsoft.Authorization/policyAssignments"
      field: "identity"
    where:
      - "identity.type in [SystemAssigned, 'SystemAssigned, UserAssigned']"
      - "properties.policyDefinitionId references a definition with deployIfNotExists or modify effect"
    emit:
      source_type: BuildWorker
      target_type: ManagedIdentity
      source: "<remediation task for the policy assignment>"
      target: "<system-assigned MI (identity.principalId)>"
      api_source: "GET /subscriptions/{sub}/providers/Microsoft.Authorization/policyAssignments"
      evidence_field: "identity.principalId"
      nature: explicit
      confidence: 1.0
      narrative: "Policy assignment {assignment.name} remediation tasks run as system-assigned MI {target.name} (identity.principalId)."

  - id: azure-policy-assignment-executes-as-user-mi
    emits: ExecutesAs
    applies_to: [azure]
    description: >-
      A policy assignment with one or more user-assigned managed identities produces
      ExecutesAs edges for each. Extracted from the assignment's identity.userAssignedIdentities
      map (keys are MI resource IDs).
    match_record:
      resource_type: "Microsoft.Authorization/policyAssignments"
      field: "identity.userAssignedIdentities"
    where:
      - "identity.type == UserAssigned OR identity.type == 'SystemAssigned, UserAssigned'"
      - "identity.userAssignedIdentities is non-empty"
      - "properties.policyDefinitionId references a definition with deployIfNotExists or modify effect"
    emit:
      source_type: BuildWorker
      target_type: ManagedIdentity
      source: "<remediation task for the policy assignment>"
      target: "<user-assigned MI (key in userAssignedIdentities map)>"
      api_source: "GET /subscriptions/{sub}/providers/Microsoft.Authorization/policyAssignments"
      evidence_field: "identity.userAssignedIdentities"
      nature: explicit
      confidence: 1.0
      narrative: "Policy assignment {assignment.name} remediation tasks run as user-assigned MI {target.name}."

# NOTE: The exemption-to-assignment structural link (policyExemptions ->
# policyAssignmentId) is pure inventory — it does not feed any attack-path
# traversal. Collect it as a node property (policyExemption.properties.policyAssignmentId)
# rather than as a graph edge; HasPolicy.target is restricted to [Policy] class
# and ConfigurationService is not in that class. No explicit edge rule needed here.
