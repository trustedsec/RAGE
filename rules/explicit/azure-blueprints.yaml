# Azure Blueprints & Deployment Stacks — explicit normalization rules
# ===========================================================================
# Translate raw collected Microsoft.Blueprint and Microsoft.Resources/deploymentStacks
# config into common explicit edges (CanModifyCode, CanModifyConfiguration,
# CanPassIdentity, CanModifyPolicy) that feed the derived rules in
# /rules/derived/azure/blueprints.yaml.
#
# NORMALIZATION PATHS:
#   1. CanModifyCode (blueprints/write, artifacts/write, deploymentStacks/write)
#      — principal can edit the ARM template / assignment definition the runner executes.
#   2. CanModifyConfiguration (blueprintAssignments/write)
#      — principal can update the assignment object, controlling its parameters and MI binding.
#   3. CanPassIdentity (assign/action on a user-assigned MI)
#      — principal can bind a user-assigned MI to an assignment (when the assignment is writable).
#   4. ExecutesAs (blueprintAssignments identity block, deploymentStacks identity block)
#      — structural fact: blueprint/stack assignment runs as a managed identity.
#   5. CanModifyPolicy (blueprintAssignments/delete, deploymentStacks/delete)
#      — principal can delete the assignment/stack, removing system-managed deny assignments.
#   6. HasPolicy (deny assignment attached to assignment/stack)
#      — structural fact: system-managed deny assignments are owned by the assignment/stack.
#
# COLLECTION APIs:
#   az blueprint get --management-group <mgid> --blueprint-name <bp>
#   az blueprint assignment list --management-group <mgid>
#   az resource list --resource-type Microsoft.Resources/deploymentStacks
#   az role assignment list --assignee <principal-id>  [with roleAssignments/write filter]
#   az deny-assignment list --scope <scope>
#
# INTEGRATION WITH DERIVED RULES:
#   - Derived /rules/derived/azure/blueprints.yaml consumes these facts.
#   - Linchpins (cicd-chains, can-execute-as, hierarchy-chains) consume the
#     collapsed edges (CanExecuteAs, CanEnterSubscription, Controls) derived
#     from these explicit facts.
# ===========================================================================

provider: azure
applies_to: [azure]

rules:

  # === CODE MODIFICATION: normalization of blueprint/stack write permissions =====

  - id: azure-bp-definition-write
    emits: CanModifyCode
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Blueprint/blueprints/write"
      scope_type: "subscription|managementGroup"
    where: []
    emit:
      source_type: Identity
      target_type: BuildWorker
      source: "<principal>"
      target: "<blueprint definition(s) targeting assignment(s)>"
      permissions:
        - "Microsoft.Blueprint/blueprints/write"
      conditions: [service_state, trigger_exists]
      api_source: "Azure ARM: roleAssignments query filtered by Microsoft.Blueprint/blueprints/write"
      narrative: "{principal.name} can write/modify the blueprint definition (Microsoft.Blueprint/blueprints/write), gaining CanModifyCode over its deployment."

  - id: azure-bp-artifact-write
    emits: CanModifyCode
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Blueprint/blueprints/artifacts/write"
      scope_type: "subscription|managementGroup"
    where: []
    emit:
      source_type: Identity
      target_type: BuildWorker
      source: "<principal>"
      target: "<blueprint assignment(s) that deploy the definition>"
      permissions:
        - "Microsoft.Blueprint/blueprints/artifacts/write"
      conditions: [service_state, trigger_exists]
      api_source: "Azure ARM: roleAssignments query filtered by Microsoft.Blueprint/blueprints/artifacts/write"
      narrative: "{principal.name} can write blueprint artifacts (Microsoft.Blueprint/blueprints/artifacts/write), gaining CanModifyCode over the definition."

  - id: azure-stack-definition-write
    emits: CanModifyCode
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Resources/deploymentStacks/write"
      scope_type: "subscription|managementGroup|resourceGroup"
    where: []
    emit:
      source_type: Identity
      target_type: BuildWorker
      source: "<principal>"
      target: "<deployment stack>"
      permissions:
        - "Microsoft.Resources/deploymentStacks/write"
      conditions: [service_state, trigger_exists]
      api_source: "Azure ARM: roleAssignments query filtered by Microsoft.Resources/deploymentStacks/write"
      narrative: "{principal.name} can write/update Deployment Stacks (Microsoft.Resources/deploymentStacks/write), gaining CanModifyCode over the stack template."

  # === CONFIGURATION MODIFICATION: normalization of assignment write permissions ==

  - id: azure-bp-assignment-write
    emits: CanModifyConfiguration
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Blueprint/blueprintAssignments/write"
      scope_type: "subscription|managementGroup"
    where: []
    emit:
      source_type: Identity
      target_type: BuildWorker
      source: "<principal>"
      target: "<blueprint assignment>"
      permissions:
        - "Microsoft.Blueprint/blueprintAssignments/write"
      conditions: [role_compatibility]
      api_source: "Azure ARM: roleAssignments query filtered by Microsoft.Blueprint/blueprintAssignments/write"
      narrative: "{principal.name} can write blueprint assignments (Microsoft.Blueprint/blueprintAssignments/write), gaining CanModifyConfiguration over the assignment and implicit CanTrigger."

  # === TRIGGER: blueprint assignment write triggers deployment ==================

  - id: azure-bp-assignment-trigger
    emits: CanTrigger
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Blueprint/blueprintAssignments/write"
      scope_type: "subscription|managementGroup"
    where: []
    emit:
      source_type: Identity
      target_type: BuildWorker
      source: "<principal>"
      target: "<blueprint assignment>"
      permissions:
        - "Microsoft.Blueprint/blueprintAssignments/write"
      conditions: [role_compatibility]
      api_source: "Azure ARM: roleAssignments query filtered by Microsoft.Blueprint/blueprintAssignments/write"
      narrative: "{principal.name} can write a blueprint assignment (blueprintAssignments/write), which immediately triggers its deployment."

  # === CROSS-BOUNDARY: MG-scoped Deployment Stack cross-subscription ============

  - id: azure-stack-mg-scope-enter-subscription
    emits: CanEnterSubscription
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Resources/deploymentStacks/write"
      scope_type: "managementGroup"
    where: []
    emit:
      source_type: Identity
      target_type: Subscription
      source: "<principal>"
      target: "<each child subscription of the management group>"
      permissions:
        - "Microsoft.Resources/deploymentStacks/write"
      conditions: [service_state, iam_permission]
      api_source: "Azure ARM: roleAssignments query filtered by Microsoft.Resources/deploymentStacks/write at MG scope"
      narrative: "{principal.name} can deploy Deployment Stacks at management-group scope (Microsoft.Resources/deploymentStacks/write), gaining CanEnterSubscription for each child subscription."

  # === IDENTITY ATTACHMENT: pass user-assigned MI ==============================

  - id: azure-bp-pass-identity
    emits: CanPassIdentity
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.ManagedIdentity/userAssignedIdentities/assign/action"
      scope_type: "subscription|resourceGroup"
    where:
      - "principal holds EFFECTIVE Microsoft.Blueprint/blueprintAssignments/write at the assignment scope (separate check)"
    emit:
      source_type: Identity
      target_type: ManagedIdentity
      source: "<principal>"
      target: "<user-assigned managed identity>"
      permissions:
        - "Microsoft.ManagedIdentity/userAssignedIdentities/assign/action"
      conditions: [role_compatibility]
      api_source: "Azure ARM: roleAssignments query filtered by userAssignedIdentities/assign/action"
      narrative: "{principal.name} can assign user-assigned MI {mi.name} (Microsoft.ManagedIdentity/userAssignedIdentities/assign/action), gaining CanPassIdentity."

  # === GUARDRAIL REMOVAL: delete assignment/stack or change denySettings ========

  - id: azure-bp-delete-removes-deny
    emits: CanModifyPolicy
    applies_to: [azure]
    match_effective_permission:
      action: ["Microsoft.Blueprint/blueprintAssignments/delete", "Microsoft.Resources/deploymentStacks/delete"]
      scope_type: "subscription|managementGroup|resourceGroup"
    where: []
    emit:
      source_type: Identity
      target_type: ConditionalPolicy
      source: "<principal>"
      target: "<deny assignment owned by the blueprint assignment or deployment stack>"
      permissions:
        - "Microsoft.Blueprint/blueprintAssignments/delete"
        - "Microsoft.Resources/deploymentStacks/delete"
      conditions: [guardrail_owner_write]
      api_source: "Azure ARM: roleAssignments query + deny assignment ownership (createdBy)"
      narrative: "{principal.name} can delete blueprint assignments or deployment stacks (blueprintAssignments/delete or deploymentStacks/delete), which removes their system-managed deny assignments."

  - id: azure-stack-deny-settings-change
    emits: CanModifyPolicy
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Resources/deploymentStacks/write"
      scope_type: "subscription|managementGroup|resourceGroup"
    where:
      - "stack's denySettings is currently in a deny mode (denyAllActions | denyWriteAndDelete)"
    emit:
      source_type: Identity
      target_type: ConditionalPolicy
      source: "<principal>"
      target: "<deny assignment enforced by the stack>"
      permissions:
        - "Microsoft.Resources/deploymentStacks/write"
      conditions: [guardrail_owner_write]
      api_source: "Azure ARM: roleAssignments query + stack denySettings check"
      narrative: "{principal.name} can write a Deployment Stack with denySettings set to a deny mode (Microsoft.Resources/deploymentStacks/write), allowing them to change denySettings to remove the deny assignment."

  # === STRUCTURAL: ExecutesAs (blueprint assignment / stack identity) ===========

  - id: azure-bp-assignment-executes-as
    emits: ExecutesAs
    applies_to: [azure]
    match_effective_permission:
      # This rule normalizes the raw ARM identity block on a blueprint assignment.
      # Adapter collects Microsoft.Blueprint/blueprintAssignments GET.
      action: ["read"]  # structural fact extraction, not a permission gate
      resource_type: "Microsoft.Blueprint/blueprintAssignments"
      field: "identity.type"
    where:
      - "identity.type in [SystemAssigned, UserAssigned, 'SystemAssigned, UserAssigned']"
    emit:
      source_type: BuildWorker
      target_type: ManagedIdentity
      source: "<blueprint assignment>"
      target: "<managed identity (system-assigned principalId or user-assigned keys from identity.userAssignedIdentities)>"
      conditions: []
      api_source: "Azure ARM: Microsoft.Blueprint/blueprintAssignments GET (identity block)"
      narrative: "Blueprint assignment {assignment.name} executes as managed identity {mi.name} (type: {identity.type})."

  - id: azure-stack-executes-as
    emits: ExecutesAs
    applies_to: [azure]
    match_effective_permission:
      # This rule normalizes the raw ARM identity block on a deployment stack.
      # Adapter collects Microsoft.Resources/deploymentStacks GET.
      action: ["read"]  # structural fact extraction
      resource_type: "Microsoft.Resources/deploymentStacks"
      field: "identity.type"
    where:
      - "identity.type in [SystemAssigned, UserAssigned, 'SystemAssigned, UserAssigned']"
    emit:
      source_type: BuildWorker
      target_type: ManagedIdentity
      source: "<deployment stack>"
      target: "<managed identity (system-assigned principalId or user-assigned keys from identity.userAssignedIdentities)>"
      conditions: []
      api_source: "Azure ARM: Microsoft.Resources/deploymentStacks GET (identity block)"
      narrative: "Deployment Stack {stack.name} executes as managed identity {mi.name} (type: {identity.type})."

  # === STRUCTURAL: HasPolicy (deny assignment attachment) =======================

  - id: azure-bp-deny-assignment-attached
    emits: HasPolicy
    applies_to: [azure]
    match_effective_permission:
      action: ["read"]  # structural extraction
      resource_type: "Microsoft.Authorization/denyAssignments"
      field: "properties.createdBy"
    where:
      - "createdBy resource_id matches Microsoft.Blueprint/blueprintAssignments or Microsoft.Resources/deploymentStacks"
    emit:
      source_type: BuildWorker
      target_type: ConditionalPolicy
      source: "<blueprint assignment or deployment stack (extracted from createdBy resource_id)>"
      target: "<deny assignment (ConditionalPolicy)>"
      conditions: []
      api_source: "Azure ARM: Microsoft.Authorization/denyAssignments GET (properties.createdBy)"
      narrative: "{assignment.name} (blueprint assignment or deployment stack) created and owns deny assignment {deny.name}."
