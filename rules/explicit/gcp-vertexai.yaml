# GCP Vertex AI / Workbench — Explicit normalization rules
# ---------------------------------------------------------------------------
# These rules match raw configuration facts (not other edges) and emit only
# nature=explicit edges that serve as facts for derived rules to build upon.
# Catalog key: gcp:vertexai.
#
# All rules here extract the ExecutesAs, CanModifyConfiguration, CanModifyCode,
# and CrossProjectTrust relationships directly from resource config, providing
# the foundation for the derived rules in /rules/derived/gcp/vertexai.yaml.
# ---------------------------------------------------------------------------

provider: gcp
phase: 11-data-analytics-ml
service: vertexai
applies_to: [gcp]

rules:

  # ===========================================================================
  # STRUCTURAL FACTS (ExecutesAs)
  # ===========================================================================

  - id: gcp-vertexai-explicit-executes-as-training
    emits: ExecutesAs
    description: "Training job, pipeline job, or notebook execution job explicitly declares its service account."
    source_record:
      api: "aiplatform.projects.locations.customJobs.get OR aiplatform.projects.locations.trainingPipelines.get OR aiplatform.projects.locations.pipelineJobs.get OR aiplatform.projects.locations.notebookExecutionJobs.get"
      field: "jobSpec.serviceAccount OR serviceAccount OR runtimeConfig.serviceAccount OR trialJobSpec.serviceAccount"
    default: "Compute Engine default SA PROJECT_NUMBER-compute@developer.gserviceaccount.com when unset"
    emit:
      source_type: Compute
      target_type: ServiceAccount
      source: "<custom training job / pipeline job / notebook execution job>"
      target: "<runtime service account>"
      permissions: []
      note: >-
        Extracted from job configuration. The job's worker VMs will run as this SA.
        If multiple job types reference the same SA, each job-to-SA pair produces
        its own ExecutesAs edge.

  - id: gcp-vertexai-explicit-executes-as-notebook
    emits: ExecutesAs
    description: "Workbench notebook instance explicitly declares its service account."
    source_record:
      api: "notebooks.projects.locations.instances.get"
      field: "gceInstance.serviceAccount"
    default: "Compute Engine default SA PROJECT_NUMBER-compute@developer.gserviceaccount.com when unset"
    emit:
      source_type: Notebook
      target_type: ServiceAccount
      source: "<Workbench notebook instance>"
      target: "<runtime service account>"
      permissions: []
      note: >-
        Extracted from instance configuration. The instance (GCE VM) will run as this SA.

  # ===========================================================================
  # IDENTITY PASS (CanPassIdentity)
  # ===========================================================================

  - id: gcp-vertexai-explicit-passidentity-actas
    emits: CanPassIdentity
    description: "Principal holds iam.serviceAccounts.actAs on a service account (explicit permission normalization)."
    match_effective_permission:
      action: "iam.serviceAccounts.actAs"
      resource_type: "google.iam.ServiceAccount"
    emit:
      source_type: Identity
      target_type: ServiceAccount
      source: "<principal>"
      target: "<target service account>"
      permissions: ["iam.serviceAccounts.actAs"]
      state_logic: "ACTIVE when iam.serviceAccounts.actAs is confirmed on the target SA. POTENTIAL(iam_permission) if not confirmed."
      note: >-
        Explicit normalization of the iam.serviceAccounts.actAs permission into CanPassIdentity edge.
        Without this edge, downstream CanCreateWorkloadAs rules cannot match.

  # ===========================================================================
  # CONFIGURATION MODIFICATION
  # ===========================================================================

  - id: gcp-vertexai-explicit-notebook-modify-config
    emits: CanModifyConfiguration
    description: "Principal holds notebooks.instances.update or notebooks.instances.updateConfig on a Workbench instance."
    match_effective_permission:
      action: "notebooks.instances.update OR notebooks.instances.updateConfig"
      resource_type: "google.notebooks.Instance"
    emit:
      source_type: Identity
      target_type: Notebook
      source: "<principal>"
      target: "<Workbench notebook instance>"
      permissions: ["notebooks.instances.update"]
      state_logic: "ACTIVE when notebooks.instances.update is confirmed on the target instance."
      note: >-
        Enables CanModifyCode (startup/post-startup scripts) and CanAttachIdentity (SA swap).
        This is the prerequisite edge that gcp-vertexai-notebook-update-attach-sa depends on.

  # ===========================================================================
  # CODE MODIFICATION (Startup Scripts)
  # ===========================================================================

  - id: gcp-vertexai-explicit-notebook-modify-code-startup
    emits: CanModifyCode
    description: "Principal can modify Workbench instance startup or post-startup script via notebooks.instances.update."
    match_effective_permission:
      action: "notebooks.instances.update OR notebooks.instances.updateConfig"
      resource_type: "google.notebooks.Instance"
    where:
      - "Permission scoped to instance-level; startup script and post-startup script fields are modifiable."
    emit:
      source_type: Identity
      target_type: Notebook
      source: "<principal>"
      target: "<Workbench notebook instance>"
      permissions: ["notebooks.instances.update"]
      state_logic: "ACTIVE when notebooks.instances.update is confirmed on the target instance."
      note: >-
        Modifying the startup script / post-startup script is equivalent to injecting code.
        Feeds the can-execute-as execute-as-via-code-modify linchpin.

  # ===========================================================================
  # EXECUTION / COMMAND CAPABILITY
  # ===========================================================================

  - id: gcp-vertexai-explicit-notebook-use-execute-command
    emits: CanExecuteCommand
    description: "Principal holds notebooks.instances.use on a Workbench instance (explicit permission normalization)."
    match_effective_permission:
      action: "notebooks.instances.use"
      resource_type: "google.notebooks.Instance"
    where:
      - "The instance must be ACTIVE/RUNNING; a STOPPED instance requires CanStart first."
    emit:
      source_type: Identity
      target_type: Notebook
      source: "<principal>"
      target: "<Workbench notebook instance>"
      permissions: ["notebooks.instances.use"]
      state_logic: "ACTIVE when notebooks.instances.use is confirmed on the target instance and the instance is RUNNING. CONDITIONAL(service_state) if the instance is STOPPED (requires CanStart first)."
      note: >-
        Opening JupyterLab on the notebook instance enables arbitrary code execution.
        Feeds can-execute-as execute-as-via-command linchpin (CanExecuteCommand + ExecutesAs -> CanExecuteAs).

  # ===========================================================================
  # SCHEDULING CAPABILITY
  # ===========================================================================

  - id: gcp-vertexai-explicit-schedule-create
    emits: CanSchedule
    description: "Principal holds aiplatform.schedules.create to create recurring schedule triggers (explicit permission normalization)."
    match_effective_permission:
      action: "aiplatform.schedules.create"
      resource_type: "google.aiplatform.ScheduleService"
    emit:
      source_type: Identity
      target_type: AnalyticsService
      source: "<principal>"
      target: "<schedule trigger>"
      permissions: ["aiplatform.schedules.create"]
      state_logic: "ACTIVE when aiplatform.schedules.create is confirmed."
      note: >-
        The base capability to create schedules. Downstream derived rules combine this
        with CanPassIdentity to produce the full schedule-submit-job capability.

  # ===========================================================================
  # POLICY MODIFICATION
  # ===========================================================================

  - id: gcp-vertexai-explicit-notebook-set-iam-policy
    emits: CanModifyPolicy
    description: "Principal holds notebooks.instances.setIamPolicy on a Workbench instance (explicit permission normalization)."
    match_effective_permission:
      action: "notebooks.instances.setIamPolicy"
      resource_type: "google.notebooks.Instance"
    emit:
      source_type: Identity
      target_type: ResourcePolicy
      source: "<principal>"
      target: "<Workbench notebook instance's IAM policy>"
      permissions: ["notebooks.instances.setIamPolicy"]
      state_logic: "ACTIVE when notebooks.instances.setIamPolicy is confirmed on the target instance."
      note: >-
        Enables self-grant of notebooks.instances.use and downstream code execution.

  # ===========================================================================
  # CROSS-BOUNDARY FACTS (CrossProjectTrust)
  # ===========================================================================

  - id: gcp-vertexai-explicit-cross-project-trust
    emits: CrossProjectTrust
    description: "A training job, pipeline job, or notebook execution job binds a cross-project service account."
    source_record:
      api: "aiplatform.projects.locations.customJobs.get OR aiplatform.projects.locations.trainingPipelines.get OR aiplatform.projects.locations.pipelineJobs.get OR aiplatform.projects.locations.notebookExecutionJobs.get"
      field: "jobSpec.serviceAccount OR serviceAccount OR runtimeConfig.serviceAccount OR trialJobSpec.serviceAccount"
    where:
      - "the runtime SA's project (extracted from the SA email suffix) differs from the job's project"
    emit:
      source_type: Project
      target_type: ServiceAccount
      source: "<job.project>"
      target: "<runtime SA (cross-project)>"
      permissions: []
      note: >-
        Cross-project SA binding creates a trust relationship. Feeds cross-project entry derivations.

  - id: gcp-vertexai-explicit-notebook-cross-project-trust
    emits: CrossProjectTrust
    description: "A Workbench notebook instance binds a cross-project service account."
    source_record:
      api: "notebooks.projects.locations.instances.get"
      field: "gceInstance.serviceAccount"
    where:
      - "the instance SA's project differs from the notebook project"
    emit:
      source_type: Project
      target_type: ServiceAccount
      source: "<notebook.project>"
      target: "<instance SA (cross-project)>"
      permissions: []
      note: >-
        Cross-project SA binding. Feeds cross-project entry derivations.
