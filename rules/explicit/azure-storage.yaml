# Azure Storage Accounts — explicit normalization rules.
# Translate raw collected Microsoft.Storage/storageAccounts config + effective-permission
# facts into common explicit edges consumed by /rules/derived/azure/storage.yaml
# (and /rules/derived/azure/adls.yaml for HNS-enabled accounts).
#
# Two authorization models produce HasPermission records:
#   ARM RBAC data actions: resolved via roleAssignments + roleDefinitions (standard).
#   Account key / SAS:     structural ContainsCredential fact; key-retrieval capability
#                          comes from resolving listKeys/listAccountSas ARM action via RBAC.
#   Anonymous access:      property record (allowBlobPublicAccess + container publicAccess).
#
# Structural facts (Contains, ContainsCredential, HasPolicy, LocatedIn, AttachedTo) come
# from raw ARM records. Capability edges (HasPermission, CanReadData, etc.) come from
# the permission evaluator (match_effective_permission) — never from raw config alone.

rules:

  # --- Structural: subscription/RG contains account -------------------------
  - id: azure-storage-account-in-rg
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts", field: "id"}
    emit:
      source_type: AdministrativeBoundary
      target_type: ObjectStorage
      source: "<ResourceGroup node>"
      target: "<storageAccount node>"
      api_source: "Microsoft.Storage/storageAccounts GET (list)"
      evidence_field: "id"
      narrative: "{rg.name} contains storage account {account.name}."

  # --- Structural: account contains blob container --------------------------
  - id: azure-storage-account-contains-container
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts/blobServices/containers", field: "id"}
    emit:
      source_type: ObjectStorage
      target_type: ObjectStorage
      source: "<storageAccount node>"
      target: "<container node>"
      api_source: "Microsoft.Storage/storageAccounts/blobServices/containers GET"
      evidence_field: "id"
      narrative: "{account.name} contains blob container {container.name}."

  # --- Structural: account contains file share ------------------------------
  - id: azure-storage-account-contains-fileshare
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts/fileServices/shares", field: "id"}
    emit:
      source_type: ObjectStorage
      target_type: FileStorage
      source: "<storageAccount node>"
      target: "<fileShare node>"
      api_source: "Microsoft.Storage/storageAccounts/fileServices/shares GET"
      evidence_field: "id"
      narrative: "{account.name} contains file share {share.name}."

  # --- Structural: account contains queue -----------------------------------
  - id: azure-storage-account-contains-queue
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts/queueServices/queues", field: "id"}
    emit:
      source_type: ObjectStorage
      target_type: Queue
      source: "<storageAccount node>"
      target: "<queue node>"
      api_source: "Microsoft.Storage/storageAccounts/queueServices/queues GET"
      evidence_field: "id"
      narrative: "{account.name} contains queue {queue.name}."

  # --- Structural: account contains table -----------------------------------
  - id: azure-storage-account-contains-table
    emits: Contains
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts/tableServices/tables", field: "id"}
    emit:
      source_type: ObjectStorage
      target_type: NoSQLDatabase
      source: "<storageAccount node>"
      target: "<table node>"
      api_source: "Microsoft.Storage/storageAccounts/tableServices/tables GET"
      evidence_field: "id"
      narrative: "{account.name} contains table {table.name}."

  # --- Structural: account holds primary + secondary access keys ------------
  # The keys themselves are modeled as AccessKey sub-objects. Their physical existence
  # is always true for all standard accounts; the collector records this from metadata
  # (NOT by calling listKeys). When allowSharedKeyAccess=false, the keys are structurally
  # present but operationally inert (service rejects SharedKey auth). This rule emits
  # ContainsCredential unconditionally to reflect structural presence; the derived rule
  # azure-storage-listkeys-exposes-credential gates on allowSharedKeyAccess for the
  # capability consequence. Without this unconditional emit, the credential-chains linchpin
  # cannot model the 'keys present but inert' state when key access is denied.
  - id: azure-storage-account-contains-keys
    emits: ContainsCredential
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts", field: "properties.primaryEndpoints"}
    emit:
      source_type: ObjectStorage
      target_type: AccessKey
      source: "<storageAccount node>"
      target: "<primary AccessKey node> and <secondary AccessKey node>"
      api_source: "Microsoft.Storage/storageAccounts GET"
      evidence_field: "properties.primaryEndpoints"
      narrative: >-
        {account.name} holds primary and secondary account access keys structurally.
        When allowSharedKeyAccess=true or unset (default), these keys bypass all Azure
        RBAC and network controls when used. When allowSharedKeyAccess=false, the keys
        are present but the storage service rejects SharedKey authentication attempts.

  # --- Capability: listKeys/action -> HasPermission -------------------------
  # Feed the derived azure-storage-listkeys-exposes-credential rule.
  # The match_effective_permission evaluator resolves whether the principal's ARM
  # role assignments include Microsoft.Storage/storageAccounts/listKeys/action
  # at the account scope. This is a control-plane ARM action, NOT a data action.
  - id: azure-storage-listkeys-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/listKeys/action"
      resource_type: "Microsoft.Storage/storageAccounts"
    emit:
      source_type: Identity
      target_type: ObjectStorage
      source: "<principal>"
      target: "<storageAccount node>"
      permissions: ["Microsoft.Storage/storageAccounts/listKeys/action"]
      narrative: >-
        {principal.name} has effective permission Microsoft.Storage/storageAccounts/listKeys/action
        on {account.name} (via role: {role.name}).

  # --- Capability: listAccountSas/action -> HasPermission -------------------
  - id: azure-storage-listaccountsas-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/listAccountSas/action"
      resource_type: "Microsoft.Storage/storageAccounts"
    emit:
      source_type: Identity
      target_type: ObjectStorage
      source: "<principal>"
      target: "<storageAccount node>"
      permissions: ["Microsoft.Storage/storageAccounts/listAccountSas/action"]
      narrative: >-
        {principal.name} has effective permission Microsoft.Storage/storageAccounts/listAccountSas/action
        on {account.name} (via role: {role.name}).

  # --- Capability: blob data read -> HasPermission --------------------------
  # Resolves Storage Blob Data Reader (2a2b9908), Blob Data Contributor (ba92f5b4),
  # and Blob Data Owner (b7e6dc6d) at account or container scope.
  - id: azure-storage-blob-read-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read"
      resource_type: "Microsoft.Storage/storageAccounts"
      action_kind: dataAction
    emit:
      source_type: Identity
      target_type: ObjectStorage
      source: "<principal>"
      target: "<storageAccount or container node>"
      permissions: ["Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read"]
      narrative: >-
        {principal.name} has effective dataAction blobs/read on {account_or_container.name}
        (via role: {role.name}).

  # --- Capability: blob data write -> HasPermission -------------------------
  - id: azure-storage-blob-write-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/write"
      resource_type: "Microsoft.Storage/storageAccounts"
      action_kind: dataAction
    emit:
      source_type: Identity
      target_type: ObjectStorage
      source: "<principal>"
      target: "<storageAccount or container node>"
      permissions: ["Microsoft.Storage/storageAccounts/blobServices/containers/blobs/write"]
      narrative: >-
        {principal.name} has effective dataAction blobs/write on {account_or_container.name}
        (via role: {role.name}).

  # --- Capability: queue message read -> HasPermission ----------------------
  - id: azure-storage-queue-read-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/queueServices/queues/messages/read"
      resource_type: "Microsoft.Storage/storageAccounts/queueServices/queues"
      action_kind: dataAction
    emit:
      source_type: Identity
      target_type: Queue
      source: "<principal>"
      target: "<queue node>"
      permissions: ["Microsoft.Storage/storageAccounts/queueServices/queues/messages/read"]
      narrative: >-
        {principal.name} has effective dataAction messages/read on queue {queue.name}
        (via role: {role.name}).

  # --- Capability: queue message write -> HasPermission ----------------------
  # Storage Queue Data Contributor (974c5e8b) and Storage Queue Data Message Processor
  # (8a0f0c08) include messages/add dataAction enabling message injection into queues.
  - id: azure-storage-queue-write-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/queueServices/queues/messages/add"
      resource_type: "Microsoft.Storage/storageAccounts/queueServices/queues"
      action_kind: dataAction
    emit:
      source_type: Identity
      target_type: Queue
      source: "<principal>"
      target: "<queue node>"
      permissions: ["Microsoft.Storage/storageAccounts/queueServices/queues/messages/add"]
      narrative: >-
        {principal.name} has effective dataAction messages/add on queue {queue.name}
        (via role: {role.name}). Can inject crafted messages into the queue.

  # --- Capability: table entity read -> HasPermission -----------------------
  - id: azure-storage-table-read-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/tableServices/tables/entities/read"
      resource_type: "Microsoft.Storage/storageAccounts/tableServices/tables"
      action_kind: dataAction
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<table node>"
      permissions: ["Microsoft.Storage/storageAccounts/tableServices/tables/entities/read"]
      narrative: >-
        {principal.name} has effective dataAction entities/read on table {table.name}
        (via role: {role.name}).

  # --- Capability: file share data read -> HasPermission ---------------------
  # Azure Files SMB/NFS data access (distinct from blob RBAC).
  # Resolves Storage File Data SMB Share Reader, Contributor, and Privileged Reader
  # at file share scope. Note: distinct from blob data roles; each sub-service has
  # separate RBAC.
  - id: azure-storage-file-read-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/fileServices/shares/files/read"
      resource_type: "Microsoft.Storage/storageAccounts/fileServices/shares"
      action_kind: dataAction
    emit:
      source_type: Identity
      target_type: FileStorage
      source: "<principal>"
      target: "<fileShare node>"
      permissions: ["Microsoft.Storage/storageAccounts/fileServices/shares/files/read"]
      narrative: >-
        {principal.name} has effective dataAction files/read on file share {share.name}
        (via role: {role.name}). SMB/NFS protocol access over port 445/2049.

  # --- Capability: generateUserDelegationKey/action -> HasPermission ---------
  - id: azure-storage-generate-user-delegation-key-permission
    emits: HasPermission
    applies_to: [azure]
    match_effective_permission:
      action: "Microsoft.Storage/storageAccounts/blobServices/generateUserDelegationKey/action"
      resource_type: "Microsoft.Storage/storageAccounts"
    emit:
      source_type: Identity
      target_type: ObjectStorage
      source: "<principal>"
      target: "<storageAccount node>"
      permissions: ["Microsoft.Storage/storageAccounts/blobServices/generateUserDelegationKey/action"]
      narrative: >-
        {principal.name} has effective permission Microsoft.Storage/storageAccounts/blobServices/generateUserDelegationKey/action
        on {account.name} (via role: {role.name}). Can mint user-delegation SAS tokens
        bounded by caller's RBAC scope.

  # --- Property record: account-level public blob access flag ---------------
  # Required by azure-storage-public-blob-container to gate ExposedToInternet.
  - id: azure-storage-allow-public-access-property
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts", field: "properties.allowBlobPublicAccess"}
    emit:
      source_type: ObjectStorage
      target_type: Policy
      source: "<storageAccount node>"
      target: "<networkAcls/publicAccess ResourcePolicy node>"
      api_source: "Microsoft.Storage/storageAccounts GET"
      evidence_field: "properties.allowBlobPublicAccess"
      narrative: >-
        {account.name} has allowBlobPublicAccess={value}.
        When false, all container-level publicAccess settings are ignored by the service.

  # --- Property record: container public access setting ---------------------
  - id: azure-storage-container-public-access-property
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts/blobServices/containers", field: "properties.publicAccess"}
    where:
      - "properties.publicAccess in ['Blob', 'Container']"
    emit:
      source_type: ObjectStorage
      target_type: Policy
      source: "<container node>"
      target: "<publicAccess ResourcePolicy node>"
      api_source: "Microsoft.Storage/storageAccounts/blobServices/containers GET"
      evidence_field: "properties.publicAccess"
      narrative: >-
        Container {container.name} has publicAccess={value}
        (Blob=anonymous blob read; Container=anonymous list+read).

  # --- Property record: network access controls / firewall ------------------
  - id: azure-storage-network-acls-property
    emits: HasPolicy
    applies_to: [azure]
    match_record: {resource_type: "Microsoft.Storage/storageAccounts", field: "properties.networkAcls"}
    emit:
      source_type: ObjectStorage
      target_type: Policy
      source: "<storageAccount node>"
      target: "<networkAcls ResourcePolicy node>"
      api_source: "Microsoft.Storage/storageAccounts GET"
      evidence_field: "properties.networkAcls"
      narrative: >-
        {account.name} has networkAcls.defaultAction={networkAcls.defaultAction}
        with {count(ipRules)} IP rules and {count(virtualNetworkRules)} VNet rules.
        publicNetworkAccess={properties.publicNetworkAccess}.

# ---------------------------------------------------------------------------
