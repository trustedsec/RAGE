# Canonical derived rules for CanExecuteAs — the core cloud escalation primitive.
# Provider-agnostic: matches common edges emitted by any adapter.
#
# CRITICAL GUARD: CanModifyConfiguration edges on SecurityService nodes tagged
# evasion_only: true (e.g. AWS Inspector, GuardDuty disable rules) must NOT be
# included in CanExecuteAs derivations. These edges represent defense-evasion
# capabilities only, not execution-configuration hijacking. The execute-as-via-
# config-identity-swap rule filters out evasion_only targets via the where clause.

rules:

  - id: execute-as-via-code-modify
    emits: CanExecuteAs
    description: "Modify code of a compute resource that runs as a privileged identity."
    applies_to: ["*"]
    match:
      - [ ?attacker, CanModifyCode, ?compute ]
      - [ ?compute,  ExecutesAs,    ?identity ]
    where:
      - node_class(?compute) in [Compute, AnalyticsService, DataWarehouse, DataLake]
    optional:
      - [ ?attacker, CanInvoke, ?compute ]
    emit:
      source_type: Identity
      target_type: Identity
      source: ?attacker
      target: ?identity
      state_logic: "ACTIVE if matched(optional[0]) or trigger_exists(?compute) else CONDITIONAL(trigger_exists)"
      derived_from: [ "?attacker CanModifyCode ?compute", "?compute ExecutesAs ?identity" ]
      evidence:
        narrative_template: >
          {attacker.name} can run code as {identity.name}: it can modify the code of
          {compute.name} ({perm:CanModifyCode}); {compute.name} executes as
          {identity.name}{if optional[0]: " and {attacker.name} can invoke it"}.

  - id: execute-as-via-config-identity-swap
    emits: CanExecuteAs
    description: "Change the execution identity binding of a compute resource to a chosen privileged identity."
    applies_to: ["*"]
    match:
      - [ ?attacker, CanModifyConfiguration, ?compute ]
      - [ ?attacker, CanPassIdentity,        ?identity ]
    where:
      - node_class(?compute) in [Compute, AnalyticsService, DataWarehouse, DataLake]
      - "NOT (?compute.evasion_only == true)"
      - role_compatible(?identity, ?compute)
    emit:
      source_type: Identity
      target_type: Identity
      source: ?attacker
      target: ?identity
      state_logic: "ACTIVE"
      derived_from: [ "?attacker CanModifyConfiguration ?compute", "?attacker CanPassIdentity ?identity" ]
      evidence:
        narrative_template: >
          {attacker.name} can bind {identity.name} to {compute.name}
          ({perm:CanPassIdentity}) and modify its configuration, then execute as {identity.name}.

  - id: execute-as-via-new-workload
    emits: CanExecuteAs
    description: "Create a new workload and attach a privileged identity to it."
    applies_to: ["*"]
    match:
      - [ ?attacker, CanCreateWorkloadAs, ?identity ]
    emit:
      source_type: Identity
      target_type: Identity
      source: ?attacker
      target: ?identity
      state_logic: "ACTIVE"
      derived_from: [ "?attacker CanCreateWorkloadAs ?identity" ]

  - id: execute-as-via-command
    emits: CanExecuteAs
    description: "Run OS commands on a host that already runs as a privileged identity."
    applies_to: ["*"]
    match:
      - [ ?attacker, CanExecuteCommand, ?compute ]
      - [ ?compute,  ExecutesAs,        ?identity ]
    emit:
      source_type: Identity
      target_type: Identity
      source: ?attacker
      target: ?identity
      state_logic: "ACTIVE"
      derived_from: [ "?attacker CanExecuteCommand ?compute", "?compute ExecutesAs ?identity" ]

# Follow-on: once CanExecuteAs(attacker, identity) exists, identity's own
# outbound capability edges become reachable to attacker via graph traversal.
# A separate rule collapses CanExecuteAs + Controls(identity, boundary) into
# CanEscalateTo / Controls for objective queries (see can-control.yaml).
