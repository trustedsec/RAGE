# Provider-agnostic credential-access chain rules (Phase 5 — credential-access)
# ---------------------------------------------------------------------------
# These rules collapse per-service credential-access edges
# (CanReadSecret / CanDecrypt / CredentialsFor / CanSignAs) — emitted by the
# provider adapters and explicit normalization rules — into TRAVERSABLE
# escalation/impersonation edges. Without them, a "read this secret" fact and a
# "this secret authenticates identity X" fact sit in the graph as two unlinked
# edges; the path-finder cannot see that reading the secret == becoming X.
#
# ROLE IN THE PHASE-4 -> PHASE-5 CHAIN:
#   Phase 4 gave us CanExecuteAs (run attacker code as a workload identity).
#   Phase 5 completes the credential pivot:
#
#     CanExecuteAs(p -> wl)                                   [Phase 4]
#        + CanReadSecret(wl -> secret)                        [per-service, P5]
#        => CanReadSecret(p -> secret)          (rule: execute-then-read-secret)
#        + CredentialsFor(secret -> identity)                 [per-service, P5]
#        => CanImpersonate(p -> identity)       (rule: read-secret-yields-identity)
#        + privilege(identity) > privilege(p)
#        => CanEscalateTo(p -> identity)        (rule: impersonate-is-escalation)
#
#   i.e. Phase-4 execution -> Phase-5 credential read -> impersonation -> escalation.
#
# KEY-PERMISSION GATE (Phase 5 theme):
#   CanReadSecret over a KMS/CMEK-wrapped secret is only ACTIVE if the caller can
#   also decrypt the wrapping key. Adapters emit such a read as
#   CONDITIONAL(key_permission). The rule `decrypt-gates-secret-read` UPGRADES
#   that CONDITIONAL read to ACTIVE when the same principal holds
#   CanDecrypt on the wrapping EncryptionKey.
#
# STATE PROPAGATION (per RULE-FORMAT.md): a derived edge is never stronger than
# its weakest contributor. A CONDITIONAL input yields at best CONDITIONAL output;
# a BLOCKED contributor blocks the derivation entirely.
#
# EDGE SOURCE/TARGET CONFORMANCE (schema/edges.yaml), honored by every rule below:
#   CanReadSecret:  source [Identity, Compute]       target [Secret, ConnectionString, Password, APIKey, Certificate]
#   CredentialsFor: source [Secret, Credential, AccessKey, Token, Certificate] target [Identity, Data, ServiceIdentity]
#   CanImpersonate: source [Identity]                target [ServiceAccount, MachineIdentity, ManagedIdentity, WorkloadIdentity, ApplicationIdentity]
#   CanEscalateTo:  source [Identity]                target [Identity]
#   CanDecrypt:     source [Identity, Compute]       target [EncryptionKey]
#   CanSignAs:      source [Identity]                target [SigningKey, ServiceAccount, ApplicationIdentity]
#   CanExecuteAs:   source [Identity]                target [Identity]
# ---------------------------------------------------------------------------

applies_to: ["*"]
phase: 5-credential-access

rules:

  # --- 1a) Read a credential -> authenticate as whoever it is for -----------
  # Mirrors read-secret-yields-identity but accepts CanReadCredential instead of
  # CanReadSecret. This rule handles credential types (AccessKey, Token) NOT in the
  # CanReadSecret target set [Secret, ConnectionString, Password, APIKey, Certificate].
  # CanReadCredential target set is [Credential, AccessKey, Token, SSHKey], extending
  # the chain to include these credential types (e.g., Azure AD machine account
  # AccessKey from ANF account, instance metadata tokens, service SSH keys).
  #
  # This is the critical linchpin for Azure NetApp Files AD-credential chain:
  #   CanReadCredential(principal -> ANF account AD AccessKey)
  #   + CredentialsFor(AccessKey -> AD MachineIdentity)
  #   => CanImpersonate(principal -> MachineIdentity)
  - id: read-credential-yields-identity
    emits: CanImpersonate
    description: "Reading a credential that is credentials for an identity yields the ability to authenticate as that identity."
    applies_to: ["*"]
    match:
      - [ ?principal, CanReadCredential, ?credential ]
      - [ ?credential, CredentialsFor, ?identity ]
    where:
      # CanImpersonate target set is restricted; when ?identity is a plain User
      # authenticated by a password/long-lived key, the correct pivot is
      # CredentialValidFor/AuthenticatesTo, NOT CanImpersonate (see note).
      - "node_class(?identity) == Identity"
      - "node_type(?identity) in [ServiceAccount, MachineIdentity, ManagedIdentity, WorkloadIdentity, ApplicationIdentity]  # Azure SP, GCP SA, k8s SA, AWS service account variants"
    emit:
      source_type: Identity
      source: ?principal
      target: ?identity
      permissions: []
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        inherit_weakest(CanReadCredential, CredentialsFor): if the CanReadCredential
        input is CONDITIONAL (e.g., key_permission on CMEK-wrapped credential,
        decrypt not yet proven) then CONDITIONAL carries forward; if either input
        is BLOCKED then BLOCKED; else ACTIVE. CredentialsFor is a zero-cost link
        and never downgrades on its own.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanReadCredential ?credential", "?credential CredentialsFor ?identity" ]
      false_positive_note: >-
        Only emit when the credential genuinely authenticates the target identity
        (CredentialsFor must be an explicit, evidenced link — e.g. an AD machine
        account AccessKey, an SSH key, an API token, or a signing certificate bound
        to that principal), not merely a credential the identity happens to own or
        that sits in its namespace. If the credential is rotated/disabled/expired,
        the adapter should not have emitted CredentialsFor -> no impersonation.
        When the CanReadCredential is CONDITIONAL(key_permission), do NOT report
        this as an ACTIVE impersonation path until key_permission gate is satisfied.
        For a plain User backed by a password, prefer CredentialValidFor/AuthenticatesTo
        — do not force a CanImpersonate whose target set excludes User.
      narrative: >-
        {principal.name} can read {credential.name} ({perm:CanReadCredential}),
        which holds credentials for {identity.name}; reading it lets {principal.name}
        authenticate and act as {identity.name}.

  # --- 1b) Read a secret -> authenticate as whoever it is for ----------------
  # The pivot that turns "read a secret" into "act as an identity". This is the
  # single most important credential-chain collapse: it links the credential
  # store to the identity graph.
  - id: read-secret-yields-identity
    emits: CanImpersonate
    description: "Reading a secret that is credentials for an identity yields the ability to authenticate as that identity."
    applies_to: ["*"]
    match:
      - [ ?principal, CanReadSecret,   ?secret ]
      - [ ?secret,    CredentialsFor,  ?identity ]
    where:
      # CanImpersonate target set is restricted; when ?identity is a plain User
      # authenticated by a password/long-lived key, the correct pivot is
      # CredentialValidFor/AuthenticatesTo, NOT CanImpersonate (see note).
      - "node_class(?identity) == Identity"
      - "node_type(?identity) in [ServiceAccount, MachineIdentity, ManagedIdentity, WorkloadIdentity, ApplicationIdentity]  # Azure SP is modeled as ApplicationIdentity"
    emit:
      source_type: Identity
      source: ?principal
      target: ?identity
      permissions: []
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        inherit_weakest(CanReadSecret, CredentialsFor): if the CanReadSecret input
        is CONDITIONAL(key_permission) (CMEK/KMS-wrapped secret, decrypt not yet
        proven) then CONDITIONAL(key_permission); if either input is BLOCKED then
        BLOCKED; else ACTIVE. CredentialsFor is a zero-cost link and never
        downgrades on its own.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanReadSecret ?secret", "?secret CredentialsFor ?identity" ]
      false_positive_note: >-
        Only emit when the secret genuinely authenticates the target identity
        (CredentialsFor must be an explicit, evidenced link — e.g. a stored access
        key, service-account key JSON, connection string, or client secret bound to
        that principal), not merely a secret the identity happens to own or that
        sits in its namespace. If the secret is rotated/disabled/expired, the
        adapter should not have emitted CredentialsFor -> no impersonation. When the
        CanReadSecret is CONDITIONAL(key_permission), do NOT report this as an ACTIVE
        impersonation path until decrypt-gates-secret-read upgrades it. For a plain
        User backed by a password, prefer CredentialValidFor/AuthenticatesTo — do not
        force a CanImpersonate whose target set excludes User.
      narrative: >-
        {principal.name} can read {secret.name} ({perm:CanReadSecret}), which holds
        credentials for {identity.name}; reading it lets {principal.name}
        authenticate and act as {identity.name}.

  # --- 2) Inherit secret-read capability through an executed identity -------
  # Completes the Phase-4 CanExecuteAs -> CanReadSecret bridge. A principal that
  # can run code as a workload identity inherits that identity's secret-read
  # reach. NOTE: normal graph traversal (walk CanExecuteAs, then the identity's
  # own outbound CanReadSecret) already yields this path; this explicit rule
  # materializes the collapsed edge so credential-CENTRIC queries ("who can read
  # secret X?") surface the executing principal directly without a two-hop walk.
  - id: execute-then-read-secret
    emits: CanReadSecret
    description: "Executing as a workload identity inherits that identity's ability to read a secret."
    applies_to: ["*"]
    match:
      - [ ?principal, CanExecuteAs,   ?workload_identity ]
      - [ ?workload_identity, CanReadSecret, ?secret ]
    where:
      - "node_class(?principal) == Identity"
      - "node_class(?workload_identity) == Identity"
    emit:
      source: ?principal
      target: ?secret
      permissions: []
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        inherit_weakest(CanExecuteAs, CanReadSecret): a CONDITIONAL CanExecuteAs
        (e.g. trigger_exists not yet met) OR a CONDITIONAL CanReadSecret
        (key_permission on a wrapped secret) yields CONDITIONAL with the union of
        the unmet gating conditions; any BLOCKED contributor => BLOCKED; else ACTIVE.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanExecuteAs ?workload_identity", "?workload_identity CanReadSecret ?secret" ]
      false_positive_note: >-
        Redundant with plain graph traversal (CanExecuteAs then CanReadSecret) for a
        generic path-finder; emitted so credential-centric reverse queries resolve
        the real principal. Do not double-count its weight when both this collapsed
        edge and the two contributing edges are present on the same path. The
        inherited read still carries the workload identity's own key_permission gate
        — if the secret is CMEK-wrapped, decrypt on the wrapping key is required
        against the effective identity used at read time.
      narrative: >-
        {principal.name} can execute as {workload_identity.name}
        ({perm:CanExecuteAs}), inheriting its ability to read {secret.name}.

  # --- 3) Impersonation of a higher-privileged identity is escalation -------
  - id: impersonate-is-escalation
    emits: CanEscalateTo
    description: "Impersonating a strictly-more-privileged identity is privilege escalation."
    applies_to: ["*"]
    match:
      - [ ?principal, CanImpersonate, ?identity ]
    where:
      - "privilege(?identity) > privilege(?principal)"
    emit:
      source_type: Identity
      target_type: Identity
      source: ?principal
      target: ?identity
      permissions: []
      state_logic: >-
        inherit from CanImpersonate: if the impersonation is
        CONDITIONAL(key_permission)/POTENTIAL/BLOCKED, the escalation carries the
        same state and gating condition. Only ACTIVE when the underlying
        CanImpersonate is ACTIVE.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanImpersonate ?identity" ]
      false_positive_note: >-
        Only emit when the target identity is STRICTLY more privileged than the
        principal; a lateral, same-privilege impersonation is credential access but
        not escalation. Privilege comparison must use the resolved effective
        privilege of both identities (accounting for group/role membership), not a
        static label. Inherits state from the CanImpersonate input — never upgrade.
      narrative: >-
        {principal.name} can escalate to {identity.name} by impersonating it — it
        can act as {identity.name}, which holds strictly greater privilege.

  # --- 4) Decrypt on the wrapping key upgrades a gated secret read ----------
  # Phase-5 key-permission gate resolution. Adapters emit CanReadSecret over a
  # CMEK/KMS-wrapped secret as CONDITIONAL(key_permission): the reader holds the
  # secret-store read action but cannot use the plaintext without decrypting the
  # data-encryption/wrapping key. This rule resolves that gate: when the same
  # principal (or an identity it executes as) also holds CanDecrypt on the exact
  # key that wraps the secret, the read becomes ACTIVE.
  #
  # KEY<->SECRET WRAPPING LINK: the wrapping relationship is carried by an
  # explicit LocatedIn/AttachedTo edge (secret -> EncryptionKey) or an
  # `encrypted_by`/`kms_key_id` property the adapter records on the secret node;
  # `wraps(?key, ?secret)` below resolves to that link. The rule ONLY fires when
  # the decrypt is on the SAME key that wraps THIS secret — a decrypt grant on an
  # unrelated key does not upgrade the read.
  - id: decrypt-gates-secret-read
    emits: CanReadSecret
    description: "Holding decrypt on a secret's wrapping key upgrades a key-gated (CONDITIONAL) secret read to ACTIVE."
    applies_to: ["*"]
    match:
      - [ ?principal, CanReadSecret, ?secret ]   # pre-existing, CONDITIONAL(key_permission)
      - [ ?principal, CanDecrypt,    ?key ]
    where:
      - "state_of(match[0]) == CONDITIONAL and gating_condition(match[0]) == key_permission"
      - "wraps(?key, ?secret)"   # ?secret.encrypted_by / kms_key_id resolves to ?key (via LocatedIn/AttachedTo secret->key or recorded property)
      - "node_class(?key) == Secret and node_type(?key) == EncryptionKey"
    emit:
      source: ?principal
      target: ?secret
      permissions: []
      conditions: []
      state_logic: >-
        UPGRADE: re-emit the CanReadSecret with state ACTIVE (the key_permission
        gate is now satisfied by the matched CanDecrypt). If the CanDecrypt input is
        itself CONDITIONAL (e.g. a KMS key policy / grant condition unmet) then the
        upgraded read is only as strong as that decrypt — CONDITIONAL(key_permission)
        persists; if CanDecrypt is BLOCKED (explicit key-policy/SCP deny on
        kms:Decrypt) the read stays BLOCKED for the plaintext. Monotonic re-emit
        updates the existing edge in place (RULE-FORMAT: re-derivation updates state).
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanReadSecret ?secret (CONDITIONAL key_permission)", "?principal CanDecrypt ?key", "wraps(?key, ?secret)" ]
      false_positive_note: >-
        Do NOT upgrade unless the decrypt is on the EXACT key that wraps the secret;
        a decrypt grant on a different key is irrelevant. Some stores decrypt secret
        material with a service-managed key transparently (no caller decrypt needed)
        — in that case the adapter should have emitted the read as ACTIVE, not
        CONDITIONAL(key_permission), and this rule is a no-op. Honor key-policy /
        grant conditions (e.g. AWS kms:ViaService, EncryptionContext, GCP CMEK
        binding, Azure Key Vault key-permission): if the CanDecrypt is conditional or
        denied, do not force the read to ACTIVE. Also applies when the decrypt is held
        by an identity the principal CanExecuteAs — resolve the effective decryptor.
      narrative: >-
        {principal.name} can read {secret.name} outright: its secret-store read was
        gated on the wrapping key {key.name}, and {principal.name} also holds
        decrypt on {key.name} ({perm:CanDecrypt}), satisfying the key-permission gate.

  # --- 5) Sign-as yields impersonation when a trust consumes the signature --
  # Conservative: holding a signing capability (JWT/SAML/OIDC signing key, or
  # signBlob/signJwt as a service identity) only yields impersonation if a
  # downstream trust actually VALIDATES and consumes those signatures. Without a
  # consuming trust, signing is forgery-capable but authenticates to nothing.
  - id: sign-as-yields-impersonation
    emits: CanImpersonate
    description: "Signing tokens as an identity yields impersonation when a downstream trust validates those signatures."
    applies_to: ["*"]
    match:
      - [ ?principal, CanSignAs, ?signer ]
    where:
      # CanSignAs target is [SigningKey, ServiceAccount, ApplicationIdentity].
      # Resolve the identity the forged signature authenticates as (?identity):
      #  - if ?signer is a ServiceAccount/ApplicationIdentity, ?identity == ?signer
      #  - if ?signer is a SigningKey, ?identity is the identity whose tokens that
      #    key signs (key SignsFor / CredentialsFor -> identity), and that identity
      #    must itself be a ServiceAccount/ManagedIdentity/ApplicationIdentity so the
      #    CanImpersonate target set is honored.
      - "node_type(?identity) in [ServiceAccount, MachineIdentity, ManagedIdentity, WorkloadIdentity, ApplicationIdentity]  # Azure SP is modeled as ApplicationIdentity"
    optional:
      # Presence of a relying trust that validates ?identity's signatures upgrades
      # the emit to ACTIVE; absence keeps it CONDITIONAL(trust_exists).
      - [ ?identity, AuthenticatesTo, ?relying_party ]
    emit:
      source_type: Identity
      source: ?principal
      target: ?identity
      permissions: []
      conditions: [trust_relationship]
      state_logic: >-
        if matched(optional[0]) (a relying party validates ?identity's tokens/assertions):
        ACTIVE; else CONDITIONAL(trust_exists) — the signing capability is real but
        no modeled trust consumes the signature yet, so no concrete authentication
        target is proven. Inherit weakest with the CanSignAs input; BLOCKED if
        CanSignAs is BLOCKED.
      confidence: "min(contributing_confidences) * 0.9"
      derived_from: [ "?principal CanSignAs ?signer", "?signer -> ?identity (signs-for resolution)", "?identity AuthenticatesTo ?relying_party?" ]
      false_positive_note: >-
        Conservative by design. Signing capability alone is not impersonation: a
        forged JWT/SAML assertion authenticates only where some relying party trusts
        the signer's key/issuer. Emit ACTIVE only when such a trust is modeled
        (AuthenticatesTo / CanFederateAs / a validated OIDC issuer); otherwise
        CONDITIONAL(trust_exists). Do not chain to escalation off a CONDITIONAL
        sign-as impersonation until the consuming trust is confirmed. A SigningKey
        that no relying party trusts (e.g. an inactive/legacy key) yields nothing.
      narrative: >-
        {principal.name} can sign tokens as {identity.name} ({perm:CanSignAs}); where
        a relying party validates {identity.name}'s signatures, {principal.name} can
        forge authentication and impersonate {identity.name}.

# ---------------------------------------------------------------------------
# COMPLETED CHAIN (worked example):
#   [p CanExecuteAs wl]                                    (Phase 4 CanExecuteAs)
#   + [wl CanReadSecret s]  (CONDITIONAL key_permission, CMEK-wrapped)
#     => execute-then-read-secret: [p CanReadSecret s] (CONDITIONAL key_permission)
#   + [p CanDecrypt k], wraps(k, s)
#     => decrypt-gates-secret-read: [p CanReadSecret s] UPGRADED to ACTIVE
#   + [s CredentialsFor svcAccount]
#     => read-secret-yields-identity: [p CanImpersonate svcAccount] (ACTIVE)
#   + privilege(svcAccount) > privilege(p)
#     => impersonate-is-escalation: [p CanEscalateTo svcAccount] (ACTIVE)
#
# BLOCKED-edge guidance:
#  - An explicit deny (SCP / key policy / Key Vault access policy / IAM deny) on
#    the secret-store read action -> CanReadSecret BLOCKED -> the whole chain BLOCKED.
#  - A deny on the decrypt action (kms:Decrypt / Key Vault key decrypt /
#    cloudkms.*useToDecrypt) leaves a CMEK-wrapped read CONDITIONAL(key_permission),
#    never upgraded to ACTIVE by decrypt-gates-secret-read.
#  - A rotated/disabled/expired credential means the adapter must not emit
#    CredentialsFor -> read-secret-yields-identity does not fire.
# ---------------------------------------------------------------------------
