# AWS Inspector v2 — Derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# Emits ONLY common edge types from schema/edges.yaml.
#
# ATTACK SURFACE CLASSIFICATION: LOW
# Inspector is a vulnerability-management / findings service. It does not run
# customer code, accept a customer-supplied execution role, or expose resource-
# based policies. Its sole attack-path relevance is DEFENSE EVASION:
#
#   inspector2:Disable           -> stops all scanning for the account (or designated
#                                   member accounts when called from delegated-admin).
#                                   High-impact evasion. Confidence 0.90.
#   inspector2:UpdateConfiguration -> toggles individual scan features (Lambda deep
#                                   scan, ECR toggle). Affects detection depth only,
#                                   not service enablement. Lower impact. Confidence 0.65.
#                                   SPLIT from Disable due to different severity.
#   inspector2:UpdateOrganizationConfiguration -> modifies org-level auto-enable
#                                   settings for new member accounts (architectural,
#                                   not immediate evasion). Covered implicitly by
#                                   delegated-admin CanModifyConfiguration scope.
#
# ORGANIZATIONAL SCOPE (delegated-admin):
#   In an AWS Organizations deployment with a designated delegated-admin account,
#   a principal in that account can call inspector2:Disable with member_account_ids
#   to disable scanning across multiple (or all) organization member accounts
#   simultaneously. This is org-scope evasion only — NOT CanEnterAccount.
#
# WHAT THIS FILE DOES NOT EMIT (and why):
#   - CanExecuteAs: Inspector does not run attacker code or accept a PassRole.
#   - CanEnterAccount: disabling scanning does not grant entry to any account.
#   - CanReadSecret / ExposesCredential: Inspector findings are CVE metadata, not creds.
#   - CanReadData: findings are not secret material; recon value is negligible.
#
# SEMANTIC CLARIFICATION (evasion_only field):
#   Each CanModifyConfiguration edge on SecurityService targets is tagged
#   evasion_only: true to signal to the path-finding engine that these edges
#   represent defense-evasion capabilities only and must NOT be included in
#   CanExecuteAs derivation chains (per can-execute-as.yaml pattern).
#
# LINCHPINS — this file does NOT re-derive roll-ups. Downstream capability queries
# reference:
#   /rules/derived/can-execute-as.yaml   (not applicable — no execution surface)
#   /rules/derived/can-control.yaml      (not applicable — evasion, not control)
#   /rules/derived/credential-chains.yaml (not applicable — no cred exposure)
#
# Explicit normalization for inspector2:* effective-permission detection
# lives in the permission-evaluator pass (no separate /rules/explicit/aws-inspector.yaml
# needed — the CanModifyConfiguration emits are driven by IAM effective-permission
# matching handled by the generic normalization pipeline).
# ---------------------------------------------------------------------------

provider: aws
phase: 12-security-logging
applies_to: [aws]

rules:

  # --- 1) Disable scanning (account/member scope) -> CanModifyConfiguration ----
  # inspector2:Disable stops all scanning for the account (or designated member
  # accounts when called from the delegated-administrator account). This removes
  # continuous CVE and network-exposure detection, a pure defense-evasion primitive.
  - id: aws-inspector-disable-scanning
    emits: CanModifyConfiguration
    description: >-
      Principal with inspector2:Disable can stop vulnerability scanning in the
      account (or designated member accounts from delegated-admin), removing
      continuous CVE and network-exposure detection — a defense-evasion primitive.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?inspector_service ]
    where:
      - "node_type(?inspector_service) == SecurityService"
      - "?inspector_service.provider_type == 'AWS::InspectorV2::Service'"
      - "?inspector_service.scope == 'account' OR ?inspector_service.scope == 'account-member'"
      - >-
        effective_permission(?principal, 'inspector2:Disable', ?inspector_service)
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?inspector_service
      permissions:
        - "inspector2:Disable"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?principal holds effective inspector2:Disable and no SCP
        denies it. BLOCKED if an SCP or permission boundary denies
        inspector2:Disable at the effective scope.
      confidence: 0.90
      derived_from:
        - "HasPermission(?principal, ?inspector_service) [inspector2:Disable]"
      evasion_only: true
      false_positive_note: >-
        This is a pure defense-evasion primitive — it reduces detection coverage,
        it does NOT grant access to any resource or enable privilege escalation.
        Do NOT chain this edge to CanEnterAccount, CanExecuteAs, or any escalation
        objective. An SCP denying inspector2:Disable at the organizational level
        should set state BLOCKED. The delegated-administrator scope (disabling
        scanning in member accounts) is an Inspector-management capability, not
        account entry; do NOT emit CanEnterAccount for that case.
      narrative: >-
        {principal.name} can call inspector2:Disable on {inspector_service.name},
        stopping all vulnerability scanning (EC2, Lambda, ECR) for this AWS
        account. This removes continuous CVE and network-exposure detection,
        reducing the likelihood that attacker activity is flagged — a
        defense-evasion / cover-tracks capability. It grants no resource access
        or privilege escalation.

  # --- 2) Update configuration (scan depth only) -> CanModifyConfiguration -----
  # inspector2:UpdateConfiguration only toggles individual scan features (e.g.,
  # Lambda deep inspection, ECR scanning toggle) — it does NOT disable the service.
  # This is a weaker evasion path (affects detection depth, not enablement).
  # Separated from Disable because confidence and impact differ substantially.
  - id: aws-inspector-update-config
    emits: CanModifyConfiguration
    description: >-
      Principal with inspector2:UpdateConfiguration can modify scan settings
      (e.g., Lambda deep scan, ECR scanning toggle), affecting detection depth
      but not service enablement.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?inspector_service ]
    where:
      - "node_type(?inspector_service) == SecurityService"
      - "?inspector_service.provider_type == 'AWS::InspectorV2::Service'"
      - >-
        effective_permission(?principal, 'inspector2:UpdateConfiguration', ?inspector_service)
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?inspector_service
      permissions:
        - "inspector2:UpdateConfiguration"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?principal holds effective inspector2:UpdateConfiguration
        and no SCP denies it. BLOCKED if SCP or permission boundary denies
        inspector2:UpdateConfiguration.
      confidence: 0.65
      derived_from:
        - "HasPermission(?principal, ?inspector_service) [inspector2:UpdateConfiguration]"
      evasion_only: true
      false_positive_note: >-
        inspector2:UpdateConfiguration affects scan depth (toggling Lambda deep
        inspection, ECR scanning toggle, etc.) but does NOT disable the service.
        This is a weaker evasion path than disable: scanning continues, but may
        skip deeper package analysis. Do NOT chain to CanExecuteAs or privilege
        escalation. Confidence is 0.65 (weaker impact than Disable) because the
        attacker only reduces scan depth, not detection capability entirely.
      narrative: >-
        {principal.name} can call inspector2:UpdateConfiguration on
        {inspector_service.name} to toggle scan features (e.g., disable Lambda
        deep inspection or ECR scanning). This reduces scan depth but does not
        disable the service — scanning continues for enabled resource types.

  # --- 3) Disable organization scanning (delegated-admin scope) ----------------
  # A principal in the delegated-admin account can call inspector2:Disable with
  # a member_account_ids array to disable scanning across the entire AWS
  # Organization. This is the highest-impact Inspector evasion primitive —
  # one action stops scanning in dozens of accounts simultaneously.
  - id: aws-inspector-disable-org-scanning
    emits: CanModifyConfiguration
    description: >-
      Delegated-administrator account principal with inspector2:Disable can
      disable scanning for any/all organization member accounts simultaneously,
      stopping CVE detection across the entire AWS Organization from a single API call.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?inspector_service ]
    where:
      - "node_type(?inspector_service) == SecurityService"
      - "?inspector_service.provider_type == 'AWS::InspectorV2::Service'"
      - "?inspector_service.scope == 'organization'"
      - >-
        effective_permission(?principal, 'inspector2:Disable', ?inspector_service)
      - "principal_account_is_delegated_admin(?principal, ?inspector_service)"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?inspector_service
      permissions:
        - "inspector2:Disable"
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when ?principal holds effective inspector2:Disable AND the
        principal's account is confirmed as the delegated-admin account
        (GetDelegatedAdminAccount confirms relationship). CONDITIONAL(service_state)
        if delegated-admin relationship cannot be confirmed. BLOCKED if SCP denies
        inspector2:Disable or if delegated-admin assignment is revoked.
      confidence: 0.85
      derived_from:
        - "HasPermission(?principal, ?inspector_service) [inspector2:Disable]"
        - "service_state(delegated_admin_relationship_active)"
      evasion_only: true
      false_positive_note: >-
        This path requires the principal's account to be the active delegated-admin
        for Inspector. It is the highest-impact Inspector evasion primitive:
        disabling scanning in member accounts from the admin account via a single
        inspector2:Disable call with member_account_ids parameter. This is
        organizational scope evasion only, NOT CanEnterAccount or privilege escalation.
        The affected member accounts do not gain access to the attacker — their
        scanning is merely disabled at the administrator's direction.
      narrative: >-
        {principal.name} in the Inspector delegated-administrator account can call
        inspector2:Disable with member_account_ids to disable scanning for any or
        all organization member accounts, stopping CVE and network-exposure detection
        across the entire AWS Organization simultaneously. This is the highest-impact
        Inspector evasion primitive — one API call removes detection coverage from
        dozens of accounts. It is a defense-evasion / cover-tracks capability only.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - An SCP or permission boundary denying inspector2:Disable at the effective
#     scope -> emit the edge with state: BLOCKED and denied_by=<SCP arn/statement>.
#   - An SCP denying both inspector2:UpdateConfiguration should set
#     aws-inspector-update-config BLOCKED.
#   - For aws-inspector-disable-org-scanning, BLOCKED if delegated-admin
#     relationship is revoked or if SCP denies inspector2:Disable at the
#     organization policy level.
#   - Inspector's service-linked role (AWSServiceRoleForAmazonInspector2) should
#     NOT be modeled as a CanPassIdentity / CanExecuteAs target — it is AWS-managed
#     and not customer-assumable.
#
# RULES IN THIS FILE:
#   1. aws-inspector-disable-scanning      — account/member scope, highest impact
#   2. aws-inspector-update-config         — scan depth only, lower impact
#   3. aws-inspector-disable-org-scanning  — delegated-admin org-wide scope
#
# All three rules are evasion-only and must be excluded from CanExecuteAs
# derivations. The can-execute-as.yaml linchpin must filter SecurityService
# targets with evasion_only=true.
# ---------------------------------------------------------------------------
