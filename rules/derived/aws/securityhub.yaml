# AWS Security Hub — Derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# Security Hub is a SecurityService (ManagementService class) that aggregates
# findings from GuardDuty, Inspector, Macie, Config, IAM Access Analyzer, and
# third-party integrations. An attacker with write permissions on Security Hub
# can suppress findings, disable controls, or shut down the service entirely —
# classic DEFENSE EVASION / COVER TRACKS. These are NOT privilege-escalation
# paths and do NOT chain to CanExecuteAs or CanEnterAccount.
#
# PHASE 12 CLASSIFICATION:
#   Mode (1) — DEFENSE EVASION / TAMPERING (dominant)
#     securityhub:BatchUpdateFindings  -> set WORKFLOW_SUPPRESSED on findings
#     securityhub:UpdateStandardsControl / BatchDisableStandards -> disable checks
#     securityhub:DisableSecurityHub   -> kill all detection in the region
#     securityhub:DeleteInsight        -> destroy saved finding queries
#     securityhub:CreateAutomationRule -> auto-suppress future findings
#   Mode (3) — DATA / RECON (minor)
#     securityhub:GetFindings -> resource inventory for pivoting
#
# IMPORTANT SCOPE LIMITS (false-positive discipline):
#   - Security Hub controls are DETECTIVE, not PREVENTIVE. Setting BLOCKED on
#     graph edges for Security Hub is NEVER correct; evasion reduces detection,
#     it does not block any access.
#   - Do NOT chain these edges to CanExecuteAs, CanEscalateTo, CanEnterAccount,
#     or any execution/privilege-escalation edge.
#   - securityhub:BatchUpdateFindings only modifies the Workflow state of findings;
#     it cannot delete findings, modify IAM, or access underlying resources.
#   - securityhub:DisableSecurityHub disables the service in the CALLER's account
#     and region only — it cannot remotely disable Security Hub in member accounts.
#
# NO LINCHPINS NEEDED: Security Hub has no execution identity (no ExecutesAs),
# no PassRole surface, and no CanModifyCode path. The cicd-chains, can-execute-as,
# credential-chains, and can-control linchpins are NOT cited here because none of
# their patterns apply to a detective-only service.
#
# PERMISSIONS are the exact action names from the AWS IAM Service Authorization
# Reference for AWS Security Hub:
#   https://docs.aws.amazon.com/service-authorization/latest/reference/list_awssecurityhub.html
#
# Source/target node classes:
#   source: Identity (any IAM principal with SecurityHub write permissions)
#   target: SecurityService (AWS::SecurityHub::Hub — ManagementService class subtype)
#           confirmed in schema/nodes.yaml: ManagementService.types.SecurityService
# ---------------------------------------------------------------------------

provider: aws
phase: 12-security-logging
applies_to: [aws]

rules:

  # ---------------------------------------------------------------------------
  # 1. Suppress findings via BatchUpdateFindings (WORKFLOW_SUPPRESSED)
  #    The most commonly abused evasion primitive: sets finding workflow state
  #    to SUPPRESSED or RESOLVED, hiding attacker-generated findings from dashboards
  #    and automated response rules without deleting them from the data store.
  #    securityhub:BatchUpdateFindings can update up to 100 findings per call.
  #    The delegated admin can suppress findings from member accounts.
  # ---------------------------------------------------------------------------
  - id: aws-securityhub-suppress-findings
    emits: CanModifyConfiguration
    description: >-
      Principal can suppress Security Hub findings (securityhub:BatchUpdateFindings),
      setting workflow state to SUPPRESSED or RESOLVED to hide attacker activity
      from dashboards and automated response — a defense-evasion primitive that
      does not grant access to any resource.
    match:
      - [ ?principal, HasPermission, ?hub ]
    where:
      - "node_type(?hub) == SecurityService"
      - "node_class(?hub) == ManagementService"
      - "?hub.provider_type == 'AWS::SecurityHub::Hub'"
      - "?principal has EFFECTIVE securityhub:BatchUpdateFindings on ?hub (resource scope: arn:aws:securityhub:*)"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?hub
      permissions:
        - "securityhub:BatchUpdateFindings"
      conditions: [iam_permission, scp_or_org_policy]
      state_logic: >-
        ACTIVE if securityhub:BatchUpdateFindings is in the principal's effective
        policy for the hub scope and no SCP or permission boundary denies it;
        BLOCKED if an explicit deny or SCP denies securityhub:BatchUpdateFindings;
        CONDITIONAL(scp_or_org_policy) if org policy applicability is unknown.
      confidence: 0.90
      derived_from:
        - "?principal HasPermission ?hub (securityhub:BatchUpdateFindings effective)"
      false_positive_note: >-
        BatchUpdateFindings updates only the Workflow status (SUPPRESSED/NEW/
        NOTIFIED/RESOLVED) of findings — it cannot delete findings, modify the
        underlying resources, or alter IAM permissions. The SecurityAudit and
        ReadOnlyAccess AWS managed policies do NOT grant this action; only principals
        with explicit grants (e.g. AWSSecurityHubFullAccess or a custom policy) should
        have this edge emitted. The delegated administrator account can suppress
        findings from member accounts, but this is still a detective-only action.
        Do NOT chain to CanExecuteAs or CanEscalateTo — this is cover-tracks, not
        privilege escalation.
      narrative: >-
        {principal.name} can suppress AWS Security Hub findings
        (securityhub:BatchUpdateFindings), setting their workflow state to
        SUPPRESSED or RESOLVED. This hides attacker-generated findings from
        Security Hub dashboards and from automated EventBridge/Lambda response
        rules, reducing detection fidelity. It does not grant access to any
        AWS resource.

  # ---------------------------------------------------------------------------
  # 2. Disable security controls or entire compliance standards
  #    UpdateStandardsControl toggles individual CIS/FSBP/NIST controls OFF,
  #    preventing Security Hub from generating findings for that check entirely.
  #    BatchDisableStandards removes a whole compliance standard subscription.
  #    Both are persistent configuration changes (not just finding metadata).
  # ---------------------------------------------------------------------------
  - id: aws-securityhub-disable-controls
    emits: CanModifyConfiguration
    description: >-
      Principal can disable Security Hub security controls, compliance standards,
      or the entire service (securityhub:UpdateStandardsControl /
      securityhub:BatchDisableStandards / securityhub:DisableSecurityHub),
      permanently preventing Security Hub from generating findings for those checks
      or disabling all detection — a persistent defense-evasion action that does
      not grant resource access.
    match:
      - [ ?principal, HasPermission, ?hub ]
    where:
      - "node_type(?hub) == SecurityService"
      - "node_class(?hub) == ManagementService"
      - "?hub.provider_type == 'AWS::SecurityHub::Hub'"
      - "?principal has EFFECTIVE securityhub:UpdateStandardsControl OR securityhub:BatchDisableStandards OR securityhub:DisableSecurityHub on ?hub"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?hub
      permissions:
        - "securityhub:UpdateStandardsControl"
        - "securityhub:BatchDisableStandards"
        - "securityhub:DisableSecurityHub"
      conditions: [iam_permission, scp_or_org_policy]
      state_logic: >-
        ACTIVE if any of securityhub:UpdateStandardsControl, securityhub:BatchDisableStandards,
        or securityhub:DisableSecurityHub is in the principal's effective policy for
        the hub scope and no SCP or permission boundary denies it;
        BLOCKED if an explicit deny or SCP denies all three actions;
        CONDITIONAL(scp_or_org_policy) if org policy applicability is unknown.
      confidence: 0.92
      derived_from:
        - "?principal HasPermission ?hub (securityhub:UpdateStandardsControl or securityhub:BatchDisableStandards or securityhub:DisableSecurityHub effective)"
      false_positive_note: >-
        UpdateStandardsControl and BatchDisableStandards modify the Security Hub
        service configuration (which checks run), not the findings themselves.
        DisableSecurityHub disables the entire service in the caller's account
        and region, killing all finding generation from GuardDuty, Inspector, Macie,
        Config, and IAM Access Analyzer integrations. All three are more persistent
        than BatchUpdateFindings — disabled controls/service remain off until
        explicitly re-enabled. However, they remain detective-only; no resource
        access or execution capability is gained. The delegated admin account can
        manage standards/controls for member accounts via the Organizations
        integration, but DisableSecurityHub only disables the service in the admin
        account itself, not in members. Emit only when the effective permission is
        confirmed — do not assume AWSSecurityHubReadOnlyAccess grants these (it
        does not). Do NOT chain to CanExecuteAs or CanEscalateTo.
      narrative: >-
        {principal.name} can disable AWS Security Hub security controls
        (securityhub:UpdateStandardsControl), remove compliance standards
        (securityhub:BatchDisableStandards), or fully disable the Security Hub
        service (securityhub:DisableSecurityHub). Disabling controls or the service
        prevents Security Hub from generating findings, providing persistent cover
        for attacker activity by eliminating detection from GuardDuty, Inspector,
        Macie, and Config. Full service disablement is the highest-impact evasion
        action. This is a configuration-level defense evasion action and does not
        grant access to any AWS resource.

  # ---------------------------------------------------------------------------
  # 3. Disable entire service (highest-impact evasion)
  #    DisableSecurityHub disables the Security Hub service entirely in the
  #    caller's account and region, eliminating ALL finding generation from
  #    GuardDuty, Inspector, Macie, Config, IAM Access Analyzer, and third-party
  #    integrations. This is distinct from disabling individual controls or standards
  #    — it is the highest-impact defense-evasion action available. Unlike
  #    UpdateStandardsControl/BatchDisableStandards (which hide detection but
  #    require future re-enablement), DisableSecurityHub is a nuclear option that
  #    stops all detective work in the region until manually re-enabled.
  # ---------------------------------------------------------------------------
  - id: aws-securityhub-disable-service
    emits: CanModifyConfiguration
    description: >-
      Principal can fully disable AWS Security Hub (securityhub:DisableSecurityHub),
      eliminating all detection from GuardDuty, Inspector, Macie, Config, and IAM
      Access Analyzer integrations — the highest-impact defense-evasion primitive
      that does not grant resource access.
    match:
      - [ ?principal, HasPermission, ?hub ]
    where:
      - "node_type(?hub) == SecurityService"
      - "node_class(?hub) == ManagementService"
      - "?hub.provider_type == 'AWS::SecurityHub::Hub'"
      - "?principal has EFFECTIVE securityhub:DisableSecurityHub on ?hub"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?hub
      permissions:
        - "securityhub:DisableSecurityHub"
      conditions: [iam_permission, scp_or_org_policy]
      state_logic: >-
        ACTIVE if securityhub:DisableSecurityHub is in the principal's effective
        policy and no SCP or permission boundary denies it;
        BLOCKED if explicitly denied.
      confidence: 0.95
      derived_from:
        - "?principal HasPermission ?hub (securityhub:DisableSecurityHub effective)"
      false_positive_note: >-
        DisableSecurityHub is a regional action scoped to the caller's account
        only — it cannot disable Security Hub in other accounts (even if the caller
        is a delegated administrator). This is the most dangerous evasion action
        available in Security Hub because it not only hides findings but stops all
        collection mechanisms (GuardDuty, Inspector, Macie, Config, IAM Access
        Analyzer) from writing new findings. Once disabled, Security Hub must be
        manually re-enabled, which is a heavyweight recovery action that would
        likely trigger incident response. Emit only when the effective permission
        is confirmed. Do NOT chain to CanExecuteAs or CanEscalateTo — this is
        cover-tracks, not privilege escalation.
      narrative: >-
        {principal.name} can fully disable AWS Security Hub in this region
        (securityhub:DisableSecurityHub), eliminating all finding generation from
        GuardDuty, Inspector, Macie, AWS Config, and IAM Access Analyzer. This is
        a nuclear option for defense evasion — it stops all detective controls
        from generating findings, providing perfect cover for ongoing attacker
        activity. Unlike disabling individual controls, re-enabling the service
        requires manual intervention and would trigger alerts. This is the most
        high-impact evasion action in Security Hub and does not grant access to
        any AWS resource.

  # ---------------------------------------------------------------------------
  # 4. Recon — enumerate all findings to identify pivot targets
  #    GetFindings returns the full set of ASFF-formatted finding records for
  #    the account and region, including resource ARNs, configuration details,
  #    vulnerability identifiers, and control failure reasons. This is a low-cost,
  #    low-noise recon path — Security Hub finding reads do not appear in
  #    resource-level CloudTrail data events.
  #    Note: securityhub:ListFindings does not exist in AWS IAM; GetFindings is
  #    the only findings-read action in the AWS Security Hub IAM reference.
  #    Conservative: 1 rule, CanRead only.
  # ---------------------------------------------------------------------------
  - id: aws-securityhub-recon-findings
    emits: CanRead
    description: >-
      Principal can enumerate Security Hub findings (securityhub:GetFindings),
      yielding a detailed inventory of every resource with a known vulnerability
      or misconfiguration — useful recon for target selection in lateral movement.
    match:
      - [ ?principal, HasPermission, ?hub ]
    where:
      - "node_type(?hub) == SecurityService"
      - "node_class(?hub) == ManagementService"
      - "?hub.provider_type == 'AWS::SecurityHub::Hub'"
      - "?principal has EFFECTIVE securityhub:GetFindings on ?hub"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?hub
      permissions:
        - "securityhub:GetFindings"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE if securityhub:GetFindings is in the principal's effective
        policy and no SCP or permission boundary denies it;
        BLOCKED if explicitly denied.
      confidence: 0.85
      derived_from:
        - "?principal HasPermission ?hub (securityhub:GetFindings effective)"
      false_positive_note: >-
        CanRead on a SecurityService node is low traversal weight (base_weight: 2)
        and is a recon step, not an escalation. GetFindings is a read-only
        control-plane call that appears in CloudTrail management events, not
        data events; it is present in the SecurityAudit and ReadOnlyAccess managed
        policies. Do not conflate with access to the underlying resources described
        in the findings — the findings describe a resource's configuration state,
        not the resource data itself. The delegated admin can read findings from
        member accounts via the aggregation layer.
      narrative: >-
        {principal.name} can enumerate all AWS Security Hub findings
        (securityhub:GetFindings), gaining a comprehensive inventory of every
        resource with a known vulnerability, misconfiguration, or compliance
        failure in the account. Attackers use this as low-noise recon to identify
        high-value pivot targets (unencrypted S3 buckets, publicly-exposed
        instances, over-privileged roles) without triggering additional
        resource-level CloudTrail events.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - An SCP denying securityhub:BatchUpdateFindings, securityhub:UpdateStandardsControl,
#     securityhub:BatchDisableStandards, or securityhub:DisableSecurityHub ->
#     emit the relevant edge with state: BLOCKED and denied_by=<SCP arn>.
#   - A permission boundary capping securityhub:* -> BLOCKED on all write edges.
#   - SecurityHub service may be disabled entirely in a region (DescribeHub returns
#     'Hub not found') — in that case no Hub node is collected, no edges emitted.
#
# EXPLICITLY-NORMALIZED EDGES (see /rules/explicit/aws/securityhub.yaml):
#   - aws-securityhub-effective-write: normalizes all securityhub write actions
#     (BatchUpdateFindings, UpdateStandardsControl, BatchDisableStandards, etc.)
#     to CanModifyConfiguration via match_effective_permission.
#   - aws-securityhub-effective-read: normalizes securityhub:GetFindings to CanRead.
#   These explicit rules feed the derived rules below, which pattern-match on
#   HasPermission edges to emit higher-level attack paths.
#
# DELIBERATELY OMITTED RULES (out of scope / over-claim):
#   - CreateAutomationRule / UpdateAutomationRule: equivalent to BatchUpdateFindings
#     at scale (auto-suppress future findings). Subsumed by aws-securityhub-suppress-findings
#     for graph purposes; add as a separate rule only if distinct prioritization is needed.
#   - DeleteInsight: CanDelete edge, not CanModifyConfiguration. Low independent
#     value (insights are saved queries, not detection logic). Excluded to keep
#     rule count conservative (3 rules is appropriate for this low-relevance service).
#   - Cross-account evasion via delegated admin: the delegated admin's ability to
#     suppress member-account findings is captured by aws-securityhub-suppress-findings
#     when the source is the admin-account identity — no separate cross-account rule
#     is needed because the API surface is the same action scoped to the aggregated
#     finding resource. Annotate the scope on the edge evidence record.
# ---------------------------------------------------------------------------
