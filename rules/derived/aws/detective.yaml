# AWS Detective — Derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# Amazon Detective is a LOW-RELEVANCE security investigation service.
# It collects CloudTrail, VPC Flow Log, and GuardDuty data into a behavior
# graph for analyst investigation. It has NO execution identity, NO code
# modification surface, and NO credential-exposure capability.
#
# PHASE 12 FRAMING — DEFENSE EVASION (dominant mode):
#   Deleting the Detective behavior graph (detective:DeleteGraph) removes
#   the entire graph and stops data collection (ADMINISTRATOR ONLY).
#   Removing a member account (via detective:DeleteMembers) forcibly removes
#   a member from the graph (ADMINISTRATOR ONLY).
#   Disassociating membership (detective:DisassociateMembership) removes the
#   calling member account from the graph (MEMBER self-removal).
#   Changing organization configuration (detective:UpdateOrganizationConfiguration)
#   or enabling a delegated org admin (detective:EnableOrganizationAdminAccount)
#   alters the org-wide Detective posture (ORGANIZATION-LEVEL).
#
#   These prevent the graph from correlating findings in affected account(s)/graph,
#   reducing investigative coverage. These are COVER-TRACKS / weaken-defenses primitives.
#
#   IMPORTANT: Detective controls are DETECTIVE controls, NOT preventive
#   guardrails. Disabling Detective does NOT set BLOCKED state on any other edge.
#   Do NOT chain these rules to CanEnter* or CanExecuteAs.
#
# LINCHPINS: None cited — Detective has no execution path, no credential chain,
# and no code-modify surface. The evasion primitives are atomic (direct explicit
# permission against the SecurityService or Organization node).
#
# SERVICE FACTS THIS FILE EMITS:
#   CanModifyConfiguration  — delete graph, remove member, or alter org config
#                             (detective:DeleteGraph, detective:DeleteMembers,
#                              detective:DisassociateMembership,
#                              detective:UpdateOrganizationConfiguration,
#                              detective:EnableOrganizationAdminAccount)
#
# Official docs:
#   https://docs.aws.amazon.com/detective/latest/userguide/
#   https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazondetective.html
# ---------------------------------------------------------------------------

provider: aws
phase: 12-security-logging
applies_to: [aws]

rules:

  # --- Defense evasion: delete graph (admin only) -----------------------
  #
  # An attacker who holds detective:DeleteGraph on a behavior graph can
  # permanently destroy the graph, ending data collection from all member
  # accounts and breaking investigation workflows for that region.
  # This is ADMINISTRATOR ONLY — the admin deletes the entire graph.
  #
  # Modeled as CanModifyConfiguration on the SecurityService node because it
  # structurally destroys the investigative graph. CanDelete is NOT used here:
  # CanDelete is excluded from default traversal (traversal: walkable: false in
  # edges.yaml) and would miss related admin actions; CanModifyConfiguration on
  # a ManagementService/SecurityService node is the Phase 12 convention for
  # "weakens a detective/security control".
  #
  # This rule is ATOMIC — it derives CanModifyConfiguration directly from the
  # effective permission check. No intermediate edges are needed.
  - id: aws-detective-delete-graph
    emits: CanModifyConfiguration
    description: >-
      Deleting the Detective behavior graph is a defense-evasion / cover-tracks
      primitive that reduces investigative coverage (ADMINISTRATOR ONLY).
      Emits CanModifyConfiguration on the SecurityService node.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?graph ]
    where:
      - "node_type(?graph) == SecurityService"
      - "?graph.provider_type == 'AWS::Detective::Graph'"
      - "effective_permission(?principal, ?graph, detective:DeleteGraph)"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?graph
      permissions:
        - "detective:DeleteGraph"
      conditions: [iam_permission, scp_or_org_policy, permission_boundary]
      state_logic: >-
        ACTIVE when the IAM effective-permission evaluator confirms
        detective:DeleteGraph on the graph ARN with no SCP or permission-boundary denial.
        CONDITIONAL(iam_permission) when the permission is policy-present but
        resource-scope is unresolved (e.g. wildcard resource without a confirmed
        matching graph ARN).
        BLOCKED when an SCP or permission boundary denies detective:DeleteGraph
        on the graph ARN — detective controls are not preventive; the BLOCKED here
        reflects the evasion action being blocked, not a protected resource.
      confidence: 0.95
      derived_from:
        - "?principal HasPermission ?graph"
      false_positive_note: >-
        This edge represents a COVER-TRACKS / weaken-defenses capability only.
        Disabling Detective does NOT unblock any preventive control (SCP, IAM deny,
        GuardDuty still fires — GuardDuty is a separate service). Do NOT chain this
        edge to CanExecuteAs, CanEnterAccount, or any privilege-escalation edge.
        This is ADMINISTRATOR ONLY — the admin account that owns the graph.
        Prefer CONDITIONAL when graph ARN resolution is incomplete.
      narrative: >-
        {principal.name} can delete the Amazon Detective behavior graph
        {graph.name}, preventing security teams from correlating CloudTrail,
        VPC Flow Log, and GuardDuty data for investigation. This is a defense-evasion
        primitive — it reduces detection coverage but does not grant access to any
        resource. Only the graph administrator can delete the graph.

  # --- Defense evasion: remove member account (admin only) ----
  #
  # An attacker who holds detective:DeleteMembers on a behavior graph can
  # forcibly remove member accounts from the graph (ADMINISTRATOR ONLY).
  # This prevents the graph from aggregating CloudTrail and VPC Flow Log data
  # from the removed account. This is distinct from detective:DisassociateMembership,
  # which is the member account's self-removal action.
  #
  # Modeled as CanModifyConfiguration on the SecurityService node because it
  # structurally alters graph membership.
  - id: aws-detective-remove-member
    emits: CanModifyConfiguration
    description: >-
      Forcibly removing a member account from a Detective behavior graph
      (detective:DeleteMembers) is a defense-evasion primitive (ADMINISTRATOR ONLY).
      Emits CanModifyConfiguration on the SecurityService node.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?graph ]
    where:
      - "node_type(?graph) == SecurityService"
      - "?graph.provider_type == 'AWS::Detective::Graph'"
      - "effective_permission(?principal, ?graph, detective:DeleteMembers)"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?graph
      permissions:
        - "detective:DeleteMembers"
      conditions: [iam_permission, scp_or_org_policy, permission_boundary]
      state_logic: >-
        ACTIVE when the IAM effective-permission evaluator confirms
        detective:DeleteMembers on the graph ARN with no SCP or permission-boundary denial.
        CONDITIONAL(iam_permission) when the permission is policy-present but
        resource-scope is unresolved.
        BLOCKED when an SCP or permission boundary denies detective:DeleteMembers.
      confidence: 0.9
      derived_from:
        - "?principal HasPermission ?graph"
      false_positive_note: >-
        This is ADMINISTRATOR ONLY — the graph admin can forcibly remove members.
        Do NOT confuse with detective:DisassociateMembership, which is called by
        the member account itself to remove itself from the graph (separate rule).
        This capability reduces investigative coverage for the removed account but
        does not grant access to any resource.
      narrative: >-
        {principal.name} can remove member accounts from the Amazon Detective behavior
        graph {graph.name} (detective:DeleteMembers), preventing data aggregation
        from those accounts. This is a defense-evasion primitive — it reduces
        detection coverage but does not grant access to any resource. Only the
        graph administrator can forcibly remove members.

  # --- Defense evasion: member self-removal from graph ----
  #
  # A member account that has been invited to a behavior graph can call
  # detective:DisassociateMembership to remove itself from the graph. This is
  # the member's self-removal action, not an administrator action. The member
  # stops contributing CloudTrail and VPC Flow Log data to the graph.
  #
  # This has lower severity than admin-side removal because:
  # 1. Only applies to the calling account (member removing itself)
  # 2. Requires the account to be a member of the graph
  # 3. Does not affect other accounts' visibility
  #
  # Modeled as CanModifyConfiguration with CONDITIONAL scope.
  - id: aws-detective-member-disassociate
    emits: CanModifyConfiguration
    description: >-
      A member account can remove itself from a Detective behavior graph
      (detective:DisassociateMembership). This is a self-removal action with
      reduced scope. Emits CONDITIONAL CanModifyConfiguration.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?graph ]
    where:
      - "node_type(?graph) == SecurityService"
      - "?graph.provider_type == 'AWS::Detective::Graph'"
      - "effective_permission(?principal, ?graph, detective:DisassociateMembership)"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?graph
      permissions:
        - "detective:DisassociateMembership"
      conditions: [iam_permission, scp_or_org_policy, permission_boundary, region_or_boundary]
      state_logic: >-
        ACTIVE when the IAM effective-permission evaluator confirms
        detective:DisassociateMembership on the graph ARN with no SCP or permission-boundary denial.
        CONDITIONAL(region_or_boundary) when the principal is confirmed to be a member
        account of the specified graph (requires additional membership verification).
        CONDITIONAL(iam_permission) when the permission is policy-present but
        resource-scope is unresolved.
        BLOCKED when an SCP or permission boundary denies detective:DisassociateMembership.
      confidence: 0.75
      derived_from:
        - "?principal HasPermission ?graph"
      false_positive_note: >-
        This is MEMBER SELF-REMOVAL ONLY — the member account removes itself
        from the graph. Only meaningful as an evasion primitive if the member
        account has activity worth hiding. Do NOT chain to privilege-escalation
        edges. Requires the principal to actually be a member of the graph
        (CONDITIONAL scope).
      narrative: >-
        {principal.name} (member account) can remove itself from the Amazon
        Detective behavior graph {graph.name}, stopping its CloudTrail and VPC Flow
        Log data from being aggregated. This is a self-removal action (member-initiated),
        reducing investigative visibility of the member account only. Lower impact than
        administrator-side member removal.

  # --- Defense evasion: weaken org-wide Detective posture ----
  #
  # An attacker who can call detective:UpdateOrganizationConfiguration or
  # detective:EnableOrganizationAdminAccount can alter the organization-wide
  # Detective behavior. These are ORGANIZATION-LEVEL actions:
  #   - detective:UpdateOrganizationConfiguration: enable/disable org-wide auto-enablement
  #   - detective:EnableOrganizationAdminAccount: designate a delegated admin for org Detective
  #
  # Both reduce or alter investigative coverage across the organization. These
  # are modeled as CanModifyConfiguration on the Organization node (or the
  # graph's organization scope).
  - id: aws-detective-weaken-org-config
    emits: CanModifyConfiguration
    description: >-
      Modifying organization-wide Detective configuration (UpdateOrganizationConfiguration,
      EnableOrganizationAdminAccount) weakens the org's investigative posture.
      Emits CanModifyConfiguration on the Organization scope.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?org_scope ]
    where:
      - "node_type(?org_scope) == Organization OR scope_is(?org_scope, organization-level)"
      - >-
        (effective_permission(?principal, ?org_scope, detective:UpdateOrganizationConfiguration) OR
         effective_permission(?principal, ?org_scope, detective:EnableOrganizationAdminAccount))
    emit:
      source_type: Identity
      target_type: Organization
      source: ?principal
      target: ?org_scope
      permissions:
        - "detective:UpdateOrganizationConfiguration"
        - "detective:EnableOrganizationAdminAccount"
      conditions: [iam_permission, scp_or_org_policy, permission_boundary]
      state_logic: >-
        ACTIVE when the IAM effective-permission evaluator confirms at least one of
        detective:UpdateOrganizationConfiguration or detective:EnableOrganizationAdminAccount
        on the org scope with no SCP or permission-boundary denial.
        CONDITIONAL(iam_permission) when permission is policy-present but scope is unresolved.
        BLOCKED when an SCP or permission boundary denies both actions.
      confidence: 0.85
      derived_from:
        - "?principal HasPermission ?org_scope"
      false_positive_note: >-
        These are ORG-LEVEL actions affecting all org accounts. Do NOT chain to
        CanExecuteAs or CanEnterAccount; they alter investigative posture, not
        access control. detective:EnableOrganizationAdminAccount requires
        organizations:RegisterDelegatedAdministrator as a CONDITIONAL prerequisite
        if using the Organizations adapter.
      narrative: >-
        {principal.name} can weaken the organization's Detective posture by enabling
        organization-wide auto-detection configuration changes or designating a
        delegated administrator. This reduces or redirects investigative coverage
        across all org member accounts. Defense-evasion / cover-tracks primitive.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   An SCP denying any of the covered actions (detective:DeleteGraph,
#   detective:DeleteMembers, detective:DisassociateMembership,
#   detective:UpdateOrganizationConfiguration, detective:EnableOrganizationAdminAccount)
#   on the relevant resource ARN -> emit the edge with state: BLOCKED and
#   denied_by=<SCP arn/statement>.
#
# NO explicit normalization file is needed for Detective: the primitives
# (CanModifyConfiguration from effective-permission checks) do not require
# a separate /rules/explicit/aws-detective.yaml. If the collector gains an
# explicit HasPermission edge for any of the above actions, the derived rules
# fire directly off those edges.
# ---------------------------------------------------------------------------
