# BLOCKED-edge guidance:
#   - An SCP or permission boundary denying elasticmapreduce:AddJobFlowSteps,
#     elasticmapreduce:RunJobFlow, emr-serverless:StartJobRun, or iam:PassRole at
#     the effective scope -> emit the corresponding edge with state: BLOCKED and
#     denied_by=<SCP arn/statement>.
#   - A condition denying iam:PassedToService for the relevant service principal
#     (elasticmapreduce.amazonaws.com, emr-serverless.amazonaws.com, ec2.amazonaws.com)
#     blocks the create/pass edges -> CONDITIONAL(role_compatibility) or BLOCKED.
#   - IMDSv2 with hop-limit=1 enforced on all cluster nodes -> downgrade
#     aws-emr-exposes-instance-profile-cred to CONDITIONAL(condition_expression),
#     NOT BLOCKED (hop-limit bypass risk remains with privileged containers).
#   - A terminated/terminating cluster blocks aws-emr-execute-as-add-steps
#     -> CONDITIONAL(service_state).
