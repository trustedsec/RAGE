# AWS Secrets Manager — Derived attack-path rules (Phase 5 — credential-access)
# ---------------------------------------------------------------------------
# Emits ONLY common edge types from schema/edges.yaml. Explicit normalization
# (CanReadSecret from GetSecretValue, CredentialsFor, ContainsSecret,
# CrossAccountTrust, CanModifyPolicy, CanModifyConfiguration, the KmsKeyId
# wrapping link) lives in /rules/explicit/aws-secretsmanager.yaml. These derived
# rules DO NOT re-produce those explicit edges. They either (a) ANNOTATE the
# key_permission gate/state on the already-emitted explicit CanReadSecret edge
# (state-annotation rules — see rules 1-3, kind: state_annotation), or (b) emit a
# genuinely DERIVED edge (nature: derived|both) that represents the CONSEQUENCE of
# a capability (CanEnterAccount, CanEscalateTo, ExposesCredential, CanInvoke) —
# then hand off to the provider-agnostic collapses in
# /rules/derived/credential-chains.yaml (read-secret-yields-identity,
# execute-then-read-secret, decrypt-gates-secret-read, impersonate-is-escalation)
# for the generic credential-chain math.
#
# NATURE DISCIPLINE (RULE-FORMAT.md): a rule with `emits:` MUST target an edge
# whose nature is derived|both. CanReadSecret, CanModifyPolicy, and
# CanModifyConfiguration are nature: explicit — they are produced ONCE by the
# explicit normalization pass and MUST NOT be re-emitted here. Rules that only
# need to adjust the state/conditions of an existing explicit CanReadSecret edge
# are marked `kind: state_annotation` and carry `annotates:` (the explicit edge
# they refine) instead of `emits:`; they produce no new edge, only a state/gate
# mutation the evaluator applies in place.
#
# CORE INVARIANT: reading a Secrets Manager secret == calling GetSecretValue AND
# being able to decrypt it. Every value is KMS-encrypted. On the AWS-managed
# `aws/secretsmanager` key, decrypt is transparent for same-account Secrets Manager
# callers (ACTIVE). On a customer CMK, the caller also needs kms:Decrypt on that CMK
# -> CONDITIONAL(key_permission) until decrypt-gates-secret-read proves it.
#
# EDGE SOURCE/TARGET CONFORMANCE (schema/edges.yaml):
#   CanReadSecret (explicit):  source [Identity, Compute]   target [Secret, ConnectionString, Password, APIKey, Certificate]  — ANNOTATED here, not emitted
#   CredentialsFor (explicit): source [Secret, Credential, AccessKey, Token, Certificate] target [Identity, Data, ServiceIdentity]
#   CanDecrypt (explicit):     source [Identity, Compute]    target [EncryptionKey]
#   CanModifyPolicy (explicit): source [Identity]           target [Policy, Identity, "*"]  — emitted by explicit rule, not here
#   CanModifyConfiguration (explicit): source [Identity]    target [Compute, Messaging, Network, "*"]  — emitted by explicit rule, not here
#   ExposesCredential (derived): source [Compute, Storage, Data, Messaging, Secret] target [Credential, Identity]
#   CanInvoke (explicit):      source [Identity]             target [ServerlessFunction, API, APIGateway, Workflow]  — emitted by explicit rule, not here
#   CanEnterAccount (derived): source [Identity]             target [Account]
#   CanEscalateTo (derived):   source [Identity]             target [Identity]
# The Secret node's subtype (Secret/ConnectionString/Password/APIKey/Certificate)
# keeps CanReadSecret targets within the declared set. ExposesCredential is the
# ONLY credential-poisoning consequence edge that admits a Secret-class source.
# ---------------------------------------------------------------------------

provider: aws
phase: 5-credential-access
applies_to: [aws]

rules:

  # --- 1) GetSecretValue on an AWS-managed-key secret -> ACTIVE read ---------
  # STATE-ANNOTATION rule: the explicit CanReadSecret edge is already produced by
  # aws-secretsmanager-can-read-secret in /rules/explicit/aws-secretsmanager.yaml
  # from the effective GetSecretValue permission. This rule does NOT re-emit it
  # (CanReadSecret is nature: explicit); it only sets the state/gate on that
  # existing edge to ACTIVE when the secret is wrapped by the AWS-managed key.
  - id: aws-secretsmanager-read-value
    kind: state_annotation
    annotates: CanReadSecret
    description: "Sets the existing explicit CanReadSecret edge to ACTIVE when the secret is wrapped by the AWS-managed key (transparent same-account decrypt)."
    match:
      - [ ?principal, CanReadSecret, ?secret ]   # pre-existing explicit edge
    where:
      - "node_class(?secret) == Secret"
      - "?principal has EFFECTIVE secretsmanager:GetSecretValue on ?secret (identity AND resource policy allow; no Deny)"
      - "?secret.KmsKeyId is the AWS-managed key (alias/aws/secretsmanager) OR unset (defaults to it)"
      - "?principal.account == ?secret.account"
    annotation:
      target_edge: [ ?principal, CanReadSecret, ?secret ]
      set_state: "ACTIVE"
      set_conditions: [iam_permission, resource_policy]
      state_logic: "ACTIVE — the aws/secretsmanager managed key authorizes decrypt transparently for same-account Secrets Manager callers via kms:ViaService; no separate caller decrypt is required. BLOCKED if an SCP/resource-policy Deny hits secretsmanager:GetSecretValue."
      derived_from: [ "<explicit CanReadSecret(GetSecretValue) edge_id>" ]
      false_positive_note: >-
        Only mark ACTIVE when the secret uses the AWS-managed aws/secretsmanager key
        (or no KmsKeyId, which defaults to it) AND the caller is same-account. Recon
        actions (DescribeSecret, GetResourcePolicy, ListSecretVersionIds) do NOT
        return the value — the explicit edge must never have been sourced from them.
        BatchGetSecretValue is equivalent to GetSecretValue and also qualifies.
        Cross-account reads never use the managed key -> handled by
        aws-secretsmanager-cross-account-read. This rule PRODUCES NO EDGE; it refines
        the state of the explicit edge in place.
      narrative: >-
        {principal.name} can read the value of {secret.name}
        (secretsmanager:GetSecretValue); the secret uses the AWS-managed key so no
        additional decrypt permission is needed.

  # --- 2) GetSecretValue on a CMK-wrapped secret -> CONDITIONAL(key_permission)
  # STATE-ANNOTATION rule: sets the key_permission gate on the existing explicit
  # CanReadSecret edge. Does NOT re-emit CanReadSecret. The provider-agnostic
  # decrypt-gates-secret-read rule later UPGRADES this gated edge to ACTIVE when
  # the caller also holds CanDecrypt on the exact wrapping CMK.
  - id: aws-secretsmanager-cmk-gated-read
    kind: state_annotation
    annotates: CanReadSecret
    description: "Gates the existing explicit CanReadSecret edge on kms:Decrypt (CONDITIONAL(key_permission)) when the secret is CMK-encrypted."
    match:
      - [ ?principal, CanReadSecret, ?secret ]   # pre-existing explicit edge
    where:
      - "node_class(?secret) == Secret"
      - "?principal has EFFECTIVE secretsmanager:GetSecretValue on ?secret"
      - "?secret.KmsKeyId is a customer-managed CMK (NOT alias/aws/secretsmanager)"
    annotation:
      target_edge: [ ?principal, CanReadSecret, ?secret ]
      set_state: "CONDITIONAL"
      set_conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        Set CONDITIONAL(key_permission) — the caller holds GetSecretValue but decrypt
        on the wrapping CMK is unproven. The generic decrypt-gates-secret-read rule
        upgrades this edge to ACTIVE iff the caller also holds CanDecrypt on the exact
        CMK that wraps this secret. BLOCKED if a key-policy/SCP Deny hits kms:Decrypt
        or a resource-policy Deny hits GetSecretValue.
      derived_from: [ "<explicit CanReadSecret(GetSecretValue) edge_id>", "<wraps(?cmk,?secret) link>" ]
      false_positive_note: >-
        Secrets Manager calls kms:Decrypt on the caller's behalf against the secret's
        CMK; GetSecretValue alone WITHOUT decrypt on that CMK yields
        AccessDeniedException. Do NOT leave the explicit edge ACTIVE from
        GetSecretValue alone on a CMK secret. The decrypt must be on the EXACT CMK
        that wraps THIS secret (DescribeSecret.KmsKeyId), honoring
        kms:ViaService/EncryptionContext conditions. This rule SETS the gate; the
        generic decrypt-gates-secret-read rule performs the upgrade. Produces no edge.
      narrative: >-
        {principal.name} can call secretsmanager:GetSecretValue on {secret.name}, but
        the value is CMK-encrypted — reading the plaintext also requires kms:Decrypt
        on the wrapping CMK; without it this stays CONDITIONAL(key_permission).

  # --- 3) Cross-account read via resource policy ----------------------------
  # STATE-ANNOTATION rule: a cross-account principal granted GetSecretValue by the
  # secret's resource policy already has an explicit CanReadSecret edge (the
  # effective-permission evaluator honors the resource policy). This rule sets the
  # cross-account gate (resource_policy + key_permission) on that existing edge. It
  # does NOT re-emit CanReadSecret.
  - id: aws-secretsmanager-cross-account-read
    kind: state_annotation
    annotates: CanReadSecret
    description: "Gates the existing explicit cross-account CanReadSecret edge on the secret resource policy AND the CMK key policy."
    match:
      - [ ?external, CanReadSecret, ?secret ]   # pre-existing explicit edge
    where:
      - "node_class(?secret) == Secret"
      - "?external.account != ?secret.account"
      - "?secret resource policy grants secretsmanager:GetSecretValue to ?external"
      - "?secret is CMK-encrypted (cross-account reads cannot use aws/secretsmanager)"
    optional:
      - [ ?external, CanDecrypt, ?cmk ]
    annotation:
      target_edge: [ ?external, CanReadSecret, ?secret ]
      set_state: "CONDITIONAL"
      set_conditions: [resource_policy, key_permission, iam_permission]
      state_logic: >-
        if the resource policy grants GetSecretValue to ?external AND
        matched(optional[0]) with ?cmk == wrapping CMK (CMK key policy grants
        kms:Decrypt to ?external): set ACTIVE; else CONDITIONAL(resource_policy,
        key_permission). BLOCKED on any Deny in the resource policy, CMK key policy,
        or an SCP on either account.
      derived_from: [ "<explicit CanReadSecret(GetSecretValue) edge_id>", "<CrossAccountTrust(resource policy) edge_id>", "<CanDecrypt(?cmk) edge_id?>" ]
      false_positive_note: >-
        Cross-account access requires BOTH the secret resource policy AND the CMK key
        policy to allow the external principal AND the external principal's own
        identity policy to allow GetSecretValue (three-way AND). The AWS-managed key
        CANNOT be shared cross-account, so a cross-account grant on a managed-key
        secret does not actually work -> do not set ACTIVE. Honor SourceArn/
        aws:PrincipalOrgID conditions on the resource policy. Produces no edge.
      narrative: >-
        {external.name} (account {external.account}) is granted
        secretsmanager:GetSecretValue on {secret.name} by its resource policy; with
        kms:Decrypt on the wrapping CMK it can read the cross-account credential.

  # --- 4) Cross-account read that yields account entry ----------------------
  - id: aws-secretsmanager-cross-account-entry
    emits: CanEnterAccount
    description: "Cross-account read of a secret that is credentials for a local identity is a foothold in this account."
    match:
      - [ ?external, CanReadSecret,  ?secret ]
      - [ ?secret,   CredentialsFor, ?identity ]
    where:
      - "node_class(?secret) == Secret"
      - "?external.account != ?secret.account"
      - "?identity.account == ?secret.account"
      - "node_class(?identity) == Identity"
    emit:
      source_type: Identity
      target_type: Account
      source: ?external
      target: "<account of ?secret>"
      permissions: ["secretsmanager:GetSecretValue", "kms:Decrypt"]
      conditions: [resource_policy, key_permission]
      state_logic: >-
        inherit_weakest(cross-account CanReadSecret, CredentialsFor): ACTIVE only if
        the cross-account read is ACTIVE (resource policy + CMK key policy both admit
        ?external) AND CredentialsFor is evidenced; otherwise CONDITIONAL with the
        union of the unmet gates; BLOCKED if the read is BLOCKED.
      confidence: "min(contributing_confidences)"
      derived_from: [ "<cross-account CanReadSecret edge_id>", "<CredentialsFor edge_id>" ]
      false_positive_note: >-
        Only a foothold when the stored credential authenticates as an identity IN the
        secret's account (a local IAM key / role credential / DB login). A secret that
        is credentials for a THIRD account or an external SaaS does not yield entry to
        THIS account. Inherits the CONDITIONAL(key_permission) gate from the read.
      narrative: >-
        {external.name} can read {secret.name} cross-account, which holds credentials
        for {identity.name} in account {secret.account} — gaining a foothold there.

  # --- 5) Resource-policy self-grant -> escalation via the granted read -------
  # The explicit CanModifyPolicy edge (from secretsmanager:PutResourcePolicy) is
  # already produced by aws-secretsmanager-can-modify-policy in the explicit file;
  # this rule does NOT re-emit it. Instead it models the CONSEQUENCE of the
  # self-grant: a principal that can rewrite the resource policy can grant itself
  # GetSecretValue, and if the secret is CredentialsFor a strictly-more-privileged
  # identity, that self-granted read is privilege escalation -> derived CanEscalateTo
  # (nature: derived, Identity -> Identity).
  - id: aws-secretsmanager-resource-policy-self-grant
    emits: CanEscalateTo
    description: "PutResourcePolicy self-grants GetSecretValue on a secret that is credentials for a more-privileged identity — escalation."
    match:
      - [ ?principal, CanModifyPolicy, ?secret ]        # explicit, from PutResourcePolicy
      - [ ?secret,    CredentialsFor,  ?identity ]      # explicit, evidenced
    where:
      - "node_class(?secret) == Secret"
      - "node_class(?identity) == Identity"
      - "?principal has EFFECTIVE secretsmanager:PutResourcePolicy on ?secret"
      - "privilege(?identity) > privilege(?principal)"
    emit:
      source_type: Identity
      target_type: Identity
      source: ?principal
      target: ?identity
      permissions: ["secretsmanager:PutResourcePolicy", "secretsmanager:GetSecretValue", "kms:Decrypt"]
      conditions: [iam_permission, key_permission]
      state_logic: >-
        if ?secret is wrapped by the AWS-managed key (self-granted GetSecretValue then
        decrypts transparently same-account): ACTIVE; if ?secret is CMK-wrapped:
        CONDITIONAL(key_permission) — the self-grant only rewrites the SECRET resource
        policy, NOT the KMS key policy, so a customer CMK still blocks plaintext unless
        the principal separately holds kms:Decrypt. BLOCKED if an SCP denies
        secretsmanager:PutResourcePolicy.
      confidence: "min(contributing_confidences) * 0.9"
      derived_from: [ "<CanModifyPolicy(PutResourcePolicy) edge_id>", "<CredentialsFor edge_id>" ]
      false_positive_note: >-
        The self-grant only touches the SECRET's resource policy, not the wrapping
        CMK's key policy: self-granting GetSecretValue does NOT bypass kms:Decrypt on a
        customer CMK -> CONDITIONAL(key_permission), never assume ACTIVE for a CMK
        secret. AWS BlockPublicPolicy blocks a broadly public policy unless explicitly
        disabled. Emit ONLY when the secret is evidenced CredentialsFor a STRICTLY
        more-privileged identity; a self-grant on a secret with no CredentialsFor, or
        for a lateral identity, is access not escalation. Dedup against the generic
        read-secret-yields-identity -> impersonate-is-escalation collapse by
        (type,source,target,scope).
      narrative: >-
        {principal.name} can rewrite the resource policy of {secret.name}
        (secretsmanager:PutResourcePolicy) to self-grant GetSecretValue; the secret is
        credentials for the more-privileged {identity.name}, so this escalates to
        {identity.name} (CMK secrets still need kms:Decrypt).

  # --- 6) Value tamper (write-side credential poisoning) --------------------
  # The explicit CanModifyConfiguration edge (from PutSecretValue/UpdateSecret) is
  # already produced by aws-secretsmanager-can-modify-value in the explicit file;
  # this rule does NOT re-emit it (and re-emitting it only worked via the '*'
  # wildcard in that edge's target set — a Secret is not compute 'configuration').
  # Instead it models the CONSEQUENCE of the write: the attacker-planted value is a
  # credential a downstream consumer will trust -> derived ExposesCredential from
  # the Secret to the identity/credential it authenticates (ExposesCredential source
  # set [Compute, Storage, Data, Messaging, Secret], target [Credential, Identity]).
  - id: aws-secretsmanager-value-tamper
    emits: ExposesCredential
    description: "PutSecretValue/UpdateSecret plants an attacker-controlled credential in the secret that any consumer refetches and trusts."
    match:
      - [ ?principal, CanModifyConfiguration, ?secret ]   # explicit, from PutSecretValue
      - [ ?secret,    CredentialsFor,          ?identity ] # the target a consumer authenticates as
    where:
      - "node_class(?secret) == Secret"
      - "node_class(?identity) == Identity"
      - "?principal has EFFECTIVE secretsmanager:PutSecretValue OR secretsmanager:UpdateSecret on ?secret"
    emit:
      source: ?secret
      target: ?identity
      permissions: ["secretsmanager:PutSecretValue", "secretsmanager:UpdateSecret"]
      conditions: [iam_permission, consumer_refetch]
      state_logic: >-
        CONDITIONAL(consumer_refetch) — the write itself is ACTIVE (the explicit
        CanModifyConfiguration edge), but the poisoning only yields access once a
        downstream consumer refetches the secret and authenticates with the planted
        credential; until an evidenced consumer exists, this stays CONDITIONAL. BLOCKED
        on an SCP/resource-policy Deny of PutSecretValue/UpdateSecret.
      confidence: "min(contributing_confidences) * 0.8"
      derived_from: [ "<CanModifyConfiguration(PutSecretValue) edge_id>", "<CredentialsFor edge_id>" ]
      false_positive_note: >-
        A write is credential POISONING, not a read: it does NOT reveal the existing
        value, so do not chain it to read-secret-yields-identity (that needs
        CanReadSecret). It only yields access if some downstream consumer refetches and
        trusts the attacker-planted credential -> CONDITIONAL(consumer_refetch) unless
        a consuming resource (ContainsSecret/ContainsResourceReference pointing at this
        secret) is evidenced. Secrets Manager encrypts on write using the secret's key
        policy (which grants the service kms:GenerateDataKey/Encrypt), so the writer
        does NOT need kms:Encrypt themselves. Emit only when CredentialsFor is
        evidenced; a poisoned GenericSecret with no known consumer authenticates
        nothing.
      narrative: >-
        {principal.name} can overwrite the value of {secret.name}
        (secretsmanager:PutSecretValue), planting a credential for {identity.name} that
        any consumer refetching the secret will trust.

  # --- 7) Rotation-Lambda takeover: handled by Lambda, NOT re-derived here ----
  # REMOVED: this rule previously emitted CanExecuteAs(?principal -> ?rotation_role)
  # from [?principal, CanModifyCode, ?rotation_fn] + [?rotation_fn, ExecutesAs,
  # ?role] — which is EXACTLY aws-lambda-execute-as-via-code (Phase 4). Re-emitting
  # it here double-derived the same CanExecuteAs edge from two rules with different
  # provenance/priors. The secretsmanager service does NOT own the code-control
  # primitive (§5 of the provider doc says so). The Lambda rule owns the
  # CanModifyCode -> ExecutesAs -> CanExecuteAs derivation.
  #
  # This service contributes only:
  #   1. the rotation-binding fact (ContainsResourceReference Compute->Secret) via
  #      aws-secretsmanager-rotation-binding in the explicit file, and
  #   2. the on-demand rotation trigger — the caller's secretsmanager:RotateSecret
  #      permission, modeled as an EXPLICIT CanInvoke(Identity -> rotation Lambda)
  #      via aws-secretsmanager-rotate-invoke in the explicit file (CanInvoke is
  #      nature: explicit; source [Identity], target [ServerlessFunction] — a Secret
  #      is NOT a valid CanInvoke/CanTrigger source, so this is keyed off the
  #      principal, not the secret).
  # The Lambda execute-as rule then consumes that CanInvoke as its run-path optional,
  # completing the chain without a duplicate CanExecuteAs emit here.

  # --- 8) Escalation roll-up (strictly-more-privileged only) ----------------
  - id: aws-secretsmanager-credentials-for-escalation
    emits: CanEscalateTo
    description: "Reading a secret that is credentials for a strictly-more-privileged identity is escalation."
    match:
      - [ ?principal, CanReadSecret,  ?secret ]
      - [ ?secret,    CredentialsFor, ?identity ]
    where:
      - "node_class(?secret) == Secret"
      - "node_class(?identity) == Identity"
      - "privilege(?identity) > privilege(?principal)"
    emit:
      source_type: Identity
      target_type: Identity
      source: ?principal
      target: ?identity
      permissions: ["secretsmanager:GetSecretValue"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        inherit_weakest(CanReadSecret, CredentialsFor): a CONDITIONAL(key_permission)
        read (CMK not yet decryptable) yields CONDITIONAL(key_permission); BLOCKED if
        the read is BLOCKED; else ACTIVE. This is a service-local convenience roll-up;
        the canonical path is read-secret-yields-identity -> impersonate-is-escalation
        in credential-chains.yaml. Deduplicate against that collapsed edge.
      confidence: "min(contributing_confidences)"
      derived_from: [ "<CanReadSecret edge_id>", "<CredentialsFor edge_id>" ]
      false_positive_note: >-
        Emit ONLY when ?identity is STRICTLY more privileged than ?principal; a lateral
        same-privilege credential is access, not escalation. CredentialsFor must be an
        evidenced link (managed DB secret, IAM key material, bound client secret), not
        a secret the identity merely owns. Honor the key_permission gate — do not
        report ACTIVE escalation off a CMK-gated read until decrypt is proven.
        DEDUP: this is a service-local convenience roll-up of the canonical
        read-secret-yields-identity -> impersonate-is-escalation collapse in
        credential-chains.yaml; both emit CanEscalateTo(?principal -> ?identity).
        The evaluator MUST dedup by (type,source,target,scope) so the same escalation
        edge is materialized once (RULE-FORMAT monotonic+deduped). If the canonical
        collapse already produced the edge, this rule is a no-op re-derivation.
      narrative: >-
        {principal.name} can read {secret.name}, which holds credentials for the
        more-privileged {identity.name}; reading it lets {principal.name} escalate to
        {identity.name}.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - SCP / permission boundary / resource-policy Deny on
#    secretsmanager:GetSecretValue -> CanReadSecret BLOCKED -> whole chain BLOCKED.
#  - Key-policy / SCP Deny on kms:Decrypt for the wrapping CMK -> a CMK-gated read
#    stays CONDITIONAL(key_permission), never upgraded to ACTIVE.
#  - Deny on secretsmanager:PutResourcePolicy blocks the self-grant rule;
#    Deny on secretsmanager:PutSecretValue/UpdateSecret blocks the tamper rule.
#  - A rotated/disabled/deleted credential -> adapter must not emit CredentialsFor
#    -> escalation/impersonation rules do not fire.
# ---------------------------------------------------------------------------
# NOT-YET-MODELED (future work):
#  - KmsKeyId re-point via secretsmanager:UpdateSecret (provider doc §6): the write
#    can re-point the secret's KmsKeyId so FUTURE values are encrypted under an
#    attacker-chosen CMK the attacker holds kms:Decrypt on — a distinct primitive
#    (the attacker gains decrypt over subsequent versions) separate from value
#    tamper. Would derive a CanReadSecret upgrade (via decrypt-gates-secret-read)
#    on the next write. No rule models this today; the explicit
#    aws-secretsmanager-can-modify-value edge (PutSecretValue/UpdateSecret) is the
#    contributing capability. Track for a follow-up derived rule.
# ---------------------------------------------------------------------------

# Explicit normalization for this service lives in
# /rules/explicit/aws-secretsmanager.yaml (CanReadSecret from GetSecretValue,
# CredentialsFor, ContainsSecret, CrossAccountTrust, CanModifyPolicy,
# CanModifyConfiguration, the KmsKeyId wrapping link, rotation binding).
