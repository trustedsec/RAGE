# AWS Firewall Manager — Derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# Firewall Manager is a POLICY-MANAGEMENT-PLANE service: it centrally enforces
# WAF, Shield Advanced, VPC Security Group, Network Firewall, and Route 53
# Resolver DNS Firewall policies across all member accounts in an AWS Organization.
# It runs no customer code, uses no customer-supplied execution role, and exposes
# no data-plane with credential material.
#
# ATTACK SURFACE CLASSIFICATION: LOW (single rule)
# The sole security-relevant attack primitive is:
#
#   DEFENSE EVASION (dominant mode) — fms:PutPolicy or fms:DeletePolicy on an
#   existing FMS policy overwrites or destroys org-wide firewall/WAF/Shield/SG/
#   Network Firewall enforcement across every in-scope member account simultaneously.
#   This is a high-blast-radius cover-tracks / weaken-defenses primitive.
#   Emit: CanModifyConfiguration on the SecurityService (FMS Policy) node.
#   Do NOT chain to CanEnterAccount, CanExecuteAs, or any escalation edge.
#   Detective controls do NOT produce BLOCKED state — only preventive guardrails
#   (SCPs, deny assignments, permission boundaries) do.
#
# WHAT THIS FILE DOES NOT EMIT (and why):
#   - CanExecuteAs: FMS has no customer-accessible execution identity.
#   - CanEnterAccount: corrupting an org-wide policy weakens controls in member
#     accounts but does NOT grant a session or credentials inside them.
#   - CanReadSecret / ExposesCredential: FMS policy objects contain firewall rule
#     configuration, not credential material.
#   - CanReadData: FMS compliance reports are policy-state metadata, not secret data.
#
# LINCHPINS — this file does NOT re-derive roll-ups. These linchpins are not
# applicable to the FMS evasion-only surface:
#   /rules/derived/can-execute-as.yaml   (no execution surface)
#   /rules/derived/can-control.yaml      (evasion only, not resource control)
#   /rules/derived/credential-chains.yaml (no credential exposure)
#   /rules/derived/cicd-chains.yaml      (no CI/CD execution surface)
#
# Official docs: https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html
# IAM reference: https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsfirewallmanager.html
# ---------------------------------------------------------------------------

provider: aws
phase: 12-security-logging
applies_to: [aws]

rules:

  # --- Modify FMS policy -> org-wide defense evasion (non-destructive) --------
  # fms:PutPolicy allows overwriting an existing policy with empty/permissive rules
  # or setting RemediationEnabled=false, disabling enforcement without deleting.
  - id: aws-fms-modify-policy
    emits: CanModifyConfiguration
    description: >-
      A principal with fms:PutPolicy can overwrite an existing Firewall Manager
      policy with an empty or permissive rule set, or set RemediationEnabled=false,
      disabling org-wide enforcement of WAF/Shield/Security Group/Network Firewall/
      DNS Firewall controls across all in-scope member accounts — a high-blast-radius
      defense-evasion / cover-tracks primitive. The policy object persists;
      enforcement is weakened but not destroyed.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?fms_policy ]
    where:
      - "node_type(?fms_policy) == SecurityService"
      - "?fms_policy.provider_type == 'AWS::FMS::Policy'"
      - "effective_permission(?principal, ?fms_policy) contains 'fms:PutPolicy'"
      - "?principal.account == ?fms_policy.admin_account_id"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?fms_policy
      permissions:
        - "fms:PutPolicy"
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when principal holds effective fms:PutPolicy permission on the target
        policy ARN AND principal.account matches the policy's admin_account_id.
        BLOCKED when an SCP or permission boundary explicitly denies fms:PutPolicy.
        CONDITIONAL(service_state) if admin_account_id is not populated during collection.
      confidence: 0.90
      derived_from:
        - "HasPermission(?principal, ?fms_policy) [fms:PutPolicy]"
      false_positive_note: >-
        This is a DEFENSE EVASION primitive only. Overwriting a Firewall Manager
        policy weakens org-wide preventive firewall/WAF/Shield/Network Firewall
        enforcement; it does NOT grant a session, credentials, or IAM permissions in
        any member account. Do NOT chain this edge to CanEnterAccount, CanExecuteAs,
        CanEscalateTo, or any escalation edge.

        Scope guard: fms:PutPolicy is only effective from the designated FMS
        administrator account — the same action from a non-admin account is rejected
        by the FMS service. Confirm ?principal.account == ?fms_policy.admin_account_id
        before emitting ACTIVE; downgrade to CONDITIONAL(service_state) if admin
        account designation is unknown at collection time.

        Weaker variant: fms:PutPolicy with only RemediationEnabled=false stops
        auto-remediation but leaves existing resource-level rules intact (member
        accounts can drift out of compliance but are not actively reconfigured).
        If collection detects RemediationEnabled=false is toggled without rule
        mutation, downgrade confidence to 0.80 in the edge evidence record.
      narrative: >-
        {principal.name} can overwrite the Firewall Manager policy {fms_policy.name}
        (fms:PutPolicy), which enforces {fms_policy.PolicyType} rules across all
        in-scope AWS accounts in the organization. Replacing the policy with an
        empty or permissive rule set — or setting RemediationEnabled=false — disables
        org-wide preventive firewall/WAF/Shield/Network Firewall/DNS Firewall
        enforcement in every member account in scope. This is a high-blast-radius
        defense-evasion / cover-tracks primitive that weakens preventive controls
        at organizational scale. It grants no resource access, credentials, or
        execution sessions in any member account.

  # --- Delete FMS policy -> permanent org-wide defense evasion ----------------
  # fms:DeletePolicy permanently removes a policy, stopping all enforcement.
  - id: aws-fms-delete-policy
    emits: CanDelete
    description: >-
      A principal with fms:DeletePolicy can permanently delete an existing Firewall
      Manager policy, eliminating org-wide enforcement of WAF/Shield/Security Group/
      Network Firewall/DNS Firewall controls across all in-scope member accounts.
      This is an irreversible destructive action with maximum blast radius.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?fms_policy ]
    where:
      - "node_type(?fms_policy) == SecurityService"
      - "?fms_policy.provider_type == 'AWS::FMS::Policy'"
      - "effective_permission(?principal, ?fms_policy) contains 'fms:DeletePolicy'"
      - "?principal.account == ?fms_policy.admin_account_id"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?fms_policy
      permissions:
        - "fms:DeletePolicy"
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when principal holds effective fms:DeletePolicy permission on the
        target policy ARN AND principal.account matches the policy's admin_account_id.
        BLOCKED when an SCP or permission boundary explicitly denies fms:DeletePolicy.
        CONDITIONAL(service_state) if admin_account_id is not populated during collection.
      confidence: 0.95
      derived_from:
        - "HasPermission(?principal, ?fms_policy) [fms:DeletePolicy]"
      false_positive_note: >-
        This is a DESTRUCTIVE COVER-TRACKS primitive only — permanent removal with
        maximum organizational impact. Deleting a policy does NOT grant a session,
        credentials, or IAM permissions in any member account. Do NOT chain this edge
        to CanEnterAccount, CanExecuteAs, CanEscalateTo, or any escalation edge.

        Scope guard: fms:DeletePolicy is only effective from the designated FMS
        administrator account — the same action from a non-admin account is rejected
        by the FMS service. Confirm ?principal.account == ?fms_policy.admin_account_id
        before emitting ACTIVE; downgrade to CONDITIONAL(service_state) if admin
        account designation is unknown at collection time.

        Higher impact than fms:PutPolicy: Deletion is permanent and stops all
        enforcement immediately, whereas PutPolicy allows an attacker to leave the
        policy in place (and thus discoverable) while gutting its rules. DeletePolicy
        is the strongest evasion action.
      narrative: >-
        {principal.name} can permanently delete the Firewall Manager policy
        {fms_policy.name} (fms:DeletePolicy), eliminating org-wide {fms_policy.PolicyType}
        enforcement from all in-scope accounts ({policy_scope}). This is an
        irreversible destructive cover-tracks action that eliminates a preventive
        control at organizational scale. It does NOT grant resource access,
        credentials, or execution sessions in any member account.

  # --- Tamper notification channel -> alert suppression (weaker evasion) ------
  # fms:PutNotificationChannel replaces the SNS notification destination, suppressing
  # FMS compliance alerts to the original channel. Weaker than policy deletion (alerts
  # silenced but enforcement continues), but still a significant evasion primitive.
  - id: aws-fms-tamper-notification-channel
    emits: CanModifyConfiguration
    description: >-
      A principal with fms:PutNotificationChannel can replace the SNS topic that
      receives FMS compliance notifications, redirecting or suppressing alerts about
      policy violations. This silences detective coverage without removing enforcement.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?fms_service ]
    where:
      - "node_type(?fms_service) == SecurityService"
      - "?fms_service.provider_type == 'AWS::FMS::NotificationChannel'"
      - "effective_permission(?principal, ?fms_service) contains 'fms:PutNotificationChannel'"
      - "?principal.account == ?fms_service.admin_account_id"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?fms_service
      permissions:
        - "fms:PutNotificationChannel"
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when principal holds effective fms:PutNotificationChannel AND
        principal.account matches the FMS admin account. BLOCKED when an SCP or
        permission boundary denies fms:PutNotificationChannel. CONDITIONAL(service_state)
        if admin account is unknown.
      confidence: 0.80
      derived_from:
        - "HasPermission(?principal, ?fms_service) [fms:PutNotificationChannel]"
      false_positive_note: >-
        This is a SECONDARY EVASION primitive — it silences detective alerts but
        does NOT remove preventive enforcement. Compliance violations remain and can
        be discovered via fms:ListComplianceStatus; the attacker simply suppresses
        the SNS notification that would alert operators. This is weaker than policy
        tampering and does NOT grant resource access or IAM permissions. Do NOT chain
        to CanEnterAccount, CanExecuteAs, or CanEscalateTo. Lowered confidence (0.80)
        reflects secondary nature (alerts suppressed but enforcement persists).
      narrative: >-
        {principal.name} can replace the SNS notification channel for Firewall
        Manager compliance alerts (fms:PutNotificationChannel). This silences
        notifications of FMS policy violations across all in-scope accounts, enabling
        evasion from detective tooling while preventive controls remain active in
        member accounts.

  # --- Delete notification channel -> alert suppression (destructive variant) --
  # fms:DeleteNotificationChannel permanently removes the SNS notification channel.
  - id: aws-fms-delete-notification-channel
    emits: CanDelete
    description: >-
      A principal with fms:DeleteNotificationChannel can permanently remove the SNS
      topic that receives FMS compliance notifications, creating an irreversible
      silent-running state for FMS enforcement.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?fms_service ]
    where:
      - "node_type(?fms_service) == SecurityService"
      - "?fms_service.provider_type == 'AWS::FMS::NotificationChannel'"
      - "effective_permission(?principal, ?fms_service) contains 'fms:DeleteNotificationChannel'"
      - "?principal.account == ?fms_service.admin_account_id"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?fms_service
      permissions:
        - "fms:DeleteNotificationChannel"
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when principal holds effective fms:DeleteNotificationChannel AND
        principal.account matches the FMS admin account. BLOCKED when an SCP or
        permission boundary denies fms:DeleteNotificationChannel. CONDITIONAL(service_state)
        if admin account is unknown.
      confidence: 0.85
      derived_from:
        - "HasPermission(?principal, ?fms_service) [fms:DeleteNotificationChannel]"
      false_positive_note: >-
        This is a SECONDARY EVASION primitive — destructive variant of channel
        tampering. Deletion is permanent and removes the SNS destination, but like
        PutNotificationChannel, it silences alerts without removing preventive
        enforcement. Compliance violations remain discoverable; the attacker simply
        suppresses notifications. This does NOT grant resource access or IAM
        permissions. Do NOT chain to CanEnterAccount, CanExecuteAs, or CanEscalateTo.
        Confidence (0.85) is higher than Put-variant (0.80) due to clear destructive
        intent, but lower than policy deletion due to weaker impact (enforcement
        persists).
      narrative: >-
        {principal.name} can permanently delete the SNS notification channel for
        Firewall Manager (fms:DeleteNotificationChannel), creating an irreversible
        silent-running state. FMS compliance violations remain enforced but
        undetected by alerting operators across all in-scope accounts.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - An SCP or permission boundary denying fms:PutPolicy, fms:DeletePolicy,
#     fms:PutNotificationChannel, and/or fms:DeleteNotificationChannel at the
#     effective scope -> emit the edge with state: BLOCKED and
#     denied_by=<SCP arn/statement>.
#   - The FMS service-linked role (AWSServiceRoleForFMS) is AWS-managed and NOT
#     customer-assumable. Do not model it as a CanPassIdentity / CanExecuteAs target.
#   - fms:DisassociateAdminAccount is only callable from the Organizations management
#     account, not from the FMS administrator account itself; do not model as a
#     capability of FMS administrator principals unless they are also the Org management
#     account. If modeled in future phases, emit CanDelete on a GenericManagement node
#     representing the FMS admin account designation (high-impact org-wide evasion).
#   - fms:PutAdminAccount (AWS 2023+) designates additional FMS administrator accounts
#     with org-unit-scoped authority. Callable only from the Organizations management
#     account; can be used to create a stepping stone to fms:PutPolicy/fms:DeletePolicy
#     in a compromised FMS admin account. Not yet modeled in derived rules; future work
#     should add CanGrantPermission (Org management -> FMS admin node) or note in
#     existing rule comments.
# ---------------------------------------------------------------------------
