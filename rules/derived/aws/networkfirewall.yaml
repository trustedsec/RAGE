# AWS Network Firewall — Derived attack-path rules (Phase 8 — networking)
# ---------------------------------------------------------------------------
# Network Firewall is a DEFENSE-EVASION-only service in this corpus. Its
# entire attack-path surface is the ability to weaken or remove L3/L4/L7
# stateless and stateful traffic filtering from VPC traffic paths.
#
# WHAT THESE RULES EMIT:
#   - CanModifyConfiguration(Identity -> Firewall) for:
#       (1) network-firewall:UpdateFirewallPolicy — modify the FirewallPolicy object
#           directly to change rule group references or default action.
#       (2) network-firewall:AssociateFirewallPolicy — swap the policy applied to
#           a Firewall instance (subject to UpdateFirewallPolicyChangeProtection flag).
#       (3) network-firewall:UpdateRuleGroup / DeleteRuleGroup — corrupt or remove
#           the 5-tuple/Suricata rules inside a rule group that is referenced by
#           one or more firewall policies. Blast radius scales with the number of
#           policies (and accounts, if RAM-shared) that reference the group.
#       (4) network-firewall:UpdateLoggingConfiguration — disable logging to
#           CloudWatch Logs, S3, or Kinesis Firehose (cover tracks).
#
# WHAT THESE RULES DO NOT EMIT (and why):
#   - CanExecuteAs / CanEscalateTo: Network Firewall has no customer-supplied
#     execution identity. The AWS service-linked role is not customer-assumable.
#   - CanEnterAccount: weakening firewall rules opens a traffic path; it does NOT
#     grant IAM credentials, sessions, or any control-plane access in the account.
#   - CanNetworkReach / CanReachPort: end-to-end reachability (firewall bypass +
#     VPC route + security group) is the FUTURE network-chains linchpin. Emit the
#     atomic CanModifyConfiguration FACT here; network composition is deferred.
#   - ExposesCredential / CanReadSecret: firewall policy/rule objects contain
#     traffic-filtering rules, not credential material.
#   - CanDelete: DeleteFirewall and DeleteFirewallPolicy are destructive (impact)
#     edges, not escalation edges. Excluded from default traversal by CanDelete's
#     schema walkable:false setting. Not emitted here; model in explicit layer if
#     needed for impact analysis.
#
# NARRATIVE FRAMING: each emitted edge should appear in the UI as a
# "weaken-controls / defense-evasion" step, NOT as privilege escalation.
#
# PERMISSIONS are exact network-firewall IAM action names from the AWS Service
# Authorization Reference:
#   https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsnetworkfirewall.html
#   https://docs.aws.amazon.com/network-firewall/latest/developerguide/security-iam.html
#
# NODE CLASS CONFORMANCE (schema/nodes.yaml + schema/edges.yaml):
#   Firewalls, FirewallPolicies, and RuleGroups map to the Network class,
#   generic_type: Firewall.
#   CanModifyConfiguration source: [Identity] — conforms.
#   CanModifyConfiguration target: [Compute, Messaging, Network, "*"] — conforms
#     (Network class is explicitly listed; Firewall is a subtype of Network).
#
# BLOCKED-edge guidance (applies to both rules):
#   - An SCP or permission boundary denying network-firewall:UpdateFirewallPolicy,
#     network-firewall:AssociateFirewallPolicy, network-firewall:UpdateRuleGroup,
#     or network-firewall:DeleteRuleGroup at the effective scope -> emit the
#     relevant edge with state: BLOCKED and denied_by=<SCP ARN/statement>.
#   - UpdateFirewallPolicyChangeProtection=true on the firewall prevents policy
#     swaps (AssociateFirewallPolicy) but not direct UpdateFirewallPolicy edits.
#     Downgrade AssociateFirewallPolicy contribution to CONDITIONAL(service_state)
#     when the protection flag is set and the principal cannot toggle it.
#   - An FMS-managed FirewallPolicy is auto-remediated: treat direct IAM
#     UpdateFirewallPolicy on an FMS-controlled policy as CONDITIONAL(service_state)
#     or BLOCKED when FMS auto-remediation is confirmed active.
# ---------------------------------------------------------------------------

provider: aws
phase: 8-networking
applies_to: [aws]

rules:

  # ---------------------------------------------------------------------------
  # 1. Weaken or directly modify a Firewall Policy
  # ---------------------------------------------------------------------------
  # UpdateFirewallPolicy:   Modify the stateless/stateful rule group references
  #   and the default action on an existing policy (default action PASS on
  #   all unmatched traffic effectively opens the firewall). Removing blocking
  #   rule group references from the policy is equally effective.
  #   NOTE: UpdateFirewallPolicy modifies the FirewallPolicy object directly
  #   and is unaffected by the UpdateFirewallPolicyChangeProtection flag on the
  #   Firewall node. This rule targets FirewallPolicy nodes only.
  - id: aws-networkfirewall-weaken-policy-update
    emits: CanModifyConfiguration
    description: >-
      Modify the firewall policy directly (change default action to PASS, remove
      blocking rule groups), weakening or eliminating VPC traffic filtering
      (defense evasion).
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?policy ]
    where:
      - "node_type(?policy) == Firewall"
      - "?policy.provider_type == 'AWS::NetworkFirewall::FirewallPolicy'"
      - >-
        effective_action_on(?principal, ?policy) intersects
        ['network-firewall:UpdateFirewallPolicy']
    emit:
      source_type: Identity
      target_type: Firewall
      source: ?principal
      target: ?policy
      permissions:
        - "network-firewall:UpdateFirewallPolicy"
      conditions: [iam_permission, scp_or_org_policy, service_state]
      state_logic: >-
        ACTIVE when the effective-permission evaluator confirms
        network-firewall:UpdateFirewallPolicy on the FirewallPolicy ARN and the
        target policy is not managed by AWS Firewall Manager with auto-remediation active.
        BLOCKED if an SCP or permission boundary denies the action on the policy ARN.
        CONDITIONAL(service_state) if the target policy is managed by AWS Firewall
        Manager and FMS auto-remediation is confirmed active.
      confidence: 0.90
      derived_from:
        - "HasPermission(?principal, ?policy) [network-firewall:UpdateFirewallPolicy]"
      false_positive_note: >-
        This is a DEFENSE-EVASION primitive only. Modifying a firewall policy
        changes which traffic the Network Firewall allows or blocks; it does NOT
        grant access to any resource behind the firewall, nor does it yield IAM
        credentials or execution sessions. Do NOT chain this edge to CanEnterAccount,
        CanExecuteAs, CanNetworkReach, or CanEscalateTo.

        End-to-end network reachability (policy weakened + VPC route routes through
        the firewall endpoint + target SG permits traffic) is the FUTURE network-chains
        linchpin. Emit CanModifyConfiguration (this FACT) now; the composition is deferred.

        Scope guards:
        - network-firewall:UpdateFirewallPolicy targets a FirewallPolicy ARN.
        - UpdateFirewallPolicyChangeProtection (a Firewall node property) does NOT
          block UpdateFirewallPolicy — it modifies the policy object directly.
        - FMS-managed policies: AWS Firewall Manager auto-remediates out-of-band
          changes to FMS-controlled policies within seconds. In environments with
          active FMS management, the practical window for persistence is negligible;
          downgrade to CONDITIONAL(service_state) or BLOCKED when FMS auto-remediation
          is confirmed active.
      narrative: >-
        {principal.name} can modify the firewall policy {policy.name}
        (network-firewall:UpdateFirewallPolicy), changing rule group references or
        the default traffic action to allow previously-blocked traffic. An attacker
        can set the default action to aws:pass or remove DROP/REJECT rule group
        references, silently opening network paths through the VPC firewall without
        disrupting its operational presence. This is a weaken-controls / defense-evasion
        action, not an access grant.

  # ---------------------------------------------------------------------------
  # 2. Swap a Firewall Policy on a Firewall instance
  # ---------------------------------------------------------------------------
  # AssociateFirewallPolicy: Replace the policy currently applied to a Firewall
  #   with a different (possibly permissive or empty) policy that the attacker
  #   controls. This does NOT modify the original protective policy; it just
  #   detaches it from the firewall instance.
  #   NOTE: This action IS subject to the UpdateFirewallPolicyChangeProtection flag.
  #   If set to true on the Firewall and the principal cannot toggle it, the
  #   association will fail with 403 Forbidden. This rule targets Firewall nodes only.
  - id: aws-networkfirewall-swap-policy
    emits: CanModifyConfiguration
    description: >-
      Swap the policy associated with a firewall to a permissive alternative,
      weakening or eliminating VPC traffic filtering (defense evasion).
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?firewall ]
    where:
      - "node_type(?firewall) == Firewall"
      - "?firewall.provider_type == 'AWS::NetworkFirewall::Firewall'"
      - >-
        effective_action_on(?principal, ?firewall) intersects
        ['network-firewall:AssociateFirewallPolicy']
    emit:
      source_type: Identity
      target_type: Firewall
      source: ?principal
      target: ?firewall
      permissions:
        - "network-firewall:AssociateFirewallPolicy"
      conditions: [iam_permission, scp_or_org_policy, service_state]
      state_logic: >-
        ACTIVE when the effective-permission evaluator confirms
        network-firewall:AssociateFirewallPolicy on the Firewall ARN AND the Firewall
        does NOT have UpdateFirewallPolicyChangeProtection set to true (or the
        principal can toggle it via network-firewall:UpdateFirewallPolicyChangeProtection).
        CONDITIONAL(service_state) if UpdateFirewallPolicyChangeProtection is true
        on the target Firewall AND the principal does NOT also hold
        network-firewall:UpdateFirewallPolicyChangeProtection — the association will
        fail with 403 Forbidden by the API in that state.
        BLOCKED if an SCP or permission boundary denies the matching action(s).
      confidence: 0.90
      derived_from:
        - "HasPermission(?principal, ?firewall) [network-firewall:AssociateFirewallPolicy]"
      false_positive_note: >-
        This is a DEFENSE-EVASION primitive only. Swapping a firewall policy changes
        which traffic the Network Firewall allows or blocks; it does NOT grant access
        to any resource behind the firewall, nor does it yield IAM credentials or
        execution sessions. Do NOT chain this edge to CanEnterAccount, CanExecuteAs,
        CanNetworkReach, or CanEscalateTo.

        End-to-end network reachability (policy weakened + VPC route routes through
        the firewall endpoint + target SG permits traffic) is the FUTURE network-chains
        linchpin. Emit CanModifyConfiguration (this FACT) now; the composition is deferred.

        Scope guards:
        - network-firewall:AssociateFirewallPolicy targets a Firewall ARN and requires
          the caller to also reference a replacement policy ARN; the replacement policy
          must exist and be accessible.
        - UpdateFirewallPolicyChangeProtection=true blocks AssociateFirewallPolicy
          (403 from the API). If the principal holds only AssociateFirewallPolicy and
          the flag is set (and the principal cannot clear it), downgrade to
          CONDITIONAL(service_state).
      narrative: >-
        {principal.name} can swap the policy associated with the firewall {firewall.name}
        (network-firewall:AssociateFirewallPolicy), replacing it with a permissive
        policy without disrupting the firewall's operational presence. An attacker can
        apply a policy with default action PASS or remove blocking rule groups,
        silently opening network paths through the VPC firewall. This is a
        weaken-controls / defense-evasion action, not an access grant.

  # ---------------------------------------------------------------------------
  # 3. Corrupt or delete a Rule Group
  # ---------------------------------------------------------------------------
  # UpdateRuleGroup:  Modify the 5-tuple or Suricata rules inside a customer-managed
  #   rule group. An attacker can remove DROP/REJECT rules for specific source/
  #   destination/port combinations, effectively creating allow holes for traffic
  #   that was previously blocked. The change propagates to ALL firewall policies
  #   that reference the rule group — blast radius scales with reuse and cross-account
  #   RAM sharing.
  #
  # DeleteRuleGroup:  Removes the rule group entirely. Any firewall policy that
  #   references the group will lose those rules on the next policy evaluation cycle.
  #   The API refuses to delete a rule group that is still referenced by one or more
  #   policies (returns ResourceNotFoundException / ConflictException). The attacker
  #   must first remove all policy references (UpdateFirewallPolicy) before deleting.
  #   Modeled as CanModifyConfiguration (same edge) rather than CanDelete because the
  #   escalation-relevant primitive is weakening the rule set, not the destructive act.
  #
  # STATE: ACTIVE when effective permission is confirmed.
  #   DeleteRuleGroup: CONDITIONAL(service_state) if the group is still referenced by
  #     active policies and the principal does NOT also hold UpdateFirewallPolicy to
  #     remove the references first. The delete will fail with a ConflictException
  #     in that state.
  - id: aws-networkfirewall-weaken-rule-group
    emits: CanModifyConfiguration
    description: >-
      Modify or delete a customer-managed Network Firewall rule group to remove or
      corrupt 5-tuple/Suricata DROP/REJECT rules, opening traffic paths across all
      firewall policies that reference the group (defense evasion; blast radius
      scales with rule group reuse and RAM sharing).
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?rulegroup ]
    where:
      - "node_type(?rulegroup) == Firewall"
      - "?rulegroup.provider_type in ['AWS::NetworkFirewall::RuleGroup']"
      - >-
        effective_action_on(?principal, ?rulegroup) intersects
        ['network-firewall:UpdateRuleGroup',
         'network-firewall:DeleteRuleGroup']
      - "?rulegroup.managed_by != 'AWS'"
    emit:
      source_type: Identity
      target_type: Firewall
      source: ?principal
      target: ?rulegroup
      permissions:
        - "network-firewall:UpdateRuleGroup"
        - "network-firewall:DeleteRuleGroup"
      conditions: [iam_permission, scp_or_org_policy, service_state]
      state_logic: >-
        ACTIVE when network-firewall:UpdateRuleGroup is confirmed effective on the
        rule group ARN.
        CONDITIONAL(service_state) for network-firewall:DeleteRuleGroup if the group
        is currently referenced by one or more active firewall policies AND the
        principal does NOT also hold network-firewall:UpdateFirewallPolicy to remove
        the references first — deletion will fail with ConflictException in that state.
        BLOCKED if an SCP or permission boundary denies the action(s) on the rule group
        ARN.
      confidence: 0.90
      derived_from:
        - "HasPermission(?principal, ?rulegroup) [network-firewall:UpdateRuleGroup OR network-firewall:DeleteRuleGroup]"
      false_positive_note: >-
        Customer-managed rule groups ONLY. AWS-managed rule groups (e.g., those
        provided by AWS Managed Threat Intelligence feeds via the Network Firewall
        console) cannot be updated or deleted via customer IAM actions — do not emit
        for those. Guard: check ?rulegroup.managed_by != 'AWS'.

        This is a DEFENSE-EVASION primitive only. Removing DROP rules from a rule
        group or deleting the group opens traffic paths that were previously blocked;
        it does NOT grant access to the resources receiving that traffic, nor does it
        yield IAM credentials or execution sessions. Do NOT chain to CanEnterAccount,
        CanExecuteAs, CanNetworkReach, or CanEscalateTo.

        Blast radius: a rule group referenced by N policies in M accounts (via RAM)
        is a higher-priority finding. Note reuse count in evidence metadata; do not
        spawn separate edges per consuming policy (path-finding handles fan-out).

        DeleteRuleGroup vs. UpdateRuleGroup: deletion is the louder, more disruptive
        action (and fails if the group is still referenced by policies); UpdateRuleGroup
        is the stealthier tactic (group stays present, rules are quietly neutered).
        Both map to the same CanModifyConfiguration edge type at the same confidence.

        RAM-shared rule groups: if the rule group was shared from another account via
        RAM and the principal holds network-firewall:UpdateRuleGroup on the shared ARN
        (confirmed by the resource policy), the blast radius spans the originating
        account and all RAM consumers. Note this in evidence but emit a single edge
        to the rule group node.
      narrative: >-
        {principal.name} can modify or delete the rule group {rulegroup.name}
        (network-firewall:UpdateRuleGroup / network-firewall:DeleteRuleGroup).
        Every firewall policy that references this rule group — potentially across
        multiple firewalls and accounts (if RAM-shared) — would lose or have corrupted
        the 5-tuple or Suricata rules it provides, silently opening previously-blocked
        traffic paths through the associated VPC firewalls. This is a
        weaken-controls / defense-evasion action, not an access grant.

  # ---------------------------------------------------------------------------
  # 4. Disable Firewall logging (cover tracks)
  # ---------------------------------------------------------------------------
  # UpdateLoggingConfiguration: Modifies the logging configuration for a firewall,
  #   allowing an attacker to disable delivery of flow logs and alert logs to
  #   CloudWatch Logs, S3, or Kinesis Firehose. Disabling logging is a critical
  #   defense-evasion / cover-tracks primitive, removing evidence of network
  #   connections, intrusion attempts, and firewall-rule changes.
  #   NOTE: This acts on the Firewall node itself, not the FirewallPolicy.
  - id: aws-networkfirewall-disable-logging
    emits: CanModifyConfiguration
    description: >-
      Disable or modify the firewall's logging configuration, removing evidence
      of network traffic inspection, rule violations, and IPS alerts (cover tracks).
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?firewall ]
    where:
      - "node_type(?firewall) == Firewall"
      - "?firewall.provider_type == 'AWS::NetworkFirewall::Firewall'"
      - >-
        effective_action_on(?principal, ?firewall) intersects
        ['network-firewall:UpdateLoggingConfiguration']
    emit:
      source_type: Identity
      target_type: Firewall
      source: ?principal
      target: ?firewall
      permissions:
        - "network-firewall:UpdateLoggingConfiguration"
      conditions: [iam_permission, scp_or_org_policy]
      state_logic: >-
        ACTIVE when the effective-permission evaluator confirms
        network-firewall:UpdateLoggingConfiguration on the Firewall ARN.
        BLOCKED if an SCP or permission boundary denies the action on the firewall ARN.
      confidence: 0.85
      derived_from:
        - "HasPermission(?principal, ?firewall) [network-firewall:UpdateLoggingConfiguration]"
      false_positive_note: >-
        This is a COVER-TRACKS / DEFENSE-EVASION primitive. Disabling firewall logging
        removes flow logs and alert logs but does NOT alter firewall filtering rules
        or grant access to resources behind the firewall. The attacker must already
        have network access to a target; this action only removes the evidence trail.
        Confidence 0.85 (effect is operational evasion, not rule-set weakening).

        Do NOT chain this edge to CanEnterAccount, CanExecuteAs, CanNetworkReach,
        or CanEscalateTo.

        Scope guards:
        - network-firewall:UpdateLoggingConfiguration targets a Firewall ARN.
        - This action disables flow log and alert log delivery to CloudWatch Logs,
          S3, or Kinesis Firehose; VPC Flow Logs (ec2:*) are separate and not affected
          by Network Firewall logging configuration.
      narrative: >-
        {principal.name} can modify the logging configuration for the firewall
        {firewall.name} (network-firewall:UpdateLoggingConfiguration), disabling
        delivery of flow logs and alert logs to CloudWatch Logs, S3, or Kinesis
        Firehose. An attacker can silently erase evidence of network traffic
        inspection, IPS rule violations, and firewall-rule-change audit trails,
        covering their tracks in a defense-evasion attack. This is a cover-tracks
        action, not a rule-weakening action.
