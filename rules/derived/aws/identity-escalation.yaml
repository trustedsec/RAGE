# AWS IAM — Identity & Authorization escalation rules (Phase 2)
# ---------------------------------------------------------------------------
# Each rule emits a COMMON edge (from schema/edges.yaml). Permissions listed
# are the EFFECTIVE actions the permission evaluator must confirm on the given
# resource scope before the edge is emitted. `state` defaults to ACTIVE unless
# a condition is unmet (then CONDITIONAL/POTENTIAL) or an explicit deny/SCP
# applies (then BLOCKED).
#
# Scope discipline (false-positive control): every rule records the resource
# scope the action must apply to. A wildcard grant (Resource: "*") widens the
# target set; a scoped grant restricts it. The evaluator populates ?target from
# the effective scope, NOT from the mere presence of the action.
# ---------------------------------------------------------------------------

provider: aws
phase: 2-identity-authorization
applies_to: [aws]

rules:

  # --- Policy mutation (self-grant) -----------------------------------------
  - id: aws-attach-user-policy
    emits: CanGrantPermission
    match_effective_permission: {action: "iam:AttachUserPolicy", resource_type: "AWS::IAM::User"}
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<IAM user in scope (incl. self)>"
      permissions: ["iam:AttachUserPolicy"]
      escalation: "Attach AdministratorAccess (or any managed policy) to a controllable user."
      narrative: "{principal.name} can attach a managed policy to {target.name} (iam:AttachUserPolicy), granting arbitrary permissions."

  - id: aws-put-user-policy
    emits: CanGrantPermission
    match_effective_permission: {action: "iam:PutUserPolicy", resource_type: "AWS::IAM::User"}
    emit: {source: "<principal>", target: "<IAM user in scope>", permissions: ["iam:PutUserPolicy"],
           escalation: "Inline any policy on a controllable user.",
           narrative: "{principal.name} can write an inline policy to {target.name} (iam:PutUserPolicy)."}

  - id: aws-attach-role-policy
    emits: CanGrantPermission
    match_effective_permission: {action: "iam:AttachRolePolicy", resource_type: "AWS::IAM::Role"}
    where: ["?principal can assume ?role OR ?role is assumable path exists"]
    emit: {source: "<principal>", target: "<IAM role in scope>", permissions: ["iam:AttachRolePolicy"],
           escalation: "Attach admin policy to an assumable role, then assume it.",
           narrative: "{principal.name} can attach a policy to {role.name} (iam:AttachRolePolicy)."}

  - id: aws-put-role-policy
    emits: CanGrantPermission
    match_effective_permission: {action: "iam:PutRolePolicy", resource_type: "AWS::IAM::Role"}
    emit: {source: "<principal>", target: "<IAM role in scope>", permissions: ["iam:PutRolePolicy"],
           narrative: "{principal.name} can write an inline policy to {role.name} (iam:PutRolePolicy)."}

  - id: aws-attach-group-policy
    emits: CanGrantPermission
    match_effective_permission: {action: "iam:AttachGroupPolicy", resource_type: "AWS::IAM::Group"}
    where: ["?principal MemberOf ?group  (else escalation only benefits group members)"]
    emit: {source: "<principal>", target: "<IAM group in scope>", permissions: ["iam:AttachGroupPolicy"],
           narrative: "{principal.name} can attach a policy to group {group.name} it belongs to (iam:AttachGroupPolicy)."}

  - id: aws-create-policy-version
    emits: CanModifyPolicy
    match_effective_permission: {action: "iam:CreatePolicyVersion", resource_type: "AWS::IAM::Policy"}
    optional_permission: "iam:SetDefaultPolicyVersion"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<customer-managed policy in scope>"
      permissions: ["iam:CreatePolicyVersion", "iam:SetDefaultPolicyVersion?"]
      state_logic: "ACTIVE if CreatePolicyVersion sets default (default behavior with SetAsDefault=true) else CONDITIONAL(needs SetDefaultPolicyVersion)"
      escalation: "Publish a new default version of a policy already attached to the attacker -> instant privilege gain."
      narrative: "{principal.name} can create a new default version of managed policy {policy.name} (iam:CreatePolicyVersion), rewriting the permissions of every principal it is attached to."

  - id: aws-set-default-policy-version
    emits: CanModifyPolicy
    match_effective_permission: {action: "iam:SetDefaultPolicyVersion", resource_type: "AWS::IAM::Policy"}
    emit: {source: "<principal>", target: "<managed policy>", permissions: ["iam:SetDefaultPolicyVersion"],
           escalation: "Roll a policy back to an older, more-permissive version.",
           narrative: "{principal.name} can set the default version of {policy.name} (iam:SetDefaultPolicyVersion)."}

  # --- Group membership ------------------------------------------------------
  - id: aws-add-user-to-group
    emits: CanAddMember
    match_effective_permission: {action: "iam:AddUserToGroup", resource_type: "AWS::IAM::Group"}
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<IAM group in scope>"
      permissions: ["iam:AddUserToGroup"]
      escalation: "Add a controllable user to a privileged group."
      narrative: "{principal.name} can add users to group {group.name} (iam:AddUserToGroup), inheriting its permissions."

  # --- Credential creation / reset ------------------------------------------
  - id: aws-create-access-key
    emits: CanCreateCredentialFor
    match_effective_permission: {action: "iam:CreateAccessKey", resource_type: "AWS::IAM::User"}
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<IAM user in scope>"
      permissions: ["iam:CreateAccessKey"]
      escalation: "Mint programmatic keys for a more-privileged user and authenticate as them."
      narrative: "{principal.name} can create access keys for {target.name} (iam:CreateAccessKey) and act as that user."

  - id: aws-create-login-profile
    emits: CanCreateCredentialFor
    match_effective_permission: {action: "iam:CreateLoginProfile", resource_type: "AWS::IAM::User"}
    emit: {source: "<principal>", target: "<IAM user w/o console password>", permissions: ["iam:CreateLoginProfile"],
           narrative: "{principal.name} can set a console password for {target.name} (iam:CreateLoginProfile)."}

  - id: aws-update-login-profile
    emits: CanResetCredential
    match_effective_permission: {action: "iam:UpdateLoginProfile", resource_type: "AWS::IAM::User"}
    emit: {source: "<principal>", target: "<IAM user w/ console password>", permissions: ["iam:UpdateLoginProfile"],
           narrative: "{principal.name} can reset the console password of {target.name} (iam:UpdateLoginProfile)."}

  # --- Trust manipulation ----------------------------------------------------
  - id: aws-update-assume-role-policy
    emits: CanModifyTrust
    match_effective_permission: {action: "iam:UpdateAssumeRolePolicy", resource_type: "AWS::IAM::Role"}
    optional_permission: "sts:AssumeRole"
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<IAM role in scope>"
      permissions: ["iam:UpdateAssumeRolePolicy", "sts:AssumeRole?"]
      escalation: "Rewrite a privileged role's trust policy to allow the attacker, then assume it."
      state_logic: "ACTIVE if sts:AssumeRole also allowed else CONDITIONAL(needs assume)"
      narrative: "{principal.name} can rewrite the trust policy of {role.name} (iam:UpdateAssumeRolePolicy) to trust itself and then assume it."

  # --- Role assumption (explicit->this edge is derived from trust eval) ------
  - id: aws-assume-role
    emits: CanAssume
    match_effective_permission: {action: "sts:AssumeRole", resource_type: "AWS::IAM::Role"}
    where: ["?role trust policy Principal allows ?principal (same or cross account)",
            "no SCP/boundary denies sts:AssumeRole"]
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<IAM role>"
      permissions: ["sts:AssumeRole"]
      conditions: [trust_relationship, condition_expression]
      cross_account: "if role.account != principal.account -> also emits CrossAccountTrust + feeds CanEnterAccount"
      narrative: "{principal.name} can assume {role.name} (sts:AssumeRole; trust policy permits it)."

  - id: aws-assume-role-web-identity
    emits: CanFederateAs
    match_record: {resource_type: "AWS::IAM::Role", field: "AssumeRolePolicyDocument"}
    where: ["trust policy Federated = an OIDC/SAML provider (e.g. token.actions.githubusercontent.com, oidc.eks...)",
            "condition (sub/aud) matches an attacker-controllable subject"]
    emit:
      source: "<external/federated identity>"
      target: "<IAM role>"
      permissions: ["sts:AssumeRoleWithWebIdentity | sts:AssumeRoleWithSAML"]
      conditions: [trust_relationship, condition_expression]
      false_positive_note: "Only emit ACTIVE if the sub/aud condition is attacker-satisfiable (e.g. wildcard sub, self-hosted repo). Otherwise POTENTIAL."
      narrative: "{external.name} can federate into {role.name} via OIDC/SAML trust (sts:AssumeRoleWithWebIdentity)."

  # --- PassRole (identity attachment; realizes CanExecuteAs with Phase 4) ----
  - id: aws-pass-role
    emits: CanPassIdentity
    match_effective_permission: {action: "iam:PassRole", resource_type: "AWS::IAM::Role"}
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<IAM role passable in scope>"
      permissions: ["iam:PassRole"]
      conditions: [role_compatibility]
      note: >
        PassRole ALONE is not execution. It becomes CanExecuteAs only when paired
        with a create/deploy/modify capability on a service that (a) accepts the
        role and (b) the attacker can run. See rule aws-execute-as-via-passrole.
      false_positive_note: "iam:PassRole is frequently scoped by the iam:PassedToService condition; honor it — a role passable only to ec2 does not yield lambda execution."
      narrative: "{principal.name} can pass {role.name} to a service (iam:PassRole)."

  - id: aws-execute-as-via-passrole
    emits: CanExecuteAs
    description: "PassRole + ability to create/run a compute resource that accepts the role."
    match:
      - [ ?principal, CanPassIdentity, ?role ]
    where:
      - "?principal has an EFFECTIVE create/run action for a service S in {lambda:CreateFunction, ec2:RunInstances, ecs:RunTask, glue:CreateJob/StartJobRun, cloudformation:CreateStack, datapipeline:*, sagemaker:CreateNotebookInstance, codebuild:CreateProject, ssm automation}"
      - "role trust allows service S (service-linked assume) AND PassedToService condition (if any) includes S"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<IAM role>"
      permissions: ["iam:PassRole", "<service create/run action>"]
      escalation: "Create a workload bound to a privileged role and execute code as it."
      narrative: "{principal.name} can pass {role.name} to {service} and create/run a workload there, executing code as {role.name}."

  # --- Role/instance-profile creation chains --------------------------------
  - id: aws-create-role-and-assume
    emits: CanEscalateTo
    description: "Create a new role with admin trust + policy, then assume it."
    where:
      - "?principal has iam:CreateRole"
      - "?principal has (iam:AttachRolePolicy OR iam:PutRolePolicy)"
      - "?principal has sts:AssumeRole (or sets trust to self)"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<synthetic admin role>"
      permissions: ["iam:CreateRole", "iam:AttachRolePolicy", "sts:AssumeRole"]
      narrative: "{principal.name} can create a role with an admin policy and a self-trust, then assume it (iam:CreateRole + AttachRolePolicy + sts:AssumeRole)."

  - id: aws-add-role-to-instance-profile
    emits: CanAttachIdentity
    where:
      - "?principal has iam:AddRoleToInstanceProfile (+ iam:CreateInstanceProfile if none exists)"
      - "?principal has ec2:RunInstances OR ec2:AssociateIamInstanceProfile"
      - "?principal has iam:PassRole for ?role"
    emit:
      source_type: Identity
      target_type: Compute
      source: "<principal>"
      target: "<EC2 instance / new>"
      permissions: ["iam:AddRoleToInstanceProfile", "ec2:AssociateIamInstanceProfile", "iam:PassRole"]
      note: "Chains to CanExecuteAs(role) via the instance profile."
      narrative: "{principal.name} can attach role {role.name} to an EC2 instance profile and run/associate it, executing as {role.name}."

# ---------------------------------------------------------------------------
# BLOCKED-edge production: if an SCP (or permission boundary) denies any action
# above at the effective scope, the evaluator still emits the edge with
# state: BLOCKED and denied_by=<SCP arn/statement>, so the UI can explain why
# an otherwise-present privesc does not work.
# ---------------------------------------------------------------------------
