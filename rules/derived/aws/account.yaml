# AWS Account Management — Derived attack-path rules (Phase 3 — administrative hierarchy & guardrails)
# ---------------------------------------------------------------------------
# Emits ONLY common edge types whose nature is derived|both (RULE-FORMAT.md
# line 11). Explicit-nature FACTS this service needs — the OAAR CrossAccountTrust,
# the root CanResetCredential/CanTakeOwnership, and the leave-org
# CanModifyConfiguration(SCP scope-binding) — are normalized in
# /rules/explicit/aws-account.yaml and are only MATCHED here, never re-emitted.
#
# This file covers the ACCOUNT boundary surface that is NOT already modeled by
# the organizations adapter, the Control Tower adapter, or the provider-agnostic
# Phase-3 files:
#
#   * The AWS Organizations tree (Contains), SCP-as-guardrail nodes, generic
#     inheritance-down-Contains, and the guardrail BLOCKED->ACTIVE upgrade all
#     live in rules/derived/hierarchy-chains.yaml (rules 1/2/3). CITED, not
#     duplicated.
#   * Cross-account sts:AssumeRole -> CanAssume -> CanEnterAccount is
#     rules/derived/aws/identity-escalation.yaml (aws-assume-role) +
#     rules/derived/can-control.yaml (enter-account-via-assume). CITED.
#   * iam:UpdateAssumeRolePolicy on the OAAR trust is identity-escalation's
#     aws-update-assume-role-policy (CanModifyTrust). CITED.
#   * The AWSControlTowerExecution superhighway (the Control Tower analogue of
#     OrganizationAccountAccessRole — an AdministratorAccess role auto-provisioned
#     into every enrolled member account, trusting the management account) is
#     fully modeled by the Control Tower adapter:
#       - explicit: rules/explicit/aws-controltower.yaml
#           aws-ct-execution-role-trust     (CrossAccountTrust, member Role -> mgmt Account)
#           aws-ct-execution-role-assumable (CanAssume, mgmt principal -> CT role)
#       - derived:  rules/derived/aws/controltower.yaml
#           aws-ct-execution-role-enter-account (CanEnterAccount, with the same
#           CONDITIONAL gates: role exists / trust intact / not SCP-denied) and
#           aws-ct-execution-role-guardrail-bypass (the exempt-from-SCP path).
#     CITED here so the OAAR pair below is not the only account-entry superhighway;
#     do NOT re-implement the CT pair in this file.
#
# What THIS file adds (the one account-level derivation not covered elsewhere):
#   (A) OrganizationAccountAccessRole: the management->member CanEnterAccount that
#       the OAAR CrossAccountTrust (explicit) unlocks, so the standard
#       CanEnterAccount->Controls->admin-inherits-down-contains chain reaches the
#       whole member account with an OAAR-as-admin narrative.
#
# Root-recovery ownership (B) and leave-org SCP-escape (C) are explicit-nature
# edges and now live entirely in /rules/explicit/aws-account.yaml
# (aws-account-root-credential-reset, aws-account-root-recovery-ownership,
# aws-account-leave-org-escapes-scp). Their downstream roll-ups are owned by
# can-control (Controls via CanTakeOwnership) and hierarchy-chains rule 3
# (BLOCKED->ACTIVE guardrail upgrade). Nothing to re-emit here.
#
# Permissions are the EFFECTIVE actions the evaluator must confirm on the given
# resource scope. State defaults to ACTIVE; unmet condition -> CONDITIONAL/
# POTENTIAL; explicit deny/SCP -> BLOCKED. Action names are the exact AWS
# Service Authorization Reference names for the `account:`, `organizations:`, and
# `sts:` prefixes.
# ---------------------------------------------------------------------------

provider: aws
phase: 3-administrative-hierarchy
applies_to: [aws]

rules:

  # === (A) OrganizationAccountAccessRole: management -> member admin ===========

  - id: aws-account-enter-via-oaar
    emits: CanEnterAccount
    description: "A management-account principal that can assume OrganizationAccountAccessRole enters the member account as full admin."
    match:
      - [ ?principal, CanAssume, ?oaar ]
      - [ ?oaar, CrossAccountTrust, ?mgmt_account ]
    where:
      - "node_type(?oaar) == Role and ?oaar.name == 'OrganizationAccountAccessRole'"
      - "account_of(?principal) == account_of(?mgmt_account)  # caller is IN the management account"
      - "account_of(?oaar) != account_of(?principal)          # OAAR is in the MEMBER account (cross-account)"
    emit:
      source_type: Identity
      target_type: Account
      source: ?principal
      target: "<member Account that owns ?oaar>"
      permissions: ["sts:AssumeRole"]
      conditions: [trust_relationship, scp_or_org_policy]
      state_logic: >-
        ACTIVE when ?principal holds effective sts:AssumeRole on the OAAR ARN,
        the trust is intact, and no SCP at the member's OU/account denies
        sts:AssumeRole. CONDITIONAL(trust_relationship) if the role's existence
        or trust integrity is unconfirmed. BLOCKED(scp_or_org_policy) if an SCP
        denies sts:AssumeRole for the OAAR at the member scope -> then
        hierarchy-chains rule 3 (fed by the explicit
        aws-account-leave-org-escapes-scp move-out edge) may upgrade it once the
        SCP is removed/escaped.
      confidence: "min(contributing_confidences) * 0.95"
      derived_from:
        - "<CanAssume edge_id (identity-escalation aws-assume-role)>"
        - "<CrossAccountTrust edge_id (explicit aws-account-oaar-crossaccount-trust)>"
      note: >-
        This is deliberately the ACCOUNT-level specialization of can-control's
        enter-account-via-assume: that generic rule already turns any
        cross-account CanAssume into CanEnterAccount. We keep this rule so the
        OAAR-as-admin path is first-class (target account admin, not a scoped
        role) and so the CanEnterAccount->Controls->admin-inherits-down-contains
        chain (hierarchy-chains rule 1) fires over the WHOLE member account.
        Dedupe with enter-account-via-assume on (CanEnterAccount, principal,
        member-account) — the engine keys emitted edges on
        (type, source, target, scope), so the duplicate collapses. The Control
        Tower analogue (AWSControlTowerExecution) is the sibling derivation
        aws-ct-execution-role-enter-account in rules/derived/aws/controltower.yaml.
      false_positive_note: >-
        Only fires for the MANAGEMENT account's principals assuming a MEMBER
        account's OAAR (the default admin direction). A member-account principal
        does NOT get this. Honor the trust: the trust must actually permit
        ?principal (root of mgmt account permits any mgmt principal with
        sts:AssumeRole granted by their own IAM policy). If the member has an SCP
        denying sts:AssumeRole, keep BLOCKED. OAAR only exists in accounts
        Organizations CREATED (not INVITED) and the role name is customizable —
        the second match clause depends on the explicit CrossAccountTrust FACT,
        which is emitted only when iam:GetRole confirms the role and its trust.
      narrative: >-
        {principal.name} in the management account can assume
        OrganizationAccountAccessRole in member account {target.name} and obtain
        AdministratorAccess, entering {target.name} as a full administrator.

# ---------------------------------------------------------------------------
# BLOCKED-edge & anti-duplication guidance:
#  - An SCP denying sts:AssumeRole at the member scope -> aws-account-enter-via-oaar
#    is BLOCKED(scp_or_org_policy), denied_by=<SCP arn/statement>.
#  - An SCP denying account:PutContactInformation / PutAlternateContact /
#    StartPrimaryEmailUpdate -> the explicit aws-account-root-* edges are BLOCKED.
#  - An SCP denying organizations:LeaveOrganization -> the explicit
#    aws-account-leave-org-escapes-scp is BLOCKED (and cannot upgrade the SCP that
#    blocks it -- see its state_logic).
#  - The BLOCKED->ACTIVE UPGRADE when a guardrail is removed/escaped is owned by
#    hierarchy-chains.yaml rule 3, NOT re-emitted here.
#  - Contains(mgmt Account -> member Account), the SCP guardrail node, and the
#    generic org-tree descent belong to the organizations adapter +
#    hierarchy-chains rules 1/2; do not re-implement them here.
#  - The AWSControlTowerExecution account-entry superhighway is the Control Tower
#    adapter's (aws-ct-execution-role-* in controltower.yaml); do not duplicate.
# ---------------------------------------------------------------------------

# Explicit normalization rules this service needs (raw config -> explicit edges)
# live in /rules/explicit/aws-account.yaml: the OAAR trust HasPolicy/TrustPolicy
# and the walkable OAAR CrossAccountTrust, the Account HasPolicy SCP-attachment
# reference, the account-attribute HasPermission triggers, and the explicit-nature
# CanResetCredential / CanTakeOwnership / CanModifyConfiguration materializations.
