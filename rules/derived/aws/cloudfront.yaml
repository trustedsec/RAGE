# BLOCKED-edge guidance:
#   - An SCP denying cloudfront:UpdateDistribution at the account or OU scope ->
#     emit CanModifyConfiguration with state: BLOCKED and denied_by=<SCP ARN>.
#   - A permission boundary capping the principal's effective permissions below
#     cloudfront:UpdateDistribution -> BLOCKED.
#   - cloudfront:UpdateDistribution with an explicit Deny on the distribution's ARN
#     in an identity policy -> BLOCKED.
#   - CloudFront does NOT have resource-based policies (no bucket policy / no
#     resource-level IAM policy on distributions) — all access is via IAM identity
#     policies + SCPs + permission boundaries only.
