# AWS IAM Access Analyzer — Derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# Low-relevance security service: 2 conservative rules.
#
# Phase 12 theme for this service:
#   (1) RECON: access-analyzer:ListFindings / ListFindingsV2 / GetFinding reveals
#       which resources in the account are externally or publicly accessible and
#       which external principals hold access grants. This maps existing attack paths
#       for an attacker but does NOT itself grant access to any resource -> CanRead
#       (recon). GetFinding provides richer per-finding detail than list operations.
#   (2) DEFENSE EVASION: access-analyzer:DeleteAnalyzer removes an analyzer and all
#       its findings, disabling ongoing IAM access analysis for the zone of trust.
#       This is a cover-tracks / weaken-defenses primitive (hard delete, non-walkable),
#       NOT privilege escalation and NOT a CanEnter*/CanExecuteAs path -> CanDelete
#       on the SecurityService node.
#
# Detective controls do NOT set BLOCKED state; only preventive guardrails do.
# Neither rule chains to CanExecuteAs, CanEnterAccount, or CanEscalateTo.
# Explicit normalization is not required: both rules fire directly from effective
# permission analysis on IAM principals (no structural graph edge assembly needed).
#
# Permissions are the EFFECTIVE actions the permission evaluator must confirm on the
# given resource scope. State defaults to ACTIVE; an unmet condition yields
# CONDITIONAL; an explicit deny/SCP/boundary yields BLOCKED.
#
# Docs:
#   https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
#   https://docs.aws.amazon.com/access-analyzer/latest/APIReference/
# ---------------------------------------------------------------------------

provider: aws
phase: 12-security-logging
applies_to: [aws]

rules:

  # --- Recon: list findings reveals external-access attack surface ------------
  - id: aws-accessanalyzer-list-findings
    emits: CanRead
    description: >-
      List findings on an Access Analyzer to map which account resources are externally
      or publicly accessible and which external principals hold access grants — recon
      that identifies targets for further attack-path traversal.
    match:
      - [ ?principal, HasPermission, ?analyzer ]
    where:
      - "node_class(?analyzer) == ManagementService"
      - "node_type(?analyzer) == SecurityService"
      - "?analyzer.origin_service == aws:accessanalyzer"
      - "?principal has EFFECTIVE access-analyzer:ListFindings OR access-analyzer:ListFindingsV2 OR access-analyzer:GetFinding on ?analyzer ARN scope"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?analyzer
      permissions:
        - "access-analyzer:ListFindings"
        - "access-analyzer:ListFindingsV2"
        - "access-analyzer:GetFinding"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when the principal holds effective access-analyzer:ListFindings,
        ListFindingsV2, or GetFinding on the analyzer ARN scope and at least one
        analyzer is active in the account; CONDITIONAL(iam_permission) when the grant
        is present but the analyzer does not yet exist or is in a pending state; BLOCKED
        when an SCP or permission boundary explicitly denies the action at the effective
        scope.
      confidence: 0.9
      derived_from:
        - "?principal HasPermission access-analyzer:ListFindings|ListFindingsV2|GetFinding on ?analyzer"
      false_positive_note: >-
        CanRead here is a RECON edge only. ListFindings / ListFindingsV2 / GetFinding
        all reveal externally accessible resources and external principals that have
        access grants, but do NOT grant access to those resources themselves. Do NOT
        chain this edge into CanEnterAccount, CanAssume, or CanEscalateTo — the attack
        paths are on the resources the findings describe, not on the analyzer itself.
        GetFinding provides richer intelligence (per-finding detail including full
        external principal ARN and policy excerpt) than list-level results and is
        treated as equivalent recon capability. An org-scoped analyzer (zone_of_trust:
        ORGANIZATION) magnifies the recon blast radius (findings span all member
        accounts) but still does not grant cross-account access; note the org scope in
        findings metadata only.
      narrative: >-
        {principal.name} can call access-analyzer:ListFindings (or ListFindingsV2) on
        {analyzer.name}, revealing which resources in this account are externally or
        publicly accessible and which external principals hold access grants. This
        provides a ready-made map of external-access attack paths for further traversal.

  # --- Defense evasion: delete analyzer disables ongoing detection ------------
  - id: aws-accessanalyzer-delete-analyzer
    emits: CanDelete
    description: >-
      Delete an Access Analyzer, removing all findings and disabling ongoing IAM
      access analysis for the zone of trust — a hard delete of a detective control
      that reduces detection fidelity without granting access (non-walkable edge).
    match:
      - [ ?principal, HasPermission, ?analyzer ]
    where:
      - "node_class(?analyzer) == ManagementService"
      - "node_type(?analyzer) == SecurityService"
      - "?analyzer.origin_service == aws:accessanalyzer"
      - "?principal has EFFECTIVE access-analyzer:DeleteAnalyzer on ?analyzer ARN scope"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?analyzer
      permissions:
        - "access-analyzer:DeleteAnalyzer"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when the principal holds effective access-analyzer:DeleteAnalyzer on the
        analyzer ARN scope; BLOCKED when an SCP, permission boundary, or AWS
        Organizations guardrail explicitly denies the action at the effective scope
        (e.g. an SCP in the management account preventing member accounts from deleting
        org-level analyzers).
      confidence: 0.95
      derived_from:
        - "?principal HasPermission access-analyzer:DeleteAnalyzer on ?analyzer"
      false_positive_note: >-
        This is a DEFENSE EVASION / TAMPERING edge, classified as CanDelete (destructive,
        non-walkable). Deleting an analyzer removes detective-control visibility — it
        does NOT grant IAM permissions, does NOT expose credentials, and does NOT block
        or bypass any preventive guardrail (SCP, permission boundary, resource policy).
        Do NOT emit CanExecuteAs, CanEnterAccount, or CanEscalateTo as a consequence of
        this edge. Do NOT set BLOCKED state on other edges because an analyzer was
        deleted; detective controls only reduce detection confidence, they do not prevent
        access. An org-scoped analyzer (zone_of_trust: ORGANIZATION) deletion disables
        monitoring across all member accounts — this expands the evasion blast radius
        and should be noted in the narrative, but still does NOT yield CanEnterOrganization.
        Separately, access-analyzer:CreateArchiveRule / UpdateFindings (finding archival)
        are lower-severity evasion variants that silence findings without deleting the
        analyzer; those actions would also produce CanModifyConfiguration at reduced
        confidence (0.7) — not modeled here to keep rules minimal for this low-relevance
        service.
      narrative: >-
        {principal.name} can call access-analyzer:DeleteAnalyzer on {analyzer.name},
        removing all current findings and disabling ongoing IAM access analysis for the
        zone of trust ({analyzer.zone_of_trust}). Subsequent external-access grants on
        resources in this account will not be flagged, reducing detection fidelity.
        This is a cover-tracks primitive; it does not grant any additional access.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - SCP or permission boundary denying access-analyzer:ListFindings /
#     ListFindingsV2 / GetFinding at the effective scope -> emit CanRead BLOCKED
#     with denied_by=<SCP arn/statement>.
#   - SCP or permission boundary denying access-analyzer:DeleteAnalyzer ->
#     emit CanDelete BLOCKED with denied_by=<SCP arn/statement>.
#   - AWS Organizations management-account SCPs often prevent member accounts
#     from deleting org-scoped analyzers — honor these as BLOCKED.
#
# COMPOSITION — DO NOT DUPLICATE:
#   No escalation roll-ups (CanEscalateTo / CanEnterAccount / Controls) are
#   emitted by this service. This service is purely recon + detective evasion.
#   can-execute-as.yaml, cicd-chains.yaml, credential-chains.yaml, and
#   can-control.yaml are cited for completeness but do not apply here.
# ---------------------------------------------------------------------------
