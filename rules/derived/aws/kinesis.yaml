# AWS Kinesis Data Streams — Derived attack-path rules (Phase 10 — messaging)
# ---------------------------------------------------------------------------
# Kinesis is a partitioned, ordered record stream. The security signature is:
#   kinesis:PutRecord(s) to a stream that has an active Lambda event-source-
#   mapping (ESM) TRIGGERS the consumer function with an attacker-influenced
#   record payload, running as the function's execution role.
#
# This file emits NORMALIZED MESSAGING FACTS that messaging-chains.yaml
# (the Phase-10 linchpin) rolls up into CanTrigger(principal → consumer),
# CanExecuteAs, CanEscalateTo, CrossAccountTrust, and CanEnterAccount.
# It does NOT re-derive those roll-ups.
#
# WHAT THIS FILE EMITS:
#   Rule 1 (aws-kinesis-put-triggers-consumer):
#     CanWriteData(principal, stream) + CanTrigger(stream, consumer)
#     => CanTrigger(principal, consumer)
#     — the Kinesis-specific bridge completing the messaging-chains rule 1
#       pattern for Kinesis as event source. Kept CONDITIONAL on the ESM
#       being ENABLED and the consumer being invocable.
#
#   Rule 2 (aws-kinesis-cross-account-publish-trust):
#     Stream resource policy grants kinesis:PutRecord to a foreign principal
#     => CrossAccountTrust(stream_policy, foreign_account)
#     — feeds messaging-chains rule 4 and can-control's CanEnterAccount.
#
#   Rule 3 (aws-kinesis-read-stream-data):
#     Effective kinesis:GetRecords + kinesis:GetShardIterator
#     => CanReadData(principal, stream)
#     — enables CanExfiltrate (data-plane rules) and credential-chains
#       (read-secret-yields-identity) when stream carries ContainsSecret.
#
# WHAT THIS FILE DOES NOT EMIT (cite and defer):
#   * CanExecuteAs — messaging-chains rule 2 collapses CanTrigger + ExecutesAs.
#   * CanEscalateTo — can-execute-as / can-control own the escalation roll-up.
#   * CanEnterAccount — can-control enters the account via CrossAccountTrust.
#   * CanExfiltrate — data-plane rules collapse CanReadData over a stream.
#   * ContainsSecret / CredentialsFor — analyst/heuristic annotation; if
#     present, credential-chains read-secret-yields-identity handles it.
#   * ExposedToInternet — Kinesis has no unauthenticated access path;
#     even a wildcard-Principal resource policy requires SigV4.
#   * CanTrigger(stream, function) binding — covered by the generic
#     aws-lambda-event-source-trigger explicit rule (aws-lambda.yaml), which
#     matches any ESM EventSourceArn regardless of source type.
#
# PERMISSIONS (all from AWS Service Authorization Reference — Kinesis Data Streams):
#   kinesis:PutRecord       — write a single record to a stream shard
#   kinesis:PutRecords      — write up to 500 records in a single call
#   kinesis:GetShardIterator — position to start reading from a shard
#   kinesis:GetRecords      — retrieve records from a shard iterator
#
# STATE CONVENTIONS (RULE-FORMAT.md):
#   A derived edge is never stronger than its weakest contributor.
#   A disabled ESM caps rule 1 at CONDITIONAL(trigger_exists), not ACTIVE.
#   A FilterCriteria that the attacker payload cannot satisfy caps at
#   CONDITIONAL(condition_expression) or BLOCKED.
# ---------------------------------------------------------------------------

provider: aws
phase: 10-messaging
applies_to: [aws]

rules:

  # --- 1) PutRecord(s) to a Kinesis stream triggers the bound Lambda consumer ----
  # Core Phase-10 primitive for Kinesis. A principal with kinesis:PutRecord /
  # kinesis:PutRecords on a stream that has an ACTIVE Lambda event-source-mapping
  # can inject an attacker-influenced record, causing the Lambda consumer to
  # process it. This rule emits CanTrigger(principal -> consumer) so that
  # messaging-chains rule 2 can collapse it with ExecutesAs(consumer, role) into
  # CanExecuteAs(principal, role) — the full execution-escalation chain.
  #
  # Depends on:
  #   [?principal, CanWriteData, ?stream]   — effective kinesis:PutRecord /
  #                                            kinesis:PutRecords on the stream ARN;
  #                                            emitted by the explicit normalizer.
  #   [?stream, CanTrigger, ?consumer]      — active ESM binding (EventSourceArn
  #                                            = stream ARN, State = ENABLED);
  #                                            emitted by aws-lambda-event-source-trigger
  #                                            in /rules/explicit/aws-lambda.yaml.
  #
  # LINCHPIN RELATIONSHIP (Phase 10 design):
  # messaging-chains rule 1 (messaging-publish-triggers-consumer) is the
  # PROVIDER-AGNOSTIC rule that collapses [CanWriteData + CanTrigger binding]
  # into [CanTrigger(principal -> consumer)] for ANY messaging adapter. This
  # Kinesis-specific rule is a DUPLICATE EMISSION of the exact same capability
  # (deduped on the output CanTrigger edge). The Kinesis rule adds:
  #   (a) Kinesis-specific permission names (kinesis:PutRecord / kinesis:PutRecords)
  #   (b) Kinesis-specific false-positive context (FilterCriteria gate)
  #   (c) Kinesis provider_type guard so matching is precise
  # BOTH RULES WILL FIRE on the same triple [CanWriteData, CanTrigger binding] and
  # produce the same deduped [CanTrigger(principal, consumer)] edge. Dedup strategy:
  # emit once per (edge_type, source, target, scope); messaging-chains fires first
  # (provider-agnostic, lowest specificity); this rule fires second and updates
  # in-place with Kinesis-specific permissions/context if confidence/weight is
  # better. NO re-derivation occurs — only the normalized messaging facts are
  # consumed; the linchpin owns the collapse logic.
  - id: aws-kinesis-put-triggers-consumer
    emits: CanTrigger
    description: "kinesis:PutRecord(s) to a stream with an active Lambda ESM triggers the consumer function with an attacker-influenced record payload."
    match:
      - [ ?principal, CanWriteData, ?stream ]
      - [ ?stream,    CanTrigger,   ?consumer ]
    where:
      - "node_type(?stream) == GenericMessaging"
      - "node_class(?consumer) == Compute or node_type(?consumer) == Workflow"
      - "?stream.provider_type == 'AWS::Kinesis::Stream'"
    optional:
      # ESM has FilterCriteria — if present, the attacker must be able to craft
      # a record satisfying the filter for the trigger to fire.
      - "?stream ESM binding has no FilterCriteria (or attacker payload satisfies it)"
    emit:
      source_type: Identity
      target_type: Compute
      source: ?principal
      target: ?consumer
      permissions: ["kinesis:PutRecord", "kinesis:PutRecords"]
      conditions: [trigger_exists, service_state]
      state_logic: >-
        ACTIVE when the ESM binding between ?stream and ?consumer is confirmed
        ENABLED and the consumer is invocable (Lambda function exists and is not
        throttled to 0). CONDITIONAL(trigger_exists) when the ESM is DISABLED or
        its state is unknown. CONDITIONAL(condition_expression) when the ESM has a
        FilterCriteria expression the attacker payload may not satisfy. Inherit the
        weakest state from the contributing CanWriteData (a resource-policy/SCP-
        capped publish downgrades this) and the CanTrigger binding edge. A BLOCKED
        deny on kinesis:PutRecord or lambda:InvokeFunction blocks the chain.
      confidence: "min(contributing_confidences) * 0.9"
      derived_from:
        - "?principal CanWriteData ?stream (kinesis:PutRecord / kinesis:PutRecords)"
        - "?stream CanTrigger ?consumer (Lambda ESM binding, aws-lambda-event-source-trigger)"
        - "messaging-chains:messaging-publish-triggers-consumer (provider-agnostic roll-up)"
      false_positive_note: >-
        Three gating conditions all required for ACTIVE: (1) the principal has
        EFFECTIVE kinesis:PutRecord or kinesis:PutRecords on the stream ARN — confirm
        both the identity policy and any stream resource policy deny; a resource
        policy with a deny on kinesis:PutRecord blocks even if the identity policy
        allows. (2) The Lambda ESM State is ENABLED — a DISABLED ESM means records
        are not delivered to the function; downgrade to CONDITIONAL(trigger_exists).
        (3) If the ESM has FilterCriteria, only records matching the JSON filter
        trigger the function; downgrade to CONDITIONAL(condition_expression) unless
        the attacker can craft a conforming payload (often possible for simple key-
        value matchers, but not guaranteed). Do not emit ACTIVE for a disabled
        mapping or a filter the attacker demonstrably cannot satisfy. This CanTrigger
        feeds messaging-chains rule 2 (messaging-trigger-executes-as) for the
        CanExecuteAs consequence — that roll-up is messaging-chains', not re-derived.
      narrative: >-
        {principal.name} can write records to the Kinesis stream {stream.name}
        (kinesis:PutRecord / kinesis:PutRecords). An active Lambda event-source-
        mapping delivers those records to {consumer.name}; a crafted record
        therefore triggers {consumer.name} to run with an attacker-influenced
        payload. messaging-chains then collapses this with {consumer.name}'s
        ExecutesAs binding to produce CanExecuteAs over the function's execution
        role.

  # --- 2) Stream resource policy grants PutRecord to a foreign account => cross-account trust ---
  # A Kinesis stream resource policy (PutResourcePolicy / GetResourcePolicy, GA
  # since 2023) can grant kinesis:PutRecord or kinesis:PutRecords to a Principal
  # in another AWS account. This is a CrossAccountTrust fact: the foreign principal
  # can publish records and, via an active ESM binding, trigger a Lambda in the
  # stream-owner account. can-control (enter-account-via-assume and its analogs)
  # and messaging-chains roll this up into CanEnterAccount — cited, not re-derived.
  #
  # This rule mirrors messaging-chains rule 4 (messaging-resource-policy-cross-
  # boundary-trust) with Kinesis-specific permission names and evidence fields.
  - id: aws-kinesis-cross-account-publish-trust
    emits: CrossAccountTrust
    description: "A Kinesis stream resource policy granting kinesis:PutRecord(s) to a principal in another account is cross-account publish trust, enabling that external principal to trigger the stream's Lambda consumer."
    match:
      - [ ?stream_policy, HasPolicy, ?stream ]
    where:
      - "node_type(?stream) == GenericMessaging"
      - "?stream.provider_type == 'AWS::Kinesis::Stream'"
      - "node_type(?stream_policy) == ResourcePolicy"
      - "?stream_policy grants kinesis:PutRecord or kinesis:PutRecords to a Principal whose account != account(?stream)"
    emit:
      source_type: ResourcePolicy
      target_type: Account
      source: ?stream_policy
      target: "<the external AWS account named in the stream resource policy>"
      permissions: ["kinesis:PutRecord", "kinesis:PutRecords"]
      conditions: [resource_policy, condition_expression]
      state_logic: >-
        ACTIVE when the stream resource policy unconditionally grants
        kinesis:PutRecord or kinesis:PutRecords to a named external principal with
        no conditions beyond aws:PrincipalArn identity scoping. CONDITIONAL
        (condition_expression) when scoped by aws:SourceAccount, aws:SourceVpc,
        aws:PrincipalOrgID, or other conditions the external principal must satisfy.
        BLOCKED by an SCP or explicit deny in the stream-owner's account that
        prevents cross-account PutRecord. State never exceeds the weakest
        contributor. This edge ONLY asserts the cross-boundary publish trust;
        CanEnterAccount requires messaging-chains + can-control to roll up the
        CanWriteData + CanTrigger + CanExecuteAs chain separately.
      confidence: "min(contributing_confidences)"
      derived_from:
        - "?stream_policy HasPolicy ?stream (kinesis:GetResourcePolicy evidence)"
        - "messaging-chains:messaging-resource-policy-cross-boundary-trust (provider-agnostic form)"
        - "can-control:enter-account-via-assume (downstream CanEnterAccount — cited not re-derived)"
      false_positive_note: >-
        This rule asserts ONLY the cross-boundary publishing TRUST from the resource
        policy. CanEnterAccount is NOT emitted here — it requires the separate chain:
        foreign-principal CanWriteData stream → (rule 1) CanTrigger consumer →
        messaging-chains rule 2 CanExecuteAs → can-control CanEnterAccount. Honor
        aws:PrincipalOrgID / aws:SourceAccount conditions as real controls: a
        policy scoped to a specific sibling account is not open cross-account access
        (downgrade to CONDITIONAL). A read-only cross-account grant
        (kinesis:GetRecords / kinesis:GetShardIterator to a foreign account) does
        NOT feed this rule — that is cross-account read trust, a different threat
        model (CanReadData / CanExfiltrate, handled by data-plane rules).
      narrative: >-
        The resource policy on Kinesis stream {stream.name} grants kinesis:PutRecord
        or kinesis:PutRecords to a principal in a foreign AWS account. That external
        principal can publish records to this stream. If a Lambda event-source-mapping
        is active on {stream.name}, the external principal can trigger the bound
        Lambda consumer inside {stream.name}'s account (the full chain — messaging-
        chains + can-control — rolls this up to CanEnterAccount).

  # --- 3) GetRecords permission => read stream data ---
  # A principal with kinesis:GetRecords + kinesis:GetShardIterator can read raw
  # record bytes from the stream. This is a CanReadData fact: it enables data
  # exfiltration if records carry sensitive data, and credential harvest if records
  # carry secrets (ContainsSecret / credential-chains roll-up). The KMS gate
  # applies when the stream uses server-side encryption: a principal without
  # kms:Decrypt on the stream's CMK cannot decrypt the ciphertext in GetRecords
  # responses → CanReadData is CONDITIONAL(key_permission) until CanDecrypt is
  # confirmed (credential-chains decrypt-gates-secret-read upgrades it).
  - id: aws-kinesis-read-stream-data
    emits: CanReadData
    description: "kinesis:GetRecords + kinesis:GetShardIterator lets a principal read raw records from the stream, enabling data exfiltration or credential harvest if records carry sensitive content."
    match:
      - [ ?principal, HasPermission, ?stream ]
    where:
      - "node_type(?stream) == GenericMessaging"
      - "?stream.provider_type == 'AWS::Kinesis::Stream'"
      - "?principal has EFFECTIVE kinesis:GetRecords AND kinesis:GetShardIterator on ?stream ARN"
    emit:
      source_type: Identity
      target_type: Messaging
      source: ?principal
      target: ?stream
      permissions: ["kinesis:GetRecords", "kinesis:GetShardIterator"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        ACTIVE when both kinesis:GetRecords and kinesis:GetShardIterator are
        confirmed EFFECTIVE on the stream ARN (identity-based policy + no resource-
        policy deny + no SCP deny) AND the stream uses no KMS encryption (or the
        principal also holds kms:Decrypt on the stream's CMK — the key_permission
        gate). CONDITIONAL(key_permission) when the stream has server-side
        encryption (EncryptionType: KMS) and kms:Decrypt on the CMK is not confirmed
        — the principal can call GetRecords but receives ciphertext they cannot
        decrypt. credential-chains decrypt-gates-secret-read upgrades to ACTIVE when
        CanDecrypt is confirmed. CONDITIONAL(resource_policy) when a resource policy
        deny or a missing grant caps the effective permission.
      confidence: "min(contributing_confidences) * 0.95"
      derived_from:
        - "?principal HasPermission ?stream (kinesis:GetRecords + kinesis:GetShardIterator effective permission)"
        - "credential-chains:decrypt-gates-secret-read (KMS-encrypted stream gate — cited not re-derived)"
      false_positive_note: >-
        Two permissions are required together: kinesis:GetShardIterator (to obtain a
        shard cursor) AND kinesis:GetRecords (to read the batch). Granting only one
        does not yield data access. For KMS-encrypted streams (EncryptionType: KMS),
        the caller also needs kms:Decrypt on the stream's CMK — without it, GetRecords
        returns encrypted ciphertext and CanReadData must be CONDITIONAL(key_permission)
        rather than ACTIVE. Enhanced fan-out consumers (kinesis:SubscribeToShard)
        provide an equivalent read path but require a registered consumer ARN via
        kinesis:RegisterStreamConsumer first — model as a separate edge if
        SubscribeToShard is the confirmed access method. ListShards alone does not
        grant data access.
      narrative: >-
        {principal.name} has effective kinesis:GetRecords and kinesis:GetShardIterator
        on {stream.name} and can read raw record batches from the stream. If records
        carry sensitive data, this enables CanExfiltrate (rolled up by the data-plane
        rules); if records carry embedded credentials (ContainsSecret), credential-
        chains read-secret-yields-identity produces CanImpersonate over the credential's
        target identity.
  # --- 4) PutResourcePolicy on a stream -> modify the stream's resource policy ---
  # A principal with kinesis:PutResourcePolicy on a Kinesis stream can rewrite its
  # resource-based policy to grant themselves or others new capabilities. This is a
  # CanModifyPolicy(principal, stream_policy) edge. A rewritten policy can grant:
  #   (a) themselves kinesis:PutRecord to feed rule 1's CanWriteData -> CanTrigger chain;
  #   (b) a foreign account kinesis:PutRecord to enable cross-account publish (rule 2);
  #   (c) themselves or others kinesis:GetRecords for data exfiltration (rule 3).
  # This rule gates privilege escalation via policy mutation on Kinesis streams.
  - id: aws-kinesis-modify-resource-policy
    emits: CanModifyPolicy
    description: "kinesis:PutResourcePolicy on a stream grants the ability to rewrite the stream's resource policy, enabling privilege escalation via grant injection or cross-account access expansion."
    match:
      - [ ?principal, HasPermission, ?stream ]
    where:
      - "node_type(?stream) == GenericMessaging"
      - "?stream.provider_type == 'AWS::Kinesis::Stream'"
      - "?principal has EFFECTIVE kinesis:PutResourcePolicy on ?stream ARN"
    emit:
      source_type: Identity
      target_type: Policy
      source: ?principal
      target: "<ResourcePolicy node for the stream's resource policy (or the stream itself if policy target is implicit)>"
      permissions: ["kinesis:PutResourcePolicy"]
      conditions: [iam_permission, scp_or_org_policy]
      state_logic: >-
        ACTIVE when kinesis:PutResourcePolicy is confirmed EFFECTIVE on the stream ARN
        (identity-based policy + no resource-policy deny + no SCP deny). CONDITIONAL
        (scp_or_org_policy) when an SCP may restrict the policy mutation. BLOCKED by an
        explicit deny on kinesis:PutResourcePolicy.
      confidence: "min(contributing_confidences)"
      derived_from:
        - "?principal HasPermission ?stream (kinesis:PutResourcePolicy effective permission)"
      false_positive_note: >-
        Confirm that kinesis:PutResourcePolicy is EFFECTIVE on the stream ARN; like all
        API permissions, it is subject to resource policy, permission boundaries, and SCPs.
        This edge asserts the ability to REWRITE the stream's resource policy — the
        concrete escalation consequences (granting themselves PutRecord, granting a
        foreign account PutRecord/GetRecords, etc.) are rolled up by downstream rules
        (messaging-chains rules 1-2 + can-control, credential-chains, data-plane).
      narrative: >-
        {principal.name} has kinesis:PutResourcePolicy on {stream.name} and can rewrite
        its resource policy. By injecting new grants, the principal can escalate
        privileges (e.g., grant themselves kinesis:PutRecord or a foreign account
        cross-account access), feeding downstream escalation chains.

  # --- 5) Cross-account read trust via resource policy => CrossAccountTrust -----
  # A Kinesis stream resource policy that grants kinesis:GetRecords or
  # kinesis:GetShardIterator (or kinesis:SubscribeToShard) to a Principal in another
  # AWS account enables that account to READ records from this stream. This is a
  # CrossAccountTrust (read variant) that feeds CanReadData cross-boundary, enabling
  # data exfiltration and credential harvest via credential-chains (if records carry
  # secrets). The threat model differs from publish-trust (rule 2) but is equally
  # high-value for data exfiltration paths.
  - id: aws-kinesis-cross-account-read-trust
    emits: CrossAccountTrust
    description: "A Kinesis stream resource policy granting read actions (GetRecords/GetShardIterator/SubscribeToShard) to a foreign account enables that account to read the stream's records, supporting data exfiltration."
    match:
      - [ ?stream_policy, HasPolicy, ?stream ]
    where:
      - "node_type(?stream) == GenericMessaging"
      - "?stream.provider_type == 'AWS::Kinesis::Stream'"
      - "node_type(?stream_policy) == ResourcePolicy"
      - "?stream_policy grants kinesis:GetRecords or kinesis:GetShardIterator or kinesis:SubscribeToShard to a Principal whose account != account(?stream)"
    emit:
      source_type: ResourcePolicy
      target_type: Account
      source: ?stream_policy
      target: "<the external AWS account named in the stream resource policy>"
      permissions: ["kinesis:GetRecords", "kinesis:GetShardIterator", "kinesis:SubscribeToShard"]
      conditions: [resource_policy, condition_expression]
      state_logic: >-
        ACTIVE when the stream resource policy unconditionally grants kinesis:GetRecords,
        kinesis:GetShardIterator, or kinesis:SubscribeToShard to a named external
        principal with no conditions beyond aws:PrincipalArn identity scoping.
        CONDITIONAL(condition_expression) when scoped by aws:SourceAccount,
        aws:SourceVpc, aws:PrincipalOrgID, or other conditions. BLOCKED by an SCP or
        explicit deny in the stream-owner's account that prevents cross-account
        GetRecords. This edge asserts cross-boundary read TRUST; CanReadData cross-
        boundary is rolled up by data-plane rules and credential-chains (if records
        carry secrets).
      confidence: "min(contributing_confidences)"
      derived_from:
        - "?stream_policy HasPolicy ?stream (kinesis:GetResourcePolicy evidence)"
        - "data-plane:CanReadData-rollup (downstream CanReadData — cited not re-derived)"
      false_positive_note: >-
        This rule asserts ONLY the cross-boundary read TRUST from the resource policy.
        CanReadData cross-boundary is emitted by the data-plane rules and credential-
        chains, not here. Honor aws:PrincipalOrgID / aws:SourceAccount conditions as real
        controls: a policy scoped to a specific sibling account is not open read access
        (downgrade to CONDITIONAL). A read-only cross-account grant (GetRecords alone
        without GetShardIterator) has limitations but is still a capability (GetRecords
        requires a pre-obtained shard iterator from GetShardIterator, but an attacker
        holding both can read freely). Distinguish from rule 2 (publish-trust): this rule
        covers read-only access, while rule 2 covers publish/trigger access.
      narrative: >-
        The resource policy on Kinesis stream {stream.name} grants kinesis:GetRecords,
        kinesis:GetShardIterator, or kinesis:SubscribeToShard to a principal in a
        foreign AWS account. That external principal can read records from this stream,
        enabling data exfiltration (especially if records carry sensitive data or
        credentials).

  # --- 6) RegisterStreamConsumer + SubscribeToShard => read stream via fan-out ----
  # A principal with kinesis:RegisterStreamConsumer AND kinesis:SubscribeToShard can
  # read stream records via the enhanced fan-out path (push-based, lower-latency).
  # RegisterStreamConsumer creates a consumer ARN; SubscribeToShard opens a push
  # subscription to that consumer. This is equivalent to GetRecords + GetShardIterator
  # (rule 3) but is a separate access path. An attacker who has BOTH permissions can
  # achieve the same CanReadData capability, enabling data exfiltration or credential
  # harvest if records carry sensitive content. This rule extends the read-data model
  # to cover the fan-out alternative.
  - id: aws-kinesis-read-stream-data-fanout
    emits: CanReadData
    description: "kinesis:RegisterStreamConsumer + kinesis:SubscribeToShard enables reading from a stream via the enhanced fan-out path (push-based), equivalent to GetRecords-based polling."
    match:
      - [ ?principal, HasPermission, ?stream ]
    where:
      - "node_type(?stream) == GenericMessaging"
      - "?stream.provider_type == 'AWS::Kinesis::Stream'"
      - "?principal has EFFECTIVE kinesis:RegisterStreamConsumer on ?stream ARN"
      - "?principal has EFFECTIVE kinesis:SubscribeToShard on consumer ARNs for ?stream"
    emit:
      source_type: Identity
      target_type: Messaging
      source: ?principal
      target: ?stream
      permissions: ["kinesis:RegisterStreamConsumer", "kinesis:SubscribeToShard"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        ACTIVE when BOTH kinesis:RegisterStreamConsumer and kinesis:SubscribeToShard are
        confirmed EFFECTIVE on the stream ARN (and consumer ARNs respectively).
        RegisterStreamConsumer alone does not grant read access (it only creates a
        consumer ARN). SubscribeToShard alone is also insufficient without a registered
        consumer. The principal must hold both to achieve read capability. If the stream
        uses KMS encryption (EncryptionType: KMS), the principal also needs
        kms:Decrypt — same key_permission gate as rule 3. CONDITIONAL(key_permission)
        when encryption is present but decrypt is unconfirmed.
      confidence: "min(contributing_confidences) * 0.9"
      derived_from:
        - "?principal HasPermission ?stream (kinesis:RegisterStreamConsumer + kinesis:SubscribeToShard effective permission)"
        - "credential-chains:decrypt-gates-secret-read (KMS-encrypted stream gate — cited not re-derived)"
      false_positive_note: >-
        BOTH permissions are REQUIRED together; neither alone grants read access.
        RegisterStreamConsumer creates the consumer ARN artifact; SubscribeToShard
        uses that consumer to open the push subscription. An attacker must have both.
        This is the enhanced fan-out (push) variant of rule 3's GetRecords polling.
        Like rule 3, KMS encryption gates the capability until kms:Decrypt is confirmed.
        A consumer created by someone else (shared consumer ARN) may not be leverageable
        depending on access — assume the attacker creates their own consumer via
        RegisterStreamConsumer. If only one of the two permissions is confirmed, do not
        emit ACTIVE — downgrade to CONDITIONAL or block.
      narrative: >-
        {principal.name} has kinesis:RegisterStreamConsumer and kinesis:SubscribeToShard
        on {stream.name} and can read records via the enhanced fan-out path. By
        registering a consumer and subscribing to the stream via that consumer,
        {principal.name} can read record batches, enabling data exfiltration or
        credential harvest if records carry sensitive content.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - An SCP or explicit deny on kinesis:PutRecord / kinesis:PutRecords blocks
#     rule 1 (aws-kinesis-put-triggers-consumer) -> emit BLOCKED.
#   - A Lambda ESM with State: DISABLED caps rule 1 at CONDITIONAL(trigger_exists),
#     never ACTIVE.
#   - An ESM FilterCriteria the attacker payload cannot satisfy caps rule 1 at
#     CONDITIONAL(condition_expression) or BLOCKED.
#   - An SCP or resource-policy deny on kinesis:PutRecord for the foreign account
#     blocks rule 2 (aws-kinesis-cross-account-publish-trust) -> BLOCKED.
#   - An explicit deny on kinesis:PutResourcePolicy blocks rule 4
#     (aws-kinesis-modify-resource-policy) -> BLOCKED.
#   - An SCP or resource-policy deny on kinesis:GetRecords/GetShardIterator/
#     SubscribeToShard for the foreign account blocks rule 5
#     (aws-kinesis-cross-account-read-trust) -> BLOCKED.
#   - A missing kms:Decrypt on an encrypted stream's CMK caps rules 3 and 6
#     (aws-kinesis-read-stream-data + aws-kinesis-read-stream-data-fanout) at
#     CONDITIONAL(key_permission); credential-chains decrypt-gates-secret-read
#     upgrades to ACTIVE when CanDecrypt is confirmed.
#   - State never exceeds the weakest contributor (RULE-FORMAT.md).
# ---------------------------------------------------------------------------

# Explicit normalization rules recommended (add to /rules/explicit/aws-kinesis.yaml
# if created; these translate raw Kinesis config to explicit edges that the derived
# rules above then consume):
#
#   aws-kinesis-can-write-data:
#     emits: CanWriteData
