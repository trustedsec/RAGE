# AWS GuardDuty — Derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# GuardDuty is a managed threat-detection service (SecurityService node).
# It has NO execution identity, NO resource-based policies, and NO code the
# attacker can modify. The entire attack surface is DEFENSE EVASION / COVER
# TRACKS: disabling the detector, suppressing findings via filters/IPSets, or
# severing multi-account aggregation.
#
# THEME GUIDANCE (Phase 12, mode 1):
#   StopLogging / DeleteDetector / disable / suppress => CanModifyConfiguration
#   and/or CanDelete on the SecurityService node. This is a cover-tracks primitive
#   ONLY. It does NOT chain to CanExecuteAs / CanEnterAccount / CanEscalateTo.
#   Detective controls do NOT yield BLOCKED state — that is preventive guardrails
#   only. Narrative must note reduced detection, not access gained.
#
# LINCHPINS CITED (not duplicated):
#   can-execute-as.yaml   — not applicable; GuardDuty has no ExecutesAs
#   cicd-chains.yaml      — not applicable; no runner/buildspec
#   credential-chains.yaml — not applicable; no secret material
#   can-control.yaml      — escalation roll-up; not triggered here (no CanExecuteAs)
#
# Official docs:
#   https://docs.aws.amazon.com/guardduty/latest/ug/
#   https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonguardduty.html
# ---------------------------------------------------------------------------

provider: aws
phase: 12-security-logging
applies_to: [aws]

rules:

  # --- 1) Delete the detector — permanent blind spot -------------------------
  # guardduty:DeleteDetector permanently removes the detector from a region,
  # eliminating all GuardDuty threat detection for that account/region pair.
  # This is the highest-impact evasion action: no detector == no findings.
  - id: aws-gd-delete-detector
    emits: CanDelete
    description: "Delete the GuardDuty detector, permanently eliminating threat detection in the account/region."
    match:
      - [ ?principal, HasPermission, ?detector ]
    where:
      - "node_type(?detector) == SecurityService"
      - "?detector.provider_type == 'AWS::GuardDuty::Detector'"
      - "?principal has EFFECTIVE guardduty:DeleteDetector on ?detector"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?detector
      permissions: ["guardduty:DeleteDetector"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?principal holds the effective guardduty:DeleteDetector permission
        (subject to SCPs and permission boundaries). BLOCKED if an SCP or deny policy
        explicitly denies guardduty:DeleteDetector.
      confidence: 0.95
      derived_from: ["HasPermission(?principal, guardduty:DeleteDetector, ?detector)"]
      false_positive_note: >-
        This is purely a destructive / cover-tracks primitive. Deleting the detector
        does NOT grant the principal any additional permissions, access to data, or the
        ability to execute code. Do not chain to CanExecuteAs, CanEnterAccount, or any
        escalation edge. The security impact is loss of detective coverage in this
        account/region, not a privilege gain. An SCP denying guardduty:DeleteDetector
        makes this BLOCKED and is a meaningful preventive control.
      narrative: >-
        {principal.name} can permanently delete the GuardDuty detector
        {detector.name} (guardduty:DeleteDetector), eliminating all threat detection
        in this account/region. Subsequent attacker activity will not generate
        GuardDuty findings, reducing detection probability.

  # --- 2) Disable the detector (UpdateDetector Enable=false) — reversible blind spot
  # guardduty:UpdateDetector with Enable=false pauses finding generation without
  # deleting the detector. Less permanent than Delete but fully effective for
  # the duration of the attack; an operator must notice and re-enable it.
  - id: aws-gd-disable-detector
    emits: CanModifyConfiguration
    description: "Disable the GuardDuty detector via UpdateDetector(Enable=false), pausing all finding generation."
    match:
      - [ ?principal, HasPermission, ?detector ]
    where:
      - "node_type(?detector) == SecurityService"
      - "?detector.provider_type == 'AWS::GuardDuty::Detector'"
      - "?principal has EFFECTIVE guardduty:UpdateDetector on ?detector"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?detector
      permissions: ["guardduty:UpdateDetector"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?principal holds effective guardduty:UpdateDetector. BLOCKED if
        an SCP or deny policy explicitly denies guardduty:UpdateDetector. The Enable=false
        field is the evasion-relevant mutation; the same permission also allows benign
        config changes (publishing frequency, data sources) — see false_positive_note.
      confidence: 0.90
      derived_from: ["HasPermission(?principal, guardduty:UpdateDetector, ?detector)"]
      false_positive_note: >-
        guardduty:UpdateDetector is used for both benign configuration changes
        (adjusting FindingPublishingFrequency, enabling/disabling optional data
        sources such as S3 Protection or EKS audit logs) and for setting Enable=false.
        The CanModifyConfiguration edge is correct for all uses because any config
        mutation of a detective control is security-relevant, but the highest-severity
        case is Enable=false. Analysts should note that holding UpdateDetector does not
        guarantee the attacker will disable the detector — it only creates the
        capability. This is NOT a privilege-escalation edge; no CanExecuteAs or
        CanEnterAccount chains from here. Do not emit BLOCKED merely because the
        detector is currently enabled — BLOCKED is for SCP/deny-policy guardrails, not
        current state.
      narrative: >-
        {principal.name} can disable the GuardDuty detector {detector.name}
        (guardduty:UpdateDetector with Enable=false), pausing all threat-detection
        finding generation. The detector remains present and can be re-enabled, but
        creates a detection gap for the duration of the attack.

  # --- 3) Suppress findings via Filter (auto-archive) — stealthy evasion ----
  # guardduty:CreateFilter / guardduty:UpdateFilter allows creating named rules
  # that automatically ARCHIVE (suppress) findings matching criteria. An attacker
  # can create a filter that archives all findings for their source IPs, API calls,
  # or instance IDs, making their activity invisible in the GuardDuty console
  # while the detector remains enabled and appears healthy.
  - id: aws-gd-suppress-findings-filter
    emits: CanModifyConfiguration
    description: "Create or update a GuardDuty filter to auto-archive (suppress) specific findings, enabling stealthy evasion while the detector appears operational."
    match:
      - [ ?principal, HasPermission, ?detector ]
    where:
      - "node_type(?detector) == SecurityService"
      - "?detector.provider_type == 'AWS::GuardDuty::Detector'"
      - "?principal has EFFECTIVE guardduty:CreateFilter OR guardduty:UpdateFilter on ?detector"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?detector
      permissions: ["guardduty:CreateFilter", "guardduty:UpdateFilter"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?principal holds effective guardduty:CreateFilter or
        guardduty:UpdateFilter. The filter does not need to pre-exist for CreateFilter.
        BLOCKED if an SCP denies both filter write actions.
      confidence: 0.85
      derived_from: ["HasPermission(?principal, guardduty:CreateFilter|guardduty:UpdateFilter, ?detector)"]
      false_positive_note: >-
        Filters with Action=NOOP (i.e. tagging-only) or low-severity suppression
        (Severity <= 1) are normal operational noise reduction. The evasion-relevant
        case is Action=ARCHIVE targeting high-severity findings or
        broad criteria (e.g. all findings with a specific instanceId, IP, or finding
        type covering the attacker's TTPs). The edge is correct regardless of the
        filter's current content because the permission grants the capability to create
        an evasive filter at any time. This is stealthier than disabling the detector
        because the detector remains ENABLED — monitoring dashboards show no anomaly.
        Do not chain to privilege escalation. Confidence is slightly lower (0.85) than
        Delete/Disable because the suppression is targeted and reversible, and an
        analyst may notice the filter.
      narrative: >-
        {principal.name} can create or update GuardDuty filters on {detector.name}
        (guardduty:CreateFilter / guardduty:UpdateFilter) to automatically archive
        specific finding types. The detector remains ENABLED, creating the appearance
        of normal operation while targeted attacker activity is silently suppressed.

  # --- 4) Trusted-IP suppression — network-level evasion --------------------
  # guardduty:CreateIPSet / UpdateIPSet lets a principal define a list of
  # "trusted" IP addresses. GuardDuty suppresses findings for traffic to/from
  # those IPs. An attacker who knows their egress IPs can add them to the
  # trusted list to suppress network-anomaly and recon findings.
  - id: aws-gd-trusted-ip-suppress
    emits: CanModifyConfiguration
    description: "Add attacker-controlled IPs to a GuardDuty trusted-IP set (IPSet), suppressing network-based findings for those addresses."
    match:
      - [ ?principal, HasPermission, ?detector ]
    where:
      - "node_type(?detector) == SecurityService"
      - "?detector.provider_type == 'AWS::GuardDuty::Detector'"
      - "?principal has EFFECTIVE guardduty:CreateIPSet OR guardduty:UpdateIPSet on ?detector"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?detector
      permissions: ["guardduty:CreateIPSet", "guardduty:UpdateIPSet"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?principal holds effective guardduty:CreateIPSet or
        guardduty:UpdateIPSet. The IPSet content is set at write time.
        BLOCKED if an SCP denies both IPSet write actions.
      confidence: 0.80
      derived_from: ["HasPermission(?principal, guardduty:CreateIPSet|guardduty:UpdateIPSet, ?detector)"]
      false_positive_note: >-
        Trusted-IP sets are legitimate for VPN egress IPs, NAT gateway IPs, and known
        scanner IPs that generate false positives. Evasion requires the attacker to
        know and control the IPs they will use for exfiltration or C2 — opportunistic
        attackers without fixed egress IPs gain little from this. Most network-based
        GuardDuty findings (port scans, DNS exfil, crypto-mining calls) are suppressed
        by IPSet entries, but host-based findings (IAM anomalies, API call patterns)
        are not — this provides partial not total evasion. Confidence 0.80 reflects
        this partial effectiveness. Not a privilege-escalation path.
      narrative: >-
        {principal.name} can create or update GuardDuty trusted-IP sets on
        {detector.name} (guardduty:CreateIPSet / guardduty:UpdateIPSet) to add their
        source IPs, suppressing network-anomaly findings (port scan, DNS exfil,
        crypto-mining calls to known endpoints) originating from those addresses.

  # --- 5) Disassociate member from administrator (multi-account coverage gap) -
  # In an AWS Organizations GuardDuty deployment, a delegated administrator
  # account receives findings from all member accounts. A principal in a member
  # account with DisassociateFromAdministratorAccount can sever that aggregation,
  # creating a blind spot in central security monitoring for that account.
  # A principal in the admin account with DisassociateMembers can do the same for
  # any individual member.
  - id: aws-gd-disassociate-member
    emits: CanModifyConfiguration
    description: "Sever a member account's GuardDuty aggregation link to the Organizations delegated administrator, creating a central-monitoring blind spot."
    match:
      - [ ?principal, HasPermission, ?detector ]
    where:
      - "node_type(?detector) == SecurityService"
      - "?detector.provider_type == 'AWS::GuardDuty::Detector'"
      - "?principal has EFFECTIVE guardduty:DisassociateFromAdministratorAccount OR guardduty:DisassociateMembers on ?detector"
      - "?detector is in a member account of a GuardDuty Organizations configuration (GetAdministratorAccount returns a non-empty administrator)"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?detector
      permissions: ["guardduty:DisassociateFromAdministratorAccount", "guardduty:DisassociateMembers"]
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when ?principal holds the effective permission AND the account is
        currently managed (GetAdministratorAccount / ListMembers confirms the
        relationship). CONDITIONAL(service_state) when the membership state cannot
        be confirmed. BLOCKED if SCP denies the disassociate action.
      confidence: 0.85
      derived_from: ["HasPermission(?principal, guardduty:DisassociateFromAdministratorAccount|guardduty:DisassociateMembers, ?detector)", "service_state(administrator_relationship_active)"]
      false_positive_note: >-
        Only meaningful when an Organizations delegated-administrator relationship is
        active. If GuardDuty is deployed per-account without Organizations aggregation,
        this action has no additional impact beyond local detector management. The
        cover-tracks value is limited to central/org-level monitoring: the member
        account's local detector still generates findings visible to local principals.
        This is NOT a cross-account escalation — do not emit CanEnterAccount. The
        disassociation removes the member from central aggregation but does not grant
        the attacker access to the admin account or any other account.
      narrative: >-
        {principal.name} can sever {detector.name}'s connection to the GuardDuty
        Organizations delegated administrator (guardduty:DisassociateFromAdministratorAccount
        or guardduty:DisassociateMembers), removing this account from centralized
        security monitoring. Local findings are still generated but invisible to the
        central SOC.

  # --- 6) Update publishing destination — multi-purpose evasion (exfiltration + cover-tracks)
  # guardduty:UpdatePublishingDestination allows changing where GuardDuty findings
  # are exported (S3 bucket or Amazon Detective graph). An attacker can redirect
  # findings to an attacker-controlled bucket, exfiltrating all security telemetry
  # (finding metadata, IOCs, account IDs, instance IDs, API patterns). Additionally,
  # this severs the central SOC's export stream, creating a blind spot if the
  # attacker overwrites or deletes the original publishing destination.
  - id: aws-gd-update-publishing-destination
    emits: CanModifyConfiguration
    description: "Redirect GuardDuty findings export to an attacker-controlled S3 bucket, exfiltrating security telemetry and severing central SOC visibility."
    match:
      - [ ?principal, HasPermission, ?detector ]
    where:
      - "node_type(?detector) == SecurityService"
      - "?detector.provider_type == 'AWS::GuardDuty::Detector'"
      - "?principal has EFFECTIVE guardduty:UpdatePublishingDestination on ?detector"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?detector
      permissions: ["guardduty:UpdatePublishingDestination"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?principal holds effective guardduty:UpdatePublishingDestination.
        BLOCKED if an SCP denies guardduty:UpdatePublishingDestination.
      confidence: 0.85
      derived_from: ["HasPermission(?principal, guardduty:UpdatePublishingDestination, ?detector)"]
      false_positive_note: >-
        Legitimate use: changing publishing destination for operational reasons
        (different S3 bucket for lifecycle archival, switching from S3 to Detective
        graph). The evasion value is highest when the attacker controls the new
        destination (attacker-managed S3 bucket with anonymous read access, or a
        compromised account whose Detective graph exports to the attacker). This
        edge is correct regardless of the new destination because the permission
        grants the capability to redirect at any time. It combines two attack
        patterns: (1) exfiltration of findings (operational telemetry useful for
        reconnaissance and understanding SOC detection capabilities) and (2) cover-tracks
        (severing the central export if the new destination is inaccessible or if
        the attacker deletes the original destination, causing the export to fail).
        Not a privilege-escalation path. Confidence 0.85 reflects that destination
        redirection alone does not guarantee exfiltration (attacker must also control
        the new destination and have credentials to read it).
      narrative: >-
        {principal.name} can redirect GuardDuty findings exports from {detector.name}
        (guardduty:UpdatePublishingDestination) to an attacker-controlled S3 bucket or
        account, exfiltrating all exported findings (including finding metadata, IOCs,
        account IDs, instance IDs, and API call patterns) and potentially severing the
        central SOC's monitoring stream.

  # --- 7) Update findings feedback — poison ML model & bypass SOAR automation ----
  # guardduty:UpdateFindingsFeedback allows marking findings as FALSE_POSITIVE.
  # While the finding still exists in the database, marking it as FALSE_POSITIVE
  # affects: (1) analyst triage workflows (many SOC playbooks skip false-positive
  # findings), (2) GuardDuty's machine-learning model (repeated false-positive
  # feedback can train the model to suppress similar findings in the future),
  # and (3) central aggregation dashboards (findings marked FALSE_POSITIVE often
  # appear in separate UI sections or are filtered out). An attacker can mass-mark
  # their activity as false positives to reduce SOC response and poison the
  # detection model for subsequent similar attacks.
  - id: aws-gd-update-findings-feedback
    emits: CanModifyConfiguration
    description: "Mark GuardDuty findings as FALSE_POSITIVE to bypass SOAR automation, poison the ML model, and reduce SOC visibility."
    match:
      - [ ?principal, HasPermission, ?detector ]
    where:
      - "node_type(?detector) == SecurityService"
      - "?detector.provider_type == 'AWS::GuardDuty::Detector'"
      - "?principal has EFFECTIVE guardduty:UpdateFindingsFeedback on ?detector"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?detector
      permissions: ["guardduty:UpdateFindingsFeedback"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?principal holds effective guardduty:UpdateFindingsFeedback.
        BLOCKED if an SCP denies guardduty:UpdateFindingsFeedback.
      confidence: 0.70
      derived_from: ["HasPermission(?principal, guardduty:UpdateFindingsFeedback, ?detector)"]
      false_positive_note: >-
        Legitimate use: SOC analysts marking findings they have investigated and
        confirmed as false positives (benign scanner activity, known test traffic).
        The evasion value is lower than deletion or suppression because the finding
        remains in the database (discoverable via API, audit logs, and Detective graphs)
        and an analyst reviewing feedback history will see the FALSE_POSITIVE mark.
        However, the operational impact is meaningful: automated SOAR playbooks
        configured to skip FALSE_POSITIVE findings will not respond, reducing mean-time-to-response
        (MTTR). Additionally, repeated false-positive feedback on similar finding
        types can affect GuardDuty's ML model, reducing alert volume for that finding
        class in the future (even for legitimate similar activity). Confidence is 0.70
        (lower than deletion/disable/suppression) because the suppression is
        behavioral and reversible, and an analyst with access to feedback history can
        recover the truth. Not a privilege-escalation path.
      narrative: >-
        {principal.name} can mark GuardDuty findings from {detector.name} as
        FALSE_POSITIVE (guardduty:UpdateFindingsFeedback), potentially bypassing
        automated SOC playbooks that skip false-positive findings and potentially
        poisoning GuardDuty's machine-learning model with repeated false-positive
        feedback to suppress similar findings in future detections.

  # --- 8) Read findings — low-value reconnaissance ---------------------------
  # An attacker with read access to GuardDuty findings can enumerate what
  # GuardDuty has already detected (e.g. check whether their prior activity
  # generated a finding). This is reconnaissance, not escalation.
  # Per Phase-12 guidance for low-relevance recon: 1 conservative rule.
  - id: aws-gd-read-findings
    emits: CanRead
    description: "Read GuardDuty findings to enumerate detected threats — useful for an attacker to confirm whether their activity was detected."
    match:
      - [ ?principal, HasPermission, ?detector ]
    where:
      - "node_type(?detector) == SecurityService"
      - "?detector.provider_type == 'AWS::GuardDuty::Detector'"
      - "?principal has EFFECTIVE guardduty:ListFindings AND guardduty:GetFindings on ?detector"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?detector
      permissions: ["guardduty:ListFindings", "guardduty:GetFindings"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when both list and get findings are effective. BLOCKED if SCP denies
        either action.
      confidence: 0.75
      derived_from: ["HasPermission(?principal, guardduty:ListFindings, ?detector)", "HasPermission(?principal, guardduty:GetFindings, ?detector)"]
      false_positive_note: >-
        Read access to findings is low attack value on its own — it provides
        situational awareness to the attacker (have I been detected?) but does not
        suppress findings or grant access. Many legitimate roles (SOC analysts,
        audit accounts) hold this permission. Confidence is 0.75 because the finding
        content (account IDs, instance IDs, network IOCs, API call patterns) is
        operationally sensitive but does not constitute credential material. Do NOT
        emit ContainsSecret or CanReadSecret for GuardDuty findings. This edge is
        for reconnaissance modeling only.
      narrative: >-
        {principal.name} can list and retrieve GuardDuty findings from {detector.name}
        (guardduty:ListFindings, guardduty:GetFindings), allowing an attacker to
        enumerate what threat activity has been detected and confirm whether their
        prior actions generated observable findings.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - An SCP denying guardduty:DeleteDetector blocks aws-gd-delete-detector.
#   - An SCP denying guardduty:UpdateDetector blocks aws-gd-disable-detector.
#   - An SCP denying both guardduty:CreateFilter and guardduty:UpdateFilter
#     blocks aws-gd-suppress-findings-filter.
#   - An SCP denying both guardduty:CreateIPSet and guardduty:UpdateIPSet
#     blocks aws-gd-trusted-ip-suppress.
#   - An AWS Organizations managed GuardDuty deployment with AutoEnable and
#     member account restricted from disassociation via SCP means
#     aws-gd-disassociate-member is BLOCKED.
#   - Recommend SCP: Deny guardduty:DeleteDetector + guardduty:UpdateDetector
#     (Enable=false) for all non-security-admin accounts.
#
# CHAINS THIS FILE DOES NOT PRODUCE (by design):
#   - CanExecuteAs: GuardDuty has no execution identity the attacker can hijack.
#   - CanEnterAccount: disassociation is evasion, not cross-account access.
#   - CanEscalateTo: GuardDuty tampering is cover-tracks, not privilege escalation.
#   - ContainsSecret / CanReadSecret: findings contain operational IOCs, not secrets.
# ---------------------------------------------------------------------------

# NOTE: Explicit normalization rules should be maintained in /rules/explicit/aws-guardduty.yaml
# to produce the HasPermission edges this derived file consumes. The embedded
# explicit_rules section (previously at lines 316-386) was removed as it was never
# processed by any engine/loader script and created dead-code maintenance burden.
# The derived rules above consume HasPermission edges that must be produced by the
# explicit normalization layer (iam_permission condition evaluator) during the
# permission evaluation phase.
