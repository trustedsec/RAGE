# AWS Global Accelerator — Derived attack-path rules (Phase 8 — networking)
# ---------------------------------------------------------------------------
# Global Accelerator provides two anycast static IPv4 addresses at AWS edge
# PoPs that front Listeners -> Endpoint Groups -> Endpoint targets (ALB, NLB,
# EC2, EIP). Traffic flows over the AWS private backbone from edge to endpoint.
#
# ATTACK SURFACE (low-relevance service — 2 conservative rules):
#
#   (1) EXPOSURE FACT: a DEPLOYED accelerator's anycast IPs are internet-routable
#       -> ExposedToInternet(accelerator, AnonymousIdentity) and
#       RoutesTo(accelerator, endpoint) for each active endpoint group target.
#       These are pure configuration facts, not capability derivations — they
#       require no additional edges to combine.
#
#   (2) WEAKEN CONTROLS: a principal with globalaccelerator:UpdateEndpointGroup or
#       globalaccelerator:AddEndpoints can redirect internet-facing anycast traffic
#       to an alternate or attacker-influenced endpoint within the account
#       -> CanModifyConfiguration(identity, accelerator). This is a
#       traffic-redirection / defense-evasion primitive, NOT a code-execution or
#       credential-access path.
#
# WHAT THESE RULES DO NOT EMIT:
#   - CanExecuteAs / CanEscalateTo: modifying routing does not grant IAM creds.
#   - CanNetworkReach (transitive): the "accelerator + SG + VPC route -> host"
#     composition is reserved for the future network-chains linchpin file.
#   - CrossAccountTrust: endpoints are restricted to the same account; no cross-
#     account endpoint references are supported by the service.
#   - ExposedToInternet on endpoints: the accelerator is the internet-facing node;
#     internal ALB endpoints remain internal on their own DNS/IP.
#
# NODE CLASS CONFORMANCE (schema/nodes.yaml + schema/edges.yaml):
#   Accelerator maps to generic_type LoadBalancer (class Network).
#   ExposedToInternet: source set includes LoadBalancer (Network class) ✓
#                      target = AnonymousIdentity (Identity class) ✓
#   RoutesTo:          source set = [Route, Subnet, TransitGateway].
#                      NOTE: RoutesTo in edges.yaml is declared for routing
#                      infrastructure (Route, Subnet, TGW -> Network/Subnet).
#                      A LoadBalancer-to-endpoint forwarding fact is structurally
#                      analogous but the source is LoadBalancer, not Route/Subnet.
#                      We emit RoutesTo with source_type LoadBalancer as an
#                      explicit fact (nature: explicit per the normalizer below);
#                      if the linter flags source conformance, map to CanInvoke
#                      (Messaging/APIGateway -> ServerlessFunction) or model the
#                      Listener as a Route node.
#   CanModifyConfiguration: source = [Identity] ✓, target = [Network, "*"] ✓
#
# PERMISSIONS — exact action names from:
#   https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsglobalaccelerator.html
#
# CITE (do NOT duplicate): can-control.yaml for terminal Controls /
#   CanEscalateTo / CanEnterAccount roll-ups that may follow from
#   CanModifyConfiguration chains on downstream endpoint services.
# ---------------------------------------------------------------------------

provider: aws
phase: 8-networking
service: globalaccelerator
applies_to: [aws]

# ===========================================================================
# EXPLICIT normalization rules — raw config -> explicit edges.
# Kept co-located for low-relevance services per project convention.
# ===========================================================================
explicit_rules: []

# ===========================================================================

# ===========================================================================
# DERIVED rules — combine HasPermission + accelerator facts -> capability edges
# ===========================================================================
rules:

  # --- Accelerator deployed -> ExposedToInternet (derived fact) ---------------
  # Per Phase 8 discipline: network exposure facts are derived, not emitted as
  # explicit edges from raw config. This rule observes an Accelerator node
  # (produced by the normalizer as an explicit structural fact) with Status=DEPLOYED
  # and Enabled=true, then derives that it is ExposedToInternet.
  - id: aws-globalaccelerator-internet-exposure
    emits: ExposedToInternet
    description: >-
      A DEPLOYED Global Accelerator with anycast IPs enabled is internet-reachable.
      This rule derives the exposure fact from the normalizer's structural Accelerator node.
    applies_to: [aws]
    match:
      - [ ?accelerator, IsOfType, LoadBalancer ]
    where:
      - "?accelerator.provider_type == 'AWS::GlobalAccelerator::Accelerator'"
      - "?accelerator.Status == 'DEPLOYED'"
      - "?accelerator.Enabled == true"
      - "?accelerator.IpSets is non-empty"
    emit:
      source_type: LoadBalancer
      target_type: AnonymousIdentity
      source: ?accelerator
      target: "<AnonymousIdentity>"
      state: ACTIVE
      permissions: []
      conditions: [service_state]
      state_logic: >-
        ACTIVE when Status == DEPLOYED and Enabled == true.
        CONDITIONAL(service_state) when Status == IN_PROGRESS or Enabled == false.
      derived_from: ["accelerator_normalization (structural fact)"]
      confidence: 1.0
      false_positive_note: >-
        Do NOT emit for accelerators with Status != DEPLOYED or Enabled == false.
        Do NOT emit ExposedToInternet on backend endpoints; the accelerator is the
        internet-facing node. Internal ALB endpoints remain internal even when
        reachable via the accelerator's anycast IPs.
      narrative: >-
        {source.name} (AWS Global Accelerator) is deployed with anycast static IPs
        that are reachable from any host on the public internet. Backend endpoints
        in its Endpoint Groups receive internet traffic forwarded via these IPs.

  # --- Active endpoint group target -> CanNetworkReach (derived forwarding fact) -
  # Per Phase 8 discipline: network reachability from per-service forwarding rules
  # is always CONDITIONAL(network_reachability). The edge captures the accelerator's
  # forwarding configuration; end-to-end internet-to-endpoint traversability is
  # composed by the future network-chains linchpin.
  - id: aws-globalaccelerator-routes-to-endpoint
    emits: CanNetworkReach
    description: >-
      An active Endpoint Group with healthy endpoints forwards traffic from the
      accelerator to each endpoint. Emits CanNetworkReach CONDITIONAL on network
      reachability, per Phase 8 discipline for per-service network facts.
    applies_to: [aws]
    match:
      - [ ?accelerator, IsOfType, LoadBalancer ]
      - [ ?endpointGroup, IsOfType, GenericNetwork ]
      - [ ?accelerator, Contains, ?endpointGroup ]
    where:
      - "?accelerator.provider_type == 'AWS::GlobalAccelerator::Accelerator'"
      - "?endpointGroup.provider_type == 'AWS::GlobalAccelerator::EndpointGroup'"
      - "?accelerator.Status == 'DEPLOYED' and ?accelerator.Enabled == true"
      - "?endpointGroup.TrafficDialPercentage > 0"
      - "exists endpoint in ?endpointGroup.EndpointDescriptions where endpoint.Weight > 0 and endpoint.HealthState == 'HEALTHY'"
    emit:
      source_type: LoadBalancer
      target_type: LoadBalancer
      source: ?accelerator
      target: "<Endpoint target node (ALB/NLB/EC2/EIP resolved from EndpointId)>"
      state: CONDITIONAL
      permissions: []
      conditions: [network_reachability, service_state]
      state_logic: >-
        CONDITIONAL(network_reachability) — per Phase 8 discipline, all per-service
        network forwarding facts start as CONDITIONAL. The full end-to-end
        internet-to-endpoint reachability chain (accounting for SGs, VPC routes,
        endpoint service configuration) is composed by the future network-chains
        linchpin file. Do NOT emit for UNHEALTHY endpoints — AWS removes them from
        the active routing pool; they receive zero traffic.
      derived_from: ["accelerator_normalization", "endpoint_group_normalization"]
      confidence: 1.0
      false_positive_note: >-
        Do NOT emit when TrafficDialPercentage == 0 (group configured but not
        routing), when endpoint Weight == 0 (endpoint excluded), or when endpoint
        HealthState == UNHEALTHY (endpoint not in active pool). Endpoints must be
        resolved to native resource nodes; do not emit pointing to bare endpoint
        descriptions. Endpoints are restricted to the same account as the accelerator
        — no cross-account forwarding. This edge captures per-service forwarding
        configuration only; transitive reachability is future linchpin scope.
      narrative: >-
        {source.name} (Global Accelerator) forwards internet traffic to {target.name}
        via an active Endpoint Group (traffic-dial: {TrafficDialPercentage}%, endpoint
        weight: {Weight}). Internet clients reaching the accelerator's anycast IPs
        are forwarded to this healthy endpoint over the AWS private backbone.

  # --- Modify endpoint group / add endpoint -> CanModifyConfiguration -------
  # NOTE on target scope: UpdateEndpointGroup and AddEndpoints act on EndpointGroup
  # resources (AWS::GlobalAccelerator::EndpointGroup ARN scope), not directly on the
  # Accelerator ARN. However, modifying endpoint groups effectively redirects the
  # accelerator's traffic, so the capability is expressed as CanModifyConfiguration
  # on the accelerator (the traffic-facing node). Matching against HasPermission on
  # the EndpointGroup or Accelerator will both capture the same threat.
  - id: aws-globalaccelerator-modify-config
    emits: CanModifyConfiguration
    description: >-
      A principal with globalaccelerator:UpdateEndpointGroup or
      globalaccelerator:AddEndpoints can redirect internet-bound anycast traffic
      to a different or attacker-influenced endpoint within the account
      (traffic hijack / defense evasion).
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?target ]
    where:
      - >-
        (node_type(?target) == LoadBalancer and ?target.provider_type == 'AWS::GlobalAccelerator::Accelerator') or
        (node_type(?target) == GenericNetwork and ?target.provider_type == 'AWS::GlobalAccelerator::EndpointGroup')
      - >-
        effective_action_on(?principal, ?target) intersects [
          'globalaccelerator:UpdateEndpointGroup',
          'globalaccelerator:AddEndpoints',
          'globalaccelerator:UpdateListener',
          'globalaccelerator:UpdateAcceleratorAttributes'
        ]
    emit:
      source_type: Identity
      target_type: LoadBalancer
      source: ?principal
      target: "if(node_type(?target) == LoadBalancer, ?target, parent Accelerator of ?target)"
      permissions:
        - "globalaccelerator:UpdateEndpointGroup"
        - "globalaccelerator:AddEndpoints"
        - "globalaccelerator:UpdateListener"
        - "globalaccelerator:UpdateAcceleratorAttributes"
      conditions: [iam_permission, scp_or_org_policy]
      state_logic: >-
        ACTIVE when effective_action_on(?principal, ?target) includes at least
        one of the listed actions and no SCP / permission boundary explicitly denies
        them. BLOCKED when an SCP denies globalaccelerator:UpdateEndpointGroup or
        globalaccelerator:AddEndpoints at the account scope.
      confidence: "min(contributing_confidences) * 0.9"
      derived_from: [ "<HasPermission edge_id>" ]
      false_positive_note: >-
        This edge models TRAFFIC REDIRECTION, not IAM privilege escalation or
        code execution. Do NOT chain to CanExecuteAs or CanEnterAccount from this
        edge alone — modifying a routing config does not grant AWS credentials.
        The blast radius is limited to intra-account endpoint targets (cross-account
        endpoints are unsupported by the service). UpdateAcceleratorAttributes
        (flow-log destination change) is a defense-evasion primitive (suppresses
        network telemetry) rather than a routing change; include it in the
        permission set but note its distinct effect. Honor SCP scoping: many
        organizations restrict globalaccelerator:* to specific roles. Permissions
        may be scoped to EndpointGroup or Accelerator ARNs; both are captured here.
      narrative: >-
        {principal.name} can modify the Global Accelerator {target.name}
        (globalaccelerator:UpdateEndpointGroup / AddEndpoints), allowing it to
        redirect internet-facing anycast traffic from the accelerator's static IPs
        to a different or unintended endpoint within the account. If
        globalaccelerator:UpdateAcceleratorAttributes is also held, it can redirect
        or disable flow logs, suppressing network traffic telemetry.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - An SCP denying globalaccelerator:UpdateEndpointGroup or
#     globalaccelerator:AddEndpoints -> emit aws-globalaccelerator-modify-config
#     with state: BLOCKED and denied_by=<SCP arn/statement>.
#   - An SCP denying globalaccelerator:CreateAccelerator prevents new accelerators
#     from being created (no new exposure facts arise from that principal).
#
# LINCHPIN CITATIONS (do NOT duplicate):
#   can-control.yaml:control-via-admin        — if CanAdminister(identity, accelerator)
#                                               is derived upstream, Controls follows.
#   network-chains.yaml (future)              — transitive reachability from
#                                               ExposedToInternet + RoutesTo -> endpoint
#                                               service chain will be composed here.
# ---------------------------------------------------------------------------
