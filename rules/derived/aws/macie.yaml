# AWS Macie — Derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# Macie is a DETECTIVE-ONLY service: it classifies S3 data and surfaces findings.
# It runs no customer code, uses no customer-supplied execution role, and is not
# a preventive guardrail. The two modeled security primitives are:
#
#   (1) EVASION — Disabling (macie2:DisableMacie) or pausing
#       (macie2:UpdateMacieSession with status=PAUSED) Macie removes
#       sensitive-data classification and alerting from the account. This is a
#       weaken-defenses / cover-tracks / destructive primitive.
#       Emit: CanDelete for DisableMacie (permanent, destructive).
#       Emit: CanModifyConfiguration for UpdateMacieSession (temporary pause).
#       Do NOT chain to CanExecuteAs, CanEnterAccount, or any escalation edge.
#       Detective controls do NOT produce BLOCKED state — only preventive
#       guardrails (SCPs, deny assignments, permission boundaries) do.
#
#   (2) RECON — reading Macie findings (macie2:GetFindings) reveals the exact
#       S3 objects and buckets that contain sensitive data (credentials, PII,
#       API keys). This is an intelligence-gathering primitive that can
#       accelerate targeted exfiltration but does NOT itself grant access to
#       those objects.
#       Emit: CanRead on the SecurityService node (recon).
#
# These edges are produced directly from permission-evaluation hits; no
# separate explicit rule file is required because all three edges are fully
# characterized by a single effective-permission check with no additional graph
# pattern. Provider docs: https://docs.aws.amazon.com/macie/latest/user/
# ---------------------------------------------------------------------------

provider: aws
phase: 12-security-logging
applies_to: [aws]

rules:

  # --- Disable Macie -> evasion (permanent) ---------------------------------
  - id: aws-macie-disable-evasion
    emits: CanDelete
    description: >-
      Disabling Macie (macie2:DisableMacie) permanently disables the service,
      deletes all configurations and findings, and removes sensitive-data
      classification from the account — a weaken-defenses / cover-tracks
      / destructive primitive.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?macie_session ]
    where:
      - "node_type(?macie_session) == SecurityService"
      - "?macie_session.provider_type == 'AWS::Macie::Session'"
      - >-
        effective_permission(?principal, ?macie_session) contains
        'macie2:DisableMacie'
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?macie_session
      permissions:
        - "macie2:DisableMacie"
      state_logic: >-
        if effective_permission includes macie2:DisableMacie and no
        SCP/boundary denies it: ACTIVE else BLOCKED
      confidence: "0.95"
      derived_from:
        - "?principal HasPermission ?macie_session"
      false_positive_note: >-
        This is a DESTRUCTIVE EVASION primitive only. Disabling Macie
        permanently removes detective coverage and deletes findings; it does
        NOT grant access to S3, IAM, or any other resource. Do NOT chain this
        edge to CanExecuteAs, CanEnterAccount, or any escalation edge.
        Downgrade to BLOCKED if an SCP denies macie2:DisableMacie at the org level.
      narrative: >-
        {principal.name} can permanently disable Amazon Macie
        (macie2:DisableMacie), eliminating sensitive-data classification and
        finding generation in {macie_session.account}. This removes a detective
        control and reduces the likelihood that S3 exfiltration or credential
        exposure will be detected — a cover-tracks / weaken-defenses primitive.

  # --- Pause Macie -> evasion (temporary) ----------------------------------
  - id: aws-macie-pause-evasion
    emits: CanModifyConfiguration
    description: >-
      Pausing Macie (macie2:UpdateMacieSession with status=PAUSED) temporarily
      stops sensitive-data classification and finding generation from the account
      without deleting configurations or findings — a weaken-defenses /
      cover-tracks primitive.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?macie_session ]
    where:
      - "node_type(?macie_session) == SecurityService"
      - "?macie_session.provider_type == 'AWS::Macie::Session'"
      - >-
        effective_permission(?principal, ?macie_session) contains
        'macie2:UpdateMacieSession'
      - "?macie_session.status == 'ENABLED'"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?macie_session
      permissions:
        - "macie2:UpdateMacieSession"
      state_logic: >-
        if effective_permission includes macie2:UpdateMacieSession and no
        SCP/boundary denies it and ?macie_session.status == ENABLED: CONDITIONAL
        else BLOCKED
      confidence: "0.90"
      derived_from:
        - "?principal HasPermission ?macie_session"
      false_positive_note: >-
        This is a CONDITIONAL EVASION primitive. macie2:UpdateMacieSession can
        change the status to PAUSED (stopping finding generation) or change the
        sampling rate (partial finding suppression). Only status=PAUSED or
        macie2:DisableMacie fully stops finding generation. If the principal can
        only change the sampling rate (not pause), this is CONDITIONAL, not ACTIVE.
        Do NOT chain this edge to CanExecuteAs, CanEnterAccount, or any escalation
        edge. Downgrade to BLOCKED if an SCP denies macie2:UpdateMacieSession at
        the org level.
      narrative: >-
        {principal.name} can pause Amazon Macie
        (macie2:UpdateMacieSession), suspending sensitive-data classification
        and finding generation in {macie_session.account} without permanently
        deleting configurations. This removes a detective control and reduces
        the likelihood that S3 exfiltration or credential exposure will be
        detected — a cover-tracks / weaken-defenses primitive.

  # --- Read Macie findings -> sensitive-data oracle (recon) -----------------
  - id: aws-macie-findings-recon
    emits: CanRead
    description: >-
      Reading Macie findings (macie2:GetFindings) reveals the precise S3 objects
      and locations where sensitive data — credentials, API keys, PII — was
      detected. This is a recon / targeting primitive.
    applies_to: [aws]
    match:
      - [ ?principal, HasPermission, ?macie_session ]
    where:
      - "node_type(?macie_session) == SecurityService"
      - "?macie_session.provider_type == 'AWS::Macie::Session'"
      - >-
        effective_permission(?principal, ?macie_session) contains
        'macie2:GetFindings'
    emit:
      source_type: Identity
      target_type: SecurityService
      source: ?principal
      target: ?macie_session
      permissions:
        - "macie2:GetFindings"
      state_logic: >-
        if effective_permission includes macie2:GetFindings and no
        SCP/boundary denies it: ACTIVE else BLOCKED
      confidence: "0.85"
      derived_from:
        - "?principal HasPermission ?macie_session"
      false_positive_note: >-
        Reading findings is RECON only. A finding describes which S3 object
        contains a credential or PII; it does NOT give the attacker that
        credential. Do NOT emit CanReadSecret or ExposesCredential on the
        Macie session node itself — those edges belong on the S3 objects
        identified within the findings, if modeled. For delegated-admin
        accounts (Macie Organizations integration), macie2:GetFindings covers
        member-account findings; scope confidence to 0.80 when the principal
        is in the admin account reading across org members (broader blast
        radius, same primitive).
      narrative: >-
        {principal.name} can read Amazon Macie findings (macie2:GetFindings),
        which identify the exact S3 objects and buckets where sensitive data —
        including AWS credentials, API keys, and PII — was detected. This
        provides a precise targeting map for exfiltration but does not itself
        grant access to those objects.
