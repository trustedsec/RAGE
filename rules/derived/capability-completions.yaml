# Capability-completion rules — produce the walkable edges that previously had no producer:
# CanExecuteOn (execution roll-up), CanReplace (create+modify takeover), CanCreateKey (key-mint
# permission), AuthenticatesTo (credential -> service/DB endpoint). Provider-agnostic; grounded in
# existing edges + effective permissions, so no new collection is required. See spec/edges.md.
applies_to: ["*"]
rules:

  # 1) CanExecuteOn — the generalized "get code running on this resource" superset. Materialized as a
  #    convenience edge from any specific execution capability (canonicalization: producers emit the
  #    specific edge; this rolls it up). spec/edges.md subsumption table.
  - id: execute-on-rollup
    emits: CanExecuteOn
    description: "Any specific execution capability on a compute resource implies the generalized CanExecuteOn."
    applies_to: ["*"]
    match:
      - [ ?principal, ?exec, ?compute ]
    where:
      - "?exec in [CanExecuteCommand, CanInvoke, CanDeploy, CanModifyCode, CanModifyConfiguration, CanStart, CanTrigger, CanSchedule, CanExecuteAs]"
      - "node_class(?compute) == Compute"
    emit:
      source_type: Identity
      target_type: Compute
      source: ?principal
      target: ?compute
      derived_from: [ "?principal ?exec ?compute" ]
      # state inherits the matched execution edge (weakest-contributor merge; see rules.md)
      narrative: "{principal.name} can get code running on {compute.name} (via {edge:?exec})."

  # 2) CanReplace — delete+recreate a resource to inherit its name/identity/trust. A principal that
  #    can both create the type and modify/replace the instance can perform the takeover.
  - id: create-modify-yields-replace
    emits: CanReplace
    description: "A principal that can create a resource type and modify the instance can delete+recreate it to inherit its identity/trust."
    applies_to: ["*"]
    match:
      - [ ?principal, CanCreate, ?resource ]
      - [ ?principal, CanModify, ?resource ]
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?resource
      conditions: [ iam_permission ]
      derived_from: [ "?principal CanCreate ?resource", "?principal CanModify ?resource" ]
      narrative: "{principal.name} can create and modify {resource.name}, so it can delete+recreate it to inherit its identity/trust."

  # 3) CanCreateKey — effective permission to mint an encryption key or service-account key. Overlaps
  #    CanCreateCredentialFor for SA keys (see edges.md subsumption); retained as the key-material view.
  - id: create-key-capability
    emits: CanCreateKey
    description: "A principal whose effective permissions include key or service-account-key creation can mint new keys."
    applies_to: ["*"]
    match:
      - [ ?principal, HasPermission, ?target ]
    where:
      - "node_type(?target) in [EncryptionKey, ServiceAccount]"
      - "effective_action_on(?principal, ?target) intersects ['kms:CreateKey', 'iam:CreateServiceAccountKey', 'iam.serviceAccountKeys.create', 'cloudkms.cryptoKeys.create']"
    emit:
      source_type: Identity
      target_type: EncryptionKey
      source: ?principal
      target: ?target
      conditions: [ iam_permission ]
      derived_from: [ "?principal HasPermission ?target" ]
      narrative: "{principal.name} can create keys on {target.name}."

  # 4) AuthenticatesTo — reading a credential that authenticates to a service/DB endpoint lets the
  #    reader authenticate to that endpoint. This is the non-identity analog of
  #    read-credential-yields-identity (which excludes plain users/DB/service endpoints).
  - id: credential-authenticates-to-service
    emits: AuthenticatesTo
    description: "Reading a credential that is credentials for a data/messaging service endpoint lets the reader authenticate to that endpoint."
    applies_to: ["*"]
    match:
      - [ ?principal, CanReadCredential, ?credential ]
      - [ ?credential, CredentialsFor, ?target ]
    where:
      - "node_class(?target) in [Data, Messaging]  # DB/queue/service endpoints, not identities (those -> CanImpersonate)"
    emit:
      source_type: Identity
      target_type: Data
      source: ?principal
      target: ?target
      conditions: [ iam_permission, resource_policy ]
      derived_from: [ "?principal CanReadCredential ?credential", "?credential CredentialsFor ?target" ]
      narrative: "{principal.name} can read {credential.name}, which authenticates to {target.name}."
