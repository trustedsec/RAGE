# Roll-up rules producing the terminal Controls / CanEscalateTo / CanEnter* edges
# used by objective queries. These collapse capability chains into single
# objective-attainment edges while preserving derived_from for explainability.

rules:

  - id: control-via-admin
    emits: Controls
    description: "Admin over a resource = control of it."
    applies_to: ["*"]
    match:
      - [ ?attacker, CanAdminister, ?resource ]
    emit:
      source_type: Identity
      target_type: "*"
      source: ?attacker
      target: ?resource
      state_logic: "ACTIVE"
      derived_from: [ "?attacker CanAdminister ?resource" ]

  - id: control-boundary-via-iam-admin
    emits: Controls
    description: "Ability to grant permissions at a boundary scope = control of that boundary."
    applies_to: ["*"]
    match:
      - [ ?attacker, CanGrantPermission, ?principal ]
    where:
      - scope_of(?attacker, CanGrantPermission) is a boundary   # account/sub/project/folder/org
    emit:
      source_type: Identity
      target_type: "*"
      source: ?attacker
      target: "<boundary of the grant scope>"
      state_logic: "ACTIVE"
      derived_from: [ "?attacker CanGrantPermission ?principal @boundary" ]
      evidence:
        narrative_template: >
          {attacker.name} can assign roles/permissions at {boundary.name} scope
          and can therefore grant itself full control of {boundary.name}.

  - id: escalate-via-execute-as
    emits: CanEscalateTo
    description: "Executing as a strictly-more-privileged identity is escalation."
    applies_to: ["*"]
    match:
      - [ ?attacker, CanExecuteAs, ?identity ]
    where:
      - privilege(?identity) > privilege(?attacker)
    emit:
      source_type: Identity
      target_type: Identity
      source: ?attacker
      target: ?identity
      state_logic: "inherit from CanExecuteAs"
      derived_from: [ "?attacker CanExecuteAs ?identity" ]

  - id: enter-account-via-assume
    emits: CanEnterAccount
    description: "Assuming/federating into a role in another account = entering it."
    applies_to: [aws]
    match:
      - [ ?attacker, CanAssume, ?role ]
    where:
      - account_of(?role) != account_of(?attacker)
    emit:
      source_type: Identity
      target_type: Account
      source: ?attacker
      target: "<account of ?role>"
      state_logic: "inherit from CanAssume"
      derived_from: [ "?attacker CanAssume ?role (cross-account)" ]

  # Analogous enter-subscription-via-* (azure) and enter-project-via-impersonation
  # (gcp) rules live in /rules/derived/azure/ and /rules/derived/gcp/.
