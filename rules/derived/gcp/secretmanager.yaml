# GCP Secret Manager — Phase 5 credential-access / attack-path rules
# ---------------------------------------------------------------------------
# Catalog key gcp:secretmanager. Emits ONLY common edges from schema/edges.yaml.
# Permissions are the EFFECTIVE secretmanager.* / cloudkms.* actions the
# permission evaluator must confirm on the given resource scope before the edge
# is emitted.
#
# Central Phase-5 pivot:
#   secretmanager.versions.access -> CanReadSecret(identity -> Secret)
#   payload is a credential -> CredentialsFor(Secret -> Identity/ServiceAccount/Data)
# This completes the Phase-4 -> Phase-5 chain:
#   CanExecuteAs(workloadSA) + workloadSA has versions.access
#     -> CanReadSecret -> CredentialsFor -> become the payload's target identity.
#
# CMEK / key_permission — GCP-SPECIFIC:
#   For a CMEK-encrypted secret, the SECRET MANAGER SERVICE AGENT
#   (service-PROJECT_NUMBER@gcp-sa-secretmanager.iam.gserviceaccount.com), NOT the
#   caller, performs decrypt via roles/cloudkms.cryptoKeyEncrypterDecrypter
#   (cloudkms.cryptoKeyVersions.useToDecrypt). A caller with only versions.access
#   still reads a CMEK secret AS LONG AS the service agent retains the KMS grant.
#   Therefore key_permission is gated on the SERVICE AGENT, never on the caller.
#   Do NOT require caller cloudkms.* for a GCP secret read (that is the AWS model).
#
# State discipline:
#   - versions.access present -> ACTIVE CanReadSecret (non-CMEK).
#   - CMEK secret + service-agent KMS grant present/unknown -> ACTIVE / CONDITIONAL.
#   - CMEK secret + service-agent grant removed or key disabled/destroyed -> BLOCKED.
#   - IAM inheritance: a project/folder/org binding applies to all secrets in
#     scope; keep the target Secret scope precise.
#   - VPC-SC perimeter deny / IAM deny policy denying the action -> BLOCKED.
# ---------------------------------------------------------------------------

provider: gcp
phase: 5-secrets-kms
service: secretmanager
applies_to: [gcp]

rules:

  # --- Read the secret payload (core credential-access primitive) -----------
  - id: gcp-secretmanager-read
    emits: CanReadSecret
    description: "secretmanager.versions.access reads the cleartext payload of a secret."
    match_effective_permission: {action: "secretmanager.versions.access", resource_type: "google.secretmanager.Secret"}
    where:
      - "action resolves to a secret/version in scope (per-secret allow policy OR inherited project/folder/org binding)"
      - "secret is NOT CMEK-encrypted (customerManagedEncryption.kmsKeyName unset) — for CMEK see gcp-secretmanager-read-cmek-gate"
    emit:
      source: "<principal>"
      target: "<secret in scope>"
      permissions: ["secretmanager.versions.access"]
      conditions: [iam_permission, resource_policy]
      state_logic: "ACTIVE if versions.access resolves at the secret scope; BLOCKED if a VPC-SC perimeter or IAM deny policy denies secretmanager.versions.access at the effective scope (denied_by=<perimeter/deny>)"
      confidence: "min(contributing_confidences) * 0.98"
      derived_from: [ "<effective secretmanager.versions.access grant>" ]
      false_positive_note: >-
        versions.access (roles/secretmanager.secretAccessor), NOT versions.get,
        reads the payload — do not emit from versions.get (metadata only). Grant is
        per-secret/per-scope: accessor on secret-a does NOT read secret-b unless the
        binding is at a common ancestor. Honor IAM inheritance scope precisely; a
        project-scoped grant covers all secrets, a secret-scoped grant does not
        widen. A VPC-SC perimeter or IAM deny denying versions.access -> BLOCKED.
      narrative: >-
        {principal.name} can read the payload of secret {secret.name}
        (secretmanager.versions.access / roles/secretmanager.secretAccessor).

  # --- Read a CMEK-encrypted secret (service-agent key_permission gate) ------
  - id: gcp-secretmanager-read-cmek-gate
    emits: CanReadSecret
    description: "Read a CMEK-encrypted secret; decrypt is done by the Secret Manager service agent, not the caller."
    match_effective_permission: {action: "secretmanager.versions.access", resource_type: "google.secretmanager.Secret"}
    where:
      - "secret IS CMEK-encrypted (customerManagedEncryption.kmsKeyName set)"
    emit:
      source: "<principal>"
      target: "<CMEK-encrypted secret in scope>"
      permissions: ["secretmanager.versions.access"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        ACTIVE if the Secret Manager service agent
        (service-PROJECT_NUMBER@gcp-sa-secretmanager.iam.gserviceaccount.com) holds
        cloudkms.cryptoKeyVersions.useToDecrypt (roles/cloudkms.cryptoKeyEncrypterDecrypter)
        on kmsKeyName AND the key/version is ENABLED;
        CONDITIONAL(key_permission) if the service-agent grant or key state is unknown;
        BLOCKED if the service agent lacks the grant OR the key is DISABLED/DESTROYED
        OR a KMS deny applies (versions.access then returns an error).
      confidence: "min(contributing_confidences) * 0.95"
      derived_from: [ "<effective secretmanager.versions.access grant>", "<service-agent KMS binding on kmsKeyName>" ]
      false_positive_note: >-
        GCP-SPECIFIC: the key_permission gate is on the SERVICE AGENT, NOT the
        caller. Do NOT require the accessing principal to hold cloudkms.* — a caller
        with only versions.access reads a CMEK secret while the service agent keeps
        useToDecrypt. Requiring caller KMS decrypt (AWS Secrets Manager model)
        produces false negatives here. Only downgrade to CONDITIONAL/BLOCKED based on
        the SERVICE AGENT's grant and the key's enabled state.
      narrative: >-
        {principal.name} can read CMEK-encrypted secret {secret.name}
        (secretmanager.versions.access); the Secret Manager service agent (not the
        caller) decrypts it via cloudkms.cryptoKeyEncrypterDecrypter on {key.name} —
        access holds while the agent retains that grant and the key is enabled.

  # --- Payload is a credential for another identity (the pivot) --------------
  - id: gcp-secretmanager-credentials-for
    emits: CredentialsFor
    description: "The secret's payload authenticates as another identity / service account / data store."
    match_record: {resource_type: "google.secretmanager.Secret", field: "payload_classification (name/labels/annotations)"}
    where:
      - "payload is classified as a credential: SA JSON key -> ServiceAccount; OAuth/API token -> owning Identity; DB connection string / password -> Data store"
    emit:
      source: "<secret>"
      target: "<target identity | service account | data store the payload authenticates>"
      permissions: []
      conditions: []
      state_logic: "ACTIVE when the payload class is determined from metadata; POTENTIAL when the credential type is unresolved (unknown payload)"
      confidence: "0.7 (heuristic classification) — raise to 0.95 when the SA/user/DB is explicitly named in labels/annotations"
      derived_from: [ "<secret payload classification evidence>" ]
      false_positive_note: >-
        ASSERTION, not an observed value. Emit only when metadata (name/labels/
        annotations) indicates a credential and identifies the target. NEVER read the
        payload to confirm. If the payload type or target is unknown, emit POTENTIAL
        (or omit) rather than a concrete CredentialsFor to a guessed identity. Zero
        base weight: value comes only when paired with CanReadSecret.
      narrative: >-
        Secret {secret.name} holds credentials for {target.name}; reading its payload
        yields usable credentials for {target.name}.

  # --- CanReadSecret completes an execute-as chain (Phase-4 -> Phase-5) ------
  - id: gcp-secretmanager-read-via-execute-as
    emits: CanReadSecret
    description: "A principal that can execute as a workload SA holding versions.access can read the secret."
    match:
      - [ ?principal, CanExecuteAs, ?sa ]
    where:
      - "?sa has EFFECTIVE secretmanager.versions.access on ?secret (per-secret or inherited)"
      - "node_type(?secret) == Secret"
    emit:
      source: "<principal>"
      target: "<secret ?sa can access>"
      permissions: ["secretmanager.versions.access"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        Inherits state from the CanExecuteAs input; then ACTIVE if ?sa has
        versions.access and (non-CMEK OR service agent holds the KMS grant);
        CONDITIONAL(key_permission) if CMEK and the service-agent grant is unknown;
        BLOCKED if denied by VPC-SC/IAM deny/KMS.
      confidence: "min(contributing_confidences) * 0.95"
      derived_from: [ "<CanExecuteAs edge_id>", "<?sa secretmanager.versions.access grant>" ]
      false_positive_note: >-
        Requires the WORKLOAD SA (not the principal directly) to hold
        versions.access on the specific secret. This is the canonical
        CanExecuteAs -> CanReadSecret -> CredentialsFor completion: once code runs as
        ?sa, it reads the payload from the metadata-derived SA token. Do not emit if
        ?sa's access is scoped to a different secret.
      narrative: >-
        {principal.name}, able to execute as {sa.name}, can read secret {secret.name}
        because {sa.name} holds secretmanager.versions.access on it.

  # --- setIamPolicy on a secret -> self-grant secretAccessor ----------------
  - id: gcp-secretmanager-set-iam-self-grant
    emits: CanGrantPermission
    description: "secrets.setIamPolicy lets a caller bind itself secretAccessor and then read the payload."
    match_effective_permission: {action: "secretmanager.secrets.setIamPolicy", resource_type: "google.secretmanager.Secret"}
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<principal (self)>"
      permissions: ["secretmanager.secrets.setIamPolicy"]
      conditions: [iam_permission]
      state_logic: "ACTIVE if setIamPolicy resolves on the secret; BLOCKED if an IAM deny / org policy denies it. Chains to CanReadSecret via a self-bound roles/secretmanager.secretAccessor."
      confidence: "min(contributing_confidences) * 0.95"
      derived_from: [ "<effective secretmanager.secrets.setIamPolicy grant>" ]
      false_positive_note: >-
        Escalation primitive: the caller can add a binding granting itself
        roles/secretmanager.secretAccessor (or admin) on the secret, then read it. For
        a CMEK secret the service-agent KMS gate still applies to the subsequent read.
        setIamPolicy is per-secret unless held at project/folder/org scope.
      narrative: >-
        {principal.name} can set the IAM policy of secret {secret.name}
        (secretmanager.secrets.setIamPolicy) and grant itself secretAccessor, then
        read the payload.

  # --- Explicit-ish: secret allow-policy write (CanModifyPolicy) -------------
  - id: gcp-secretmanager-set-iam-policy
    emits: CanModifyPolicy
    description: "secrets.setIamPolicy writes the secret's IAM allow policy (grant self/others any access)."
    match_effective_permission: {action: "secretmanager.secrets.setIamPolicy", resource_type: "google.secretmanager.Secret"}
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<secret allow policy in scope>"
      permissions: ["secretmanager.secrets.setIamPolicy"]
      conditions: [iam_permission]
      state_logic: "ACTIVE if setIamPolicy resolves; BLOCKED under IAM/org deny."
      confidence: "min(contributing_confidences) * 0.97"
      derived_from: [ "<effective secretmanager.secrets.setIamPolicy grant>" ]
      false_positive_note: >-
        Overlaps gcp-secretmanager-set-iam-self-grant (which is the escalation
        roll-up); this records the raw policy-write capability on the secret's
        ResourcePolicy. De-dupe on edge_id if both are consumed.
      narrative: >-
        {principal.name} can modify the IAM allow policy of secret {secret.name}
        (secretmanager.secrets.setIamPolicy).

  # --- versions.add -> payload tamper (poison consumers) --------------------
  # NOTE: emits CanModify (target "*") not CanWriteData: CanWriteData's target set
  # is [Storage, Data] and a Secret node is class Secret, not Data. CanModify's
  # target is "*", so a Secret is a valid target and the tamper capability is
  # correctly typed.
  - id: gcp-secretmanager-version-add-tamper
    emits: CanModify
    description: "secretmanager.versions.add writes a new payload version that downstream consumers will read."
    match_effective_permission: {action: "secretmanager.versions.add", resource_type: "google.secretmanager.Secret"}
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<secret>"
      permissions: ["secretmanager.versions.add"]
      conditions: [iam_permission]
      state_logic: "ACTIVE for the write capability; downstream impact is CONDITIONAL on a consumer reading the latest/aliased version. BLOCKED under IAM/org/VPC-SC deny."
      confidence: "min(contributing_confidences) * 0.85"
      derived_from: [ "<effective secretmanager.versions.add grant>" ]
      false_positive_note: >-
        Tamper/supply-chain, not read. Only becomes an execution path when a
        workload reads the poisoned version and treats it as config/code/credential.
        Controlling which version consumers get may also need versions.enable/
        disable/destroy and control of the version alias. Not escalation by itself.
      narrative: >-
        {principal.name} can add a new version to secret {secret.name}
        (secretmanager.versions.add), poisoning the payload consumers read.

  # --- Payload is an SA key -> impersonate that SA ---------------------------
  - id: gcp-secretmanager-impersonate-via-sakey
    emits: CanImpersonate
    description: "Reading a secret whose payload is an SA JSON key yields long-lived credentials for that SA."
    match:
      - [ ?principal, CanReadSecret, ?secret ]
      - [ ?secret,    CredentialsFor, ?sa ]
    where:
      - "node_type(?sa) == ServiceAccount"
      - "?secret payload is classified as a service-account JSON key"
    emit:
      source_type: Identity
      source: "<principal>"
      target: "<service account the key authenticates>"
      permissions: ["secretmanager.versions.access"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: "Inherits the CanReadSecret state (ACTIVE / CONDITIONAL(key_permission) for CMEK / BLOCKED). ACTIVE read of an SA-key payload = holding that SA's credentials."
      confidence: "min(contributing_confidences) * 0.9"
      derived_from: [ "<CanReadSecret edge_id>", "<CredentialsFor edge_id>" ]
      false_positive_note: >-
        Only when the payload is genuinely an SA JSON key (not a password/token).
        The key must not be disabled/deleted at the SA. Same-privilege SAs are
        lateral, not escalation (see the CanEscalateTo roll-up). Inherits CMEK gating
        from the CanReadSecret input.
      narrative: >-
        {principal.name} can read secret {secret.name}, whose payload is a JSON key
        for {sa.name}, obtaining long-lived credentials to act as {sa.name}.

  # --- Cross-project entry via a secret holding a privileged foreign SA key --
  - id: gcp-secretmanager-cross-project-cred
    emits: CanEnterProject
    description: "A cross-project principal reading a secret whose payload is a credential privileged in the secret's project enters that project."
    match:
      - [ ?principal, CanReadSecret,  ?secret ]
      - [ ?secret,    CredentialsFor, ?identity ]
    where:
      - "?principal.project != ?secret.project"
      - "?identity has bindings granting privilege in ?secret.project"
    emit:
      source_type: Identity
      target_type: Project
      source: "<principal>"
      target: "<secret.project>"
      permissions: ["secretmanager.versions.access"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: "Inherits CanReadSecret state. ACTIVE when the cross-project read resolves and the credentialed identity is privileged in the target project."
      confidence: "min(contributing_confidences) * 0.9"
      derived_from: [ "<CanReadSecret edge_id>", "<CredentialsFor edge_id>" ]
      false_positive_note: >-
        Only cross-boundary when principal and secret live in different projects AND
        the payload credential is privileged in the secret's project. A cross-project
        binding granting secretAccessor is the common enabler; honor its condition
        expressions.
      narrative: >-
        {principal.name} can read secret {secret.name} in project {project.name},
        obtaining credentials for {identity.name} which is privileged there —
        entering project {project.name}.

  # --- Tenant-wide exposure via allUsers/allAuthenticatedUsers accessor ------
  - id: gcp-secretmanager-public-accessor
    emits: ExposedToTenant
    description: "A secret allow policy binding allUsers/allAuthenticatedUsers to secretAccessor exposes the payload broadly."
    match_record: {resource_type: "google.secretmanager.Secret", field: "iamPolicy.bindings"}
    where:
      - "a binding on the secret (or inherited) grants roles/secretmanager.secretAccessor (or versions.access) to allUsers or allAuthenticatedUsers"
    emit:
      source_type: "*"
      source: "<secret>"
      target: "<Tenant/Organization>"
      permissions: ["secretmanager.versions.access"]
      conditions: [resource_policy]
      state_logic: "ACTIVE if the wildcard binding is present and not overridden by an IAM deny / org policy / VPC-SC perimeter; else BLOCKED."
      confidence: "0.9"
      derived_from: [ "<secret iamPolicy binding to allUsers/allAuthenticatedUsers>" ]
      false_positive_note: >-
        allAuthenticatedUsers = any Google account (tenant/org-wide), NOT anonymous
        internet — Secret Manager has no anonymous data plane, so model as
        ExposedToTenant, never ExposedToInternet. A DOMAIN_RESTRICTED_SHARING org
        policy or a VPC-SC perimeter can neutralize allUsers/allAuthenticatedUsers ->
        BLOCKED.
      narrative: >-
        Secret {secret.name} is readable by any Google-authenticated principal
        (allUsers/allAuthenticatedUsers bound to roles/secretmanager.secretAccessor).

  # --- Escalation roll-up ----------------------------------------------------
  - id: gcp-secretmanager-escalate-via-credentialsfor
    emits: CanEscalateTo
    description: "Reading a secret that yields credentials for a strictly more-privileged identity is escalation."
    match:
      - [ ?principal, CanReadSecret,  ?secret ]
      - [ ?secret,    CredentialsFor, ?identity ]
    where:
      - "?identity.privilege_level > ?principal.privilege_level"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<credentialed identity>"
      permissions: ["secretmanager.versions.access"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: "Inherits CanReadSecret state (CMEK secrets remain CONDITIONAL(key_permission) until the service-agent grant is confirmed)."
      confidence: "min(contributing_confidences) * 0.95"
      derived_from: [ "<CanReadSecret edge_id>", "<CredentialsFor edge_id>" ]
      false_positive_note: >-
        Only emit when the credentialed identity is strictly more privileged than the
        caller; a secret holding creds for a same/lower-privilege identity is lateral,
        not escalation. Inherits state (and CMEK gating) from CanReadSecret.
      narrative: >-
        {principal.name} can escalate to {identity.name} by reading secret
        {secret.name}, whose payload is a credential for {identity.name}.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - A VPC Service Controls perimeter denying secretmanager.googleapis.com (or
#    specifically versions.access) for the caller -> emit the edge with
#    state: BLOCKED and denied_by=<perimeter>.
#  - An IAM deny policy denying secretmanager.versions.access / secrets.setIamPolicy
#    / versions.add at the effective scope -> BLOCKED (denied_by=<deny policy>).
#  - CMEK: if the Secret Manager service agent lacks
#    cloudkms.cryptoKeyVersions.useToDecrypt on kmsKeyName, or the key/version is
#    DISABLED/DESTROYED, versions.access fails -> CanReadSecret BLOCKED.
#  - A DOMAIN_RESTRICTED_SHARING org policy neutralizes allUsers/allAuthenticatedUsers
#    accessor bindings -> gcp-secretmanager-public-accessor BLOCKED.
# ---------------------------------------------------------------------------

# Explicit normalization rules (raw config -> explicit edges) live in
# /rules/explicit/gcp-secretmanager.yaml (HasPolicy, CredentialsFor, ContainsSecret,
# CrossProjectTrust, LocatedIn). They match raw Secret Manager API records, not edges.
explicit_rules:

  - id: gcp-secretmanager-explicit-has-policy
    emits: HasPolicy
    applies_to: [gcp]
    source_record: {api: "secretmanager.projects.secrets.getIamPolicy", field: "bindings"}
    emit: {source: "<secret>", target: "<secret ResourcePolicy>"}

  - id: gcp-secretmanager-explicit-credentials-for
    emits: CredentialsFor
    applies_to: [gcp]
    source_record: {api: "secretmanager.projects.secrets.get", field: "name | labels | annotations (payload classification)"}
    where: ["secret name/labels/annotations classify the payload as a credential for a named identity/SA/data store"]
    emit: {source: "<secret>", target: "<classified target identity/SA/data store>"}

  - id: gcp-secretmanager-explicit-cross-project-trust
    emits: CrossProjectTrust
    applies_to: [gcp]
    source_record: {api: "secretmanager.projects.secrets.getIamPolicy", field: "bindings[].members"}
    where: ["a member (user/SA/group) belongs to a different project than the secret"]
    emit: {source: "<secret.project>", target: "<member.project | external identity>"}

  # Evidence-only (emits no edge): a Secret node is not a valid source for
  # ContainsResourceReference nor a valid HasPolicy target for an EncryptionKey.
  # kmsKeyName is recorded as evidence on the Secret and consumed by
  # gcp-secretmanager-read-cmek-gate for the service-agent key_permission gate.
  - id: gcp-secretmanager-explicit-cmek-ref
    emits: null
    kind: evidence
    applies_to: [gcp]
    source_record: {api: "secretmanager.projects.secrets.get", field: "customerManagedEncryption.kmsKeyName"}
    where: ["secret is CMEK-encrypted; record the KMS key reference as evidence, not a graph edge"]
    record: {on_node: "<secret>", field: "cmek_key", value: "<CMEK CryptoKey from kmsKeyName>"}
