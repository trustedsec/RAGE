# EXPLICIT NORMALIZATION — cross-reference
# ---------------------------------------------------------------------------
# These rules consume explicit facts that the collector produces from:
#   1. cloudidentity.groups.memberships.list → MemberOf(user, group)
#   2. resourcemanager.*.getIamPolicy → HasRole(group, role@scope)
#   3. DWD scope bindings from Admin console / customers API → HasPolicy(SA, dwd_binding)
#   4. Directory API users.list (isAdmin, isDelegatedAdmin, suspended) → node properties
#   5. Directory API roleAssignments.list → HasRole(admin, delegated_admin_role)
#
# No separate /rules/explicit/gcp-cloudidentity.yaml is required because the
# facts above map directly to standard node/edge types (MemberOf, HasRole,
# HasPolicy, node properties). The collector populates these via the Admin SDK
# and Cloud Identity APIs without custom normalization rules.
# ---------------------------------------------------------------------------

