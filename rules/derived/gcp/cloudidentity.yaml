#   - gcp-sa-act-as (CanPassIdentity): deploying a workload as a DWD SA gives the
#     deploying principal code running as the DWD SA → inherits CanImpersonate.
#
# BLOCKED-edge guidance:
#   - An IAM deny policy denying cloudidentity.groups.memberships.create on a
#     group → CanAddMember BLOCKED for that group.
#   - A Workspace org policy preventing DWD authorization → CanModifyTrust BLOCKED.
#   - Super-admin account suspended → all super-admin-derived edges BLOCKED.
