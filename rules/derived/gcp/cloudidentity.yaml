#     NOT on CanDelegate from DWD, since CanDelegate target is Identity (not
#     restricted to SA/MachineIdentity like CanImpersonate).
#   - execute-then-read-secret: if code can CanExecuteAs the DWD SA, it inherits
#     the SA's CanDelegate over all domain users (capability-inheritance traversal).
#
# can-control.yaml:
