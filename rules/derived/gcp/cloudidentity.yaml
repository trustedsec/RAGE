#   - escalate-via-execute-as: CanExecuteAs(attacker, DWD-SA) + DWD-SA's
#     CanImpersonate → CanEscalateTo via the capability-inheritance traversal.
#
# MISSING ESCALATION ROLLUP FOR CanDelegate:
#   - credential-chains.yaml's impersonate-is-escalation only fires on CanImpersonate
#     edges. No linchpin rule currently chains CanDelegate(SA, user) →
#     CanEscalateTo when privilege(user) > privilege(SA). The DWD → delegate-as-
#     super-admin → org control path therefore does not surface as CanEscalateTo.
#   - WORKAROUND: Graph traversal can walk CanExecuteAs(attacker, DWD-SA) then
#     CanDelegate(DWD-SA, superadmin) then CanGrantPermission(superadmin, org) →
#     Controls(org), but this requires multi-hop queries. A GCP-specific rule
#     matching [?sa, CanDelegate, ?user] where privilege(?user) > privilege(?sa)
#     → CanEscalateTo(sa, user) would complete the escalation chain.
#   - TODO: Add CanDelegate escalation rule to credential-chains.yaml or create
#     a gcp-specific linchpin for this path.
