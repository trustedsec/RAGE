#   hierarchy-chains (guardrail-removal for VPC-SC perimeter)
#     A principal with CanModifyPolicy on the VPC-SC perimeter definition can
#     remove the Artifact Registry service from the perimeter, transitioning
#     BLOCKED supply-chain edges to ACTIVE. hierarchy-chains models that path;
#     this file only records the BLOCKED state gate on perimeter-restricted repos.
#
# BLOCKED-edge guidance:
#   - IAM deny policy denying artifactregistry.repositories.uploadArtifacts ->
#     gcp-ar-upload-is-code-modify BLOCKED.
#   - VPC-SC perimeter enforced (not dry-run) and principal project not in
#     perimeter -> all repo API calls BLOCKED for that principal.
#   - ImmutableTags: true on the repo -> tag-overwrite push BLOCKED (gcp-ar-upload
#     downgraded to CONDITIONAL(push_succeeds) for mutable-tag fan-out; NEW-tag
#     pushes still succeed but may not reach existing consumers).
#   - Binary Authorization enforcement on consumer GKE cluster -> supply-chain
#     fan-out CONDITIONAL(binauthorz_attestation) even when push is ACTIVE.
#   - Digest-pinned consumer image references -> container-chains marks that
