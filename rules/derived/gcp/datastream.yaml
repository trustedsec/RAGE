# BLOCKED-edge guidance:
#  - IAM deny policy denying datafusion.instances.update at the effective scope
#    → emit gcp-datafusion-pipeline-deploy-modifies-code and
#    gcp-datafusion-swap-pipeline-sa as BLOCKED.
#  - Deny policy denying iam.serviceAccounts.actAs on the pipeline SA
#    → gcp-datafusion-create-workload-as and gcp-datafusion-swap-pipeline-sa BLOCKED.
#  - Deny policy denying datastream.streams.update
#    → gcp-datastream-stream-update-exfil BLOCKED.
#  - VPC Service Controls perimeter restricting datastream.googleapis.com or
#    datafusion.googleapis.com → emit BLOCKED with perimeter as denied_by.
#  - Org policy constraints/datafusion.restrictPublicIp or similar → adjusts
#    ExposedToInternet state for Data Fusion management plane.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# DEDUPLICATION NOTES:
#  - can-execute-as execute-as-via-code-modify fires on any CanModifyCode(instance)
#    + ExecutesAs(instance, sa) for the AnalyticsService/GenericCompute node;
#    gcp-datafusion-pipeline-deploy-modifies-code + gcp-datafusion-instance-executes-as
#    (explicit rule) provide those normalized facts. CanExecuteAs(principal, sa) is
#    produced by can-execute-as, not re-derived here.
#  - can-execute-as execute-as-via-config-identity-swap fires on
#    CanModifyConfiguration(instance) + CanPassIdentity(principal, sa);
#    gcp-datafusion-swap-pipeline-sa provides the CanModifyConfiguration fact.
#  - can-control escalate-via-execute-as produces CanEscalateTo for any CanExecuteAs
#    where privilege(target) > privilege(source). Do NOT emit CanEscalateTo from this
#    derived file; cite can-control for escalation roll-up instead.
#  - cicd-chains cicd-modify-buildspec-executes-as also fires on CanModifyCode(runner)
#    + ExecutesAs for BatchJob / BuildWorker node types; if the Data Fusion instance
#    is modeled as a GenericCompute/AnalyticsService rather than BatchJob, ensure the
#    cicd-chains where-clause node_type check includes AnalyticsService, or emit
#    CanModifyCode targeting a BatchJob sub-node representing the pipeline. Either
#    approach produces the same CanExecuteAs via can-execute-as; avoid double-deriving.
# ---------------------------------------------------------------------------
