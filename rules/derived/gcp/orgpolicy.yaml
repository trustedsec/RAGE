# GCP Organization Policy Service — Derived attack-path rules (Phase 3 — administrative hierarchy & guardrails)
# ===========================================================================
# THE GCP GUARDRAIL LAYER. Organization Policy Service holds no credentials,
# runs no workload, and grants no IAM roles. Its only attack relevance is
# GUARDRAIL REMOVAL: a principal with orgpolicy.policy.set (predefined
# roles/orgpolicy.policyAdmin) at an org/folder/project scope can overwrite,
# delete, or add an exempting rule to an ENFORCED constraint, which lifts the
# BLOCK that constraint places on one or more downstream edges.
#
# MODELING CONTRACT (see /rules/derived/hierarchy-chains.yaml, rule 3
# guardrail-removal-upgrades-blocked, which this file is the GCP feeder for):
#   * Here we emit ONLY CanModifyPolicy(Identity -> OrganizationPolicy) at the
#     scope the constraint is enforced, and we DOCUMENT (via `gates`) which
#     high-value edges each constraint suppresses.
#   * We DO NOT re-emit the unblocked downstream edges. The BLOCKED -> ACTIVE
#     (CONDITIONAL(guardrail_removed)) state upgrade is done ONCE, generically,
#     by hierarchy-chains.yaml's guardrail-removal-upgrades-blocked. Every rule
#     below cites it in derived_from. Emitting the unblocked edge here too would
#     DOUBLE-COUNT the path.
#   * We DO NOT re-implement org/folder/project setIamPolicy self-grant, Contains
#     descent, or CanEnter* roll-ups — those live in
#     /rules/derived/gcp/identity-escalation.yaml (gcp-set-iam-policy-*) and
#     hierarchy-chains.yaml rule 1. We CITE, not duplicate.
#
# CORRECTNESS NUANCES honored by every rule:
#   * orgpolicy.policy.set is a DIFFERENT permission from
#     resourcemanager.*.setIamPolicy. Org-policy admin != IAM grant.
#   * A CanModifyPolicy is emitted ONLY when the constraint is ACTUALLY ENFORCED
#     (spec.rules[].enforce==true for boolean; a suppressing denyValues/allowAll
#     for list) at/inherited-to the scope, and the gated edge is present as
#     BLOCKED. Dry-run-only (dryRunSpec) constraints enforce nothing -> no edge.
#   * The modify is SCOPED: setting policy at a project only unblocks that
#     subtree, not siblings. Keep target = the OrganizationPolicy node at the
#     scope the principal can actually write.
#   * Pure-hardening constraints (requireShieldedVm) suppress NO discrete edge in
#     our vocab -> NO rule emits for them (documented in orgpolicy.md §14/§22).
#
# Permission/role/constraint names verbatim from the Org Policy overview, the
# org-policy constraints reference, and the orgpolicy IAM roles/permissions ref.
# ===========================================================================

provider: gcp
phase: 3-administrative-hierarchy
applies_to: [gcp]

rules:

  # --- SA key-creation guardrail --------------------------------------------
  - id: gcp-orgpolicy-modify-sa-key-guardrail
    emits: CanModifyPolicy
    description: "Remove/weaken iam.disableServiceAccountKeyCreation to re-enable SA key creation."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_class(?orgpolicy) == Policy and node_type(?orgpolicy) == OrganizationPolicy"
      - "?orgpolicy.constraint == 'constraints/iam.disableServiceAccountKeyCreation'"
      - "?orgpolicy is ENFORCED at/inherited-to ?scope (spec boolean enforce==true, not dryRun-only)"
      - "?principal has EFFECTIVE orgpolicy.policy.set at ?scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.policy.set"]
      gates: ["CanCreateCredentialFor(Identity -> ServiceAccount)  # SA JSON key / Cloud Storage HMAC key, emitted by gcp-sa-key-create"]
      conditions: [guardrail_enforced, iam_permission]
      state_logic: >-
        ACTIVE for the CanModifyPolicy capability when orgpolicy.policy.set is
        unconditionally effective at ?scope AND the constraint is currently
        enforced there. CONDITIONAL(iam_permission) if the set permission is
        gated (IAM condition). BLOCKED if an IAM deny policy denies
        orgpolicy.policy.set at ?scope. The downstream CanCreateCredentialFor
        upgrade from BLOCKED is NOT emitted here — guardrail-removal-upgrades-
        blocked re-emits it as CONDITIONAL(guardrail_removed).
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy (orgpolicy.policy.set)", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml) performs the BLOCKED->ACTIVE upgrade of the gated CanCreateCredentialFor" ]
      false_positive_note: >-
        Emit ONLY if the constraint is actually enforced at/above ?scope (check
        effective policy via analyzeOrgPolicies, not raw per-scope spec — a child
        may override with inheritFromParent=false/reset) AND at least one
        gcp-sa-key-create edge is BLOCKED by THIS OrganizationPolicy. A dry-run-only
        policy enforces nothing. orgpolicy.policy.set is NOT
        resourcemanager.*.setIamPolicy — do not conflate with the IAM self-grant.
        Power is bounded to SA-key creation in ?scope's subtree; do not generalize
        to boundary control.
      narrative: >-
        {principal.name} can set the org policy at {scope.name}
        (orgpolicy.policy.set) and remove/weaken
        constraints/iam.disableServiceAccountKeyCreation, re-enabling
        service-account key creation across {scope.name} — durable offline
        SA credentials become obtainable.

  # --- SA key-upload guardrail ----------------------------------------------
  - id: gcp-orgpolicy-modify-sa-key-upload-guardrail
    emits: CanModifyPolicy
    description: "Remove iam.disableServiceAccountKeyUpload to allow binding an attacker keypair to an SA."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_type(?orgpolicy) == OrganizationPolicy"
      - "?orgpolicy.constraint == 'constraints/iam.disableServiceAccountKeyUpload'"
      - "?orgpolicy is ENFORCED at/inherited-to ?scope (boolean enforce==true)"
      - "?principal has EFFECTIVE orgpolicy.policy.set at ?scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.policy.set"]
      gates: ["CanCreateCredentialFor / CanModifyTrust(Identity -> ServiceAccount)  # upload attacker public key to SA"]
      conditions: [guardrail_enforced, iam_permission]
      state_logic: >-
        ACTIVE when set permission is unconditional and the constraint is enforced
        at ?scope; else CONDITIONAL(iam_permission)/BLOCKED as usual. Downstream
        upload-key edge upgrade deferred to hierarchy-chains.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml)" ]
      false_positive_note: >-
        Uploading a public key to an SA also requires iam.serviceAccountKeys.create
        (upload variant) on the SA itself — this rule only lifts the org-policy
        BLOCK; the caller still needs the SA-scoped key permission for the unblocked
        edge to be ACTIVE. Keep the upgrade CONDITIONAL until both hold.
      narrative: >-
        {principal.name} can remove constraints/iam.disableServiceAccountKeyUpload
        at {scope.name}, re-enabling upload of an attacker-controlled public key to
        service accounts in {scope.name}.

  # --- Domain Restricted Sharing guardrail ----------------------------------
  - id: gcp-orgpolicy-modify-drs-guardrail
    emits: CanModifyPolicy
    description: "Weaken iam.allowedPolicyMemberDomains to allow granting roles to external identities."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_type(?orgpolicy) == OrganizationPolicy"
      - "?orgpolicy.constraint == 'constraints/iam.allowedPolicyMemberDomains'"
      - "?orgpolicy is ENFORCED at/inherited-to ?scope (list constraint restricting allowed domains)"
      - "?principal has EFFECTIVE orgpolicy.policy.set at ?scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.policy.set"]
      gates: ["external-member grant / CrossProjectTrust / CanFederateAs  # add an attacker-owned external principal via setIamPolicy"]
      conditions: [guardrail_enforced, iam_permission]
      state_logic: >-
        ACTIVE for the CanModifyPolicy when set is unconditional and the list
        constraint is enforced at ?scope. The unblocked cross-org grant edge is
        upgraded by hierarchy-chains; it additionally requires the principal to
        hold a setIamPolicy grant capability to actually add the external member
        (that capability is the identity-escalation.yaml edge, not this one).
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml)" ]
      false_positive_note: >-
        Domain Restricted Sharing only blocks ADDING out-of-domain members; it does
        not itself grant anything. This rule is meaningful only when a
        cross-org/external-member grant edge exists as BLOCKED by THIS policy AND
        the principal (or a reachable identity) can also perform the setIamPolicy
        that would add the external member. Widening the allowed-domains list to
        include an attacker domain is equivalent to removal — treat allowValues
        edits that add attacker-controllable domains as weakening.
      narrative: >-
        {principal.name} can weaken constraints/iam.allowedPolicyMemberDomains at
        {scope.name}, allowing external attacker-owned identities to be granted IAM
        roles in {scope.name} (cross-org grant).

  # --- Automatic default-SA grants guardrail (future-scoped, POTENTIAL) ------
  - id: gcp-orgpolicy-modify-default-sa-grants-guardrail
    emits: CanModifyPolicy
    description: "Remove iam.automaticIamGrantsForDefaultServiceAccounts to re-enable over-privileged default SAs on new resources."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_type(?orgpolicy) == OrganizationPolicy"
      - "?orgpolicy.constraint == 'constraints/iam.automaticIamGrantsForDefaultServiceAccounts'"
      - "?orgpolicy is ENFORCED at/inherited-to ?scope (boolean enforce==true — hardening constraint)"
      - "?principal has EFFECTIVE orgpolicy.policy.set at ?scope"
    optional: []
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.policy.set"]
      gates: ["automatic Editor grant to default service accounts (compute/appengine default SA) on NEWLY created resources — future-scoped"]
      conditions: [guardrail_enforced, future_scoped]
      state_logic: >-
        POTENTIAL by default: removing this hardening constraint does NOT
        retroactively over-privilege EXISTING default SAs; it only re-enables the
        automatic Editor grant on resources/projects created AFTER removal. Emit the
        CanModifyPolicy but mark the downstream effect POTENTIAL(future_scoped) — it
        materializes only when a new default SA is subsequently created.
      confidence: "min(contributing_confidences) * 0.7"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml)" ]
      false_positive_note: >-
        Lower value and future-scoped. Do NOT claim this immediately escalates —
        existing bindings are unaffected. Only meaningful in an environment where
        the attacker can also cause new default-SA-bearing resources to be created.
        Keep POTENTIAL.
      narrative: >-
        {principal.name} can remove
        constraints/iam.automaticIamGrantsForDefaultServiceAccounts at {scope.name},
        re-enabling the over-privileged automatic Editor grant to default service
        accounts on resources created afterwards in {scope.name}.

  # --- VM external-IP guardrail ---------------------------------------------
  - id: gcp-orgpolicy-modify-vm-external-ip-guardrail
    emits: CanModifyPolicy
    description: "Weaken compute.vmExternalIpAccess to allow assigning public IPs to VMs (internet exposure)."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_type(?orgpolicy) == OrganizationPolicy"
      - "?orgpolicy.constraint == 'constraints/compute.vmExternalIpAccess'"
      - "?orgpolicy is ENFORCED at/inherited-to ?scope (list constraint; denyAll or restrictive allowedValues)"
      - "?principal has EFFECTIVE orgpolicy.policy.set at ?scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.policy.set"]
      gates: ["ExposedToInternet(Compute)  # VM public-IP exposure, emitted BLOCKED by GCE research while enforced"]
      conditions: [guardrail_enforced, iam_permission]
      state_logic: >-
        ACTIVE for the CanModifyPolicy when set is unconditional and the constraint
        is enforced at ?scope. Downstream ExposedToInternet(VM) upgrade deferred to
        hierarchy-chains; it further requires the principal to actually assign a
        public IP (compute.instances.* on the VM) for the exposure to realize.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml)" ]
      false_positive_note: >-
        This constraint gates public-IP ASSIGNMENT, not existing exposure. Fire only
        when an ExposedToInternet(Compute) edge is BLOCKED by THIS policy. Widening
        allowedValues to include the attacker's target VMs is equivalent to removal.
      narrative: >-
        {principal.name} can weaken constraints/compute.vmExternalIpAccess at
        {scope.name}, re-enabling public-IP assignment for Compute Engine VMs in
        {scope.name} (internet exposure).

  # --- Public-bucket-prevention guardrail -----------------------------------
  - id: gcp-orgpolicy-modify-public-bucket-guardrail
    emits: CanModifyPolicy
    description: "Remove storage.publicAccessPrevention to allow making Cloud Storage buckets public."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_type(?orgpolicy) == OrganizationPolicy"
      - "?orgpolicy.constraint == 'constraints/storage.publicAccessPrevention'"
      - "?orgpolicy is ENFORCED at/inherited-to ?scope (boolean enforce==true)"
      - "?principal has EFFECTIVE orgpolicy.policy.set at ?scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.policy.set"]
      gates: ["ExposedToInternet(Storage)  # public bucket via allUsers/allAuthenticatedUsers, BLOCKED by GCS research while enforced"]
      conditions: [guardrail_enforced, iam_permission]
      state_logic: >-
        ACTIVE for the CanModifyPolicy when set is unconditional and the constraint
        is enforced at ?scope. Downstream ExposedToInternet(bucket) upgrade deferred
        to hierarchy-chains; realizing it further requires storage.buckets.setIamPolicy
        to actually add allUsers/allAuthenticatedUsers.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml)" ]
      false_positive_note: >-
        publicAccessPrevention only prevents MAKING data public; it grants nothing.
        Fire only when an ExposedToInternet(Storage) edge is BLOCKED by THIS policy.
        Note publicAccessPrevention can also be enforced at the bucket level itself
        (not only via org policy) — that bucket-level setting is out of scope here;
        this rule targets the org-policy-enforced case.
      narrative: >-
        {principal.name} can remove constraints/storage.publicAccessPrevention at
        {scope.name}, re-enabling public Cloud Storage buckets in {scope.name}.

  # --- Cloud SQL public-IP guardrail ----------------------------------------
  - id: gcp-orgpolicy-modify-sql-public-ip-guardrail
    emits: CanModifyPolicy
    description: "Remove sql.restrictPublicIp to allow Cloud SQL instances to get a public IP."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_type(?orgpolicy) == OrganizationPolicy"
      - "?orgpolicy.constraint == 'constraints/sql.restrictPublicIp'"
      - "?orgpolicy is ENFORCED at/inherited-to ?scope (boolean enforce==true)"
      - "?principal has EFFECTIVE orgpolicy.policy.set at ?scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.policy.set"]
      gates: ["ExposedToInternet  # Cloud SQL public IP, BLOCKED by Cloud SQL research while enforced"]
      conditions: [guardrail_enforced, iam_permission]
      state_logic: >-
        ACTIVE for the CanModifyPolicy when set is unconditional and the constraint
        is enforced at ?scope. Downstream Cloud SQL public-IP exposure upgrade
        deferred to hierarchy-chains; realizing it further requires
        cloudsql.instances.update to actually enable the public IP.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml)" ]
      false_positive_note: >-
        Gates public-IP ENABLEMENT on Cloud SQL, not existing exposure. Fire only
        when a Cloud SQL ExposedToInternet edge is BLOCKED by THIS policy.
      narrative: >-
        {principal.name} can remove constraints/sql.restrictPublicIp at
        {scope.name}, re-enabling public IPs on Cloud SQL instances in {scope.name}.

  # --- Generic: any enforced constraint that BLOCKs a modeled edge ----------
  # Catch-all so the guardrail-removal pattern applies to constraints not
  # individually enumerated above, WITHOUT over-claiming: it fires only when the
  # constraint is proven to suppress at least one BLOCKED edge in the graph.
  - id: gcp-orgpolicy-modify-any-guardrail
    emits: CanModifyPolicy
    description: "orgpolicy.policy.set over ANY enforced OrganizationPolicy that blocks a modeled edge = guardrail-removal capability over it."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_type(?orgpolicy) == OrganizationPolicy"
      - "?principal has EFFECTIVE orgpolicy.policy.set at ?orgpolicy's scope"
      - "?orgpolicy is ENFORCED (spec, not dryRun-only) at/inherited-to ?scope"
      - "there EXISTS >=1 edge e with state_of(e)==BLOCKED and blocked_by(e)==?orgpolicy"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.policy.set"]
      gates: ["<the set of BLOCKED edges whose blocked_by == ?orgpolicy>"]
      conditions: [guardrail_enforced, iam_permission]
      state_logic: >-
        ACTIVE when orgpolicy.policy.set is unconditionally effective at the scope
        AND the constraint is enforced AND >=1 edge is BLOCKED by it; CONDITIONAL/
        BLOCKED per the set permission's own gates. The per-edge BLOCKED->ACTIVE
        upgrade is guardrail-removal-upgrades-blocked's job, keyed on blocked_by.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy", "blocked_by(e)==?orgpolicy for >=1 e", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml)" ]
      false_positive_note: >-
        Guardrail against over-claiming: emit ONLY when the org policy actually
        suppresses at least one modeled edge (blocked_by == this node). A constraint
        that blocks nothing in the graph (e.g. requireShieldedVm — pure hardening
        with no discrete edge in our vocab) yields NO edge here. Dedupe against the
        constraint-specific rules above on (CanModifyPolicy, principal, orgpolicy);
        this rule only adds coverage for constraints not individually enumerated.
      narrative: >-
        {principal.name} can set the org policy at {scope.name}
        (orgpolicy.policy.set) over the enforced guardrail {orgpolicy.name} and lift
        the blocks it imposes on {gated_edges}.

  # --- Custom constraint deletion / mutation --------------------------------
  - id: gcp-orgpolicy-modify-custom-constraint
    emits: CanModifyPolicy
    description: "Delete/alter a custom org-policy constraint that enforces a security invariant, unblocking what it suppressed."
    match:
      - [ ?principal, CanModifyPolicy, ?orgpolicy ]
    where:
      - "node_type(?orgpolicy) == OrganizationPolicy"
      - "?orgpolicy.constraint starts with 'constraints/custom.'"
      - "?principal has EFFECTIVE orgpolicy.customConstraints.delete or .update at the organization (custom constraints are org-defined)"
      - "?orgpolicy is ENFORCED and blocks >=1 modeled edge (blocked_by == ?orgpolicy)"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?orgpolicy
      permissions: ["orgpolicy.customConstraints.delete", "orgpolicy.customConstraints.update", "orgpolicy.policy.set"]
      gates: ["<the BLOCKED edges whose blocked_by == this custom constraint>"]
      conditions: [guardrail_enforced, iam_permission]
      state_logic: >-
        ACTIVE when the principal effectively holds
        orgpolicy.customConstraints.delete/.update (custom constraints are defined
        at the organization) AND the custom constraint is enforced AND blocks >=1
        edge; CONDITIONAL/BLOCKED per the permission's gates. Downstream upgrade
        deferred to hierarchy-chains.
      confidence: "min(contributing_confidences)"
      derived_from: [ "?principal CanModifyPolicy ?orgpolicy (custom constraint)", "guardrail-removal-upgrades-blocked (hierarchy-chains.yaml)" ]
      false_positive_note: >-
        Custom constraints are DEFINED at the organization
        (orgpolicy.customConstraints.*) but ENFORCED via a policy binding
        (orgpolicy.policy.set) at any scope. Deleting the definition removes it
        everywhere; disabling the binding removes it at that scope — either lifts the
        block. Fire only when the custom constraint actually suppresses a modeled
        edge; a custom constraint governing a resource type we do not model yields no
        edge.
      narrative: >-
        {principal.name} can delete/alter the custom org-policy constraint
        {orgpolicy.name} (orgpolicy.customConstraints.delete/update), lifting the
        blocks it imposes across the organization.

# ===========================================================================
# EXPLICIT NORMALIZATION dependency (see /rules/explicit/gcp-orgpolicy.yaml):
#   * HasPolicy(scope -> OrganizationPolicy)      from orgpolicy.policy.get / analyzeOrgPolicies
#   * CanModifyPolicy(Identity -> OrganizationPolicy) from effective orgpolicy.policy.set
#     (this is the base edge all rules above match on; the derived rules add the
#      constraint-specific `gates` semantics and enforcement/state conditions).
#
# ANTI-DUPLICATION:
#   * Org/folder/project Contains descent, CanEnter{Project,Organization}, and the
#     setIamPolicy self-grant are ALREADY modeled — do NOT re-emit them here.
#     See /rules/derived/gcp/identity-escalation.yaml (gcp-set-iam-policy-*) and
#     /rules/derived/hierarchy-chains.yaml rules 1 & 2.
#   * The BLOCKED -> CONDITIONAL(guardrail_removed) -> ACTIVE upgrade of every gated
#     edge is emitted ONCE by hierarchy-chains.yaml guardrail-removal-upgrades-blocked
#     (rule 3). This file NEVER re-emits an unblocked downstream edge.
#
# BLOCKED-edge guidance:
#   * If an IAM deny policy denies orgpolicy.policy.set at the scope, the
#     CanModifyPolicy edges above are themselves BLOCKED (the attacker cannot remove
#     the guardrail) -> no upgrade fires.
#   * A constraint present only in dryRunSpec is NOT enforced -> it suppresses no
#     edge -> emit nothing (there is no guardrail to remove).
# ===========================================================================
