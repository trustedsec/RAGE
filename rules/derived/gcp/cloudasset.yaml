# GCP Cloud Asset Inventory — Derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# Low-relevance security service: 1 conservative rule.
#
# Phase 12 theme for this service:
#   (3) DATA / RECON: cloudasset.assets.searchAllResources /
#       searchAllIamPolicies / exportAssets provides BULK ENUMERATION of every
#       GCP resource configuration and IAM policy binding at org/folder/project
#       scope. This is the PRIMARY INPUT used by the reference collector to
#       build the attack graph — an attacker with these permissions can perform
#       the same enumeration. -> CanRead (recon) on the ConfigurationService node.
#
# Cloud Asset Inventory does NOT execute as any service account, does NOT expose
# secret payloads, and does NOT grant access to the resources it describes.
# Do NOT chain CanRead on a CAI node to CanEnterProject, CanEnterOrganization,
# CanAssume, CanExecuteAs, or CanEscalateTo. Recon reveals attack paths on other
# resources — it does not itself create them.
#
# Detective controls do NOT set BLOCKED state; only preventive guardrails do.
# No linchpin citations (can-execute-as, cicd-chains, credential-chains,
# can-control) apply — this service has no execution or escalation surface.
#
# All permissions are from the official IAM reference:
#   https://cloud.google.com/asset-inventory/docs/access-control
#   https://cloud.google.com/iam/docs/permissions-reference
# ---------------------------------------------------------------------------

provider: gcp
phase: 12-security-logging
service: cloudasset
applies_to: [gcp]

rules:

  # --- Recon: bulk enumerate all GCP resources + IAM bindings ---------------
  - id: gcp-cloudasset-bulk-recon
    emits: CanRead
    description: >-
      Search, list, or export all GCP assets and IAM policy bindings at org/folder/project
      scope via Cloud Asset Inventory — the same enumeration the reference
      collector performs, giving an attacker a pre-built map of the environment.
    match:
      - [ ?principal, HasPermission, ?cai ]
    where:
      - "node_class(?cai) == ManagementService"
      - "node_type(?cai) == ConfigurationService"
      - "?cai.origin_service == gcp:cloudasset"
      - "effective_action(?principal, ?cai) includes any of ['cloudasset.assets.searchAllResources', 'cloudasset.assets.searchAllIamPolicies', 'cloudasset.assets.listAssets', 'cloudasset.assets.exportAssets']"
    emit:
      source_type: Identity
      target_type: ConfigurationService
      source: ?principal
      target: ?cai
      permissions:
        - "cloudasset.assets.searchAllResources"
        - "cloudasset.assets.searchAllIamPolicies"
        - "cloudasset.assets.listAssets"
        - "cloudasset.assets.exportAssets"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when the principal holds effective cloudasset.assets.searchAllResources,
        searchAllIamPolicies, listAssets, or exportAssets at the project/folder/org scope
        and the Cloud Asset Inventory API is enabled (cloudasset.googleapis.com);
        CONDITIONAL(api_enabled) when the permission is present but the API is not
        enabled in the project; BLOCKED when a VPC-SC perimeter or IAM deny policy
        explicitly denies all four actions at the effective scope.
      confidence: 0.92
      derived_from:
        - "HasPermission(?principal, cloudasset.assets.searchAllResources|searchAllIamPolicies|listAssets|exportAssets, ?cai)"
      false_positive_note: >-
        CanRead here is a RECON edge only. Calling searchAllResources, listAssets,
        searchAllIamPolicies, or exportAssets returns resource metadata and IAM policy
        bindings — it does NOT grant the caller permission to operate on any of the
        described resources. Do NOT chain this edge to CanEnterProject, CanEnterOrganization,
        CanAssume, CanExecuteAs, or CanEscalateTo.

        Org/folder scope amplifies the recon blast radius: a single caller with
        org-level cloudasset.assets.searchAllResources or listAssets can enumerate all
        resources across every project in the organization. Note the scope in the
        narrative but do NOT emit CanEnterOrganization or CanEnterProject as a result.

        exportAssets writes a snapshot to a GCS bucket or BigQuery dataset. The
        permission gates only the export INITIATION; the destination-resource IAM
        governs whether the exported data is readable — model destination access in
        gcs.yaml / bigquery.yaml, not here.

        analyzeIamPolicy (also in roles/cloudasset.viewer) simulates permission
        evaluation but does not grant access; it is subsumed by this same recon rule
        and needs no separate edge.

        CAI asset snapshots include resource configuration and IAM policy bindings but
        do NOT include Secret Manager secret payloads, KMS key material, or other
        credential values — do not emit ContainsSecret or ExposesCredential on the
        CAI node.
      narrative: >-
        {principal.name} can call Cloud Asset Inventory searchAllResources / listAssets /
        searchAllIamPolicies (or exportAssets) at {cai.scope} scope, enumerating all
        GCP resource configurations and IAM policy bindings across every project in
        that scope. This provides the same comprehensive inventory the reference
        collector uses to build the attack graph — a pre-built map of the environment
        for further traversal. This is a recon primitive; it does not grant access to
        any of the described resources.

  # --- Defense Evasion: delete or modify asset feeds (blind spot) -----------
  - id: gcp-cloudasset-feed-tamper
    emits: CanModifyConfiguration
    description: >-
      Delete or modify a Cloud Asset Inventory asset feed, disrupting continuous
      inventory delivery to the reference collector's Pub/Sub topic — a cover-tracks
      evasion primitive that creates a detection blind spot.
    match:
      - [ ?principal, HasPermission, ?feed ]
    where:
      - "node_class(?feed) == ConfigurationService"
      - "node_type(?feed) == ConfigurationService"
      - "?feed.provider_type == 'google.cloudasset.Feed'"
      - "effective_action(?principal, ?feed) includes any of ['cloudasset.feeds.delete', 'cloudasset.feeds.update']"
    emit:
      source_type: Identity
      target_type: ConfigurationService
      source: ?principal
      target: ?feed
      permissions:
        - "cloudasset.feeds.delete"
        - "cloudasset.feeds.update"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when the principal holds effective cloudasset.feeds.delete (can delete
        the feed entirely) OR cloudasset.feeds.update (can modify destination, filter,
        or disable the feed) on the Feed resource at the project/folder/org scope, with
        no IAM deny policy blocking the action; CONDITIONAL(iam_permission) if the grant
        is at a broader scope (folder/org) that may not resolve to this specific feed;
        BLOCKED if an IAM deny policy denies cloudasset.feeds.delete or
        cloudasset.feeds.update at the effective scope.
      confidence: 0.80
      derived_from:
        - "HasPermission(?principal, cloudasset.feeds.delete|cloudasset.feeds.update, ?feed)"
      false_positive_note: >-
        This is DEFENSE EVASION only — deleting or disabling a feed suppresses
        continuous inventory delivery but does NOT grant access to any resource,
        credential, or identity. The collector can re-enumerate on demand via
        searchAllResources; this evasion slows operational response rather than
        blocking it outright. Do NOT chain to CanExecuteAs, CanEnterProject,
        CanEnterOrganization, or CanEscalateTo. Detective-control tampering does
        not set BLOCKED state on capability edges. Modifying only feed metadata
        (labels, display_name) without changing destination or filter is NOT evasion
        — scope to capability-affecting updates.
      narrative: >-
        {principal.name} can call cloudasset.feeds.delete or cloudasset.feeds.update on
        an asset feed and disrupt continuous Cloud Asset Inventory delivery to the
        Pub/Sub topic. Deleting the feed stops it entirely; updating it can redirect the
        destination topic or filter, silencing change notifications that the reference
        collector and other defenses rely on. This is a cover-tracks primitive — it
        creates a blind spot in real-time detection; it does not grant access to
        resources or credentials.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - A VPC-SC perimeter denying cloudasset.googleapis.com at the effective scope
#     -> emit CanRead/CanModifyConfiguration BLOCKED with denied_by=<perimeter name>.
#   - An IAM deny policy denying cloudasset.assets.searchAllResources at the
#     effective scope -> emit CanRead BLOCKED with denied_by=<deny policy id>.
#   - An IAM deny policy denying cloudasset.feeds.delete|update at the effective
#     scope -> emit CanModifyConfiguration BLOCKED with denied_by=<deny policy id>.
#   - Cloud Asset Inventory API disabled (cloudasset.googleapis.com not enabled
#     in the project) -> emit CanRead CONDITIONAL(api_enabled) — the permission
#     may be present but the API cannot be called.
#
# COMPOSITION — DO NOT DUPLICATE:
#   No escalation roll-ups (CanEscalateTo / CanEnterProject / Controls) are
#   emitted by this service. This service is purely recon + evasion.
#   can-execute-as.yaml, cicd-chains.yaml, credential-chains.yaml, and
#   can-control.yaml do not apply here and are not cited.
# ---------------------------------------------------------------------------
