# This file now imports those rules via the explicit_rules section.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#
#   Org policy constraints:
#     dataproc.clusterProjectScopeServiceAccountUsage — restricts cluster SAs to
#     same project as the cluster -> CrossProjectTrust BLOCKED, CanPassIdentity to
#     cross-project SA BLOCKED.
#     dataproc.requireClusterVmServiceAccount — requires a user-specified SA
#     (not the default CE SA) -> CanExecuteAs via default SA BLOCKED.
#     iam.disableServiceAccountKeyCreation — disallows key creation; does not
#     directly block Dataproc but limits downstream key-based pivots.
#
#   IAM deny policies:
#     An IAM deny on dataproc.jobs.create -> gcp-dataproc-jobs-create-execute-command BLOCKED.
#     An IAM deny on iam.serviceAccounts.actAs -> CanPassIdentity BLOCKED.
#     An IAM deny on dataproc.clusters.update -> CanModifyConfiguration BLOCKED.
#     An IAM deny on dataproc.clusters.setIamPolicy -> CanModifyPolicy BLOCKED.
#     An IAM deny on dataproc.batches.create -> gcp-dataproc-batch-create-passidentity BLOCKED.
#
#   Network controls:
#     internalIpOnly == true -> gcp-dataproc-public-master-ui BLOCKED.
#     Component Gateway enabled -> gcp-dataproc-public-master-ui BLOCKED (proxied + auth).
#
#   VPC Service Controls:
#     A VPC-SC perimeter restricting the dataproc.googleapis.com service -> all
#     dataproc.* API calls from outside the perimeter BLOCKED.
#     Note: VPC-SC does NOT protect against direct VM-level access (port-based exposure).
# ---------------------------------------------------------------------------
