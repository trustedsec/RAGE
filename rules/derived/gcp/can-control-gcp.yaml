# GCP-specific roll-up rules extending can-control.yaml
# ===========================================================================
# LINCHPIN EXTENSION: can-control.yaml owns the canonical CanEscalateTo and
# CanEnter* rollups. This file provides GCP-specific project-entry derivation
# that applies across ALL GCP services (not just Workflows).
#
# COMPOSITION — CITE, DO NOT DUPLICATE:
#   * can-control.yaml — the terminal Controls / CanEscalateTo rollups.
#     This file extends with a GCP-scoped CanEnterProject derivation.
# ===========================================================================

provider: gcp
phase: derived-control
applies_to: [gcp]

rules:

  # --- Cross-project entry via service account impersonation ----
  - id: enter-project-via-impersonation
    emits: CanEnterProject
    description: "Executing as a service account in a different GCP project = entering that project (GCP-scoped extension of can-control.yaml escalation logic)."
    applies_to: [gcp]
    match:
      - [ ?attacker, CanExecuteAs, ?service_account ]
    where:
      - "project_of(?service_account) != project_of(?attacker)"
      - "?service_account has IAM role bindings in its project (elevation over attacker)"
    emit:
      source_type: Identity
      target_type: Project
      source: ?attacker
      target: "<project of ?service_account>"
      state_logic: "inherit from CanExecuteAs"
      conditions: [iam_permission]
      derived_from: [ "?attacker CanExecuteAs ?service_account (cross-project)" ]
      evidence:
        narrative_template: >
          {attacker.name} can execute as {service_account.name}, which holds role bindings
          in project {project.name}, granting {attacker.name} access within that project.
          Execution as {service_account.name} with a Workflow, Cloud Function, or other
          GCP service in {project.name} establishes a project-level foothold.
