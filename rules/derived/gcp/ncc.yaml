# GCP Network Connectivity Center (NCC) — Derived attack-path rules (Phase 8 — networking)
# ---------------------------------------------------------------------------
# NCC is GCP's managed transit hub. A Hub (TransitGateway) aggregates Spokes
# (Route nodes) that each attach a VPC, VPN tunnel, Cloud Interconnect
# attachment, or Router Appliance to the hub's shared routing domain. All
# ACTIVE spokes on a hub can route to each other at the network layer —
# subject to VPC ingress/egress firewall rules at the destination.
#
# PHASE 8 THEME: Emit network FACTS per resource. Transitive end-to-end
# reachability (NCC routing + VPC firewall + peering composing into a full
# path) is the FUTURE provider-agnostic network-chains linchpin — DO NOT
# invent it here. Emit the per-primitive facts and let the linchpin compose.
#
# ATTACK SURFACE (two rules, verified against official docs):
#   (1) REACHABILITY PIVOT: an active NCC spoke creates a routing fact that
#       all other hub-spoke networks can reach the spoke-attached subnets
#       -> RoutesTo (TransitGateway -> Subnet). CONDITIONAL(network_reachability):
#       VPC firewall rules at the destination still gate L4 access.
#
#   (2) WEAKEN CONTROLS / SPOKE INJECTION: a principal with effective
#       networkconnectivity.spokes.create on a hub that does NOT require
#       manual acceptance (requireAcceptance=false) can attach their own VPC
#       to the hub's routing domain, pivoting into all other spoke-attached
#       networks -> CanModifyConfiguration on the Hub (TransitGateway).
#       CONDITIONAL(service_state) when requireAcceptance=true (spoke starts
#       in PENDING_REVIEW and does not route until accepted).
#
# COMPOSITION:
#   * can-control.yaml     — terminal Controls / CanEscalateTo roll-ups
#                            (CITED, not duplicated here).
#   * can-control-gcp.yaml — GCP-scoped CanEnterProject roll-up (CITED).
#   * vpc.yaml             — VPC Firewall / Peering / Shared-VPC facts that
#                            compose with these NCC routing facts.
#
# Official permission reference:
#   https://cloud.google.com/iam/docs/permissions-reference
#     (section: networkconnectivity)
#   https://cloud.google.com/network-connectivity/docs/network-connectivity-center
# ---------------------------------------------------------------------------

provider: gcp
phase: 8-networking
applies_to: [gcp]

rules:

  # ---------------------------------------------------------------------------
  # (2a) WEAKEN CONTROLS: hub.update -> disable acceptance gate
  # ---------------------------------------------------------------------------
  - id: gcp-ncc-hub-update-disable-acceptance
    emits: CanModifyConfiguration
    description: >-
      A principal with effective networkconnectivity.hubs.update on a hub can
      disable the spoke acceptance gate by setting requireAcceptance=false.
      This eliminates the approval gate, auto-accepting all PENDING_REVIEW spokes
      (including attacker-controlled ones) immediately and placing them on the
      routing fabric without manual review.
    applies_to: [gcp]
    match_effective_permission:
      action: "networkconnectivity.hubs.update"
      resource_type: "networkconnectivity.googleapis.com/Hub"
    where:
      - "hub.requireAcceptance == true (currently enforced; principal can flip to false)"
    emit:
      source_type: Identity
      target_type: TransitGateway
      source: "<principal>"
      target: "<NCC Hub (TransitGateway) node>"
      permissions:
        - "networkconnectivity.hubs.update"
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE if ?principal holds networkconnectivity.hubs.update (effective).
        CONDITIONAL(iam_permission) if the effective-permission evaluator cannot
        confirm the permission.
      confidence: "0.95"
      derived_from:
        - "<effective permission: networkconnectivity.hubs.update on hub project>"
      false_positive_note: >-
        (1) This rule applies when a hub has requireAcceptance=true. If
        requireAcceptance=false, the gate is already disabled.
        (2) networkconnectivity.hubs.update grants full control of hub
        configuration, including routingVpcs and requireAcceptance.
        (3) An IAM Deny policy blocking networkconnectivity.hubs.update or VPC
        Service Controls blocking the API should downgrade to BLOCKED.
      narrative: >-
        {principal.name} holds networkconnectivity.hubs.update on NCC Hub
        {hub.name} and can disable spoke acceptance by setting requireAcceptance=false.
        This immediately auto-accepts all PENDING_REVIEW spokes, placing any
        pending attacker-controlled spoke on the hub's routing fabric without
        manual review — a direct bypass of the spoke approval gate.

  # ---------------------------------------------------------------------------
  # (2b) WEAKEN CONTROLS: spoke.update on hub side -> accept pending spokes
  # ---------------------------------------------------------------------------
  - id: gcp-ncc-spoke-update-accept-pending
    emits: CanModifyConfiguration
    description: >-
      A principal with effective networkconnectivity.spokes.update on the hub
      project can accept PENDING_REVIEW spokes that are awaiting hub approval.
      If an attacker has created a pending spoke attaching their VPC to the hub,
      a compromised hub-project identity can immediately accept it, placing the
      attacker's network on the routing fabric without requiring hub owner
      approval.
    applies_to: [gcp]
    match_effective_permission:
      action: "networkconnectivity.spokes.update"
      resource_type: "networkconnectivity.googleapis.com/Hub"
    where:
      - "at_least_one_pending_spoke_exists_on_hub: true (PENDING_REVIEW spoke exists)"
    emit:
      source_type: Identity
      target_type: TransitGateway
      source: "<principal>"
      target: "<NCC Hub (TransitGateway) node>"
      permissions:
        - "networkconnectivity.spokes.update"
      conditions: [iam_permission, service_state]
      state_logic: >-
        CONDITIONAL(service_state) because at least one PENDING_REVIEW spoke
        must exist on the hub to exercise this capability. ACTIVE if a
        PENDING_REVIEW spoke exists and ?principal holds networkconnectivity
        .spokes.update (effective). CONDITIONAL(iam_permission) if the
        effective-permission evaluator cannot confirm the permission.
      confidence: "0.90"
      derived_from:
        - "<effective permission: networkconnectivity.spokes.update on hub project>"
        - "<presence of at least one Spoke with state=PENDING_REVIEW on the hub>"
      false_positive_note: >-
        (1) This rule only emits when a PENDING_REVIEW spoke exists. If all
        spokes are ACTIVE or no spokes exist, downgrade to POTENTIAL.
        (2) networkconnectivity.spokes.update on the hub project allows accepting
        spokes when requireAcceptance=true. On auto-accept hubs (requireAcceptance
        =false), this permission is redundant because spokes auto-approve.
        (3) An IAM Deny policy blocking networkconnectivity.spokes.update or VPC
        Service Controls blocking the API should downgrade to BLOCKED.
      narrative: >-
        {principal.name} holds networkconnectivity.spokes.update on hub project
        {hub_project.name} and can accept PENDING_REVIEW spokes on NCC Hub
        {hub.name}. An attacker who has created a pending spoke attaching their
        VPC to {hub.name} would be immediately approved, placing the attacker's
        network on the hub's routing fabric and opening routing to all other
        spoke-attached VPCs — a direct bypass of hub owner approval.

  # ---------------------------------------------------------------------------
  # (2c) WEAKEN CONTROLS: spoke.create on auto-accept hub -> CanModifyConfiguration
  # ---------------------------------------------------------------------------
  - id: gcp-ncc-spoke-create-transit-pivot
    emits: CanModifyConfiguration
    description: >-
      A principal with effective networkconnectivity.spokes.create on a hub
      that does not require manual spoke acceptance (requireAcceptance=false)
      can attach an attacker-controlled VPC, VPN, or Interconnect to the hub's
      routing domain. The spoke becomes ACTIVE immediately, placing the
      attacker's network on the same routing fabric as all legitimate spoke-
      attached networks — a transit pivot without modifying any VPC firewall
      rule in the destination projects.
    applies_to: [gcp]
    match_effective_permission:
      action: "networkconnectivity.spokes.create"
      resource_type: "networkconnectivity.googleapis.com/Hub"
    where:
      - "hub.requireAcceptance == false (auto-accept; new spokes become ACTIVE immediately)"
      - "?principal also has networkconnectivity.hubs.get on the hub (required to read hub details before attaching a spoke)"
    emit:
      source_type: Identity
      target_type: TransitGateway
      source: "<principal>"
      target: "<NCC Hub (TransitGateway) node>"
      permissions:
        - "networkconnectivity.spokes.create"
        - "networkconnectivity.hubs.get"
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE if ?principal holds networkconnectivity.spokes.create (effective)
        AND hub.requireAcceptance == false (confirmed from hub resource).
        CONDITIONAL(service_state) if hub.requireAcceptance == true or is unknown
        — the spoke enters PENDING_REVIEW and does not route until a hub admin
        explicitly accepts it (networkconnectivity.spokes.update on the hub side).
        CONDITIONAL(iam_permission) if the effective-permission evaluator cannot
        confirm both required permissions.
        BLOCKED if an org policy constraint prevents spoke creation in the project.
      confidence: "0.85"
      derived_from:
        - "<effective permission: networkconnectivity.spokes.create on spoke project>"
        - "<Hub resource: requireAcceptance=false>"
      false_positive_note: >-
        (1) requireAcceptance=true is the critical gate: if set, new spokes are
        PENDING_REVIEW and do NOT route until a hub admin accepts. Downgrade to
        CONDITIONAL(service_state) when requireAcceptance is true or unknown.
        (2) VPC spokes must be in the same GCP organization as the hub (API
        constraint). An attacker in a different org can only attach VPN or
        Interconnect spokes (not VPC spokes). Downgrade to POTENTIAL when the
        attacker's project org cannot be confirmed to match the hub's org for
        VPC-spoke scenarios.
        (3) networkconnectivity.spokes.create alone is insufficient if the
        principal lacks networkconnectivity.hubs.get on the target hub — hub
        visibility is required to complete the spoke attachment. Confirm both
        permissions.
        (4) GCP IAM Deny policies blocking networkconnectivity.spokes.create or
        VPC Service Controls perimeters restricting networkconnectivity API access
        should downgrade the edge to BLOCKED.
        (5) The CanModifyConfiguration edge here records the CAPABILITY to add
        an attacker spoke. The resulting RoutesTo facts (from gcp-ncc-active-*-
        spoke-routes-* rules) are then derivable once the spoke exists. Do not emit
        CanNetworkReach or RoutesTo from this rule — those come from the
        structural spoke-fact rules, composing via the network-chains linchpin.
      narrative: >-
        {principal.name} holds networkconnectivity.spokes.create on project
        {project.name} and can read NCC Hub {hub.name} (requireAcceptance=false).
        Creating a new spoke attaching an attacker-controlled VPC to {hub.name}
        immediately places the attacker's network on the hub's routing domain,
        giving network-layer routing to all other spoke-attached VPCs and on-
        premises networks — without modifying any VPC firewall rule in the
        destination projects. This is a transit-pivot across project boundaries.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   * An org policy constraint that prevents spoke creation in the project
#     -> gcp-ncc-spoke-create-transit-pivot emits with state: BLOCKED and
#        denied_by=<orgPolicy resource>.
#   * hub.requireAcceptance=true with spoke in PENDING_REVIEW state
#     -> gcp-ncc-spoke-routes-to-subnet must NOT emit for that spoke.
#   * Spoke state != ACTIVE (CREATING, DELETING, UPDATING, INACTIVE, PENDING_REVIEW)
#     -> gcp-ncc-spoke-routes-to-subnet must NOT emit.
#   * GCP IAM Deny blocking networkconnectivity.spokes.create
#     -> gcp-ncc-spoke-create-transit-pivot emits with state: BLOCKED.
# ---------------------------------------------------------------------------

# NOTE: All explicit normalization rules have been consolidated into
# /rules/explicit/gcp-ncc.yaml (single authoritative source):
#   - LocatedIn(Hub -> Project)
#   - LocatedIn(Spoke -> TransitGateway)
#   - RoutesTo(Hub -> Subnet) — covers VPC, VPN, and Interconnect spokes
#   - CrossProjectTrust(SpokeProject -> HubProject)
#
# Derived file contains only attack-path derivations that emit
# edges with nature: derived|both.
