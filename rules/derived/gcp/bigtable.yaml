# GCP Cloud Bigtable — Derived attack-path rules (Phase 6 — storage & databases)
# ---------------------------------------------------------------------------
# Catalog key: gcp:bigtable. Emits ONLY common edge types from schema/edges.yaml
# with nature: derived or nature: both. Explicit normalization rules live in
# /rules/explicit/gcp-bigtable.yaml per RULE-FORMAT.md.
#
# All permissions are exact names from the Bigtable IAM reference:
#   cloud.google.com/bigtable/docs/access-control
#   cloud.google.com/bigtable/docs/cmek
#   cloud.google.com/bigtable/docs/backups
#
# KEY ARCHITECTURAL FACTS that discipline every rule here:
#
#   1. NO CREDENTIAL-GRAB PRIMITIVE. Bigtable has no listKeys, HMAC-key,
#      master-password, or token-export API. ExposesCredential is NOT emitted
#      from any Bigtable control-plane action. Credential paths arise only from
#      user-row data (ContainsSecret, analyst-tagged or name-heuristic) and
#      feed into credential-chains.yaml roll-ups (cited, not duplicated).
#
#   2. NO EXECUTION IDENTITY. Bigtable does not run user-supplied code as a
#      service account. ExecutesAs, CanModifyCode, and CanExecuteAs do NOT
#      apply. The Bigtable service agent is Google-managed and not a user-
#      accessible token surface.
#
#   3. CMEK GATE IS ON THE SERVICE AGENT, NOT THE CALLER. When a cluster has
#      CMEK enabled (encryptionConfig.kmsKeyName set), the Bigtable service
#      agent (service-PROJECT_NUMBER@gcp-sa-bigtable.iam.gserviceaccount.com)
#      holds cloudkms.cryptoKeyVersions.useToEncryptDecrypt (envelope KEK
#      model). A caller with only bigtable.tables.readRows reads CMEK-
#      encrypted data as long as the service agent retains the KMS grant.
#      Do NOT require the caller to hold cloudkms.*. Emit CanReadData as
#      CONDITIONAL(key_permission) based on the service agent's grant and
#      the key's ENABLED state — not on the caller's own KMS permissions.
#      The credential-chains.yaml decrypt-gates-secret-read linchpin upgrades
#      reads once the service-agent gate is confirmed satisfied.
#
#   4. DATA-PLANE ACCESS IS PURE IAM — NO SECONDARY CREDENTIAL. Unlike Cloud
#      SQL (DB password layer), Bigtable data access is controlled entirely
#      by Cloud IAM. bigtable.tables.readRows on the effective policy is
#      sufficient for a ReadRows stream; no additional credential is required.
#
#   5. AUTHORIZED VIEWS ARE DATA SUBSETS, NOT TABLE ESCAPES. A principal with
#      bigtable.authorizedViews.readRows sees only the view's row/column scope.
#      CanReadData on an authorized view is scoped to that view; it does NOT
#      constitute table-level read access. Treat authorized-view read and
#      table-level read as separate, non-escalating capabilities.
#
#   6. NO PUBLIC BIGTABLE. Bigtable's IAM explicitly prohibits allUsers and
#      allAuthenticatedUsers in bindings. ExposedToInternet and ExposedToTenant
#      are NOT emitted for Bigtable resources.
#
#   7. setIamPolicy SCOPE IS HIERARCHICAL BUT NOT DOWNWARD-ESCALATING.
#      bigtable.tables.setIamPolicy modifies only THAT table's IAM policy;
#      it does not grant instance-level control. bigtable.instances.setIamPolicy
#      affects all tables in the instance. Emit CanGrantPermission at the
#      appropriate scope node.
#
#   8. VPC SERVICE CONTROLS. A VPC-SC perimeter restricting bigtable.googleapis.com
#      blocks IAM-authorized principals outside the perimeter. Emit affected
#      edges as BLOCKED(resource_policy) with denied_by = <perimeter name>.
#      See /rules/derived/gcp/accesscontextmanager.yaml for perimeter modeling.
#
# LINCHPIN CITATIONS (do NOT re-derive the roll-ups listed here):
#   * /rules/derived/credential-chains.yaml
#       - decrypt-gates-secret-read: upgrades CONDITIONAL(key_permission)
#         CanReadData to ACTIVE when service-agent KMS grant is confirmed
#       - read-secret-yields-identity: CanReadData + ContainsSecret + CredentialsFor
#         => CanImpersonate (for tables storing credential material)
#       - impersonate-is-escalation: CanImpersonate => CanEscalateTo roll-up
#   * /rules/derived/can-control.yaml
#       - control-via-admin: CanAdminister => Controls roll-up
#       - control-boundary-via-iam-admin: CanGrantPermission => Controls roll-up
#   * /rules/derived/can-execute-as.yaml — NOT cited; no ExecutesAs in Bigtable.
#
# PERMISSIONS ARE EFFECTIVE: the permission evaluator has already resolved
# project-, instance-, table-, and authorized-view-level IAM role bindings
# hierarchically. State defaults to ACTIVE; an unmet condition yields
# CONDITIONAL/POTENTIAL; an IAM deny policy or VPC-SC perimeter yields BLOCKED.
# ---------------------------------------------------------------------------

provider: gcp
phase: 6-storage-databases
service: bigtable
applies_to: [gcp]

rules:

  # =====================================================================
  # SECTION 1 — DATA PLANE READ
  # =====================================================================

  # --- CanReadData: bigtable.tables.readRows -----------------------------------
  # bigtable.tables.readRows is the single IAM permission that enables the
  # ReadRows / SampleRowKeys data API. It is included in roles/bigtable.reader
  # and above. There is no secondary DB-password layer — IAM alone gates read
  # access. For CMEK clusters the Bigtable service agent (not the caller)
  # decrypts via Cloud KMS; see CMEK note in the header.
  # Reference: cloud.google.com/bigtable/docs/access-control#permissions
  - id: gcp-bigtable-read-data
    emits: CanReadData
    description: >-
      bigtable.tables.readRows constitutes effective data-plane read access: the
      caller can stream any row from any column family in the table via the
      ReadRows API. For CMEK-encrypted clusters the capability is
      CONDITIONAL(key_permission) on the Bigtable service agent's Cloud KMS
      grant, not on the caller's own KMS permissions.
    match_effective_permission:
      action: "bigtable.tables.readRows"
      resource_type: "google.bigtable.admin.v2.Table"
    where:
      - "instance.state EQUALS READY"
      - "cluster.encryptionConfig.kmsKeyName EQUALS NULL"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<Bigtable Table / NoSQLDatabase node>"
      permissions: ["bigtable.tables.readRows"]
      conditions: [iam_permission, resource_policy]
      state_logic: >-
        ACTIVE when bigtable.tables.readRows is confirmed ACTIVE effective
        permission on the table (or enclosing instance or project scope) AND
        the instance state is READY AND no VPC-SC perimeter blocks
        bigtable.googleapis.com for the caller's network context;
        CONDITIONAL(resource_policy) when the effective-permission evaluator
        can only confirm project-scope binding that may be capped by an IAM
        Conditions expression or deny policy on the table;
        BLOCKED when a VPC-SC perimeter enforces and the caller is outside
        the perimeter, or when a deny policy explicitly denies readRows.
      confidence: "min(contributing_confidences) * 0.97"
      derived_from:
        - "bigtable.tables.readRows effective permission on Table"
      false_positive_note: >-
        bigtable.tables.readRows is the exact IAM permission name for ReadRows /
        SampleRowKeys calls. Do not conflate with bigtable.authorizedViews.readRows
        (table subset only) or bigtable.tables.mutateRows (write-only). Bigtable
        has no secondary DB-credential layer — IAM permission is sufficient for
        data access. Bigtable IAM inheritance runs project -> instance -> table ->
        authorized view; a project-level roles/bigtable.reader grants readRows on
        ALL tables in all instances in the project. Honor IAM Conditions expressions
        that may scope the binding to specific instances or table name prefixes. A
        human user must hold at least one project-level Bigtable role before
        table-level grants take effect (service accounts are exempt from this
        requirement, which is enforcement-UI only, not API-level). VPC-SC perimeters
        that include bigtable.googleapis.com in the restricted services set block
        callers outside the perimeter -> BLOCKED(resource_policy).
      narrative: >-
        {principal.name} holds bigtable.tables.readRows on table {table.name}
        in instance {instance.name}; it can stream any row via the ReadRows API,
        reading all data stored in the table including any application credentials
        or sensitive values.

  # --- CanReadData (CMEK): service-agent key_permission gate ------------------
  - id: gcp-bigtable-read-data-cmek
    emits: CanReadData
    description: >-
      bigtable.tables.readRows on a CMEK-encrypted cluster; the Bigtable service
      agent (not the caller) decrypts via Cloud KMS envelope encryption —
      CanReadData is CONDITIONAL(key_permission) on the service agent's KMS grant
      and the key's ENABLED state.
    match_effective_permission:
      action: "bigtable.tables.readRows"
      resource_type: "google.bigtable.admin.v2.Table"
    where:
      - "cluster.encryptionConfig.kmsKeyName NOT_EQUALS NULL"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<CMEK Bigtable Table / NoSQLDatabase node>"
      permissions: ["bigtable.tables.readRows"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        ACTIVE if the Bigtable service agent
        (service-PROJECT_NUMBER@gcp-sa-bigtable.iam.gserviceaccount.com) holds
        cloudkms.cryptoKeyVersions.useToEncryptDecrypt
        (roles/cloudkms.cryptoKeyEncrypterDecrypter) on the cluster's
        encryptionConfig.kmsKeyName AND the key version is ENABLED;
        CONDITIONAL(key_permission) if the service-agent grant or key state is
        unknown or unconfirmed by the collector;
        BLOCKED if the service agent lacks the grant, OR the KMS key is in
        DISABLED or DESTROYED state (table rows become inaccessible even with
        valid IAM). This state is on the SERVICE AGENT's KMS access, never on
        the caller's own cloudkms.* permissions.
      confidence: "min(contributing_confidences) * 0.95"
      derived_from:
        - "bigtable.tables.readRows effective permission on CMEK Table"
        - "Bigtable service-agent KMS binding on cluster.encryptionConfig.kmsKeyName"
      false_positive_note: >-
        GCP-SPECIFIC: the key_permission gate is on the BIGTABLE SERVICE AGENT,
        not the calling principal. A caller with only bigtable.tables.readRows
        reads CMEK data while the service agent holds useToEncryptDecrypt. Do NOT
        require the caller to hold cloudkms.* permissions — requiring caller KMS
        decrypt (AWS-style) produces false negatives. Downgrade to
        CONDITIONAL(key_permission) or BLOCKED only based on the service agent's
        grant state and the KMS key's enabled status. The credential-chains.yaml
        decrypt-gates-secret-read linchpin upgrades the read when the service-agent
        gate is confirmed (collector verifies service-agent IAM binding on the KMS
        key). Backups inherit the cluster's CMEK encryption — a restored table in
        a different cluster uses THAT cluster's CMEK key.
      narrative: >-
        {principal.name} holds bigtable.tables.readRows on CMEK table {table.name}
        in cluster {cluster.name} (kmsKeyName: {key.name}); the Bigtable service
        agent — not the caller — decrypts rows using
        cloudkms.cryptoKeyEncrypterDecrypter on {key.name}. Access is ACTIVE while
        the service agent retains that grant and the key is enabled.

  # --- CanReadData: bigtable.authorizedViews.readRows ---
  # Authorized views create IAM-gated subsets of a table (row key prefix / column
  # qualifier scope). A principal with bigtable.authorizedViews.readRows on a view
  # can stream rows only from that view's scoped rows/columns; they do NOT get
  # access to the parent table. CanReadData is scoped to the view node, not the table.
  - id: gcp-bigtable-read-authorized-view
    emits: CanReadData
    description: >-
      bigtable.authorizedViews.readRows grants read access to a scoped subset of
      a table (row key prefix / column qualifier filtering). The caller can only
      read the rows/columns defined by the authorized view; access to the parent
      table is NOT granted. CanReadData is scoped to the AuthorizedView node.
    match_effective_permission:
      action: "bigtable.authorizedViews.readRows"
      resource_type: "google.bigtable.admin.v2.AuthorizedView"
    where:
      - "instance.state EQUALS READY"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<Authorized View / NoSQLDatabase node>"
      permissions: ["bigtable.authorizedViews.readRows"]
      conditions: [iam_permission, resource_policy]
      state_logic: >-
        ACTIVE when bigtable.authorizedViews.readRows is confirmed ACTIVE effective
        permission on the authorized view AND the instance state is READY AND no
        VPC-SC perimeter blocks bigtable.googleapis.com for the caller's context;
        CONDITIONAL(resource_policy) when the effective-permission evaluator can
        only confirm project-scope binding that may be capped by IAM Conditions;
        BLOCKED when a VPC-SC perimeter enforces or a deny policy denies the permission.
      confidence: "min(contributing_confidences) * 0.96"
      derived_from:
        - "bigtable.authorizedViews.readRows effective permission on AuthorizedView"
      false_positive_note: >-
        IMPORTANT: A principal with bigtable.authorizedViews.readRows on a VIEW
        does NOT have access to the parent table. Authorized views implement row/column
        scoping at the IAM level; the view's read permission is scoped to its subset.
        Do NOT chain this view's CanReadData to the parent table's CanReadData without
        an explicit Contains edge and separate derivation. View read and table read are
        separate, non-escalating capabilities. An attacker must hold bigtable.tables.readRows
        on the table itself to read beyond the view's scope. Authorization boundaries
        are strictly enforced by the Bigtable API.
      narrative: >-
        {principal.name} holds bigtable.authorizedViews.readRows on authorized view
        {view.name} of table {table.name}; it can stream rows from the view's row-key
        prefix and column-qualifier scope only, not the full table.

  # --- CanWriteData: bigtable.authorizedViews.mutateRows ---
  # Authorized views create IAM-gated subsets of a table (row key prefix / column
  # qualifier scope). A principal with bigtable.authorizedViews.mutateRows on a view
  # can write rows only to that view's scoped rows/columns; they do NOT get
  # access to write beyond the view definition. CanWriteData is scoped to the view node, not the table.
  - id: gcp-bigtable-write-authorized-view
    emits: CanWriteData
    description: >-
      bigtable.authorizedViews.mutateRows grants write access to a scoped subset of
      a table (row key prefix / column qualifier filtering). The caller can only
      write rows within the authorized view's defined scope; write access to the parent
      table is NOT granted. CanWriteData is scoped to the AuthorizedView node.
    match_effective_permission:
      action: "bigtable.authorizedViews.mutateRows"
      resource_type: "google.bigtable.admin.v2.AuthorizedView"
    where:
      - "instance.state EQUALS READY"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<Authorized View / NoSQLDatabase node>"
      permissions: ["bigtable.authorizedViews.mutateRows"]
      conditions: [iam_permission, resource_policy]
      state_logic: >-
        ACTIVE when bigtable.authorizedViews.mutateRows is confirmed ACTIVE effective
        permission on the authorized view AND the instance state is READY AND no
        VPC-SC perimeter blocks bigtable.googleapis.com for the caller's context;
        CONDITIONAL(resource_policy) when the effective-permission evaluator can
        only confirm project-scope binding that may be capped by IAM Conditions;
        BLOCKED when a VPC-SC perimeter enforces or a deny policy denies the permission.
      confidence: "min(contributing_confidences) * 0.96"
      derived_from:
        - "bigtable.authorizedViews.mutateRows effective permission on AuthorizedView"
      false_positive_note: >-
        IMPORTANT: A principal with bigtable.authorizedViews.mutateRows on a VIEW
        does NOT have write access to the parent table. Authorized views implement row/column
        scoping at the IAM level; the view's write permission is scoped to its subset.
        Do NOT conflate with bigtable.tables.mutateRows (table-level write). View write
        and table write are separate, non-escalating capabilities. An attacker must hold
        bigtable.tables.mutateRows on the table itself to write beyond the view's scope.
        Authorization boundaries are strictly enforced by the Bigtable API.
      narrative: >-
        {principal.name} holds bigtable.authorizedViews.mutateRows on authorized view
        {view.name} of table {table.name}; it can write, update, and delete rows within
        the view's row-key prefix and column-qualifier scope only, not the full table.

  # =====================================================================
  # SECTION 2 — DATA PLANE WRITE
  # =====================================================================

  # --- CanWriteData: bigtable.tables.mutateRows ---
  # bigtable.tables.mutateRows is the sole write-plane permission in roles/bigtable.editor
  # and roles/bigtable.user. It allows the caller to mutate, delete, or insert rows.
  # This is a significant attack primitive: writing credentials, configuration, or
  # application state can poison downstream processing or escalate further.
  - id: gcp-bigtable-write-data
    emits: CanWriteData
    description: >-
      bigtable.tables.mutateRows grants the caller the ability to write, update,
      and delete rows in a Bigtable table. This is included in roles/bigtable.user
      and above. Data mutation enables credential injection, configuration poisoning,
      and application state corruption.
    match_effective_permission:
      action: "bigtable.tables.mutateRows"
      resource_type: "google.bigtable.admin.v2.Table"
    where:
      - "instance.state EQUALS READY"
      - "cluster.encryptionConfig.kmsKeyName EQUALS NULL"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<Bigtable Table / NoSQLDatabase node>"
      permissions: ["bigtable.tables.mutateRows"]
      conditions: [iam_permission, resource_policy]
      state_logic: >-
        ACTIVE when bigtable.tables.mutateRows is confirmed ACTIVE effective
        permission on the table AND the instance state is READY AND no VPC-SC
        perimeter blocks bigtable.googleapis.com for the caller's context;
        CONDITIONAL(resource_policy) when the effective-permission evaluator can
        only confirm project-scope binding that may be capped by IAM Conditions;
        BLOCKED when a VPC-SC perimeter enforces or a deny policy denies mutateRows.
      confidence: "min(contributing_confidences) * 0.97"
      derived_from:
        - "bigtable.tables.mutateRows effective permission on Table"
      false_positive_note: >-
        bigtable.tables.mutateRows is the write-plane permission controlling row
        mutations. Do not conflate with bigtable.authorizedViews.mutateRows (view-scoped
        only). roles/bigtable.user includes both readRows and mutateRows, making
        users dangerous if the table contains credentials or configuration. For CMEK
        tables, apply CMEK-write variant logic (service agent's KMS key must be
        ENABLED). See gcp-bigtable-write-data-cmek for CMEK treatment.
      narrative: >-
        {principal.name} holds bigtable.tables.mutateRows on table {table.name};
        it can write, update, and delete rows, poisoning data or injecting
        credentials stored in the table.

  # --- CanWriteData (CMEK): service-agent key_permission gate ---
  - id: gcp-bigtable-write-data-cmek
    emits: CanWriteData
    description: >-
      bigtable.tables.mutateRows on a CMEK-encrypted cluster; the Bigtable service
      agent decrypts via Cloud KMS before allowing writes — CanWriteData is
      CONDITIONAL(key_permission) on the service agent's KMS grant.
    match_effective_permission:
      action: "bigtable.tables.mutateRows"
      resource_type: "google.bigtable.admin.v2.Table"
    where:
      - "cluster.encryptionConfig.kmsKeyName NOT_EQUALS NULL"
    emit:
      source_type: Identity
      target_type: NoSQLDatabase
      source: "<principal>"
      target: "<CMEK Bigtable Table / NoSQLDatabase node>"
      permissions: ["bigtable.tables.mutateRows"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        ACTIVE if the Bigtable service agent holds
        cloudkms.cryptoKeyVersions.useToEncryptDecrypt on the cluster's
        encryptionConfig.kmsKeyName AND the key version is ENABLED;
        CONDITIONAL(key_permission) if the service-agent grant or key state is
        unknown; BLOCKED if the service agent lacks the grant OR the key is
        DISABLED/DESTROYED (both reads and writes become inaccessible; the
        cluster enters ERROR state regardless of the caller's IAM).
      confidence: "min(contributing_confidences) * 0.95"
      derived_from:
        - "bigtable.tables.mutateRows effective permission on CMEK Table"
        - "Bigtable service-agent KMS binding on cluster.encryptionConfig.kmsKeyName"
      false_positive_note: >-
        The key_permission gate is on the BIGTABLE SERVICE AGENT, not the caller.
        A caller with mutateRows can write to CMEK data while the service agent
        holds useToEncryptDecrypt. Downgrade to CONDITIONAL/BLOCKED only based on
        the service agent's KMS grant state and key status, never on caller KMS
        permissions.
      narrative: >-
        {principal.name} holds bigtable.tables.mutateRows on CMEK table {table.name}
        in cluster {cluster.name}; writes are gated on the Bigtable service agent's
        cloudkms.cryptoKeyEncrypterDecrypter grant on {key.name}.

  # =====================================================================
  # SECTION 3 — IAM GRANT ESCALATION
  # =====================================================================

  # --- CanGrantPermission: bigtable.tables.setIamPolicy (table scope) --------
  # bigtable.tables.setIamPolicy writes the table's IAM allow policy. The caller
  # can bind any role (including roles/bigtable.user, which includes readRows)
  # to any principal (including itself) without project-level IAM change.
  # This is a high-value primitive because Bigtable supports sub-instance IAM:
  # a principal that can set a table's policy can grant itself data-plane read
  # access scoped to that table. roles/bigtable.admin includes this permission.
  # Reference: cloud.google.com/bigtable/docs/access-control#roles
  - id: gcp-bigtable-set-iam-policy
    emits: CanGrantPermission
    description: >-
      bigtable.tables.setIamPolicy lets a principal grant any role on the table
      to any principal (including itself). Self-granting roles/bigtable.user
      (includes bigtable.tables.readRows + bigtable.tables.mutateRows) yields full
      data-plane read/write access scoped to that table without project-level IAM change.
    match_effective_permission:
      action: "bigtable.tables.setIamPolicy"
      resource_type: "google.bigtable.admin.v2.Table"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<any principal (self-grant or other)>"
      permissions: ["bigtable.tables.setIamPolicy"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when bigtable.tables.setIamPolicy is confirmed as an ACTIVE
        effective permission on the table, instance, or project scope AND no
        deny policy or org policy blocks IAM mutations on Bigtable resources;
        CONDITIONAL(iam_permission) when the effective-permission evaluation
        is uncertain (e.g. IAM Conditions expression partially unresolved);
        BLOCKED when a deny policy explicitly denies bigtable.tables.setIamPolicy
        at the effective scope, or when a VPC-SC perimeter blocks IAM admin
        API calls (note: IAM calls are not part of the Bigtable service perimeter
        scope; VPC-SC does NOT block setIamPolicy for bigtable.googleapis.com).
      confidence: "min(contributing_confidences) * 0.97"
      derived_from:
        - "bigtable.tables.setIamPolicy effective permission on Table"
      false_positive_note: >-
        bigtable.tables.setIamPolicy is present in roles/bigtable.admin (any scope)
        and is the per-TABLE IAM mutation action. It allows modifying the Cloud IAM
        policy of the table resource, enabling a self-grant of roles/bigtable.user
        (which includes bigtable.tables.readRows + bigtable.tables.mutateRows +
        bigtable.tables.sampleRowKeys). This is a self-escalation path to data
        access without project IAM change. Separately, bigtable.instances.setIamPolicy
        is broader: it modifies IAM at the instance scope, affecting ALL tables in
        the instance. Emit a separate CanGrantPermission edge for
        bigtable.instances.setIamPolicy with target scoped to the Instance node.
        Do NOT conflate the two — table-scope setIamPolicy does NOT confer instance-
        level IAM mutation. The human-user minimum-project-role requirement
        (at least one project-level Bigtable role) is a UI/console enforcement;
        the IAM API itself does not enforce it — self-granting via setIamPolicy
        on a table can still succeed for a service account regardless of project role.
        Chains to CanReadData(principal, table) via the self-bound roles/bigtable.user,
        then to ContainsSecret/CanExfiltrate if the table holds sensitive data.
      narrative: >-
        {principal.name} holds bigtable.tables.setIamPolicy on table {table.name}
        and can grant itself or any principal roles/bigtable.user, gaining
        bigtable.tables.readRows + bigtable.tables.mutateRows (full data-plane
        read/write) on {table.name} without modifying project-level IAM.

  # --- CanGrantPermission: bigtable.instances.setIamPolicy (instance scope) --
  # bigtable.instances.setIamPolicy mutates IAM at the instance level, affecting
  # ALL tables and authorized views in the instance. This is a higher-value
  # primitive than table-scope setIamPolicy because it grants instance-wide access.
  # The attacker can self-grant roles/bigtable.admin on the instance, then grant
  # table-level roles to any principal across all tables.
  - id: gcp-bigtable-set-iam-policy-instance
    emits: CanGrantPermission
    description: >-
      bigtable.instances.setIamPolicy lets a principal grant instance-scope roles
      to any principal (including itself). Self-granting roles/bigtable.admin on
      the instance yields full control over all tables, clusters, and backups within
      the instance without project-level IAM change. Instance-scope setIamPolicy
      is a higher-value escalation than table-scope because it affects all tables.
    match_effective_permission:
      action: "bigtable.instances.setIamPolicy"
      resource_type: "google.bigtable.admin.v2.Instance"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<any principal (self-grant or other)>"
      permissions: ["bigtable.instances.setIamPolicy"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when bigtable.instances.setIamPolicy is confirmed as an ACTIVE
        effective permission on the instance scope AND no deny policy or org policy
        blocks IAM mutations on Bigtable resources;
        CONDITIONAL(iam_permission) when the effective-permission evaluation is
        uncertain (e.g., IAM Conditions expression partially unresolved);
        BLOCKED when a deny policy explicitly denies bigtable.instances.setIamPolicy
        at the instance scope. Note: IAM calls are not blocked by VPC-SC perimeters
        on bigtable.googleapis.com (IAM uses a separate API path).
      confidence: "min(contributing_confidences) * 0.97"
      derived_from:
        - "bigtable.instances.setIamPolicy effective permission on Instance"
      false_positive_note: >-
        bigtable.instances.setIamPolicy is the instance-scope IAM mutation action.
        It modifies the Cloud IAM policy at the instance level, enabling a
        self-grant of roles/bigtable.admin (or any role) on the instance,
        which cascades to all tables, clusters, and authorized views in the instance.
        This is a higher-value escalation than bigtable.tables.setIamPolicy
        (table-scope only). Emit a separate CanGrantPermission edge for each scope:
        table-scope setIamPolicy targets the table, instance-scope targets the instance.
        The self-grant path is: setIamPolicy → grant roles/bigtable.admin → CanAdminister
        on instance → all tables in scope. Chains to CanReadData(principal, all tables)
        via the self-bound roles/bigtable.admin.
      narrative: >-
        {principal.name} holds bigtable.instances.setIamPolicy on instance {instance.name}
        and can grant itself or any principal roles/bigtable.admin, gaining full control
        over all tables, clusters, and backups in {instance.name} without modifying
        project-level IAM. This is a wider escalation than table-scope setIamPolicy.

  # --- CanGrantPermission: bigtable.authorizedViews.setIamPolicy (view scope) --
  # bigtable.authorizedViews.setIamPolicy mutates IAM at the authorized-view level.
  # A principal with this permission can self-grant bigtable.authorizedViews.readRows
  # or bigtable.authorizedViews.mutateRows on a view without any table-level or
  # instance-level IAM change. This is a self-escalation primitive scoped to the view.
  - id: gcp-bigtable-set-iam-policy-authorized-view
    emits: CanGrantPermission
    description: >-
      bigtable.authorizedViews.setIamPolicy lets a principal grant view-scope roles
      to any principal (including itself). Self-granting bigtable.authorizedViews.readRows
      or bigtable.authorizedViews.mutateRows on a view yields data access scoped to that
      view's row/column subset without modifying table-level or instance-level IAM.
      View-scope setIamPolicy is a distinct, view-only escalation primitive.
    match_effective_permission:
      action: "bigtable.authorizedViews.setIamPolicy"
      resource_type: "google.bigtable.admin.v2.AuthorizedView"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<any principal (self-grant or other)>"
      permissions: ["bigtable.authorizedViews.setIamPolicy"]
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when bigtable.authorizedViews.setIamPolicy is confirmed as an ACTIVE
        effective permission on the authorized view AND no deny policy or org policy
        blocks IAM mutations on Bigtable resources;
        CONDITIONAL(iam_permission) when the effective-permission evaluation is
        uncertain (e.g., IAM Conditions expression partially unresolved);
        BLOCKED when a deny policy explicitly denies bigtable.authorizedViews.setIamPolicy
        at the view scope. Note: IAM calls are not blocked by VPC-SC perimeters
        on bigtable.googleapis.com (IAM uses a separate API path).
      confidence: "min(contributing_confidences) * 0.97"
      derived_from:
        - "bigtable.authorizedViews.setIamPolicy effective permission on AuthorizedView"
      false_positive_note: >-
        bigtable.authorizedViews.setIamPolicy is the view-scoped IAM mutation action.
        It modifies the Cloud IAM policy at the authorized-view level only, enabling
        a self-grant of bigtable.authorizedViews.readRows or bigtable.authorizedViews.mutateRows
        on the view without modifying table-level or instance-level IAM. This is a
        distinct escalation from bigtable.tables.setIamPolicy (table-scope) and
        bigtable.instances.setIamPolicy (instance-scope). Emit separate CanGrantPermission
        edges for each scope: view-scope setIamPolicy targets the view, table-scope
        targets the table, instance-scope targets the instance. The self-grant path is:
        setIamPolicy → grant bigtable.authorizedViews.readRows/mutateRows → CanReadData/
        CanWriteData on the view only (NOT the parent table). Authorized-view IAM does
        NOT cascade to the parent table or instance.
      narrative: >-
        {principal.name} holds bigtable.authorizedViews.setIamPolicy on authorized view
        {view.name} and can grant itself or any principal bigtable.authorizedViews.readRows
        or bigtable.authorizedViews.mutateRows, gaining data access scoped to {view.name}'s
        row/column subset without modifying table or instance IAM.

  # =====================================================================
  # SECTION 4 — DATA EXFILTRATION
  # =====================================================================

  # --- CanExfiltrate: cross-project backup copy ---
  # Backup read + create/restore in a different project allows copying the full
  # backup cross-project, exfiltrating all table data outside the source project
  # boundary. This requires ALL THREE permissions on the source (read) and
  # destination (create + restore).
  - id: gcp-bigtable-exfiltrate-via-backup
    emits: CanExfiltrate
    description: >-
      A principal with bigtable.backups.read on a source backup AND
      bigtable.backups.create + bigtable.backups.restore in a destination instance
      (any project) can copy the backup cross-project and restore the full table
      contents in the destination, exfiltrating all data outside the source
      project boundary.
    match_effective_permission:
      action: ["bigtable.backups.read", "bigtable.backups.create", "bigtable.backups.restore"]
      resource_type: ["google.bigtable.admin.v2.Backup", "google.bigtable.admin.v2.Instance"]
    where:
      - "principal HOLDS bigtable.backups.read ON source_backup"
      - "principal HOLDS bigtable.backups.create ON destination_instance"
      - "principal HOLDS bigtable.backups.restore ON destination_instance"
      - "destination_instance.project NOT_EQUALS source_backup.project"
      - "source_backup.instance.state EQUALS READY"
      - "destination_instance.state EQUALS READY"
    emit:
      source_type: Identity
      target_type: Backup
      source: "<principal>"
      target: "<Bigtable Backup node>"
      permissions: ["bigtable.backups.read", "bigtable.backups.create", "bigtable.backups.restore"]
      conditions: [iam_permission, resource_policy, key_permission]
      state_logic: >-
        ACTIVE when bigtable.backups.read is confirmed on the source backup AND
        bigtable.backups.create + bigtable.backups.restore are confirmed in a
        destination instance in a different project AND both the source and
        destination instances are in READY state AND the destination cluster's
        CMEK key (if present) is compatible with the restored backup (either the
        source and destination clusters share the same KMS key, or the destination
        cluster's service agent holds the source backup's CMEK key's decrypt grant)
        AND no VPC-SC perimeter blocks backup copy operations;
        CONDITIONAL(iam_permission) when destination create/restore rights are
        uncertain (e.g., only project-scope billing confirmed, destination project
        is unmodeled);
        CONDITIONAL(key_permission) when destination cluster uses a different CMEK key
        than the source cluster and the destination cluster's service agent's access to
        that key or the source key's accessibility is unconfirmed;
        POTENTIAL when a destination instance exists but its accessibility is
        unconfirmed;
        BLOCKED when a VPC-SC perimeter prevents the cross-project backup copy
        call (bigtable.googleapis.com in the perimeter restricts API access), OR
        when the destination cluster's CMEK key is in DISABLED/DESTROYED state, OR
        when the destination cluster's service agent lacks the decrypt grant for the
        key required by the restored backup.
      confidence: "min(contributing_confidences) * 0.92"
      derived_from:
        - "bigtable.backups.read effective permission on source Backup"
        - "bigtable.backups.create effective permission in destination project"
        - "bigtable.backups.restore effective permission in destination project"
      false_positive_note: >-
        ALL THREE permissions are required: bigtable.backups.read on the SOURCE
        backup (allows copy), bigtable.backups.create in the DESTINATION instance
        (creates the copied backup), and bigtable.backups.restore in the destination
        (restores the backup to a new table). Without source backups.read, the copy
        call fails. Without destination create+restore, the data cannot be materialized.
        bigtable.backups.get (read metadata) does NOT allow backup data copy —
        only bigtable.backups.read enables copy operations. The destination restore
        always creates a NEW table (cannot overwrite an existing table). For CMEK
        backups, the restored table in the destination cluster uses that cluster's
        CMEK key (or Google-managed key if the destination cluster is not CMEK).
        If the source CMEK key is not accessible to the destination cluster's service
        agent, the restore will fail -> emit as CONDITIONAL(key_permission) when the
        destination cluster uses a different CMEK key than the source.
      narrative: >-
        {principal.name} holds bigtable.backups.read on backup {backup.name}
        (source of table {table.name}) and bigtable.backups.create +
        bigtable.backups.restore in a destination project; it can copy the backup
        cross-project and restore the full table contents in the destination,
        exfiltrating all of {table.name}'s data outside the source project boundary.

# ---------------------------------------------------------------------------
# BLOCKED-EDGE GUIDANCE:
#   - A VPC-SC perimeter that includes bigtable.googleapis.com in the restricted
#     services set blocks data API calls from principals outside the perimeter
#     -> emit CanReadData and CanExfiltrate edges as BLOCKED(resource_policy)
#     with denied_by = <perimeter resource name>.
#   - VPC-SC does NOT block setIamPolicy for bigtable.googleapis.com: IAM API calls
#     use a separate API path (googleapis.com/IAM) outside the Bigtable service
#     perimeter scope. CanGrantPermission edges are therefore NOT BLOCKED by VPC-SC
#     perimeters on bigtable.googleapis.com specifically (however, deny policies or
#     other org policies may still block setIamPolicy).
#   - A CMEK key in DISABLED or DESTROYED state -> table rows become inaccessible;
#     emit CanReadData / CanWriteData BLOCKED(key_permission) with denied_by = <KMS key name>
#     when the service agent's grant is confirmed as absent or the key state is
#     DISABLED/DESTROYED.
#   - A deny policy explicitly denying bigtable.tables.readRows, bigtable.tables.mutateRows,
#     or bigtable.tables.setIamPolicy at the effective scope -> respective edges
#     BLOCKED(denied_by = <deny-policy resource name>).
#   - Org policy or IAM deny blocking IAM mutations ->
#     CanGrantPermission BLOCKED(denied_by = <deny-policy name>).
#
# LINCHPIN CROSS-REFERENCES (edges this file emits feed into):
#   * gcp-bigtable-read-data / gcp-bigtable-read-data-cmek (CanReadData) +
#     ContainsSecret(table -> Secret) ->
#     credential-chains.yaml read-secret-yields-identity
#     => CanImpersonate when the table stores credential material.
#   * gcp-bigtable-read-data-cmek (CanReadData, CONDITIONAL key_permission) ->
#     credential-chains.yaml decrypt-gates-secret-read
#     => upgrades to CanReadData ACTIVE when Bigtable service agent's KMS grant
#        is confirmed (not when the CALLER holds CanDecrypt).
#   * gcp-bigtable-set-iam-policy / gcp-bigtable-set-iam-policy-instance (CanGrantPermission) ->
#     can-control.yaml control-boundary-via-iam-admin
#     => Controls(?principal, ?table or ?instance) when self-grant is confirmed.
#   * gcp-bigtable-explicit-administer (CanAdminister, from /rules/explicit/) ->
#     can-control.yaml control-via-admin
#     => Controls(principal, instance/table) roll-up for admin principals.
#   * gcp-bigtable-exfiltrate-via-backup (CanExfiltrate) —
#     terminal data exfil path; no further linchpin derivation required.
# ---------------------------------------------------------------------------

