# Azure Blueprints & Deployment Stacks — Derived attack-path rules (Phase 9 — CI/CD / deploy orchestration)
# ---------------------------------------------------------------------------
# Blueprints (Microsoft.Blueprint) and Deployment Stacks (Microsoft.Resources/
# deploymentStacks) both follow the PHASE-9 CI/CD pattern:
#
#   A deployment DEFINITION (blueprint artifacts / ARM template) is the "build
#   spec" an assignment RUNNER executes. The assignment runs as a MANAGED
#   IDENTITY; whoever can MODIFY the definition or CONFIGURE the assignment can
#   inject arbitrary ARM resources (code, role assignments, deny assignments)
#   that execute as the assignment MI.
#
# SECURITY-RELEVANT FACTS (what this file emits as normalized primitives):
#   CanModifyCode          principal can write/replace the deployment definition
#   CanModifyConfiguration principal can write the assignment object itself
#   CanGrantPermission     a role-assignment artifact in the definition grants
#                          RBAC at the deployment scope via the assignment MI
#   CanPassIdentity        assigning a user-assigned MI to an assignment
#   CanModifyPolicy        deleting an assignment / changing Deployment Stack
#                          denySettings removes system-managed deny assignments
#   CanExecuteAs           modify definition + trigger assignment => runs as MI
#                          (also derived directly for the assignment-write path)
#
# LINCHPIN CITATIONS (do NOT duplicate — cite derived_from):
#   cicd-chains.yaml:
#     cicd-modify-buildspec-executes-as: CanModifyCode(principal→assignment) +
#       ExecutesAs(assignment→MI) → CanExecuteAs(principal→MI)  [consumes rules below]
#     cicd-trigger-runner-executes-as:  CanTrigger(principal→assignment) +
#       ExecutesAs → CanExecuteAs  [weaker; CONDITIONAL(attacker_influenced_definition)]
#   hierarchy-chains.yaml:
#     guardrail-removal-upgrades-blocked: CanModifyPolicy(principal→deny-assignment)
#       → upgrades BLOCKED edges the deny assignment was suppressing.
#   can-control.yaml:
#     escalate-via-execute-as: CanExecuteAs → CanEscalateTo (when MI is more privileged)
#     control-boundary-via-iam-admin: CanGrantPermission@boundary → Controls(boundary)
#   azure/identity-escalation.yaml:
#     azure-role-assignment-write: roleAssignments/write → CanGrantPermission (base rule)
#
# PERMISSION STRINGS verified against:
#   - Microsoft.Blueprint resource-provider operations reference (2026-07 snapshot)
#   - Microsoft.Resources deploymentStacks operations reference (2026-07 snapshot)
#   - Azure Blueprint permission requirements doc
#     (learn.microsoft.com/azure/governance/blueprints/concepts/permissions)
#   - Azure Deployment Stacks docs
#     (learn.microsoft.com/azure/azure-resource-manager/bicep/deployment-stacks)
#
# DEPRECATION NOTE: Azure Blueprints is deprecated (end-of-support 2026-07-11).
# Rules are still necessary for existing tenant collections. Deployment Stacks
# are the strategic successor and follow the same attack-path pattern.
#
# STATE: ACTIVE = unconditionally realizable now; CONDITIONAL = realizable given
# a named gate; POTENTIAL = capability exists but not yet exercised; BLOCKED = a
# guardrail (deny assignment, deny policy) suppresses the edge.
# Quote scalars containing ':'.
# ---------------------------------------------------------------------------

provider: azure
phase: 9-cicd-pipelines
applies_to: [azure]

rules:

  # === CODE MODIFICATION, CONFIGURATION, TRIGGER, GUARDRAIL, IDENTITY ATTACHMENT ===
  # These normalization rules have been MOVED to /rules/explicit/azure-blueprints.yaml
  # because they emit CanModifyCode, CanModifyConfiguration, CanPassIdentity, and
  # CanModifyPolicy (which have nature:explicit or nature:both) via match_effective_permission.
  # Per RULE-FORMAT.md, /rules/explicit/ is the correct home for these normalization rules.
  # MOVED rules:
  #   - azure-bp-definition-write       (CanModifyCode via blueprints/write)
  #   - azure-bp-artifact-write         (CanModifyCode via blueprints/artifacts/write)
  #   - azure-stack-definition-write    (CanModifyCode via deploymentStacks/write)
  #   - azure-bp-assignment-write       (CanModifyConfiguration via blueprintAssignments/write)
  #   - azure-bp-assignment-trigger     (CanTrigger via blueprintAssignments/write)
  #   - azure-bp-pass-identity          (CanPassIdentity via assign/action)
  #   - azure-bp-delete-removes-deny    (CanModifyPolicy via delete)
  #   - azure-stack-deny-settings-change (CanModifyPolicy via deploymentStacks/write)
  #   - azure-stack-mg-scope-enter-subscription (CanEnterSubscription at MG scope)
  # This file now focuses on DERIVED RULES that consume those facts (via cicd-chains,
  # can-execute-as, hierarchy-chains linchpins) and on GRANT PERMISSION derivations.

  # === ROLE-ASSIGNMENT ARTIFACTS: definition grants RBAC at deploy time =========

  - id: azure-bp-assignment-grant-perm
    emits: CanGrantPermission
    description: "A blueprint definition containing a role-assignment artifact grants RBAC at the deployment scope when the assignment executes — the assigner effectively controls who gets RBAC at that scope."
    match:
      - [ ?principal, CanModifyCode, ?assignment ]
      - [ ?assignment, ExecutesAs, ?mi ]
    where:
      - "node_type(?assignment) == BuildWorker"
      - "the blueprint definition deployed by ?assignment contains at least one role-assignment artifact (kind=roleAssignment)"
      - "?mi holds EFFECTIVE Microsoft.Authorization/roleAssignments/write at the deployment scope (else the artifact fails at deploy time)"
    emit:
      source_type: Identity
      target_type: Identity
      source: "<principal>"
      target: "<any principal that can be named in the role-assignment artifact>"
      permissions:
        - "Microsoft.Blueprint/blueprints/artifacts/write"
      conditions: [iam_permission, role_compatibility]
      state_logic: >-
        CONDITIONAL(trigger_exists) when the principal can modify the role-assignment
        artifact but must wait for the next assignment execution to realize the grant.
        ACTIVE when the principal also holds blueprintAssignments/write (trigger in same
        step). Inherit weakest with CanModifyCode contributor. BLOCKED if the assignment
        MI does not hold roleAssignments/write at the scope (grant would fail at deploy
        time -> CONDITIONAL(iam_permission) on the MI RBAC gate).
      confidence: "0.85"
      derived_from:
        - "<CanModifyCode edge_id (principal -> blueprint assignment)>"
        - "<ExecutesAs edge_id (blueprint assignment -> MI)>"
        - "azure/identity-escalation.yaml#azure-role-assignment-write (canonical roleAssignments/write -> CanGrantPermission)"
      false_positive_note: >-
        The grant only occurs at assignment-execution time; modifying the role-assignment
        artifact without a subsequent assignment-execute produces no grant. The MI must
        independently hold Microsoft.Authorization/roleAssignments/write at the deployment
        scope — if it does not, the artifact creation fails (400 Bad Request). Role
        assignments created by blueprint artifacts PERSIST after the blueprint assignment
        is deleted (they are NOT removed by deleting the assignment). Do not model them
        as a deny assignment (deny assignments ARE removed by delete). The can-control
        linchpin control-boundary-via-iam-admin rolls this CanGrantPermission into
        Controls(scope) when it is scoped to a boundary — cite, do not duplicate.
      narrative: >-
        {principal.name} can modify the role-assignment artifacts in the blueprint
        definition for {assignment.name}; on the next assignment execution, the assignment
        MI ({mi.name}) creates those role assignments at the deployment scope, effectively
        granting RBAC to any principal named in the artifact.

  # === EXECUTE AS: deferred to linchpins =========================================
  # CanExecuteAs is produced by the provider-agnostic linchpins:
  #   - cicd-chains.yaml#cicd-modify-buildspec-executes-as: CanModifyCode + ExecutesAs
  #   - can-execute-as.yaml#execute-as-via-config-identity-swap: CanModifyConfiguration + CanPassIdentity
  # These rules consume the facts (CanModifyCode, CanModifyConfiguration, CanPassIdentity,
  # ExecutesAs) emitted by the explicit rules in /rules/explicit/azure-blueprints.yaml.
  # Do NOT emit CanExecuteAs here (derived nature); let the linchpins collapse those facts.

# ---------------------------------------------------------------------------
# EXPLICIT NORMALIZATION (raw config -> explicit edges)
# These belong in /rules/explicit/azure-blueprints.yaml; no explicit rules file
# is required because these are simple structural facts — listed here so the
# collector knows what to emit.
# ---------------------------------------------------------------------------
explicit_rules:

  - id: azure-bp-assignment-executes-as
    emits: ExecutesAs
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Blueprint/blueprintAssignments"
      field: "identity"
    where:
      - "identity.type in [SystemAssigned, UserAssigned, 'SystemAssigned, UserAssigned']"
    emit:
      source: "<blueprint assignment>"
      target: "<each MI: system-assigned principalId or userAssignedIdentities key>"
      narrative: "Blueprint assignment {assignment.name} executes as managed identity {mi.name}."

  - id: azure-stack-executes-as
    emits: ExecutesAs
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Resources/deploymentStacks"
      field: "identity"
    where:
      - "identity.type in [SystemAssigned, UserAssigned, 'SystemAssigned, UserAssigned']"
    emit:
      source: "<deployment stack>"
      target: "<each MI>"
      narrative: "Deployment Stack {stack.name} executes as managed identity {mi.name}."

  - id: azure-bp-deny-assignment-attached
    emits: HasPolicy
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Authorization/denyAssignments"
      field: "properties.createdBy"
    where:
      - "createdBy matches a Microsoft.Blueprint/blueprintAssignments or Microsoft.Resources/deploymentStacks resource id"
    emit:
      source: "<blueprint assignment or deployment stack>"
      target: "<deny assignment (ConditionalPolicy)>"
      narrative: "Blueprint/Stack {assignment.name} created and owns deny assignment {deny.name}."

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - A deny assignment on Microsoft.Blueprint/blueprints/write,
#    .../artifacts/write, .../blueprintAssignments/write, .../blueprintAssignments/delete,
#    or Microsoft.Resources/deploymentStacks/write -> emit the affected edge as BLOCKED
#    with denied_by=<deny assignment>. If the same assignment that created the deny
#    assignment is ITSELF what the principal is trying to delete, keep BLOCKED until
#    hierarchy-chains guardrail-removal-upgrades-blocked determines there is a
#    non-circular removal path (move-out of scope, or a different principal with the
#    action not covered by the deny).
#  - A Deployment Stack with denySettings=denyAllActions on its own deploymentStacks
#    resource would block azure-stack-deny-settings-change — evaluate the deny
#    assignment scope carefully (it may cover managed resources, not the stack resource
#    itself).
#  - Blueprint Operator role: holds blueprintAssignments/* but NOT blueprints/write or
#    blueprints/artifacts/write. Only azure-bp-assignment-write / azure-bp-pass-identity
#    fire for Blueprint Operators; azure-bp-definition-write / azure-bp-artifact-write
#    require Blueprint Contributor or Owner.
#
# DEFERRED TO LINCHPINS (cited, not duplicated):
#  - CanExecuteAs(principal->MI) general collapse: cicd-chains cicd-modify-buildspec-executes-as
#    (rule azure-bp-execute-as-via-definition is the blueprint-specific framing; deduped).
#  - CanTrigger-only path: cicd-chains cicd-trigger-runner-executes-as (Blueprint Operator
#    writing an assignment to an EXISTING definition is a CanTrigger + existing definition;
#    CONDITIONAL(attacker_influenced_definition)).
#  - CanEscalateTo rollup: can-control escalate-via-execute-as.
#  - Controls(boundary) from CanGrantPermission: can-control control-boundary-via-iam-admin.
#  - Guardrail BLOCKED->ACTIVE upgrade: hierarchy-chains guardrail-removal-upgrades-blocked
#    (fed by azure-bp-delete-removes-deny and azure-stack-deny-settings-change).
#  - Parent->child scope inheritance: hierarchy-chains admin-inherits-down-contains.
# ---------------------------------------------------------------------------
