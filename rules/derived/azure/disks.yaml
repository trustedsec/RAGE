#     read-secret-yields-identity: ContainsSecret + CredentialsFor -> CanImpersonate
#     decrypt-gates-secret-read: CanDecrypt on wrapping key upgrades CONDITIONAL
#       CanReadData to ACTIVE (relevant for azure-disk-cmk-gated-read)
#     impersonate-is-escalation: CanImpersonate -> CanEscalateTo when privilege > caller
#   /rules/derived/can-control.yaml:
#     control-via-admin: CanAdminister -> Controls
#     escalate-via-execute-as: CanExecuteAs -> CanEscalateTo
