# Azure Firewall (Microsoft.Network/azureFirewalls) — Derived attack-path rules (Phase 8 networking)
# ---------------------------------------------------------------------------
# Azure Firewall is a fully stateful managed NGFW-as-a-service (Layer 4–7)
# deployed in a dedicated AzureFirewallSubnet. It enforces NAT, Network, and
# Application rule collections for North–South and East–West traffic.
#
# Attack surface (Phase 8 theme — networking):
#   (1) WEAKEN CONTROLS: Microsoft.Network/azureFirewalls/write (classic model)
#       or Microsoft.Network/firewallPolicies/ruleCollectionGroups/write (modern
#       Firewall Policy model) lets an attacker replace rule collections to insert
#       ALLOW or DNAT rules — opening previously blocked paths or publishing internal
#       resources to the internet.
#   (2) EXPOSURE: Active DNAT rule collections translate (public-IP, port) to
#       (internal-IP, port), making an internal resource reachable from the internet
#       via the firewall's public endpoint. Each such rule is both an ExposedToInternet
#       fact on the firewall/public endpoint and a RoutesTo fact to the destination subnet.
#
# Transitive end-to-end CanNetworkReach (firewall DNAT + route + NSG composing into
# host-level reachability) is a FUTURE provider-agnostic network-chains linchpin.
# DO NOT derive it here. Emit per-service FACTS only.
#
# can-control.yaml is CITED, not duplicated: CanAdminister -> Controls derivations
# are handled there and apply to Firewall and FirewallPolicy objects.
#
# Permissions verified against Microsoft.Network operations reference (2026-09 snapshot):
#   Microsoft.Network/azureFirewalls/write
#   Microsoft.Network/firewallPolicies/write
#   Microsoft.Network/firewallPolicies/ruleCollectionGroups/write
#   Microsoft.Network/azureFirewalls/read
#   Microsoft.Network/firewallPolicies/read
#   Microsoft.Network/firewallPolicies/ruleCollectionGroups/read
# ---------------------------------------------------------------------------

provider: azure
phase: 8-networking
applies_to: [azure]

rules:

  # ===========================================================================
  # RULE 1 — WEAKEN CONTROLS: firewall write -> CanModifyConfiguration
  # Covers BOTH the classic azureFirewalls/write and the modern
  # firewallPolicies/ruleCollectionGroups/write paths.
  # ===========================================================================

  - id: azure-firewall-write-weaken
    emits: CanModifyConfiguration
    description: >-
      Write access to the Azure Firewall object (classic model) lets an attacker add or replace NAT,
      Network, or Application rule collections — inserting ALLOW rules or DNAT entries to open
      previously blocked network paths. When a Firewall Policy is attached, the classic inline
      rule collections become read-only (policy model takes precedence).
    match_effective_permission:
      action: "Microsoft.Network/azureFirewalls/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Network
      source: "<principal>"
      target: "<Azure Firewall (Firewall node)>"
      permissions:
        - "Microsoft.Network/azureFirewalls/write"
      state_logic: >-
        ACTIVE: if firewall.properties.firewallPolicy is null or empty. The principal can PUT
        a modified firewall object (replacing the entire classic rule set in one ARM PUT);
        effect realized at next Azure Firewall rule-processing cycle (near-instant).
        CONDITIONAL(service_state): if firewall has a linked firewallPolicy, the classic inline
        rule collections are read-only. The write action is accepted but produces no rule-change effect.
        BLOCKED if a deny assignment covers azureFirewalls/write at the firewall/RG/sub scope,
        or if Azure Policy (deny effect) blocks firewall writes at an assigned scope.
      false_positive_note: >-
        The classic azureFirewalls/write only grants control over inline rule collections.
        When a Firewall Policy is linked (firewallPolicy property non-null), the policy model
        overrides classic rules — the write still succeeds but is ineffective for adding attack rules.
        A Reader assignment (azureFirewalls/read only) does NOT yield this capability.
        In a hub-spoke topology, control of the hub firewall affects traffic for all spoke VNets.
      narrative: >-
        {principal.name} can modify rule collections on Azure Firewall {target.name}
        via Microsoft.Network/azureFirewalls/write (classic model), enabling insertion of ALLOW
        or DNAT rules that open previously blocked network paths. Effect only applies if no
        Firewall Policy is attached.
      derived_from: ["iam:effective_permission(Microsoft.Network/azureFirewalls/write, {source}, {target})"]

  - id: azure-firewall-policy-write-attach
    emits: CanModifyPolicy
    description: >-
      Write access to a Firewall Policy enables replacing or re-parenting the policy's basePolicy
      (policy hierarchy inheritance) or attaching the policy to additional Azure Firewalls,
      amplifying blast radius when a single policy controls multiple firewalls. This is a
      distinct capability from ruleCollectionGroups/write (which modifies rules only).
    match_effective_permission:
      action: "Microsoft.Network/firewallPolicies/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Policy
      source: "<principal>"
      target: "<Firewall Policy (GenericPolicy node)>"
      permissions:
        - "Microsoft.Network/firewallPolicies/write"
      state_logic: >-
        ACTIVE: the principal can PUT a modified policy object (replacing basePolicy reference
        or reassigning firewall attachments); effect realized immediately in the policy
        control plane. BLOCKED if deny assignment or Azure Policy deny covers firewallPolicies/write.
      false_positive_note: >-
        This is a POLICY mutation, not a rule-set edit. Changing basePolicy can inherit
        rules from a parent (escalation via hierarchy). Reassigning firewall attachments
        multiplies the blast radius across multiple firewalls.
      narrative: >-
        {principal.name} can modify Firewall Policy {target.name} via Microsoft.Network/firewallPolicies/write,
        enabling replacement of the basePolicy hierarchy or reassignment to additional firewalls.
      derived_from: ["iam:effective_permission(Microsoft.Network/firewallPolicies/write, {source}, {target})"]

  - id: azure-firewall-policy-rule-groups-write
    emits: CanModifyConfiguration
    description: >-
      Write access to Firewall Policy rule collection groups allows an attacker to add or replace
      NAT, Network, or Application rule collection groups — inserting ALLOW or DNAT entries to
      open previously blocked network paths.
    match_effective_permission:
      action: "Microsoft.Network/firewallPolicies/ruleCollectionGroups/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Network
      source: "<principal>"
      target: "<Azure Firewall linked to this policy (Firewall node)>"
      permissions:
        - "Microsoft.Network/firewallPolicies/ruleCollectionGroups/write"
      state_logic: >-
        ACTIVE: the principal can PUT a modified rule collection group (inserting a high-priority
        collection to override existing rules); effect realized at next Azure Firewall rule-processing
        cycle. BLOCKED if deny assignment or Azure Policy deny covers ruleCollectionGroups/write.
      false_positive_note: >-
        This rule targets the Firewall (Network class) linked to the policy. An attacker modifying
        a policy's rule collection group affects all firewalls that reference the policy.
      narrative: >-
        {principal.name} can modify rule collection groups on the Firewall Policy affecting
        {target.name} via Microsoft.Network/firewallPolicies/ruleCollectionGroups/write,
        enabling insertion of ALLOW or DNAT rules.
      derived_from: ["iam:effective_permission(Microsoft.Network/firewallPolicies/ruleCollectionGroups/write, {source}, {target})"]

  # ===========================================================================
  # RULE 2 — EXPOSURE: active DNAT rule -> ExposedToInternet + RoutesTo
  # ===========================================================================

  - id: azure-firewall-dnat-exposure
    emits: ExposedToInternet
    description: >-
      When an Azure Firewall has active DNAT rules and a public IP allocated, resources
      translated by those rules are exposed to the internet via the firewall's public endpoint.
      This is emitted as internet exposure on the firewall node itself (as a Network class that
      has public reachability).
    match_effective_permission:
      action: >-
        EXISTS natRuleCollections[].rules[].action.type == 'Dnat' OR
        EXISTS firewallPolicy AND linked_policy_has DNAT_rules
      scope_type: "resource"
    emit:
      source_type: Network
      target_type: AnonymousIdentity
      source: "<Azure Firewall with active DNAT and public IP allocated>"
      target: "<AnonymousIdentity>"
      permissions: []
      conditions: [network_reachability, service_state]
      state_logic: >-
        ACTIVE when: firewall provisioningState == Succeeded AND a public IP is allocated
        in ipConfigurations AND the firewall/policy has at least one active DNAT rule with
        valid translatedAddress. CONDITIONAL(service_state) if firewall is Deallocated
        (no public IP allocated). CONDITIONAL(network_reachability) if the firewall itself
        is not internet-reachable (e.g., isolated in a private network, though that would
        defeat the purpose of public IP allocation).
      false_positive_note: >-
        DNAT rules without valid translatedAddress (null or malformed) are not genuine exposure.
        Deallocated firewalls cannot process DNAT. Verify via the explicit DNAT normalization
        rules that a RoutesTo edge exists (proof of active rule + public IP + resolved destination).
      narrative: >-
        Azure Firewall {source.name} has active DNAT rules translating traffic from its
        public endpoint, exposing internal resources to the internet.
      derived_from: ["iam:firewall_dnat_config({source})"]


# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - A deny assignment (Azure Blueprint / Managed Application) covering
#     Microsoft.Network/azureFirewalls/write or firewallPolicies/ruleCollectionGroups/write
#     at the firewall/RG/sub scope -> emit azure-firewall-write-weaken with state: BLOCKED
#     and denied_by=<deny assignment id>.
#   - Azure Policy (deny effect) blocking firewall writes at an assigned scope ->
#     emit with state: BLOCKED and policy_assignment=<assignment id>.
#   - A firewall in Deallocated state (no public IP allocated) cannot process DNAT rules;
#     emit azure-firewall-dnat-exposure / azure-firewall-dnat-routes-to with
#     state: CONDITIONAL(service_state).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Explicit normalization rules are now in /rules/explicit/azure-firewall.yaml
# (azure-firewall-dnat-rule-record, azure-firewall-policy-dnat-rule-record, etc.).
# Derived rules in this file match the explicit RoutesTo edges produced there.
# ---------------------------------------------------------------------------
