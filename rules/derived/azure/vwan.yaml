# Azure Virtual WAN / ExpressRoute / VPN — Derived attack-path rules (Phase 8 networking)
# ---------------------------------------------------------------------------
# Resource providers:
#   Microsoft.Network/virtualWans
#   Microsoft.Network/virtualHubs
#   Microsoft.Network/virtualHubs/hubVirtualNetworkConnections
#   Microsoft.Network/virtualHubs/hubRouteTables
#   Microsoft.Network/vpnGateways  (hub-hosted)
#   Microsoft.Network/vpnGateways/vpnConnections
#   Microsoft.Network/vpnSites
#   Microsoft.Network/expressRouteGateways (hub-hosted)
#   Microsoft.Network/expressRouteGateways/expressRouteConnections
#   Microsoft.Network/expressRouteCircuits
#
# Attack surface: Virtual WAN hubs act as managed transit routers — every active
# hub VNet connection, VPN tunnel, and ExpressRoute connection extends network-layer
# reach to ALL other resources connected to the same hub (and, in Standard vWAN,
# across hubs globally). This makes the hub a pivot point across the entire connected
# estate: VNets, branches, and on-premises.
#
# PHASE 8 THEME — per the task ground rules:
#   (1) EXPOSURE: internet-facing endpoints are NOT primary for vWAN (hubs are not
#       directly internet-exposed resources); PSK exposure is modeled via CanReadSecret.
#   (2) REACHABILITY PIVOTS (lateral movement): hub VNet connections and VPN/ER
#       connections → RoutesTo facts (transit pivot). 2 rules as specified.
#   (3) PRIVATE CONNECTIVITY: out of scope here; Private Endpoint facts live in vnet.yaml.
#   (4) WEAKEN CONTROLS: hub connection write → CanModifyConfiguration.
#   (5) DNS TAKEOVER: not applicable to vWAN.
#
# Transitive end-to-end CanNetworkReach (hub-A-spoke + hub-B-spoke composing into
# full estate reachability) is a FUTURE provider-agnostic network-chains linchpin.
# Emit per-service FACTS only; do NOT derive CanNetworkReach here.
#
# can-control.yaml is CITED, not duplicated: CanAdminister → Controls is handled
# there and applies equally to vWAN/hub objects.
#
# Permissions are exact operation strings from the Azure resource-provider operations
# reference (Microsoft.Network), verified 2026-09. No permissions are invented.
# ---------------------------------------------------------------------------

provider: azure
phase: 8-networking
applies_to: [azure]

rules:

  # ===========================================================================
  # SECTION 1 — CONFIGURATION CONTROL: hub and routing modifications
  # ===========================================================================
  # NOTE: Explicit RoutesTo facts are in /rules/explicit/azure/vwan.yaml.
  # Derived attack rules compose explicit routing facts into multi-step capabilities.

  - id: azure-vwan-hub-connection-write
    emits: CanModifyConfiguration
    description: >-
      Write access to hub VNet connections (hubVirtualNetworkConnections/write) lets an
      attacker attach a new spoke VNet to the hub, inserting an attacker-controlled VNet
      into the transit topology and gaining network-layer reach to all existing connected
      resources, or detach an existing spoke to disrupt connectivity.
    match_effective_permission:
      action: "Microsoft.Network/virtualHubs/hubVirtualNetworkConnections/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: TransitGateway
      source: "<principal>"
      target: "<Virtual Hub (TransitGateway node)>"
      permissions: ["Microsoft.Network/virtualHubs/hubVirtualNetworkConnections/write"]
      conditions: [iam_permission]
      state_logic: >-
        CONDITIONAL(iam_permission): the principal has hubVirtualNetworkConnections/write
        but ALSO needs Microsoft.Network/virtualNetworks/join/action (or equivalent) on
        the spoke VNet being connected. If the spoke VNet is in another subscription, they
        additionally need cross-subscription RBAC. Verify both the hub-side write and the
        spoke-side join permission before marking ACTIVE. A principal with only hub-write
        cannot successfully attach a spoke without the spoke-side permission.
        Emit BLOCKED if a deny assignment covers the write action at the hub, RG, or subscription scope.
      false_positive_note: >-
        Adding a hub connection is a two-permission gate: Microsoft.Network/virtualHubs/hubVirtualNetworkConnections/write
        (hub-side) AND Microsoft.Network/virtualNetworks/join/action or Contributor on the
        spoke VNet (spoke-side). The CanModifyConfiguration edge records the hub-side capability;
        the spoke-side RBAC gate is a separate condition. Network Contributor on the hub RG
        typically includes both permissions. Only emit as ACTIVE if BOTH permissions are
        confirmed for the principal in the same scope (or cross-subscription RBAC is verified).
      narrative: >-
        {principal.name} can create or modify spoke VNet connections on hub {target.name}
        (hubVirtualNetworkConnections/write), but requires additional join permission on the
        spoke VNet to successfully complete the attachment and gain network reach to all
        connected spokes.
      derived_from: ["<effective permission record: virtualHubs/hubVirtualNetworkConnections/write>"]

  - id: azure-vwan-hub-routetable-write
    emits: CanModifyConfiguration
    description: >-
      Write access to hub route tables (hubRouteTables/write) lets an attacker inject custom
      routes redirecting spoke traffic through an attacker-controlled next hop (NVA/VM),
      enabling network interception or MitM within the vWAN transit topology.
    match_effective_permission:
      action: "Microsoft.Network/virtualHubs/hubRouteTables/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: TransitGateway
      source: "<principal>"
      target: "<Virtual Hub (TransitGateway node)>"
      permissions: ["Microsoft.Network/virtualHubs/hubRouteTables/write"]
      state_logic: >-
        ACTIVE: the principal can create or modify hub route table entries immediately.
        Route changes propagate to connected spokes automatically via BGP.
        Emit BLOCKED if a deny assignment covers this action at the hub or RG scope.
      false_positive_note: >-
        The default route table (defaultRouteTable) governs all traffic not matched by
        custom tables; write access to it redirects traffic for all connected spokes.
        Custom route tables only affect spokes explicitly associated with that table.
        Actual traffic interception requires a valid, reachable next-hop NVA/VM at the
        injected address — if the attacker does not control a resource at the next-hop IP,
        traffic is blackholed not intercepted. Record which route table (default vs. custom)
        the effective permission applies to as a property on the emitted edge.
      narrative: >-
        {principal.name} can modify hub route tables on {target.name} (hubRouteTables/write),
        enabling injection of custom routes to redirect spoke traffic through an attacker-
        controlled next hop for network interception within the vWAN topology.
      derived_from: ["<effective permission record: virtualHubs/hubRouteTables/write>"]

  # ===========================================================================
  # SECTION 3 — CREDENTIAL EXPOSURE: VPN pre-shared key
  # ===========================================================================

  - id: azure-vwan-vpn-psk-read
    emits: CanReadSecret
    description: >-
      A principal with read access to a hub VPN connection resource can retrieve the
      pre-shared key (PSK) in plaintext from the ARM GET response (sharedKey field).
      The PSK enables establishing a rogue S2S VPN tunnel to the same hub, granting
      network-layer transit reach to all connected spoke VNets.
    match_effective_permission:
      action: "Microsoft.Network/vpnGateways/vpnConnections/read"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "vpnConnections resource properties.sharedKey is non-null and non-empty"
    emit:
      source_type: Identity
      target_type: Secret
      source: "<principal>"
      target: "<PSK secret modeled as a Secret node for the VPN connection>"
      permissions: ["Microsoft.Network/vpnGateways/vpnConnections/read"]
      state_logic: >-
        ACTIVE when the principal has effective vpnConnections/read permission at the
        gateway or containing scope AND the sharedKey field is non-null in the ARM
        resource. The PSK is stored and readable regardless of whether the tunnel is
        currently connected (a NotConnected or Connecting tunnel still exposes the PSK,
        enabling an attacker to establish a new tunnel). CONDITIONAL(iam_permission) if
        the permission is inherited from a broad scope (e.g. subscription-level Reader)
        and a deny assignment at a narrower scope may override it — verify effective
        permissions, not just assignment role.
      derived_from: ["<effective permission record: vpnGateways/vpnConnections/read>", "<vpnConnection ARM resource with sharedKey field>"]
      false_positive_note: >-
        P2S VPN gateways use certificate or Azure AD / Entra OIDC authentication — no PSK
        is stored; do NOT emit for P2sVpnGateways. ExpressRoute circuits also have no PSK.
        Only emit for Microsoft.Network/vpnGateways/vpnConnections where sharedKey is
        present. Reader role at subscription scope includes vpnConnections/read and CAN
        read the PSK — the PSK is not separately gated beyond ARM read access. Note that
        retrieving the PSK alone does not yield immediate network access: the attacker
        must also provision a compatible VPN device/gateway configured with the same
        parameters (IKEv2 settings, BGP ASN if used) to establish the tunnel — model
        as ACTIVE because the prerequisite (PSK material) is fully obtained.
        Do not emit if sharedKey is null or empty (AAD/certificate-authenticated connections).
      narrative: >-
        {principal.name} can read the pre-shared key of VPN connection {vpnConnection.name}
        on hub gateway {vpnGateway.name} (vpnGateways/vpnConnections/read). The PSK enables
        establishing a rogue S2S tunnel to the same hub, granting network transit reach to
        all spoke VNets and branches connected to hub {hub.name}.

  # NOTE: CanAdminister (azure-vwan-contributor) is moved to /rules/explicit/azure/vwan.yaml
  # because CanAdminister is nature: explicit in edges.yaml and cannot appear in derived files.

  # ===========================================================================
  # SECTION 3 — MISSING: Routing Intent and ExpressRoute Authorization
  # ===========================================================================

  - id: azure-vwan-hub-routingintent-write
    emits: CanModifyConfiguration
    description: >-
      Write access to hub routing intent policies (routingIntentPolicies/write) lets an
      attacker modify inter-hub and internet traffic routing, redirecting traffic flows
      through attacker-controlled firewalls or NVAs or disabling firewall inspection entirely.
    match_effective_permission:
      action: "Microsoft.Network/virtualHubs/routingIntentPolicies/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: TransitGateway
      source: "<principal>"
      target: "<Virtual Hub (TransitGateway node)>"
      permissions: ["Microsoft.Network/virtualHubs/routingIntentPolicies/write"]
      conditions: [service_state]
      state_logic: >-
        ACTIVE when the principal has effective routingIntentPolicies/write permission at
        the hub or containing scope AND Routing Intent feature is available (Standard vWAN
        with Microsoft.Network/virtualHubs/routingIntentPolicies provider registered).
        CONDITIONAL(service_state) if the resource provider is not registered in the subscription.
        Note: routingIntentPolicies is GA as of 2023-01 but provider registration is required.
      false_positive_note: >-
        routingIntentPolicies (collection endpoint marked 'preview' in API docs) controls
        whether inter-hub and internet traffic flows through a Secure Hub (Azure Firewall or NVA).
        Write access enables disabling the firewall, enabling it on a malicious NVA, or
        redirecting traffic through an attacker-controlled device. Only emitted for hubs
        with Routing Intent support (Standard vWAN). Do not emit for Basic vWAN.
      narrative: >-
        {principal.name} can modify routing intent policies on hub {target.name}
        (routingIntentPolicies/write), enabling redirection of inter-hub and internet
        traffic through an attacker-controlled firewall or NVA or disabling firewall
        inspection.
      derived_from: ["<effective permission record: virtualHubs/routingIntentPolicies/write>"]

  - id: azure-vwan-er-authkey-read
    emits: CanReadSecret
    description: >-
      A principal with read access to ExpressRoute circuit authorizations can retrieve the
      authorization key in plaintext, enabling a gateway in a DIFFERENT subscription to
      connect to the same circuit, bridging network topologies and bypassing subscription
      boundaries.
    match_effective_permission:
      action: "Microsoft.Network/expressRouteCircuits/authorizations/read"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Secret
      source: "<principal>"
      target: "<ER authorization key modeled as a Secret node>"
      permissions: ["Microsoft.Network/expressRouteCircuits/authorizations/read"]
      state_logic: >-
        ACTIVE when the principal has effective expressRouteCircuits/authorizations/read
        permission at the circuit, RG, or subscription scope AND the authorization key
        material is retrievable from the ARM response. The key alone is fully usable:
        an attacker controls or can provision an ExpressRoute Gateway in ANY subscription
        to redeem it and connect to the circuit, bridging the local estate to on-premises
        networks connected via that circuit.
      false_positive_note: >-
        The ER authorization key is a cross-subscription credential: its value enables
        external gateways to connect to the circuit. The key is fully exposed (no secondary
        gate) once read. An attacker who retrieves the key gains the ability to connect a
        gateway in a different subscription or Azure tenant (if authorized) to the same
        circuit — a network-layer pivot across account/subscription boundaries. Model
        as ACTIVE because the prerequisite (key material) is fully obtained.
      narrative: >-
        {principal.name} can read the authorization key for ExpressRoute circuit {circuit.name}
        (expressRouteCircuits/authorizations/read), enabling a gateway in a different subscription
        to connect to the circuit and bridge network topologies across subscription boundaries.
      derived_from: ["<effective permission record: expressRouteCircuits/authorizations/read>"]

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - Any deny assignment (Azure Blueprint / Managed Application) covering the
#     relevant write action at the hub or vWAN scope -> emit with state: BLOCKED
#     and denied_by=<deny assignment id>.
#   - Azure Policy (deny effect) blocking hubVirtualNetworkConnections/write or
#     hubRouteTables/write -> BLOCKED.
#   - Reader role at a scope with an explicit Deny Assignment covering
#     vpnConnections/read -> BLOCKED for azure-vwan-vpn-psk-read.
#   - Deny assignment on expressRouteCircuits/authorizations/read -> BLOCKED
#     for azure-vwan-er-authkey-read.
# ---------------------------------------------------------------------------
