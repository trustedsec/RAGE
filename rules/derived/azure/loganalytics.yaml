#  - A deny assignment covering Microsoft.OperationalInsights/workspaces/write
#    at the effective scope -> BLOCKED on azure-siem-workspace-admin and
#    azure-siem-workspace-write-config.
#  - A deny assignment covering workspaces/delete -> BLOCKED on
#    azure-siem-workspace-delete.
#  - A deny assignment covering workspaces/purge/action -> BLOCKED on
#    azure-siem-workspace-purge.
#  - A deny assignment covering Microsoft.SecurityInsights/alertRules/delete ->
#    BLOCKED on azure-siem-analytics-rule-delete.
#  - A deny assignment covering Microsoft.SecurityInsights/alertRules/write ->
#    BLOCKED on azure-siem-analytics-rule-write.
#  - A deny assignment covering Microsoft.SecurityInsights/dataConnectors/delete ->
#    BLOCKED on azure-siem-data-connector-delete.
#  - A deny assignment covering Microsoft.SecurityInsights/automationRules/write ->
#    BLOCKED on azure-siem-automation-rule-write.
#  - A deny assignment covering workspaces/query/*/action -> BLOCKED on
#    azure-siem-workspace-query. Table-level query RBAC restricts to specific tables
#    -> downgrade to CONDITIONAL(resource_policy) for tables outside the grant.
#  - A deny assignment covering workspaces/dataExports/write -> BLOCKED on
#    azure-siem-data-export-write.
#  - A deny assignment covering Microsoft.Logic/workflows/write on the playbook
#    Logic App -> BLOCKED on azure-siem-playbook-modify.
#  - Playbook has no managed identity -> azure-siem-playbook-modify CanModifyCode
#    still emits (the code runs), but can-execute-as execute-as-via-code-modify
#    does NOT fire (no ExecutesAs edge) -> no CanExecuteAs derived.
