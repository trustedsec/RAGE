# Azure — Log Analytics & Sentinel (Microsoft.OperationalInsights + Microsoft.SecurityInsights)
# derived attack-path rules (Phase 12 — security & logging)
# ---------------------------------------------------------------------------
# PHASE-12 SERVICE ADAPTER. Two resource providers in one attack surface:
#   - Microsoft.OperationalInsights (Log Analytics workspaces, tables, data exports)
#   - Microsoft.SecurityInsights (Sentinel analytics rules, automation rules,
#     data connectors, playbooks — which are Logic Apps)
#
# THREE MODES (per Phase-12 theme):
#
# (1) DEFENSE EVASION / TAMPERING (dominant mode):
#     Disabling / deleting detective controls weakens detection but does NOT grant
#     access to other resources and is NOT privilege escalation. These rules emit
#     CanModifyConfiguration and CanDeleteData on LoggingService / SecurityService
#     nodes ONLY. Do NOT chain these to CanEnterSubscription, CanExecuteAs, or any
#     escalation edge.
#       - Microsoft.OperationalInsights/workspaces/delete — destroy workspace (logs gone)
#       - Microsoft.OperationalInsights/workspaces/purge/action — irreversible data purge
#       - Microsoft.OperationalInsights/workspaces/write (cap=0) — halt ingestion silently
#       - Microsoft.SecurityInsights/alertRules/delete — silence specific detections
#       - Microsoft.SecurityInsights/alertRules/write — disable / modify detection KQL
#       - Microsoft.SecurityInsights/dataConnectors/delete — cut a data source feed
#       - Microsoft.SecurityInsights/automationRules/write — suppress/redirect response
#
# (2) EXECUTION (Sentinel playbooks = Logic Apps run as managed identities):
#     Microsoft.Logic/workflows/write on a Sentinel playbook => CanModifyCode on the
#     Workflow node. can-execute-as execute-as-via-code-modify + cicd-chains collapse
#     CanModifyCode(playbook) + ExecutesAs(playbook, MI) => CanExecuteAs(MI). The
#     iam:PassRole analog (automationRules/write to redirect trigger) is modeled as
#     CanModifyConfiguration on the automation rule resource — NOT a CanExecuteAs
#     source on its own (requires Logic App write for code control).
#     CITE: can-execute-as.yaml, cicd-chains.yaml.
#
# (3) DATA:
#     Microsoft.OperationalInsights/workspaces/query/*/action => CanReadData (logs
#     may contain tokens/keys/credentials). 1 conservative rule.
#     Microsoft.OperationalInsights/workspaces/dataExports/write => CanExfiltrate
#     (redirect export sink to attacker-controlled storage/event hub).
#
# LINCHPINS CITED (do NOT re-derive):
#   can-execute-as.yaml   execute-as-via-code-modify:
#                         CanModifyCode(?p, ?playbook) + ExecutesAs(?playbook, ?mi)
#                         => CanExecuteAs(?p, ?mi).
#   cicd-chains.yaml      cicd-modify-buildspec-executes-as (rule 1):
#                         CanModifyCode(runner) + ExecutesAs => CanExecuteAs.
#   cicd-chains.yaml      cicd-trigger-runner-executes-as (rule 2):
#                         CanTrigger(runner) + ExecutesAs => CanExecuteAs CONDITIONAL.
#   can-control.yaml      escalate-via-execute-as:
#                         CanExecuteAs => CanEscalateTo when privilege > attacker.
#   azure/logicapps.yaml  azure-la-workflow-write-modifycode, azure-la-contributor,
#                         azure-la-attach-user-mi, azure-la-executes-as-mi (explicit):
#                         Full Logic App attack surface applies to Sentinel playbooks.
#   credential-chains.yaml read-secret-yields-identity:
#                         CanReadSecret + CredentialsFor => CanImpersonate.
#
# NODE CLASS NOTES:
#   Log Analytics workspace => LoggingService (ManagementService subtype).
#   Sentinel analytics rule / automation rule / data connector => SecurityService.
#   Sentinel playbook => Workflow (Messaging class — see azure:logicapps).
#   CanModifyConfiguration target set in edges.yaml includes "*"; LoggingService and
#   SecurityService are within ManagementService which is "*". Confirmed valid.
#   CanDeleteData target set: [Storage, Data]. LoggingService is ManagementService,
#   not Storage/Data. Use CanDelete (resource_control, target="*") for workspace
#   deletion since CanDeleteData source restricts to Storage/Data only.
#
# EVASION ACCURACY NOTE (all evasion rules):
#   Detective controls reduce detection probability; they do NOT set BLOCKED on
#   existing attacker-capability edges elsewhere in the graph. Deletion/disabling
#   of Sentinel resources does NOT grant access to protected resources. The narrative
#   and false_positive_note on every evasion rule must state this explicitly.
#
# All operation strings from the official Microsoft.OperationalInsights and
# Microsoft.SecurityInsights resource-provider operations references, 2026-09.
# No permissions hallucinated.
# ---------------------------------------------------------------------------

provider: azure
phase: 12-security-logging
applies_to: [azure]

rules:

  # ===========================================================================
  # 1. Administrative control — Log Analytics workspace
  # ===========================================================================

  - id: azure-siem-workspace-admin
    emits: CanAdminister
    description: "Full control of a Log Analytics workspace (Log Analytics Contributor / Contributor / Owner)."
    match_effective_permission:
      action: "Microsoft.OperationalInsights/workspaces/write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds Log Analytics Contributor, Contributor, Owner, or a custom role granting Microsoft.OperationalInsights/workspaces/* at the scope"
    emit:
      source_type: Identity
      target_type: LoggingService
      source: "<principal>"
      target: "<Log Analytics workspace (LoggingService)>"
      permissions:
        - "Microsoft.OperationalInsights/workspaces/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed; BLOCKED if a deny
        assignment covers workspaces/write at the scope. CanAdminister(workspace)
        does NOT imply CanGrantPermission — escalation is via Sentinel playbook
        managed identities or data exfiltration, not via self role-assignment.
      confidence: 0.98
      derived_from:
        - "effective permission: Microsoft.OperationalInsights/workspaces/write"
      false_positive_note: >-
        NATURE CONFLICT: This rule uses match_effective_permission (derived computation)
        but emits CanAdminister (nature=explicit in edges.yaml). This is a valid normalization
        pattern — it evaluates the effective permission and normalizes it to an edge.
        SEMANTIC LIMITATION: Log Analytics Contributor grants workspaces/write (modification)
        but NOT workspaces/delete (workspace destruction). A principal with only
        workspaces/write but WITHOUT workspaces/delete does NOT qualify for true
        CanAdminister (which implies full admin including deletion). Downgrade to
        CanWrite if workspaces/delete is absent. This rule emits CanAdminister only when
        the principal holds both write AND delete (or Contributor/Owner role which includes
        both). Log Analytics Reader holds only workspaces/read and query/*/action; it does
        NOT qualify for CanAdminister or CanWrite.
      narrative: >-
        {principal.name} has full administrative control of Log Analytics workspace
        {target.name} (Microsoft.OperationalInsights/workspaces/*), including
        retention settings, data sources, pricing tier, and linked services.

  # ===========================================================================
  # 2. EVASION — Workspace deletion (destroy all log evidence)
  # ===========================================================================

  - id: azure-siem-workspace-delete
    emits: CanDelete
    description: "Delete a Log Analytics workspace, destroying all ingested log evidence (defense evasion — cover tracks). Soft-delete for 14 days unless purge is forced. This is resource destruction (CanDelete), not data-row deletion (CanDeleteData). CanDeleteData target set [Storage, Data] excludes LoggingService (ManagementService), so CanDelete (target=*) is semantically correct for resource-level destruction."
    match_effective_permission:
      action: "Microsoft.OperationalInsights/workspaces/delete"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: LoggingService
      source: "<principal>"
      target: "<Log Analytics workspace (LoggingService)>"
      permissions:
        - "Microsoft.OperationalInsights/workspaces/delete"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed; BLOCKED if a deny
        assignment covers workspaces/delete. Note: workspace deletion is soft for
        14 days (recoverable by an authorized admin); permanent loss occurs only
        after retention period or if the workspace has never had a linked cluster
        (then immediate hard delete is possible). The evasion impact degrades over
        time if the workspace is recovered.
      confidence: 0.95
      derived_from:
        - "effective permission: Microsoft.OperationalInsights/workspaces/delete"
      false_positive_note: >-
        EVASION, NOT ESCALATION. Deleting the workspace removes detective capability
        (no logs, no Sentinel alerts) but does NOT grant access to any other Azure
        resource. Do NOT chain this to CanEnterSubscription, CanExecuteAs, or any
        privilege-escalation edge. The 14-day soft-delete means recovery is possible
        if another admin acts quickly — set confidence 0.95 (lower than irreversible
        purge) to reflect the partial recoverability. This reduces detection, not
        grants access.
      narrative: >-
        {principal.name} can delete Log Analytics workspace {target.name}
        (Microsoft.OperationalInsights/workspaces/delete), destroying all ingested
        log and Sentinel alert data. This is a cover-tracks primitive that eliminates
        forensic evidence — it does NOT grant access to other Azure resources.

  # ===========================================================================
  # 3. EVASION — Data purge (irreversible log destruction within a workspace)
  # ===========================================================================

  - id: azure-siem-workspace-purge
    emits: CanDelete
    description: "Purge specific log data from a Log Analytics workspace (irreversible — targeted evidence destruction). The purge/action operation is data-plane irreversible row deletion within an existing workspace (distinct from workspaces/delete which destroys the workspace resource). CanDeleteData target set [Storage, Data] excludes LoggingService (ManagementService), so CanDelete (target=*) is the correct fallback to model data-plane row deletion capability."
    match_effective_permission:
      action: "Microsoft.OperationalInsights/workspaces/purge/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: LoggingService
      source: "<principal>"
      target: "<Log Analytics workspace (LoggingService)>"
      permissions:
        - "Microsoft.OperationalInsights/workspaces/purge/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. purge/action is a distinct
        data-plane permission (not implied by workspaces/write or workspaces/delete);
        it requires explicit grant. The purge operation is irreversible within the
        workspace — purged rows cannot be recovered even by Microsoft support.
        BLOCKED if a deny assignment covers workspaces/purge/action.
      confidence: 0.97
      derived_from:
        - "effective permission: Microsoft.OperationalInsights/workspaces/purge/action"
      false_positive_note: >-
        EVASION, NOT ESCALATION. purge/action allows targeted deletion of specific
        rows matching a KQL predicate (e.g., delete all AzureActivity rows from the
        attack window). Requires a separate POST to purge and a GET to check
        completion. purge/action is NOT implied by workspaces/write or Log Analytics
        Contributor — it requires an explicit RBAC grant (often restricted to a
        separate role). This reduces forensic evidence — it does NOT grant access
        to other Azure resources.
      narrative: >-
        {principal.name} can purge specific log rows from Log Analytics workspace
        {target.name} (purge/action), irreversibly deleting targeted forensic
        evidence. This is a precision cover-tracks primitive — it does NOT grant
        access to other Azure resources.

  # ===========================================================================
  # 4. EVASION — Workspace configuration tampering (halt ingestion via daily cap)
  # ===========================================================================

  - id: azure-siem-workspace-write-config
    emits: CanModifyConfiguration
    description: "Modify Log Analytics workspace configuration (pricing tier, daily cap, retention) to halt or reduce log ingestion silently."
    match_effective_permission:
      action: "Microsoft.OperationalInsights/workspaces/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: LoggingService
      source: "<principal>"
      target: "<Log Analytics workspace (LoggingService)>"
      permissions:
        - "Microsoft.OperationalInsights/workspaces/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. workspaces/write allows
        setting dailyCap (ingestion limit in GB/day; 0 = no ingestion after cap),
        changing retention (shorter retention = less historical evidence), and
        modifying pricing tier (affects alert limits and ingestion behavior).
        BLOCKED if a deny assignment covers workspaces/write.
      confidence: 0.90
      derived_from:
        - "effective permission: Microsoft.OperationalInsights/workspaces/write"
      false_positive_note: >-
        EVASION, NOT ESCALATION. Setting dailyCap=0 or near-zero halts log ingestion
        silently after the cap is reached each day; this reduces monitoring coverage
        without deleting data. This is an effective cover-tracks primitive that is
        hard to detect if monitoring on workspace configuration changes is missing.
        It does NOT grant access to other Azure resources. Confidence 0.90 (lower
        than delete/purge) because cap changes are more noticeable to operators via
        Azure Monitor alerts on cap-exceeded metrics.
      narrative: >-
        {principal.name} can modify the configuration of Log Analytics workspace
        {target.name} (workspaces/write), including setting the daily ingestion cap
        to halt new log ingestion silently. This weakens detective coverage — it
        does NOT grant access to other Azure resources.

  # ===========================================================================
  # 5. EVASION — Sentinel analytics rule deletion (silence specific detections)
  # ===========================================================================

  - id: azure-siem-analytics-rule-delete
    emits: CanModifyConfiguration
    description: "Delete Sentinel analytics rules to silence specific threat detections (defense evasion — disable alerting for attack techniques)."
    match_effective_permission:
      action: "Microsoft.SecurityInsights/alertRules/delete"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Sentinel analytics rule (SecurityService)>"
      permissions:
        - "Microsoft.SecurityInsights/alertRules/delete"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. Microsoft Sentinel
        Contributor, Contributor, and Owner roles hold this permission.
        BLOCKED if a deny assignment covers alertRules/delete.
      confidence: 0.96
      derived_from:
        - "effective permission: Microsoft.SecurityInsights/alertRules/delete"
      false_positive_note: >-
        EVASION, NOT ESCALATION. Deleting an analytics rule removes the KQL-based
        detection that would fire alerts on the attacker's TTPs (e.g., delete the
        "Brute Force" or "Suspicious MFA" rule before performing those actions).
        This does NOT grant access to any Azure resource. Do NOT chain to
        CanEnterSubscription or any escalation edge. Note: Microsoft Sentinel Reader
        does NOT hold alertRules/delete — only Contributor and above.
      narrative: >-
        {principal.name} can delete Sentinel analytics rules in workspace
        {target.name} (Microsoft.SecurityInsights/alertRules/delete), silencing
        specific threat detections. This reduces detection capability — it does
        NOT grant access to other Azure resources.

  # ===========================================================================
  # 6. EVASION — Sentinel analytics rule disable/modify (weaken detection logic)
  # ===========================================================================

  - id: azure-siem-analytics-rule-write
    emits: CanModifyConfiguration
    description: "Disable or modify Sentinel analytics rules to suppress alerts for specific TTPs (defense evasion)."
    match_effective_permission:
      action: "Microsoft.SecurityInsights/alertRules/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Sentinel analytics rule (SecurityService)>"
      permissions:
        - "Microsoft.SecurityInsights/alertRules/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. alertRules/write allows
        setting enabled=false (disable alert), modifying the KQL detection query
        (e.g., add an exclusion for the attacker's IP/account), or changing severity
        and suppression settings. BLOCKED if a deny assignment covers alertRules/write.
      confidence: 0.95
      derived_from:
        - "effective permission: Microsoft.SecurityInsights/alertRules/write"
      false_positive_note: >-
        EVASION, NOT ESCALATION. alertRules/write allows disabling or neutering
        specific detections. Setting enabled=false is the direct evasion path; modifying
        KQL to add an exclusion is more subtle. Neither grants access to Azure resources.
        Do NOT chain to CanEnterSubscription or CanExecuteAs. Microsoft Sentinel
        Contributor holds alertRules/write.
      narrative: >-
        {principal.name} can modify or disable Sentinel analytics rules in workspace
        {target.name} (Microsoft.SecurityInsights/alertRules/write), suppressing
        detections for specific attack techniques. This reduces detection — it does
        NOT grant access to other Azure resources.

  # ===========================================================================
  # 7. EVASION — Sentinel data connector deletion (cut a log source feed)
  # ===========================================================================

  - id: azure-siem-data-connector-delete
    emits: CanModifyConfiguration
    description: "Delete a Sentinel data connector to stop ingestion from a specific data source, creating a blind spot."
    match_effective_permission:
      action: "Microsoft.SecurityInsights/dataConnectors/delete"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Sentinel data connector (SecurityService)>"
      permissions:
        - "Microsoft.SecurityInsights/dataConnectors/delete"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. Deleting a data connector
        stops ingestion from the specific source (Azure AD / M365 / Defender / etc.),
        creating a blind spot in that category of telemetry. BLOCKED if a deny
        assignment covers dataConnectors/delete.
      confidence: 0.93
      derived_from:
        - "effective permission: Microsoft.SecurityInsights/dataConnectors/delete"
      false_positive_note: >-
        EVASION, NOT ESCALATION. Deleting a data connector does not remove historical
        data (already ingested) but prevents new ingestion from that source. The impact
        depends on which connector is deleted — Azure AD connector creates blind spot on
        sign-in anomalies; Defender connector hides endpoint alerts. Does NOT grant access
        to Azure resources. Reconnecting the connector (dataConnectors/write) later is
        trivial for a legitimate admin, but the blind spot during the attack window is real.
      narrative: >-
        {principal.name} can delete Sentinel data connector {target.name}
        (Microsoft.SecurityInsights/dataConnectors/delete), stopping ingestion from
        its data source and creating a blind spot. This reduces detection capability —
        it does NOT grant access to other Azure resources.

  # ===========================================================================
  # 8. EVASION — Sentinel automation rule modification (suppress/redirect response)
  # ===========================================================================

  - id: azure-siem-automation-rule-write
    emits: CanModifyConfiguration
    description: "Modify Sentinel automation rules to suppress automated incident response or redirect handling to an attacker-controlled playbook."
    match_effective_permission:
      action: "Microsoft.SecurityInsights/automationRules/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Sentinel automation rule (SecurityService)>"
      permissions:
        - "Microsoft.SecurityInsights/automationRules/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. automationRules/write allows
        changing the trigger condition (severity, incident type filter), the action
        (suppress response, change playbook target, add/remove action), or disabling
        the rule entirely. BLOCKED if a deny assignment covers automationRules/write.
      confidence: 0.92
      derived_from:
        - "effective permission: Microsoft.SecurityInsights/automationRules/write"
      false_positive_note: >-
        EVASION + PARTIAL EXECUTION (but NOT standalone execution path). automationRules/write
        allows redirecting a Sentinel automation rule to a different playbook. However,
        the attacker still needs Microsoft.Logic/workflows/write on the playbook itself
        to control the playbook code. automationRules/write alone only changes WHICH
        playbook fires (the trigger routing); it does NOT modify the playbook definition.
        Do NOT derive CanModifyCode or CanExecuteAs from automationRules/write alone.
        The evasion value is: disable automated response so incidents queue without being
        acted on (suppression), or redirect to an attacker-controlled playbook already
        under their control.
      narrative: >-
        {principal.name} can modify Sentinel automation rules in workspace {target.name}
        (Microsoft.SecurityInsights/automationRules/write), suppressing automated incident
        response or redirecting triggers to a different playbook. This weakens automated
        response — automationRules/write alone does NOT modify playbook code.

  # ===========================================================================
  # 9. DATA — Workspace log query (read potentially credential-bearing log data)
  # ===========================================================================

  - id: azure-siem-workspace-query
    emits: CanRead
    description: "Execute KQL queries against a Log Analytics workspace, reading ingested log data that may contain tokens, connection strings, API keys, or session credentials. Modeled as CanRead (target: LoggingService) — CanReadData target set is restricted to Storage/Data/Messaging and does not include ManagementService subtypes."
    match_effective_permission:
      action: "Microsoft.OperationalInsights/workspaces/query/*/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: LoggingService
      source: "<principal>"
      target: "<Log Analytics workspace (LoggingService)>"
      permissions:
        - "Microsoft.OperationalInsights/workspaces/query/*/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed at the workspace scope
        (Log Analytics Reader or Log Analytics Contributor includes this permission).
        The query surface is the full set of log tables in the workspace; privilege
        gain depends on what sensitive data is ingested. CONDITIONAL if the workspace
        has table-level RBAC configured (Microsoft.OperationalInsights/workspaces/
        query/{tableName}/action) restricting which tables the principal can query.
        BLOCKED if a deny assignment covers the query action at effective scope.
      confidence: 0.85
      derived_from:
        - "effective permission: Microsoft.OperationalInsights/workspaces/query/*/action"
      false_positive_note: >-
        SCHEMA CONSTRAINT: CanReadData target set [Storage, Data, Messaging] excludes
        LoggingService (ManagementService subtype). CanRead here models data-plane query
        access (not just metadata recon) — this is a schema limitation, not a semantic
        downgrade. Credential-chains pivot (CanReadData + ContainsSecret => CanReadSecret)
        requires explicit ContainsSecret edges on data table nodes (ObjectStorage or Data)
        promoted from the workspace, not derivable from this CanRead edge directly. This rule
        is conservative: credential material in logs depends on application verbosity and is
        not guaranteed. Emit with confidence 0.85 (query access confirmed, but sensitive data
        presence is environment-dependent). Table-level RBAC (query/{tableName}/action) can
        restrict this to specific tables — downgrade to CONDITIONAL if table-level RBAC is
        configured and restricts the attacker's access to sensitive tables. The query endpoint
        (api.loganalytics.io) is network-accessible by default from any Entra-authenticated
        client.
      narrative: >-
        {principal.name} can execute KQL queries against Log Analytics workspace
        {target.name} (workspaces/query/*/action), reading all ingested log data.
        Depending on application logging verbosity, this may expose access tokens,
        connection strings, API keys, or session credentials in log records.

  # ===========================================================================
  # 10. DATA EXFILTRATION — Data export rule write (redirect logs to attacker sink)
  # ===========================================================================

  - id: azure-siem-data-export-write
    emits: CanModifyConfiguration
    description: "Create or modify a workspace data export rule (configuration change). Redirecting logs to an attacker-controlled sink requires CanExfiltrate on the sink itself, which is emitted by a separate rule (azure-siem-data-export-active-to-sink) when export is enabled AND sink is writable. This rule emits CanModifyConfiguration on the workspace to model configuration capability; exfiltration is gated by sink ownership."
    match_effective_permission:
      action: "Microsoft.OperationalInsights/workspaces/dataExports/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: LoggingService
      source: "<principal>"
      target: "<Log Analytics workspace (LoggingService)>"
      permissions:
        - "Microsoft.OperationalInsights/workspaces/dataExports/write"
      conditions: [resource_policy]
      state_logic: >-
        ACTIVE when the principal holds dataExports/write. The ability to create/modify
        an export rule is CONDITIONAL(resource_policy) when sink write permission is
        unconfirmed — the rule can be created but export may fail if the workspace's MI
        (used for export) lacks write on the sink. BLOCKED if a deny assignment covers
        dataExports/write. Exfiltration requires a separate gate: sink must be writable
        by the workspace MI, which is modeled by the azure-siem-data-export-active-to-sink
        rule (emits CanExfiltrate on the sink when enabled=true and sink CanWrite is confirmed).
      confidence: 0.88
      derived_from:
        - "effective permission: Microsoft.OperationalInsights/workspaces/dataExports/write"
      false_positive_note: >-
        CONFIGURATION CHANGE, NOT EXFILTRATION. This rule models write permission on
        the export rule configuration. Actual data exfiltration requires TWO gates:
        (1) dataExports/write (this rule), AND (2) write access to the export sink
        (storage account or event hub). A separate derived rule (azure-siem-data-export-active-to-sink)
        emits CanExfiltrate targeting the sink directly when both conditions are met
        (export enabled=true AND sink is writable). Only tables that support continuous
        export are eligible; not all tables support dataExports. Existing export rules
        can be modified (change sink) without creating a new one. The data exfiltration
        consequence is realized over time as logs stream — not immediate.
      narrative: >-
        {principal.name} can create or modify data export rules in Log Analytics
        workspace {target.name} (dataExports/write), changing which storage account or
        event hub receives the exported logs. Actual exfiltration is realized only if
        the export sink is writable by the workspace managed identity (separate gate).

  # ===========================================================================
  # 11. EXECUTION — Sentinel playbook (Logic App) code modification
  # ===========================================================================

  - id: azure-siem-playbook-modify
    emits: CanModifyCode
    description: "Overwrite a Sentinel automation playbook's Logic App definition to inject attacker code that runs as the playbook's managed identity on the next incident trigger."
    match:
      - [ ?principal, HasPermission, ?logicApp ]
    where:
      - "node_type(?logicApp) == Workflow"
      - "?logicApp is a Sentinel automation playbook (referenced by at least one Microsoft.SecurityInsights/automationRules resource)"
      - "?principal has EFFECTIVE Microsoft.Logic/workflows/write on ?logicApp"
    emit:
      source_type: Identity
      target_type: Workflow
      source: "<principal>"
      target: "<Sentinel playbook (Logic App Workflow node)>"
      permissions:
        - "Microsoft.Logic/workflows/write"
      conditions: [trigger_exists, service_state]
      state_logic: >-
        ACTIVE when the principal holds Microsoft.Logic/workflows/write on the Logic App
        AND the playbook has a managed identity (so can-execute-as fires downstream)
        AND a trigger path exists (active Sentinel automation rule that fires the
        playbook, OR the playbook has a Recurrence trigger). CONDITIONAL(trigger_exists)
        if no confirmed trigger (the modified playbook waits for the next Sentinel
        incident/alert or manual run). BLOCKED if a deny assignment covers
        workflows/write on the Logic App.
      confidence: 0.95
      derived_from:
        - "effective permission: Microsoft.Logic/workflows/write on the Sentinel playbook Logic App"
        - "azure/logicapps.yaml: azure-la-workflow-write-modifycode (same permission, Logic App target)"
        - "can-execute-as.yaml: execute-as-via-code-modify: CanModifyCode(?p, ?playbook) + ExecutesAs(?playbook, ?mi) => CanExecuteAs(?p, ?mi)"
        - "cicd-chains.yaml: cicd-modify-buildspec-executes-as (playbook is a Workflow Compute node; CITE, do not re-derive)"
      false_positive_note: >-
        The key distinction: Microsoft.SecurityInsights/automationRules/write ALONE
        does NOT yield CanModifyCode — it only redirects the Sentinel trigger routing.
        CanModifyCode requires Microsoft.Logic/workflows/write on the Logic App resource
        itself. The collapse to CanExecuteAs is owned by can-execute-as
        execute-as-via-code-modify (and cicd-chains cicd-modify-buildspec-executes-as);
        do NOT re-derive CanExecuteAs here. The playbook MUST have a managed identity
        for the CanExecuteAs chain to fire; if the playbook has no MI, this yields only
        workflow behavior modification (still CanModifyCode but no MI token downstream).
        The trigger may be infrequent (only fires on specific incident types) — emit
        ACTIVE only when an automation rule actively routes to this playbook with a
        permissive enough condition that the attacker can cause it to fire, otherwise
        CONDITIONAL(trigger_exists).
      narrative: >-
        {principal.name} can overwrite the definition of Sentinel playbook {target.name}
        (Microsoft.Logic/workflows/write), injecting attacker-controlled actions that run
        as the playbook's managed identity on the next incident trigger. can-execute-as
        execute-as-via-code-modify derives CanExecuteAs(MI) from CanModifyCode +
        ExecutesAs; cicd-chains cicd-modify-buildspec-executes-as also fires for this
        Workflow node.

  # NOTE: A "ContainsSecret on LoggingService" rule was considered to flag credential
  # material embedded in log data (AzureDiagnostics, AppServiceHTTPLogs, etc.) but
  # is NOT emitted here because ContainsSecret source set is restricted to
  # [Storage, Data, Compute, Messaging] in schema/edges.yaml — LoggingService
  # (ManagementService subtype) is not in scope. The workspace-query rule above
  # (azure-siem-workspace-query, CanRead) covers the read-access primitive. Analysts
  # should use heuristic table-name matching (AzureDiagnostics, AppServiceHTTPLogs,
  # KubePodInventory) in collection queries to promote a workspace to ContainsSecret
  # on its data tables once explicit evidence is available; no graph rule emitted here.

  # ===========================================================================
  # DERIVED ESCALATION (CanExecuteAs) — CITED, NOT RE-DERIVED
  # ===========================================================================
  # The following CanExecuteAs derivations are owned by linchpins and produced
  # automatically from facts emitted by azure-siem-playbook-modify and the
  # explicit LogicApp rules:
  #
  # (A) Playbook definition modification + MI + trigger (Sentinel incident):
  #   azure-siem-playbook-modify -> CanModifyCode(?p, ?playbook)
  #   + ExecutesAs(?playbook, ?mi)  [from azure/logicapps.yaml explicit rule azure-la-executes-as-mi]
  #   => can-execute-as execute-as-via-code-modify:
  #      CanExecuteAs(?p, ?mi) ACTIVE (if trigger) or CONDITIONAL(trigger_exists)
  #   => cicd-chains cicd-modify-buildspec-executes-as (parallel fire, deduped)
  #
  # (B) Playbook trigger only (automationRules/write redirects but NOT modify):
  #   automationRules/write -> redirect trigger to existing playbook (no code modify)
  #   + ExecutesAs(?playbook, ?mi)
  #   => cicd-chains cicd-trigger-runner-executes-as:
  #      CanExecuteAs(?p, ?mi) CONDITIONAL(attacker_influenced_definition)
  #   Note: This fires only if the CURRENT playbook definition is already attacker-
  #   influenced. automationRules/write alone triggers an UNMODIFIED trusted playbook —
  #   this is NOT a CONDITIONAL escalation unless the existing definition runs attacker
  #   code. Do NOT emit ACTIVE for this path without code-modify evidence.
  #
  # (C) Escalation roll-up:
  #   CanExecuteAs(?p, ?mi) + privilege(?mi) > privilege(?p)
  #   => can-control escalate-via-execute-as: CanEscalateTo(?p, ?mi)
  #      (CITED — do not re-derive here)
  #
  # These are NOT re-derived in this file. Each SERVICE FACT (CanModifyCode,
  # CanTrigger, CanDelete, CanModifyConfiguration, CanReadData) is emitted above;
  # the linchpins own the collapse.
  # ===========================================================================

