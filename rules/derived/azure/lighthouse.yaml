# Azure Lighthouse — Derived attack-path rules (Phase 13 — cross-boundary)
# ---------------------------------------------------------------------------
# Azure Lighthouse (Microsoft.ManagedServices) lets a MANAGING tenant be
# granted standing ARM RBAC over a CUSTOMER subscription or resource group via
# a registrationDefinition + registrationAssignment pair. No credential is
# stored in the customer tenant; managing-tenant principals authenticate as
# themselves and operate cross-tenant with their delegated roles.
#
# This file emits FOUR derived rules and defers explicit normalization
# (CrossTenantTrust, TrustsExternalIdentity, etc.) to /rules/explicit/:
#
#   2. azure-lighthouse-enter-subscription
#      Entry capability: a managing-tenant ExternalPrincipal named in a delegation
#      authorization for a SUBSCRIPTION-scoped assignment has CanEnterSubscription
#      into the customer subscription (cites azure-lighthouse-cross-tenant-trust-explicit
#      from explicit rules).
#      CITES: hierarchy-chains.yaml enter-boundary-rollups,
#             azure/subscriptions.yaml azure-sub-enter-subscription.
#
#   2b. azure-lighthouse-enter-resource-group
#       Entry capability: a managing-tenant ExternalPrincipal named in a delegation
#       authorization for a RESOURCE-GROUP-scoped assignment has CanAdminister
#       over that resource group (narrower than subscription-scope).
#       CITES: hierarchy-chains.yaml admin-inherits-down-contains.
#
#   3. azure-lighthouse-uaa-sub-grant
#      Escalation: a managing-tenant principal with User Access Administrator
#      delegation (allowDelegatedRoleAssignments: true) can assign roles in the
#      customer scope => CanGrantPermission (self-grant at subscription scope).
#      CITES: can-control.yaml control-boundary-via-iam-admin,
#             azure/identity-escalation.yaml azure-role-assignment-write.
#
#   4a. azure-lighthouse-definition-write
#       Capability: a customer principal who can write registrationAssignments
#       can create/modify assignments => CanModify(registrationAssignment).
#
#   4b. azure-lighthouse-definition-modify-trust
#       Escalation: a customer principal who can write registrationDefinitions
#       can modify the trust list or managing tenant => CanModifyTrust(registrationDefinition).
#       The state is POTENTIAL (capability, not yet exercised); once the principal
#       actually modifies a definition to point to an attacker-controlled tenant,
#       the explicit rule azure-lighthouse-cross-tenant-trust-explicit emits the
#       resulting CrossTenantTrust as ACTIVE.
#
# ANTI-DUPLICATION — NEVER re-derive:
#   * parent->child hierarchy descent         -> hierarchy-chains.yaml
#   * CanGrantPermission@boundary -> Controls  -> can-control.yaml
#   * BLOCKED guardrail upgrade               -> hierarchy-chains.yaml
#   * Generic Azure RBAC CanGrantPermission   -> azure/identity-escalation.yaml
#   * CanEnterSubscription from Controls      -> azure/subscriptions.yaml
#
# SCOPE PRECISION:
#   A delegation scoped to a RESOURCE GROUP is NOT subscription-level. Rule 2
#   fires only for subscription-scoped assignments; resource-group-scoped
#   delegations feed CanAdminister/Controls within the resource group, which
#   hierarchy-chains propagates via admin-inherits-down-contains — not emitted
#   here.
#
# OWNER EXCLUSION:
#   Owner (roleDefinitionId 8e3af657-a8ff-443c-a75c-2fe8c4bcb635) CANNOT be
#   delegated — Lighthouse validation rejects it. Never fire on an authorization
#   listing Owner.
#
# EDGE SOURCE/TARGET CONFORMANCE (schema/edges.yaml) — honored by every emit:
#   CrossTenantTrust:     source [Tenant, ApplicationIdentity]
#                         target [Tenant, ExternalIdentity]
#   CanEnterSubscription: source [Identity]   target [Subscription]
#   CanGrantPermission:   source [Identity]   target [Identity]
#   CanModify:            source [Identity]   target [*]
#   TrustsExternalIdentity: source [Role, ServiceAccount, ApplicationIdentity, ResourcePolicy]
#                            target [ExternalIdentity, FederatedIdentity]
#   ExternalIdentityMapsTo:  source [ExternalIdentity, FederatedIdentity]
#                             target [Identity, Role, ServiceAccount]
# ---------------------------------------------------------------------------

provider: azure
phase: 13-cross-boundary
applies_to: [azure]

rules:
  # STRUCTURAL TRUST FACT: The explicit rule azure-lighthouse-cross-tenant-trust-explicit
  # in /rules/explicit/azure-lighthouse.yaml emits CrossTenantTrust from raw collected
  # registrationAssignments. CrossTenantTrust is nature: explicit per edges.yaml and
  # may ONLY be emitted by explicit normalization rules, not derived rules.
  # This derived file defers to that explicit rule and derives the ENTRY capability
  # (CanEnterSubscription, rule 2) and the MODIFICATION capability (rule 3+) from it.

  # --- 2) Managing-tenant principal named in delegation => CanEnterSubscription -
  # THE cross-boundary entry edge. A managing-tenant principal (ExternalPrincipal
  # node) named in a registrationDefinition authorization for a SUBSCRIPTION-scoped
  # assignment has CanEnterSubscription into the customer subscription.
  # PIM-eligible (eligibleAuthorizations) entries are CONDITIONAL(pim_activation).
  # CITES hierarchy-chains enter-boundary-rollups + azure/subscriptions.yaml
  # azure-sub-enter-subscription for the CanEnterSubscription roll-up logic.
  - id: azure-lighthouse-enter-subscription
    emits: CanEnterSubscription
    description: "A managing-tenant ExternalPrincipal named in a subscription-scoped Lighthouse authorization has CanEnterSubscription into the customer subscription."
    match:
      - [ ?managing_tenant, CrossTenantTrust, ?customer_tenant ]
      - [ ?reg_definition,  TrustsExternalIdentity, ?external_principal ]
      - [ ?customer_sub, HasPolicy, ?reg_assignment ]
    where:
      - "node_class(?customer_sub) == AdministrativeBoundary and node_type(?customer_sub) == Subscription"
      - "node_class(?customer_tenant) == AdministrativeBoundary and node_type(?customer_tenant) == Tenant"
      - "?reg_assignment.properties.registrationDefinitionId == ?reg_definition.id"
      - "?external_principal is in the authorizations[] of ?reg_definition (principalId from managing-tenant ?managing_tenant)"
      - "the registrationAssignment scope is the FULL SUBSCRIPTION (not a resource group)"
      - "?external_principal's delegation is a PERMANENT authorization (authorizations[], not eligibleAuthorizations)"
      - "node_type(?external_principal) in [ExternalIdentity, FederatedIdentity]"
      - "authorization.roleDefinitionId != '8e3af657-a8ff-443c-a75c-2fe8c4bcb635'  # Owner excluded"
    optional:
      # PIM-eligible (JIT) authorizations are gated on activation
      - [ ?external_principal, HasPolicy, ?pim_policy ]   # eligibleAuthorizations entry
    emit:
      source_type: Identity
      target_type: Subscription
      source: ?external_principal
      target: ?customer_sub
      permissions: []
      conditions: [trust_relationship, service_state]
      state_logic: >-
        ACTIVE when the authorization is a permanent entry in authorizations[] (not
        eligibleAuthorizations) and the registrationAssignment provisioningState ==
        'Succeeded'. CONDITIONAL(pim_activation) when the authorization appears only in
        eligibleAuthorizations — the managing-tenant principal must activate PIM in their
        home tenant before the delegation is exercisable. CONDITIONAL(service_state) if
        registrationAssignment provisioningState is 'Updating' or 'Creating'. BLOCKED if
        the registrationAssignment is removed, in a Failed state, or if the customer
        subscription has a deny assignment or deny-effect Azure Policy (ConditionalPolicy /
        OrganizationPolicy) preventing Microsoft.ManagedServices registration at the scope.
        Inherits the state of the contributing CrossTenantTrust (explicit rule
        azure-lighthouse-cross-tenant-trust-explicit); never stronger than the weakest
        contributor.
      confidence: "min(contributing_confidences) * 0.97"
      derived_from: [
        "azure-lighthouse-cross-tenant-trust-explicit (explicit CrossTenantTrust managing-tenant -> customer-tenant)",
        "?reg_definition TrustsExternalIdentity ?external_principal (authorizations[] tuple)",
        "?customer_sub HasPolicy ?reg_assignment (registrationAssignment binding)",
        "hierarchy-chains.yaml enter-boundary-rollups (CanEnterSubscription roll-up pattern)",
        "azure/subscriptions.yaml#azure-sub-enter-subscription (subscription foothold shape)"
      ]
      false_positive_note: >-
        SCOPE CHECK: only emit CanEnterSubscription when the registrationAssignment scope
        is the FULL SUBSCRIPTION (id pattern /subscriptions/{guid} with no
        /resourceGroups/ suffix). A resource-group-scoped assignment gives the managing
        principal access only within that RG — emit CanAdminister within the RG (or
        Controls if the delegated role carries roleAssignments/write with
        allowDelegatedRoleAssignments:true), and let hierarchy-chains
        admin-inherits-down-contains propagate within the RG. Do NOT emit CanEnterSubscription
        for RG-scoped assignments — it overstates the cross-boundary foothold.
        PIM-eligible entries (eligibleAuthorizations) are NOT immediately active: keep
        CONDITIONAL(pim_activation). Owner (8e3af657) cannot be delegated; if somehow
        present, skip. The delegated role determines what the managing-tenant principal
        CAN DO inside the subscription — emit CanEnterSubscription here only; role-specific
        capabilities (e.g., CanGrantPermission for UAA, CanAdminister for Contributor) are
        derived by the respective rules (rule 3 for UAA; azure/subscriptions.yaml for
        Contributor/Owner within the customer).
      narrative: >-
        {external_principal.name} (from managing tenant {managing_tenant.name}) is named
        in the Lighthouse registrationDefinition {reg_definition.name} with role
        {delegated_role.name}; because the delegation covers subscription
        {customer_sub.name}, {external_principal.name} has a standing ARM control-plane
        foothold inside {customer_sub.name} operating as themselves from their home tenant.

  # --- 2b) Managing-tenant principal named in RG-scoped delegation => CanAdminister RG --
  # A managing-tenant principal named in a registrationDefinition authorization
  # for a RESOURCE-GROUP-scoped assignment has CanAdminister over the customer
  # resource group (or a more specific role-determined capability). The delegation
  # is narrower than subscription-scope: access is confined to the RG and its
  # resources. hierarchy-chains.yaml admin-inherits-down-contains propagates
  # CanAdminister from the RG to its contained resources.
  - id: azure-lighthouse-enter-resource-group
    emits: CanAdminister
    description: "A managing-tenant ExternalPrincipal named in a resource-group-scoped Lighthouse authorization has CanAdminister over that resource group."
    match:
      - [ ?managing_tenant, CrossTenantTrust, ?customer_tenant ]
      - [ ?reg_definition,  TrustsExternalIdentity, ?external_principal ]
      - [ ?customer_rg, HasPolicy, ?reg_assignment ]
    where:
      - "node_class(?customer_rg) == AdministrativeBoundary and node_type(?customer_rg) == ResourceGroup"
      - "node_class(?customer_tenant) == AdministrativeBoundary and node_type(?customer_tenant) == Tenant"
      - "?reg_assignment.properties.registrationDefinitionId == ?reg_definition.id"
      - "the registrationAssignment scope is SCOPED TO A RESOURCE GROUP (id pattern /resourceGroups/{rg})"
      - "?external_principal is in the authorizations[] of ?reg_definition (principalId from managing-tenant ?managing_tenant)"
      - "?external_principal's delegation is a PERMANENT authorization (authorizations[], not eligibleAuthorizations)"
      - "node_type(?external_principal) in [ExternalIdentity, FederatedIdentity]"
      - "authorization.roleDefinitionId != '8e3af657-a8ff-443c-a75c-2fe8c4bcb635'  # Owner excluded"
    optional:
      # PIM-eligible (JIT) authorizations are gated on activation
      - [ ?external_principal, HasPolicy, ?pim_policy ]   # eligibleAuthorizations entry
    emit:
      source_type: Identity
      target_type: ResourceGroup
      source: ?external_principal
      target: ?customer_rg
      permissions: []
      conditions: [trust_relationship, service_state]
      state_logic: >-
        ACTIVE when the authorization is permanent (authorizations[], not
        eligibleAuthorizations) and registrationAssignment provisioningState ==
        'Succeeded'. CONDITIONAL(pim_activation) when the authorization appears only in
        eligibleAuthorizations — the managing-tenant principal must activate PIM first.
        CONDITIONAL(service_state) if registrationAssignment provisioningState is
        'Updating' or 'Creating'. BLOCKED if the registrationAssignment is removed or
        in a Failed state. Inherits state from the contributing CrossTenantTrust (explicit
        rule azure-lighthouse-cross-tenant-trust-explicit); never stronger than the
        weakest contributor. The delegated role determines the effective capability level
        (admin vs. contributor vs. reader); emit CanAdminister here as the broadest model
        and scope it to ?customer_rg. Hierarchy-chains propagates this down to contained
        resources.
      confidence: "min(contributing_confidences) * 0.95"
      derived_from: [
        "azure-lighthouse-cross-tenant-trust-explicit (explicit CrossTenantTrust managing-tenant -> customer-tenant)",
        "?reg_definition TrustsExternalIdentity ?external_principal (authorizations[] tuple)",
        "?customer_rg HasPolicy ?reg_assignment (registrationAssignment binding to RG scope)",
        "hierarchy-chains.yaml admin-inherits-down-contains (descent to RG children)"
      ]
      false_positive_note: >-
        SCOPE CHECK: only emit CanAdminister when the registrationAssignment scope is
        scoped TO A RESOURCE GROUP (id contains /resourceGroups/{rg}/providers/). A
        subscription-scoped assignment emits CanEnterSubscription (rule 2), not
        CanAdminister — do not mix. Resource-group-scoped delegations are narrower:
        the managing principal's access is confined to that RG and its child resources.
        The delegated role determines the actual RBAC actions available (Contributor,
        Reader, Owner, custom roles) — this rule models the broadest CanAdminister
        boundary; role-specific capabilities (e.g., CanGrantPermission for UAA within
        the RG scope) are derived by rule 3b with a RG scope_of constraint. Owner
        (8e3af657) cannot be delegated; if present, skip.
      narrative: >-
        {external_principal.name} (from managing tenant {managing_tenant.name}) is named
        in Lighthouse registrationDefinition {reg_definition.name} with role
        {delegated_role.name}; because the delegation is scoped to resource group
        {customer_rg.name}, {external_principal.name} has administrative control over
        that resource group and its contained resources, operating as themselves from
        their home tenant.

  # --- 3) UAA delegation with allowDelegatedRoleAssignments => CanGrantPermission -
  # A managing-tenant principal delegated User Access Administrator
  # (roleDefinitionId 18d7d88d-d35e-4fb5-a5c3-7773c20a72d9) WITH
  # allowDelegatedRoleAssignments: true can create role assignments within the
  # customer subscription or resource group — a boundary-scoped CanGrantPermission
  # (self-grant shape) that feeds can-control.yaml control-boundary-via-iam-admin ->
  # Controls(customer boundary). CITES: can-control.yaml control-boundary-via-iam-admin,
  #        azure/identity-escalation.yaml azure-role-assignment-write.
  - id: azure-lighthouse-uaa-sub-grant
    emits: CanGrantPermission
    description: "A managing-tenant principal delegated User Access Administrator (with allowDelegatedRoleAssignments: true) can assign roles in the customer subscription — subscription-scoped CanGrantPermission."
    match:
      - [ ?external_principal, CanEnterSubscription, ?customer_sub ]
      - [ ?reg_definition,     TrustsExternalIdentity, ?external_principal ]
    where:
      - "authorization for ?external_principal in ?reg_definition.properties.authorizations[] has roleDefinitionId == '18d7d88d-d35e-4fb5-a5c3-7773c20a72d9'  # User Access Administrator"
      - "?reg_definition.properties.authorizations[matching].allowDelegatedRoleAssignments == true  # Lighthouse-specific flag enabling sub-delegation"
      - "node_type(?customer_sub) == Subscription"
    optional:
      # JIT-eligible UAA is gated on PIM activation
      - [ ?external_principal, HasPolicy, ?pim_policy ]   # eligibleAuthorizations.allowDelegatedRoleAssignments
    emit:
      source_type: Identity
      target_type: Identity
      source: ?external_principal
      target: ?external_principal          # self-grant (assign itself Owner at scope)
      scope: ?customer_sub                 # scope_of consumed by can-control control-boundary-via-iam-admin
      permissions:
        - "Microsoft.Authorization/roleAssignments/write"
      conditions: [trust_relationship, iam_permission, deny_assignment]
      state_logic: >-
        ACTIVE when the UAA delegation is in a permanent authorization[] with
        allowDelegatedRoleAssignments: true and the registrationAssignment is active.
        CONDITIONAL(pim_activation) when the UAA entry is in eligibleAuthorizations
        (JIT-gated). BLOCKED when a customer deny assignment or deny-effect Azure Policy
        suppresses Microsoft.Authorization/roleAssignments/write at the subscription scope.
        State inherits from the contributing CanEnterSubscription edge (rule 2), which
        itself inherits from azure-lighthouse-cross-tenant-trust (rule 1). Feeds
        can-control.yaml control-boundary-via-iam-admin (scope_of == ?customer_sub ->
        Controls(?customer_sub)) + hierarchy-chains.yaml admin-inherits-down-contains to
        every descendant RG and resource. Do NOT enumerate descendants here.
      confidence: "min(contributing_confidences) * 0.92"
      derived_from: [
        "azure-lighthouse-enter-subscription (?external_principal CanEnterSubscription ?customer_sub)",
        "?reg_definition TrustsExternalIdentity ?external_principal (UAA + allowDelegatedRoleAssignments:true)",
        "can-control.yaml#control-boundary-via-iam-admin (CanGrantPermission@boundary -> Controls(boundary))",
        "azure/identity-escalation.yaml#azure-role-assignment-write (canonical CanGrantPermission from roleAssignments/write)"
      ]
      false_positive_note: >-
        BOTH conditions are required: roleDefinitionId MUST be User Access Administrator
        (18d7d88d-d35e-4fb5-a5c3-7773c20a72d9) AND the authorization entry MUST have
        allowDelegatedRoleAssignments: true. A plain UAA delegation WITHOUT the flag
        cannot create role assignments in the customer scope — Lighthouse explicitly
        blocks cross-tenant sub-delegation by default. Do NOT emit for Contributor or
        any other delegated role even if they have broad resource write access.
        The self-grant edge (source==target==?external_principal) carries scope=?customer_sub;
        it is NOT pointed at the Subscription boundary node (CanGrantPermission schema
        target=[Identity] only). The boundary-level Controls consequence comes from
        can-control control-boundary-via-iam-admin reading scope_of — do not derive
        Controls here. A customer deny assignment on roleAssignments/write blocks this
        -> BLOCKED; hierarchy-chains guardrail-removal-upgrades-blocked can upgrade it
        only if the managing principal can remove the guardrail (requires Owner at
        customer — not possible via Lighthouse alone).
      narrative: >-
        {external_principal.name} holds a Lighthouse User Access Administrator delegation
        with allowDelegatedRoleAssignments: true in subscription {customer_sub.name}. They
        can assign roles (including Owner) to any principal within the customer scope,
        effectively gaining full administrative control of {customer_sub.name}.

  # --- 4a) Customer Owner => CanModify registrationDefinition/Assignment -----
  # A customer principal who can write ManagedServices resources can create or
  # modify a registrationDefinition (adding/modifying the managing tenant or
  # authorization list) or create a new registrationAssignment (activating a
  # definition at a scope). This is the onboarding WRITE capability — an insider
  # or compromised Owner can backdoor the customer subscription with a malicious
  # managing tenant. Target: ResourcePolicy (registrationAssignment).
  - id: azure-lighthouse-definition-write
    emits: CanModify
    description: "A customer principal with Microsoft.ManagedServices/registrationAssignments/write can create/modify Lighthouse registrationAssignments — enable cross-tenant access."
    match:
      - [ ?customer_principal, HasPermission, ?customer_sub ]
    where:
      - "node_class(?customer_sub) == AdministrativeBoundary and node_type(?customer_sub) in [Subscription, ResourceGroup]"
      - "?customer_principal holds EFFECTIVE Microsoft.ManagedServices/registrationAssignments/write at ?customer_sub scope"
      - "?customer_principal holds this via Owner role ('*' actions) or a custom role explicitly granting this action"
    optional:
      # An existing assignment to modify (changing the delegation)
      - [ ?customer_sub, HasPolicy, ?reg_assignment ]
    emit:
      source_type: Identity
      target_type: ResourcePolicy
      source: ?customer_principal
      target: "<registrationAssignment ResourcePolicy node in ?customer_sub>"
      permissions:
        - "Microsoft.ManagedServices/registrationAssignments/write"
      conditions: [iam_permission, deny_assignment]
      state_logic: >-
        ACTIVE when ?customer_principal holds the write action unconditionally at the scope.
        CONDITIONAL(iam_permission) when the role assignment carries an ABAC condition or
        the principal has only an eligible (PIM) assignment for the Owner role.
        BLOCKED when a deny assignment (ConditionalPolicy) or deny-effect Azure Policy
        (OrganizationPolicy) at the scope or an ancestor explicitly denies
        Microsoft.ManagedServices/registrationAssignments/write. Only Owner ('*' actions)
        and custom roles explicitly granting this action qualify; Contributor does NOT.
      confidence: "min(contributing_confidences)"
      derived_from: [ "<HasPermission ?customer_principal -> ?customer_sub (Owner/'*' or custom ManagedServices write) edge_id>" ]
      false_positive_note: >-
        Owner is the standard Azure role that includes ManagedServices write via its '*'
        actions. Contributor does NOT include Microsoft.Authorization write actions NOR
        Microsoft.ManagedServices write — do NOT emit for Contributor. A custom role must
        explicitly list the registrationAssignments/write action (or a wildcard that covers it).
        If the scope is a resource group, the CanModify is scoped to that RG's assignment
        objects only, not the whole subscription.
      narrative: >-
        {customer_principal.name} holds Owner (or a custom ManagedServices-write role) at
        {customer_sub.name} and can create or modify Lighthouse registrationAssignments —
        enabling them to activate a definition or change an existing delegation.

  # --- 4b) Customer Owner => CanModifyTrust registrationDefinition -----------
  # A customer principal who can write registrationDefinitions can directly modify
  # the trust list (authorizations[]) or change the managing tenant. This widens
  # the trust anchor and is modeled as CanModifyTrust over the registrationDefinition
  # (typed as TrustPolicy). This is the TRUST ESCALATION path: modify the trust to
  # add a malicious principal or change the managing tenant entirely.
  - id: azure-lighthouse-definition-modify-trust
    emits: CanModifyTrust
    description: "A customer principal with Microsoft.ManagedServices/registrationDefinitions/write can modify Lighthouse trust anchors (authorizations list, managing tenant)."
    match:
      - [ ?customer_principal, HasPermission, ?customer_sub ]
    where:
      - "node_class(?customer_sub) == AdministrativeBoundary and node_type(?customer_sub) in [Subscription, ResourceGroup]"
      - "?customer_principal holds EFFECTIVE Microsoft.ManagedServices/registrationDefinitions/write at ?customer_sub scope"
      - "?customer_principal holds this via Owner role ('*' actions) or a custom role explicitly granting this action"
    optional:
      # An existing definition to modify (widening the authorization list or changing managing tenant)
      - [ ?customer_sub, HasPolicy, ?reg_definition ]
    emit:
      source_type: Identity
      target_type: TrustPolicy
      source: ?customer_principal
      target: "<registrationDefinition TrustPolicy node in ?customer_sub>"
      permissions:
        - "Microsoft.ManagedServices/registrationDefinitions/write"
      conditions: [iam_permission, deny_assignment]
      state_logic: >-
        ACTIVE when ?customer_principal holds the write action unconditionally at the scope.
        CONDITIONAL(iam_permission) when the role assignment carries an ABAC condition or
        the principal has only an eligible (PIM) assignment for the Owner role.
        BLOCKED when a deny assignment (ConditionalPolicy) or deny-effect Azure Policy
        (OrganizationPolicy) at the scope or an ancestor explicitly denies
        Microsoft.ManagedServices/registrationDefinitions/write. Only Owner ('*' actions)
        and custom roles explicitly granting this action qualify; Contributor does NOT.
      confidence: "min(contributing_confidences)"
      derived_from: [ "<HasPermission ?customer_principal -> ?customer_sub (Owner/'*' or custom ManagedServices write) edge_id>" ]
      false_positive_note: >-
        This edge models TRUST MODIFICATION (adding/changing principals in authorizations[],
        changing managingTenantId). A customer principal who can write registrationDefinitions
        can widen the trust list or redirect to a malicious managing tenant. Owner is the
        standard Azure role that includes this via '*' actions. A custom role must
        explicitly list registrationDefinitions/write. If the scope is a resource group,
        the CanModifyTrust is scoped to that RG's definition objects only.
      narrative: >-
        {customer_principal.name} holds Owner (or a custom ManagedServices-write role) at
        {customer_sub.name} and can create or modify Lighthouse registrationDefinitions —
        enabling them to widen the trust authorization list or change the managing tenant
        entirely, directing future access to a malicious tenant.


# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - A deny-effect Azure Policy (OrganizationPolicy node) at the subscription
#    or management-group scope explicitly denying
#    Microsoft.ManagedServices/registrationDefinitions/write is the primary
#    enterprise guardrail for trust modification. When present:
#      * azure-lighthouse-definition-modify-trust (CanModifyTrust) -> BLOCKED
#        (customer Owner cannot modify trust).
#      * azure-lighthouse-definition-write -> BLOCKED for the assignment write.
#      * Existing active assignments are NOT retroactively removed by policy —
#        the explicit rule azure-lighthouse-cross-tenant-trust-explicit still
#        fires as ACTIVE for currently-active assignments; only NEW modifications
#        are blocked.
#  - A deny assignment (ConditionalPolicy) suppressing these actions works
#    identically.
#  - Removing an existing registrationAssignment (customer Owner calls DELETE on
#    Microsoft.ManagedServices/registrationAssignments/{id}) revokes the
#    delegation: set the explicit CrossTenantTrust to BLOCKED / remove it from
#    the graph when provisioningState transitions to Deleting/Deleted.
#
# DEFERRED (cited, not duplicated):
#  - Explicit normalization (HasPolicy, CrossTenantTrust, TrustsExternalIdentity,
#    ExternalIdentityMapsTo) lives in /rules/explicit/azure-lighthouse.yaml.
#  - Hierarchy descent from CrossTenantTrust + CanEnterSubscription ->
#    CanEnterTenant, CanEnterOrganization:
#    hierarchy-chains.yaml admin-inherits-down-contains,
#    enter-boundary-rollups.
#  - CanGrantPermission@boundary -> Controls(subscription):
#    can-control.yaml control-boundary-via-iam-admin.
#  - Guardrail removal (if customer can delete the deny policy):
#    hierarchy-chains.yaml guardrail-removal-upgrades-blocked.
#  - Generic RBAC Owner -> Controls at subscription:
#    azure/subscriptions.yaml azure-sub-owner-controls.
#  - ExternalPrincipal capabilities WITHIN the customer subscription
#    (e.g., CanAdminister from Contributor delegation, CanReadSecret from
#    Key Vault delegation):
#    The respective service adapters (keyvault.yaml, vm.yaml, functions.yaml)
#    fire normally when the managing-tenant principal is present in the
#    customer scope — Lighthouse sets the entry; service rules evaluate capability.
# ---------------------------------------------------------------------------
