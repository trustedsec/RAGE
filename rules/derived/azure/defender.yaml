# Azure — Defender for Cloud (Microsoft.Security) derived attack-path rules (Phase 12)
# ---------------------------------------------------------------------------
# PHASE-12 THEME: security & logging — DEFENSE EVASION / TAMPERING (dominant mode).
#
# Defender for Cloud is Azure's CSPM and workload protection platform. The attack
# surface is EXCLUSIVELY defense-evasion / cover-tracks:
#
#   (a) PLAN DISABLEMENT (headline): Microsoft.Security/pricings/write to set a
#       Defender plan to "Free" tier blinds threat-detection for an entire resource
#       type (e.g., Defender for Servers, Containers, Key Vault, Storage) across the
#       subscription. This is the highest-impact evasion primitive.
#
#   (b) ALERT SUPPRESSION: Microsoft.Security/alertsSuppressionRules/write to mute
#       specific alert types or resource-scoped alerts before analysts see them.
#
#   (c) CONTACT MODIFICATION: Microsoft.Security/securityContacts/write to remove
#       or alter email/phone recipients of security notifications — silences external
#       alert delivery out-of-band from the portal.
#
# ALL THREE ARE DETECTIVE-CONTROL TAMPERING — they reduce detection, NOT prevent
# access. Do NOT chain these edges to CanEnterSubscription, CanExecuteAs, or
# CanEscalateTo. Defender plans are detective guardrails, not preventive access
# controls: disabling a plan never sets BLOCKED on resource-access edges.
#
# EDGE CLASSIFICATION: These rules emit CanModify (category: resource_control,
# relationship_kind: CONTROL) rather than CanModifyConfiguration (category: execution,
# relationship_kind: EXECUTION). The distinction is semantic: CanModifyConfiguration
# semantically chains to CanExecuteAs and represents execution-level control. Tampering
# with detective service configuration (Defender plans, suppression rules, contacts) is
# CONTROL-category configuration tampering, not execution-category code/config injection.
# Using CanModify prevents path-finders from incorrectly scoring this as an execution hop.
#
# LINCHPINS: No linchpin (can-execute-as / cicd-chains / credential-chains /
# can-control) is relevant here — there is no execution identity, code modification,
# or credential access surface. These rules stand alone.
#
# STATE NOTES:
#   ACTIVE when the effective permission is confirmed and no deny assignment covers it.
#   BLOCKED when a deny assignment, Azure Policy deny-effect, or Privileged Identity
#     Management (PIM) Just-In-Time constraint neutralizes the write action.
#   (Detective controls do NOT set BLOCKED on other edges — only preventive guardrails do.)
#
# All permission strings from the official Microsoft.Security resource-provider
# operations reference. No hallucinated permissions.
# ---------------------------------------------------------------------------

provider: azure
phase: 12-security-logging
applies_to: [azure]

rules:

  # ===========================================================================
  # 1. Defender plan disable — pricings/write (HEADLINE EVASION PRIMITIVE)
  # ===========================================================================

  - id: azure-defender-disable-plan
    emits: CanModify
    description: >-
      Write the Defender pricing tier for a subscription (Microsoft.Security/pricings/write);
      setting any plan to 'Free' disables threat-detection for that resource type
      subscription-wide. This blinds Defender without altering any resource access controls.
    match_effective_permission:
      - action: "Microsoft.Security/pricings/write"
        scope_type: "subscription"
      - action: "Microsoft.Security/pricings/write"
        scope_type: "managementGroup"
    where:
      - "principal effectively holds Security Admin, Contributor, Owner, or a custom role granting Microsoft.Security/pricings/write at subscription or management-group scope"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Defender pricing tier node (SecurityService) for the target scope>"
      permissions:
        - "Microsoft.Security/pricings/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed at subscription or management-group scope.
        BLOCKED if a deny assignment covers Microsoft.Security/pricings/write, or if an Azure
        Policy with a deny effect prevents the pricing-tier write. Security Reader and any role
        lacking pricings/write does NOT qualify.
        NOTE: This is a DETECTIVE-CONTROL tampering edge. It reduces visibility into threats;
        it does NOT grant access to resources protected by Defender plans, and MUST NOT chain
        to CanEnterSubscription, CanExecuteAs, or CanEscalateTo. Do not set BLOCKED on
        resource-access edges as a consequence — Defender plans are detective, not preventive.
        SCOPE: Subscription-scoped pricings/write affects a single subscription. Management-group
        scoped pricings/write cascades to all child subscriptions inheriting that scope — verify
        which subscriptions fall within the management-group hierarchy affected by the edge.
      confidence: 0.97
      derived_from:
        - "HasPermission(Identity, SecurityService:pricings, Microsoft.Security/pricings/write)"
      false_positive_note: >-
        pricings/write enables the caller to set pricingTier to "Free" for any Defender plan
        (Servers, Containers, StorageAccounts, KeyVaults, SqlServers, AppServices, Arm, Dns,
        CosmosDbs, DevOps, OpenSourceRelationalDatabases, etc.). Each plan disablement removes
        threat-detection for that resource type subscription-wide. At management-group scope the
        write can cascade to all child subscriptions (broader blast radius — note this in scope).
        Do NOT treat this as privilege escalation: an attacker who disables Defender for Servers
        has NOT gained access to those servers; they have only reduced the likelihood of detection.
        Confirm the principal's effective RBAC scope — pricings/write at resource-group scope does
        not exist (pricings is subscription-level only).
      narrative: >-
        {principal.name} can write the Defender pricing tier for subscription {target.name}
        (Microsoft.Security/pricings/write). Setting any Defender plan to 'Free' disables
        threat-detection for that resource type subscription-wide — for example, turning off
        Defender for Servers eliminates anomalous-process, fileless-attack, and lateral-movement
        alerts for all VMs in the subscription. This is a cover-tracks primitive: it reduces
        SOC visibility without granting access to the underlying resources.

  # ===========================================================================
  # 2. Alert suppression rule write — muting specific alerts
  # ===========================================================================

  - id: azure-defender-suppress-alerts
    emits: CanModify
    description: >-
      Create or modify a Defender for Cloud alert suppression rule (Microsoft.Security/
      alertsSuppressionRules/write); suppressed alert types are auto-dismissed before
      analysts see them, reducing SOC visibility into the suppressed attack patterns.
    match_effective_permission:
      action: "Microsoft.Security/alertsSuppressionRules/write"
      scope_type: "subscription"
    where:
      - "principal effectively holds Security Admin, Contributor, Owner, or a custom role granting Microsoft.Security/alertsSuppressionRules/write at subscription scope"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Defender alert suppression rule node (SecurityService) in the subscription>"
      permissions:
        - "Microsoft.Security/alertsSuppressionRules/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed at subscription scope.
        BLOCKED if a deny assignment covers alertsSuppressionRules/write at effective scope.
        NOTE: Suppression rules mute SPECIFIC alert types or resource-scoped alerts — narrower
        blast radius than pricings/write (plan disablement), but more surgical (targets only
        alert patterns relevant to the attacker's TTPs). This is a DETECTIVE-CONTROL tampering
        edge; it does not affect access controls or set BLOCKED on any resource-access edge.
      confidence: 0.95
      derived_from:
        - "HasPermission(Identity, SecurityService:alertsSuppressionRules, Microsoft.Security/alertsSuppressionRules/write)"
      false_positive_note: >-
        alertsSuppressionRules/write allows creation of rules that auto-dismiss Defender alerts
        matching a specified alert type, entity (resource, IP, user), and optional reason.
        Suppression rules have a configurable expiry date; a rule set to a far-future expiry is
        persistent suppression. The write action also covers modification of existing rules
        (widening scope or extending expiry) and creation of new rules for previously-unmatched
        alert types. Narrower than plan disablement (pricings/write): suppression only silences
        the matched alert patterns, not all detection for a resource type. Do NOT chain to
        privilege escalation — this is evasion, not access.
      narrative: >-
        {principal.name} can create or modify alert suppression rules in subscription {target.name}
        (Microsoft.Security/alertsSuppressionRules/write). A suppression rule auto-dismisses all
        Defender alerts matching the specified alert type and optional resource/entity scope before
        analysts see them in the Security Center portal or receive notifications — enabling an
        attacker to selectively mute alerts for their TTPs while leaving other alerting intact.

  # ===========================================================================
  # 3. Security contact modification — blinding external alert notifications
  # ===========================================================================

  - id: azure-defender-modify-contacts
    emits: CanModify
    description: >-
      Write Defender for Cloud security contacts (Microsoft.Security/securityContacts/write);
      removing or replacing email/phone recipients silences external alert notification delivery
      out-of-band from the Azure portal, reducing off-portal incident-response triggers.
    match_effective_permission:
      action: "Microsoft.Security/securityContacts/write"
      scope_type: "subscription"
    where:
      - "principal effectively holds Security Admin, Contributor, Owner, or a custom role granting Microsoft.Security/securityContacts/write at subscription scope"
    emit:
      source_type: Identity
      target_type: SecurityService
      source: "<principal>"
      target: "<Defender security contact node (SecurityService) in the subscription>"
      permissions:
        - "Microsoft.Security/securityContacts/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed at subscription scope.
        BLOCKED if a deny assignment covers securityContacts/write at effective scope.
        NOTE: Impact is narrower than pricings/write or alertsSuppressionRules/write: alerts
        still appear in the Azure Security Center portal but are not emailed/texted to the
        configured recipients. Most effective against organizations relying on email notifications
        as their primary alert channel. This is a DETECTIVE-CONTROL tampering edge; does not
        affect resource access controls.
      confidence: 0.92
      derived_from:
        - "HasPermission(Identity, SecurityService:securityContacts, Microsoft.Security/securityContacts/write)"
      false_positive_note: >-
        securityContacts/write covers creation, modification, and deletion of security contact
        records. Security contacts receive email notifications for high-severity Defender alerts
        and Azure Security Center recommendations. Removing contacts or changing email addresses
        to attacker-controlled addresses silences or redirects these notifications. This does NOT
        suppress alerts in the portal — alerts remain visible to users with portal access. The
        evasion value is highest for organizations without portal-based SOC workflows (e.g., those
        relying on email or SIEM integration driven by email). Lower blast radius than plan
        disablement or suppression-rule creation.
      narrative: >-
        {principal.name} can modify Defender for Cloud security contacts for subscription
        {target.name} (Microsoft.Security/securityContacts/write). Removing or changing the
        configured email/phone contacts prevents Defender alert notifications from reaching the
        security team out-of-band, reducing the chance of rapid off-portal incident response
        for high-severity alerts.

  # ===========================================================================
  # 4. Auto-provisioning disablement — blind newly deployed resources
  # ===========================================================================

  - id: azure-defender-disable-autoprovisioning
    emits: CanModify
    description: >-
      Write auto-provisioning settings (Microsoft.Security/autoProvisioningSettings/write);
      disabling auto-provisioning prevents automatic deployment of the Log Analytics agent
      and Microsoft Defender for Endpoint on newly created or reimaged VMs and Arc-connected
      machines, leaving them unmonitored by Defender for Cloud.
    match_effective_permission:
      action: "Microsoft.Security/autoProvisioningSettings/write"
      scope_type: "subscription"
    where:
      - "principal effectively holds Security Admin, Contributor, Owner, or a custom role granting Microsoft.Security/autoProvisioningSettings/write at subscription scope"
    emit:
      source_type: Identity
      target_type: ConfigurationService
      source: "<principal>"
      target: "<Defender auto-provisioning settings node (ConfigurationService) in the subscription>"
      permissions:
        - "Microsoft.Security/autoProvisioningSettings/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed at subscription scope.
        BLOCKED if a deny assignment covers autoProvisioningSettings/write at effective scope.
        NOTE: Disabling auto-provisioning leaves newly deployed VMs unmonitored — they will not
        receive the Log Analytics agent or MDE agent until manually provisioned or the setting
        is re-enabled. This is a DETECTIVE-CONTROL tampering edge; it does not affect access
        controls or set BLOCKED on any resource-access edge.
      confidence: 0.94
      derived_from:
        - "HasPermission(Identity, ConfigurationService:autoProvisioningSettings, Microsoft.Security/autoProvisioningSettings/write)"
      false_positive_note: >-
        autoProvisioningSettings/write allows modification of auto-provisioning policies for
        Log Analytics agents, MDE agents, and vulnerability assessment extensions. Disabling
        auto-provisioning affects only newly deployed resources; existing agents on already-deployed
        VMs are not removed. This is narrower in scope than pricings/write (which affects all
        resources of a type) but can be persistent — organizations disabling auto-provisioning
        must manually provision agents, increasing operational overhead and leaving a window of
        unmonitored deployments.
      narrative: >-
        {principal.name} can modify Defender auto-provisioning settings for subscription {target.name}
        (Microsoft.Security/autoProvisioningSettings/write). Disabling auto-provisioning prevents
        automatic installation of the Log Analytics agent and Microsoft Defender for Endpoint
        on newly created VMs and Arc-connected machines, leaving them unmonitored by Defender
        for Cloud until agents are manually provisioned.

  # ===========================================================================
  # 5. Workspace settings redirect — sever log-collection pipeline
  # ===========================================================================

  - id: azure-defender-redirect-workspace
    emits: CanModify
    description: >-
      Write workspace settings (Microsoft.Security/workspaceSettings/write); redirecting
      the Defender data pipeline to a different or non-existent workspace severs log collection
      and alert generation subscription-wide.
    match_effective_permission:
      action: "Microsoft.Security/workspaceSettings/write"
      scope_type: "subscription"
    where:
      - "principal effectively holds Security Admin, Contributor, Owner, or a custom role granting Microsoft.Security/workspaceSettings/write at subscription scope"
    emit:
      source_type: Identity
      target_type: ConfigurationService
      source: "<principal>"
      target: "<Defender workspace settings node (ConfigurationService) in the subscription>"
      permissions:
        - "Microsoft.Security/workspaceSettings/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed at subscription scope.
        BLOCKED if a deny assignment covers workspaceSettings/write at effective scope.
        NOTE: Redirecting workspace settings severs the log-collection pipeline subscription-wide.
        This is a DETECTIVE-CONTROL tampering edge with broad impact — all Defender data
        collection is redirected (or halted if the target workspace is invalid/deleted). It does
        not affect access controls or set BLOCKED on any resource-access edge.
      confidence: 0.93
      derived_from:
        - "HasPermission(Identity, ConfigurationService:workspaceSettings, Microsoft.Security/workspaceSettings/write)"
      false_positive_note: >-
        workspaceSettings/write allows modification of the workspace where Defender collects logs.
        Changing this setting to a non-existent workspace, a workspace in a different subscription,
        or an attacker-controlled workspace redirects or halts all Defender log collection and
        alert generation at subscription scope. This is a high-impact evasion primitive — broader
        than suppression rules (which target specific alerts) and comparable in scope to plan
        disablement (which targets specific resource types). Confirm the target workspace is
        valid and authorized before assuming normal operation.
      narrative: >-
        {principal.name} can modify Defender workspace settings for subscription {target.name}
        (Microsoft.Security/workspaceSettings/write). Redirecting the data-collection workspace
        to a no-op or attacker-controlled destination severs the Defender log pipeline and
        halts alert generation subscription-wide — an effective cover-tracks primitive that
        eliminates all Defender visibility at once.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - A deny assignment covering Microsoft.Security/pricings/write at subscription or
#    management-group scope -> azure-defender-disable-plan state: BLOCKED.
#  - An Azure Policy with deny effect preventing pricings writes (e.g., requiring
#    pricingTier == "Standard" for specific plans) -> BLOCKED for pricings/write.
#  - A deny assignment covering alertsSuppressionRules/write -> azure-defender-suppress-alerts
#    state: BLOCKED.
#  - Security Reader role (no write actions) does NOT qualify for any of the above rules.
#  - Privileged Identity Management (PIM) Just-In-Time activation required for Security Admin
#    -> emit CONDITIONAL(condition_expression) rather than ACTIVE until JIT is activated.
#
# PHASE-12 INVARIANT — NEVER chain these edges to escalation:
#  - CanModifyConfiguration(defender-plan) does NOT imply CanEnterSubscription.
#  - Plan disablement does NOT set BLOCKED on any resource-access edge elsewhere in
#    the graph — Defender plans are detective guardrails, not preventive controls.
#  - Do NOT derive CanExecuteAs, CanEscalateTo, or CanEnterSubscription from these
#    three rules under any combination.
# ---------------------------------------------------------------------------

# Explicit normalization rules for this service (CanRead on pricing/suppression rules,
# and CanDelete on suppression rules) are defined in /rules/explicit/azure-defender.yaml.
# All explicit edges run in the normalization phase before derived rules.
