# Azure — Event Hubs (Microsoft.EventHub) derived attack-path rules (Phase 10 — messaging)
# ---------------------------------------------------------------------------
# PHASE-10 SERVICE ADAPTER: Azure Event Hubs is a high-throughput streaming
# ingestion service. It is an EVENT SOURCE for downstream compute consumers
# (Azure Functions event-hub trigger, Stream Analytics jobs, Logic App connectors).
# This file emits the NORMALIZED MESSAGING FACTS that messaging-chains.yaml,
# can-execute-as.yaml, and can-control.yaml consume to produce the full escalation,
# cross-boundary, and exfiltration roll-ups. Do NOT re-derive those roll-ups
# here — CITE the linchpins.
#
# ATTACK SURFACE (verified against Microsoft.EventHub operations ref +
# official Event Hubs auth docs, 2026-09 snapshot):
#
#   (a) SAS KEY READ — the highest-value control-plane primitive:
#       Microsoft.EventHub/namespaces/authorizationRules/listkeys/action
#       Returns the primary + secondary HMAC-SHA256 signing keys (and
#       connection strings) for a namespace-level authorization rule. The
#       caller can forge SAS tokens with any rights (Send, Listen, Manage)
#       on ALL event hubs in the namespace. The RootManageSharedAccessKey
#       rule (Manage + Send + Listen) is created by default and is the
#       highest-value target.
#       Entity-level: namespaces/eventhubs/authorizationRules/listkeys/action
#       scopes the keys to one event hub.
#       Model: CanReadSecret(principal → SAS key (APIKey node)).
#       ExposesCredential flows from the namespace/hub to the SAS credential.
#
#   (b) SEND / CanWriteData:
#       ARM RBAC: Azure Event Hubs Data Sender role
#       SAS: a SAS token with Send right (generated from a listkeys key)
#       Both let the attacker publish events to the hub. messaging-chains
#       messaging-publish-triggers-consumer rolls
#         CanWriteData(principal → hub) + CanTrigger(hub → consumer)
#         => CanTrigger(principal → consumer) CONDITIONAL(trigger_exists)
#       which messaging-trigger-executes-as then rolls to CanExecuteAs.
#
#   (c) RECEIVE / CanReadData:
#       ARM RBAC: Azure Event Hubs Data Receiver role
#       SAS: Listen right on namespace or entity level
#       Receiver reads event payloads from any consumer group. If payloads
#       carry connection strings, tokens, or PII → CanExfiltrate (via
#       data-plane rules; cited, not re-derived here). The adapter emits the
#       CanReadData fact; credential-chains + data-plane roll-ups consume it.
#
#   (d) CAPTURE EXFILTRATION / CanModifyConfiguration:
#       Microsoft.EventHub/namespaces/eventhubs/write — write on the event hub
#       entity includes modifying captureDescription, which sets the Avro
#       Capture destination (Storage container or ADLS). Redirecting Capture
#       to attacker-controlled storage exfiltrates the entire stream.
#       Model: CanModifyConfiguration(principal → event-hub).
#       CanExfiltrate is a downstream data-plane consequence (cited to the
#       data-plane rules, not re-derived here).
#
#   (e) NAMESPACE CONTRIBUTOR / CanAdminister:
#       Microsoft.EventHub/namespaces/write (Contributor / Owner) — full
#       control: create/delete event hubs, rules, consumer groups, network
#       rules, identity. Subsumes all the above + can disable SAS, reconfigure
#       Capture, attach user-assigned MI.
#
#   (f) INTERNET EXPOSURE:
#       Namespaces with publicNetworkAccess not Disabled and no IP/VNet
#       network-rule-set restrictions are internet-reachable on
#       <namespace>.servicebus.windows.net. SAS or Entra credentials are
#       sufficient for data-plane access from any internet client.
#
# LINCHPINS CITED (not re-derived here):
#   messaging-chains messaging-publish-triggers-consumer (rule 1):
#     CanWriteData(p, hub) + CanTrigger(hub, consumer)
#     => CanTrigger(p, consumer) CONDITIONAL(trigger_exists).
#   messaging-chains messaging-trigger-executes-as (rule 2):
#     CanTrigger(p, consumer) + ExecutesAs(consumer, identity)
#     => CanExecuteAs(p, identity) CONDITIONAL(trigger_exists).
#   can-execute-as execute-as-via-code-modify: dedupes with cicd-chains /
#     messaging-chains on (CanExecuteAs, p, identity).
#   can-control escalate-via-execute-as: CanExecuteAs → CanEscalateTo.
#   credential-chains read-secret-yields-identity:
#     CanReadSecret(p, sas-key) + CredentialsFor(sas-key, identity)
#     => CanImpersonate.
#   Data-plane rules: CanReadData → CanExfiltrate (cited, not re-derived).
#
# KEY GUARDS:
#   disableLocalAuth=true on the namespace → SAS authentication is disabled.
#     All SAS-derived edges (CanWriteData/CanReadData via SAS token,
#     ExposesCredential from SAS keys) downgrade to BLOCKED.
#   publicNetworkAccess=Disabled → ExposedToInternet is BLOCKED.
#   networkRuleSets.defaultAction=Deny + IP/VNet rules → reachability is
#     CONDITIONAL(network_reachability) rather than internet-open.
#
# STATE DEFAULTS (per RULE-FORMAT.md):
#   ACTIVE when all required actions are held at effective scope AND no
#     deny assignment covers the critical action.
#   CONDITIONAL(trigger_exists) when CanWriteData is confirmed but no live
#     consumer binding (Function trigger / SA input / Logic App) is observed.
#   BLOCKED when disableLocalAuth=true (for SAS paths) or publicNetworkAccess
#     =Disabled (for ExposedToInternet) or a deny assignment applies.
#
# All operation strings from the official Microsoft.EventHub resource-provider
# operations reference (learn.microsoft.com, verified 2026-09). No hallucinated
# permissions.
# ---------------------------------------------------------------------------

provider: azure
phase: 10-messaging
applies_to: [azure]

rules:

  # ===========================================================================
  # 1. Full administrative control of the namespace (→ CanAdminister)
  # ===========================================================================

  - id: azure-eh-namespace-contributor
    emits: CanAdminister
    description: "Full control of an Event Hubs namespace (Contributor / Owner / custom role with namespaces/write); subsumes send, receive, listkeys, and entity management."
    match_effective_permission:
      action: "Microsoft.EventHub/namespaces/write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds Contributor, Owner, or a custom role granting Microsoft.EventHub/namespaces/* at the namespace scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Event Hubs namespace (GenericMessaging)>"
      permissions:
        - "Microsoft.EventHub/namespaces/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed at the namespace or enclosing
        scope (resource group or subscription). BLOCKED if a deny assignment covers
        namespaces/write at that scope. CanAdminister on the namespace does NOT imply
        Microsoft.Authorization/*/write (escalation is via the namespace's managed
        identity or SAS key reads, not self role-assignment).
      confidence: 0.98
      derived_from:
        - "effective permission: Microsoft.EventHub/namespaces/write"
      false_positive_note: >-
        Microsoft.EventHub/namespaces/* grants full control of the namespace object
        and all child entities (event hubs, authorization rules, consumer groups,
        network rules) but NOT Microsoft.Authorization/*/write. The escalation path
        is via (a) reading SAS keys (listkeys/action) to forge SAS tokens, or (b)
        redirecting Capture to attacker storage, or (c) triggering a bound consumer
        function via send — NOT via self-assigning RBAC roles. Confirm the effective
        permission includes namespaces/write (not merely namespaces/read) before
        emitting CanAdminister.
      narrative: >-
        {principal.name} has full control of Event Hubs namespace {target.name}
        (Microsoft.EventHub/namespaces/write), including all event hubs, authorization
        rules, consumer groups, network rules, and the managed-identity block.

  # ===========================================================================
  # 2. SAS key read at namespace level (→ CanReadSecret)
  # THE headline credential grab for Event Hubs. Reading the namespace-level
  # authorization rule keys yields HMAC-SHA256 signing keys that can forge SAS
  # tokens with any combination of Send, Listen, or Manage rights for ALL event
  # hubs in the namespace. The RootManageSharedAccessKey rule (always present by
  # default) grants Manage + Send + Listen namespace-wide.
  # ===========================================================================

  - id: azure-eh-listkeys-namespace
    emits: CanReadSecret
    description: "Read SAS signing keys for a namespace-level authorization rule via listkeys/action; the primary and secondary keys can forge SAS tokens for all event hubs in the namespace."
    match_effective_permission:
      action: "Microsoft.EventHub/namespaces/authorizationRules/listkeys/action"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds namespaces/authorizationRules/listkeys/action at the namespace or enclosing scope"
      - "the namespace has disableLocalAuth != true (SAS authentication must be enabled)"
    emit:
      source_type: Identity
      target_type: APIKey
      source: "<principal>"
      target: "<namespace authorization rule (APIKey node) — primary + secondary SAS signing keys>"
      permissions:
        - "Microsoft.EventHub/namespaces/authorizationRules/listkeys/action"
      conditions: []
      state_logic: >-
        ACTIVE when the principal holds listkeys/action at the namespace scope AND
        disableLocalAuth=false (SAS is enabled). BLOCKED when disableLocalAuth=true —
        the keys still exist and listkeys returns them, but SAS-generated tokens are
        rejected by the service, so the credential is unusable. BLOCKED if a deny
        assignment covers listkeys/action. CONDITIONAL(key_permission) is not
        applicable here (no wrapping key); the gate is disableLocalAuth.
      confidence: 0.97
      derived_from:
        - "effective permission: Microsoft.EventHub/namespaces/authorizationRules/listkeys/action"
        - "credential-chains.yaml: read-secret-yields-identity (CanReadSecret + CredentialsFor(SAS key → consumer identity) => CanImpersonate)"
      false_positive_note: >-
        namespaces/authorizationRules/read (without /listkeys/action) returns rule
        names and rights but NOT the key values — do NOT emit CanReadSecret for a
        read without the listkeys action. When disableLocalAuth=true, the keys are
        returned by the ARM API but cannot authenticate to the Event Hubs data plane;
        emit as BLOCKED. The RootManageSharedAccessKey is always present by default
        unless explicitly deleted; its keys grant Manage + Send + Listen on all event
        hubs in the namespace — confirm the rule's rights before asserting scope. Honor
        the ARM scope: listkeys/action at RG scope covers all namespaces in the RG.
      narrative: >-
        {principal.name} can read the SAS signing keys for authorization rule
        {target.name} in Event Hubs namespace {namespace.name}
        (namespaces/authorizationRules/listkeys/action); the primary and secondary
        keys can forge SAS tokens granting Send, Listen, or Manage access to every
        event hub in the namespace. credential-chains read-secret-yields-identity
        rolls this to CanImpersonate/CanExecuteAs for any SAS-authenticated consumer
        whose identity the SAS token can be presented as.

  # ===========================================================================
  # 3. SAS key read at entity level (→ CanReadSecret)
  # Entity-level authorization rules are scoped to one event hub only.
  # Lower impact than namespace-level keys but still embeds send/listen credentials.
  # ===========================================================================

  - id: azure-eh-listkeys-entity
    emits: CanReadSecret
    description: "Read SAS signing keys for an entity-level (event-hub) authorization rule via listkeys/action; keys are scoped to one event hub."
    match_effective_permission:
      action: "Microsoft.EventHub/namespaces/eventhubs/authorizationRules/listkeys/action"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds eventhubs/authorizationRules/listkeys/action at the event-hub or enclosing scope"
      - "the namespace has disableLocalAuth != true"
    emit:
      source_type: Identity
      target_type: APIKey
      source: "<principal>"
      target: "<event-hub authorization rule (APIKey node) — primary + secondary SAS signing keys>"
      permissions:
        - "Microsoft.EventHub/namespaces/eventhubs/authorizationRules/listkeys/action"
      conditions: []
      state_logic: >-
        ACTIVE when the principal holds the listkeys action AND disableLocalAuth=false.
        BLOCKED when disableLocalAuth=true. BLOCKED if a deny assignment covers
        eventhubs/authorizationRules/listkeys/action. Scope is narrower than
        azure-eh-listkeys-namespace: keys here apply only to the targeted event hub,
        not the entire namespace.
      confidence: 0.96
      derived_from:
        - "effective permission: Microsoft.EventHub/namespaces/eventhubs/authorizationRules/listkeys/action"
        - "credential-chains.yaml: read-secret-yields-identity"
      false_positive_note: >-
        Entity-level SAS keys scope to a single event hub (Send, Listen, or Manage on
        that entity only). Manage right at the entity level lets the holder manage
        consumer groups and authorization rules for that hub but NOT other hubs.
        Honor the rule's rights (Send / Listen / Manage) when assessing downstream
        capability (send = CanWriteData, listen = CanReadData, manage = CanAdminister
        on the entity). When disableLocalAuth=true on the namespace, these keys are
        not usable despite being returned by ARM — emit as BLOCKED.
      narrative: >-
        {principal.name} can read the SAS signing keys for entity authorization rule
        {target.name} on event hub {eventhub.name}
        (eventhubs/authorizationRules/listkeys/action); the keys can forge SAS tokens
        scoped to Send, Listen, or Manage on that event hub only.

  # ===========================================================================
  # 4. SAS key node exposes credential (→ ExposesCredential)
  # A namespace authorization rule that has at least one Send or Manage right
  # and is usable (disableLocalAuth=false) exposes SAS credential material that
  # can authenticate to the event hub data plane. The SAS connection string
  # returned by listkeys is a ConnectionString node; credential-chains consumes
  # the CredentialsFor link from it to an authenticated identity / the event hub
  # data surface. This edge models the STATIC FACT that the authorization rule
  # embeds credential material — it feeds credential-chains, not a standalone path.
  # ===========================================================================

  - id: azure-eh-sas-key-exposes-cred
    emits: ExposesCredential
    description: "A namespace or entity authorization rule with usable SAS keys (disableLocalAuth=false) embeds connection-string credential material; any holder of the keys can authenticate to the Event Hubs data plane."
    match:
      - [ ?namespace, ContainsSecret, ?sasRule ]
    where:
      - "node_class(?namespace) == Messaging"
      - "node_type(?sasRule) == APIKey"
      - "?namespace.properties.disableLocalAuth != true"
      - "?sasRule.rights include Send OR Manage (i.e. the key grants data-plane write access)"
    emit:
      source_type: GenericMessaging
      target_type: Credential
      source: ?namespace
      target: "<SAS connection string (Credential / ConnectionString) embedded in ?sasRule>"
      permissions: []
      conditions: []
      state_logic: >-
        ACTIVE when the namespace has authorization rules with Send or Manage rights AND
        disableLocalAuth=false (SAS is enabled). BLOCKED when disableLocalAuth=true.
        This is a STATIC INVENTORY FACT (not action-gated): the connection-string
        credential exists in the ARM resource and is accessible to anyone who can invoke
        listkeys/action (gated separately by azure-eh-listkeys-namespace/entity).
        Expresses the fact that the authorization rule IS a credential, regardless of
        whether the attacker has currently read it — feeds credential-chains as the
        CredentialsFor link when the SAS connection string is CredentialsFor the event
        hub's data-plane access.
      confidence: 0.95
      derived_from:
        - "ContainsSecret: namespace has at least one authorization rule with SAS keys"
        - "credential-chains.yaml: ExposesCredential + CredentialsFor => CanImpersonate (if SAS key authenticates a specific identity)"
        - "messaging-chains.yaml: messaging-publish-triggers-consumer (SAS Send key => CanWriteData => CanTrigger consumer)"
      false_positive_note: >-
        This edge asserts that usable credential material EXISTS in the authorization
        rule — it does not assert the attacker has READ it. Reading the keys requires
        listkeys/action (azure-eh-listkeys-namespace / azure-eh-listkeys-entity). When
        disableLocalAuth=true, the keys are in ARM but cannot authenticate to the Event
        Hubs data plane — emit as BLOCKED. Only emit for rules with Send or Manage
        rights (Listen-only rules yield CanReadData, not CanWriteData; still credential
        material but lower impact). A SAS key is not a scoped Entra identity — it does
        not map to a specific service principal or managed identity, so CredentialsFor
        targets the EVENT HUB DATA PLANE (the Queue node), not an Identity node.
      narrative: >-
        Event Hubs namespace {namespace.name} authorization rule {sasRule.name} stores
        SAS signing keys (primary + secondary) that authenticate to the Event Hubs data
        plane; any holder of these keys (obtainable via listkeys/action) can generate
        SAS tokens granting {sasRule.rights} access to the namespace's event hubs.

  # ===========================================================================
  # 5. Data-plane Send / CanWriteData (ARM RBAC path)
  # The "publish" primitive. CanWriteData on the event hub (Queue) node feeds
  # messaging-chains messaging-publish-triggers-consumer when a CanTrigger(hub →
  # consumer) binding exists → CanTrigger(principal → consumer) CONDITIONAL.
  # ===========================================================================

  - id: azure-eh-data-sender
    emits: CanWriteData
    description: "Azure Event Hubs Data Sender role (or equivalent custom role) grants send (publish) access to an event hub; feeds messaging-chains trigger primitive."
    match_effective_permission:
      action: "Microsoft.EventHub/namespaces/eventhubs/messages/send/action"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds Azure Event Hubs Data Sender, Azure Event Hubs Data Owner, or a custom role granting send permission on the event hub"
    emit:
      source_type: Identity
      target_type: Queue
      source: "<principal>"
      target: "<event hub (Queue node)>"
      permissions:
        - "Microsoft.EventHub/namespaces/eventhubs/messages/send/action"
      conditions: [service_state]
      state_logic: >-
        ACTIVE when the principal holds the effective send permission AND the namespace
        is not suspended. BLOCKED if a deny assignment covers the send action. A
        principal who holds CanWriteData on the hub AND a CanTrigger(hub → consumer)
        binding exists feeds messaging-chains messaging-publish-triggers-consumer:
        messaging-publish-triggers-consumer produces CanTrigger(principal → consumer)
        CONDITIONAL(trigger_exists) and messaging-trigger-executes-as then produces
        CanExecuteAs CONDITIONAL(trigger_exists). Both are cited from messaging-chains
        and NOT re-derived here.
      confidence: 0.96
      derived_from:
        - "effective permission: Azure Event Hubs Data Sender role / messages/send/action"
        - "messaging-chains.yaml: messaging-publish-triggers-consumer (rule 1) — CanWriteData + CanTrigger(hub→consumer) => CanTrigger(principal→consumer)"
        - "messaging-chains.yaml: messaging-trigger-executes-as (rule 2) — CanTrigger(p→consumer) + ExecutesAs(consumer, identity) => CanExecuteAs"
      false_positive_note: >-
        Azure Event Hubs Data Sender grants data-plane send only; it does NOT include
        listkeys/action (SAS key reads) or any ARM control-plane write. CanWriteData
        alone is NOT escalation unless a consumer binding (Function trigger, SA input,
        Logic App connector) routes the hub to an executing consumer. Without a
        confirmed CanTrigger(hub → consumer) edge, messaging-publish-triggers-consumer
        in messaging-chains does not fire — keep CanWriteData as a data-plane send
        capability only. Honor scope: if the role is assigned at a consumer-group
        level (which Azure RBAC supports for Data Receiver but NOT for Data Sender —
        Sender is at namespace or event-hub level only), adjust accordingly.
      narrative: >-
        {principal.name} can send (publish) events to event hub {target.name}
        (Azure Event Hubs Data Sender / messages/send/action). If {target.name} is
        bound to a consumer (Azure Function event-hub trigger, Stream Analytics input,
        Logic App connector), messaging-chains messaging-publish-triggers-consumer
        derives CanTrigger({principal.name} → consumer) CONDITIONAL(trigger_exists),
        and messaging-trigger-executes-as then derives CanExecuteAs(consumer's MI).

  # ===========================================================================
  # 6. Data-plane Receive / CanReadData (ARM RBAC path)
  # Receiving events from the hub yields the event payloads, which may contain
  # sensitive data (connection strings, tokens, PII). CanReadData feeds the
  # data-plane rules for CanExfiltrate (cited, not re-derived here).
  # ===========================================================================

  - id: azure-eh-data-receiver
    emits: CanReadData
    description: "Azure Event Hubs Data Receiver role (or equivalent) grants receive (listen) access to an event hub or consumer group; event payloads may contain sensitive data → potential CanExfiltrate."
    match_effective_permission:
      action: "Microsoft.EventHub/namespaces/eventhubs/messages/receive/action"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds Azure Event Hubs Data Receiver, Azure Event Hubs Data Owner, or a custom role granting receive permission on the event hub or consumer group"
    emit:
      source_type: Identity
      target_type: Queue
      source: "<principal>"
      target: "<event hub (Queue node)>"
      permissions:
        - "Microsoft.EventHub/namespaces/eventhubs/messages/receive/action"
      conditions: [service_state]
      state_logic: >-
        ACTIVE when the principal holds the effective receive permission AND the
        namespace is not suspended. BLOCKED if a deny assignment covers the receive
        action. The escalation consequence (CanExfiltrate) is produced by the
        data-plane rules: CanReadData(p, hub) where events carry sensitive payloads →
        CanExfiltrate (cited, not re-derived here). CanReadData alone is data-plane
        access, not identity escalation.
      confidence: 0.93
      derived_from:
        - "effective permission: Azure Event Hubs Data Receiver role / messages/receive/action"
        - "data-plane rules: CanReadData + sensitive payloads => CanExfiltrate (CITED)"
        - "credential-chains.yaml: ContainsSecret(hub, secret) + CanReadData => CanReadSecret (if event body carries credential material)"
      false_positive_note: >-
        Azure Event Hubs Data Receiver grants data-plane receive only; no ARM control
        plane. CanReadData on an event hub is high-value only if the event payloads
        carry sensitive content (connection strings, tokens, PII) — this requires
        content-inspection or naming heuristics (hub name contains 'auth', 'cred',
        'token', 'key'). Without confirmed sensitive payload content, keep at
        confidence 0.70 (data access, sensitivity unconfirmed). A Data Receiver
        cannot send events (no CanWriteData) and cannot trigger consumers — the
        trigger path requires Data Sender or Manage rights.
      narrative: >-
        {principal.name} can receive (consume) events from event hub {target.name}
        (Azure Event Hubs Data Receiver / messages/receive/action). If event payloads
        carry sensitive content (connection strings, tokens, PII), this yields
        CanExfiltrate via the data-plane rules.

  # ===========================================================================
  # 7. Capture destination redirect (→ CanModifyConfiguration)
  # Changing the Capture destination of an event hub to attacker-controlled
  # storage causes all streaming data to be written to the attacker's Blob/ADLS
  # account in Avro format. This is a data-exfiltration-by-configuration attack.
  # The CanExfiltrate consequence is owned by the data-plane rules (cited).
  # ===========================================================================

  - id: azure-eh-capture-destination-write
    emits: CanModifyConfiguration
    description: "Modify the Capture configuration of an event hub (eventhubs/write) to redirect the Avro capture stream to an attacker-controlled storage account; all events are then captured to attacker storage."
    match_effective_permission:
      action: "Microsoft.EventHub/namespaces/eventhubs/write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds namespaces/eventhubs/write at the event-hub or enclosing scope"
      - "the event hub has captureDescription.enabled=true OR the principal can enable Capture"
    emit:
      source_type: Identity
      target_type: Queue
      source: "<principal>"
      target: "<event hub (Queue node)>"
      permissions:
        - "Microsoft.EventHub/namespaces/eventhubs/write"
      conditions: [service_state]
      state_logic: >-
        ACTIVE when the principal holds eventhubs/write AND can write to the target
        Storage account scope (Microsoft.Storage/storageAccounts/blobServices/containers/write
        is required by the Event Hubs service when configuring Capture — see Capture
        docs). CONDITIONAL(service_state) if Capture is not currently enabled (the
        attacker must also enable it, which requires the same write permission). BLOCKED
        if a deny assignment covers eventhubs/write. The downstream CanExfiltrate
        consequence (redirected Capture → all events written to attacker storage) is
        owned by the data-plane rules and cited here — NOT re-derived.
      confidence: 0.90
      derived_from:
        - "effective permission: Microsoft.EventHub/namespaces/eventhubs/write"
        - "data-plane rules: CanModifyConfiguration (Capture destination) + CanWriteData(attacker storage) => CanExfiltrate (CITED)"
        - "can-execute-as.yaml: execute-as-via-config-identity-swap (CanModifyConfiguration is a prerequisite for config-based escalation chains)"
      false_positive_note: >-
        namespaces/eventhubs/write includes the full event hub entity write: partition
        count, message retention, consumer group management, AND captureDescription.
        The Capture-redirect attack requires (a) the principal can modify the event
        hub (eventhubs/write) AND (b) the destination storage account accepts writes
        from the Event Hubs service identity (namespace MI must have Storage Blob Data
        Contributor or Owner on the target container). If the attacker controls an
        Azure storage account but has not granted the namespace MI write on it, Capture
        will fail with an error — only emit ACTIVE when both the eventhubs/write AND a
        path to the attacker's storage are confirmed. If Capture is not enabled and
        the principal can enable it, still emit (enabling + redirecting is the attack).
      narrative: >-
        {principal.name} can modify the Capture configuration of event hub {target.name}
        (namespaces/eventhubs/write); redirecting captureDescription.destination to an
        attacker-controlled storage account causes all event stream data to be
        automatically written to that storage in Avro format — exfiltrating the full
        stream without requiring direct receive permissions.

  # ===========================================================================
  # 8. Internet exposure (→ ExposedToInternet)
  # An Event Hubs namespace with no network restrictions (defaultAction=Allow,
  # publicNetworkAccess not Disabled) is reachable from the public internet on
  # <namespace>.servicebus.windows.net. Any holder of valid SAS or Entra credentials
  # can send or receive events from any internet client.
  # ===========================================================================

  - id: azure-eh-namespace-public
    emits: ExposedToInternet
    description: "An Event Hubs namespace with no IP/VNet network restrictions and publicNetworkAccess not Disabled is internet-reachable; any holder of SAS or Entra data-plane credentials can access it from the internet."
    match:
      - [ ?namespace, LocatedIn, ?rg ]
    where:
      - "node_class(?namespace) == Messaging"
      - "?namespace.properties.publicNetworkAccess != 'Disabled'"
      - "?namespace.properties.networkRuleSet.defaultAction == 'Allow' OR networkRuleSet not present"
    emit:
      source_type: GenericMessaging
      target_type: AnonymousIdentity
      source: ?namespace
      target: "<AnonymousIdentity>"
      permissions: []
      conditions: [service_state]
      state_logic: >-
        ACTIVE when the namespace has publicNetworkAccess not Disabled AND the network
        rule set defaultAction is Allow (or absent, defaulting to Allow). BLOCKED when
        publicNetworkAccess=Disabled (private endpoint only). CONDITIONAL(network_
        reachability) when VNet rules or IP-filter rules exist that restrict internet
        access — requires evaluation of the specific source IP/VNet. Note: internet
        reachability does NOT grant unauthorized access; valid SAS or Entra
        credentials are still required. This edge models the EXPOSURE SURFACE (reachable
        from internet + accessible with leaked/brute-forced credentials), not
        unauthenticated access.
      confidence: 0.88
      derived_from:
        - "namespace properties: publicNetworkAccess!=Disabled + networkRuleSet.defaultAction=Allow"
      false_positive_note: >-
        Event Hubs always requires authentication (SAS or Entra) regardless of network
        openness — there is no anonymous/public unauthenticated access mode. This edge
        models that the ENDPOINT IS INTERNET-REACHABLE, not that it is exploitable
        without credentials. The value is: an attacker who has stolen SAS keys
        (listkeys) or Entra credentials can use them from any internet location. If
        IP-filter or VNet service endpoint rules deny the attacker's source IP, downgrade
        to CONDITIONAL(network_reachability). If publicNetworkAccess=Disabled, emit as
        BLOCKED — the internet-facing endpoint is completely closed.
      narrative: >-
        Event Hubs namespace {namespace.name} is internet-reachable
        (publicNetworkAccess enabled, networkRuleSet.defaultAction=Allow) — any
        holder of valid SAS keys or Entra data-plane credentials can send or receive
        events from any internet client without needing a VNet foothold.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - disableLocalAuth=true → azure-eh-listkeys-namespace, azure-eh-listkeys-entity,
#    azure-eh-sas-key-exposes-cred, and any SAS-token-derived CanWriteData/CanReadData
#    edge BLOCKED (keys are returned but cannot authenticate to the data plane).
#  - publicNetworkAccess=Disabled → azure-eh-namespace-public BLOCKED.
#  - networkRuleSets.defaultAction=Deny with IP/VNet rules → azure-eh-namespace-public
#    CONDITIONAL(network_reachability).
#  - deny assignment covering listkeys/action → azure-eh-listkeys-namespace/-entity
#    BLOCKED.
#  - deny assignment covering eventhubs/write → azure-eh-capture-destination-write
#    BLOCKED.
#  - No CanTrigger(hub → consumer) binding → messaging-publish-triggers-consumer
#    (messaging-chains) does NOT fire; azure-eh-data-sender yields CanWriteData only.
# ---------------------------------------------------------------------------

# Normalization rules for this service (emitted from ARM resource snapshots):
# ExecutesAs (consumer service rules — owned by azure:functions, SA, Logic Apps)
# is produced by the consumer service adapters, not here.
# The rules below emit:
#   - LocatedIn (event-hub → namespace)
#   - ContainsSecret (namespace/event-hub → authorization rule APIKey)
#   - CanTrigger (event-hub → consumer Function/Stream Analytics/Logic App binding)
explicit_rules:

  - id: azure-eh-eventhub-located-in-namespace
    emits: LocatedIn
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventHub/namespaces/eventhubs"
      field: "id"
    emit:
      source_type: Queue
      target_type: GenericMessaging
      source: "<event hub (Queue)>"
      target: "<parent Event Hubs namespace>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventHub/namespaces/{ns}/eventhubs"
      evidence_field: "id"
      narrative: "Event hub {source.name} is located in Event Hubs namespace {target.name}."

  - id: azure-eh-contains-authorizationrule
    emits: ContainsSecret
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventHub/namespaces/authorizationRules"
      field: "properties.rights"
    where:
      - "properties.rights is non-empty (Send, Listen, or Manage)"
    emit:
      source_type: GenericMessaging
      target_type: APIKey
      source: "<Event Hubs namespace>"
      target: "<authorization rule (APIKey node)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventHub/namespaces/{ns}/authorizationRules"
      evidence_field: "properties.rights"
      narrative: "Event Hubs namespace {source.name} has authorization rule {target.name} with rights {value}; the rule stores SAS signing keys."

  - id: azure-eh-entity-authorizationrule
    emits: ContainsSecret
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.EventHub/namespaces/eventhubs/authorizationRules"
      field: "properties.rights"
    where:
      - "properties.rights is non-empty"
    emit:
      source_type: Queue
      target_type: APIKey
      source: "<event hub>"
      target: "<entity authorization rule (APIKey)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventHub/namespaces/{ns}/eventhubs/{eh}/authorizationRules"
      evidence_field: "properties.rights"
      narrative: "Event hub {source.name} has entity authorization rule {target.name} with rights {value} — SAS keys scoped to this event hub."

  - id: azure-eh-eventhub-triggers-function
    emits: CanTrigger
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.Web/sites/functions"
      field: "properties.config.bindings"
    where:
      - "any binding in properties.config.bindings has type=eventHubTrigger AND eventHubName references this event hub"
    emit:
      source_type: Queue
      target_type: ServerlessFunction
      source: "<event hub (Queue) referenced in the binding>"
      target: "<Azure Function (ServerlessFunction)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/sites/{app}/functions"
      evidence_field: "properties.config.bindings[*].eventHubName"
      narrative: "Event hub {source.name} triggers Azure Function {target.name} via an event-hub trigger binding; events published to the hub cause the Function to execute as its managed identity."

  - id: azure-eh-eventhub-triggers-stream-analytics
    emits: CanTrigger
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.StreamAnalytics/StreamingJobs/inputs"
      field: "properties.properties.datasource.properties.eventHubName"
    where:
      - "properties.datasource.type == EventHub"
      - "properties.datasource.properties.eventHubName references this event hub"
    emit:
      source_type: Queue
      target_type: Workflow
      source: "<event hub (Queue) referenced in the input>"
      target: "<Azure Stream Analytics job (Workflow)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.StreamAnalytics/StreamingJobs/{job}/inputs"
      evidence_field: "properties.datasource.properties.eventHubName"
      narrative: "Event hub {source.name} is an input to Azure Stream Analytics job {target.name}; events published to the hub trigger the job's continuous query, which executes as the job's managed identity."

  - id: azure-eh-eventhub-triggers-logic-app
    emits: CanTrigger
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.Logic/workflows"
      field: "properties.definition.triggers"
    where:
      - "any trigger in definition.triggers has type=ApiConnection (EventHub) AND eventHubName references this event hub"
    emit:
      source_type: Queue
      target_type: Workflow
      source: "<event hub (Queue) referenced in the trigger>"
      target: "<Azure Logic App (Workflow)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Logic/workflows/{app}"
      evidence_field: "properties.definition.triggers[*].inputs.host.connection.name"
      narrative: "Event hub {source.name} is a trigger for Azure Logic App {target.name}; events published to the hub cause the Logic App workflow to execute as its managed identity or service principal."
