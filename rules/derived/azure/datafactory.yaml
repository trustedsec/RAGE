# Azure — Data Factory (Microsoft.DataFactory) derived attack-path rules (Phase 11)
# ---------------------------------------------------------------------------
# PHASE-11 SERVICE ADAPTER: Data Factory is the Azure ETL/pipeline orchestration
# service. A factory is BOTH a Workflow compute surface (runs as a managed identity)
# AND a credential store (linked services hold connection strings, SP secrets, and
# storage keys for downstream data sources). This file emits NORMALIZED FACTS that
# the phase-11 and provider-agnostic linchpins consume. Full escalation and
# cross-boundary roll-ups are NOT re-derived here — they are CITED and owned by
# their respective linchpins.
#
# DOMINANT PHASE-11 PRIMITIVE:
#   A pipeline (Workflow node) ExecutesAs the factory MI. Whoever can submit a run
#   OR modify the pipeline definition (activity JSON) causes attacker-controlled
#   logic to run as that MI. This mirrors:
#     can-execute-as   execute-as-via-code-modify:
#                      CanModifyCode(?p, ?pipeline) + ExecutesAs(?pipeline, ?mi) =>
#                      CanExecuteAs(?p, ?mi)
#     cicd-chains      cicd-modify-buildspec-executes-as:
#                      CanModifyCode(?p, ?runner) + ExecutesAs(?runner, ?identity) =>
#                      CanExecuteAs(?p, ?identity)
#   Emit the FACTS (CanModifyCode, CanInvoke/trigger, ExecutesAs); cite the linchpins
#   for the CanExecuteAs collapse. Do NOT re-derive CanExecuteAs here.
#
# SECONDARY MODES:
#   (2) DATA ACCESS + EXFIL: Copy activity configured with a public or cross-boundary
#       sink moves data out of the factory's authorized scope -> CanExfiltrate.
#   (3) LINKED SERVICES store DB connection strings, storage keys, SP client secrets,
#       and API keys -> ContainsSecret / ExposesCredential -> CanReadSecret.
#   (4) PASS IDENTITY (Azure PassRole analog): factories/write + assign/action on a
#       user-assigned MI -> CanPassIdentity / CanAttachIdentity -> cicd-chains /
#       can-execute-as collapse to CanCreateWorkloadAs / CanExecuteAs.
#
# LINCHPINS CITED (do NOT re-derive their collapses here):
#   can-execute-as    execute-as-via-code-modify:
#                     CanModifyCode(?p, ?pipeline) + ExecutesAs(?pipeline, ?mi)
#                     => CanExecuteAs(?p, ?mi)   [ACTIVE if trigger path; CONDITIONAL otherwise]
#   cicd-chains       cicd-modify-buildspec-executes-as (same collapse, CI/CD framing):
#                     CanModifyCode(?p, ?runner) + ExecutesAs(?runner, ?identity)
#                     => CanExecuteAs(?p, ?identity)
#   can-execute-as    execute-as-via-config-identity-swap:
#                     CanModifyConfiguration(?p, ?pipeline) + CanPassIdentity(?p, ?mi)
#                     => CanExecuteAs(?p, ?mi)
#   can-execute-as    execute-as-via-new-workload:
#                     CanCreateWorkloadAs(?p, ?mi) => CanExecuteAs(?p, ?mi)
#   can-control       escalate-via-execute-as:
#                     CanExecuteAs(?p, ?mi) + privilege(?mi) > privilege(?p)
#                     => CanEscalateTo(?p, ?mi)
#   credential-chains read-secret-yields-identity:
#                     CanReadSecret(?p, ?secret) + CredentialsFor(?secret, ?id)
#                     => CanImpersonate(?p, ?id)
#
# All operation strings verified against the Microsoft.DataFactory resource-provider
# operations reference (2026-09 snapshot) and the ADF RBAC built-in roles docs.
# No hallucinated permissions.
#
# STATE DEFAULTS (per RULE-FORMAT.md):
#   ACTIVE when all required operations are confirmed AND a trigger/run path exists.
#   CONDITIONAL(trigger_exists) when pipeline is modified but no confirmed run path.
#   CONDITIONAL(service_state) when trigger is Stopped and no CanStart path.
#   CONDITIONAL(iam_permission) when sink/source access not confirmed.
#   BLOCKED when a deny assignment covers the critical action at effective scope.
# ---------------------------------------------------------------------------

provider: azure
phase: 11-data-analytics-ml
applies_to: [azure]

rules:

  # ===========================================================================
  # 1. Administrative control over the factory
  # ===========================================================================

  - id: azure-adf-contributor
    emits: CanAdminister
    description: "Full control of an ADF factory (Data Factory Contributor / Contributor / Owner)."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds Data Factory Contributor, Contributor, Owner, or a custom role granting Microsoft.DataFactory/factories/* at the scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Data Factory (Microsoft.DataFactory/factories) in scope>"
      permissions:
        - "Microsoft.DataFactory/factories/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed; BLOCKED if a deny
        assignment covers factories/write. CanAdminister on the factory does NOT
        imply CanGrantPermission — escalation is via the factory's managed identity,
        not self-role-assignment (Microsoft.Authorization/*/write is absent from
        Data Factory Contributor). Data Factory Contributor does NOT include
        pipelines/createRun/action; triggering runs requires Contributor/Owner or
        a custom role.
      confidence: 0.98
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/write"
      false_positive_note: >-
        Data Factory Contributor grants Microsoft.DataFactory/factories/* including
        pipelines/write, linkedservices/write, triggers/write, but NOT
        Microsoft.Authorization/*/write and NOT pipelines/createRun/action. A
        principal with Data Factory Contributor can modify definitions but cannot
        directly trigger runs — only if they ALSO hold createRun/action (Contributor
        / Owner / custom role). Distinguish these when emitting downstream edges.
      narrative: >-
        {principal.name} has full administrative control of Data Factory
        {target.name} (Microsoft.DataFactory/factories/*) including pipeline
        definitions, linked services, triggers, and identity configuration.

  # ===========================================================================
  # 2. Code modification — pipeline definition overwrite
  # ===========================================================================

  - id: azure-adf-pipeline-write-modifycode
    emits: CanModifyCode
    description: "Overwrite an ADF pipeline definition to inject arbitrary activities (Web, Custom, Copy) that run as the factory MI."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/pipelines/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Workflow
      source: "<principal>"
      target: "<ADF pipeline (Workflow node)>"
      permissions:
        - "Microsoft.DataFactory/factories/pipelines/write"
      conditions: [trigger_exists]
      state_logic: >-
        ACTIVE when the definition is modified AND a trigger path exists (a Schedule
        trigger is Enabled, a Storage Events trigger is bound to an active blob event,
        or the principal also holds pipelines/createRun/action to start a run directly).
        CONDITIONAL(trigger_exists) when no confirmed trigger or invoke path exists.
        BLOCKED if a deny assignment covers pipelines/write at the scope.
        Note: if the factory uses Git integration (repoConfiguration set), the
        ARM pipelines/write reflects the PUBLISHED version; modifying via ARM still
        overwrites the published definition. Parallel path via Git repo is a
        separate cicd-chains entry.
      confidence: 0.97
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/pipelines/write"
      false_positive_note: >-
        pipelines/write is granted to Data Factory Contributor, Contributor, and
        Owner. The Data Factory Operator role (if used via ARM custom role for
        trigger management only) does NOT include pipelines/write; do not derive
        CanModifyCode from a trigger-only role. Realized on next trigger event or
        direct createRun — without either, emit CONDITIONAL(trigger_exists) not
        ACTIVE. The managed identity must exist for CanExecuteAs to fire via
        can-execute-as; if the factory has no MI, this yields only linked-service
        credential access, not ARM token access.
      narrative: >-
        {principal.name} can overwrite the pipeline definition of {target.name}
        (Microsoft.DataFactory/factories/pipelines/write), injecting Web, Custom,
        or Copy activities that run as the factory's managed identity on the next
        trigger or run invocation.

  # ===========================================================================
  # 3. Code modification — Data Flow definition overwrite
  # ===========================================================================

  - id: azure-adf-dataflow-write-modifycode
    emits: CanModifyCode
    description: "Overwrite an ADF Data Flow definition to inject attacker transformation logic running on the factory's Spark/IR cluster as the factory MI."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/dataflows/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Workflow
      source: "<principal>"
      target: "<ADF Data Flow (Workflow node)>"
      permissions:
        - "Microsoft.DataFactory/factories/dataflows/write"
      conditions: [trigger_exists]
      state_logic: >-
        CONDITIONAL(trigger_exists) — realized when a pipeline that references this
        Data Flow executes (via schedule trigger or createRun). ACTIVE if a confirmed
        trigger pipeline exists AND the principal can trigger it. BLOCKED if a deny
        assignment covers dataflows/write.
      confidence: 0.85
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/dataflows/write"
      false_positive_note: >-
        A Data Flow is executed by a pipeline Execute Data Flow activity — the Data
        Flow definition itself is not a standalone runnable. CanModifyCode here means
        the attacker controls the transformation logic the pipeline executes; it still
        requires a pipeline trigger to realize. Lower confidence than pipelines/write
        because the Spark-based execution surface adds an IR/cluster layer.
      narrative: >-
        {principal.name} can overwrite the Data Flow {target.name} definition
        (Microsoft.DataFactory/factories/dataflows/write), injecting attacker
        transformation logic that runs on the factory's Spark cluster as the factory
        MI when the parent pipeline is triggered.

  # ===========================================================================
  # 4. Configuration modification — factory-level (identity, Git, network)
  # ===========================================================================

  - id: azure-adf-factory-write-config
    emits: CanModifyConfiguration
    description: "Modify factory-level config (identity block, Git integration, public network access) via factories/write."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Data Factory>"
      permissions:
        - "Microsoft.DataFactory/factories/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. Changing the identity block
        (attach/detach user-assigned MI) requires BOTH factories/write AND
        assign/action on the MI — that compound is the CanAttachIdentity path
        (rule azure-adf-attach-user-mi), not this rule alone. This rule covers
        configuration changes that do not require a separate MI assign action (Git
        integration pointer, public network access flag, CMK encryption key swap,
        global parameters). BLOCKED if a deny assignment covers factories/write.
      confidence: 0.90
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/write"
      false_positive_note: >-
        factories/write alone does NOT attach a user-assigned MI (that requires the
        separate assign/action on the MI resource). It CAN enable a system-assigned
        MI (identity.type=SystemAssigned), but the newly created system-assigned SP
        has no RBAC grants by default. Redirect Git integration to an attacker repo
        is a supply-chain CanModifyCode path (cicd-chains framing) that overlaps with
        azure-adf-pipeline-write-modifycode when the factory syncs from Git.
      narrative: >-
        {principal.name} can modify factory-level configuration of {target.name}
        (Microsoft.DataFactory/factories/write), including the Git integration
        pointer, public network access, and global parameters.

  # ===========================================================================
  # 5. Configuration modification — linked service credential swap
  # ===========================================================================

  - id: azure-adf-linkedservice-write-config
    emits: CanModifyConfiguration
    description: "Overwrite a linked service definition to inject attacker-controlled credentials or an attacker data source endpoint."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/linkedservices/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<ADF linked service (ConnectionString node)>"
      permissions:
        - "Microsoft.DataFactory/factories/linkedservices/write"
      conditions: [trigger_exists]
      state_logic: >-
        CONDITIONAL(trigger_exists) — the overwritten linked service is used by
        pipelines on their next run. ACTIVE if the attacker can also trigger a run
        (pipelines/createRun/action or a Schedule trigger for a pipeline that
        references this linked service). BLOCKED if a deny assignment covers
        linkedservices/write. Can also be used to redirect a linked service to an
        attacker-controlled HTTPS endpoint (exfiltration) or to inject credentials
        that give the pipeline access to a restricted data source.
      confidence: 0.85
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/linkedservices/write"
      false_positive_note: >-
        Overwriting a linked service with a malicious endpoint only matters when
        a pipeline that uses the linked service is triggered — emit CONDITIONAL
        (trigger_exists) not ACTIVE unless a run path is confirmed. When the linked
        service is Key-Vault-backed, swapping credentials requires also having access
        to the KV secret or to specify inline creds instead. Do not conflate this
        edge with CanReadSecret — writing a linked service changes creds but does not
        read existing ones.
      narrative: >-
        {principal.name} can overwrite the linked service {target.name}
        (Microsoft.DataFactory/factories/linkedservices/write), replacing its
        connection string or endpoint with attacker-controlled values used on the
        next pipeline run.

  # ===========================================================================
  # 6. Credential access — linked service inline credentials
  # ===========================================================================

  - id: azure-adf-linkedservice-read-secret
    emits: CanReadSecret
    description: "Read an ADF linked service definition that contains inline connection string, storage key, SP client secret, or password."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/linkedservices/read"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "the linked service typeProperties contains inline credential material (connectionString, accountKey, clientSecret, password, sasUri, or accessToken value) — NOT a Key Vault reference"
    emit:
      source_type: Identity
      target_type: Secret
      source: "<principal>"
      target: "<credential embedded in the linked service (ConnectionString / AccessKey / Secret node)>"
      permissions:
        - "Microsoft.DataFactory/factories/linkedservices/read"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed AND the linked service
        typeProperties carries inline credential material (not a Key Vault reference).
        CONDITIONAL when the linked service uses a Key Vault reference — the credential
        is in Key Vault; reading the linked service reveals the secret URL/name but not
        the plaintext (resolve Key Vault separately). BLOCKED if a deny assignment
        covers linkedservices/read.
      confidence: 0.90
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/linkedservices/read"
        - "<ContainsSecret edge: ?linkedservice -> ?credential>"
      false_positive_note: >-
        Only emit when the linked service typeProperties contains verifiable inline
        credential material. A Key Vault reference (typeProperties.*.type ==
        AzureKeyVaultSecret) is NOT inline — emit ContainsResourceReference (pointing
        to the KV secret) and resolve Key Vault access separately. The ARM API returns
        the typeProperties JSON at Reader level; many organizations restrict
        linkedservices/read above Reader to limit credential exposure. credential-chains
        read-secret-yields-identity rolls up CanReadSecret + CredentialsFor ->
        CanImpersonate; do not re-derive.
      narrative: >-
        {principal.name} can read linked service {target.name}
        (Microsoft.DataFactory/factories/linkedservices/read), exposing an inline
        connection string, storage account key, service-principal client secret, or
        password stored in the linked service definition.

  # ===========================================================================
  # 7. Credential access — pipeline definition inline credentials
  # ===========================================================================

  - id: azure-adf-pipeline-read-secret
    emits: CanReadSecret
    description: "Read an ADF pipeline definition containing inline SAS URLs, API keys, or connection strings in activity url/body parameters."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/pipelines/read"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "the pipeline definition contains inline credential material in activity properties (url, body, connection string parameters, API keys)"
    emit:
      source_type: Identity
      target_type: Secret
      source: "<principal>"
      target: "<credential embedded in pipeline activity (APIKey / ConnectionString / Secret node)>"
      permissions:
        - "Microsoft.DataFactory/factories/pipelines/read"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed AND the pipeline definition
        contains verifiable inline credential material in activity parameters (not a
        linked-service reference). CONDITIONAL when credentials are indirect references
        to linked services. BLOCKED if a deny assignment covers pipelines/read.
      confidence: 0.82
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/pipelines/read"
        - "<ContainsSecret edge: ?pipeline -> ?credential>"
      false_positive_note: >-
        Pipeline activities can embed credentials directly in their url, body, or
        connection string parameters — these are readable at Reader level (pipelines/read).
        If credentials are stored in linked services only, resolve via azure-adf-linkedservice-read-secret
        instead. Inline credentials are often in Copy source/sink url parameters, Web
        activity headers, or Custom activity body. The ARM API returns the pipeline
        definition JSON with credentials plaintext; many organizations restrict
        pipelines/read above Reader to limit exposure.
      narrative: >-
        {principal.name} can read pipeline definition {target.name}
        (Microsoft.DataFactory/factories/pipelines/read), exposing inline
        credential material (SAS URL, API key, connection string) embedded in
        activity parameters.

  # ===========================================================================
  # 7b. Credential access — linked service auth key retrieval
  # ===========================================================================

  - id: azure-adf-listauthkeys-readcred
    emits: CanReadCredential
    description: "Retrieve authentication keys for linked services via listAuthKeys/action, directly accessing the plaintext credential without parsing typeProperties."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/linkedservices/listAuthKeys/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Credential
      source: "<principal>"
      target: "<linked service authentication key (AccessKey / Credential node)>"
      permissions:
        - "Microsoft.DataFactory/factories/linkedservices/listAuthKeys/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. listAuthKeys/action
        directly retrieves plaintext authentication material for the linked service
        (storage keys, connection strings, SP client secrets), bypassing the need to
        parse typeProperties. BLOCKED if a deny assignment covers the action. Note:
        this is a data-plane action; it requires a valid bearer token or ARM credentials.
      confidence: 0.93
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/linkedservices/listAuthKeys/action"
      false_positive_note: >-
        listAuthKeys/action is a dedicated credential-retrieval method distinct from
        linkedservices/read (which returns the full resource definition). The action
        is granted to custom roles that need to manage linked service credentials
        without read access to the full resource. Higher confidence than linkedservice-read-secret
        because the action is explicitly for credential access. credential-chains
        read-secret-yields-identity rolls up CanReadCredential + CredentialsFor ->
        CanImpersonate; do not re-derive.
      narrative: >-
        {principal.name} can retrieve authentication keys for linked services
        (Microsoft.DataFactory/factories/linkedservices/listAuthKeys/action),
        exposing plaintext storage keys, connection strings, and service-principal
        client secrets.

  # ===========================================================================
  # 8. Credential access — data-plane access token
  # ===========================================================================

  - id: azure-adf-get-dataplane-access
    emits: CanReadSecret
    description: "Obtain a short-lived ADF data-plane access token (getDataPlaneAccess/action) scoped to factory Author/Monitor/DataAccess operations."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/getDataPlaneAccess/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Secret
      source: "<principal>"
      target: "<ADF data-plane access token (Token node) scoped to the factory>"
      permissions:
        - "Microsoft.DataFactory/factories/getDataPlaneAccess/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. The returned token is
        short-lived (1 hour) and scoped to ADF data-plane operations (Author, Monitor,
        DataAccess roles within the factory). BLOCKED if a deny assignment covers the
        action.
      confidence: 0.88
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/getDataPlaneAccess/action"
      false_positive_note: >-
        The data-plane access token is scoped to ADF Author/Monitor/DataAccess
        operations — it does NOT grant broader Azure ARM access (not a factory-MI
        bearer token). It allows ADF REST data-plane calls (list pipelines, trigger
        runs, read run history) within the factory. Do not conflate with a factory-MI
        token. Lower impact than CanReadSecret on a linked service with SP creds or a
        storage key.
      narrative: >-
        {principal.name} can obtain a short-lived ADF data-plane access token for
        factory {target.name} (getDataPlaneAccess/action), enabling ADF REST data-plane
        calls (Author / Monitor / DataAccess) without ARM credentials.

  # ===========================================================================
  # 9. Linked service exposes credential (ExposesCredential)
  # ===========================================================================

  - id: azure-adf-linkedservice-exposes-cred
    emits: ExposesCredential
    description: "An ADF linked service stores a long-lived embedded credential (connection string, storage key, SP secret) exposed to pipeline runs."
    match:
      - [ ?linkedservice, ContainsSecret, ?cred ]
    where:
      - "node_type(?linkedservice) == ConnectionString or node_class(?linkedservice) == Data"
      - "?linkedservice is a Microsoft.DataFactory/factories/linkedservices resource"
    emit:
      source_type: Data
      target_type: Identity
      source: "<linked service (ConnectionString node)>"
      target: "<identity/service the embedded credential authenticates as>"
      permissions: []
      conditions: []
      state_logic: >-
        ACTIVE when the linked service has confirmed stored inline credential material.
        CONDITIONAL when the credential is a Key Vault-backed secret reference (not
        inline — must resolve KV access separately).
      confidence: 0.88
      derived_from:
        - "<ContainsSecret edge: ?linkedservice -> ?cred>"
      false_positive_note: >-
        The embedded credential is accessible to all pipeline runs using this linked
        service (the ADF runtime decrypts it at run time). It is also accessible to
        any principal holding linkedservices/read (rule azure-adf-linkedservice-read-secret).
        The target identity is the service the credential authenticates to (SQL server,
        storage account, external API, Service Bus namespace). credential-chains rolls
        up ContainsSecret + CredentialsFor -> downstream access edges; this rule emits
        only the ExposesCredential fact.
      narrative: >-
        Linked service {linkedservice.name} stores an embedded credential (connection
        string / storage key / client secret) exposed to any pipeline run that uses it,
        and readable by principals holding linkedservices/read.

  # ===========================================================================
  # 10. SHIR node exposes linked service credentials
  # ===========================================================================

  - id: azure-adf-shir-exposes-cred
    emits: ExposesCredential
    description: "A Self-Hosted IR node VM stores encrypted linked service credentials in its local credential store; OS-level access to the node decrypts them."
    match:
      - [ ?vm, ExecutesAs, ?identity ]
    where:
      - "node_type(?vm) == VirtualMachine"
      - "?vm is a Self-Hosted Integration Runtime node (registered to a Microsoft.DataFactory/factories/integrationruntimes of type SelfHosted)"
    emit:
      source_type: Compute
      target_type: Secret
      source: "<SHIR node VirtualMachine>"
      target: "<linked service credentials stored in SHIR node credential store (Credential node)>"
      permissions: []
      conditions: [iam_permission]
      state_logic: >-
        CONDITIONAL(iam_permission) — the node credential store is DPAPI-encrypted;
        accessing it requires CanExecuteCommand on the SHIR VM (OS-level access).
        ACTIVE only when combined with CanExecuteCommand(?p, ?vm). BLOCKED if the
        SHIR node is deregistered from the factory.
      confidence: 0.80
      derived_from:
        - "<ExecutesAs edge: ?vm -> ?identity>"
        - "SHIR node stores encrypted credentials for linked services using SelfHosted IR"
      false_positive_note: >-
        This rule emits the FACT that the SHIR node stores linked service creds, not
        that any actor can access them directly. The attack path requires CanExecuteCommand
        on the SHIR VM first (e.g., via Microsoft.Compute/virtualMachines/runCommand/action
        or VM agent). The credential decryption uses the SHIR Windows Data Protection
        API (DPAPI) or the SHIR credential store API — neither is remotely callable
        without OS access. Do NOT emit CanReadSecret directly from this rule; it feeds
        a credential-chains derivation only when combined with a CanExecuteCommand edge.
      narrative: >-
        Self-Hosted IR node {vm.name} stores encrypted linked service credentials
        in its local DPAPI-protected credential store; an attacker with OS-level
        command execution on this VM can decrypt and retrieve those credentials.

  # ===========================================================================
  # 11. Direct pipeline run invocation (createRun/action)
  # ===========================================================================

  - id: azure-adf-createrun-invoke
    emits: CanInvoke
    description: "Directly trigger a pipeline run via pipelines/createRun/action (requires Contributor/Owner or a custom role — NOT Data Factory Contributor)."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/pipelines/createRun/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Workflow
      source: "<principal>"
      target: "<ADF pipeline (Workflow node)>"
      permissions:
        - "Microsoft.DataFactory/factories/pipelines/createRun/action"
      conditions: [service_state]
      state_logic: >-
        ACTIVE when the effective permission is confirmed and the factory is enabled
        (not paused). CONDITIONAL(service_state) if the factory has a suspended/paused
        integration runtime that the pipeline depends on. BLOCKED if a deny assignment
        covers createRun/action. NOTE: createRun/action is a DATA action not included
        in Data Factory Contributor — requires Contributor, Owner, or an explicit
        custom role grant.
      confidence: 0.95
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/pipelines/createRun/action"
      false_positive_note: >-
        createRun/action is NOT in the Data Factory Contributor built-in role. Only
        Contributor, Owner, or a custom role explicitly granting this data action allows
        direct run invocation. Do NOT emit CanInvoke for a principal holding only Data
        Factory Contributor. This CanInvoke completes the trigger path for
        can-execute-as execute-as-via-code-modify (optional[0] clause) — confirm the
        principal holds BOTH pipelines/write AND createRun/action for a fully ACTIVE
        CanExecuteAs.
      narrative: >-
        {principal.name} can directly invoke a pipeline run on {target.name}
        (Microsoft.DataFactory/factories/pipelines/createRun/action), providing
        the trigger path needed to realize CanExecuteAs on the factory MI.

  # ===========================================================================
  # 12. Trigger creation/modification (schedule persistence)
  # ===========================================================================

  - id: azure-adf-trigger-write-schedule
    emits: CanSchedule
    description: "Create or modify an ADF trigger (Schedule / Tumbling Window) to fire pipelines autonomously as the factory MI — persistent execution."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/triggers/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Scheduler
      source: "<principal>"
      target: "<ADF trigger (Scheduler or EventRule node)>"
      permissions:
        - "Microsoft.DataFactory/factories/triggers/write"
      conditions: [role_compatibility]
      state_logic: >-
        ACTIVE when the principal can write a trigger AND the pipeline the trigger
        fires has a managed identity (the trigger fires AS the MI — persistence).
        CONDITIONAL(role_compatibility) if the MI attachment is not yet confirmed.
        A trigger alone (without pipeline/write) only arms existing pipeline
        definitions — if the attacker also holds pipelines/write the full modify-
        then-run chain is ACTIVE. BLOCKED if a deny assignment covers triggers/write.
      confidence: 0.88
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/triggers/write"
      false_positive_note: >-
        triggers/write creates a RECURRING execution schedule; it is security-relevant
        only when the triggered pipeline runs as a managed identity. A Schedule trigger
        on a pipeline with no MI yields no ARM token access. The cicd-chains linchpin
        (cicd-modify-buildspec-executes-as) and can-execute-as (execute-as-via-code-modify)
        own the CanExecuteAs collapse when combined with CanModifyCode and ExecutesAs.
        This CanSchedule edge completes the CanTrigger path needed by those linchpins
        — cite, do not re-derive CanExecuteAs here.
      narrative: >-
        {principal.name} can create or modify a Schedule/Tumbling Window trigger for
        factory {target.name} (Microsoft.DataFactory/factories/triggers/write),
        establishing a persistent autonomous pipeline execution schedule that runs as
        the factory's managed identity.

  # ===========================================================================
  # 12. Integration Runtime configuration modification
  # ===========================================================================

  - id: azure-adf-ir-write-config
    emits: CanModifyConfiguration
    description: "Modify an ADF Integration Runtime configuration to swap SHIR VM assignment, reconfigure managed VNet, or change IR type — enables command execution or data exfiltration via network steering."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/integrationruntimes/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: ContainerCluster
      source: "<principal>"
      target: "<ADF Integration Runtime (ContainerCluster node)>"
      permissions:
        - "Microsoft.DataFactory/factories/integrationruntimes/write"
      conditions: [trigger_exists]
      state_logic: >-
        CONDITIONAL(trigger_exists) — IR configuration changes take effect on the
        next IR initialization / pipeline run referencing the IR. ACTIVE when the
        attacker can also trigger a pipeline that uses the IR (pipelines/createRun/action
        or a Schedule trigger). A SHIR VM swap in particular elevates to CanExecuteCommand
        on the new VM (via can-execute-as CanModifyConfiguration path). Reconfiguring
        the Azure IR managed VNet enables steering of data-plane traffic to attacker
        endpoints (exfiltration via managed private endpoints). BLOCKED if a deny
        assignment covers integrationruntimes/write.
      confidence: 0.87
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/integrationruntimes/write"
      false_positive_note: >-
        IR configuration changes are realized on the next initialization. SHIR VM
        swap is tracked as a separate sub-path via can-execute-as (CanModifyConfiguration
        on IR + ExecutesAs(new_vm, identity) => CanExecuteAs). Swapping an IR to a
        malicious SHIR node should emit a separate CanExecuteCommand edge if the swap
        is confirmed. Reconfiguring the managed VNet is a configuration change only;
        the actual exfiltration path is via managed private endpoints + external sink,
        tracked by azure-adf-copy-exfiltrate.
      narrative: >-
        {principal.name} can modify the Integration Runtime configuration of
        {target.name} (Microsoft.DataFactory/factories/integrationruntimes/write),
        including SHIR VM assignment or managed VNet settings, which take effect on
        the next initialization.

  # ===========================================================================
  # 13. Trigger start (realize CONDITIONAL execution)
  # ===========================================================================

  - id: azure-adf-trigger-start
    emits: CanModify
    description: "Start a stopped ADF trigger to realize CONDITIONAL(trigger_exists) execution edges."
    match_effective_permission:
      action: "Microsoft.DataFactory/factories/triggers/start/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Scheduler
      source: "<principal>"
      target: "<ADF trigger (Scheduler / EventRule node)>"
      permissions:
        - "Microsoft.DataFactory/factories/triggers/start/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. Needed to realize any
        CONDITIONAL(trigger_exists) or CONDITIONAL(service_state) execution edge
        on a Stopped trigger. BLOCKED if a deny assignment covers triggers/start/action.
      confidence: 0.95
      derived_from:
        - "effective permission: Microsoft.DataFactory/factories/triggers/start/action"
      false_positive_note: >-
        CanStart is not escalation by itself; it completes CONDITIONAL(trigger_exists)
        edges (e.g., a pipeline has been modified but the trigger was Stopped). Combined
        with CanModifyCode(pipelines/write), CanStart upgrades the CanExecuteAs from
        CONDITIONAL to ACTIVE. Do not derive CanModifyCode from this action alone.
      narrative: >-
        {principal.name} can start a Stopped ADF trigger (triggers/start/action),
        realizing pipeline execution paths that were CONDITIONAL(trigger_exists).

  # ===========================================================================
  # 14. Identity attachment — user-assigned MI to factory (Azure PassRole analog)
  # ===========================================================================

  - id: azure-adf-attach-user-mi
    emits: CanAttachIdentity
    description: "Attach a user-assigned managed identity to a Data Factory (factories/write + assign/action on the MI), binding a higher-privilege identity to the factory's pipeline runs."
    match:
      - [ ?principal, CanPassIdentity, ?userMI ]
    where:
      - "?principal has EFFECTIVE Microsoft.ManagedIdentity/userAssignedIdentities/assign/action on ?userMI"
      - "?principal has EFFECTIVE Microsoft.DataFactory/factories/write on the target factory"
    emit:
      source_type: Identity
      target_type: AnalyticsService
      source: "<principal>"
      target: "<Data Factory (AnalyticsService node)>"
      permissions:
        - "Microsoft.ManagedIdentity/userAssignedIdentities/assign/action"
        - "Microsoft.DataFactory/factories/write"
      conditions: [role_compatibility]
      state_logic: >-
        ACTIVE when BOTH permissions are confirmed at their respective scopes and
        role_compatible(?userMI, ?factory) holds. POTENTIAL(role_compatibility) when
        the assign/action scope excludes the target MI. BLOCKED if a deny assignment
        covers either action.
      confidence: 0.95
      derived_from:
        - "<CanPassIdentity edge: ?principal -> ?userMI>"
      false_positive_note: >-
        BOTH permissions are required: assign/action on the specific user-assigned MI
        AND factories/write on the target factory. Neither alone attaches the MI.
        Honor the assign/action resource scope — a scope limited to a different MI
        does not qualify. Once attached, the factory's pipelines execute as the new
        MI; can-execute-as execute-as-via-config-identity-swap collapses
        CanModifyConfiguration(?p, ?factory) + CanPassIdentity(?p, ?mi) =>
        CanExecuteAs(?p, ?mi) — cite, do not re-derive here. System-assigned MI
        is enabled via factories/write alone but the new SP has no RBAC grants by
        default — no immediate privilege gain without a subsequent role assignment.
      narrative: >-
        {principal.name} can attach user-assigned managed identity {userMI.name} to
        Data Factory {target.name} (assign/action + factories/write), binding a
        higher-privilege identity to all pipeline runs in the factory.

  # ===========================================================================
  # 15. MI token retrieval — factory pipeline runs
  # ===========================================================================

  - id: azure-adf-pipeline-retrieve-mi-token
    emits: CanRetrieveToken
    description: "Custom activities in ADF pipelines (running on Batch pools) can request a bearer token for the factory MI via the Azure IMDS endpoint."
    match:
      - [ ?batchjob, ExecutesAs, ?mi ]
    where:
      - "node_type(?batchjob) == BatchJob"
      - "?batchjob is a Custom activity execution context (Batch pool node) within an ADF factory"
      - "?batchjob is part of a pipeline that runs the Custom activity"
    emit:
      source_type: Compute
      target_type: Identity
      source: "<Custom activity execution context (BatchJob/Batch pool node, Compute class)>"
      target: "<managed identity bound to the factory>"
      permissions: []
      conditions: []
      state_logic: >-
        ACTIVE when the factory has a managed identity (identity.type != None).
        A Custom activity in the pipeline executes on an Azure Batch pool (Compute class);
        from that pool node, the activity code can call the Azure IMDS endpoint
        (169.254.169.254) to obtain the factory MI bearer token. Not emitted when
        the factory has no MI. Web activities use an internal ADF MSI relay and are
        tracked via a separate derivation (cited in CanExecuteAs paths).
      confidence: 0.88
      derived_from:
        - "<ExecutesAs edge: ?batchjob -> ?mi>"
      false_positive_note: >-
        Only Custom activity execution (Batch pool, Compute class) emits this edge.
        Web activities use an internal ADF MSI token relay (not IMDS) and are handled
        via CanExecuteAs derivations. The source must be Compute (BatchJob) to conform
        to CanRetrieveToken's schema. This edge is the fact that Custom activity code
        running AS the pipeline's MI can mint the factory MI's token — it becomes an
        attack step when combined with CanModifyCode (Custom activity definition modification)
        or CanInvoke (triggering a pipeline containing the Custom activity).
      narrative: >-
        Custom activity code running in ADF factory pipeline can request a bearer
        token for managed identity {mi.name} via IMDS (169.254.169.254), enabling
        authenticated calls to any Azure service the MI is authorized to access.

  # ===========================================================================
  # 16. Copy activity data exfiltration
  # ===========================================================================

  - id: azure-adf-copy-exfiltrate
    emits: CanExfiltrate
    description: "ADF Copy activity configured with an external or cross-boundary sink (HTTP, public blob, SFTP) can move data outside the authorized boundary."
    match:
      - [ ?principal, CanInvoke, ?pipeline ]
      - [ ?pipeline, ExecutesAs, ?mi ]
    where:
      - "node_type(?pipeline) == Workflow"
      - "?pipeline contains a Copy activity with sink.type targeting an external or cross-boundary storage (HttpSink, BlobSink referencing a non-private storage account, AzureDataLakeSinkV2 with public endpoint, SftpWriteSink, or similar external sink)"
      - "the factory MI (or the linked service credential for the sink) has confirmed write access to the sink"
    emit:
      source_type: Identity
      target_type: Data
      source: "<principal>"
      target: "<data source (Data / ObjectStorage / DataLake node) read by the Copy activity>"
      permissions:
        - "Microsoft.DataFactory/factories/pipelines/createRun/action"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when: (a) the pipeline Copy activity is configured with an external
        sink, (b) the factory MI or linked service credential has confirmed write
        access to the sink, and (c) the principal can trigger the pipeline
        (createRun/action or a Schedule trigger). CONDITIONAL(iam_permission) when
        sink write access is unconfirmed. BLOCKED if a deny assignment covers
        createRun/action or if the managed VNet + approved-only private endpoints
        prevent outbound traffic to the sink.
      confidence: 0.85
      derived_from:
        - "<CanInvoke edge: ?principal -> ?pipeline>"
        - "<ExecutesAs edge: ?pipeline -> ?mi>"
        - "<Copy activity sink configuration: external / cross-boundary sink>"
      false_positive_note: >-
        Exfiltration requires BOTH the Copy activity to be configured with a
        cross-boundary or external sink AND the factory MI (or linked service) to
        have confirmed write access to the sink. A Copy activity whose sink is a
        private storage account in the same subscription is NOT exfiltration —
        scope strictly to external or cross-boundary sinks. The principal who
        triggers the pipeline is the attacker-controlled identity; the data at
        risk is what the Copy source reads (determined by the source linked service).
        If the factory uses managed VNet with approved-only private endpoints,
        outbound traffic to arbitrary external sinks is BLOCKED (managed virtual
        network outbound rules restrict egress to approved services only).
      narrative: >-
        {principal.name} can trigger ADF pipeline {pipeline.name}, which contains
        a Copy activity that reads from {target.name} and writes to an external sink
        (HTTP / public blob / SFTP); triggering this pipeline exfiltrates the data
        source contents to outside the authorized boundary.

  # ===========================================================================
  # 17. Storage Events / Custom Events trigger — external trigger binding
  # ===========================================================================

  - id: azure-adf-storage-event-trigger-binding
    emits: CanTrigger
    description: "An ADF Storage Events or Custom Events trigger binds a storage/Event Grid source to a pipeline; writing to that source drives the pipeline run."
    match:
      - [ ?source, CanWriteData, ?storage ]
    where:
      - "?storage is a Storage/EventBus node that is bound as the trigger source of an ADF pipeline via a StorageEventsTrigger or CustomEventsTrigger"
    emit:
      source_type: Identity
      target_type: Workflow
      source: "<principal with CanWriteData on the trigger source storage/event bus>"
      target: "<ADF pipeline triggered by the storage/event source>"
      permissions: []
      conditions: [trigger_exists, service_state]
      state_logic: >-
        ACTIVE when the ADF trigger is Enabled AND the principal can write to the
        trigger source (blob create/delete for StorageEventsTrigger, event publish
        for CustomEventsTrigger). CONDITIONAL(service_state) when the trigger is
        Stopped. CONDITIONAL(trigger_exists) when the trigger configuration is
        unconfirmed. cicd-chains cicd-trigger-runner-executes-as and messaging-chains
        messaging-trigger-executes-as own the CanTrigger + ExecutesAs collapse;
        cite, do not re-derive CanExecuteAs here.
      confidence: 0.82
      derived_from:
        - "<CanWriteData edge: ?principal -> ?storage>"
        - "<CanTrigger edge: ?storage -> ?pipeline (from explicit azure-adf-trigger-event-source-binding)>"
      false_positive_note: >-
        StorageEventsTrigger is activated by Azure Event Grid blob events (create,
        delete) on the specified container — only principals who can create/delete
        blobs in that container drive the trigger. CustomEventsTrigger is activated
        by Event Grid custom events matching a filter — only principals who can
        publish matching events drive it. A write to a different container or
        topic does NOT activate the trigger. Confirm the trigger is Enabled (not
        Stopped) before emitting ACTIVE. The CanExecuteAs collapse is owned by
        cicd-chains and messaging-chains; do not re-derive.
      narrative: >-
        {principal.name} can write to storage/event source {storage.name}, which is
        bound as the trigger source for ADF pipeline {target.name}; writing to it
        fires the pipeline and runs it as the factory MI.

  # ===========================================================================
  # 18. Factory publicly reachable (data-plane endpoint exposed)
  # ===========================================================================

  - id: azure-adf-dataplane-exposed
    emits: ExposedToInternet
    description: "An ADF factory with publicNetworkAccess=Enabled exposes its REST data-plane endpoint (adfstudio.azure.com + management.azure.com) to the internet."
    match:
      - [ ?factory, ExecutesAs, ?mi ]
    where:
      - "node_type(?factory) in [AnalyticsService, Workflow]"
      - "?factory.publicNetworkAccess == Enabled (the default) OR publicNetworkAccess is absent"
      - "no private-endpoint-only network policy restricts the factory REST API"
    emit:
      source_type: Data
      target_type: AnonymousIdentity
      source: "<Data Factory>"
      target: "<AnonymousIdentity>"
      permissions: []
      conditions: [network_reachability]
      state_logic: >-
        CONDITIONAL(network_reachability): the factory REST API is publicly reachable
        but still requires valid Entra credentials or a data-plane access token —
        not unauthenticated. Emit CONDITIONAL(network_reachability) for public factories.
        BLOCKED if publicNetworkAccess=Disabled (private-endpoint-only mode), which
        forces all API traffic through the factory's private endpoint.
      confidence: 0.75
      derived_from:
        - "<ExecutesAs edge: ?factory -> ?mi>"
        - "factory.publicNetworkAccess == Enabled or absent"
      false_positive_note: >-
        Public reachability of the ADF REST endpoint is NOT unauthenticated — all
        API calls require valid Entra auth (ARM or ADF data-plane token). Emit only
        CONDITIONAL(network_reachability) to flag the internet-reachable surface;
        combine with a CanReadSecret(data-plane token) or CanInvoke(createRun) for
        an actionable attack path. Do NOT emit ACTIVE (AnonymousIdentity cannot
        directly call ADF APIs). When publicNetworkAccess=Disabled, emit BLOCKED.
      narrative: >-
        Data Factory {factory.name} exposes its REST API on a public endpoint
        (publicNetworkAccess=Enabled); an actor with valid credentials can reach
        the factory from the internet to invoke pipeline runs or read linked services.

  # ===========================================================================
  # DERIVED ESCALATION (CanExecuteAs) — CITED, NOT RE-DERIVED
  # ===========================================================================
  # The following CanExecuteAs derivations are owned by the linchpins and
  # produced automatically from the facts above. DO NOT re-derive here.
  #
  # (A) Pipeline definition modification + MI + trigger:
  #   azure-adf-pipeline-write-modifycode -> CanModifyCode(?p, ?pipeline)
  #   + ExecutesAs(?pipeline, ?mi)  [explicit: azure-adf-executes-as-mi]
  #   => can-execute-as execute-as-via-code-modify:
  #      CanExecuteAs(?p, ?mi) ACTIVE (if trigger) or CONDITIONAL(trigger_exists)
  #   ALSO: cicd-chains cicd-modify-buildspec-executes-as (CI/CD framing, same collapse)
  #
  # (B) Direct invoke (createRun) + MI:
  #   azure-adf-createrun-invoke -> CanInvoke(?p, ?pipeline)
  #   + ExecutesAs(?pipeline, ?mi)  [explicit]
  #   => can-execute-as execute-as-via-code-modify (trigger optional[0] met):
  #      CanExecuteAs(?p, ?mi) ACTIVE
  #
  # (C) Storage Events trigger + MI:
  #   azure-adf-storage-event-trigger-binding -> CanTrigger(?p, ?pipeline)
  #   + ExecutesAs(?pipeline, ?mi)  [explicit]
  #   => cicd-chains cicd-trigger-runner-executes-as:
  #      CanExecuteAs(?p, ?mi) CONDITIONAL(attacker_influenced_definition)
  #
  # (D) Attach user-assigned MI + modify config:
  #   azure-adf-attach-user-mi -> CanPassIdentity(?p, ?userMI) + factories/write
  #   + CanModifyConfiguration(?p, ?factory)
  #   => can-execute-as execute-as-via-config-identity-swap:
  #      CanExecuteAs(?p, ?userMI) ACTIVE
  #   ALSO: CanCreateWorkloadAs(?p, ?userMI)
  #   => can-execute-as execute-as-via-new-workload: CanExecuteAs(?p, ?userMI) ACTIVE
  #
  # (E) Linked service credential read -> credential chain:
  #   azure-adf-linkedservice-read-secret -> CanReadSecret(?p, ?cred)
  #   + CredentialsFor(?cred, ?id)  [from ContainsSecret explicit rule]
  #   => credential-chains read-secret-yields-identity:
  #      CanImpersonate(?p, ?id) if ?id is ServiceAccount/ManagedIdentity/ApplicationIdentity
  #
  # These are NOT re-derived in this file. The service FACTS (CanModifyCode,
  # CanTrigger, CanInvoke, CanSchedule, ExecutesAs, CanReadSecret, ExposesCredential)
  # are emitted above; the linchpins own the collapse.
  # ===========================================================================

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - Deny assignment covering Microsoft.DataFactory/factories/pipelines/write ->
#    BLOCKED on azure-adf-pipeline-write-modifycode / azure-adf-contributor.
#  - Deny assignment covering Microsoft.DataFactory/factories/linkedservices/read ->
#    BLOCKED on azure-adf-linkedservice-read-secret.
#  - publicNetworkAccess=Disabled -> BLOCKED on azure-adf-dataplane-exposed.
#  - Factory managed VNet with approved-only private endpoints ->
#    Copy activity to external sinks is BLOCKED (azure-adf-copy-exfiltrate).
#  - Trigger in Stopped state -> CONDITIONAL(service_state); realize with
#    azure-adf-trigger-start (triggers/start/action).
#  - Data Factory Contributor role: DOES NOT include createRun/action ->
#    azure-adf-createrun-invoke is NOT emitted for Data Factory Contributor.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Explicit normalization rules (raw config -> explicit edges).
# These belong in /rules/explicit/azure-datafactory.yaml; noted here for
# completeness. They emit ExecutesAs / ContainsSecret / CanTrigger facts
# consumed by the derived rules above.
# ---------------------------------------------------------------------------
explicit_rules:

  - id: azure-adf-executes-as-mi
    emits: ExecutesAs
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.DataFactory/factories"
      field: "identity"
    where:
      - "identity.type in [SystemAssigned, UserAssigned, 'SystemAssigned, UserAssigned']"
    emit:
      source_type: Compute
      target_type: Identity
      source: "<ADF pipeline (Workflow node scoped to factory)>"
      target: "<each MI: system-assigned SP (identity.principalId) and every userAssignedIdentities key>"
      api_source: "az rest --method GET --url .../providers/Microsoft.DataFactory/factories/<name>"
      evidence_field: "identity.principalId / identity.userAssignedIdentities"
      narrative: "ADF factory {factory.name} pipelines run as managed identity {mi.name}."

  - id: azure-adf-linkedservice-contains-cred
    emits: ContainsSecret
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.DataFactory/factories/linkedservices"
      field: "properties.typeProperties"
    where:
      - "typeProperties contains a field matching (connectionString, accountKey, clientSecret, password, sasUri, accessToken, servicePrincipalKey) with a non-KV-reference string value"
    emit:
      source_type: Data
      target_type: Secret
      source: "<linked service (ConnectionString node)>"
      target: "<Credential / AccessKey / Secret node for the embedded material>"
      api_source: "az rest --method GET --url .../providers/Microsoft.DataFactory/factories/<name>/linkedservices"
      evidence_field: "properties.typeProperties.*"
      narrative: "Linked service {ls.name} contains inline credential material ({field}) for {ls.type} connection."

  - id: azure-adf-trigger-event-source-binding
    emits: CanTrigger
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.DataFactory/factories/triggers"
      field: "properties"
    where:
      - "trigger.properties.type in [StorageEventsTrigger, CustomEventsTrigger, BlobEventsTrigger]"
      - "trigger references a storage account / Event Grid source via properties.typeProperties.scope"
    emit:
      source_type: Storage
      target_type: Workflow
      source: "<Storage account / Event Grid topic referenced by the trigger>"
      target: "<ADF pipeline bound to this trigger>"
      api_source: "az rest --method GET --url .../providers/Microsoft.DataFactory/factories/<name>/triggers"
      evidence_field: "properties.typeProperties.scope / properties.typeProperties.blobPathBeginsWith"
      narrative: "{source.name} triggers ADF pipeline {pipeline.name} via a {trigger.type} event binding."

  - id: azure-adf-schedule-trigger-binding
    emits: CanTrigger
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.DataFactory/factories/triggers"
      field: "properties"
    where:
      - "trigger.properties.type in [ScheduleTrigger, TumblingWindowTrigger]"
      - "trigger.properties.runtimeState == Started"
    emit:
      source_type: Scheduler
      target_type: Workflow
      source: "<ADF Schedule / TumblingWindow trigger (Scheduler node)>"
      target: "<ADF pipeline bound to this trigger>"
      api_source: "az rest --method GET --url .../providers/Microsoft.DataFactory/factories/<name>/triggers"
      evidence_field: "properties.pipelines[*].pipelineReference.referenceName"
      narrative: "Schedule trigger {trigger.name} fires pipeline {pipeline.name} autonomously on its recurrence cadence."
