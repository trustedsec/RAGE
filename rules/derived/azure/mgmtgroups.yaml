# Azure Management Groups — Derived attack-path rules (Phase 3 — administrative hierarchy & guardrails)
# ---------------------------------------------------------------------------
# Supplies THE AZURE HIERARCHY BACKBONE. Management group nodes and their
# Contains edges (MG -> child MG / subscription) are normalized in
# /rules/explicit/azure-mgmtgroups.yaml. These derived rules turn boundary-scoped
# ARM RBAC + Microsoft.Management operations into the boundary-scoped grants /
# controls / config-modification / guardrail-modification capabilities AT THE MG
# SCOPE they are assigned.
#
# ANTI-DUPLICATION — this file emits ONLY the MG-scoped capability; it DEFERS:
#   * generic parent->child descent + CanEnter* roll-ups   -> hierarchy-chains.yaml
#       (admin-inherits-down-contains, grant-at-boundary-controls-descendants,
#        enter-boundary-rollups)
#   * CanAdminister/CanGrantPermission@boundary -> Controls -> hierarchy-chains.yaml
#       via can-control.yaml (control-via-admin, control-boundary-via-iam-admin)
#   * guardrail BLOCKED->ACTIVE upgrade -> hierarchy-chains.yaml
#       (guardrail-removal-upgrades-blocked)
#   * generic Azure RBAC roleAssignments/write -> CanGrantPermission and Entra
#     directory-role self-grant -> already in azure/identity-escalation.yaml
#     (azure-role-assignment-write, azure-directory-role-assign). The rules here
#     are the MG-scope SPECIALIZATION with the hierarchy narrative; dedupe on
#     (edge, principal, scope).
#
# ROLE CAPABILITY PRECISION (overview doc role table): ONLY Owner and User Access
# Administrator hold Microsoft.Authorization/roleAssignments/write at an MG.
# Contributor and Management Group Contributor CANNOT assign RBAC (they can
# create/rename/move/delete MGs only). Never fire a grant/control rule on
# Contributor. All permission strings are exact Microsoft.Management /
# Microsoft.Authorization operation names.
#
# STATE: ACTIVE when the action is unconditionally held at the scope; CONDITIONAL
# when gated (PIM eligible-not-active, ABAC/IAM condition, or Global-Admin-gated
# elevateAccess); BLOCKED when an MG-scoped deny assignment / deny-effect Azure
# Policy suppresses the action (until guardrail-removal-upgrades-blocked lifts it).
# ---------------------------------------------------------------------------

provider: azure
phase: 3-administrative-hierarchy
applies_to: [azure]

rules:

  # --- Owner @ MG -> admin of the boundary -----------------------------------
  - id: azure-mg-owner-admin
    emits: CanAdminister
    description: "Owner at a management group scope administers that boundary; feeds can-control -> Controls -> subtree descent."
    match:
      - [ ?principal, HasPermission, ?mg ]
    where:
      - "node_type(?mg) == ManagementGroup"
      - "?principal effectively holds the Owner role (or a custom role with Microsoft.Management/managementGroups/* AND Microsoft.Authorization/*) at ?mg scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?mg
      permissions: ["Microsoft.Management/managementGroups/*", "Microsoft.Authorization/*"]
      conditions: [iam_permission, deny_assignment]
      state_logic: >-
        ACTIVE when Owner is unconditionally assigned at ?mg; CONDITIONAL(iam_permission)
        when the assignment is PIM-eligible-not-active or gated by an ABAC condition;
        BLOCKED when an MG-scoped deny assignment suppresses the actions. Feeds
        can-control.yaml control-via-admin -> Controls(?mg), then hierarchy-chains.yaml
        admin-inherits-down-contains descends to every descendant subscription/RG/resource
        (+ CanEnterSubscription per child subscription). Do NOT enumerate descendants here.
      confidence: "min(contributing_confidences)"
      derived_from: [ "<HasPermission principal->mg (Owner @ MG) edge_id>" ]
      false_positive_note: >-
        Only Owner (or a custom role that actually carries both the management-group
        and Microsoft.Authorization/* actions) administers the boundary. Contributor and
        Management Group Contributor CANNOT assign RBAC and are NOT boundary admins for
        escalation — do not emit for them. Reader / MG Reader / Resource Policy Contributor
        grant no control. Custom roles with DataActions cannot be assigned at MG scope, so
        never infer data-plane control here.
      narrative: >-
        {principal.name} holds Owner at management group {mg.name} and administers that
        boundary; control inherits to every subscription and resource nested under it.

  # --- roleAssignments/write @ MG -> boundary-scoped self-grant --------------
  - id: azure-mg-roleassignment-write
    emits: CanGrantPermission
    description: "Ability to assign RBAC at a management group scope (Owner / User Access Administrator) is a boundary-scoped self-grant over the whole subtree."
    match:
      - [ ?principal, HasPermission, ?mg ]
    where:
      - "node_type(?mg) == ManagementGroup"
      - "?principal effectively holds Microsoft.Authorization/roleAssignments/write at ?mg scope (Owner or User Access Administrator, or a custom role granting it)"
    emit:
      source_type: Identity
      target_type: Identity
      # Self-grant shape: CanGrantPermission requires source=[Identity] AND target=[Identity]
      # (edges.yaml). The boundary-scoped nature is carried in scope=?mg (edge metadata),
      # NOT by pointing the edge at the MG node. This is exactly the shape can-control.yaml
      # control-boundary-via-iam-admin consumes: it matches CanGrantPermission(?attacker ->
      # ?principal) and reads scope_of(?attacker, CanGrantPermission) to roll up Controls(?mg).
      source: ?principal
      target: ?principal          # self-grant (principal assigns itself Owner)
      scope: ?mg                  # boundary the grant is scoped to (consumed via scope_of)
      permissions: ["Microsoft.Authorization/roleAssignments/write"]
      conditions: [iam_permission, deny_assignment]
      state_logic: >-
        ACTIVE when roleAssignments/write is unconditionally held at ?mg; CONDITIONAL(iam_permission)
        when PIM-eligible-not-active or condition-gated; BLOCKED when a deny assignment on
        Microsoft.Authorization/roleAssignments/write applies at the scope (until
        guardrail-removal-upgrades-blocked lifts it). This self-grant CanGrantPermission scoped
        at ?mg feeds can-control.yaml control-boundary-via-iam-admin (scope_of -> boundary ->
        Controls(?mg)) and hierarchy-chains.yaml grant-at-boundary-controls-descendants ->
        whole subtree; the descendant CanEnterSubscription roll-ups are produced there, NOT here.
      confidence: "min(contributing_confidences)"
      derived_from: [ "<HasPermission principal->mg (roleAssignments/write @ MG) edge_id>" ]
      false_positive_note: >-
        Microsoft.Authorization/roleAssignments/write is held ONLY by Owner and User Access
        Administrator (per the overview role table) — NOT by Contributor or Management Group
        Contributor. Do not fire on Contributor. Edge is a self-grant (source==target==principal)
        carrying scope=?mg; the boundary-scoped meaning lives in scope, and can-control.yaml
        control-boundary-via-iam-admin turns it into Controls(?mg) — never point
        CanGrantPermission at the MG boundary node (schema target=[Identity] only). A grant
        scoped to a single distinct principal/resource is the generic identity-escalation
        primitive (azure/identity-escalation.yaml azure-role-assignment-write); this rule is the
        MG-scope specialization — dedupe on (CanGrantPermission, principal, MG scope).
      narrative: >-
        {principal.name} can assign roles at management group {mg.name}
        (Microsoft.Authorization/roleAssignments/write via Owner / User Access Administrator)
        and can therefore grant itself Owner of {mg.name} and everything nested beneath it.

  # --- managementGroups/write (+subscriptions/write) -> reparent lever -------
  - id: azure-mg-reparent
    emits: CanModifyConfiguration
    description: "Management-group write lets a principal reparent a subscription / child MG (move it into or out of an MG), altering which RBAC and guardrails it inherits."
    match:
      - [ ?principal, HasPermission, ?mg ]
    where:
      - "node_type(?mg) == ManagementGroup"
      - "?principal effectively holds Microsoft.Management/managementGroups/write at the relevant scopes (child + target parent + current parent; root MG is exempt per docs)"
    optional:
      - [ ?principal, HasPermission, ?child_sub ]   # subscriptions/write on the moved subscription
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?mg
      permissions:
        - "Microsoft.Management/managementGroups/write"
        - "Microsoft.Management/managementGroups/subscriptions/write"
        - "Microsoft.Authorization/roleAssignments/write"
        - "Microsoft.Authorization/roleAssignments/delete"
        - "Microsoft.Management/register/action"
      conditions: [iam_permission, deny_assignment]
      state_logic: >-
        ACTIVE only when the full move permission set is held at ALL required scopes
        (child being moved: managementGroups/write + subscriptions/write [subs only] +
        roleAssignments/write + roleAssignments/delete + register/action; target parent
        AND current parent: managementGroups/write) — root MG is exempt (default landing
        spot). CONDITIONAL(iam_permission) when only a subset is proven; BLOCKED under an
        applicable deny assignment. This is the move-OUT/into lever that feeds
        hierarchy-chains.yaml guardrail-removal-upgrades-blocked (escape-guardrail path).
      confidence: "min(contributing_confidences)"
      derived_from: [ "<HasPermission principal->mg (managementGroups/write) edge_id>", "<HasPermission subscriptions/write edge_id?>" ]
      false_positive_note: >-
        Reparenting needs write on THREE scopes (child, target parent, current parent),
        with the root-MG exception; a single-scope managementGroups/write is NOT enough to
        complete a move — downgrade to CONDITIONAL. Contributor / Management Group Contributor
        DO hold managementGroups/write (they can move), so this rule MAY fire on them — but it
        emits only the config-modification lever, NOT a grant/control edge. Moving a
        subscription where Owner is inherited from the current MG restricts targets to MGs
        where the principal is also Owner (else ownership is lost) — respect that when scoring.
      narrative: >-
        {principal.name} can reparent subscriptions / child management groups under
        {mg.name} (Microsoft.Management/managementGroups/write), changing which RBAC and
        policy guardrails they inherit.

  # --- Move a subscription UNDER a controlled MG -> take it over --------------
  - id: azure-mg-move-sub-into-controlled-mg
    emits: CanTakeOwnership
    description: "Moving a subscription under a management group where the attacker is Owner makes the attacker's MG-scoped RBAC inherit down and take over the subscription."
    match:
      - [ ?principal, CanAdminister, ?mg ]            # attacker is Owner of ?mg (rule azure-mg-owner-admin)
      - [ ?principal, CanModifyConfiguration, ?mg ]   # attacker can reparent into ?mg (rule azure-mg-reparent)
    where:
      - "node_type(?mg) == ManagementGroup"
      - "?principal effectively holds Microsoft.Management/managementGroups/subscriptions/write on the target subscription and managementGroups/write on ?mg (target parent)"
      - "?target_sub is a Subscription movable under ?mg (attacker has the required move perms on it and its current parent)"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: "?target_sub  (the moved Subscription)"
      permissions:
        - "Microsoft.Management/managementGroups/subscriptions/write"
        - "Microsoft.Management/managementGroups/write"
        - "Microsoft.Authorization/roleAssignments/write"
      conditions: [iam_permission]
      state_logic: >-
        CONDITIONAL(iam_permission) by default — realizable only once the attacker actually
        holds the move permissions on the target subscription AND its current parent (a
        two-step action). ACTIVE only when all move permissions on the subscription and both
        parents are confirmed. Once the sub is under ?mg, the attacker's Owner @ ?mg inherits
        (hierarchy-chains admin-inherits-down-contains) -> Controls(?target_sub) +
        CanEnterSubscription(?target_sub); this rule emits only the takeover PRIMITIVE, not
        the descent.
      confidence: "min(contributing_confidences) * 0.9"
      derived_from: [ "<CanAdminister principal->mg edge_id>", "<CanModifyConfiguration principal->mg edge_id>" ]
      false_positive_note: >-
        Requires BOTH Owner on the destination MG AND the full move permission set on the
        target subscription and its current parent MG. Moving a subscription does NOT by
        itself grant control unless the attacker actually controls the destination MG (Owner,
        not merely Contributor). If the destination MG control is CONDITIONAL/BLOCKED, this
        takeover inherits that. Do not emit when the attacker only has managementGroups/write
        without Owner on the destination.
      narrative: >-
        {principal.name} can move subscription {target_sub.name} under management group
        {mg.name}, where it is Owner; the Owner assignment then inherits down and
        {principal.name} takes control of {target_sub.name}.

  # --- policyAssignments/write @ MG -> modify a deny guardrail ----------------
  - id: azure-mg-modify-policy-guardrail
    emits: CanModifyPolicy
    description: "Ability to write Azure Policy assignments/definitions at a management group scope lets a principal weaken or remove a deny-effect guardrail inherited by the subtree."
    match:
      - [ ?principal, HasPermission, ?mg ]
      - [ ?mg,        HasPolicy,     ?guardrail ]
    where:
      - "node_type(?mg) == ManagementGroup"
      - "node_class(?guardrail) == Policy"
      # policyAssignments/write writes Azure POLICY assignments only. Azure deny assignments
      # are modeled as the ConditionalPolicy subtype and are NOT written by this permission —
      # so this rule fires only over the OrganizationPolicy (Azure Policy assignment) node.
      # ConditionalPolicy deny-assignment removal is the indirect blueprint/managed-app-delete
      # or reparent path (see false_positive_note), NOT policyAssignments/write.
      - "node_type(?guardrail) == OrganizationPolicy  # Azure Policy assignment at MG (deny-effect)"
      - "?principal effectively holds Microsoft.Authorization/policyAssignments/write (and/or policyDefinitions/write) at ?mg (Owner or Resource Policy Contributor)"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?principal
      target: ?guardrail
      permissions:
        - "Microsoft.Authorization/policyAssignments/write"
        - "Microsoft.Authorization/policyDefinitions/write"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE for the modify capability when policyAssignments/write is held at ?mg;
        CONDITIONAL(iam_permission) when gated. This edge is the INPUT to hierarchy-chains.yaml
        guardrail-removal-upgrades-blocked, which re-emits every edge THIS guardrail was
        suppressing (BLOCKED) at its underlying state as CONDITIONAL(guardrail_removed).
        Emitting CanModifyPolicy here does NOT itself upgrade any edge.
      confidence: "min(contributing_confidences)"
      derived_from: [ "<HasPermission principal->mg (policyAssignments/write) edge_id>", "<HasPolicy mg->guardrail edge_id>" ]
      false_positive_note: >-
        Applies to Azure POLICY assignments only (OrganizationPolicy node; Owner / Resource
        Policy Contributor can write them via policyAssignments/write). Azure DENY ASSIGNMENTS
        are modeled as the ConditionalPolicy subtype and are NOT written by policyAssignments/write
        — so this rule intentionally does NOT target ConditionalPolicy nodes (emitting
        CanModifyPolicy over a deny-assignment node under policyAssignments/write would be a
        permission/target mismatch). Deny assignments at MG scope are almost always
        system-managed (Blueprints / Managed Apps) and NOT directly user-writable; their
        realistic removal is deleting the owning blueprint/managed-app assignment or the
        move-out reparent (azure-mg-reparent), which the hierarchy-chains guardrail-removal
        upgrade should key off — mark CONDITIONAL when only that indirect route exists. Only
        fire when ?guardrail actually has a deny/deny-inheriting effect that suppresses edges;
        an audit-only policy blocks nothing.
      narrative: >-
        {principal.name} can modify the Azure Policy guardrail {guardrail.name} at management
        group {mg.name} (Microsoft.Authorization/policyAssignments/write), lifting the deny it
        imposes on the subtree.

  # --- Global Admin elevateAccess -> root MG control (tenant takeover) --------
  - id: azure-mg-elevate-access-root
    emits: [CanGrantPermission, Controls]
    description: "A Microsoft Entra Global Administrator can call elevateAccess to gain User Access Administrator at root scope (/), controlling the root management group and thus every subscription in the tenant."
    match:
      # Bind the GA principal via the real directory-role membership edge, and bind the root
      # MG via the real structural Contains edge emitted by explicit azure-mg-root-tenant-link
      # (?tenant Contains ?root_mg). Do NOT fabricate a [?root_mg, HasPermission, ?tenant]
      # edge — HasPermission has source=[Identity], and a ManagementGroup is not an Identity,
      # so that clause could never match at runtime.
      - [ ?principal, MemberOf, ?ga_role ]
      - [ ?tenant,    Contains, ?root_mg ]     # structural root-MG link (tenant -> root MG)
    where:
      - "?ga_role is the Microsoft Entra directory role 'Global Administrator'"
      - "node_type(?tenant) == Tenant"
      - "node_type(?root_mg) == ManagementGroup and is_root_management_group(?root_mg)  # root MG ID == Entra tenant ID"
    # Two distinct edges from this rule; each targets a node in ITS declared target set:
    #   (1) Controls(?principal -> ?root_mg)      — target=[AdministrativeBoundary,*] OK
    #   (2) CanGrantPermission(?principal -> ?principal) scoped at root '/' (self-grant)
    #       — target=[Identity] only, so the edge is a self-grant carrying scope, NOT the MG.
    # Never point CanGrantPermission at the ?root_mg boundary node. Emit is a list of two
    # self-contained edge blocks (the shared narrative/state/perms are repeated per edge).
    emit:
      - edge: Controls
        source: ?principal
        target: ?root_mg
        permissions:
          - "Microsoft.Authorization/elevateAccess/action"
          - "Microsoft.Authorization/roleAssignments/write"
        conditions: [iam_permission]
        state_logic: >-
          CONDITIONAL(iam_permission) — gated on the principal ACTIVELY holding the Global
          Administrator directory role (if PIM-eligible-not-active, the principal must first
          activate) AND performing the elevateAccess action
          (POST /providers/Microsoft.Authorization/elevateAccess?api-version=2016-07-01),
          which assigns User Access Administrator at root scope '/'. Once elevated, the
          capability is ACTIVE tenant-wide. Controls(?principal -> ?root_mg) feeds
          hierarchy-chains.yaml admin-inherits-down-contains to reach EVERY subscription
          (CanEnterSubscription each) and CanEnterTenant. Do NOT enumerate the subscriptions here.
        confidence: "min(contributing_confidences)"
        derived_from: [ "<MemberOf principal->Global Administrator edge_id>", "<Contains tenant->root_mg edge_id (azure-mg-root-tenant-link)>" ]
      - edge: CanGrantPermission
        source: ?principal
        target: ?principal          # self-grant (assign self Owner anywhere)
        scope: "/"                  # root scope; consumed via scope_of by control-boundary-via-iam-admin
        permissions:
          - "Microsoft.Authorization/elevateAccess/action"
          - "Microsoft.Authorization/roleAssignments/write"
        conditions: [iam_permission]
        state_logic: >-
          CONDITIONAL(iam_permission) — same gating as the Controls edge (hold/activate Global
          Administrator, then call elevateAccess). Once elevated to User Access Administrator at
          root scope '/', the self-grant is ACTIVE tenant-wide; can-control.yaml
          control-boundary-via-iam-admin reads scope_of == '/' (a boundary) and rolls this up to
          Controls(root MG) — deduped against the Controls edge above on (Controls, principal,
          root MG / tenant).
        confidence: "min(contributing_confidences)"
        derived_from: [ "<MemberOf principal->Global Administrator edge_id>", "<Contains tenant->root_mg edge_id (azure-mg-root-tenant-link)>" ]
    # Shared metadata for BOTH emitted edges above:
    false_positive_note: >-
      Fire ONLY for principals that hold the Microsoft Entra GLOBAL ADMINISTRATOR directory
      role — no other role can call elevateAccess (it is directory-role-gated, not an ARM
      permission a subscription/MG Owner can obtain). Emit at ROOT scope '/' only; do not
      attribute root control to a non-root MG Owner. Keep CONDITIONAL(iam_permission): this
      is a deliberate two-step action (hold/activate GA, then call elevateAccess), not an
      ambient path — path scoring must reflect the extra step. The self-grant
      CanGrantPermission carries scope '/' (source==target==principal); it is NOT pointed at
      the root MG boundary (schema target=[Identity]). Overlaps
      azure/identity-escalation.yaml azure-directory-role-assign (directory-role self-grant
      reaching tenant control); this rule is the RESOURCE-plane elevateAccess route to the
      root MG — dedupe on (Controls, principal, root MG / tenant).
    narrative: >-
      {principal.name} is a Global Administrator and can call elevateAccess to obtain User
      Access Administrator at root scope '/', controlling the root management group and thus
      every subscription in the tenant — a tenant-wide takeover.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - An MG-scoped deny assignment (or deny-effect Azure Policy) on
#    Microsoft.Authorization/roleAssignments/write, Microsoft.Management/managementGroups/write,
#    or the specific resource actions -> emit the affected edge as BLOCKED with
#    denied_by=<guardrail node>. hierarchy-chains.yaml guardrail-removal-upgrades-blocked
#    upgrades it to CONDITIONAL(guardrail_removed) IF the principal can modify the guardrail
#    (azure-mg-modify-policy-guardrail) OR reparent the resource out of scope (azure-mg-reparent).
#  - Most MG deny assignments are system-managed and not directly writable — prefer the
#    move-out path and keep the upgrade CONDITIONAL.
#
# DEFERRED (cited, not duplicated):
#  - Parent->child descent + CanEnterSubscription/CanEnterTenant roll-ups:
#    hierarchy-chains.yaml (admin-inherits-down-contains, grant-at-boundary-controls-descendants,
#    enter-boundary-rollups).
#  - CanAdminister/CanGrantPermission@boundary -> Controls: can-control.yaml
#    (control-via-admin, control-boundary-via-iam-admin).
#  - Generic Azure RBAC roleAssignments/write -> CanGrantPermission and Entra directory-role
#    self-grant: azure/identity-escalation.yaml (azure-role-assignment-write,
#    azure-directory-role-assign).
# ---------------------------------------------------------------------------
