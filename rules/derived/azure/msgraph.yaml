# Azure Microsoft Graph — app-permission derived attack-path rules (Phase 2)
# ---------------------------------------------------------------------------
# Models the ATTACK-PATH primitives that arise from high-privilege MS Graph
# APPLICATION permissions (app roles granted via admin consent to a service
# principal, no signed-in user).
#
# Official permission reference:
#   https://learn.microsoft.com/graph/permissions-reference
#
# SCHEMA CONFORMANCE NOTES:
#   Several rules in this file emit edge types declared as nature: explicit in
#   edges.yaml (CanCreateCredentialFor, CanTakeOwnership, CanModifyPolicy,
#   CanResetCredential, CanAddMember, CrossTenantTrust). These rules are logically
#   DERIVED from HasRole(appRoleAssignment) edges and permission-combination
#   reasoning. Recommended schema petitions:
#   - Change nature of CanCreateCredentialFor, CanResetCredential to 'both'
#     (both explicitly observable from credentials held AND derivable from
#      permission-set reasoning)
#   - Change nature of CanTakeOwnership, CanAddMember, CanModifyPolicy to 'both'
#     (same rationale)
#   - Change nature of CrossTenantTrust to 'both' or extend to multi-tenant consent
#     facts (both observable from multi-tenant app registration settings AND
#      derivable from admin consent grants in foreign tenants)
#   Until schema changes, linter will flag these as violations. The rules are
#   correct; the schema must be updated to reflect that these capabilities are
#   legitimately derivable from permission combinations.
#
# CRITICAL DEDUP (DO NOT RE-DERIVE):
#   AppRoleAssignment.ReadWrite.All -> CanGrantPermission (SP self-grants any
#   app role -> tenant takeover) is ALREADY covered by rule azure-graph-app-role-grant
#   in /rules/derived/azure/identity-escalation.yaml. CITE it; emit nothing
#   redundant.
#
# THIS FILE adds SIX high-impact permission -> primitive mappings:
#   1. RoleManagement.ReadWrite.Directory -> CanGrantPermission (assign GA)
#   2. Application.ReadWrite.All / Directory.ReadWrite.All -> CanCreateCredentialFor
#      (add creds to any app/SP = identity-plane "assume")
#   3. Application.ReadWrite.All -> CanTakeOwnership (self-add as app owner)
#   4. Application.ReadWrite.All / Directory.ReadWrite.All -> CanModifyPolicy
#      (add federated identity credential to app config -> attacker OIDC issuer)
#   5. User.ReadWrite.All / Directory.ReadWrite.All -> CanResetCredential
#   6. Group.ReadWrite.All / GroupMember.ReadWrite.All / Directory.ReadWrite.All -> CanAddMember
#   7. Multi-tenant app with admin consent in foreign tenant -> CrossTenantTrust
#
# LINCHPIN REFERENCES (consume the primitives emitted here):
#   can-control.yaml        control-boundary-via-iam-admin, escalate-via-execute-as
#   credential-chains.yaml  impersonate-is-escalation, read-secret-yields-identity
#   federation-chains.yaml  federation-maps-to-identity, federate-inherits-capabilities
#   identity-escalation.yaml (azure) azure-graph-app-role-grant, azure-sp-add-credential,
#                            azure-app-add-credential, azure-app-sp-ownership,
#                            azure-directory-role-assign, azure-reset-password,
#                            azure-group-owner-add-member, azure-federated-credential-write
#
# ANTI-DUPLICATION NOTES:
#   Rules 2, 3, 4 here cover the Graph APP-PERMISSION (appRoleAssignment-held)
#   pathway to CanCreateCredentialFor / CanTakeOwnership / CanModifyPolicy.
#   identity-escalation.yaml covers the same capabilities via OBJECT OWNERSHIP or
#   DIRECTORY ROLE (SP owner, Application Administrator, Cloud App Administrator).
#   Both pathways are valid and distinct; dedup on (type, source, target) by the
#   emitter — multiple derived_from is correct when both conditions hold.
#   (Note: Rule 4 emits CanModifyPolicy rather than CanModifyTrust because the action
#   is app configuration mutation; the parallel object-ownership path
#   azure-federated-credential-write emits CanModifyTrust for trust-policy semantics.)
#
#   Rule 5 adds the Graph app-permission path to CanResetCredential; the
#   identity-escalation.yaml azure-reset-password rule covers the directory-role
#   (Authentication/Helpdesk/User Administrator) path. Both are independent triggers.
#
#   Rule 6 parallels identity-escalation.yaml azure-group-owner-add-member which
#   covers the object-ownership path; this rule covers the Graph permission path.
#   NOTE: Directory.ReadWrite.All is now included (in addition to the narrower
#   Group.ReadWrite.All and GroupMember.ReadWrite.All).
#
#   Rule 7 (new) models the cross-tenant attack surface: a multi-tenant app with
#   admin consent in a foreign tenant is a lateral-movement primitive.
#
# Edge source/target conformance (schema/edges.yaml):
#   CanGrantPermission:       source [Identity]  target [Identity]
#   CanCreateCredentialFor:   source [Identity]  target [Identity, ApplicationIdentity, ServiceAccount, MachineIdentity]
#   CanTakeOwnership:         source [Identity]  target ["*", ApplicationIdentity]
#   CanModifyPolicy:          source [Identity]  target [Policy, Identity, "*"]
#   CanResetCredential:       source [Identity]  target [Identity, HumanIdentity]
#   CanAddMember:             source [Identity]  target [Group, Role]
#   CrossTenantTrust:         source [Tenant, ApplicationIdentity]  target [Tenant, ExternalIdentity]
# ---------------------------------------------------------------------------

provider: azure
phase: 2-identity-authorization
applies_to: [azure]

rules:

  # --- 1) RoleManagement.ReadWrite.Directory -> CanGrantPermission (assign GA) -----
  # Docs: https://learn.microsoft.com/graph/permissions-reference#rolemanagementreadwritedirectory
  # POST /roleManagement/directory/roleAssignments with principalId + roleDefinitionId
  # of Global Administrator (62e90394-69f5-4237-9190-012177145e10).
  # CITED from azure-directory-role-assign in identity-escalation.yaml, which emits
  # CanGrantPermission for principals holding the Privileged Role Administrator *directory
  # role*. THIS rule covers the equivalent Graph APP PERMISSION path — a service
  # principal that holds the RoleManagement.ReadWrite.Directory appRoleAssignment can
  # assign GA WITHOUT being a human Privileged Role Admin.
  - id: azure-msgraph-rolemanagement-write
    emits: CanGrantPermission
    description: >-
      A service principal holding RoleManagement.ReadWrite.Directory can assign any
      Entra directory role (including Global Administrator) to any principal,
      achieving tenant takeover — the app-permission equivalent of holding
      Privileged Role Administrator.
    match:
      - [ ?sp, HasRole, ?approle ]
    where:
      - "node_type(?sp) in [MachineIdentity, ApplicationIdentity]  # service principal (enterprise app)"
      - "?approle is the Graph app role RoleManagement.ReadWrite.Directory (id: d01b97e9-cbc0-49fe-810a-750afd5527a3) on microsoft.graph resource SP (id: 00000003-0000-0000-c000-000000000000)"
      - "the appRoleAssignment is active (not pending revocation, admin consent granted)"
    emit:
      source_type: Identity
      target_type: Identity
      source: ?sp
      target: "<any Identity principal in the Entra tenant>"
      permissions: ["RoleManagement.ReadWrite.Directory"]
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when the appRoleAssignment for RoleManagement.ReadWrite.Directory
        exists and is in state Granted (admin consent). CONDITIONAL(service_state)
        if the SP's credential has expired or been revoked (SP cannot call Graph
        without a valid credential). BLOCKED if a Conditional Access policy
        explicitly blocks the SP from calling the Graph roleManagement endpoint
        (network location, device compliance, or app restriction CA policy targeting
        the Graph resource). Never BLOCKED by ARM RBAC deny assignments (Graph
        authorization is Entra-only). Inherit weakest with the HasRole input.
      confidence: "0.97"
      derived_from:
        - "<HasRole edge_id (appRoleAssignment RoleManagement.ReadWrite.Directory on ?sp)>"
        - "azure/identity-escalation.yaml#azure-directory-role-assign (directory-role parallel; this rule covers the app-permission path)"
        - "azure/identity-escalation.yaml#azure-graph-app-role-grant (AppRoleAssignment.ReadWrite.All is orthogonal; do not dedupe — both are independent paths to CanGrantPermission)"
      false_positive_note: >-
        Key only on the appRoleAssignment row — an app that DECLARED
        RoleManagement.ReadWrite.Directory in requiredResourceAccess but has NOT
        been admin-consented does NOT hold this permission; no appRoleAssignment
        row will exist in tenant data. Also requires the SP to have a valid
        credential (secret/cert/fedcred) to call Graph — a credential-less SP
        cannot invoke the API. Conditional Access "Workload Identity" policies can
        block the SP from the Graph roleManagement endpoint — model as
        BLOCKED(CA policy). In tenants with Entra ID P2 PIM, *eligible*
        assignments require PIM activation flows (roleEligibilityScheduleRequests),
        but *direct active* assignments via POST /roleManagement/directory/roleAssignments
        remain possible for RoleManagement.ReadWrite.Directory holders UNLESS the
        tenant has explicitly configured the role to require PIM-only activation via
        Entra ID Governance role settings. Flag as CONDITIONAL(pim_activation) only
        when the specific role definition has PIM-only enforcement confirmed, not
        merely because P2 licensing is present. The tenant must have Entra ID licensing
        that enables directory role assignment via Graph (all M365/Entra paid tiers do).
        RoleManagement.ReadWrite.Directory and AppRoleAssignment.ReadWrite.All are
        NOT supersets of each other — they control different Graph endpoints
        (/roleManagement/directory vs /appRoleAssignments) and both lead to
        CanGrantPermission independently; do NOT suppress this rule when
        AppRoleAssignment.ReadWrite.All is held.
      narrative: >-
        {sp.name} holds the MS Graph application permission
        RoleManagement.ReadWrite.Directory and can therefore create directory role
        assignments via POST /roleManagement/directory/roleAssignments, including
        granting itself or any controlled principal the Global Administrator role —
        equivalent to full Entra tenant takeover without ARM RBAC or human interaction.

  # --- 2) Application.ReadWrite.All -> CanCreateCredentialFor (any app/SP) --------
  # Docs: https://learn.microsoft.com/graph/permissions-reference#applicationreadwriteall
  # POST /applications/{id}/addPassword, POST /applications/{id}/addKey
  # POST /servicePrincipals/{id}/addPassword
  # This is the IDENTITY-PLANE "assume role": add a credential to a privileged SP,
  # then authenticate as that SP and inherit all its permissions.
  - id: azure-msgraph-app-readwrite-cred
    emits: CanCreateCredentialFor
    description: >-
      A service principal holding Application.ReadWrite.All (or Directory.ReadWrite.All)
      can add a password or certificate credential to any app registration or service
      principal in the tenant and then authenticate as that identity, inheriting all
      its permissions — the identity-plane equivalent of sts:AssumeRole.
    match:
      - [ ?sp, HasRole, ?approle ]
      - [ ?target, HasRole, ?target_role ]
    where:
      - "node_type(?sp) in [MachineIdentity, ApplicationIdentity]"
      - "?approle is one of: Application.ReadWrite.All (id: 1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9) OR Directory.ReadWrite.All (id: 19dbc75e-c2e2-444c-a770-ec69d8559fc7) on microsoft.graph SP"
      - "?target is any ApplicationIdentity or MachineIdentity in the same tenant (or another tenant if the SP has multi-tenant consent)"
      - "node_type(?target) in [ApplicationIdentity, MachineIdentity]"
      - "?sp != ?target   # self-grant via addPassword is an existing credential operation, not an escalation"
    emit:
      source_type: Identity
      target_type: Identity
      source: ?sp
      target: ?target
      permissions: ["Application.ReadWrite.All", "Directory.ReadWrite.All"]
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when the appRoleAssignment for Application.ReadWrite.All or
        Directory.ReadWrite.All is granted and the SP holds a valid credential.
        CONDITIONAL(service_state) if the SP credential is expired/revoked.
        BLOCKED if the target app/SP is protected by an Azure Entra Privileged
        Identity Management policy that prevents credential modification (rare;
        not currently modeled in Graph API responses — flag UNKNOWN when
        PIM-for-Applications is in scope). Inherit weakest from the HasRole
        input edge. Do NOT emit for Directory.ReadWrite.All without confirming
        that addPassword/addKey is within its effective scope for the target
        (Directory.ReadWrite.All is broad but some per-object operations still
        require Application.ReadWrite.All specifically — flag CONDITIONAL for
        the Directory.ReadWrite.All variant).
      confidence: "0.95"
      derived_from:
        - "<HasRole edge_id (appRoleAssignment Application.ReadWrite.All or Directory.ReadWrite.All on ?sp)>"
        - "azure/identity-escalation.yaml#azure-sp-add-credential (SP OWNER path — parallel; this rule covers the app-permission path)"
        - "azure/identity-escalation.yaml#azure-app-add-credential (app OWNER path — parallel)"
      false_positive_note: >-
        Application.ReadWrite.All is a very broad permission; a holder can add
        credentials to EVERY app and SP in the tenant, not just low-privilege
        ones. Model each (sp, target) pair as a separate edge instance, noting
        that an attacker will choose the highest-privilege target. Do NOT emit
        for targets that are protected by Entra's role-separation principle
        (Global Admin / Privileged Role Admin apps may have additional protection
        in future Entra hardening — flag CONDITIONAL in hardened tenants).
        Requires a valid SP credential to call Graph. Dedupe on (CanCreateCredentialFor,
        ?sp, ?target) when both Application.ReadWrite.All AND Directory.ReadWrite.All
        are held — one edge suffices. Directory.ReadWrite.All may not cover addPassword
        on all object types — prefer the Application.ReadWrite.All appRoleId match
        for the highest-confidence emit. The rule targets both ApplicationIdentity
        (via /applications/{id}/addPassword) and MachineIdentity (via
        /servicePrincipals/{id}/addPassword); use Identity as target_type to express
        that both subtypes are valid.
      narrative: >-
        {sp.name} holds Application.ReadWrite.All and can add a client secret or
        certificate to {target.name} via POST /applications/{id}/addPassword (for app
        registrations) or POST /servicePrincipals/{id}/addPassword (for service
        principals), then authenticate as {target.name} and inherit all of its
        delegated permissions and role assignments — the identity-plane equivalent
        of assuming a role.

  # --- 3) Application.ReadWrite.All -> CanTakeOwnership (add self as app owner) --
  # Docs: POST /applications/{id}/owners/$ref
  # App owner = permanent control: change redirect URIs, add credentials, change
  # publishers. Ownership survives the originating SP credential rotation.
  - id: azure-msgraph-app-ownership
    emits: CanTakeOwnership
    description: >-
      A service principal holding Application.ReadWrite.All can add itself as the
      owner of any app registration, granting it permanent owner-level control
      (credential addition, configuration change) independent of the original
      permission grant.
    match:
      - [ ?sp, HasRole, ?approle ]
    where:
      - "node_type(?sp) in [MachineIdentity, ApplicationIdentity]"
      - "?approle is Application.ReadWrite.All (id: 1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9) on microsoft.graph SP"
    emit:
      source_type: Identity
      target_type: "*"
      source: ?sp
      target: "<any ApplicationIdentity in the tenant>"
      permissions: ["Application.ReadWrite.All"]
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when the appRoleAssignment for Application.ReadWrite.All is granted
        and the SP credential is valid. CONDITIONAL(service_state) if SP credential
        is expired. Inherits weakest from the HasRole input. Not blocked by ARM RBAC
        deny assignments (Graph authorization is Entra-only). Elevated-privilege apps
        (Global Admin app registrations) may require additional authorization in
        future Entra hardening — flag CONDITIONAL in tenants with Entra Privileged
        Access hardening applied.
      confidence: "0.9"
      derived_from:
        - "<HasRole edge_id (appRoleAssignment Application.ReadWrite.All on ?sp)>"
        - "azure/identity-escalation.yaml#azure-app-sp-ownership (object ownership path — parallel; this covers the app-permission path)"
      false_positive_note: >-
        CanTakeOwnership of every app is a significant blast-radius claim — the SP
        can add itself as owner of ANY app, including high-privilege first-party
        Microsoft apps (exchange, SharePoint). Practically, the first escalation
        step will target the highest-privilege SP in the tenant. This edge feeds
        the ownership -> CanCreateCredentialFor chain in identity-escalation.yaml
        (azure-app-sp-ownership). Do NOT emit if Application.ReadWrite.All is not
        present in appRoleAssignments. Dedupe with rule 2 (azure-msgraph-app-readwrite-cred)
        on (CanCreateCredentialFor, ?sp, ?target) — the two rules emit different
        edges (CanTakeOwnership here vs CanCreateCredentialFor in rule 2) so no
        dedup needed between rules, but both should reference the same appRoleAssignment.
      narrative: >-
        {sp.name} holds Application.ReadWrite.All and can add itself as owner of any
        app registration via POST /applications/{id}/owners/$ref, gaining permanent
        owner-level control over that app's credentials and configuration regardless
        of subsequent permission changes.

  # --- 4) Application.ReadWrite.All -> CanModifyTrust (add federated credential) -
  # Docs: POST /applications/{id}/federatedIdentityCredentials
  # Adding a federated credential pointing at an attacker-controlled OIDC issuer
  # lets the attacker obtain tokens AS the app WITHOUT a secret.
  # Consumed by federation-chains.yaml federation-maps-to-identity once the
  # federated credential creates a TrustsExternalIdentity edge.
  # PARALLEL to azure-federated-credential-write in identity-escalation.yaml
  # which covers the OBJECT-OWNERSHIP / directory-credential-update path.
  # NOTE: Emits CanModifyTrust because adding a federatedIdentityCredential is a
  # trust-policy mutation (changes who is trusted to present tokens as that app),
  # not a generic configuration change. Semantically aligned with msgraph.md seed
  # doc sections 6, 14, 18 which classify this as a trust modification.
  - id: azure-msgraph-fedcred-add
    emits: CanModifyTrust
    description: >-
      A service principal holding Application.ReadWrite.All or Directory.ReadWrite.All
      can modify the trust configuration of any app registration by adding a federated
      identity credential (OIDC trust), allowing an attacker-controlled external
      issuer to obtain tokens as that app without a static secret.
    match:
      - [ ?sp, HasRole, ?approle ]
    where:
      - "node_type(?sp) in [MachineIdentity, ApplicationIdentity]"
      - "?approle is one of: Application.ReadWrite.All (id: 1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9) OR Directory.ReadWrite.All (id: 19dbc75e-c2e2-444c-a770-ec69d8559fc7) on microsoft.graph SP"
      - "for all ApplicationIdentity nodes (?target_app) in the tenant where ?sp != ?target_app"
    emit:
      source_type: Identity
      target_type: MachineIdentity
      source: ?sp
      target: "?target_app (service principal / app trust configuration)"
      permissions: ["Application.ReadWrite.All", "Directory.ReadWrite.All"]
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when the appRoleAssignment is granted and SP credential is valid.
        CONDITIONAL(service_state) if SP credential expired. Downstream federation
        path (TrustsExternalIdentity -> ExternalIdentityMapsTo -> CanFederateAs) is
        governed by federation-chains.yaml federation-maps-to-identity and depends
        on the attacker controlling an OIDC issuer whose tokens satisfy the federated
        credential's issuer/subject/audience conditions; that downstream state is
        CONDITIONAL(trust_condition) until confirmed broad/unpinned.
      confidence: "0.9"
      derived_from:
        - "<HasRole edge_id (appRoleAssignment Application.ReadWrite.All or Directory.ReadWrite.All on ?sp)>"
        - "azure/identity-escalation.yaml#azure-federated-credential-write (object-ownership/credential-update path — parallel; this covers the app-permission path)"
        - "federation-chains.yaml#federation-maps-to-identity (consumes the resulting TrustsExternalIdentity + ExternalIdentityMapsTo pair)"
      false_positive_note: >-
        Adding a federated credential requires: (a) SP credential is valid to call
        Graph; (b) target app allows federatedIdentityCredentials (most do by
        default). The attack is a two-step: add the fedcred (this edge = CanModifyPolicy
        on the app configuration), then use an attacker-controlled external identity
        that satisfies the issuer/sub/aud criteria to obtain a token (federation-chains
        handles the downstream). Do NOT model the downstream CanFederateAs here —
        let federation-chains derive it. Do NOT emit for the SP's OWN app
        (self-modification does not escalate if the SP already has Application.ReadWrite.All;
        it may still be a persistence mechanism — flag separately if needed). Confidence
        reduced from rule 2 because the downstream federation step adds friction.
        This rule emits CanModifyPolicy for every ApplicationIdentity in the tenant,
        creating significant fan-out; queries should filter by target privilege
        score when seeking high-impact paths.
      narrative: >-
        {sp.name} holds Application.ReadWrite.All and can modify the configuration
        of {target_app.name} by adding a federated identity credential via POST
        /applications/{id}/federatedIdentityCredentials, configuring it to trust an
        attacker-controlled OIDC issuer; an external identity matching that trust
        can then obtain tokens as {target_app.name} without any static secret.

  # --- 5) User.ReadWrite.All -> CanResetCredential (user password reset) ----------
  # Docs: PATCH /users/{id} with body {"passwordProfile": {"password": "...",
  #        "forceChangePasswordNextSignIn": false}}
  # Restricted: protected admins (GA, PRA, PA, PA, etc.) cannot be reset by this perm.
  # https://learn.microsoft.com/entra/identity/role-based-access-control/privileged-roles-permissions
  - id: azure-msgraph-user-password-reset
    emits: CanResetCredential
    description: >-
      A service principal holding User.ReadWrite.All (or Directory.ReadWrite.All) can
      reset any non-protected Entra user's password via PATCH /users/{id} with a new
      passwordProfile, taking over that user's account and inheriting their RBAC and
      group memberships.
    match:
      - [ ?sp, HasRole, ?approle ]
    where:
      - "node_type(?sp) in [MachineIdentity, ApplicationIdentity]"
      - "?approle is one of: User.ReadWrite.All (id: 741f803b-c850-494e-b5df-cde7c675a1ca) OR Directory.ReadWrite.All (id: 19dbc75e-c2e2-444c-a770-ec69d8559fc7) on microsoft.graph SP"
      - "for all HumanIdentity nodes (?user) in the tenant where ?user is NOT a protected administrator in Entra (Global Administrator, Privileged Role Administrator, Password Administrator, User Administrator, Authentication Administrator, Helpdesk Administrator — cross-check against /roleManagement/directory/roleAssignments)"
    emit:
      source_type: Identity
      target_type: HumanIdentity
      source: ?sp
      target: ?user
      permissions: ["User.ReadWrite.All", "Directory.ReadWrite.All"]
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when the appRoleAssignment is granted, SP credential is valid, and
        the target user is confirmed NOT a protected administrator. BLOCKED when
        the target user holds Global Administrator, Privileged Role Administrator,
        or any other role that Entra restricts from credential reset by lower-tier
        actors (Entra enforces this at API call time — the PATCH returns 403).
        CONDITIONAL(service_state) if the SP credential is expired. If the target
        user's role membership cannot be confirmed (collection gap), emit as
        CONDITIONAL(role_compatibility) and flag for analyst review. Conditional
        Access policies requiring MFA to set passwordProfile do not block an SP
        calling as itself (app-only context); they apply to interactive sessions.
      confidence: "0.9"
      derived_from:
        - "<HasRole edge_id (appRoleAssignment User.ReadWrite.All or Directory.ReadWrite.All on ?sp)>"
        - "azure/identity-escalation.yaml#azure-reset-password (directory-role path covering Authentication/User Administrator — parallel; this covers the app-permission path)"
      false_positive_note: >-
        Entra's restricted-admin protection prevents password reset for users
        holding privileged directory roles — the API enforces this, not just
        convention. Always check the target user's role assignments; if the user
        holds ANY admin directory role, emit BLOCKED rather than ACTIVE (unless
        the collector confirms the role set is empty). User.ReadWrite.All does NOT
        permit resetting MFA methods (that requires Authentication.ReadWrite — not
        modeled here). Directory.ReadWrite.All may not cover passwordProfile update
        in all Entra configurations — prefer User.ReadWrite.All appRoleId match
        for highest confidence. Self-service password reset (SSPR) does not
        interact with this edge (this is an app-only API call, not user-initiated).
        The rule matches all HumanIdentity nodes (regardless of prior role assignment
        data), filtering out protected admins at the where clause; non-admin users
        without any direct directory role are valid targets and must not be silently
        excluded by match-time role constraints.
      narrative: >-
        {sp.name} holds User.ReadWrite.All and can reset the password of {user.name}
        via PATCH /users/{id} (passwordProfile), taking over their account and
        inheriting all RBAC role assignments and group memberships they hold —
        subject to Entra's restriction blocking resets of protected administrator accounts.

  # --- 6) Group.ReadWrite.All / GroupMember.ReadWrite.All -> CanAddMember ----------
  # Docs: POST /groups/{id}/members/$ref
  # High impact when target group carries a privileged RBAC role assignment or a
  # high-impact Graph app role. Group.ReadWrite.All covers all group operations
  # (create, update, delete, membership). GroupMember.ReadWrite.All covers membership
  # only (narrower scope).
  - id: azure-msgraph-group-add-member
    emits: CanAddMember
    description: >-
      A service principal holding Group.ReadWrite.All, GroupMember.ReadWrite.All, or
      Directory.ReadWrite.All can add any principal (including itself) to any Entra
      group, inheriting that group's RBAC role assignments, Graph app role assignments,
      and any other entitlements the group carries.
    match:
      - [ ?sp, HasRole, ?approle ]
      - [ ?group, HasRole, ?group_role ]
    where:
      - "node_type(?sp) in [MachineIdentity, ApplicationIdentity]"
      - "?approle is one of: Group.ReadWrite.All (id: 62a82d76-70ea-41e2-9197-370581804d09) OR GroupMember.ReadWrite.All (id: dbaae8cf-10b5-4b86-a4a1-f871c94c6695) OR Directory.ReadWrite.All (id: 19dbc75e-c2e2-444c-a770-ec69d8559fc7) on microsoft.graph SP"
      - "node_type(?group) == Group"
      - "?group grants meaningful access (carries an RBAC role assignment at any scope, an appRoleAssignment, or is a role-assignable group associated with a directory role) — emit only for high-value groups to avoid excessive fan-out; analysts may enumerate all groups"
    emit:
      source_type: Identity
      target_type: Group
      source: ?sp
      target: ?group
      permissions: ["Group.ReadWrite.All", "GroupMember.ReadWrite.All", "Directory.ReadWrite.All"]
      conditions: [iam_permission, service_state]
      state_logic: >-
        ACTIVE when the appRoleAssignment for Group.ReadWrite.All, GroupMember.ReadWrite.All,
        or Directory.ReadWrite.All is granted and the SP credential is valid.
        CONDITIONAL(service_state) if the SP credential is expired. BLOCKED for
        dynamic-membership groups (membershipType == Dynamic — members cannot
        be added manually; they are determined by the membershipRule). BLOCKED
        if the group is a mail-enabled security group that prohibits member
        modification via Graph in some configurations. CONDITIONAL(role_compatibility)
        for role-assignable groups (isAssignableToRole == true) in tenants with
        privileged group management (Entra ID Governance) — those groups may
        require PIM approval for membership changes (CONDITIONAL(pim_activation)).
        CONDITIONAL(role_compatibility) confidence: 0.85 when matched via Directory.ReadWrite.All
        (rather than the more specific Group.ReadWrite.All / GroupMember.ReadWrite.All),
        since Directory.ReadWrite.All's exact scope for per-group member operations
        should be validated against Microsoft docs.
      confidence: "0.88"
      derived_from:
        - "<HasRole edge_id (appRoleAssignment Group.ReadWrite.All, GroupMember.ReadWrite.All, or Directory.ReadWrite.All on ?sp)>"
        - "azure/identity-escalation.yaml#azure-group-owner-add-member (group-owner object path — parallel; this covers the app-permission path)"
      false_positive_note: >-
        Dynamic-membership groups (membershipType == Dynamic) cannot have members
        added via POST /members/$ref — the Graph API returns an error. Always check
        the group's membershipRule property; if non-null, this edge is BLOCKED for
        that group. Role-assignable groups (isAssignableToRole == true) may be
        governed by PIM approval workflows in Entra ID P2 tenants — flag
        CONDITIONAL(pim_activation) when PIM policies are detected on the group.
        Group.ReadWrite.All is a superset of GroupMember.ReadWrite.All; both yield
        the member-add capability but Group.ReadWrite.All also permits group creation
        and deletion (not additionally modeled here). Directory.ReadWrite.All covers
        /groups/{id}/members operations per section 4 of msgraph.md (seed docs) but
        its exact scope is narrower than some other directory operations — apply
        reduced confidence (0.85) and flag CONDITIONAL for Directory.ReadWrite.All
        matches. Limit graph fan-out: emit per group only when that group can be
        shown to carry privilege (RBAC role, app role, or role-assignable group status);
        open-ended emission against all groups inflates the graph without attack-path value.
      narrative: >-
        {sp.name} holds Group.ReadWrite.All (or Directory.ReadWrite.All) and can add
        any principal (including controlled SPs or users) to {group.name} via POST
        /groups/{id}/members/$ref, inheriting whatever RBAC role assignments, Graph
        app roles, or directory role associations that group carries.

  # --- 7) Multi-tenant app consent → CrossTenantTrust (cross-boundary entry) -------
  # Docs: https://learn.microsoft.com/entra/identity-platform/multi-tenant-web-app
  # A multi-tenant app registration (signInAudience not AzureADMyOrg) that is granted
  # permissions by a foreign tenant's admin creates a cross-tenant trust relationship.
  # When the foreign admin grants consent, a service principal appears in the foreign
  # tenant holding the same app permissions consented there. This enables the app
  # (or attacker controlling it) to call Graph with the foreign tenant's grant.
  # This is the PRIMARY cross-tenant attack surface: one compromised multi-tenant
  # app = potential foothold in N other tenants.
  - id: azure-msgraph-multitenant-app-consent
    emits: CrossTenantTrust
    description: >-
      A multi-tenant application registration that has been granted admin consent
      by a foreign Entra tenant creates a cross-tenant trust allowing the app's SP
      in the foreign tenant to act under the consented permissions. If the app or
      its home-tenant SP is compromised, the attacker gains a foothold in the foreign
      tenant — a lateral-movement primitive.
    match:
      - [ ?app, LocatedIn, ?home_tenant ]
    where:
      - "node_type(?app) == ApplicationIdentity"
      - "?app.signInAudience != 'AzureADMyOrg'  # multi-tenant or personal-account"
      - "?foreign_sp is a service principal for ?app (same appId) in a foreign_tenant where ?foreign_sp.tenantId != ?home_tenant.id"
      - "?foreign_sp has received admin consent (evidenced by appRoleAssignment or oAuth2PermissionGrant in foreign_tenant)"
    emit:
      source_type: ApplicationIdentity
      target_type: ExternalIdentity
      source: ?app
      target: "<foreign tenant or foreign tenant's external identity representing the consent>"
      permissions: []
      conditions: [trust_relationship]
      state_logic: >-
        ACTIVE when the app has signInAudience=Multitenant or AzureADandPersonalMicrosoftAccount
        AND an appRoleAssignment or oAuth2PermissionGrant exists in the foreign tenant
        showing admin consent has been granted. BLOCKED if the app is restricted by
        the foreign tenant's tenant-level restrictions (e.g., "only allow specific
        app policy"). The foreign tenant's SP for this app then holds the consented
        permissions and can act as an attacker foothold there.
      confidence: "0.95"
      derived_from:
        - "<Application.signInAudience flag (multitenant setting)>"
        - "<appRoleAssignment or oAuth2PermissionGrant in foreign_tenant>"
        - "providers/azure/msgraph.md#section-10 (cross-boundary access via multi-tenant)"
      false_positive_note: >-
        Only multi-tenant and personal-account apps create cross-tenant trust; single-tenant
        (AzureADMyOrg) apps cannot be consented to by foreign tenants. Always confirm
        the app's signInAudience setting; if it is AzureADMyOrg, this edge does not apply.
        The presence of an appRoleAssignment in the foreign tenant is the definitive
        evidence of admin consent. Do NOT emit if the foreign tenant's admin has revoked
        consent (appRoleAssignment deleted or oAuth2PermissionGrant revoked) —
        model as BLOCKED or deletion.
      narrative: >-
        {app.name} is a multi-tenant application that has been granted admin consent
        in a foreign Entra tenant. The app's service principal in the foreign tenant
        now holds the consented permissions and can act on behalf of the attacker if
        the home-tenant app or its credentials are compromised — enabling lateral
        movement into the foreign tenant.

