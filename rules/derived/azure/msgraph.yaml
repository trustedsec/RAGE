# ROLL-UP NOTE:
#   The primitives emitted above are consumed by the linchpin files as follows:
#
#   CanGrantPermission (rule 1) ->
#     can-control.yaml control-boundary-via-iam-admin: CanGrantPermission at tenant
#     scope -> Controls(tenant), then hierarchy-chains admin-inherits-down-contains
#     descends to every subscription.
#
#   CanCreateCredentialFor (rule 2) ->
#     credential-chains.yaml read-secret-yields-identity: CanCreateCredentialFor +
#     CredentialsFor(credential -> target_identity) -> CanImpersonate. Then
#     credential-chains impersonate-is-escalation -> CanEscalateTo when target is
#     more privileged. Also: identity-escalation.yaml azure-sp-add-credential covers
#     the parallel ownership path — dedup on (type, sp, target).
#
#   CanTakeOwnership (rule 3) ->
#     identity-escalation.yaml azure-app-sp-ownership chains CanTakeOwnership ->
#     CanCreateCredentialFor (ownership -> credential addition). This rule (3) emits
#     CanTakeOwnership for the Graph-app-permission path; azure-app-sp-ownership
#     covers the object-ownership path. Both feed the same downstream chain.
#
#   CanModifyTrust (rule 4, via federated credential configuration) ->
#     federation-chains.yaml federation-maps-to-identity: the new federated credential
#     (added via CanModifyTrust) creates TrustsExternalIdentity (explicit normalization)
#     -> ExternalIdentityMapsTo -> CanFederateAs(attacker_ext -> target_app).
#     Then federate-then-enter-* and federate-inherits-capabilities apply. This rule
#     emits CanModifyTrust (semantically correct for trust-policy mutation) and is
#     aligned with the parallel object-ownership path in identity-escalation.yaml
#     (azure-federated-credential-write) which also emits CanModifyTrust.
#
#   CanResetCredential (rule 5) ->
#     No additional linchpin needed; CanResetCredential is a terminal capability
#     (the attacker signs in as the user). Downstream traversal uses the user's
#     outbound edges from the new identity.
#
#   CanAddMember (rule 6) ->
#     When the target group carries a privileged role, the resulting MemberOf edge
#     (once SP is added) grants role-inherited permissions. This feeds
#     CanGrantPermission / CanAdminister / Controls via the group's own outbound
#     edges. No linchpin dedup needed (CanAddMember is not a roll-up target itself).
#
#   CrossTenantTrust (rule 7) ->
#     federation-chains.yaml and cross-boundary linchpins: CrossTenantTrust edges
#     from multi-tenant app consent enable CanEnterTenant derivations. An attacker
#     who compromises a multi-tenant app gains a foothold in all consenting foreign
#     tenants via the foreign tenant's SP for that app.
#
# BLOCKED-edge guidance:
#   - Conditional Access "Workload Identity" policy blocking a SP's access to the
#     Microsoft Graph resource (app ID 00000003-0000-0000-c000-000000000000) ->
#     BLOCKED on all rules (CA check needed per SP).
#   - Expired / revoked SP credential -> CONDITIONAL(service_state).
#   - Dynamic group (membershipType == Dynamic) -> rule 6 BLOCKED for that group.
#   - Entra protected administrator target -> rule 5 BLOCKED for that user.
#   - PIM-governed role-assignable group -> rule 6 CONDITIONAL(pim_activation).
