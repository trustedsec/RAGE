# Azure Notification Hubs (Microsoft.NotificationHubs) — derived attack-path rules (Phase 10)
# ---------------------------------------------------------------------------
# PHASE-10 SERVICE ADAPTER: Azure Notification Hubs is a push fan-out messaging
# endpoint (app backend -> ANH -> PNS -> device). It has NO execution identity,
# no compute attachment, and no event-source-to-consumer binding. It is therefore
# NOT a trigger primitive for messaging-chains.yaml rules 1-2 (publish -> trigger
# consumer) — those rules require a Messaging event source bound to a compute
# consumer (CanTrigger). ANH is a message SINK, not an event source.
#
# THE TWO HIGH-VALUE PRIMITIVES (verified against official docs):
#
#   (a) SAS KEY EXFILTRATION via ARM listKeys:
#       Microsoft.NotificationHubs/namespaces/notificationHubs/authorizationRules/listkeys/action
#       Returns primaryKey, secondaryKey, primaryConnectionString, secondaryConnectionString.
#       The DefaultFullSharedAccessSignature connection string carries Listen+Send+Manage
#       rights — it can send push to all devices, read/write registrations, and update
#       PNS credentials. This is a pure credential-theft edge (CanReadSecret + ExposesCredential).
#       credential-chains.yaml read-secret-yields-identity rolls it up further IF the
#       connection string is linked to a CSP identity via CredentialsFor; it is not
#       directly linked here (it authenticates to the hub data-plane, not a CSP principal).
#
#   (b) PNS CREDENTIAL EXFILTRATION via ARM pnsCredentials:
#       Microsoft.NotificationHubs/namespaces/notificationHubs/pnsCredentials/action
#       Returns: APNS certificate/key/token, FCM/GCM API key, WNS packageSid+secretKey,
#       ADM clientId+clientSecret, Baidu apiKey+secretKey, VAPID private key, Xiaomi appSecret.
#       These credentials are REUSABLE OUTSIDE AZURE (FCM key can push to any FCM-registered
#       device; APNS cert can push Apple notifications) — classic ExposesCredential.
#
# LINCHPINS CITED (not re-derived here):
#   credential-chains.yaml: read-secret-yields-identity — if the SAS connection string
#     is stored as a secret in another resource (Key Vault, App Config, App Service env var)
#     and has a CredentialsFor link, that chain is already covered. ANH-specific rules
#     only emit the initial CanReadSecret/ExposesCredential FACTS.
#   messaging-chains.yaml: NOT applicable — ANH has no event-source-to-consumer binding.
#   can-control.yaml: NOT applicable — no execution path exists.
#
# IMPORTANT FALSE-POSITIVE GUARDS:
#   - listkeys/action on NAMESPACE-level rules returns namespace SAS keys (hub CRUD),
#     NOT hub Send/Manage keys. Only hub-level listkeys/action yields the hub data-plane
#     credential. These rules target the hub-level action only.
#   - DefaultListenSharedAccessSignature (Listen-only) is low-value: allows device
#     registration CRUD but not Send or tag-based reads. Only DefaultFullSharedAccessSignature
#     or a custom rule with Send+Manage rights is high-value. Rules emit at full confidence
#     when the target rule is confirmed to carry Send or Manage rights.
#   - The normal GET /notificationHubs/{hub} does NOT return PNS credential values —
#     they are masked. Only the POST .../pnsCredentials action returns live values.
#   - No execution path exists: ANH carries no execution identity. Do NOT chain into
#     CanExecuteAs from these credentials (the connection string authenticates to the
#     hub data-plane, not a CSP identity plane). CredentialsFor to a CSP principal ONLY
#     if the connection string is separately linked to one.
#
# STATE DEFAULTS:
#   ACTIVE when the effective ARM permission is confirmed at scope.
#   BLOCKED when a deny assignment covers the action at effective scope.
#
# All operation strings from the official Microsoft.NotificationHubs resource-provider
# operations reference and REST API documentation. No hallucinated permissions.
# REST API version 2023-09-01 used as the canonical reference.
# ---------------------------------------------------------------------------

provider: azure
phase: 10-messaging
applies_to: [azure]

rules:

  # ===========================================================================
  # 1. SAS key retrieval via hub-level listKeys (→ ExposesCredential + CanReadSecret)
  # ===========================================================================
  # THE primary Notification Hubs attack path. An identity with
  # notificationHubs/authorizationRules/listkeys/action at the hub scope can
  # call POST .../authorizationRules/{ruleName}/listKeys and retrieve the raw
  # primaryKey/secondaryKey and their connection strings. The
  # DefaultFullSharedAccessSignature connection string is the hub backend credential:
  # it carries Listen+Send+Manage rights and can send push to all devices, read all
  # registrations (including PII tags), and update PNS credentials.
  - id: azure-nh-hub-listkeys-reads-sas
    emits: CanReadSecret
    description: "Retrieve the raw SAS key (primaryKey/secondaryKey/connectionStrings) from a Notification Hub authorization rule via ARM listKeys; the DefaultFullSharedAccessSignature key yields hub-wide Send+Manage data-plane access."
    match_effective_permission:
      action: "Microsoft.NotificationHubs/namespaces/notificationHubs/authorizationRules/listkeys/action"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds the listkeys/action at the notificationHub scope (hub-level, not namespace-level)"
      - "at least one authorization rule on the hub carries Send or Manage rights"
    emit:
      source_type: Identity
      target_type: ConnectionString
      source: "<principal>"
      target: "<hub SAS authorization rule ConnectionString (DefaultFullSharedAccessSignature or custom backend rule)>"
      permissions:
        - "Microsoft.NotificationHubs/namespaces/notificationHubs/authorizationRules/listkeys/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective ARM permission is confirmed at the hub scope (resource,
        resource group, or subscription). The ARM listKeys POST returns live key material
        immediately — no additional conditions apply beyond the RBAC grant. BLOCKED when a
        deny assignment covers listkeys/action at the effective scope.
      confidence: 0.95
      derived_from:
        - "effective permission: Microsoft.NotificationHubs/namespaces/notificationHubs/authorizationRules/listkeys/action"
        - "ContainsSecret: ?hub stores authorization rule with Send or Manage rights"
        - "credential-chains.yaml: CredentialsFor links connection string to hub data-plane identity (if separately modeled)"
      false_positive_note: >-
        ONLY the hub-level listkeys/action (on the notificationHubs/authorizationRules path)
        returns hub Send/Manage keys. The namespace-level listkeys/action (on the namespaces/
        authorizationRules path) returns namespace SAS keys that control hub CRUD, NOT hub
        notification Send access — do not conflate the two. Confidence 0.95 because the
        listkeys response always returns key material when the permission is granted, but the
        analyst must confirm the targeted rule carries Send or Manage rights (not Listen-only,
        which is low-value). DefaultFullSharedAccessSignature is always present and always
        carries Listen+Send+Manage. The returned connection string is a data-plane credential
        for the hub, NOT a CSP identity credential — do not emit CredentialsFor to a CSP
        principal without a confirmed separate link (e.g., the string stored in Key Vault
        with CredentialsFor to an app identity).
      narrative: >-
        {principal.name} can call listKeys (notificationHubs/authorizationRules/listkeys/action)
        on authorization rules of notification hub {target.name}; this returns the raw
        primaryKey, secondaryKey, and connection strings including DefaultFullSharedAccessSignature,
        which grants full data-plane access (Listen+Send+Manage) to the hub — enabling
        notification delivery to all registered devices and read of all device registrations.

  # ===========================================================================
  # 2. PNS credential retrieval (→ ExposesCredential + CanReadSecret)
  # ===========================================================================
  # THE second Notification Hubs attack path. PNS credentials (FCM API key,
  # APNS certificate, WNS secret, etc.) are stored per-hub and returned by the
  # POST .../pnsCredentials ARM action. These credentials are REUSABLE OUTSIDE AZURE:
  # the FCM key can send push to any FCM-registered device from any attacker-controlled
  # backend; the APNS cert can send Apple push independently of Azure. This is a
  # classic ExposesCredential edge (hub stores the credential) + CanReadSecret
  # (principal can retrieve it via ARM RBAC).
  - id: azure-nh-hub-pns-creds-reads
    emits: CanReadSecret
    description: "Retrieve all PNS credentials (APNS cert/token, FCM API key, WNS packageSid+secret, etc.) from a Notification Hub via ARM pnsCredentials; credentials are reusable outside Azure."
    match_effective_permission:
      action: "Microsoft.NotificationHubs/namespaces/notificationHubs/pnsCredentials/action"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds pnsCredentials/action at the notificationHub scope"
      - "the hub has at least one PNS credential configured (gcmCredential, apnsCredential, wnsCredential, admCredential, baiduCredential, browserCredential, or xiaomiCredential is non-null)"
    emit:
      source_type: Identity
      target_type: APIKey
      source: "<principal>"
      target: "<PNS credential bundle on the notification hub (APIKey for FCM; separate Credential nodes for APNS/WNS in production)>"
      permissions:
        - "Microsoft.NotificationHubs/namespaces/notificationHubs/pnsCredentials/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective ARM permission is confirmed at the hub scope (resource,
        resource group, or subscription) AND the hub has at least one PNS credential
        configured. The POST .../pnsCredentials response returns all configured credential
        bundles immediately. BLOCKED when a deny assignment covers pnsCredentials/action
        at the effective scope. POTENTIAL when the presence of PNS credentials cannot be
        confirmed from ARM read metadata alone (the GET /notificationHubs response masks
        credential values; presence can be inferred from platform registration data).
      confidence: 0.85
      derived_from:
        - "effective permission: Microsoft.NotificationHubs/namespaces/notificationHubs/pnsCredentials/action"
        - "ContainsCredential: ?hub stores PNS credential bundle"
        - "credential-chains.yaml: CredentialsFor links PNS credentials to external PNS services (FCM, APNS, WNS) when separately modeled"
      false_positive_note: >-
        Confidence 0.85 (reduced from 0.90) because PNS credential presence cannot be confirmed
        from the ARM read response alone (values are masked); the collector must call the
        pnsCredentials POST action explicitly to confirm. Downgrade to POTENTIAL when hub
        registration data does not confirm any platform-specific registrations (suggesting
        PNS may not be configured). PNS credentials authenticate to EXTERNAL PNS services
        (Google FCM, Apple APNS, Microsoft WNS), not to Azure RBAC or CSP identities — do
        not chain into CanExecuteAs or CanEnterSubscription from these credentials. Their
        value is impact (push notification hijacking, social engineering, device token
        enumeration), not CSP privilege escalation. The target_type APIKey covers FCM
        (googleApiKey); APNS cert and WNS secret are modeled as Certificate/Credential in
        production systems.
      narrative: >-
        {principal.name} can retrieve PNS credentials from notification hub {target.name}
        (pnsCredentials/action); the returned bundle includes live credential material such
        as FCM API keys, APNS certificates/tokens, and WNS secrets — each usable outside
        Azure to send push notifications to all devices registered with those credentials,
        independent of Azure RBAC.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - A deny assignment covering listkeys/action at the hub scope ->
#    azure-nh-hub-listkeys-reads-sas: state BLOCKED, denied_by=<deny assignment>.
#  - A deny assignment covering pnsCredentials/action at the hub scope ->
#    azure-nh-hub-pns-creds-reads: state BLOCKED.
#  - A hub with no authorization rules carrying Send/Manage rights ->
#    azure-nh-hub-listkeys-exposes-sas: do NOT emit (only Listen-only rules present).
#  - A hub with no PNS credentials configured ->
#    azure-nh-hub-pns-creds-exposes-credential: do NOT emit;
#    azure-nh-hub-pns-creds-reads: downgrade to POTENTIAL.
#  - Namespace-level listkeys/action does NOT qualify for hub credential access
#    — ONLY hub-level listkeys/action qualifies.
# ---------------------------------------------------------------------------

# Explicit normalization rules for this service live in
# /rules/explicit/azure-notificationhubs.yaml (ContainsSecret, ContainsCredential,
# LocatedIn namespace->hub, and the CanReadSecret structural from ARM read metadata).
explicit_rules:

  - id: azure-nh-contains-sas-rule
    emits: ContainsSecret
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.NotificationHubs/namespaces/notificationHubs/authorizationRules"
      field: "properties.rights"
    where:
      - "properties.rights contains Send or Manage"
    emit:
      source_type: Topic
      target_type: Secret
      source: "<notification hub (Topic)>"
      target: "<authorization rule SAS key/connection string (Secret node)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.NotificationHubs/namespaces/{ns}/notificationHubs/{hub}/authorizationRules"
      evidence_field: "properties.rights"
      narrative: "Notification hub {hub.name} has a SAS authorization rule {source.name} with rights {value} — raw key material (primaryKey, secondaryKey, connection strings) accessible via listKeys/action."

  - id: azure-nh-contains-pns-credential
    emits: ContainsCredential
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.NotificationHubs/namespaces/notificationHubs"
      field: "properties.admCredential|properties.apnsCredential|properties.gcmCredential|properties.wnsCredential|properties.baiduCredential|properties.browserCredential|properties.xiaomiCredential"
    where:
      - "at least one PNS credential field is non-null in the hub properties"
    emit:
      source_type: Topic
      target_type: Credential
      source: "<notification hub (Topic)>"
      target: "<PNS credential bundle (Credential node) — one per configured PNS>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.NotificationHubs/namespaces/{ns}/notificationHubs/{hub}"
      evidence_field: "properties.*Credential"
      narrative: "Notification hub {hub.name} has {pns} credentials configured; raw credential material (API keys, certificates, secrets) is retrievable via pnsCredentials/action."

  - id: azure-nh-namespace-contains-hub
    emits: Contains
    applies_to: [azure]
    match_record:
      resource_type: "Microsoft.NotificationHubs/namespaces/notificationHubs"
      field: "id"
    emit:
      source_type: GenericBoundary
      target_type: Topic
      source: "<namespace (GenericBoundary — logical containment scope)>"
      target: "<notification hub (Topic)>"
      api_source: "GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.NotificationHubs/namespaces/{ns}/notificationHubs"
      evidence_field: "id (parent namespace extracted from resource id)"
      narrative: "Namespace {source.name} contains notification hub {target.name}; namespace-level RBAC governs hub CRUD operations."
