# Azure — Logic Apps (Microsoft.Logic/workflows + Microsoft.Web/sites kind=workflowapp)
# derived attack-path rules (Phase 10 — messaging & event systems)
# ---------------------------------------------------------------------------
# PHASE-10 SERVICE ADAPTER: Logic Apps are the Azure *Workflow* primitive. A
# Logic App is BOTH a compute workload (it runs as a managed identity) AND a
# messaging consumer (event-source triggers bind it to queues, topics, event
# hubs, storage blobs). This file emits NORMALIZED FACTS that the Phase-10
# linchpins consume. The full escalation and cross-boundary roll-ups are NOT
# re-derived here — they are CITED and owned by their respective linchpins.
#
# KEY ATTACK SURFACE (verified against Microsoft.Logic + Microsoft.Web
# resource-provider operations reference, 2026-09 snapshot):
#
#   (a) WORKFLOW DEFINITION WRITE (headline path — Consumption tier):
#       Microsoft.Logic/workflows/write — overwrite the workflow definition JSON.
#       Injects arbitrary HTTP actions / inline code / connector sequences that
#       run as the workflow's managed identity on the next trigger.
#       => CanModifyCode(principal -> workflow) + ExecutesAs(workflow, MI)
#       => can-execute-as execute-as-via-code-modify collapses to CanExecuteAs.
#
#   (b) APP SERVICE CODE PRIMITIVES (Standard / single-tenant tier only):
#       Microsoft.Web/sites/extensions/write (Kudu/SCM ZipDeploy / VFS write)
#       Microsoft.Web/sites/functions/write (host shares runtime with Functions)
#       Microsoft.Web/sites/sourcecontrols/Write (CI/CD source hijack)
#       Microsoft.Web/sites/config/Write (WEBSITE_RUN_FROM_PACKAGE / image / env)
#       Same attack surface as Azure Functions; see azure:functions docs.
#       => CanModifyCode / CanModifyConfiguration
#       => can-execute-as + cicd-chains handle the collapse.
#
#   (c) API CONNECTION KEY READ:
#       Microsoft.Web/connections/listConnectionKeys/action — returns the
#       embedded key/token for an API connection (Service Bus primary key,
#       storage account key, SQL password, OAuth refresh token, etc.).
#       => CanReadSecret(principal -> ConnectionString/Credential node)
#       => credential-chains read-secret-yields-identity + CredentialsFor roll-up.
#
#   (d) HTTP TRIGGER CALLBACK URL:
#       Microsoft.Logic/workflows/triggers/*/listCallbackUrl/action — a SAS-signed
#       HTTPS URL. Possession = trigger the workflow without Entra auth.
#       => CanReadSecret(principal -> APIKey/callback-URL node)
#       => CanInvoke(principal -> workflow) — completes the trigger path to MI.
#       => ExposedToInternet when the trigger is public (no IP allowlist).
#
#   (e) RECURRENCE TRIGGER (schedule / persistence):
#       A Logic App with a Recurrence trigger fires autonomously on a cadence;
#       if the workflow has a MI, this is persistence (no further attacker action).
#       Microsoft.Logic/workflows/write with a recurrence trigger config
#       => CanSchedule(principal -> workflow) + CanPassIdentity(principal -> MI)
#       => messaging-chains messaging-schedule-persists-executes-as collapses to
#          CanExecuteAs(principal -> MI) (ACTIVE: fires on cadence as the MI).
#
#   (f) EVENT-SOURCE TRIGGER BINDING (core Phase-10 primitive):
#       A Logic App trigger of type ApiConnection (Service Bus, Event Grid,
#       Event Hubs, Storage) is an event-source BINDING: the messaging source
#       CanTrigger the Logic App. Whoever can SEND to that source (CanWriteData)
#       drives the workflow => messaging-publish-triggers-consumer (rule 1) =>
#       messaging-trigger-executes-as (rule 2) collapses to CanExecuteAs.
#
# LINCHPINS CITED (do NOT re-derive):
#   messaging-chains  messaging-publish-triggers-consumer (rule 1):
#                     CanWriteData(?p, ?src) + CanTrigger(?src, ?workflow) =>
#                     CanTrigger(?p, ?workflow).
#   messaging-chains  messaging-trigger-executes-as (rule 2):
#                     CanTrigger(?p, ?workflow) + ExecutesAs(?workflow, ?id) =>
#                     CanExecuteAs(?p, ?id) CONDITIONAL.
#   messaging-chains  messaging-schedule-persists-executes-as (rule 3):
#                     CanSchedule(?p, ?workflow) + CanPassIdentity(?p, ?id) =>
#                     CanExecuteAs(?p, ?id) ACTIVE (persistence cadence).
#   can-execute-as    execute-as-via-code-modify:
#                     CanModifyCode(?p, ?workflow) + ExecutesAs(?workflow, ?id) =>
#                     CanExecuteAs(?p, ?id).
#   can-execute-as    execute-as-via-config-identity-swap:
#                     CanModifyConfiguration(?p, ?workflow) + CanPassIdentity =>
#                     CanExecuteAs(?p, ?id).
#   credential-chains read-secret-yields-identity:
#                     CanReadSecret(?p, ?secret) + CredentialsFor(?secret, ?id) =>
#                     CanImpersonate(?p, ?id).
#   can-control       escalate-via-execute-as, enter-subscription-via-execute-as:
#                     CanExecuteAs escalation and CanEnterSubscription roll-ups.
#
# STATE DEFAULTS (RULE-FORMAT.md):
#   ACTIVE when all required operations are held AND a trigger/run path exists.
#   CONDITIONAL(trigger_exists) when definition changed but no confirmed trigger.
#   CONDITIONAL(service_state) when app is stopped (Standard tier).
#   CONDITIONAL(resource_policy) when gated by IP allowlist / deny assignment.
#   BLOCKED when a deny assignment covers the critical action at effective scope.
#
# All operation strings from the official Microsoft.Logic and Microsoft.Web
# resource-provider operations reference. No hallucinated permissions.
# ---------------------------------------------------------------------------

provider: azure
phase: 10-messaging
applies_to: [azure]

rules:

  # ===========================================================================
  # 1. Administrative control over the Logic App workflow
  # ===========================================================================

  - id: azure-la-contributor
    emits: CanAdminister
    description: "Full control of a Logic App workflow (Logic App Contributor / Contributor / Owner)."
    match_effective_permission:
      action: "Microsoft.Logic/workflows/write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "principal effectively holds Logic App Contributor, Contributor, Owner, or a custom role granting Microsoft.Logic/workflows/* at the scope"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Logic App workflow in scope>"
      permissions:
        - "Microsoft.Logic/workflows/write"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed; BLOCKED if a deny
        assignment covers workflows/write at the scope. CanAdminister(workflow)
        does NOT imply CanGrantPermission — escalation is via the workflow's
        managed identity, not via self role-assignment or
        Microsoft.Authorization/*/write.
      confidence: 0.98
      derived_from:
        - "effective permission: Microsoft.Logic/workflows/write"
      false_positive_note: >-
        Microsoft.Logic/workflows/* grants full control of the workflow object
        including definition, triggers, runs, and the identity block, but NOT
        Microsoft.Authorization/*/write. Logic App Operator role grants
        enable/disable/trigger-run but NOT workflows/write; it does NOT qualify
        for CanAdminister and does NOT yield CanModifyCode.
      narrative: >-
        {principal.name} has full control of Logic App workflow {target.name}
        (Microsoft.Logic/workflows/*) including the workflow definition, triggers,
        and identity configuration.

  # ===========================================================================
  # 2. Code modification — Consumption tier (workflow definition overwrite)
  # ===========================================================================

  - id: azure-la-workflow-write-modifycode
    emits: CanModifyCode
    description: "Overwrite the Logic App workflow definition to inject arbitrary actions running as the workflow's MI."
    match_effective_permission:
      action: "Microsoft.Logic/workflows/write"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Compute
      source: "<principal>"
      target: "<Logic App workflow (Workflow node)>"
      permissions:
        - "Microsoft.Logic/workflows/write"
      conditions: [trigger_exists, service_state]
      state_logic: >-
        ACTIVE when the definition is modified AND a trigger path exists (HTTP
        callback, recurrence, or an event-source binding is ENABLED). CONDITIONAL
        (trigger_exists) if no confirmed trigger or confirmed CanInvoke path exists
        (the workflow fires only on the next trigger event). BLOCKED if a deny
        assignment covers workflows/write.
      confidence: 0.97
      derived_from:
        - "effective permission: Microsoft.Logic/workflows/write"
      false_positive_note: >-
        workflows/write is granted to Logic App Contributor, Contributor, and Owner
        roles. The Logic App Operator role does NOT have this permission; do not
        derive CanModifyCode from Operator role alone. Realized on next trigger —
        without a live trigger path, emit CONDITIONAL(trigger_exists) not ACTIVE.
        The managed identity must exist for CanExecuteAs to fire downstream; if the
        workflow has no MI, this yields only API-connection-credential access via
        ExposesCredential (handled by credential-chains), not ARM token access.
      narrative: >-
        {principal.name} can overwrite the workflow definition of Logic App
        {target.name} (Microsoft.Logic/workflows/write), injecting HTTP actions or
        inline code that runs as the workflow's managed identity on the next trigger.

  # ===========================================================================
  # 3. Code modification — Standard tier (App Service primitives)
  # ===========================================================================

  - id: azure-la-std-extensions-write
    emits: CanModifyCode
    description: "Deploy attacker code to a Standard Logic App via Kudu/SCM ZipDeploy (extensions/write)."
    match_effective_permission:
      action: "Microsoft.Web/sites/extensions/write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "target site has kind containing 'workflowapp' (Standard Logic App)"
    emit:
      source_type: Identity
      target_type: Compute
      source: "<principal>"
      target: "<Standard Logic App site (Workflow or ApplicationPlatform node)>"
      permissions:
        - "Microsoft.Web/sites/extensions/write"
      conditions: [service_state, trigger_exists]
      state_logic: >-
        ACTIVE when code is deployed AND a trigger/invoke path exists. CONDITIONAL
        (trigger_exists) absent a confirmed trigger. CONDITIONAL(service_state) on
        a stopped app. BLOCKED if a deny assignment covers extensions/write.
      confidence: 0.95
      derived_from:
        - "effective permission: Microsoft.Web/sites/extensions/write"
      false_positive_note: >-
        Standard Logic Apps only (kind=workflowapp on Microsoft.Web/sites). The
        Standard tier shares the App Service host runtime with Azure Functions; this
        extension-write path is identical to azure-func-extensions-write. Realized
        on next invoke/restart of the host.
      narrative: >-
        {principal.name} can deploy arbitrary code to Standard Logic App {target.name}
        via the Kudu extensions API (Microsoft.Web/sites/extensions/write), running
        attacker code as its managed identity on the next trigger.

  - id: azure-la-std-sourcecontrols-write
    emits: CanModifyCode
    description: "Hijack the source control of a Standard Logic App to an attacker repo (sourcecontrols/Write)."
    match_effective_permission:
      action: "Microsoft.Web/sites/sourcecontrols/Write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "target site has kind containing 'workflowapp' (Standard Logic App)"
    emit:
      source_type: Identity
      target_type: Compute
      source: "<principal>"
      target: "<Standard Logic App site>"
      permissions:
        - "Microsoft.Web/sites/sourcecontrols/Write"
      conditions: [service_state]
      state_logic: >-
        CONDITIONAL(trigger_exists) — injection realized at next CI/CD sync/deploy.
        BLOCKED if a deny assignment covers sourcecontrols/Write.
      confidence: 0.85
      derived_from:
        - "effective permission: Microsoft.Web/sites/sourcecontrols/Write"
      false_positive_note: >-
        Standard Logic Apps only. Only yields execution if the continuous deployment /
        auto-sync is configured and actually pulls the attacker source. If no
        auto-sync is configured, downgrade to POTENTIAL.
      narrative: >-
        {principal.name} can repoint the source control of Standard Logic App
        {target.name} to an attacker-controlled repository (sourcecontrols/Write),
        injecting code at the next CI/CD sync or deploy.

  # ===========================================================================
  # 4. Configuration modification — Standard tier
  # ===========================================================================

  - id: azure-la-std-config-write
    emits: CanModifyConfiguration
    description: "Modify app settings/config of a Standard Logic App (WEBSITE_RUN_FROM_PACKAGE / image / env / identity)."
    match_effective_permission:
      action: "Microsoft.Web/sites/config/Write"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "target site has kind containing 'workflowapp' (Standard Logic App)"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<Standard Logic App site>"
      permissions:
        - "Microsoft.Web/sites/config/Write"
      conditions: [service_state]
      state_logic: >-
        Realized at next restart/deploy; pair with trigger/invoke or CanStart for
        ACTIVE. CONDITIONAL(trigger_exists) absent. BLOCKED if deny assignment covers
        config/Write.
      confidence: 0.90
      derived_from:
        - "effective permission: Microsoft.Web/sites/config/Write"
      false_positive_note: >-
        Standard Logic Apps only. config/Write enables WEBSITE_RUN_FROM_PACKAGE swap,
        container image replacement, startup command injection, or MI identity block
        changes (when combined with sites/write). A benign setting change is not
        immediate execution — pair with a code-deploy or trigger path.
      narrative: >-
        {principal.name} can rewrite app settings/config of Standard Logic App
        {target.name} (Microsoft.Web/sites/config/Write), enabling a package swap,
        image replacement, or environment variable injection that runs as its identity.

  # ===========================================================================
  # 5. Credential access — API connection key listing
  # ===========================================================================

  - id: azure-la-list-connection-keys
    emits: CanReadSecret
    description: "List the embedded key/token for an API connection used by a Logic App (listConnectionKeys/action)."
    match_effective_permission:
      action: "Microsoft.Web/connections/listConnectionKeys/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<API connection credential (ConnectionString/Credential/APIKey node)>"
      permissions:
        - "Microsoft.Web/connections/listConnectionKeys/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed and the connection has
        stored credential material (OAuth token, static key, or password).
        CONDITIONAL when the stored credential is an OAuth token that may have
        expired (auto-refresh only happens when the Logic App actually runs a
        connector action). BLOCKED if a deny assignment covers the action.
      confidence: 0.93
      derived_from:
        - "effective permission: Microsoft.Web/connections/listConnectionKeys/action"
      false_positive_note: >-
        The returned material depends on the connector type: Service Bus connections
        embed the primary SAS key (long-lived); storage connections embed an account
        key (long-lived); SQL connections embed the password; OAuth-authenticated
        connections (Office 365, SharePoint, etc.) embed a refresh token that expires
        if the connection has not been used. Downgrade confidence to 0.7 for
        OAuth-backed connections (token may be expired). The key is stored in the
        Microsoft.Web/connections resource regardless of whether the Logic App is
        Consumption or Standard tier. credential-chains read-secret-yields-identity
        rolls up CanReadSecret + CredentialsFor -> CanImpersonate; do not re-derive.
      narrative: >-
        {principal.name} can list the embedded credential of API connection
        {target.name} (Microsoft.Web/connections/listConnectionKeys/action),
        extracting the stored Service Bus key, storage account key, SQL password,
        or OAuth refresh token used by the Logic App's connector actions.

  # ===========================================================================
  # 6. Credential access — HTTP trigger callback URL (SAS-signed)
  # ===========================================================================

  - id: azure-la-callback-url
    emits: CanReadSecret
    description: "Obtain the SAS-signed HTTP trigger callback URL for a Logic App (listCallbackUrl/action)."
    match_effective_permission:
      action: "Microsoft.Logic/workflows/triggers/*/listCallbackUrl/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<HTTP trigger callback URL (APIKey node)>"
      permissions:
        - "Microsoft.Logic/workflows/triggers/*/listCallbackUrl/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed and the workflow has an
        HTTP (Request) trigger. CONDITIONAL if the workflow access key has been
        recently regenerated (listCallbackUrl returns the NEW URL; old URLs are
        immediately invalid after regenerate/action). BLOCKED if a deny assignment
        covers the listCallbackUrl action.
      confidence: 0.95
      derived_from:
        - "effective permission: Microsoft.Logic/workflows/triggers/listCallbackUrl/action"
      false_positive_note: >-
        The callback URL contains a SAS signature tied to the workflow's access key.
        If the access key is regenerated (accessKeys/regenerate/action), all existing
        SAS URLs are immediately invalidated — a known rotation control. Downgrade to
        POTENTIAL if key rotation is confirmed recent or automatic. The URL is valid
        only for the specific trigger it was issued for; do not assume it covers all
        triggers. This CanReadSecret feeds CanInvoke(callback-URL holder -> workflow)
        via rule azure-la-http-trigger-invoke; the credential-chains roll-up then
        connects to CanExecuteAs if the workflow has a MI.
      narrative: >-
        {principal.name} can obtain the SAS-signed HTTP callback URL of Logic App
        {target.name} trigger (listCallbackUrl/action); possession of the URL allows
        triggering the workflow without Entra authentication.

  # ===========================================================================
  # 7. Credential access — Standard tier app settings
  # ===========================================================================

  - id: azure-la-std-appsettings
    emits: CanReadSecret
    description: "Read decrypted app settings and connection strings of a Standard Logic App (config/list/Action)."
    match_effective_permission:
      action: "Microsoft.Web/sites/config/list/Action"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "target site has kind containing 'workflowapp' (Standard Logic App)"
    emit:
      source_type: Identity
      target_type: "*"
      source: "<principal>"
      target: "<app settings + connection strings of the Standard Logic App>"
      permissions:
        - "Microsoft.Web/sites/config/list/Action"
      conditions: []
      state_logic: >-
        ACTIVE when effective permission is confirmed and the app settings carry
        credential material (storage keys, SQL/Service Bus connection strings,
        API keys, or publishing credentials). BLOCKED if a deny assignment covers
        the action.
      confidence: 0.90
      derived_from:
        - "effective permission: Microsoft.Web/sites/config/list/Action"
      false_positive_note: >-
        Standard Logic Apps only. config/list/Action returns decrypted appsettings +
        connectionStrings (List Web App security sensitive settings). Key Vault
        references (@Microsoft.KeyVault(...)) in settings are pointers, not inline
        secrets — resolve separately. Emit ContainsSecret only for settings that
        actually carry credential material. config/list/Action also returns publishing
        credentials (SCM/FTP) — cross-reference with SCM basic auth policy.
      narrative: >-
        {principal.name} can read decrypted app settings and connection strings of
        Standard Logic App {target.name} (Microsoft.Web/sites/config/list/Action),
        exposing embedded connection strings, storage keys, or API credentials.

  # ===========================================================================
  # 8. Identity attachment (Azure PassRole analog)
  # ===========================================================================

  - id: azure-la-attach-user-mi
    emits: CanAttachIdentity
    description: "Attach a user-assigned managed identity to a Logic App (assign/action + workflows/write or sites/write)."
    match:
      - [ ?principal, CanPassIdentity, ?userMI ]
    where:
      - "?principal has EFFECTIVE Microsoft.ManagedIdentity/userAssignedIdentities/assign/action on ?userMI"
      - "?principal has EFFECTIVE Microsoft.Logic/workflows/write (Consumption) OR Microsoft.Web/sites/write (Standard) on the target workflow"
    emit:
      source_type: Identity
      target_type: Compute
      source: "<principal>"
      target: "<Logic App workflow (existing or new)>"
      permissions:
        - "Microsoft.ManagedIdentity/userAssignedIdentities/assign/action"
        - "Microsoft.Logic/workflows/write"
      conditions: [role_compatibility]
      state_logic: >-
        ACTIVE when BOTH permissions are confirmed at their respective scopes and
        role_compatible(?userMI, ?workflow) holds. POTENTIAL(role_compatibility) when
        the assign/action scope excludes the target MI. BLOCKED if a deny assignment
        covers either action.
      confidence: 0.95
      derived_from:
        - "<CanPassIdentity edge: ?principal -> ?userMI>"
      false_positive_note: >-
        BOTH permissions are required: assign/action on the specific user-assigned MI
        AND workflows/write (Consumption) or sites/write (Standard) on the target
        workflow. Neither alone attaches the MI. Honor the assign/action resource
        scope — a scope limited to a different MI does not qualify. System-assigned
        MI is enabled via workflows/write alone but yields only a freshly-created SP
        with no RBAC grants — no immediate privilege gain.
      narrative: >-
        {principal.name} can attach user-assigned managed identity {userMI.name} to
        Logic App {target.name} (assign/action + workflows/write), binding a
        higher-privilege identity to the workflow.

  # ===========================================================================
  # 9. Token retrieval — Standard tier App Service identity endpoint
  # ===========================================================================

  - id: azure-la-identity-endpoint-token
    emits: CanRetrieveToken
    description: "Code/actions in a Standard Logic App can mint a bearer token for each bound MI via the App Service identity endpoint."
    match:
      - [ ?app, ExecutesAs, ?mi ]
    where:
      - "node_type(?app) in [Workflow, ApplicationPlatform]"
      - "?app is a Standard (single-tenant) Logic App (kind=workflowapp on Microsoft.Web/sites)"
    emit:
      source_type: Compute
      target_type: Identity
      source: "<Standard Logic App site>"
      target: "<managed identity bound to the workflow>"
      permissions: []
      conditions: []
      state_logic: >-
        ACTIVE when the Standard Logic App has a managed identity (identity.type !=
        None) and is running. Not emitted for Consumption Logic Apps (they use an
        internal token relay not the App Service IDENTITY_ENDPOINT/IDENTITY_HEADER;
        the Consumption identity is still accessible via workflow HTTP actions but
        the endpoint differs).
      confidence: 0.95
      derived_from:
        - "<ExecutesAs edge: ?app -> ?mi>"
      false_positive_note: >-
        Only fires when the app actually has a managed identity. For Standard Logic
        Apps, the App Service identity endpoint
        (%IDENTITY_ENDPOINT%?resource=<aud>&api-version=2019-08-01 with header
        X-IDENTITY-HEADER: %IDENTITY_HEADER%) is the mechanism; this is NOT the
        169.254 IMDS used by VMs. If the workflow has no MI, do NOT emit.
      narrative: >-
        Any code or workflow action in Standard Logic App {app.name} can request a
        bearer token for managed identity {mi.name} from the App Service identity
        endpoint (IDENTITY_ENDPOINT/IDENTITY_HEADER), no app secret required.

  - id: azure-la-identity-endpoint-exposescred
    emits: ExposesCredential
    description: "A Standard Logic App with a bound MI exposes that MI's credential to any code/action running in the app."
    match:
      - [ ?app, ExecutesAs, ?mi ]
    where:
      - "node_type(?app) in [Workflow, ApplicationPlatform]"
      - "?app is a Standard (single-tenant) Logic App (kind=workflowapp on Microsoft.Web/sites)"
    emit:
      source_type: Compute
      target_type: Identity
      source: "<Standard Logic App site>"
      target: "<managed identity bound to the workflow>"
      permissions: []
      conditions: []
      state_logic: "ACTIVE when MI is confirmed present. Not emitted for Consumption Logic Apps."
      confidence: 0.95
      derived_from:
        - "<ExecutesAs edge: ?app -> ?mi>"
      false_positive_note: >-
        Only fires for Standard Logic Apps with a managed identity. Companion to
        azure-la-identity-endpoint-token. For Consumption Logic Apps, the token is
        obtained via the internal Managed Identity token relay (HTTP action to the
        managed identity token endpoint), NOT IDENTITY_ENDPOINT — emit ExposesCredential
        separately for Consumption only if the workflow definition includes an explicit
        HTTP action calling the token relay (evidence-dependent).
      narrative: >-
        Standard Logic App {app.name} exposes the credential of its managed identity
        {mi.name} to any code or workflow action running in the app (App Service
        identity endpoint).

  # ===========================================================================
  # 10. API connection exposes embedded credential
  # ===========================================================================

  - id: azure-la-connection-exposescred
    emits: ExposesCredential
    description: "An API connection stores a long-lived service credential (key/token) usable by any code that can call listConnectionKeys."
    match:
      - [ ?connection, ContainsSecret, ?cred ]
    where:
      - "node_type(?connection) == ConnectionString or node_class(?connection) == Messaging"
      - "?connection is a Microsoft.Web/connections resource"
    emit:
      source_type: Messaging
      target_type: Identity
      source: "<API connection (ConnectionString node)>"
      target: "<identity/service the embedded credential authenticates as>"
      permissions: []
      conditions: []
      state_logic: >-
        ACTIVE when the connection has confirmed stored credential material. CONDITIONAL
        when the credential is an OAuth refresh token that may be expired (auto-refresh
        only on connector action run).
      confidence: 0.85
      derived_from:
        - "<ContainsSecret edge: ?connection -> ?cred>"
      false_positive_note: >-
        An API connection's embedded credential leaks to any code that calls
        listConnectionKeys/action. The target identity/service depends on the
        connector type (Service Bus namespace, storage account, SQL server, etc.).
        credential-chains rolls up ContainsSecret + CredentialsFor -> the
        downstream access edge; this rule emits only the fact that the connection
        stores and exposes the credential.
      narrative: >-
        API connection {connection.name} stores a long-lived service credential
        (Service Bus key / storage key / SQL password) exposed via
        listConnectionKeys/action to any principal who can call that action.

  # ===========================================================================
  # 11. Direct invocation via HTTP trigger callback URL
  # ===========================================================================

  - id: azure-la-http-trigger-invoke
    emits: CanInvoke
    description: "Invoke a Logic App HTTP trigger using a held callback URL (SAS-signed)."
    match:
      - [ ?principal, CanReadSecret, ?callbackUrl ]
    where:
      - "?callbackUrl is the HTTP trigger callback URL of a Logic App (?callbackUrl is an APIKey node from rule azure-la-callback-url)"
    emit:
      source_type: Identity
      target_type: Workflow
      source: "<principal>"
      target: "<Logic App workflow>"
      permissions: []
      conditions: [network_reachability]
      state_logic: >-
        ACTIVE when the principal holds the callback URL AND the workflow is Enabled
        AND network-reachable. CONDITIONAL(network_reachability) if network path is
        unconfirmed. BLOCKED if the workflow is Disabled or the access key was
        regenerated after the URL was obtained (URL is now invalid).
      confidence: 0.90
      derived_from:
        - "<CanReadSecret edge: ?principal -> ?callbackUrl>"
      false_positive_note: >-
        The callback URL includes a SAS signature (se/sp/sv/sig parameters) that
        encodes an expiry and the access key. If the workflow's access key is
        regenerated, all outstanding SAS URLs become immediately invalid. Invoke
        alone only drives the EXISTING workflow definition — it becomes CanExecuteAs
        only when combined with a definition that has been or can be modified (via
        azure-la-workflow-write-modifycode), or when messaging-trigger-executes-as
        fires because the workflow has a MI. The IP allowlist on the HTTP trigger
        (accessControl.triggers.allowedCallerIpAddresses) gates reachability —
        condition network_reachability for allowlisted triggers.
      narrative: >-
        {principal.name} holds the SAS-signed callback URL for Logic App
        {target.name}'s HTTP trigger and can invoke the workflow without Entra
        authentication.

  # ===========================================================================
  # 12. Read workflow run history expression traces (secrets in logs)
  # ===========================================================================

  - id: azure-la-run-history-read-secret
    emits: CanReadSecret
    description: "Read run-history expression traces containing secrets (API keys, connection strings, tokens) via listExpressionTraces/action."
    match_effective_permission:
      action: "Microsoft.Logic/workflows/runs/actions/listExpressionTraces/action"
      scope_type: "resource|resourceGroup|subscription"
    where:
      - "?principal also holds Microsoft.Logic/workflows/runs/read (to list run-history records)"
    emit:
      source_type: Identity
      target_type: Secret
      source: "<principal>"
      target: "<secrets exposed in workflow run-history expression traces (Secret/Credential node)>"
      permissions:
        - "Microsoft.Logic/workflows/runs/read"
        - "Microsoft.Logic/workflows/runs/actions/listExpressionTraces/action"
      conditions: []
      state_logic: >-
        ACTIVE when the principal holds both runs/read and listExpressionTraces/action
        on the Logic App workflow scope. Run history contains evaluated inputs/outputs
        of workflow actions; if a workflow passes a secret through a variable or HTTP
        response body, the trace data exposes it. CONDITIONAL if run history is
        archived or purged (retention period).
      confidence: 0.85
      derived_from:
        - "<ContainsSecret edge: <run-history node> -> ?secret> (from explicit rule azure-la-run-history-expression-traces)"
      false_positive_note: >-
        Requires both Microsoft.Logic/workflows/runs/read (to list runs) and
        listExpressionTraces/action (to read trace data). Run history retention is
        limited (typically 30 days by default) — older secrets expire from the store.
        Emit only when a run with secret-bearing traces is confirmed extant.
      narrative: >-
        {principal.name} can read Logic App {target.name} run-history expression traces
        (Microsoft.Logic/workflows/runs/actions/listExpressionTraces/action), exposing
        secrets (API keys, connection strings, OAuth tokens) passed through workflow
        variables or HTTP action outputs.

  # ===========================================================================
  # 13. Start a disabled Logic App (completes CONDITIONAL execution paths)
  # ===========================================================================

  - id: azure-la-start
    emits: CanStart
    description: "Enable a disabled Logic App workflow to realize CONDITIONAL execution edges."
    match_effective_permission:
      action: "Microsoft.Logic/workflows/enable/action"
      scope_type: "resource|resourceGroup|subscription"
    emit:
      source_type: Identity
      target_type: Compute
      source: "<principal>"
      target: "<Logic App workflow>"
      permissions:
        - "Microsoft.Logic/workflows/enable/action"
      conditions: []
      state_logic: >-
        ACTIVE when the effective permission is confirmed. Needed to realize any
        CONDITIONAL(service_state) execution edge on a Disabled workflow. Logic App
        Operator role includes enable/disable/action without workflows/write — this
        CanStart edge can exist without CanModifyCode.
      confidence: 0.98
      derived_from:
        - "effective permission: Microsoft.Logic/workflows/enable/action"
      false_positive_note: >-
        Logic App Operator (Microsoft.Logic/workflows/read + enable/disable + trigger/run)
        grants enable/action without granting workflows/write. The CanStart capability
        is not escalation by itself; it completes CONDITIONAL(service_state) edges
        (e.g., execution paths that require the workflow to be Enabled). Do not derive
        CanModifyCode from Operator role.
      narrative: >-
        {principal.name} can enable disabled Logic App {target.name}
        (Microsoft.Logic/workflows/enable/action), realizing any execution edges that
        are currently CONDITIONAL(service_state).


  # ===========================================================================
  # 14. Recurrence trigger as schedule (persistence primitive)
  # ===========================================================================

  - id: azure-la-recurrence-schedule
    emits: CanSchedule
    description: "A Logic App with a Recurrence trigger fires autonomously on a cadence — creating/modifying it with workflows/write is schedule creation."
    match:
      - [ ?principal, CanModifyCode, ?workflow ]
    where:
      - "node_type(?workflow) == Workflow"
      - "?principal can set a Recurrence trigger in the workflow definition via Microsoft.Logic/workflows/write"
    emit:
      source_type: Identity
      target_type: Workflow
      source: "<principal>"
      target: "<Logic App workflow (as a Scheduler/schedule target)>"
      permissions:
        - "Microsoft.Logic/workflows/write"
      conditions: [role_compatibility, iam_permission]
      state_logic: >-
        ACTIVE when the principal can write the definition AND the workflow has a
        managed identity (the schedule fires AS the MI — persistence). CONDITIONAL
        (role_compatibility) if the MI attachment is not yet confirmed. messaging-chains
        messaging-schedule-persists-executes-as (rule 3) fires on this CanSchedule +
        CanPassIdentity to produce CanExecuteAs(principal -> MI); cite, do not
        re-derive.
      confidence: 0.88
      derived_from:
        - "<CanModifyCode edge: ?principal -> ?workflow (from azure-la-workflow-write-modifycode)>"
      false_positive_note: >-
        This CanSchedule edge represents the CREATION of a recurring execution
        schedule (the Recurrence trigger). It is only security-relevant when the
        workflow has a managed identity — a recurrence-triggered workflow with no MI
        and no downstream credential access is low value. Requires CanPassIdentity
        on the MI (workflows/write alone enables system-assigned MI but yields no
        RBAC; user-assigned MI requires assign/action). messaging-chains rule 3 owns
        the CanSchedule + CanPassIdentity => CanExecuteAs collapse — cite, do not
        re-derive here.
      narrative: >-
        {principal.name} can write a Recurrence trigger into the definition of Logic
        App {target.name} (Microsoft.Logic/workflows/write), creating a persistent
        schedule that fires the workflow autonomously as its managed identity.

  # ===========================================================================
  # 14. Internet exposure via public HTTP trigger
  # ===========================================================================

  - id: azure-la-http-trigger-internet-exposed
    emits: ExposedToInternet
    description: "A Logic App with a public HTTP (Request) trigger and no IP allowlist is triggerable from the internet."
    match:
      - [ ?workflow, ExecutesAs, ?mi ]
    where:
      - "node_type(?workflow) == Workflow"
      - "workflow has a trigger of type Request (HTTP)"
      - "workflow is Enabled"
      - "accessControl.triggers.allowedCallerIpAddresses is absent or empty (no IP restriction)"
    emit:
      source_type: Messaging
      target_type: AnonymousIdentity
      source: "<Logic App workflow>"
      target: "<AnonymousIdentity>"
      permissions: []
      conditions: [network_reachability]
      state_logic: >-
        CONDITIONAL(network_reachability): the HTTP trigger is publicly reachable but
        still requires the SAS callback URL (not truly anonymous — the URL is a
        bearer secret). ACTIVE only if the callback URL is widely known or embedded in
        public documentation/code. In practice emit CONDITIONAL(network_reachability)
        for all HTTP triggers without IP allowlist; upgrade to ACTIVE if evidence
        shows the URL is publicly known.
      confidence: 0.80
      derived_from:
        - "<ExecutesAs edge: ?workflow -> ?mi>"
        - "trigger type == Request in workflow definition"
      false_positive_note: >-
        The HTTP trigger callback URL contains a SAS signature — it is NOT a fully
        anonymous endpoint. Any actor with the URL can trigger the workflow, but the
        URL must first be obtained (via listCallbackUrl/action, from run history, or
        from public disclosure). Emit CONDITIONAL(network_reachability) not ACTIVE
        unless the URL is confirmed publicly known. An IP allowlist
        (accessControl.triggers.allowedCallerIpAddresses) restricts triggering to
        named IPs/ranges — condition network_reachability for allowlisted triggers.
        A Disabled workflow does not respond to HTTP triggers.
      narrative: >-
        Logic App {workflow.name} exposes a public HTTP trigger (Request trigger +
        no IP allowlist) triggerable by any actor with the SAS callback URL, potentially
        driving its managed identity {mi.name} from the internet.

  # ===========================================================================
  # 15. Cross-tenant API connection trust (distinct Entra tenant)
  # ===========================================================================

  - id: azure-la-connection-cross-tenant
    emits: CrossTenantTrust
    description: "An API connection referencing a resource in a different Entra tenant represents cross-tenant credential trust."
    match:
      - [ ?connection, ContainsSecret, ?cred ]
    where:
      - "?connection is a Microsoft.Web/connections resource (node_class == Messaging)"
      - "the backend resource the connection authenticates to is in a DIFFERENT Entra tenant than the Logic App"
      - "backend_tenant != logic_app_tenant"
    emit:
      source_type: ApplicationIdentity
      target_type: Tenant
      source: "<API connection resource (modeled as the ApplicationIdentity backing the Entra app registration used by the connection)>"
      target: "<Entra tenant of the backend resource>"
      permissions: []
      conditions: [resource_policy, condition_expression]
      state_logic: >-
        ACTIVE when the connection is confirmed to authenticate to a resource in
        a DIFFERENT Entra tenant and the stored credential has not expired.
        CONDITIONAL(condition_expression) when the connection uses a managed identity
        (cross-tenant MI: only possible with user-assigned MI configured for
        cross-tenant federation). BLOCKED if a deny assignment prevents the
        connection from being used.
      confidence: 0.75
      derived_from:
        - "<ContainsSecret edge: ?connection -> ?cred>"
      false_positive_note: >-
        This rule emits only for CROSS-TENANT connections (backend in a different
        Entra tenant). Same-tenant cross-subscription connections do NOT emit
        CrossTenantTrust — see azure-la-connection-cross-subscription. The edge
        asserts only the TRUST (the credential spans the tenant boundary) — the
        CanEnterTenant consequence is can-control's responsibility; do NOT
        re-derive CanEnterTenant here. For cross-tenant connections via OAuth (rare),
        the token is scoped to the specific resource — downgrade to CONDITIONAL if
        the OAuth scope is narrow.
      narrative: >-
        API connection {connection.name} stores a credential authenticating to a
        resource in a different Entra tenant; access to this connection key crosses
        the tenant boundary (can-control rolls up to CanEnterTenant).

  # ===========================================================================
  # 16. Cross-subscription API connection (same-tenant)
  # ===========================================================================

  - id: azure-la-connection-cross-subscription
    emits: ExposedToAccount
    description: "An API connection referencing a resource in a different subscription (same tenant) represents cross-subscription exposure."
    match:
      - [ ?connection, ContainsSecret, ?cred ]
    where:
      - "?connection is a Microsoft.Web/connections resource (node_class == Messaging)"
      - "the backend resource is in a DIFFERENT subscription than the Logic App"
      - "backend_subscription != logic_app_subscription"
      - "backend_tenant == logic_app_tenant (same Entra tenant)"
    emit:
      source_type: Messaging
      target_type: Subscription
      source: "<API connection resource>"
      target: "<subscription containing the backend resource>"
      permissions: []
      conditions: [resource_policy]
      state_logic: >-
        ACTIVE when the connection is confirmed to authenticate to a resource in
        another subscription and the credential has not expired.
        CONDITIONAL(resource_policy) if the backend subscription has an org policy
        or deny assignment restricting cross-subscription access.
      confidence: 0.80
      derived_from:
        - "<ContainsSecret edge: ?connection -> ?cred>"
      false_positive_note: >-
        Cross-subscription same-tenant connections are common and often intentional.
        This edge models the exposure of the credential across a subscription boundary,
        not a threat in isolation. Pair with CanReadSecret to assess risk.
        can-control may derive CanEnterSubscription if the principal reads the
        credential and uses it to access the remote subscription.
      narrative: >-
        API connection {connection.name} stores a credential authenticating to a
        resource in another Azure subscription (same Entra tenant), exposing
        cross-subscription access for the Logic App's execution identity.

  # ===========================================================================
  # DERIVED ESCALATION (CanExecuteAs) — CITED, NOT RE-DERIVED
  # ===========================================================================
  # The following CanExecuteAs derivations are owned by the linchpins and
  # produced automatically from the facts above:
  #
  # (A) Definition modification + MI + trigger:
  #   azure-la-workflow-write-modifycode -> CanModifyCode(?p, ?workflow)
  #   + ExecutesAs(?workflow, ?mi)  [explicit]
  #   => can-execute-as execute-as-via-code-modify:
  #      CanExecuteAs(?p, ?mi) ACTIVE (if trigger) or CONDITIONAL(trigger_exists)
  #
  # (B) Event-source trigger + MI:
  #   azure-la-trigger-binding -> CanTrigger(?source, ?workflow)
  #   + CanWriteData(?p, ?source)   [from Service Bus / Event Grid / etc. adapter]
  #   => messaging-chains messaging-publish-triggers-consumer:
  #      CanTrigger(?p, ?workflow)
  #   + ExecutesAs(?workflow, ?mi)  [explicit]
  #   => messaging-chains messaging-trigger-executes-as:
  #      CanExecuteAs(?p, ?mi) CONDITIONAL(trigger_exists)
  #
  # (C) HTTP trigger invoke + MI:
  #   azure-la-http-trigger-invoke -> CanInvoke(?p, ?workflow)
  #   + ExecutesAs(?workflow, ?mi)  [explicit]
  #   => can-execute-as execute-as-via-code-modify (trigger optional met):
  #      CanExecuteAs(?p, ?mi) ACTIVE (invoke path confirmed)
  #
  # (D) Recurrence schedule + MI + pass:
  #   azure-la-recurrence-schedule -> CanSchedule(?p, ?workflow)
  #   + CanPassIdentity(?p, ?mi)    [from azure-la-attach-user-mi or workflows/write]
  #   => messaging-chains messaging-schedule-persists-executes-as:
  #      CanExecuteAs(?p, ?mi) ACTIVE (fires on cadence — persistence)
  #
  # (E) Config identity swap (Standard):
  #   azure-la-std-config-write -> CanModifyConfiguration(?p, ?workflow)
  #   + CanPassIdentity(?p, ?mi)
  #   => can-execute-as execute-as-via-config-identity-swap:
  #      CanExecuteAs(?p, ?mi) ACTIVE
  #
  # These are NOT re-derived in this file. Each service FACT (CanModifyCode,
  # CanTrigger, CanSchedule, CanInvoke, ExecutesAs) is emitted above; the
  # linchpins own the collapse. Cite derived_from in this file's rules only.
  # ===========================================================================

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#  - A deny assignment covering Microsoft.Logic/workflows/write -> BLOCKED on
#    CanModifyCode / CanAdminister. Deny assignments are evaluated before role
#    assignments in Azure RBAC.
#  - A deny assignment covering Microsoft.Web/connections/listConnectionKeys/action
#    -> BLOCKED on azure-la-list-connection-keys.
#  - A workflow in Disabled state -> all trigger bindings are
#    CONDITIONAL(service_state); realize with azure-la-start (enable/action).
#  - A failed/expired trigger connection (OAuth token, API key) -> event-source trigger
#    bindings emitted by explicit rules are CONDITIONAL(trigger_exists) not ACTIVE.
#  - IP allowlist on HTTP trigger (accessControl.triggers.allowedCallerIpAddresses)
#    -> azure-la-http-trigger-internet-exposed is CONDITIONAL(network_reachability),
#    not ExposedToInternet from arbitrary IPs.
#  - Access key regeneration -> existing callback URLs are immediately invalidated;
#    downgrade azure-la-callback-url / azure-la-http-trigger-invoke to POTENTIAL
#    if rotation is confirmed post-issuance.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Explicit normalization rules (raw config -> explicit edges).
# These belong in /rules/explicit/azure-logicapps.yaml; noted here for
# completeness. They emit the ExecutesAs / ContainsCredential / CanTrigger
# binding facts that the derived rules above consume.
# ---------------------------------------------------------------------------
explicit_rules:

  - id: azure-la-executes-as-mi
    emits: ExecutesAs
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Logic/workflows"
      field: "identity"
    where:
      - "identity.type in [SystemAssigned, UserAssigned, 'SystemAssigned, UserAssigned']"
    emit:
      source_type: Compute
      target_type: Identity
      source: "<Logic App workflow>"
      target: "<each MI: system-assigned SP (principalId) and every userAssignedIdentities key>"
      api_source: "az rest --method GET --url .../providers/Microsoft.Logic/workflows/<name>"
      evidence_field: "identity.principalId / identity.userAssignedIdentities"
      narrative: "{workflow.name} runs as managed identity {mi.name}."

  - id: azure-la-connection-contains-credential
    emits: ContainsSecret
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Web/connections"
      field: "properties.api"
    where:
      - "connection is authenticated (statuses[].status == 'Connected')"
    emit:
      source_type: Messaging
      target_type: "*"
      source: "<API connection>"
      target: "<Credential/ConnectionString node for the embedded key/token>"
      api_source: "az rest --method GET --url .../providers/Microsoft.Web/connections"
      evidence_field: "properties.api.name (connector type)"
      narrative: "API connection {connection.name} ({connector.name}) stores an embedded credential (key/token)."

  - id: azure-la-trigger-event-source-binding
    emits: CanTrigger
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Logic/workflows"
      field: "definition.triggers"
    where:
      - "trigger.type in [ApiConnection, ApiConnectionWebhook]"
      - "trigger references a messaging/storage source via inputs.host.connection.referenceName"
    emit:
      source_type: Messaging
      target_type: Compute
      source: "<messaging/storage source referenced in the trigger connection>"
      target: "<Logic App workflow>"
      api_source: "az rest --method GET --url .../providers/Microsoft.Logic/workflows/<name>"
      evidence_field: "definition.triggers[*].inputs.host.connection.referenceName"
      narrative: "{source.name} triggers Logic App {workflow.name} via an ApiConnection trigger binding."

  - id: azure-la-http-trigger-has-callback
    emits: ContainsSecret
    applies_to: [azure]
    source_config:
      resource_type: "Microsoft.Logic/workflows"
      field: "definition.triggers"
    where:
      - "trigger.type == Request (HTTP trigger)"
      - "workflow.state == Enabled"
    emit:
      source_type: Messaging
      target_type: "*"
      source: "<Logic App workflow>"
      target: "<HTTP trigger callback URL (APIKey node)>"
      api_source: "az rest --method GET --url .../providers/Microsoft.Logic/workflows/<name>"
      evidence_field: "definition.triggers[*].type == 'Request'"
      narrative: "Logic App {workflow.name} has an HTTP trigger exposing a SAS-signed callback URL (APIKey)."
