# Azure AI Search (Microsoft.Search/searchServices) — derived attack-path rules (Phase 11)
# ---------------------------------------------------------------------------
# PHASE-11 SERVICE ADAPTER: Azure AI Search (formerly Cognitive Search) is a
# LOW-RELEVANCE service for the attack-path model. It has NO attacker-injectable
# code execution path: indexers run server-side under Microsoft-managed
# infrastructure; callers cannot inject code that executes as the service MI.
# There is therefore NO CanExecuteAs derivation and NO linchpin citation from
# can-execute-as.yaml or cicd-chains.yaml.
#
# THE TWO ATTACK PATHS MODELED HERE (verified against Microsoft.Search
# resource-provider operations reference and Azure AI Search documentation,
# learn.microsoft.com/azure/search/, 2026-09):
#
#   (1) ADMIN KEY EXPOSURE (primary escalation primitive):
#       Microsoft.Search/searchServices/listAdminKeys/action (granted to
#       Search Service Contributor, Contributor, Owner) returns the service's
#       primary and secondary admin API keys. Admin keys grant full data-plane
#       control: read/write all indexes, manage indexers and data sources, and
#       issue any query. This is modeled as ExposesCredential (the service
#       exposes an APIKey credential) that CredentialsFor the search service
#       data-plane — which in turn enables CanReadData on all indexes.
#       The admin key is also usable to query keys (listQueryKeys via admin),
#       but the dominant impact is full data-plane read/write, so CanReadData
#       is the derived target.
#
#   (2) QUERY KEY EXPOSURE (read-only data access):
#       Microsoft.Search/searchServices/listQueryKeys/action (granted to
#       Search Service Contributor, Contributor, Owner) returns one or more
#       read-only query keys. A query key authenticates search, suggest, and
#       autocomplete requests against all indexes in the service, giving read
#       access to all indexed documents. Modeled as ExposesCredential (service
#       → APIKey) + CanReadData (principal → index Data node via the query key).
#
# WHAT IS DELIBERATELY OUT OF SCOPE:
#   - No CanExecuteAs: the service MI is used by indexers for data-source
#     connectivity only; callers cannot inject code that runs as the MI.
#   - No CanModifyCode / CanModifyConfiguration escalation to CanExecuteAs:
#     there is no attacker-reachable code path on the service MI.
#   - No CanPassIdentity: user-assigned MI attachment changes indexer data-source
#     identity (a data access issue), not a code-execution identity pivot.
#   - No CanExfiltrate rule: data read via search API is query-response-limited;
#     there is no UNLOAD/EXPORT equivalent moving bulk data to external storage.
#
# IMPORTANT STATE GATE — disableLocalAuth:
#   If searchService.properties.disableLocalAuth == true, admin and query keys
#   are disabled server-side and cannot authenticate. Do NOT emit ExposesCredential
#   for key material when this flag is true. Both rules carry this gate in
#   their where-clause.
#
# NETWORK GATE:
#   listAdminKeys and listQueryKeys are ARM control-plane calls — reachable from
#   any network that can reach ARM (management.azure.com). The EXTRACTED key,
#   however, authenticates against the data-plane endpoint
#   (https://<service>.search.windows.net), which may be blocked by a private
#   endpoint configuration (publicNetworkAccess: Disabled). Model key extraction
#   as ACTIVE; data-plane use of the key as CONDITIONAL(network_reachability) when
#   publicNetworkAccess is Disabled.
#
# LINCHPINS: none. This service emits terminal ExposesCredential + CanReadData
# facts; no multi-hop CanExecuteAs roll-up is produced. For the credential-chain
# roll-up (ExposesCredential → CanReadData → CanExfiltrate), consult the
# provider-agnostic credential-chains.yaml — but NOTE that CanReadData from a
# query key on a search index does NOT chain further into CanExecuteAs since
# the service has no code-execution exposure.
#
# All operation strings are exact names from the Microsoft.Search resource-provider
# operations reference. No hallucinated permissions.
# ---------------------------------------------------------------------------

provider: azure
phase: 11-data-analytics-ml
applies_to: [azure]

rules:

  # ===========================================================================
  # 1. Admin key listing — ExposesCredential (highest-impact path)
  # ===========================================================================

  - id: azure-cognitivesearch-list-admin-keys
    emits: ExposesCredential
    description: >-
      The search service exposes its primary and secondary admin API keys
      (discoverable via listAdminKeys/action by principals holding Search Service
      Contributor, Contributor, or Owner roles). Admin keys grant full data-plane
      control of the search service (all indexes, indexers, data sources, and queries).
    match:
      - [ ?service, ?, ?adminkey ]
    where:
      - "node_class(?service) == Data and node_type(?service) == SearchService"
      - "?service.provider_type == 'Microsoft.Search/searchServices'"
      - "node_class(?adminkey) == Secret and node_type(?adminkey) == APIKey"
      - "?adminkey.properties.scope == 'admin' OR tag(?adminkey, 'key-type') == 'admin'"
      - "?service.properties.disableLocalAuth != true  # keys are disabled when disableLocalAuth is true; do not emit if flag is set"
    emit:
      source_type: Data
      target_type: Secret
      source: ?service
      target: ?adminkey
      permissions:
        - "Microsoft.Search/searchServices/listAdminKeys/action"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?service exists, ?adminkey is materialized from listAdminKeys API
        response, and disableLocalAuth == false. BLOCKED if disableLocalAuth == true
        (keys are server-side disabled). CONDITIONAL(service_state) if service state is
        unknown or disableLocalAuth is unknown/unresolved. Treat disableLocalAuth absent
        or null as equivalent to false (Azure default: keys enabled). This edge models
        the service exposing its admin key credential — it does not depend on network
        reachability (ARM plane is reachable from any network that can reach
        management.azure.com).
      confidence: 0.93
      derived_from:
        - "Collector normalization: Microsoft.Search/searchServices/listAdminKeys/action → APIKey node"
        - "?service.properties.disableLocalAuth == false (or not set, per Azure default)"
      false_positive_note: >-
        CRITICAL gate: if ?service.properties.disableLocalAuth == true, admin keys
        are inactive and cannot authenticate to the data plane — do NOT emit. Do not
        emit if ?adminkey.properties.scope != 'admin' or the key is inferred rather
        than explicitly materialized.
      narrative: >-
        Search service {service.name} exposes admin API keys (primary and secondary)
        via the listAdminKeys action. Any principal holding Microsoft.Search/searchServices/listAdminKeys/action
        (granted by Search Service Contributor, Contributor, or Owner) can retrieve
        these keys. Admin keys grant full data-plane control: read all indexed documents,
        create/delete/update indexes, manage indexers and data sources, and generate
        query keys — all without Entra authentication. This is the highest-privilege
        data-plane credential for the service.

  # ===========================================================================
  # 1b. Query key listing — ExposesCredential (read-only data access)
  # ===========================================================================

  - id: azure-cognitivesearch-list-query-keys
    emits: ExposesCredential
    description: >-
      The search service exposes one or more query API keys (discoverable via
      listQueryKeys/action by principals holding Search Service Contributor,
      Contributor, or Owner roles). Query keys grant read-only data-plane access
      (search, suggest, autocomplete queries against all indexes).
    match:
      - [ ?service, ?, ?querykey ]
    where:
      - "node_class(?service) == Data and node_type(?service) == SearchService"
      - "?service.provider_type == 'Microsoft.Search/searchServices'"
      - "node_class(?querykey) == Secret and node_type(?querykey) == APIKey"
      - "?querykey.properties.scope == 'query' OR tag(?querykey, 'key-type') == 'query'"
      - "?service.properties.disableLocalAuth != true  # keys are disabled when disableLocalAuth is true; do not emit if flag is set"
    emit:
      source_type: Data
      target_type: Secret
      source: ?service
      target: ?querykey
      permissions:
        - "Microsoft.Search/searchServices/listQueryKeys/action"
      conditions: [iam_permission]
      state_logic: >-
        ACTIVE when ?service exists, ?querykey is materialized from listQueryKeys API
        response, and disableLocalAuth == false. BLOCKED if disableLocalAuth == true
        (keys are server-side disabled). CONDITIONAL(service_state) if service state is
        unknown or disableLocalAuth is unknown/unresolved. Treat disableLocalAuth absent
        or null as equivalent to false (Azure default: keys enabled). This edge models
        the service exposing its query key credential — it does not depend on network
        reachability (ARM plane is reachable from any network that can reach
        management.azure.com).
      confidence: 0.88
      derived_from:
        - "Collector normalization: Microsoft.Search/searchServices/listQueryKeys/action → APIKey node"
        - "?service.properties.disableLocalAuth == false (or not set, per Azure default)"
      false_positive_note: >-
        CRITICAL gate: if ?service.properties.disableLocalAuth == true, query keys
        are inactive and cannot authenticate to the data plane — do NOT emit. Do not
        emit if ?querykey.properties.scope != 'query' or the key is inferred rather
        than explicitly materialized. Query keys are read-only and do not grant index
        management or document write permissions — but both admin and query key holders
        can read all indexed documents (CanReadData).
      narrative: >-
        Search service {service.name} exposes query API keys via the listQueryKeys action.
        Any principal holding Microsoft.Search/searchServices/listQueryKeys/action
        (granted by Search Service Contributor, Contributor, or Owner) can retrieve
        these keys. Query keys grant read-only data-plane access: search, suggest, and
        autocomplete queries against all indexes, reading the full content of matching
        documents. Indexed documents may contain PII, secrets, or other sensitive data
        ingested from connected data sources.

  # ===========================================================================
  # 2. Index query via admin or query key — CanReadData
  # ===========================================================================

  - id: azure-cognitivesearch-query-index-via-key
    emits: CanReadData
    description: >-
      A principal that can obtain an admin or query key (via ExposesCredential) can
      issue search, suggest, and autocomplete queries against all indexes in the service,
      reading the full content of matching indexed documents.
    match:
      - [ ?service, ExposesCredential, ?apikey ]
      - [ ?principal, HasPermission,   ?service ]
    where:
      - "node_class(?service) == Data and node_type(?service) == SearchService"
      - "?service.provider_type == 'Microsoft.Search/searchServices'"
      - "node_class(?apikey) == Secret and node_type(?apikey) == APIKey"
      - "(?apikey.properties.scope == 'admin' OR tag(?apikey, 'key-type') == 'admin') OR (?apikey.properties.scope == 'query' OR tag(?apikey, 'key-type') == 'query')"
      - "?principal has EFFECTIVE Microsoft.Search/searchServices/listAdminKeys/action OR Microsoft.Search/searchServices/listQueryKeys/action at ?service scope (Search Service Contributor 7ca78c08-252a-4471-8644-bb5ff32d4ba0, Contributor, Owner, or a custom role granting either action)"
      - "?service.properties.disableLocalAuth != true  # keys are disabled when disableLocalAuth is true"
      - "?apikey was produced by azure-cognitivesearch-list-admin-keys or azure-cognitivesearch-list-query-keys"
    emit:
      source_type: Identity
      target_type: Data
      source: ?principal
      target: "<all indexes (Data nodes) within ?service>"
      permissions:
        - "Microsoft.Search/searchServices/listAdminKeys/action"
        - "Microsoft.Search/searchServices/listQueryKeys/action"
      conditions: [iam_permission, network_reachability]
      state_logic: >-
        ACTIVE when ?principal can obtain a key (listAdminKeys or listQueryKeys) AND
        disableLocalAuth != true AND the search service data-plane endpoint is
        network-reachable (publicNetworkAccess not Disabled, OR principal has network
        access via private endpoint). CONDITIONAL(network_reachability) when
        publicNetworkAccess is Disabled — the ARM-plane key extraction remains possible
        but the extracted key cannot be used against the data-plane endpoint from
        outside the private network. BLOCKED if a deny assignment covers the listing
        action OR if disableLocalAuth == true. CONDITIONAL(service_state) if
        disableLocalAuth is unknown/unresolved.
      confidence: 0.88
      derived_from:
        - "ExposesCredential: ?service -> ?apikey (azure-cognitivesearch-list-admin-keys or azure-cognitivesearch-list-query-keys)"
        - "HasPermission: listAdminKeys/action or listQueryKeys/action at ?service scope"
        - "?service.properties.publicNetworkAccess and ?service.properties.disableLocalAuth"
      false_positive_note: >-
        Gate on BOTH disableLocalAuth and network reachability:
        (a) disableLocalAuth == true: keys are disabled — CanReadData via key is not
        achievable regardless of network; emit BLOCKED or do not emit.
        (b) publicNetworkAccess == Disabled and no confirmed private-network foothold:
        the extracted key cannot reach the data-plane endpoint — emit
        CONDITIONAL(network_reachability). Do NOT conflate ARM-plane reachability
        (listAdminKeys) with data-plane endpoint reachability (https://*.search.windows.net).
        Query keys are read-only (search/suggest/autocomplete); admin keys additionally
        allow index management and document writes — but both yield CanReadData on the
        index content for attack-path purposes (read is the dominant sensitivity).
        A principal holding only Search Index Data Reader RBAC (Entra) does NOT need
        a key and reaches this edge via a separate RBAC-based path; that path emits
        CanReadData directly without ExposesCredential (see azure-cognitivesearch-rbac-data-read).
      narrative: >-
        {principal.name} can obtain an API key for search service {service.name}
        (listAdminKeys or listQueryKeys) and use it to query all indexes, reading the
        full content of matching indexed documents. Indexed documents may contain PII,
        sensitive business data, secrets, or other high-value information ingested from
        connected data sources (Azure Storage, Cosmos DB, SQL, SharePoint).

  # ===========================================================================
  # 2b. Index query via RBAC (Search Index Data Reader/Contributor) — CanReadData
  # ===========================================================================

  - id: azure-cognitivesearch-rbac-data-read
    emits: CanReadData
    description: >-
      A principal with Search Index Data Reader or Search Index Data Contributor RBAC
      (Entra role) can query the search service indexes via Entra-authenticated access,
      without requiring API keys. This path bypasses the disableLocalAuth gate and
      credential extraction entirely.
    match:
      - [ ?principal, HasPermission, ?service ]
    where:
      - "node_class(?service) == Data and node_type(?service) == SearchService"
      - "?service.provider_type == 'Microsoft.Search/searchServices'"
      - "?principal has EFFECTIVE Microsoft.Search/searchServices/indexes/docs/search/action OR Microsoft.Search/searchServices/indexes/docs/*/action at ?service scope (granted by Search Index Data Reader 1407120a-92aa-4202-b7e9-c0e197c71c8f or Search Index Data Contributor 8ebe5a00-799e-43f5-93ac-243d3dce84a7)"
    emit:
      source_type: Identity
      target_type: Data
      source: ?principal
      target: "<all indexes (Data nodes) within ?service>"
      permissions:
        - "Microsoft.Search/searchServices/indexes/docs/search/action"
        - "Microsoft.Search/searchServices/indexes/docs/*/action"
      conditions: [iam_permission, network_reachability]
      state_logic: >-
        ACTIVE when ?principal has effective indexes/docs/search/action (or wildcard)
        AND the search service data-plane endpoint is network-reachable
        (publicNetworkAccess not Disabled, OR principal has network access via private
        endpoint). CONDITIONAL(network_reachability) when publicNetworkAccess is Disabled
        — Entra-authenticated queries require network reach to the data-plane endpoint
        (https://<service>.search.windows.net). BLOCKED if a deny assignment covers the
        action at the effective scope. No disableLocalAuth gate applies — RBAC paths
        bypass key-based auth entirely.
      confidence: 0.87
      derived_from:
        - "RBAC effective permission: Microsoft.Search/searchServices/indexes/docs/search/action (or wildcard)"
        - "Granted by Search Index Data Reader or Search Index Data Contributor built-in role"
        - "?service.properties.publicNetworkAccess"
      false_positive_note: >-
        This path does NOT depend on disableLocalAuth — Entra RBAC authentication
        operates independently of key-based auth settings. Do not emit if disableLocalAuth
        is the only gate; network reachability is the primary condition. Search Index
        Data Reader is read-only (search/suggest/autocomplete); Search Index Data
        Contributor allows both read and write — but both yield CanReadData for the
        attack path. Do not conflate with admin-key holders, which have full service
        control.
      narrative: >-
        {principal.name} holds Microsoft.Search/searchServices/indexes/docs/search/action
        on search service {service.name} (via Search Index Data Reader or Contributor
        role) and can query all indexes using Entra-authenticated access (no API key
        required). This bypasses any key-based access controls and allows reading the
        full content of all indexed documents. Indexed documents may contain PII,
        sensitive business data, secrets, or other high-value information ingested from
        connected data sources.

# ---------------------------------------------------------------------------
# BLOCKED-edge guidance:
#   - A deny assignment or deny Azure Policy covering
#     Microsoft.Search/searchServices/listAdminKeys/action or
#     Microsoft.Search/searchServices/listQueryKeys/action at the service,
#     resource-group, or subscription scope -> emit the ExposesCredential /
#     CanReadData edge with state: BLOCKED and denied_by=<deny assignment id>.
#   - ?service.properties.disableLocalAuth == true -> both rules produce no
#     ACTIVE or CONDITIONAL edge; emit BLOCKED or suppress entirely.
#   - ?service.properties.publicNetworkAccess == 'Disabled' (private endpoint
#     enforced) -> CanReadData carries CONDITIONAL(network_reachability) for
#     the data-plane use of the extracted key; the ExposesCredential (ARM key
#     listing) remains ACTIVE from any network that reaches ARM.
#   - Service deprovisioned or in a failed state -> BLOCKED.
# ---------------------------------------------------------------------------

# No explicit normalization rules are required for this service beyond the
# standard HasPermission effective-permission evaluator. The ExposesCredential
# and CanReadData edges above fully cover the service's attack surface at the
# 4-rule comprehensive budget for a LOW-RELEVANCE Phase-11 service:
#   - Rule 1 (azure-cognitivesearch-list-admin-keys): admin-key ExposesCredential
#   - Rule 1b (azure-cognitivesearch-list-query-keys): query-key ExposesCredential
#   - Rule 2 (azure-cognitivesearch-query-index-via-key): key-based CanReadData
#   - Rule 2b (azure-cognitivesearch-rbac-data-read): RBAC-based CanReadData
#
# Collector normalization:
#   - Microsoft.Search/searchServices/read -> SearchService node
#   - Microsoft.Search/searchServices/listAdminKeys/action -> APIKey node (admin, tag/properties.scope)
#   - Microsoft.Search/searchServices/listQueryKeys/action -> APIKey node (query, tag/properties.scope)
#   - service.identity.principalId -> ExecutesAs(SearchService -> ManagedIdentity) [explicit]
#   - ARM roleAssignments -> HasPermission facts
#   - service.properties.disableLocalAuth, publicNetworkAccess -> state gates
#   - APIKey nodes must carry properties.scope ('admin' or 'query') or tag('key-type') for Rule 1/1b filtering
